  };
  const alcancaTudo = bloq => !foraDoAlcance(bloq).length;
  /* se as bordas irregulares da caverna cortaram alguma passagem, desfaz a erosão neste mapa */
  /* campo aberto: se arredondar uma clareira cortou a passagem, religa só o caminho mais curto (pelo mapa antes de arredondar) */
  if (aberto) for (let tent=0; tent<60; tent++){
    const fora = foraDoAlcance(new Set()); if (!fora.length) break;
    const alcan = new Uint8Array(W*H), [sx,sy] = cen(rooms[0]), f0=[sy*W+sx]; alcan[f0[0]]=1;
    while(f0.length){ const c=f0.pop(), x=c%W, y=(c-x)/W; for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const i=x+dx, j=y+dy, n=j*W+i; if (at(i,j) && !alcan[n]){ alcan[n]=1; f0.push(n); } } }
    const [tx,ty] = cen(rooms[fora[0]]), alvo = ty*W+tx, pai = new Int32Array(W*H).fill(-2), fila=[];

    for (let q=0; q<fila.length && pai[alvo]===-2; q++){ const c=fila[q], x=c%W, y=(c-x)/W;

    if (pai[alvo]===-2) break;
    for (let n=alvo; n>=0 && !alcan[n]; n=pai[n]) g[n]=g0[n];

  const bloq = new Set();
  /* ...e atalho de verdade: sem a porta, o outro caminho entre os dois lados dela tem que ser bem mais longo */
  const desvio = (dr, bl) => {

    const dist = new Int32Array(W*H).fill(-1), fila=[ay*W+ax]; dist[ay*W+ax]=0;
    for (let q=0;q<fila.length;q++){ const c=fila[q], x=c%W, y=(c-x)/W; if (c===by*W+bx) return dist[c];
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const i=x+dx, j=y+dy, n=j*W+i;
        if (at(i,j) && dist[n]<0 && !bl.has(n)){ dist[n]=dist[c]+1; fila.push(n); } } }

  };

    if (secretas.length){

      rooms = ord.map(i=>rooms[i]);
      conex.forEach(c=>{ c.a=novo[c.a]; c.b=novo[c.b]; });

    }

}

const MON_DG = MON.filter(m=>m.tags!=='x'); /* reserva quando o tema não tem opções: só criaturas de masmorra */
/* reserva do campo aberto: criaturas de ar livre e as dos cenários abertos */
const MON_AB = MON.filter(m=>m.tags.includes('x') || Object.values(TEMAS).some(t=>t.aberto && t.pool.includes(m.en)));
/* homebrew entra no fim da lista (sem homebrew as masmorras saem iguais); "só chefe" só entra quando a lista é para o chefe */
function poolFor(tema, chefe){ const T=TEMAS[tema];
  const base = T.pool ? MON.filter(m=>!m.hb && T.pool.includes(m.en)) : MON.filter(m=>!m.hb && m.tags.includes(T.tag));
  const hb = MON.filter(m=>m.hb && m.temas.includes(tema) && (chefe || !m.soChefe));
  return hb.length ? base.concat(hb) : base; }
function buildEncounter(rng, p, dif, chefe, forcar){
  const per = BUD[p.nivel][dif]; let alvo = per*p.jogadores; if (chefe && p.ritmo==='pesado') alvo=Math.round(alvo*1.25);
  const pool = poolFor(p.tema, chefe), RES = TEMAS[p.tema].aberto ? MON_AB : MON_DG;
  const fits = (list,lo,hi) => list.filter(m=>m.xp<=hi && m.xp>=lo);
  let cand = fits(pool, alvo/(chefe?4:10), alvo*(chefe?.85:1)); if (cand.length<2) cand = fits(RES, alvo/(chefe?4:10), alvo*(chefe?.85:1));
  if (!cand.length) cand = [RES.filter(m=>m.xp<=alvo).sort((a,b)=>b.xp-a.xp)[0] || MON[0]];
  let prim, n;
  if (chefe){ const sorted=[...cand].sort((a,b)=>b.xp-a.xp); prim = forcar || rng.pick(sorted.slice(0,Math.max(1,Math.ceil(sorted.length/3)))); n=1; }
  else { prim = rng.pick(cand); const maxN=Math.max(1,Math.min(8,Math.floor(alvo/prim.xp))); n=Math.max(1,Math.round(maxN*(.6+.4*rng.f()))); }
  const grupos=[{pt:prim.pt,en:prim.en,cr:prim.cr,xp:prim.xp,qtd:n}];
  let resto = alvo - n*prim.xp;
  if (resto >= alvo*.2){
    let c2 = pool.filter(m=>m.xp<=resto && m.pt!==prim.pt && m.xp>=resto/6 && !m.soChefe); if(!c2.length) c2 = RES.filter(m=>m.xp<=resto && m.pt!==prim.pt && m.xp>=resto/6);
    if (c2.length){ const s=rng.pick(c2); const k=Math.max(1,Math.min(6,Math.floor(resto/s.xp))); grupos.push({pt:s.pt,en:s.en,cr:s.cr,xp:s.xp,qtd:k}); }
  }
  const xp = grupos.reduce((t,gp)=>t+gp.xp*gp.qtd,0);
  return {dif, orcamento:alvo, xp, grupos, comport:''};
}

    const t = tierOf(p.nivel), m = d.mapa, W = m.w, ns = m.rooms.length, nsv = ns - (m.secretas||[]).length;
    const ctx = kk => ({det:TDC.det[t-1], sv:TDC.sv[t-1], dano:danoArm(p.nivel,'forte'), leve:danoArm(p.nivel,'leve'), k:kk, n:d.vilao, pouco:''});
    const maxS = Math.max(1, Math.floor(ns/4)); let n = 0;
    rng.shuffle(d.salas.map((_,i)=>i)).forEach(i=>{

      d.salas[i].perigo = perDe(rng.pick(lista), ctx(i+1<nsv ? i+2 : 1)); n++; });

        const c = livres[Math.floor(livres.length/4)], x = c%W, y = (c-x)/W;

function genErrantes(rng, d){
  const out=[]; for(let i=0;i<6;i++){ const e=buildEncounter(rng, d.params, 0, false); out.push(e.grupos.map(gp=>gp.qtd+'× '+gp.pt).join(' e ')+' ('+fmt(e.xp)+' XP)'); }

/* tipos das salas de um andar: a primeira é a chegada, a última comum é o chefe (ou a escada para baixo), depois as secretas */
function tiposAndar(rng, mapa, primeiro, ultimo){
  const ns = mapa.rooms.length, nb = ns - mapa.secretas.length;
  const tipos = [primeiro];
  for(let i=1;i<nb-1;i++) tipos.push(rng.weighted({combate:40, armadilha:13, tesouro:9, vazia:18, misterio:12, descanso:5}));
  tipos.push(ultimo);
  if (nb>=6){
    if (!tipos.includes('tesouro')) tipos[rng.int(1,nb-2)]='tesouro';
    if (!tipos.includes('armadilha')){ let j=rng.int(1,nb-2); if (tipos[j]==='tesouro') j = j===1?2:j-1; tipos[j]='armadilha'; }
  }
  for(let i=nb;i<ns;i++) tipos.push('secreta');
  return tipos;
}
/* masmorra de vários andares: d.andares[k] = {mapa, salas, armCorr}. d.mapa, d.salas e d.armCorr apontam
   para o andar aberto (os mesmos objetos), então o resto do gerador funciona sem mudar. Ao salvar, só vai d.andares. */
function irAndar(d, k){
  if (!d || !d.andares || !d.andares.length) return;
  k = Math.max(0, Math.min(d.andares.length-1, +k||0)); const A = d.andares[k];
  d.andar = k; d.mapa = A.mapa; d.salas = A.salas; d.armCorr = A.armCorr; d.perCorr = A.perCorr;
  if (d.id) S.andarDe[d.id] = k;
}
function prepar(d){ if (d && d.andares) irAndar(d, d.id && S.andarDe[d.id]!=null ? S.andarDe[d.id] : d.grupoEm ? d.grupoEm.andar : (d.andar||0)); return d; }
function paraSalvar(d){ const c = clone(d); if (c.andares){ delete c.mapa; delete c.salas; delete c.armCorr; delete c.perCorr; delete c.andar; } return c; }
const nAndares = d => d.andares ? d.andares.length : 1;
/* andares mais fundos são mais difíceis: cada andar abaixo do primeiro conta como 1 nível a mais
   para encontros, CDs de armadilhas e portas e tesouro. O nível do grupo (d.params.nivel) não muda. */
const nivelAndar = (nivel, k) => Math.min(20, nivel + (k||0));
function paramsAndar(d){ const k = d && d.andares ? (d.andar||0) : 0; return k ? {...d.params, nivel:nivelAndar(d.params.nivel, k)} : d.params; }

const TRACOS_N = Object.keys(TRACOS), TRACO_CHANCE = .1;
/* grupos que podem ganhar traço: o primeiro grupo do encontro do chefe é o próprio chefe */
const gruposComTraco = (e, chefe) => e ? e.grupos.filter((g,j)=>!(chefe && j===0)) : [];
function sortearTraco(rng, usados){ const livres = TRACOS_N.filter(n=>!usados.has(n)); const n = rng.pick(livres.length ? livres : TRACOS_N); usados.add(n); return n; }
/* masmorra nova: exatamente 10% dos monstros (arredondado), sorteados entre todos os andares */
function aplicarTracos(d, rng){
  const todas = d.andares ? d.andares.flatMap(A=>A.salas) : d.salas, vagas = [];
  todas.forEach(x=>gruposComTraco(x.encontro, x.tipo==='chefe').forEach(g=>{ for (let q=0;q<g.qtd;q++) vagas.push(g); }));
  const n = Math.round(vagas.length*TRACO_CHANCE), usados = new Set();
  rng.shuffle(vagas).slice(0, n).forEach(g=>{ (g.tracos = g.tracos||[]).push(sortearTraco(rng, usados)); });
}
/* encontro gerado de novo: cada monstro (menos o chefe) tem 10% de chance */
function tracosEncontro(rng, e, chefe){
  const usados = new Set();
  gruposComTraco(e, chefe).forEach(g=>{ for (let q=0;q<g.qtd;q++) if (rng.chance(TRACO_CHANCE)) (g.tracos = g.tracos||[]).push(sortearTraco(rng, usados)); });
}
function genDungeon(params){
  const p = {...params, nivel:Math.max(1,Math.min(20,+params.nivel||1)), jogadores:Math.max(1,Math.min(8,+params.jogadores||4))};
  const semente = (p.semente||'').trim() || randSeed();
  const rng = makeRng(semente+'|'+p.tema+'|'+p.tamanho+'|'+p.nivel+'|'+p.jogadores+'|'+p.ritmo);
  const T = TEMAS[p.tema];
  /* andares: o mestre escolhe antes de gerar (campo Andares). Campo aberto tem sempre 1. */
  const nA = T.aberto ? 1 : Math.max(1, Math.min(MAX_ANDARES, Math.floor(+p.andares||1)));
  /* o chefe mora no último andar: escolhido para o desafio daquele andar */
  const chefe = montarChefe(rng, T, buildEncounter(rng, nA>1 ? {...p, nivel:nivelAndar(p.nivel, nA-1)} : p, 2, true).grupos[0].en);
  const cx = ctxChefe(chefe), vilao = chefe.nome;
  const nomeTit = T.titulo==='pessoa' && chefe.tipo==='pessoa' ? vilao : chefe.lugar;
  const mapa = genMap(rng, p.tamanho, p.tema, T.aberto ? null : makeRng(semente+'|secretas|'+p.tamanho+'|'+p.tema));
  const ns = mapa.rooms.length;
  const d = {id:null, nome:(p.nome||'').trim() || fill(rng.pick(T.titulos),{n:nomeTit}), vilao, chefe, gancho:fill(rng.pick(T.ganchos[chefe.tipo==='fera'?'fera':'pessoa']), cx), semente,
    params:{tema:p.tema, tamanho:p.tamanho, nivel:p.nivel, jogadores:p.jogadores, ritmo:p.ritmo, itens:ITEM_QTD[p.itens]?p.itens:'normal', campanha:String(p.campanha||'')}, mapa, salas:[], errantes:[], publicada:false, criada:Date.now(), atualizada:Date.now()};
  if (nA>1){ d.params.andares = nA; d.andar = 0; d.andares = [{mapa:d.mapa, salas:d.salas}]; }
  const gerarSalas = (r, m, primeiro, ultimo) => {
    const tipos = tiposAndar(r, m, primeiro, ultimo), nomes = r.shuffle(T.salas); let ni=0;
    tipos.forEach((tp,i)=>{ d.salas.push(genSala(r, d, i, tp, nomes[(ni++)%nomes.length])); });
  };
  gerarSalas(rng, mapa, 'entrada', nA>1 ? 'descida' : 'chefe');
  for (let k=1; k<nA; k++){ /* cada andar com rng próprio: o 1º andar não muda */
    const rk = makeRng(semente+'|andar|'+k+'|'+p.tema+'|'+p.tamanho+'|'+p.nivel+'|'+p.jogadores+'|'+p.ritmo);
    const mk = genMap(rk, p.tamanho, p.tema, makeRng(semente+'|secretas|'+k+'|'+p.tamanho+'|'+p.tema));
    d.andares.push({mapa:mk, salas:[]}); irAndar(d, k);
    gerarSalas(rk, mk, 'subida', k===nA-1 ? 'chefe' : 'descida');
  }
  if (nA>1) irAndar(d, 0);
  d.errantes = genErrantes(rng, d);
  if (nA>1) d.andares.forEach((A,k)=>{ irAndar(d, k); A.armCorr = genArmCorr(d, makeRng(semente+'|corredores|'+(k?k+'|':'')+p.tamanho+'|'+p.tema)); });
  if (nA>1) irAndar(d, 0);
  else d.armCorr = genArmCorr(d, makeRng(semente+'|corredores|'+p.tamanho+'|'+p.tema)); /* rng próprio: não muda o resto da masmorra */
  aplicarTracos(d, makeRng(semente+'|tracos')); /* rng próprio: não muda o resto da masmorra */
  genPerigos(d, makeRng(semente+'|perigos')); /* idem; só com perigos do Homebrew */

  d.nevoa = true; (d.andares ? d.andares[0].salas : d.salas)[0].revelada = true; d.grupoEm = {andar:0, sala:0};
  return d;
}

/* cópia para os jogadores: sem anotações do mestre e sem armadilhas nem perigos (de sala ou de corredor). Sala do tipo Armadilha aparece como Vazia. */
/* Salas não reveladas vão vazias; monstros e tesouro só se o mestre mostrou (verEnc/verTes); o tipo da sala só aparece na Entrada; textos de Mistério e Pista ficam só com o mestre;
   sem monstros errantes nem ficha do chefe. */
function playerCopy(d){
  const c = paraSalvar(d), fog = c.nevoa===true;
  (c.andares||[c]).forEach(a=>{
    a.salas = a.salas.map((s,i)=>{
      const sec = (a.mapa.secretas||[]).some(x=>x.sala===i);
      if ((fog || sec) && s.revelada!==true) return {tipo:'', nome:'', desc:'', sentido:'', revelada:false};
      delete s.notas; delete s.armadilha; delete s.perigo; delete s.misterio; delete s.pista;
      if (s.tipo==='descida' || s.tipo==='subida') s.escada = s.tipo; /* a escada continua desenhada e com os botões de andar */
      if (s.tipo!=='entrada') s.tipo=''; /* o tipo da sala só aparece na Entrada */
      if (!s.verEnc) delete s.encontro; else if (s.encontro){ delete s.encontro.comport; s.encontro.grupos.forEach(g=>delete g.tracos); }
      if (!s.verTes) delete s.tesouro;
      return s; });
    delete a.armCorr; delete a.perCorr; });
  delete c.armCorr; delete c.perCorr; delete c.errantes; delete c.chefe; delete c.aventura; return c;
}

function makeDbStore(db){
  const chain = {};
  const q = (k,fn) => (chain[k] = (chain[k]||Promise.resolve()).catch(()=>{}).then(fn));
  const toMap = s => { const m={}; s.docs.forEach(x=>{ if (x.exists) m[x.id] = {...clone(x.data()), id:x.id}; }); return m; };
  return {
    onLista(cb, err){ return db.collection('masmorras').onSnapshot(s=>cb(toMap(s)), err); },
    onPublicas(cb, err){ return db.collection('publicas').onSnapshot(s=>cb(toMap(s)), err); },
    save(d){ const {id, ...rest} = clone(d); return q(id, async ()=>{
      await db.doc('masmorras/'+id).set(rest);
      if (d.publicada){ const {id:_, ...pub} = playerCopy(d); await db.doc('publicas/'+id).set(pub); }
      else { await db.doc('publicas/'+id).delete().catch(()=>{}); }
    }); },
    remove(id){ return q(id, async ()=>{ await db.doc('publicas/'+id).delete().catch(()=>{}); await db.doc('masmorras/'+id).delete(); }); },
    onMestres(cb, err){ return db.collection('config').onSnapshot(s=>{ const m = toMap(s).mestres; cb(m && Array.isArray(m.ids) ? m.ids.filter(x=>typeof x==='string') : []); }, err); },
    saveMestres(ids){ return q('config/mestres', ()=>db.doc('config/mestres').set({ids:[...ids]})); },
    /* cada pessoa que abre o app deixa um registro (só o id), para o dono poder escolhê-la como mestre */
    registrar(id){ return db.doc('pessoas/'+id).set({visto:Date.now()}); },
    onPessoas(cb, err){ return db.collection('pessoas').onSnapshot(s=>cb(Object.keys(toMap(s))), err); },
    onMonstros(cb, err){ return db.collection('monstros').onSnapshot(s=>cb(toMap(s)), err); },
    saveMonstro(slug, dados){ return q('mon:'+slug, ()=>db.doc('monstros/'+slug).set(dados)); },
    delMonstro(slug){ return q('mon:'+slug, ()=>db.doc('monstros/'+slug).delete()); },
    onImagens(cb, err){ return db.collection('imagens').onSnapshot(s=>cb(toMap(s)), err); },
    saveImagem(slug, d){ return q('img:'+slug, ()=>db.doc('imagens/'+slug).set(d)); },
    delImagem(slug){ return q('img:'+slug, ()=>db.doc('imagens/'+slug).delete()); }
  };
}

/* campo aberto: vegetação ou rochas em volta, clareiras e trilhas, sem paredes nem portas */
function desenhaAberto(x, c, cssW, cssH, m, at, cor, TX){
  x.fillStyle = cor.fundo; x.fillRect(0,0,cssW,cssH);
  const hs = (i,j) => ((i*73856093) ^ (j*19349663)) >>> 0;
  const perto = (i,j) => { for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) if (at(i+dx,j+dy)) return true; return false; };
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++){
    if (at(i,j)) continue; const k = hs(i,j);
    if (!perto(i,j) && k%3) continue;
    x.fillStyle = cor.blob[k%3]; x.beginPath();
    x.arc((i+.5+((k>>3)%5-2)*.08)*c, (j+.5+((k>>6)%5-2)*.08)*c, c*(.55+((k>>9)%3)*.15), 0, Math.PI*2); x.fill();
  }
  if (TX && TX.borda) texBorda(x, c, m, at, TX.borda);
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++){ const v = at(i,j); if (!v) continue; x.fillStyle = v===2 ? cor.trilha : cor.chao; x.fillRect(i*c, j*c, c+.5, c+.5); }
  if (TX) for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++){ const v = at(i,j); if (v) texCelula(x, c, i, j, TX, v); }
  x.strokeStyle = 'rgba(40,32,20,.14)'; x.lineWidth = 1; x.beginPath();
  if (c >= 5) for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++) if (at(i,j)) x.rect(i*c+.5, j*c+.5, c-1, c-1);
  x.stroke();
  x.strokeStyle = cor.borda; x.lineWidth = Math.max(1, c*.12); x.lineCap='round'; x.beginPath();
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++){
    if (!at(i,j)) continue; const px=i*c, py=j*c;
    if (!at(i,j-1)){ x.moveTo(px,py); x.lineTo(px+c,py); }
    if (!at(i,j+1)){ x.moveTo(px,py+c); x.lineTo(px+c,py+c); }
    if (!at(i-1,j)){ x.moveTo(px,py); x.lineTo(px,py+c); }
    if (!at(i+1,j)){ x.moveTo(px+c,py); x.lineTo(px+c,py+c); }
  }
  x.stroke();
}

  const bmp = await createImageBitmap(src);
  const [l,t,r,b] = Array.isArray(caixa) && caixa.length===4 ? caixa : [0,0,1,1];

async function salvarCap(id, n, dados){ (S.caps[id] ||= {})[n] = dados; if (S.db) await S.db.collection('capitulos').doc(id+'--'+n).set({aventura:id, n, dados}); }

function assinar(){
  const t = setTimeout(() => { if (!S.carregou){ S.avisoDb = 'Ainda não consegui ler as aventuras salvas. Elas aparecem assim que a conexão responder.'; render(); } }, 10000);

const ERROS = {
  not_granted:'O Claude não foi liberado para esta página. Para gerar aventuras, permita o uso do Claude no menu de permissões da Mesa.',
  sampling_disabled:'O Claude não está disponível nesta conta.', rate_limited:'Limite de uso do Claude atingido por agora. Espere um pouco e clique em Continuar.',
  refused:'O Claude recusou esta etapa. Mude a história ou as observações e tente de novo.', invalid_json:'A resposta veio num formato que a página não entendeu. Clique em Continuar para tentar de novo.',
  prompt_too_large:'O texto da história está grande demais. Encurte o resumo.', session_expired:'Sua sessão expirou. Entre de novo no claude.ai e recarregue.',
  empty_completion:'O Claude não respondeu nada nesta etapa. Clique em Continuar para tentar de novo.'
};
const msgErro = e => ERROS[e?.code] || (e?.code === 'cancelled' ? 'Geração parada. O que já ficou pronto está salvo; clique em Continuar para seguir.' : 'Falha de conexão com o Claude (' + (e?.code || e?.message || 'erro') + '). Clique em Continuar para tentar de novo.');
function pedir(prompt, ctl){
  return S.sample.json(prompt, {modelTier:S.form.tier === 'default' ? 'default' : 'complex', cache:false, signal:ctl.signal,
    onText:({text}) => { if (S.ger){ S.ger.chars = text.length; const el = $('#chars'); if (el) el.textContent = fmt(text.length) + ' caracteres recebidos'; } }});
}
function passosFaltando(A){
  const p = [], caps = capsDe(A.id);
  if (!A.plano) p.push({k:'plano', rot:'Plano da aventura'});
  if (!A.fichas) p.push({k:'fichas', rot:'Fichas dos antagonistas (as do Homebrew vêm prontas)'});
  for (let i = 1; i <= A.params.sessoes; i++) if (!caps[i]) p.push({k:'cap', n:i, rot:'Capítulo ' + i});
  return p;
}
async function gerar(id, so){
  if (ocupado()) return;
  const A = S.lista[id]; if (!A || !S.sample) return;
  const passos = so ? [{k:'cap', n:so, rot:'Capítulo ' + so + ' (de novo)'}] : passosFaltando(A);
  if (!passos.length) return;
  S.ger = {id, passos:passos.map(x => ({...x, st:'pend'})), chars:0, ctl:null, erro:'', fim:false};
  render();
  for (const ps of S.ger.passos){
    ps.st = 'run'; S.ger.chars = 0; render();
    const ctl = S.ger.ctl = new AbortController();
    try {
      if (ps.k === 'plano'){ A.plano = normPlano(await pedir(promptPlano(A.params), ctl), A.params); marcarHb(A.plano); A.titulo = A.plano.titulo; await salvarAv(A); }
      else if (ps.k === 'fichas'){
        marcarHb(A.plano); const ants = A.plano.antagonistas, deHb = ants.filter(a => a.hb).map(fichaHb).filter(Boolean), resto = ants.filter(a => !a.hb || !deHb.some(f => f.nome === a.nome));
        A.fichas = [...deHb, ...(resto.length ? normFichas(await pedir(promptFichas(A, resto), ctl)) : [])]; await salvarAv(A); }
      else { const nv = A.plano.capitulos[ps.n-1].nivel; await salvarCap(id, ps.n, normCap(await pedir(promptCapitulo(A, ps.n), ctl), ps.n, nv)); await salvarAv(A); }
      ps.st = 'ok';
    } catch (e){
      ps.st = 'erro'; S.ger.erro = e && e.code ? msgErro(e) : 'Erro ao salvar: ' + (e?.message || e); if (e?.code === 'not_granted') S.iaNegada = true; break;
    }
  }
  S.ger.fim = true; S.ger.ctl = null;
  if (!S.ger.erro) S.msg = so ? 'Capítulo ' + so + ' gerado de novo.' : 'Aventura pronta. Confira as verificações de XP antes de jogar.';
  if (!S.ger.erro) S.ger = null;
  render();
}

  L.push('# ' + P.titulo, '', '## Metadados', '',
    '- Título: ' + P.titulo, '- Mundo/cenário: ' + P.cenario, '- Nível: ' + p.nivel + ' → ' + P.capitulos[P.capitulos.length-1].nivel,
    '- Jogadores: ' + p.jogadores, '- Sessões: ' + p.sessoes, '- Dificuldade geral: ' + P.dificuldade, '- Temas: ' + P.temas.join(', '), '- História de origem: ' + P.origem, '',
    '## Visão geral', '', P.premissa, '', '**Gancho.** ' + P.gancho, '',
    '**Contratante: ' + P.contratante.nome + '.** ' + P.contratante.quem, '', '- Sabe: ' + P.contratante.sabe, '- Esconde: ' + P.contratante.esconde, '',
    '| Antagonista | Papel | ND | Capítulos |', '|---|---|---|---|', ...P.antagonistas.map(a => `| ${a.nome} | ${a.papel} | ${a.nd} | ${a.capitulos.join(', ')} |`), '',
    '| Capítulo | Nível | Orçamento Moderado | Orçamento Alto | Combate principal |', '|---|---|---|---|---|',
    ...P.capitulos.map(c => { const B = orc(c.nivel, p.jogadores); return `| ${c.n}. ${c.titulo} | ${c.nivel} | ${fmt(B[1])} XP | ${fmt(B[2])} XP | ${c.dificuldade} |`; }), '',
    '**Marcos de nível.** ' + P.marcos, '', '**Escolha moral (capítulo ' + P.escolha.capitulo + ').** ' + P.escolha.descricao + ' Consequência no capítulo ' + P.escolha.consequencia_capitulo + ': ' + P.escolha.consequencia, '');

    const c = caps[pc.n]; L.push('## Capítulo ' + pc.n + ' — ' + (c ? c.titulo : pc.titulo), '');
    if (!c){ L.push('_Ainda não gerado._ ' + pc.resumo, ''); return; }
    L.push('*Nível ' + c.nivel + ' · Sessão ' + pc.n + '.* ' + c.resumo, '', '> ' + c.abertura.replace(/\n/g, '\n> '), '', '### Cenas', '');
    c.cenas.forEach(s => { L.push('#### ' + s.nome, '', '- Objetivo: ' + s.objetivo); s.testes.forEach(t => L.push('- Teste: ' + t.pericia + ' CD ' + t.cd + (t.uso ? ' (' + t.uso + ')' : ''))); L.push('- Sucesso: ' + s.sucesso, '- Falha: ' + s.falha, ''); });
    L.push('### Combates', '');
    c.combates.forEach(cb => { const v = avaliar(cb, c.nivel, p.jogadores, A.fichas);
      L.push('#### ' + cb.nome + (cb.principal ? ' (principal)' : '') + ' · ' + cb.dificuldade, '', '| Inimigo | Qtd | XP | Total |', '|---|---|---|---|',
        ...v.linhas.map(l => `| ${l.nome}${l.en ? ' (' + l.en + ')' : ''} | ${l.q} | ${fmt(l.xp)} | ${fmt(l.xp*l.q)} |`), `| **Total** | | | **${fmt(v.total)}** |`, '',
        'Faixa do grupo no nível ' + c.nivel + ': Baixa até ' + fmt(v.B[0]) + ' · Moderada até ' + fmt(v.B[1]) + ' · Alta até ' + fmt(v.B[2]) + ' XP. Resultado: ' + DIFN[v.cls] + '.', '',
        '- Terreno: ' + cb.terreno, '- Objetivo: ' + cb.objetivo, '- Tática: ' + cb.tatica, '- Fuga ou rendição: ' + cb.fuga, ''); });
    L.push('### Evento', '', c.evento, '', '### Fim do capítulo', '', '- Gancho: ' + c.gancho);
    if (c.subida) L.push('- Subida de nível: ' + c.subida);
    L.push('- Ouro: ' + c.ouro, ''); lista('Recompensas', c.recompensas);
  });
  L.push('## Apêndices', '', '### Fichas dos inimigos personalizados', '');
  arr(A.fichas).forEach(f => {
    L.push('#### ' + f.nome, '', '*' + f.tipo + '*', '', '- CA ' + f.ca + ' · PV ' + f.pv + ' · Deslocamento ' + f.deslocamento,
      '- ' + Object.entries(f.atributos).map(([k, v]) => k + ' ' + v + ' (' + mod(v) + ')').join(' · '));
    [['Salvaguardas', f.salvaguardas], ['Perícias', f.pericias], ['Resistências', f.resistencias], ['Imunidades', f.imunidades], ['Sentidos', f.sentidos], ['Idiomas', f.idiomas]].forEach(([k, v]) => v && L.push('- ' + k + ': ' + v));
    L.push('- ND ' + f.nd + ' (' + fmt(crXp(f.nd)||0) + ' XP)', '');
    [['Traços', f.tracos], ['Ações', f.acoes], ['Ações bônus', f.acoes_bonus], ['Reações', f.reacoes], ['Ações lendárias', f.lendarias]].forEach(([k, xs]) => { if (xs.length){ L.push('**' + k + '**', ''); xs.forEach(x => L.push('- ' + (x.nome ? '***' + x.nome + '.*** ' : '') + x.texto)); L.push(''); } });
  });
  L.push('### PNJs aliados', '', '| Nome | Quem é | Personalidade | Ficha sugerida |', '|---|---|---|---|', ...P.aliados.map(a => `| ${a.nome} | ${a.quem} | ${a.personalidade} | ${a.ficha} |`), '');
  return L.join('\n');
}
const mod = v => { const m = Math.floor((v - 10) / 2); return (m >= 0 ? '+' : '') + m; };

function telaVer(A){

    ${g.erro ? `<p class="small" style="color:var(--red);margin:10px 0 0">${h(g.erro)}</p>` : ''}</div>` : '';

function secVisao(A){

  const prog = P.capitulos.map(c => { const B = orc(c.nivel, p.jogadores), cap = caps[c.n], pr = cap && cap.combates.find(x => x.principal) || cap && cap.combates[0];

    <h3>Progressão</h3>
    <div class="tabwrap"><table><thead><tr><th>Capítulo</th><th class="n">Nível</th><th class="n">Moderado</th><th class="n">Alto</th><th>Combate principal</th><th class="n">XP real</th></tr></thead><tbody>${prog}</tbody></table></div>
    <p class="muted small" style="margin:0">Orçamentos do grupo inteiro (${p.jogadores} jogadores), pelo Livro do Mestre 2024.</p>
    <div class="prosa"><p><b>Marcos de nível.</b> ${tx(P.marcos)}</p>
    <p><b>Escolha moral, capítulo ${P.escolha.capitulo}.</b> ${tx(P.escolha.descricao)}</p><p><b>Consequência, capítulo ${P.escolha.consequencia_capitulo}.</b> ${tx(P.escolha.consequencia)}</p></div>
  </section>`;
}
const chipXp = v => !v.achou ? '<span class="chip bad">Criatura desconhecida</span>' : v.ok ? `<span class="chip ok">${DIFN[v.cls]}</span>` : `<span class="chip warn" title="Declarada: ${DIFN[v.dec] || '?'}">${DIFN[v.cls]}</span>`;

function verificacoes(A){
  const P = A.plano, p = A.params, caps = capsDe(A.id), out = [];
  const feitos = P.capitulos.filter(c => caps[c.n]);
  if (feitos.length < P.capitulos.length) out.push(['warn', `${P.capitulos.length - feitos.length} capítulo(s) ainda não gerado(s).`]);
  let fora = [], desc = [], semPrincipal = [];
  feitos.forEach(c => { const cap = caps[c.n]; if (!cap.combates.some(x => x.principal)) semPrincipal.push(c.n);
    cap.combates.forEach(cb => { const v = avaliar(cb, cap.nivel, p.jogadores, A.fichas);
      v.linhas.filter(l => !l.ok).forEach(l => desc.push(l.nome + ' (cap. ' + c.n + ')'));
      if (v.achou && v.cls !== v.dec) fora.push(`${cb.nome} (cap. ${c.n}): declarado ${DIFN[v.dec] || '?'}, soma ${fmt(v.total)} XP = ${DIFN[v.cls]}`); }); });
  if (feitos.length) out.push(fora.length ? ['warn', 'Combates fora da faixa declarada: ' + fora.join('; ') + '.'] : ['ok', 'Todos os combates gerados batem com a dificuldade declarada.']);
  if (desc.length) out.push(['bad', 'Criaturas que não estão na lista de monstros nem nas fichas: ' + desc.join(', ') + '.']);
  if (semPrincipal.length) out.push(['warn', 'Capítulo(s) sem combate principal: ' + semPrincipal.join(', ') + '.']);
  let sobe = true; P.capitulos.forEach((c, i) => { if (i && (c.nivel < P.capitulos[i-1].nivel || c.nivel > P.capitulos[i-1].nivel + 1)) sobe = false; });
  out.push(sobe && P.capitulos[0].nivel === p.nivel ? ['ok', `Progressão de nível coerente: ${P.capitulos.map(c => c.nivel).join(' → ')}.`] : ['warn', `Progressão de nível estranha: ${P.capitulos.map(c => c.nivel).join(' → ')}.`]);
  const fogem = P.antagonistas.filter(a => a.foge);
  fogem.forEach(a => { const ult = Math.max(0, ...a.capitulos); const primeiro = Math.min(...a.capitulos.length ? a.capitulos : [0]);
    out.push(ult > primeiro ? ['ok', `${a.nome} foge e reaparece no capítulo ${ult}.`] : ['warn', `${a.nome} foge, mas o plano não mostra ele voltando depois.`]); });
  const em = P.escolha;
  if (!em.descricao) out.push(['warn', 'O plano não tem escolha moral.']);
  else out.push(em.consequencia_capitulo > em.capitulo || (p.sessoes === 1 && em.consequencia_capitulo === 1) ? ['ok', `Escolha moral no capítulo ${em.capitulo}, com consequência no capítulo ${em.consequencia_capitulo}.`] : ['warn', `A consequência da escolha moral (capítulo ${em.consequencia_capitulo}) não vem depois da escolha (capítulo ${em.capitulo}).`]);
  P.antagonistas.filter(a => a.hb).forEach(a => { const xp = crXp(a.nd) || 0;
    const caps = (a.capitulos.length ? a.capitulos : []).map(n => P.capitulos[n-1]).filter(Boolean), alem = caps.filter(c => xp > orc(c.nivel, p.jogadores)[2]);
    out.push(alem.length ? ['warn', `${a.nome} (Homebrew, ND ${a.nd}, ${fmt(xp)} XP) passa do orçamento Alto ${alem.map(c => `do capítulo ${c.n} (nível ${c.nivel}: até ${fmt(orc(c.nivel, p.jogadores)[2])} XP)`).join(' e ')}. Pense em subir o nível ${alem.length > 1 ? 'desses capítulos' : 'desse capítulo'} ou dar ao grupo uma vantagem na luta.`]
      : ['ok', `${a.nome} usa a ficha do Homebrew (ND ${a.nd}).`]); });
  const semFicha = P.antagonistas.filter(a => !fichaDe(A.fichas, a.nome));
  if (A.fichas && semFicha.length) out.push(['warn', 'Antagonistas sem ficha: ' + semFicha.map(a => a.nome).join(', ') + '.']);
  return out;
}
function secVerif(A){
  const xs = verificacoes(A), rot = {ok:'Certo', warn:'Atenção', bad:'Problema'};
  return `<section class="panel cap" id="verif"><span class="eyebrow">Verificações feitas pela página</span>
    <ul class="checks">${xs.map(([t, m]) => `<li><span class="chip ${t}">${rot[t]}</span><span>${h(m)}</span></li>`).join('')}</ul>
    <p class="muted small" style="margin:0">A página soma o XP de cada combate com a lista de monstros da Mesa e as fichas dos antagonistas. Se um combate sair da faixa, ajuste as quantidades na mesa ou gere o capítulo de novo.</p></section>`;
}

function secCap(A, pc){
  const c = capsDe(A.id)[pc.n], p = A.params, pode = !A.exemplo && S.sample && !S.iaNegada && !ocupado() && A.fichas;
  if (!c) return `<section class="panel cap" id="cap-${pc.n}"><div class="caphead"><span class="eyebrow">Capítulo ${pc.n} · Nível ${pc.nivel} · ainda não gerado</span><h2>${h(pc.titulo)}</h2><p class="muted" style="margin:0">${tx(pc.resumo)}</p></div>
    ${pode ? `<div><button class="btn" data-act="av-gerar-cap" data-n="${pc.n}">Gerar este capítulo</button></div>` : ''}</section>`;
  const cenas = c.cenas.map(s => `<div class="cena"><h4>${h(s.nome)}</h4>
      <p style="margin:0"><b style="color:var(--gold2)">Objetivo.</b> ${tx(s.objetivo)}</p>
      ${s.testes.length ? `<ul class="testes">${s.testes.map(t => `<li><span class="chip gold">${h(t.pericia)} CD ${t.cd || '?'}</span> ${tx(t.uso)}</li>`).join('')}</ul>` : ''}
      <p style="margin:0"><b style="color:var(--green)">Sucesso.</b> ${tx(s.sucesso)}</p><p style="margin:0"><b style="color:var(--red)">Falha.</b> ${tx(s.falha)}</p></div>`).join('');
  const combates = c.combates.map(cb => { const v = avaliar(cb, c.nivel, p.jogadores, A.fichas);
    return `<div class="combate${v.ok ? '' : ' fora'}"><div class="row between"><h4>${h(cb.nome)}</h4><div class="row">${cb.principal ? '<span class="chip gold">Principal</span>' : ''}<span class="chip">Declarado: ${h(cb.dificuldade)}</span>${chipXp(v)}</div></div>

/* ================= masmorra do capítulo =================
   A Mesa desenha a planta (gerador de masmorras); o Claude dá nome e descrição às salas, e a página põe nelas os combates do capítulo. */
const TEMAS_AV = X.temas(), TIPOS_AV = X.tipos();
const TAMS = {pequena:'Pequena (6–8 salas)', media:'Média (10–13 salas)', grande:'Grande (15–19 salas)'};
function temaDe(t){
  const n = norm(t); if (!n) return '';
  if (TEMAS_AV[n]) return n;
  return Object.keys(TEMAS_AV).find(k => n.includes(k) || norm(TEMAS_AV[k].nome).includes(n) || n.includes(norm(TEMAS_AV[k].nome))) || '';
}
function normMz(m){
  if (!m || typeof m !== 'object' || Array.isArray(m)) return null;
  const tam = norm(m.tamanho);
  return {nome:str(m.nome), tema:temaDe(m.tema), tamanho:TAMS[tam] ? tam : '', descricao:str(m.descricao), combates:arr(m.combates).map(str).filter(Boolean)};
}
const mzChave = (id, n) => id + '--' + n;
function mzCfg(A, n, c){
  const sv = S.mzForm[mzChave(A.id, n)]; if (sv) return sv;
  const m = c.masmorra, nc = combatesMz(c).length;
  return {tema:(m && m.tema) || 'caverna', tamanho:(m && m.tamanho) || (nc > 2 ? 'media' : 'pequena'), andares:1};
}
/* combates do capítulo que acontecem na masmorra (os que o Claude listou; sem lista, todos) */
function combatesMz(c){
  const ns = c.masmorra && c.masmorra.combates.length ? c.masmorra.combates.map(norm).filter(Boolean) : null;
  const cbs = ns ? c.combates.filter(cb => { const x = norm(cb.nome); return ns.some(y => x === y || x.includes(y) || y.includes(x)); }) : c.combates.slice();
  return cbs.length ? cbs : c.combates.slice();
}
function grupoDe(nome, qtd, fichas){
  const f = fichaDe(fichas, nome);
  if (f){ const xp = crXp(f.nd); return xp === null ? null : {pt:f.nome, en:'', cr:f.nd, xp, qtd, ficha:true}; }
  const m = MON_IDX[norm(nome)]; return m ? {pt:m.pt, en:m.en, cr:m.cr, xp:m.xp, qtd} : null;
}
function encDe(inimigos, nivel, jog, fichas, comport){
  const grupos = arr(inimigos).map(i => grupoDe(str(i.nome), clamp(int(i.qtd, 1), 1, 20), fichas)).filter(Boolean);
  if (!grupos.length) return null;
  const xp = grupos.reduce((t, g) => t + g.xp*g.qtd, 0), B = orc(nivel, jog), dif = xp <= B[0] ? 0 : xp <= B[1] ? 1 : 2;
  return {dif, orcamento:B[dif], xp, grupos, comport:comport || ''};
}
const fichaTexto = f => `Ficha de ${f.nome} (${f.tipo}) · ND ${f.nd} · CA ${f.ca} · PV ${f.pv} · Deslocamento ${f.deslocamento}\n`
  + Object.entries(f.atributos).map(([k, v]) => k + ' ' + v + ' (' + mod(v) + ')').join(' · ')
  + [['Traços', f.tracos], ['Ações', f.acoes], ['Ações bônus', f.acoes_bonus], ['Reações', f.reacoes], ['Ações lendárias', f.lendarias]]
      .filter(([, xs]) => xs.length).map(([t, xs]) => '\n' + t + ': ' + xs.map(x => (x.nome ? x.nome + '. ' : '') + x.texto).join(' | ')).join('');
/* todas as salas da masmorra, de todos os andares */
function salasMz(d){
  const fl = d.andares ? d.andares.map(a => ({salas:a.salas, mapa:a.mapa})) : [{salas:d.salas, mapa:d.mapa}];
  const out = [];

async function miniatura(blob){
  const bmp = await createImageBitmap(blob);
  const k = Math.min(1, 220 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); if (bmp.close) bmp.close();
  return c.toDataURL('image/jpeg', .8);
}
async function addImgs(files){
  const tipos = S.lim && S.lim.images && arr(S.lim.images.mediaTypes).length ? S.lim.images.mediaTypes : ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];
  const max = S.lim && S.lim.images && S.lim.images.maxCount ? S.lim.images.maxCount : 5;
  const ruins = [];
  for (const file of Array.from(files || [])){
    if (!file || !String(file.type).startsWith('image/')) continue;
    if (!tipos.includes(file.type)){ ruins.push(file.name || file.type); continue; }
    if (S.form.imgs.length >= max){ S.erro = 'Cabem até ' + max + ' prints por leitura. Os outros ficaram de fora.'; break; }
    let mini = ''; try { mini = await miniatura(file); } catch { ruins.push(file.name || 'imagem'); continue; }

function setPath(o, path, v){ const ks = path.split('.'); let x = o; ks.slice(0, -1).forEach(k => { x = x[k]; }); x[ks[ks.length - 1]] = v; }
document.addEventListener('click', e => {
  if (!M.abaHb()) return;
  const t = e.target.closest('[data-act^="hb-"]'); if (!t) return;
  const a = t.dataset.act.slice(3), id = t.dataset.id;
  if (a === 'catalogo'){ S.tela = 'catalogo'; S.erro = ''; render(); return; }
  if (a === 'novo'){ S.tela = S.rev && !S.rev.id ? 'revisar' : 'novo'; if (S.rev && S.rev.id){ S.rev = null; S.tela = 'novo'; } S.msg = ''; S.erro = ''; render(); return; }
  if (a === 'filtro'){ S.filtro = t.dataset.f; render(); return; }
  if (a === 'tipo'){ S.form.tipo = t.dataset.t; render(); return; }
  if (a === 'img-del'){ S.form.imgs.splice(+t.dataset.i, 1); S.erro = ''; render(); return; }
  if (a === 'ler'){ ler(); return; }
  if (a === 'parar'){ if (S.ger) S.ger.ctl.abort(); return; }
  if (a === 'manual'){ manual(); return; }
  if (a === 'img-modo' && S.rev && S.rev.img){ S.rev.img.modo = t.dataset.m; render(); return; }
  if (a === 'img-print' && S.rev && S.rev.img){ const im = S.rev.img, i = +t.dataset.i; if (im.i !== i){ im.i = i; im.caixa = [0, 0, 1, 1]; im.achou = false; } render(); return; }
  if (a === 'tema'){ const k = t.dataset.t, L = S.rev.temas; const i = L.indexOf(k); if (i >= 0) L.splice(i, 1); else L.push(k); render(); return; }
  if (a === 'salvar'){ salvar(); return; }
  if (a === 'voltar'){ S.tela = 'novo'; S.erro = ''; render(); return; }
  if (a === 'descartar'){ const ed = S.rev && S.rev.id; S.rev = null; S.erro = ''; if (!ed) S.form = formVazio(); S.tela = ed ? 'catalogo' : 'novo'; render(); return; }
  if (a === 'ver'){ S.aberto = S.aberto === id ? null : id; render(); return; }
  if (a === 'editar'){ editar(id); return; }
  if (a === 'nao'){ S.apagar = null; render(); return; }
  if (a === 'excluir'){
    if (S.apagar !== id){ S.apagar = id; render(); return; }
    const x = S.lista[id], nome = x ? x.pt || x.nome : '';
    S.apagar = null;
    excluirDoc(id).then(() => { S.msg = h(nome) + ' saiu do catálogo.'; if (x && x.tipo === 'monstro' && X.img.de(x.en || x.pt)) X.img.remover(x.en || x.pt).catch(() => {}); render(); }, err => { S.msg = 'Não foi possível excluir (' + h((err && (err.code || err.message)) || 'erro') + ').'; render(); });
    return;
  }
});
document.addEventListener('input', e => {
  if (!M.abaHb()) return;
  const el = e.target;
  if (el.dataset.hbm){ S.form[el.dataset.hbm] = el.value; return; }
  if (el.dataset.hbf && S.rev){ setPath(S.rev, el.dataset.hbf, el.value); return; }
  if (el.dataset.hbCaixa != null && S.rev && S.rev.img){
    const c = S.rev.img.caixa, k = +el.dataset.hbCaixa, v = +el.value / 100, min = .04;
    c[k] = k < 2 ? Math.min(v, c[k + 2] - min) : Math.max(v, c[k - 2] + min);
    c[k] = Math.max(0, Math.min(1, c[k])); if (Math.round(c[k] * 100) !== +el.value) el.value = Math.round(c[k] * 100);
    desenharRecorte(); return;
  }
  if (el.hasAttribute('data-hb-busca')){
    const q = norm(el.value); let vis = 0;
    document.querySelectorAll('#hb-cards .hb-card').forEach(c => { const ok = !q || c.dataset.busca.includes(q); c.hidden = !ok; if (ok) vis++; });
    const n = $('#hb-nada'); if (n) n.hidden = vis > 0;
  }
});
document.addEventListener('change', e => {
  if (!M.abaHb()) return;
  const el = e.target;
  if (el.dataset.hbc){ const k = el.dataset.hbc; if (k.startsWith('rev.')){ if (S.rev) setPath(S.rev, k.slice(4), el.checked); } else S.form[k] = el.checked; return; }
  if (el.hasAttribute('data-hb-imgfile') && S.rev && S.rev.img){
    const f = el.files && el.files[0]; el.value = ''; if (!f) return;
    if (!/^image\/(png|jpeg|webp|gif)$/.test(f.type)){ S.erro = 'Formato de imagem não aceito. Use PNG, JPG ou WebP.'; render(); return; }
    miniatura(f).then(mini => { S.rev.img.arquivo = f; S.rev.img.mini = mini; S.erro = ''; render(); }, () => { S.erro = 'Não consegui abrir esta imagem.'; render(); });
    return;
  }
  if (el.dataset.hbf && S.rev){ setPath(S.rev, el.dataset.hbf, el.value); return; }
  if (el.hasAttribute('data-hb-file')){ const fs = Array.from(el.files || []); el.value = ''; addImgs(fs); }
});
document.addEventListener('paste', e => {
  if (!M.abaHb() || S.tela !== 'novo' || !(S.lim && S.lim.images)) return;
  const fs = Array.from((e.clipboardData && e.clipboardData.files) || []).filter(f => String(f.type).startsWith('image/'));

});

document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#hb-drop'); if (d) d.classList.remove('sobre'); });
document.addEventListener('drop', e => { if (!M.abaHb()) return; const d = e.target.closest && e.target.closest('#hb-drop'); if (!d) return; e.preventDefault(); d.classList.remove('sobre'); addImgs(e.dataTransfer && e.dataTransfer.files); });

function start(db){
  S.db = db || null;
  if (!db){ const o = lerDemo(); S.lista = Object.fromEntries(Object.entries(o).map(([id, x]) => [id, {id, ...x}])); S.carregou = true; aplicar(); }
  else {
    const t = setTimeout(() => { if (!S.carregou){ S.aviso = 'Ainda não consegui ler o catálogo de homebrew. Ele aparece assim que a conexão responder.'; render(); } }, 10000);
    db.collection('homebrew').onSnapshot(snap => {
      const novo = {}; snap.docs.forEach(d => { const v = d.data(); if (v && v.tipo === 'eventos') return; /* eventos (aba Eventos) moram nesta coleção */ novo[d.id] = {id:d.id, ...v}; });
      S.lista = novo; if (!snap.metadata || !snap.metadata.fromCache){ clearTimeout(t); S.carregou = true; S.aviso = ''; }
      aplicar(); render();
    }, err => { clearTimeout(t); S.carregou = true; S.aviso = 'Não consegui ler o catálogo de homebrew (' + ((err && err.code) || 'erro') + ').'; render(); });
  }
  if (window.claude && typeof window.claude.use === 'function'){
    Promise.resolve(window.claude.use('sample')).then(async x => {
      S.sample = x || null;
      if (x && typeof x.limits === 'function'){ try { S.lim = await x.limits(); } catch { S.lim = {}; } } else S.lim = {};
      render();
    }, () => {});
  }
}
return {view, start};
})(MESA_API, MAS.hb, AV);

const EV = (function(M, X){
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = x => Array.isArray(x) ? x : [];
const str = x => (x === null || x === undefined) ? '' : String(x).trim();
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const render = () => M.render();
const DEMO = 'mesa-eventos-demo', LOCAL = 'mesa-eventos-sorteio';
const MAX_HIST = 12;

const S = {tela:'sortear', db:null, docs:{}, carregou:false, aviso:'', erro:'',
  cat:'cidade', camp:'', atual:null, usados:{}, hist:[], aviso2:'',
  edEv:null, rasc:null, apagarEv:null, apagarCat:false, restaurar:false, salvando:false};

/* ---------- guardado neste navegador: categoria, grupo, eventos já sorteados e histórico ---------- */
function lerLocal(){ try { const o = JSON.parse(localStorage.getItem(LOCAL) || '{}') || {};
  if (o.cat) S.cat = o.cat; if (typeof o.camp === 'string') S.camp = o.camp;
  if (o.usados && typeof o.usados === 'object') S.usados = o.usados; if (Array.isArray(o.hist)) S.hist = o.hist.slice(0, MAX_HIST);
  if (o.atual && typeof o.atual === 'object') S.atual = o.atual; } catch {} }
function gravarLocal(){ try { localStorage.setItem(LOCAL, JSON.stringify({cat:S.cat, camp:S.camp, usados:S.usados, hist:S.hist, atual:S.atual})); } catch {} }

/* ---------- categorias = base embutida + o que o mestre salvou ---------- */
function categorias(){
  const out = [], vistos = new Set();
  EV_BASE.forEach((b, i) => { vistos.add(b.id); const d = S.docs[b.id];
    if (d && d.apagada) return;
    out.push(d ? {...d, id:b.id, base:true, ordem:d.ordem ?? i, editada:true} : {...b, base:true, ordem:i, editada:false}); });
  Object.values(S.docs).forEach(d => { if (!vistos.has(d.id) && !d.apagada) out.push({...d, base:false, ordem:d.ordem ?? 100}); });
  return out.sort((a, b) => a.ordem - b.ordem || String(a.nome).localeCompare(String(b.nome), 'pt'));
}
const catDe = id => categorias().find(c => c.id === id) || null;
function catAtual(){ const cs = categorias(); let c = cs.find(x => x.id === S.cat); if (!c && cs.length){ c = cs[0]; S.cat = c.id; } return c || null; }

function lerDemo(){ try { return JSON.parse(localStorage.getItem(DEMO) || '{}') || {}; } catch { return {}; } }
function gravarDemo(){ try { localStorage.setItem(DEMO, JSON.stringify(S.docs)); } catch {} }
async function salvarCat(c){
  const doc = {tipo:'eventos', nome:str(c.nome).slice(0, 60) || 'Sem nome', fonte:str(c.fonte).slice(0, 200), ordem:c.ordem ?? 100,
    eventos:arr(c.eventos).map(e => ({id:e.id, t:str(e.t).slice(0, 80), x:str(e.x).slice(0, 2000), m:arr(e.m).slice(0, 8), p:!!e.p})),
    at:Date.now(), autor:M.myId() || ''};
  S.docs = {...S.docs, [c.id]:{id:c.id, ...doc}};
  if (S.db) await S.db.collection('homebrew').doc('ev-' + c.id).set(doc); else gravarDemo();
}
async function apagarDoc(id, marcar){
  const novo = {...S.docs};
  if (marcar){ novo[id] = {id, tipo:'eventos', apagada:true, at:Date.now()}; S.docs = novo;
    if (S.db) await S.db.collection('homebrew').doc('ev-' + id).set({tipo:'eventos', apagada:true, at:Date.now()}); else gravarDemo(); return; }
  delete novo[id]; S.docs = novo;
  if (S.db) await S.db.collection('homebrew').doc('ev-' + id).delete(); else gravarDemo();
}

/* ---------- monstros, dados e grupo ---------- */
const monEn = en => X.dados.MON.find(m => m.en === en) || null;
function monDeNome(nome){ const n = norm(nome); return X.dados.MON.find(m => norm(m.pt) === n || norm(m.en) === n) || null; }
function rolar(expr){
  const m = /^(\d+)d(\d+)$/.exec(expr); if (!m) return null;
  const n = Math.min(+m[1], 100), f = Math.max(+m[2], 1), buf = new Uint32Array(n); crypto.getRandomValues(buf);
  const dados = [...buf].map(x => 1 + (x % f)); return {dados, total:dados.reduce((a, b) => a + b, 0)};
}
const sorteio = n => { const b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] % n; };
const grupo = () => arr(M.grupo(S.camp, []));
function alvoNovo(evitar){
  const g = grupo(); if (!g.length) return null;
  const op = g.length > 1 && evitar ? g.filter(x => x.id !== evitar) : g;
  const x = op[sorteio(op.length)]; return {id:x.id, nome:x.nome};
}
/* texto do evento: dados viram botões de rolar, CDs em destaque */
function textoHtml(x, rol){
  let k = 0;
  return h(x).replace(/\b(\d+)d(\d+)\b/g, (s) => { const i = k++, r = rol && rol[i];
      return `<button class="ev-dado" data-act="ev-rolar" data-i="${i}" data-e="${s}" title="Rolar ${s}">${s}</button>${r ? `<span class="ev-res" aria-live="polite"> = <b>${r.total}</b> <span class="muted small">[${r.dados.join(', ')}]</span></span>` : ''}`; })
    .replace(/\bCD \d+/g, s => `<b class="ev-cd">${s}</b>`);
}

/* ---------- sorteio ---------- */
function sortear(){
  const c = catAtual(); if (!c || !c.eventos.length) return;
  const usados = new Set(arr(S.usados[c.id]).filter(id => c.eventos.some(e => e.id === id)));
  let livres = c.eventos.filter(e => !usados.has(e.id));
  S.aviso2 = '';
  if (!livres.length){ usados.clear(); livres = c.eventos.slice(); S.aviso2 = 'Todos os eventos desta categoria já tinham saído. A lista recomeçou.'; }
  const e = livres[sorteio(livres.length)]; usados.add(e.id); S.usados[c.id] = [...usados];
  mostrar(c.id, e.id);
}
function mostrar(catId, evId, alvo){
  const c = catDe(catId), e = c && c.eventos.find(x => x.id === evId); if (!e) return;
  S.atual = {cat:catId, id:evId, alvo:alvo !== undefined ? alvo : (e.p ? alvoNovo() : null), rol:{}};
  S.hist = [{cat:catId, id:evId, t:e.t, alvo:S.atual.alvo, at:Date.now()}, ...S.hist.filter(x => !(x.cat === catId && x.id === evId))].slice(0, MAX_HIST);
  gravarLocal();
}

/* ---------- telas ---------- */
const sub = () => `<div class="subnav" role="group" aria-label="Eventos">${[['sortear', 'Sortear'], ['editar', 'Editar eventos']].map(([k, l]) => { const on = S.tela === k; return `<button class="${on ? 'on' : ''}" data-act="ev-tela" data-t="${k}" ${on ? 'aria-current="page"' : ''}>${l}</button>`; }).join('')}</div>`;

}

function cartao(){

function telaSortear(){

      <p class="small muted" style="margin:6px 0 0">O histórico e os eventos já sorteados ficam guardados só neste navegador.</p></div>` : ''}`;

function formEvento(c, e){

function telaEditar(){

  return `${topo}${lista}

function view(){

/* ---------- ações ---------- */
const copiaCat = c => ({...c, eventos:c.eventos.map(e => ({...e, m:arr(e.m).slice()}))});
const erroSalvar = err => 'Não foi possível salvar (' + ((err && err.code) || 'erro') + ').';
async function salvarEvento(){
  const c = catAtual(); if (!c) return;
  const t = str($('#ev-t') && $('#ev-t').value), x = str($('#ev-x') && $('#ev-x').value);
  const mTxt = str($('#ev-m') && $('#ev-m').value), nomes = mTxt.split(/[,;]/).map(str).filter(Boolean), p = !!($('#ev-p') && $('#ev-p').checked);
  S.rasc = {t, x, m:mTxt, p};
  if (!t || !x){ S.erro = 'Escreva o título e o que acontece.'; render(); return; }
  const m = [], faltam = [];
  nomes.forEach(n => { const mo = monDeNome(n); if (mo){ if (!m.includes(mo.en)) m.push(mo.en); } else faltam.push(n); });
  if (faltam.length){ S.erro = 'Não achei estes monstros na Mesa: ' + faltam.join(', ') + '. Use o nome da lista (em português ou inglês).'; render(); return; }
  const nc = copiaCat(c);
  if (S.edEv === '__novo') nc.eventos.push({id:'e' + Date.now().toString(36), t, x, m, p});
  else { const e = nc.eventos.find(y => y.id === S.edEv); if (!e) return; Object.assign(e, {t, x, m, p}); }
  S.salvando = true; render();
  try { await salvarCat(nc); S.edEv = null; S.erro = ''; S.rasc = null; M.toast('Evento salvo.'); } catch (err){ S.erro = erroSalvar(err); }
  S.salvando = false; render();
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t || !M.abaEv()) return;
  const a = t.dataset.act; if (!a.startsWith('ev-')) return;
  if (a !== 'ev-apagar') S.apagarEv = null;
  if (a !== 'ev-apagar-cat') S.apagarCat = false;
  if (a !== 'ev-restaurar') S.restaurar = false;
  if (a === 'ev-tela'){ S.tela = t.dataset.t; S.edEv = null; S.erro = ''; S.rasc = null; render(); window.scrollTo(0, 0); return; }
  if (a === 'ev-cat'){ S.cat = t.dataset.c; S.edEv = null; S.erro = ''; S.rasc = null; S.aviso2 = ''; gravarLocal(); render(); return; }
  if (a === 'ev-sortear'){ sortear(); render(); const c = document.querySelector('.ev-cartao'); if (c && c.scrollIntoView) c.scrollIntoView({block:'nearest', behavior:'smooth'}); return; }
  if (a === 'ev-recomecar'){ S.usados[S.cat] = []; S.aviso2 = ''; gravarLocal(); render(); return; }
  if (a === 'ev-limpar'){ S.hist = []; S.atual = null; S.aviso2 = ''; gravarLocal(); render(); return; }
  if (a === 'ev-abrir'){ const x = S.hist.find(y => y.cat === t.dataset.c && y.id === t.dataset.id); mostrar(t.dataset.c, t.dataset.id, x ? x.alvo : undefined); render(); window.scrollTo(0, 0); return; }
  if (a === 'ev-rolar' && S.atual){ const r = rolar(t.dataset.e); if (r){ S.atual.rol = {...S.atual.rol, [t.dataset.i]:r}; gravarLocal(); render(); } return; }
  if (a === 'ev-alvo' && S.atual){ S.atual.alvo = alvoNovo(S.atual.alvo && S.atual.alvo.id); if (S.hist[0] && S.hist[0].id === S.atual.id) S.hist[0].alvo = S.atual.alvo; gravarLocal(); render(); return; }
  if (a === 'ev-ficha'){ M.abrirFicha(t.dataset.id); return; }
  if (a === 'ev-usar'){ mostrar(S.cat, t.dataset.id); S.tela = 'sortear'; render(); window.scrollTo(0, 0); return; }
  if (a === 'ev-novo'){ S.edEv = '__novo'; S.erro = ''; S.rasc = null; render(); const i = $('#ev-t'); if (i) i.focus(); return; }
  if (a === 'ev-editar'){ S.edEv = t.dataset.id; S.erro = ''; S.rasc = null; render(); const i = $('#ev-t'); if (i) i.focus(); return; }
  if (a === 'ev-cancelar'){ S.edEv = null; S.erro = ''; S.rasc = null; render(); return; }
  if (a === 'ev-nao'){ render(); return; }
  if (a === 'ev-salvar-ev'){ await salvarEvento(); return; }
  if (a === 'ev-apagar'){
    if (S.apagarEv !== t.dataset.id){ S.apagarEv = t.dataset.id; render(); return; }
    const c = catAtual(); S.apagarEv = null; if (!c) return;
    const nc = copiaCat(c); nc.eventos = nc.eventos.filter(y => y.id !== t.dataset.id);
    try { await salvarCat(nc); M.toast('Evento apagado.'); } catch (err){ M.toast(erroSalvar(err)); }
    render(); return;
  }
  if (a === 'ev-salvar-cat'){
    const c = catAtual(); if (!c) return; const nc = copiaCat(c);
    nc.nome = str($('#ev-cat-nome') && $('#ev-cat-nome').value) || c.nome; nc.fonte = str($('#ev-cat-fonte') && $('#ev-cat-fonte').value);
    S.salvando = true; render();
    try { await salvarCat(nc); M.toast('Categoria salva.'); } catch (err){ M.toast(erroSalvar(err)); }
    S.salvando = false; render(); return;
  }
  if (a === 'ev-nova-cat'){
    const id = 'k' + Date.now().toString(36), ordem = Math.max(0, ...categorias().map(c => c.ordem)) + 1;
    try { await salvarCat({id, nome:'Nova categoria', fonte:'', ordem, eventos:[]}); S.cat = id; S.edEv = '__novo'; gravarLocal(); M.toast('Categoria criada. Dê um nome e adicione eventos.'); }
    catch (err){ M.toast(erroSalvar(err)); }
    render(); const i = $('#ev-cat-nome'); if (i){ i.focus(); i.select(); } return;
  }
  if (a === 'ev-apagar-cat'){
    if (!S.apagarCat){ S.apagarCat = true; render(); return; }
    const c = catAtual(); S.apagarCat = false; if (!c) return;
    try { await apagarDoc(c.id, c.base); delete S.usados[c.id]; S.cat = (categorias()[0] || {}).id || ''; gravarLocal(); M.toast('Categoria apagada.'); } catch (err){ M.toast(erroSalvar(err)); }
    render(); return;
  }
  if (a === 'ev-restaurar'){
    if (!S.restaurar){ S.restaurar = true; render(); return; }
    const c = catAtual(); S.restaurar = false; if (!c) return;
    try { await apagarDoc(c.id, false); M.toast('A categoria voltou à lista original.'); } catch (err){ M.toast(erroSalvar(err)); }
    render(); return;
  }
});
document.addEventListener('change', e => {
  if (!M.abaEv()) return;
  if (e.target.hasAttribute('data-ev-camp')){ S.camp = e.target.value; if (S.atual && S.atual.alvo){ /* o personagem sorteado continua; o próximo sai do grupo novo */ } gravarLocal(); render(); }
});

/* ---------- início ---------- */
function start(db){
  S.db = db || null; lerLocal();
  if (!db){ const o = lerDemo(); S.docs = Object.fromEntries(Object.entries(o).map(([id, x]) => [id, {...x, id}])); S.carregou = true; return; }
  const tm = setTimeout(() => { if (!S.carregou){ S.carregou = true; S.aviso = 'Ainda não consegui ler os eventos salvos. Por enquanto aparece a lista original.'; render(); } }, 10000);
  db.collection('homebrew').onSnapshot(snap => {
    const novo = {};
    snap.docs.forEach(d => { const v = d.data(); if (v && v.tipo === 'eventos' && d.id.startsWith('ev-')){ const id = d.id.slice(3); novo[id] = {...v, id, eventos:arr(v.eventos)}; } });
    S.docs = novo; if (!snap.metadata || !snap.metadata.fromCache){ clearTimeout(tm); S.carregou = true; S.aviso = ''; }
    if (M.abaEv() && !S.edEv) render();
  }, err => { clearTimeout(tm); S.carregou = true; S.aviso = 'Não consegui ler os eventos salvos (' + ((err && err.code) || 'erro') + '). Aparece a lista original.'; render(); });
}
return {view, start};
})(MESA_API, {dados:MAS.av.dados, pop:() => MAS.pop()});

/* ============ INICIALIZAÇÃO ============ */
function subscribe(){
  const timer=setTimeout(()=>{ if(!S.loaded){ S.notice='Não foi possível alcançar os dados ainda. Verifique sua conexão; a página continua tentando.'; render(); } },10000);
  store.onCharacters((list,meta)=>{
    S.chars=list;
    if (!meta || !meta.fromCache){ S.loaded=true; clearTimeout(timer); if(S.notice.startsWith('Não foi possível alcançar')) S.notice=''; }
    loadNames(); render();
  }, err=>{ clearTimeout(timer); S.loaded=true; S.notice='Não foi possível carregar as fichas ('+h(err.code)+').'; render(); });
  store.onMestres(v=>{ S.mestres=v.ids||[]; S.donoId=v.dono||null;
    if (S.mode==='db' && S.isOwner && S.donoId!==S.myId && !S.donoSaving){ S.donoSaving=true; store.saveMestres(S.mestres).catch(()=>{}).finally(()=>{ S.donoSaving=false; }); }
    applyRole(); }, ()=>{});
  resubRoles();
  store.onRegras(m=>{ S.regras=m||{}; renderPop(); }, ()=>{});
  if (S.mode==='db' && S.isOwner) store.onPessoas(ids=>{ S.pessoas=ids; loadNames(); render(); }, ()=>{});
  if (S.mode==='db' && S.myId && !S.isOwner) store.registrar(S.myId).catch(()=>{});
}
/* Mestre = dono do app ou alguém que o dono pôs na lista de mestres (config/mestres). */
let roleUnsubs=[];
let eraMestre=null;
function applyRole(){
  const pode = podeMestrar();
  /* ao virar (ou deixar de ser) mestre, volta para a visão do papel e para a aba que a pessoa usava */
  if (pode!==eraMestre){ S.viewAs = pode ? 'mestre' : 'jogador'; eraMestre=pode; S.aba = lsGet('mesa-aba')||''; }
  const m = pode && S.viewAs==='mestre';
  if (m!==S.isMaster){ S.isMaster=m; MAS.reset(); if (S.mode==='db') resubRoles(); }
  MAS.papel(); AV.papel(); loadNames(); render();
}
function resubRoles(){
  roleUnsubs.forEach(u=>{ try{ typeof u==='function' && u(); }catch{} }); roleUnsubs=[];
  roleUnsubs.push(store.onEstado(m=>{ S.estado=m||{};
    if (S.mode==='db' && !S.isMaster && !S.registered && !S.estado[S.myId]){ S.registered=true; store.ensureEstado().catch(()=>{ S.registered=false; }); }
    loadNames(); render(); }, err=>{ S.notice='Não foi possível carregar os pontos de vida ('+h(err.code)+').'; render(); }));
  roleUnsubs.push(store.onRequests(m=>{ S.reqDocs=m||{}; loadNames(); render(); }, err=>{ S.notice='Não foi possível carregar as solicitações ('+h(err.code)+').'; render(); }));
}
async function init(){
  S.draft=newDraft(); render();
  let db=null, user=null;
  if (window.claude && typeof window.claude.use==='function'){
    try {
      const timeout=new Promise(r=>setTimeout(()=>r([null,null]),10000));
      [db,user] = await Promise.race([Promise.all([window.claude.use('db'), window.claude.use('user')]), timeout]);
    } catch { db=null; user=null; }
  }
  let id=null;
  if (db && user){ try { id=await user.id(); } catch {} }
  if (db && user && id){
    S.mode='db'; S.user=user; S.myId=id;
    /* Mestre = dono do app. Jogadores convidados de fora da organização só gravam dados como Editores, então Editor não basta para ser mestre. */
    try { S.isOwner = !!(await user.isOwner()); } catch { S.isOwner=false; }
    S.isMaster = S.isOwner;
    store=makeDbStore(db);
  } else {
    S.mode='local'; S.myId='demo-mestre'; S.isMaster=true; S.isOwner=true; S.loaded=true;
    S.notice='<b>Modo demonstração.</b> O banco compartilhado não está disponível nesta visualização, então os dados ficam só nesta aba. Use "Ver como" para testar o fluxo de jogador e mestre.';
    store=makeLocalStore();
  }
  MAS.start(S.mode==='db' ? db : null);
  AV.start(S.mode==='db' ? db : null);
  HB.start(S.mode==='db' ? db : null);
  EV.start(S.mode==='db' ? db : null);
  subscribe(); render();
}
init();
