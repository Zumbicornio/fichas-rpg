  ['Purificar Alimentos e Bebidas','Purify Food and Drink',1,'Transmutação · ritual','Ação','3 m (10 pés)','V, S','Instantânea','Todo alimento e bebida não mágicos numa esfera de 1,5 m de raio ficam livres de venenos e doenças.'],

  ['Flecha Ácida','Acid Arrow',2,'Evocação','Ação','27 m (90 pés)','V, S, M','Instantânea','Uma flecha verde voa até um alvo. Faça um ataque à distância com magia. Se acertar, o alvo sofre 4d4 de dano ácido na hora e mais 2d4 de dano ácido no fim do próximo turno dele. Se errar, a flecha respinga e causa metade do dano inicial.\nCírculos maiores: os dois danos aumentam em 1d4 por círculo acima do 2º.',['Flecha Ácida de Melf','Flecha Acida']],
  ['Alterar-se','Alter Self',2,'Transmutação','Ação','Pessoal','V, S','Concentração, até 1 hora','Você muda seu corpo. Escolha um efeito (pode trocar com a ação de Magia):\n• Adaptação aquática: ganha guelras e deslocamento de natação igual ao seu deslocamento.\n• Mudar a aparência: muda altura, peso, rosto, voz, cabelo e outros traços, mantendo o mesmo tipo de corpo.\n• Armas naturais: ganha garras, presas, chifres ou cascos. Seus ataques desarmados causam 1d6 de dano do tipo adequado e contam como mágicos.'],
  ['Mensageiro Animal','Animal Messenger',2,'Encantamento · ritual','Ação','9 m (30 pés)','V, S, M','24 horas','Uma Fera Miúda que você consiga ver leva uma mensagem de até 25 palavras a um lugar que você descrever, procurando a criatura que você indicar. Ela viaja cerca de 75 km por dia (voando) ou 40 km (andando). Ao chegar, entrega a mensagem com a sua voz.\nCírculos maiores: a duração aumenta 48 horas por círculo acima do 2º.'],
  ['Tranca Arcana','Arcane Lock',2,'Abjuração','Ação','Toque','V, S, M (pó de ouro de 25 PO, consumido)','Até ser dissipada','Você tranca magicamente uma porta, janela, portão, baú ou outra entrada fechada. Você e as criaturas que escolher abrem normalmente. Você pode definir uma senha que suspende a magia por 1 minuto. Fora isso, só abre se for quebrada ou se a magia for dissipada ou suprimida. A CD para arrombar ou forçar aumenta em 10.'],
  ['Augúrio','Augury',2,'Adivinhação · ritual','1 minuto','Pessoal','V, S, M (varetas, ossos ou cartas de 25 PO)','Instantânea','Você recebe um presságio sobre uma ação específica que pretende fazer nos próximos 30 minutos: Bem (bom resultado), Mal (mau resultado), Bem e mal, ou Indiferente. Se conjurar de novo antes de um descanso longo, há 25% de chance cumulativa de receber uma resposta aleatória.',['Augurio']],
  ['Chama Contínua','Continual Flame',2,'Evocação','Ação','Toque','V, S, M (pó de rubi de 50 PO, consumido)','Até ser dissipada','Uma chama do brilho de uma tocha surge num objeto que você tocar. Ela não esquenta nem consome oxigênio, e pode ser coberta ou escondida, mas não apagada.',['Chama Continua']],
  ['Detectar Pensamentos','Detect Thoughts',2,'Adivinhação','Ação','Pessoal','V, S, M','Concentração, até 1 minuto','Você sente a presença de mentes a até 9 m (não de criaturas sem mente). Com a ação de Magia, pode ler os pensamentos superficiais de uma criatura que consiga ver nesse alcance. Pode tentar ir mais fundo: o alvo faz um teste de resistência de Sabedoria; se falhar, você entende o raciocínio, o estado emocional e o que ocupa a mente dele. O alvo percebe a sondagem e pode usar a ação para tentar expulsar você, com um teste de Inteligência (Arcanismo) contra a sua CD.'],
  ['Aumentar/Reduzir','Enlarge/Reduce',2,'Transmutação','Ação','9 m (30 pés)','V, S, M','Concentração, até 1 minuto','Uma criatura ou objeto que você consiga ver muda de tamanho. Uma criatura relutante faz um teste de resistência de Constituição.\n• Aumentar: o alvo fica um tamanho maior, tem vantagem em testes de Força e testes de resistência de Força, e os ataques dele com arma ou desarmados causam +1d4 de dano.\n• Reduzir: o alvo fica um tamanho menor, tem desvantagem em testes de Força e testes de resistência de Força, e os ataques dele causam −1d4 de dano (mínimo 1).',['Aumentar Reduzir','Aumentar','Reduzir']],
  ['Convocar Corcel','Find Steed',2,'Conjuração','Ação','9 m (30 pés)','V, S','Instantânea','Você convoca um espírito na forma de uma montaria Grande, leal a você. Escolha a natureza dele: Celestial, Fada ou Corruptor. Ele usa o bloco de estatísticas de Corcel de Outro Mundo do livro, que melhora com o círculo da magia. Ele age na sua iniciativa e obedece aos seus comandos. Enquanto estiver montado, você pode fazer magias que mirem só você mirarem também o corcel. Se ele cair a 0 PV, desaparece. Você só pode ter um corcel por vez.',['Encontrar Montaria','Encontrar Corcel']],
  ['Encontrar Armadilhas','Find Traps',2,'Adivinhação','Ação','36 m (120 pés)','V, S','Instantânea','Você sente a presença de armadilhas ao alcance e na sua linha de visão, inclusive mágicas. Descobre que existe uma armadilha e o tipo geral do perigo, mas não onde ela está exatamente.'],
  ['Lâmina Flamejante','Flame Blade',2,'Evocação','Ação bônus','Pessoal','V, S, M','Concentração, até 10 minutos','Uma lâmina de fogo surge na sua mão livre. Ela emite luz plena num raio de 3 m e penumbra por mais 3 m. Com a ação de Magia, você faz um ataque corpo a corpo com magia usando a lâmina; se acertar, causa 3d6 de dano de fogo mais seu modificador de conjuração. Se você soltar a lâmina, ela some, mas você pode chamá-la de volta com uma ação bônus.',['Lamina Flamejante']],
  ['Repouso Tranquilo','Gentle Repose',2,'Necromancia · ritual','Ação','Toque','V, S, M','10 dias','Você toca um cadáver. Até a magia acabar, ele não apodrece e não pode virar morto-vivo. Os dias sob o efeito não contam no limite de tempo de magias como Reviver os Mortos.'],
  ['Lufada de Vento','Gust of Wind',2,'Evocação','Ação','Pessoal (linha de 18 m)','V, S, M','Concentração, até 1 minuto','Um vento forte sopra numa linha de 18 m de comprimento por 3 m de largura. Cada criatura que começa o turno na linha faz um teste de resistência de Força; se falhar, é empurrada 4,5 m na direção do vento. Andar contra o vento custa o dobro de movimento. O vento dispersa gases e vapores e apaga velas e tochas. Como ação bônus, você muda a direção da linha.',['Rajada de Vento']],
  ['Levitação','Levitate',2,'Transmutação','Ação','18 m (60 pés)','V, S, M','Concentração, até 10 minutos','Uma criatura ou objeto solto de até 250 kg sobe até 6 m e fica flutuando. Uma criatura relutante faz um teste de resistência de Constituição. O alvo só se move empurrando ou puxando algo fixo. Em cada turno seu, você pode subir ou descer o alvo até 6 m. Quando a magia acaba, ele desce flutuando até o chão.',['Levitar']],
  ['Localizar Animais ou Plantas','Locate Animals or Plants',2,'Adivinhação · ritual','Ação','Pessoal','V, S, M','Instantânea','Diga o nome de um tipo de Fera ou Planta. Você descobre a direção e a distância até a criatura ou planta desse tipo mais próxima, a até 8 km.'],
  ['Localizar Objeto','Locate Object',2,'Adivinhação','Ação','Pessoal','V, S, M','Concentração, até 10 minutos','Descreva ou diga o nome de um objeto que você conheça. Você sente a direção dele, se estiver a até 300 m. Também pode procurar o objeto mais próximo de um tipo, como uma joia ou uma espada. Uma camada de chumbo, mesmo fina, bloqueia a magia.'],
  ['Boca Encantada','Magic Mouth',2,'Ilusão · ritual','1 minuto','9 m (30 pés)','V, S, M (pó de jade de 10 PO, consumido)','Até ser dissipada','Você grava uma mensagem de até 25 palavras num objeto e define uma condição para ela ser dita, como "quando alguém se aproximar da porta". Quando a condição acontece, uma boca mágica aparece e fala a mensagem com a sua voz, por até 10 minutos.',['Boca Mágica']],
  ['Oração Curativa','Prayer of Healing',2,'Abjuração','10 minutos','9 m (30 pés)','V','Instantânea','Até cinco criaturas que fiquem ao alcance durante toda a conjuração recebem os benefícios de um descanso curto e recuperam 2d8 pontos de vida. Uma criatura só pode ser afetada de novo depois de terminar um descanso longo.\nCírculos maiores: +1d8 de cura por círculo acima do 2º.',['Oração de Cura']],
  ['Proteção contra Veneno','Protection from Poison',2,'Abjuração','Ação','Toque','V, S','1 hora','Você toca uma criatura e encerra a condição Envenenado nela. Até a magia acabar, ela tem vantagem nos testes de resistência para evitar ou encerrar a condição Envenenado e resistência a dano de veneno.'],
  ['Truque de Corda','Rope Trick',2,'Transmutação','Ação','Toque','V, S, M','1 hora','Você toca uma corda de até 18 m. A ponta dela sobe até ficar de pé no ar, e no topo surge uma entrada invisível para um espaço extradimensional que abriga até oito criaturas Médias. A corda pode ser puxada para dentro. Ataques e magias não atravessam a entrada. Quando a magia acaba, quem estiver lá dentro cai.'],
  ['Ver o Invisível','See Invisibility',2,'Adivinhação','Ação','Pessoal','V, S, M','1 hora','Até a magia acabar, você vê criaturas e objetos com a condição Invisível como se fossem visíveis, e enxerga o Plano Etéreo. Criaturas e objetos de lá parecem translúcidos.',['Ver o Invisivel']],
  ['Crescer Espinhos','Spike Growth',2,'Transmutação','Ação','45 m (150 pés)','V, S, M','Concentração, até 10 minutos','O chão numa esfera de 6 m de raio se enche de espinhos e vira terreno difícil. Uma criatura que entrar na área ou se mover dentro dela sofre 2d4 de dano perfurante a cada 1,5 m que percorrer. A área parece natural: quem não viu a magia sendo feita precisa de um teste de Sabedoria (Percepção) contra a sua CD para notar o perigo.',['Espinhos','Crescimento de Espinhos']],
  ['Vínculo de Proteção','Warding Bond',2,'Abjuração','Ação','Toque','V, S, M (dois anéis de platina de 50 PO, usados por vocês dois)','1 hora','Você toca uma criatura disposta e cria um elo místico. Até a magia acabar, ela ganha +1 na CA e nos testes de resistência e tem resistência a todo dano. Cada vez que ela sofrer dano, você sofre a mesma quantidade. A magia acaba se vocês ficarem a mais de 18 m de distância ou se você cair a 0 PV.',['Elo de Proteção','Vinculo de Protecao']],
  ['Zona da Verdade','Zone of Truth',2,'Encantamento','Ação','18 m (60 pés)','V, S','10 minutos','Cria uma esfera de 4,5 m de raio. Uma criatura que entra nela pela primeira vez num turno, ou começa o turno nela, faz um teste de resistência de Carisma. Se falhar, não consegue mentir de propósito enquanto estiver na área. Você sabe quem passou e quem falhou. A criatura afetada sabe que está sob a magia e pode evitar responder ou dar respostas evasivas.'],

  ['Animar Mortos','Animate Dead',3,'Necromancia','1 minuto','3 m (10 pés)','V, S, M','Instantânea','Escolha uma pilha de ossos ou o cadáver de um Humanoide Médio ou Pequeno. Ele se ergue como um Esqueleto (ossos) ou um Zumbi (cadáver) sob seu controle. Em cada turno seu, com uma ação bônus, você comanda mentalmente os mortos-vivos a até 18 m. O controle dura 24 horas. Para manter o controle, conjure a magia de novo sobre eles antes disso (cada conjuração reafirma o controle de até quatro).\nCírculos maiores: +2 mortos-vivos animados ou controlados por círculo acima do 3º.'],
  ['Rogar Maldição','Bestow Curse',3,'Necromancia','Ação','Toque','V, S','Concentração, até 1 minuto','A criatura tocada faz um teste de resistência de Sabedoria. Se falhar, sofre uma maldição à sua escolha:\n• Desvantagem em testes de atributo e de resistência de um atributo.\n• Desvantagem nas jogadas de ataque contra você.\n• Em cada turno, faz um teste de resistência de Sabedoria; se falhar, perde a ação.\n• Seus ataques e magias causam +1d8 de dano necrótico a ela.\nCírculos maiores: com espaço de 4º, dura até 10 minutos; 5º, até 8 horas; 7º, até 24 horas; 9º, até ser dissipada. A partir do 5º não precisa de concentração.',['Lançar Maldição','Maldição']],
  ['Piscar','Blink',3,'Transmutação','Ação','Pessoal','V, S','1 minuto','No fim de cada um dos seus turnos, você tem 50% de chance de sumir para o Plano Etéreo (o mestre combina o dado). Lá, só criaturas no Plano Etéreo podem afetar você, e você só as afeta. No início do seu próximo turno, você volta para um espaço vazio a até 3 m de onde sumiu.',['Piscadela']],
  ['Convocar Relâmpagos','Call Lightning',3,'Conjuração','Ação','36 m (120 pés)','V, S','Concentração, até 10 minutos','Uma nuvem de tempestade surge acima de você. Ao conjurar, e depois com a ação de Magia em cada turno, você faz cair um raio num ponto abaixo da nuvem: cada criatura a até 1,5 m dele faz um teste de resistência de Destreza; falha, 3d10 de dano elétrico; sucesso, metade. Se já houver uma tempestade ao ar livre, o dano aumenta em 1d10.\nCírculos maiores: +1d10 por círculo acima do 3º.',['Chamar Relâmpagos']],
  ['Clarividência','Clairvoyance',3,'Adivinhação','10 minutos','1,5 km','V, S, M (foco de 100 PO)','Concentração, até 10 minutos','Você cria um sensor invisível num lugar conhecido ou óbvio ao alcance, como dentro de uma sala do outro lado de uma porta. Escolha ver ou ouvir: você percebe pelo sensor como se estivesse lá. Com uma ação bônus, pode trocar entre ver e ouvir.',['Clarividencia']],
  ['Conjurar Animais','Conjure Animals',3,'Conjuração','Ação','18 m (60 pés)','V, S','Concentração, até 10 minutos','Você convoca espíritos que formam uma matilha Grande e intangível de animais num espaço vazio. Sempre que a matilha se mover a até 3 m de uma criatura que você consiga ver, ou uma criatura entrar ou terminar o turno a até 3 m dela, você pode forçar um teste de resistência de Destreza: falha, 3d10 de dano cortante. Cada criatura faz esse teste no máximo uma vez por turno. Você pode mover a matilha até 9 m em cada turno seu. Seus aliados têm vantagem em testes de resistência de Força enquanto estiverem a até 1,5 m dela.\nCírculos maiores: +1d10 por círculo acima do 3º.'],
  ['Criar Alimentos e Água','Create Food and Water',3,'Conjuração','Ação','9 m (30 pés)','V, S','Instantânea','Você cria cerca de 20 kg de comida e 120 litros de água, o bastante para quinze Humanoides ou cinco montarias por 24 horas. A comida estraga se não for comida em 24 horas; a água não estraga.',['Criar Comida e Água']],
  ['Forma Gasosa','Gaseous Form',3,'Transmutação','Ação','Toque','V, S, M','Concentração, até 1 hora','Uma criatura disposta que você tocar vira uma nuvem de névoa, com o que estiver vestindo e carregando. Ela ganha deslocamento de voo de 3 m, pode pairar, tem resistência a dano de concussão, perfurante e cortante, tem vantagem em testes de resistência de Força, Destreza e Constituição e passa por frestas estreitas. Não pode falar, manipular objetos, atacar nem conjurar magias.'],
  ['Glifo de Vigilância','Glyph of Warding',3,'Abjuração','1 hora','Toque','V, S, M (pó de diamante de 200 PO, consumido)','Até ser dissipado ou ativado','Você grava um glifo numa superfície ou objeto fechado e define o que o ativa. Escolha:\n• Runas explosivas: ao ativar, explodem numa esfera de 6 m de raio; teste de resistência de Destreza; falha, 5d8 de dano (ácido, elétrico, fogo, frio ou trovejante, à sua escolha); sucesso, metade.\n• Glifo de magia: guarda uma magia de até 3º círculo, que é solta quando o glifo é ativado.\nO glifo é quase invisível: encontrá-lo exige um teste de Inteligência (Investigação) contra a sua CD.\nCírculos maiores: +1d8 nas runas, e o glifo de magia guarda magias do mesmo círculo do espaço usado.',['Glifo de Proteção']],
  ['Círculo Mágico','Magic Circle',3,'Abjuração','1 minuto','3 m (10 pés)','V, S, M (sal e pó de prata de 100 PO, consumidos)','1 hora','Você cria um cilindro de 3 m de raio e 6 m de altura. Escolha tipos de criatura: Celestiais, Elementais, Fadas, Corruptores ou Mortos-vivos. Elas não conseguem entrar no cilindro por meios não mágicos (para se teletransportar para dentro, precisam passar num teste de resistência de Carisma), têm desvantagem em ataques contra quem está dentro e não podem possuir, enfeitiçar ou amedrontar quem está dentro. Você pode inverter o círculo para prender uma criatura lá dentro.\nCírculos maiores: +1 hora por círculo acima do 3º.',['Circulo Magico']],
  ['Imagem Maior','Major Image',3,'Ilusão','Ação','36 m (120 pés)','V, S, M','Concentração, até 10 minutos','Você cria a imagem de um objeto, criatura ou fenômeno que caiba num cubo de 6 m. Ela parece real, com sons, cheiros e temperatura, mas não causa dano. Com a ação de Magia, você move a imagem e muda sua aparência. Qualquer toque atravessa a imagem. Uma criatura pode usar a ação de Estudar e fazer um teste de Inteligência (Investigação) contra a sua CD para perceber a ilusão.\nCírculos maiores: com espaço de 4º círculo ou maior, dura até ser dissipada, sem concentração.'],
  ['Fundir-se às Rochas','Meld into Stone',3,'Transmutação · ritual','Ação','Toque','V, S','8 horas','Você entra num bloco de pedra grande o bastante para conter seu corpo, levando o que estiver vestindo e carregando. Lá dentro, ninguém vê você, e você ouve o que acontece fora. Você pode sair a qualquer momento. Dano pequeno na pedra não o afeta, mas se ela for destruída ou muito danificada, você é expulso e sofre dano.',['Mesclar-se às Rochas','Fundir-se a Pedra']],
  ['Não Detecção','Nondetection',3,'Abjuração','Ação','Toque','V, S, M (pó de diamante de 25 PO, consumido)','8 horas','Uma criatura disposta, um lugar ou um objeto de até 3 m que você tocar fica escondido de magias de adivinhação. Ele não pode ser alvo dessas magias nem percebido por sensores mágicos de vidência.',['Nao Deteccao','Indetectável']],
  ['Corcel Fantasma','Phantom Steed',3,'Ilusão · ritual','1 minuto','9 m (30 pés)','V, S','1 hora','Um cavalo Grande e semirreal aparece, com sela e rédeas. Você ou uma criatura escolhida pode montá-lo. Ele tem deslocamento de 30 m e viaja cerca de 16 km por hora. A magia acaba se ele sofrer dano ou se você usar uma ação para dispensá-lo.',['Montaria Fantasma']],
  ['Crescimento de Plantas','Plant Growth',3,'Transmutação','Ação ou 8 horas','45 m (150 pés)','V, S','Instantânea','Escolha:\n• Crescimento (ação): as plantas num raio de 30 m ficam tão densas que cada 30 cm de movimento ali custa 1,2 m. Você pode deixar áreas livres.\n• Enriquecimento (8 horas): as plantas num raio de 800 m ficam férteis e produzem o dobro por um ano.'],
  ['Enviar Mensagem','Sending',3,'Adivinhação','Ação','Ilimitado','V, S, M','Instantânea','Você manda uma mensagem de até 25 palavras a uma criatura que você conheça. Ela ouve a mensagem na mente, reconhece você e pode responder com até 25 palavras na hora. Se ela estiver em outro plano, há 5% de chance de a mensagem não chegar.',['Enviar Mensagens']],
  ['Tempestade de Granizo','Sleet Storm',3,'Conjuração','Ação','45 m (150 pés)','V, S, M','Concentração, até 1 minuto','Chuva congelante cai num cilindro de 12 m de raio e 6 m de altura. A área fica totalmente obscurecida e vira terreno difícil, e chamas expostas se apagam. Uma criatura que entra na área ou começa o turno nela faz um teste de resistência de Destreza; se falhar, fica Caída. Quem estiver concentrado numa magia dentro da área faz um teste de Constituição contra a sua CD ou perde a concentração.',['Tempestade de Neve','Tempestade de Gelo e Neve']],
  ['Falar com os Mortos','Speak with Dead',3,'Necromancia','Ação','3 m (10 pés)','V, S, M','10 minutos','Um cadáver que ainda tenha boca responde até cinco perguntas suas. Ele só sabe o que sabia em vida, pode responder de forma enigmática e não é obrigado a dizer a verdade se for hostil. A magia não funciona no mesmo cadáver de novo por 10 dias.'],
  ['Falar com as Plantas','Speak with Plants',3,'Transmutação','Ação','Pessoal (raio de 9 m)','V, S','10 minutos','As plantas a até 9 m ganham uma consciência limitada e podem se comunicar com você e obedecer a comandos simples. Você pode perguntar sobre o que aconteceu ali no último dia e fazer as plantas abrirem caminho em terreno difícil, ou o contrário.'],
  ['Nuvem Fétida','Stinking Cloud',3,'Conjuração','Ação','27 m (90 pés)','V, S, M','Concentração, até 1 minuto','Uma esfera de gás amarelo e nauseante de 6 m de raio aparece. A área fica totalmente obscurecida. Cada criatura que começa o turno na esfera faz um teste de resistência de Constituição; se falhar, fica Envenenada até o fim do turno e, enquanto isso, não pode usar ação nem ação bônus. Um vento forte dispersa a nuvem.',['Nuvem Fetida']],
  ['Cabana','Tiny Hut',3,'Evocação · ritual','1 minuto','Pessoal (hemisfério de 3 m)','V, S, M','8 horas','Uma cúpula de força de 3 m de raio surge à sua volta e fica parada. Cabem até nove criaturas Médias. Criaturas e objetos que estavam dentro saem e entram à vontade; outros não atravessam. Magias e efeitos mágicos não passam pela cúpula. Lá dentro o clima é agradável, e você escolhe se a cúpula é transparente ou opaca. A magia acaba se você sair.',['Pequena Cabana de Leomund','Cabana de Leomund','Pequena Cabana','Pequeno Refúgio de Leomund','Refúgio de Leomund','Pequeno Refúgio']],
  ['Idiomas','Tongues',3,'Adivinhação','Ação','Toque','V, M','1 hora','A criatura tocada entende qualquer idioma falado que ouvir e, quando fala, é entendida por qualquer criatura que conheça pelo menos um idioma.',['Línguas']],
  ['Andar na Água','Water Walk',3,'Transmutação · ritual','Ação','9 m (30 pés)','V, S, M','1 hora','Até dez criaturas dispostas que você consiga ver podem andar sobre qualquer superfície líquida, como água, ácido, lama, neve ou lava, como se fosse chão firme (a lava ainda causa dano pelo calor). Uma criatura submersa sobe até a superfície a 18 m por rodada.',['Caminhar sobre a Água','Andar sobre as Águas']],
  ['Muralha de Vento','Wind Wall',3,'Evocação','Ação','36 m (120 pés)','V, S, M','Concentração, até 1 minuto','Uma muralha de vento forte surge, com até 15 m de comprimento, 4,5 m de altura e 30 cm de espessura. Quando ela aparece, cada criatura na área faz um teste de resistência de Força: falha, 3d8 de dano de concussão; sucesso, metade. O vento afasta neblina, fumaça e outros gases, impede a passagem de criaturas ou objetos voadores Pequenos ou menores, e flechas, virotes e outras munições comuns que tentam atravessá-la são desviadas e erram.',['Parede de Vento']]
);

  ['Porta Dimensional','Dimension Door',4,'Conjuração','Ação','150 m (500 pés)','V','Instantânea','Você se teletransporta para um lugar ao alcance que consiga ver, ou que descreva (como "150 m para baixo" ou "60 m a noroeste"). Pode levar junto uma criatura disposta a até 1,5 m, do tamanho seu ou menor. Se o destino estiver ocupado, cada um sofre 4d6 de dano de energia e o teletransporte falha.'],
  ['Adivinhação','Divination',4,'Adivinhação · ritual','Ação','Pessoal','V, S, M (incenso de 25 PO, consumido)','Instantânea','Você faz uma pergunta sobre um objetivo, evento ou atividade que vai acontecer nos próximos 7 dias e recebe uma resposta verdadeira, que pode ser uma frase curta, um verso enigmático ou um presságio. Se conjurar de novo antes de um descanso longo, há 25% de chance cumulativa de não receber resposta.',['Adivinhacao']],
  ['Dominar Fera','Dominate Beast',4,'Encantamento','Ação','18 m (60 pés)','V, S','Concentração, até 1 minuto','Uma Fera que você consiga ver faz um teste de resistência de Sabedoria, com vantagem se você ou aliados estiverem lutando contra ela. Se falhar, fica Enfeitiçada. Enquanto estiverem no mesmo plano, você dá ordens telepáticas e ela obedece. Você pode controlar cada ação dela diretamente usando sua reação. Sempre que sofrer dano, ela repete o teste.\nCírculos maiores: dura até 10 minutos com 5º círculo, até 1 hora com 6º e até 8 horas com 7º ou maior.'],

  ['Cão Fiel','Faithful Hound',4,'Conjuração','Ação','9 m (30 pés)','V, S, M','8 horas','Um cão de guarda invisível surge num espaço vazio e fica lá. Quando uma criatura Pequena ou maior chega a até 9 m dele sem dizer a senha que você definiu, ele late alto. Ele vê criaturas invisíveis e o Plano Etéreo. No início de cada turno seu, ele morde uma criatura hostil a até 1,5 m: faça um ataque corpo a corpo com magia; se acertar, causa 4d8 de dano de energia.',['Cão Fiel de Mordenkainen','Cao Fiel']],
  ['Escudo de Fogo','Fire Shield',4,'Evocação','Ação','Pessoal','V, S, M','10 minutos','Chamas finas envolvem você, emitindo luz plena num raio de 3 m e penumbra por mais 3 m. Escolha:\n• Escudo quente: você tem resistência a frio.\n• Escudo frio: você tem resistência a fogo.\nSempre que uma criatura a até 1,5 m acertar você com um ataque corpo a corpo, sofre 2d8 de dano de fogo (escudo quente) ou de frio (escudo frio).'],
  ['Liberdade de Movimento','Freedom of Movement',4,'Abjuração','Ação','Toque','V, S, M','1 hora','Até a magia acabar, o movimento da criatura tocada não é afetado por terreno difícil, e magias e efeitos mágicos não podem reduzir o deslocamento dela nem deixá-la Paralisada ou Contida. Ela pode gastar 1,5 m de movimento para escapar de amarras não mágicas ou de um agarrão. Debaixo d\'água, não sofre penalidade de movimento nem de ataque.\nCírculos maiores: +1 criatura por círculo acima do 4º.'],
  ['Inseto Gigante','Giant Insect',4,'Conjuração','Ação','18 m (60 pés)','V, S','Concentração, até 10 minutos','Você convoca o espírito de uma centopeia, aranha ou vespa gigante, que usa o bloco de estatísticas de Inseto Gigante do livro (melhora com o círculo da magia). Ele é seu aliado, age logo depois de você na iniciativa e obedece aos seus comandos.'],
  ['Invisibilidade Maior','Greater Invisibility',4,'Ilusão','Ação','Toque','V, S','Concentração, até 1 minuto','A criatura tocada fica Invisível até a magia acabar, mesmo se atacar ou conjurar magias.',['Invisibilidade Maior (Greater)']],
  ['Guardião da Fé','Guardian of Faith',4,'Conjuração','Ação','9 m (30 pés)','V','8 horas','Um guardião espectral Grande aparece num espaço vazio ao alcance e fica lá. Quando um inimigo entra pela primeira vez num turno a até 3 m dele, ou começa o turno lá, faz um teste de resistência de Destreza: falha, 20 de dano radiante; sucesso, metade. O guardião some depois de causar 60 de dano no total.',['Guardiao da Fe']],

  ['Moldar Rochas','Stone Shape',4,'Transmutação','Ação','Toque','V, S, M','Instantânea','Você toca um objeto de pedra Médio ou menor, ou uma seção de pedra de até 1,5 m em qualquer dimensão, e dá a ela a forma que quiser: uma arma, uma estátua, um baú, uma passagem, uma porta lacrada. Peças móveis simples são possíveis, mas não mecanismos.',['Moldar Pedra']],
  ['Pele de Pedra','Stoneskin',4,'Abjuração','Ação','Toque','V, S, M (pó de diamante de 100 PO, consumido)','Concentração, até 1 hora','Até a magia acabar, a criatura disposta tocada tem resistência a dano de concussão, perfurante e cortante.'],
  ['Muralha de Fogo','Wall of Fire',4,'Evocação','Ação','36 m (120 pés)','V, S, M','Concentração, até 1 minuto','Uma muralha de fogo surge no chão: até 18 m de comprimento, 6 m de altura e 30 cm de espessura, ou um anel de 6 m de diâmetro. A área fica levemente obscurecida. Quando ela aparece, cada criatura na área faz um teste de resistência de Destreza: falha, 5d8 de dano de fogo; sucesso, metade. Um lado da muralha (à sua escolha) causa 5d8 de dano de fogo a quem terminar o turno a até 3 m dele ou dentro da muralha, e a quem entrar nela pela primeira vez num turno.\nCírculos maiores: +1d8 por círculo acima do 4º.',['Parede de Fogo']]

  ['Conjurar Elemental','Conjure Elemental',5,'Conjuração','Ação','18 m (60 pés)','V, S','Concentração, até 10 minutos','Você convoca um espírito elemental Grande (ar, terra, fogo ou água) num espaço vazio. Quando uma criatura que você consiga ver entra no espaço dele ou começa o turno a até 1,5 m dele, você pode forçar um teste de resistência de Destreza: se falhar, sofre 8d8 de dano do elemento (elétrico, trovejante, fogo ou frio) e pode ficar Contida pelo espírito. Confira os detalhes de cada elemento no livro.\nCírculos maiores: +2d8 por círculo acima do 5º.'],

  ['Dominar Pessoa','Dominate Person',5,'Encantamento','Ação','18 m (60 pés)','V, S','Concentração, até 1 minuto','Um Humanoide que você consiga ver faz um teste de resistência de Sabedoria, com vantagem se você ou aliados estiverem lutando contra ele. Se falhar, fica Enfeitiçado. Enquanto estiverem no mesmo plano, você dá ordens telepáticas e ele obedece. Você pode controlar cada ação dele diretamente usando sua reação. Sempre que sofrer dano, ele repete o teste.\nCírculos maiores: dura até 10 minutos com 6º círculo, até 1 hora com 7º e até 8 horas com 8º ou maior.'],
  ['Sonho','Dream',5,'Ilusão','1 minuto','Especial','V, S, M','8 horas','Você, ou uma criatura disposta que você tocar, entra nos sonhos de uma criatura conhecida no mesmo plano e pode conversar com ela enquanto ela dorme. Você também pode criar um pesadelo: o alvo faz um teste de resistência de Sabedoria e, se falhar, sofre 3d6 de dano psíquico ao acordar e não recebe os benefícios do descanso.'],
  ['Coluna de Chamas','Flame Strike',5,'Evocação','Ação','18 m (60 pés)','V, S, M','Instantânea','Uma coluna de fogo divino desce num cilindro de 3 m de raio e 12 m de altura. Cada criatura na área faz um teste de resistência de Destreza: falha, 5d6 de dano de fogo e 5d6 de dano radiante; sucesso, metade.\nCírculos maiores: +1d6 de fogo e +1d6 radiante por círculo acima do 5º.',['Golpe Flamejante','Coluna de Chama']],
  ['Missão','Geas',5,'Encantamento','1 minuto','18 m (60 pés)','V','30 dias','Você dá uma ordem a uma criatura que consiga ver e que entenda você. Ela faz um teste de resistência de Sabedoria e, se falhar, fica Enfeitiçada e obrigada a cumprir a ordem. Sempre que agir contra a ordem, sofre 5d10 de dano psíquico, no máximo uma vez por dia. Uma ordem suicida encerra a magia.\nCírculos maiores: dura 1 ano com 7º ou 8º círculo, e até ser dissipada com 9º.',['Missao','Geas']],
  ['Restauração Maior','Greater Restoration',5,'Abjuração','Ação','Toque','V, S, M (pó de diamante de 100 PO, consumido)','Instantânea','Você toca uma criatura e desfaz um destes efeitos: 1 nível de Exaustão; a condição Enfeitiçado ou Petrificado; uma maldição, inclusive a sintonização com um item amaldiçoado; qualquer redução num valor de atributo; ou qualquer redução no máximo de pontos de vida.',['Restauracao Maior']],
  ['Consagrar','Hallow',5,'Abjuração','24 horas','Toque','V, S, M (ervas e óleos de 1.000 PO, consumidos)','Até ser dissipada','Você consagra uma área de até 18 m de raio. Celestiais, Elementais, Fadas, Corruptores e Mortos-vivos (os tipos que você escolher) não conseguem entrar na área nem enfeitiçar, amedrontar ou possuir quem estiver nela. Você também prende à área um efeito extra, como coragem, escuridão, luz do dia, proteção ou vulnerabilidade a um tipo de dano, descanso eterno dos mortos, interferência extradimensional, medo, silêncio ou idiomas (veja o livro).'],
  ['Imobilizar Monstro','Hold Monster',5,'Encantamento','Ação','27 m (90 pés)','V, S, M','Concentração, até 1 minuto','Uma criatura que você consiga ver faz um teste de resistência de Sabedoria. Se falhar, fica Paralisada até a magia acabar. No fim de cada turno dela, repete o teste; se passar, a magia acaba.\nCírculos maiores: +1 criatura por círculo acima do 5º.',['Paralisar Monstro']],
  ['Praga de Insetos','Insect Plague',5,'Conjuração','Ação','90 m (300 pés)','V, S, M','Concentração, até 10 minutos','Um enxame de gafanhotos enche uma esfera de 6 m de raio. A área fica levemente obscurecida e vira terreno difícil. Quando o enxame aparece, cada criatura nele faz um teste de resistência de Constituição: falha, 4d10 de dano perfurante; sucesso, metade. O mesmo vale para quem entra na área pela primeira vez num turno ou termina o turno nela.\nCírculos maiores: +1d10 por círculo acima do 5º.'],
  ['Lenda','Legend Lore',5,'Adivinhação','10 minutos','Pessoal','V, S, M (incenso de 250 PO, consumido, e quatro tiras de marfim de 50 PO)','Instantânea','Diga o nome ou descreva uma pessoa, lugar ou objeto famoso. Você recebe um resumo das lendas importantes sobre ele, que podem ser histórias, canções ou fatos esquecidos. Quanto mais você souber, mais precisa a informação. Se não for algo lendário, você não descobre nada.',['Conhecimento Lendário','Lendas e Histórias']],
  ['Curar Ferimentos em Massa','Mass Cure Wounds',5,'Abjuração','Ação','18 m (60 pés)','V, S','Instantânea','Até seis criaturas numa esfera de 9 m de raio recuperam, cada uma, 5d8 + seu modificador de conjuração em pontos de vida.\nCírculos maiores: +1d8 por círculo acima do 5º.',['Curar Feridas em Massa']],
  ['Despistar','Mislead',5,'Ilusão','Ação','Pessoal','S','Concentração, até 1 hora','Você fica Invisível e uma cópia ilusória sua aparece no seu lugar. A invisibilidade acaba se você atacar ou conjurar uma magia. Como ação bônus, você move a cópia até 18 m e controla os gestos e a fala dela, e pode ver e ouvir pelos sentidos dela (ficando cego e surdo para o que está à sua volta).',['Ilusão Enganosa']],
  ['Modificar Memória','Modify Memory',5,'Encantamento','Ação','9 m (30 pés)','V, S','Concentração, até 1 minuto','Uma criatura que você consiga ver faz um teste de resistência de Sabedoria, com vantagem se estiver lutando contra você. Se falhar, fica Enfeitiçada e Incapacitada, sem perceber o que está acontecendo. Enquanto isso, você pode apagar ou alterar a lembrança que ela tem de um evento das últimas 24 horas que durou até 10 minutos. A mudança precisa fazer algum sentido para ela.\nCírculos maiores: pode alterar memórias de até 7 dias (6º), 30 dias (7º), 1 ano (8º) ou qualquer época (9º).'],
  ['Passagem','Passwall',5,'Transmutação','Ação','9 m (30 pés)','V, S, M','1 hora','Uma passagem de até 1,5 m de largura, 2,4 m de altura e 6 m de profundidade se abre numa superfície de madeira, gesso ou pedra que você consiga ver. Quando a magia acaba, quem estiver dentro é empurrado para fora com segurança.',['Passar pela Parede']],
  ['Vínculo Planar','Planar Binding',5,'Abjuração','1 hora','18 m (60 pés)','V, S, M (joia de 1.000 PO, consumida)','24 horas','Você tenta prender a seu serviço um Celestial, Elemental, Fada ou Corruptor ao alcance (que costuma estar preso num círculo mágico). Ele faz um teste de resistência de Carisma; se falhar, precisa servir você até a magia acabar, seguindo suas ordens da melhor forma possível.\nCírculos maiores: dura 10 dias (6º), 30 dias (7º), 180 dias (8º) ou 1 ano e 1 dia (9º).'],
  ['Reviver os Mortos','Raise Dead',5,'Necromancia','1 hora','Toque','V, S, M (diamante de 500 PO, consumido)','Instantânea','Você traz de volta à vida uma criatura que morreu há no máximo 10 dias, se a alma dela quiser voltar. Ela volta com 1 ponto de vida. A magia neutraliza venenos, mas não doenças mágicas, maldições nem partes do corpo perdidas, e não funciona em mortos-vivos nem em quem morreu de velhice. Ao voltar, a criatura sofre −4 em todos os Testes de D20, e a penalidade diminui 1 a cada descanso longo.',['Reviver Mortos','Ressuscitar os Mortos']],
  ['Vidência','Scrying',5,'Adivinhação','10 minutos','Pessoal','V, S, M (foco de 1.000 PO)','Concentração, até 10 minutos','Você vê e ouve uma criatura específica no mesmo plano. Ela faz um teste de resistência de Sabedoria, modificado pelo quanto você a conhece e pela ligação que tem com ela (retrato, objeto pessoal, parte do corpo). Se falhar, um sensor invisível aparece perto dela e segue os movimentos dela. Se passar, você não pode tentar de novo por 24 horas. Também pode mirar um lugar que você já tenha visto.',['Videncia']],
  ['Semblante','Seeming',5,'Ilusão','Ação','9 m (30 pés)','V, S','8 horas','Você muda a aparência de qualquer número de criaturas que consiga ver, inclusive roupas e equipamentos. Uma criatura relutante faz um teste de resistência de Carisma. Cada aparência pode ficar até 30 cm mais alta ou mais baixa. A ilusão não resiste ao toque. Uma criatura pode usar a ação de Estudar com teste de Inteligência (Investigação) contra a sua CD para perceber.',['Aparência','Disfarce em Grupo']],
  ['Telecinese','Telekinesis',5,'Transmutação','Ação','18 m (60 pés)','V, S','Concentração, até 10 minutos','Ao conjurar, e depois com a ação de Magia, você move com a mente uma criatura Enorme ou menor ou um objeto de até 500 kg ao alcance:\n• Criatura: ela faz um teste de resistência de Força; se falhar, você a move até 9 m (até o limite do alcance), e ela fica Contida até o fim do seu próximo turno.\n• Objeto: você o move até 9 m. Se alguém estiver segurando, faz um teste contra a sua CD. Você pode manipular o objeto com precisão.'],
  ['Vínculo Telepático','Telepathic Bond',5,'Adivinhação · ritual','Ação','9 m (30 pés)','V, S, M','1 hora','Até oito criaturas dispostas que você escolher ficam ligadas por telepatia. Até a magia acabar, elas se comunicam mentalmente em qualquer distância, desde que estejam no mesmo plano, mesmo sem falar o mesmo idioma.',['Elo Telepático de Rary','Elo Telepático','Vinculo Telepatico']],
  ['Círculo de Teletransporte','Teleportation Circle',5,'Conjuração','1 minuto','3 m (10 pés)','V, M (giz e tintas de 50 PO, consumidos)','1 rodada','Você desenha um círculo de 3 m de diâmetro ligado a um círculo de teletransporte permanente cuja sequência de símbolos você conhece, no mesmo plano. Um portal se abre até o fim do seu próximo turno, e quem entrar nele aparece a até 1,5 m do círculo de destino.',['Circulo de Teletransporte']],
  ['Caminhar em Árvores','Tree Stride',5,'Conjuração','Ação','Pessoal','V, S','Concentração, até 1 minuto','Você pode entrar numa árvore e sair de outra do mesmo tipo a até 150 m. As duas precisam ser vivas e pelo menos do seu tamanho. Entrar e sair custa 1,5 m de movimento. Pode fazer isso uma vez por turno até a magia acabar.',['Andar em Árvores','Passos de Árvore']],
  ['Muralha de Energia','Wall of Force',5,'Evocação','Ação','36 m (120 pés)','V, S, M','Concentração, até 10 minutos','Uma muralha invisível de força surge: uma cúpula ou esfera de até 3 m de raio, ou uma superfície de até dez painéis de 3 m por 3 m ligados entre si. Nada atravessa a muralha fisicamente. Ela é imune a todo dano e não pode ser dissipada por Dissipar Magia, mas Desintegrar a destrói na hora. Ela também se estende ao Plano Etéreo.',['Muralha de Força','Parede de Força']],
  ['Muralha de Pedra','Wall of Stone',5,'Evocação','Ação','36 m (120 pés)','V, S, M','Concentração, até 10 minutos','Uma muralha de pedra surge: dez painéis de 3 m por 3 m com 15 cm de espessura (ou dez de 3 m por 6 m com 7,5 cm). Quem estiver no espaço dela é empurrado para um lado (teste de resistência de Destreza para escolher o lado). Cada painel tem CA 15 e 30 PV a cada 2,5 cm de espessura. Se você mantiver a concentração pela duração inteira, a muralha fica permanente.',['Parede de Pedra']]
);

  ['Conjurar Fada','Conjure Fey',6,'Conjuração','Ação','18 m (60 pés)','V, S','Concentração, até 10 minutos','Você convoca um espírito feérico Médio num espaço vazio. Ao conjurar, e como ação bônus nos turnos seguintes, você pode teletransportá-lo até 9 m e fazer um ataque corpo a corpo com magia contra uma criatura a até 1,5 m dele: se acertar, causa 3d12 + seu modificador de conjuração de dano psíquico, e o alvo fica Amedrontado até o início do seu próximo turno.\nCírculos maiores: +2d12 por círculo acima do 6º.'],

  ['Desintegrar','Disintegrate',6,'Transmutação','Ação','18 m (60 pés)','V, S, M','Instantânea','Um raio verde atinge uma criatura ou objeto que você consiga ver. Uma criatura faz um teste de resistência de Destreza; se falhar, sofre 10d6 + 40 de dano de energia. Se esse dano a levar a 0 PV, ela vira pó, e só Ressurreição Verdadeira ou Desejo a trazem de volta. Um objeto não mágico Grande ou menor, ou uma criação de força, é desintegrado sem teste. Em algo Enorme ou maior, a magia desintegra um cubo de 3 m.\nCírculos maiores: +3d6 por círculo acima do 6º.'],
  ['Mau-Olhado','Eyebite',6,'Necromancia','Ação','Pessoal','V, S','Concentração, até 1 minuto','Seus olhos viram poços escuros. Ao conjurar, e com a ação de Magia nos turnos seguintes, escolha uma criatura a até 18 m que consiga ver você. Ela faz um teste de resistência de Sabedoria; se falhar, sofre um efeito à sua escolha:\n• Adormecer: fica Inconsciente até sofrer dano ou alguém acordá-la.\n• Pânico: fica Amedrontada e, nos turnos dela, faz Disparada para longe de você.\n• Enjoo: fica Envenenada.',['Mau Olhado','Olhar Debilitante']],
  ['Encontrar o Caminho','Find the Path',6,'Adivinhação','1 minuto','Pessoal','V, S, M (ferramentas de adivinhação de 100 PO)','Concentração, até 1 dia','Diga o nome de um lugar fixo que você conheça, no mesmo plano. Até a magia acabar, você sabe a direção e o caminho mais curto e direto até ele, inclusive qual porta ou bifurcação escolher.'],
  ['Carne para Pedra','Flesh to Stone',6,'Transmutação','Ação','18 m (60 pés)','V, S, M','Concentração, até 1 minuto','Uma criatura que você consiga ver faz um teste de resistência de Constituição. Se falhar, fica Contida enquanto a carne endurece. No fim de cada turno dela, repete o teste: três sucessos encerram a magia; três falhas a deixam Petrificada. Se você mantiver a concentração pela duração inteira, a petrificação dura até ser desfeita (Restauração Maior, por exemplo).',['Carne em Pedra']],
  ['Proibição','Forbiddance',6,'Abjuração · ritual','10 minutos','Toque','V, S, M (pó de rubi de 1.000 PO, consumido)','1 dia','Você protege uma área de até 3.700 m² e 9 m de altura. Ninguém entra nela por teletransporte ou viagem entre planos. Escolha tipos de criatura (Aberrações, Celestiais, Elementais, Fadas, Corruptores ou Mortos-vivos): quando uma delas entra na área pela primeira vez num turno ou termina o turno lá, sofre 5d10 de dano radiante ou necrótico (à sua escolha). Conjurar no mesmo lugar todo dia por 30 dias torna o efeito permanente.',['Proibicao']],
  ['Esfera Congelante','Freezing Sphere',6,'Evocação','Ação','90 m (300 pés)','V, S, M','Instantânea','Um globo de energia gelada voa até um ponto ao alcance e explode numa esfera de 18 m de raio. Cada criatura na área faz um teste de resistência de Constituição: falha, 10d6 de dano de frio; sucesso, metade. Água na área congela. Você também pode guardar o globo, pronto para ser arremessado (por você ou outra pessoa) em até 1 minuto.\nCírculos maiores: +1d6 por círculo acima do 6º.',['Esfera Congelante de Otiluke']],
  ['Globo de Invulnerabilidade','Globe of Invulnerability',6,'Abjuração','Ação','Pessoal (emanação de 3 m)','V, S, M','Concentração, até 1 minuto','Uma barreira cintilante envolve você num raio de 3 m. Magias de 5º círculo ou menor conjuradas de fora da barreira não afetam nada dentro dela, mesmo com espaços maiores. Magias de dentro saem normalmente.\nCírculos maiores: a barreira bloqueia mais um círculo por círculo acima do 6º.'],
  ['Guardas e Proteções','Guards and Wards',6,'Abjuração','1 hora','Toque','V, S, M (cetro de prata de 10 PO)','24 horas','Você protege uma área de até 230 m² (até 6 m de altura) com várias defesas: corredores com névoa, portas com Tranca Arcana, escadas cobertas de teias, passagens que confundem quem anda por elas, e um efeito extra à sua escolha (luzes dançantes, boca encantada, nuvem fétida, lufada de vento ou sugestão). Conjurar todo dia por um ano torna o efeito permanente.'],
  ['Ferir','Harm',6,'Necromancia','Ação','18 m (60 pés)','V, S','Instantânea','Uma doença virulenta atinge uma criatura que você consiga ver. Ela faz um teste de resistência de Constituição: falha, 14d6 de dano necrótico e o máximo de pontos de vida dela é reduzido pelo mesmo valor; sucesso, metade do dano. Esta magia não reduz o alvo a menos de 1 PV.'],
  ['Cura Completa','Heal',6,'Abjuração','Ação','18 m (60 pés)','V, S','Instantânea','Uma criatura que você consiga ver recupera 70 pontos de vida. A magia também encerra as condições Cego, Surdo e Envenenado nela.\nCírculos maiores: +10 PV por círculo acima do 6º.',['Cura Plena']],
  ['Banquete dos Heróis','Heroes\' Feast',6,'Conjuração','10 minutos','Pessoal','V, S, M (cálice com joias de 1.000 PO, consumido)','Instantânea','Um banquete aparece e alimenta até doze criaturas. A refeição leva 1 hora. Depois dela, por 24 horas, quem comeu tem resistência a dano de veneno, fica imune às condições Amedrontado e Envenenado, e o máximo de pontos de vida aumenta 2d10 (e ganha essa mesma quantidade de PV).',['Banquete de Heróis']],
  ['Convocação Instantânea','Instant Summons',6,'Conjuração · ritual','1 minuto','Toque','V, S, M (safira de 1.000 PO)','Até ser dissipada','Você toca um objeto de até 5 kg e a safira, marcando os dois. Depois, com a ação de Magia, esmaga a safira dizendo o nome do objeto: ele aparece na sua mão, esteja onde estiver no mesmo plano. Se outra criatura estiver segurando ou carregando o objeto, você descobre quem é e onde está, mas ele não vem.',['Convocacao Instantanea']],

  ['Recipiente Arcano','Magic Jar',6,'Necromancia','1 minuto','Pessoal','V, S, M (gema ou cristal de 500 PO)','Até ser dissipada','Seu corpo cai em transe e sua alma vai para o recipiente. De lá, você pode tentar possuir um Humanoide a até 30 m: ele faz um teste de resistência de Carisma e, se falhar, sua alma toma o corpo dele, enquanto a alma dele fica presa no recipiente. Você usa as estatísticas físicas do corpo possuído e mantém as mentais. Se o recipiente for destruído, as almas voltam (ou morrem, se estiverem longe demais).',['Jarro Mágico']],
  ['Sugestão em Massa','Mass Suggestion',6,'Encantamento','Ação','18 m (60 pés)','V, M','24 horas','Você sugere um rumo de ação (em até 25 palavras) a até doze criaturas que consigam ouvir e entender você. A sugestão precisa parecer possível e não pode envolver nada claramente nocivo. Cada uma faz um teste de resistência de Sabedoria; quem falhar fica Enfeitiçada e segue a sugestão. A magia acaba para a criatura se você ou um aliado causar dano a ela.\nCírculos maiores: dura 10 dias (7º), 30 dias (8º) ou 1 ano e 1 dia (9º).'],
  ['Mover Terra','Move Earth',6,'Transmutação','Ação','150 m (500 pés)','V, S, M','Concentração, até 2 horas','Escolha uma área de terra, areia ou argila de até 12 m de lado. Você remodela o terreno: eleva ou abaixa o solo, cria ou aplaina valas, monta ou desmonta muros. As mudanças levam 10 minutos para acontecer. Depois disso, você pode escolher uma nova área. A magia não mexe com pedra nem construções, mas elas podem desabar se o terreno mudar debaixo delas.'],
  ['Aliado Planar','Planar Ally',6,'Conjuração','10 minutos','18 m (60 pés)','V, S','Instantânea','Você pede ajuda a uma entidade de outro mundo, que envia um Celestial, Elemental ou Corruptor leal a ela. A criatura não é obrigada a ajudar: você negocia o serviço e o pagamento, que depende da tarefa (ouro, itens mágicos ou um favor).'],
  ['Ilusão Programada','Programmed Illusion',6,'Ilusão','Ação','36 m (120 pés)','V, S, M (pó de jade de 25 PO)','Até ser dissipada','Você cria uma ilusão de objetos, criaturas e fenômenos num cubo de 9 m, com sons, e define uma condição que a ativa e o que ela faz por até 5 minutos. Quando a condição acontece, a ilusão aparece, faz a apresentação e some. Ela pode ser ativada de novo depois de 10 minutos. Uma criatura pode usar a ação de Estudar com teste de Inteligência (Investigação) contra a sua CD para perceber.'],
  ['Raio Solar','Sunbeam',6,'Evocação','Ação','Pessoal (linha de 18 m)','V, S, M','Concentração, até 1 minuto','Um feixe de luz solar sai da sua mão numa linha de 18 m por 1,5 m. Cada criatura na linha faz um teste de resistência de Constituição: falha, 6d8 de dano radiante e fica Cega até o início do seu próximo turno; sucesso, metade e não fica cega. Com a ação de Magia, você dispara uma nova linha em cada turno. Uma partícula de luz na sua mão emite luz plena num raio de 9 m (luz solar).',['Raio de Sol']],
  ['Transporte pelas Plantas','Transport via Plants',6,'Conjuração','Ação','3 m (10 pés)','V, S','1 rodada','Você liga uma planta inanimada Grande ou maior ao alcance a outra planta do mesmo tipo, em qualquer distância, no mesmo plano (você precisa já ter visto ou tocado a de destino). Até o fim do seu próximo turno, qualquer criatura pode entrar na primeira e sair da segunda gastando 1,5 m de movimento.'],
  ['Visão da Verdade','True Seeing',6,'Adivinhação','Ação','Toque','V, S, M (pó de cogumelo de 25 PO, consumido)','1 hora','A criatura tocada ganha Visão Verdadeira de 36 m: vê no escuro (normal e mágico), vê criaturas e objetos invisíveis, percebe ilusões visuais e passa no teste contra elas automaticamente, vê a forma verdadeira de metamorfos e de coisas transformadas por magia, e enxerga o Plano Etéreo.',['Visao da Verdade','Visão Verdadeira']],
  ['Muralha de Gelo','Wall of Ice',6,'Evocação','Ação','36 m (120 pés)','V, S, M','Concentração, até 10 minutos','Uma muralha de gelo surge: uma cúpula ou esfera de até 3 m de raio, ou dez painéis de 3 m por 3 m, com 30 cm de espessura. Quem estiver no espaço dela é empurrado para um lado e faz um teste de resistência de Destreza: falha, 10d6 de dano de frio; sucesso, metade. Cada painel tem CA 12 e 30 PV, e é vulnerável a fogo. Quando um painel é destruído, fica uma camada de ar gelado: quem a atravessa pela primeira vez num turno faz um teste de Constituição e sofre 5d6 de dano de frio (metade se passar).\nCírculos maiores: +2d6 no dano inicial e +1d6 no ar gelado por círculo acima do 6º.',['Parede de Gelo']],
  ['Muralha de Espinhos','Wall of Thorns',6,'Conjuração','Ação','36 m (120 pés)','V, S, M','Concentração, até 10 minutos','Uma muralha de arbustos espinhosos surge: até 18 m de comprimento, 3 m de altura e 1,5 m de espessura, ou um anel de 6 m de diâmetro. Ela bloqueia a visão. Quando aparece, cada criatura na área faz um teste de resistência de Destreza: falha, 7d8 de dano perfurante; sucesso, metade. Atravessar a muralha custa 1,2 m de movimento a cada 30 cm, e quem entra nela pela primeira vez num turno ou termina o turno nela faz um teste de Destreza: falha, 7d8 de dano cortante; sucesso, metade.\nCírculos maiores: +1d8 nos dois danos por círculo acima do 6º.',['Parede de Espinhos']],
  ['Caminhar no Vento','Wind Walk',6,'Transmutação','1 minuto','9 m (30 pés)','V, S, M','8 horas','Você e até dez criaturas dispostas viram nuvens de névoa. Nessa forma, cada uma tem deslocamento de voo de 90 m, pode pairar, tem resistência a dano de concussão, perfurante e cortante, e não pode falar, manipular objetos, atacar nem conjurar magias. Voltar à forma normal (ou virar nuvem de novo) leva 1 minuto, durante o qual a criatura fica Incapacitada.',['Andar no Vento','Caminhar com o Vento']],
  ['Palavra de Recordação','Word of Recall',6,'Conjuração','Ação','1,5 m (5 pés)','V','Instantânea','Você e até cinco criaturas dispostas a até 1,5 m são teletransportados para um santuário que você designou antes. O santuário precisa ter sido preparado conjurando esta magia lá, num lugar dedicado à sua divindade, como um templo.',['Palavra de Retorno']]

  ['Tempestade de Fogo','Fire Storm',7,'Evocação','Ação','45 m (150 pés)','V, S','Instantânea','Uma tempestade de chamas enche até dez cubos de 3 m, cada um encostado em pelo menos outro. Cada criatura na área faz um teste de resistência de Destreza: falha, 7d10 de dano de fogo; sucesso, metade. Você pode escolher que as plantas da área não sejam afetadas.'],
  ['Jaula de Energia','Forcecage',7,'Evocação','Ação','30 m (100 pés)','V, S, M (pó de rubi de 1.500 PO, consumido)','Concentração, até 1 hora','Uma prisão de força invisível e imóvel surge: uma gaiola de 6 m de lado com barras (que deixam passar coisas pequenas) ou uma caixa fechada de 3 m de lado. Quem estiver dentro não sai por meios não mágicos. Uma criatura que tente sair por teletransporte ou viagem entre planos precisa passar num teste de resistência de Carisma. A jaula não pode ser dissipada por Dissipar Magia.',['Jaula de Força','Prisão de Força']],

  ['Miragem Arcana','Mirage Arcane',7,'Ilusão','10 minutos','Visão','V, S','10 dias','Um terreno de até 1,5 km de lado parece, soa, cheira e até parece ao toque outro tipo de terreno: campos viram floresta, uma estrada vira pântano, uma encosta vira penhasco. As ilusões táteis são reais o bastante para criar terreno difícil, escalar ou nadar. Criaturas com Visão Verdadeira veem através da ilusão, mas ainda podem interagir fisicamente com ela.'],
  ['Mudança de Plano','Plane Shift',7,'Conjuração','Ação','Toque','V, S, M (forquilha de metal de 250 PO, sintonizada com um plano)','Instantânea','Você e até oito criaturas dispostas de mãos dadas em círculo são levados para outro plano de existência, chegando perto de um destino escolhido (um círculo de teletransporte conhecido, ou um lugar ao acaso no plano). Você também pode usar a magia contra uma criatura relutante: faça um ataque corpo a corpo com magia e, se acertar, ela faz um teste de resistência de Carisma; se falhar, é levada para um lugar aleatório do plano escolhido.',['Viagem Planar','Mudanca de Plano']],
  ['Spray Prismático','Prismatic Spray',7,'Evocação','Ação','Pessoal (cone de 18 m)','V, S','Instantânea','Oito raios de luz multicolorida saem da sua mão num cone de 18 m. Cada criatura no cone faz um teste de resistência de Destreza e rola 1d8 para saber qual raio a atinge:\n1 a 5 (vermelho, laranja, amarelo, verde, azul): 12d6 de dano de fogo, ácido, elétrico, veneno ou frio, respectivamente (metade se passar).\n6 (anil): se falhar, fica Contida e começa a virar pedra (três falhas em testes de Constituição a deixam Petrificada).\n7 (violeta): se falhar, fica Cega e pode ser levada para outro plano.\n8: é atingida por dois raios (role mais duas vezes).',['Rajada Prismática','Spray Prismatico']],
  ['Projetar Imagem','Project Image',7,'Ilusão','Ação','800 km','V, S, M (estatueta sua de 5 PO)','Concentração, até 1 dia','Você cria uma cópia ilusória de si mesmo num lugar que já tenha visto, a até 800 km. Pode ver e ouvir pelos olhos e ouvidos da cópia (ficando cego e surdo para o que está à sua volta), e mover e controlar a cópia com a ação de Magia. Ela parece real, mas toques a atravessam.'],
  ['Regenerar','Regenerate',7,'Transmutação','1 minuto','Toque','V, S, M (conta de oração e água benta)','1 hora','A criatura tocada recupera 4d8 + 15 pontos de vida. Até a magia acabar, recupera 1 PV no início de cada turno dela, e partes do corpo cortadas (dedos, pernas, cauda) crescem de novo depois de 2 minutos.',['Regeneração']],
  ['Ressurreição','Resurrection',7,'Necromancia','1 hora','Toque','V, S, M (diamante de 1.000 PO, consumido)','Instantânea','Você traz de volta à vida uma criatura que morreu há no máximo um século, que não tenha morrido de velhice e cuja alma queira voltar. Ela volta com todos os pontos de vida, sem venenos e doenças comuns, e com as partes do corpo perdidas restauradas. Ao voltar, sofre −4 em todos os Testes de D20, e a penalidade diminui 1 a cada descanso longo. Trazer de volta quem morreu há mais de 365 dias cansa você: até terminar um descanso longo, não pode conjurar magias e tem desvantagem em Testes de D20.',['Ressurreicao']],
  ['Inverter a Gravidade','Reverse Gravity',7,'Transmutação','Ação','30 m (100 pés)','V, S, M','Concentração, até 1 minuto','A gravidade se inverte num cilindro de 15 m de raio e 30 m de altura. Criaturas e objetos soltos na área caem para cima até o topo do cilindro (ou até bater em algo). Uma criatura pode fazer um teste de resistência de Destreza para se agarrar a algo fixo e não cair. Quando a magia acaba, tudo cai de volta.',['Gravidade Invertida']],
  ['Isolar','Sequester',7,'Transmutação','Ação','Toque','V, S, M (pó de diamante, esmeralda, rubi e safira de 5.000 PO, consumido)','Até ser dissipada','Uma criatura disposta ou um objeto tocado fica Invisível e não pode ser alvo de magias de adivinhação nem percebido por sensores de vidência. Uma criatura pode ficar em animação suspensa (não envelhece, não precisa comer nem respirar). Você pode definir uma condição que encerra a magia.',['Sequestrar']],

  ['Símbolo','Symbol',7,'Abjuração','1 minuto','Toque','V, S, M (pó de diamante de 1.000 PO, consumido)','Até ser dissipado ou ativado','Você grava um glifo numa superfície ou objeto e define o que o ativa. Quando ativado, ele afeta criaturas numa esfera de 18 m de raio por 10 minutos, com um destes efeitos (teste de resistência de Constituição ou Sabedoria, conforme o efeito): Morte (10d10 de dano necrótico, metade se passar), Discórdia, Medo, Dor (Incapacitada), Sono (Inconsciente), Atordoamento ou Desesperança. Encontrar o glifo exige um teste de Inteligência (Investigação) contra a sua CD.',['Simbolo']],
  ['Teletransporte','Teleport',7,'Conjuração','Ação','3 m (10 pés)','V','Instantânea','Você e até oito criaturas dispostas, ou um objeto, são levados para um destino no mesmo plano. Quanto melhor você conhecer o destino, maior a chance de acertar. Role 1d100 na tabela do livro: você pode chegar no lugar, perto dele, num lugar parecido, ou sofrer um acidente (3d10 de dano de energia e nova rolagem). Círculos permanentes e objetos ligados ao destino garantem a chegada.',['Teleporte']]

/* A imagem é reduzida no navegador (lado maior até 400 px, JPEG) e guardada como texto na própria ficha. */
const IMG_MAX = 90000;
const IMG_RE = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
const imgOk = s => typeof s==='string' && s.length<=IMG_MAX && IMG_RE.test(s);
async function fileToPortrait(file){
  if (!file || !/^image\//.test(file.type)) throw new Error('Escolha um arquivo de imagem (JPG, PNG, WEBP…).');
  if (file.size > 20e6) throw new Error('Imagem grande demais (máximo 20 MB).');
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { throw new Error('Não foi possível ler essa imagem.'); }
  const esc = Math.min(1, 400/Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(bmp.width*esc)); cv.height = Math.max(1, Math.round(bmp.height*esc));
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#1d1915'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(bmp, 0, 0, cv.width, cv.height); bmp.close?.();
  let q = .85, url;
  do { url = cv.toDataURL('image/jpeg', q); q -= .1; } while (url.length > IMG_MAX && q > .25);
  if (!imgOk(url)) throw new Error('Não foi possível reduzir a imagem o bastante. Tente outra.');
  return url;
}
function portrait(img, nome, cls=''){
  return imgOk(img) ? `<img class="portrait ${cls}" src="${h(img)}" alt="Imagem de ${h(nome)}">`
    : `<div class="portrait ${cls}" aria-hidden="true">${h((String(nome||'?').trim()[0]||'?').toUpperCase())}</div>`;
}
