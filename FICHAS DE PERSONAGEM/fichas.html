<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichas de Personagem · D&amp;D 5.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#13100d; --panel:#1d1915; --panel2:#251f1a; --line:#3a3027; --line2:#4b3e32;
  --text:#eee5d3; --muted:#a8998a; --gold:#d1a84e; --gold2:#f0cd7a; --red:#cf5b43; --green:#74a96d; --blue:#6f9cc9;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Cinzel,serif;letter-spacing:.02em;margin:0}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(#1b1611,#13100d)}
header h1{font-size:20px;color:var(--gold2)}
header .sub{color:var(--muted);font-size:12px}
.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:99px;border:1px solid var(--line2);font-size:12px;color:var(--muted)}
.badge.gold{color:var(--gold2);border-color:var(--gold)}
nav{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--gold2);border-color:var(--gold)}
nav .count{background:var(--red);color:#fff;border-radius:99px;padding:0 7px;margin-left:6px;font-size:11px}
main{padding:20px;max-width:1400px;margin:0 auto}
.notice{background:#2a2117;border:1px solid var(--line2);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;color:var(--muted)}
.notice b{color:var(--text)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{font-size:14px;color:var(--gold);margin-bottom:10px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--gold)}
.card h2{font-size:17px;margin-bottom:2px}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.hpbar{height:8px;background:#2c241d;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.hpbar i{display:block;height:100%;border-radius:99px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);color:#1b140b;border-color:var(--gold);font-weight:600}
.btn.pri:hover{background:var(--gold2)}
.btn.danger{border-color:#6b3528;color:#f0a492}
.btn.ok{border-color:#3f6b3a;color:#b6e0ae}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select,textarea{background:#16120f;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--gold)}
textarea{min-height:70px;resize:vertical}
.f{margin-bottom:12px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cols6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cols2>*,.cols3>*,.cols6>*{min-width:0}
.create{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:16px;align-items:start}
.create .side{position:sticky;top:12px}
.sheet{display:grid;grid-template-columns:240px minmax(0,1fr) minmax(300px,380px);gap:14px;align-items:start}
.abil{display:grid;gap:8px}
.ab{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;display:grid;grid-template-columns:1fr auto;align-items:center}
.ab .n{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.ab .m{font-size:22px;font-weight:700;color:var(--gold2)}
.ab .s{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:center}
.stat .v{font-size:20px;font-weight:700}
.stat .l{font-size:11px;color:var(--muted)}
.list{display:grid;gap:2px}
.li{display:flex;justify-content:space-between;padding:4px 6px;border-radius:6px}
.li:nth-child(odd){background:#1a1612}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;border:1px solid var(--muted);margin-right:8px;vertical-align:middle}
.dot.on{background:var(--gold);border-color:var(--gold)}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pip{width:14px;height:14px;border-radius:50%;border:1px solid var(--gold)}
.pip.on{background:var(--gold)}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line2)}
.chip.pendente{color:var(--gold2);border-color:var(--gold)}
.chip.aprovado{color:#b6e0ae;border-color:#3f6b3a}
.chip.rejeitado{color:#f0a492;border-color:#6b3528}
.chip.st-ativo{color:#b6e0ae;border-color:#3f6b3a}
.chip.st-espera{color:var(--gold2);border-color:var(--gold)}
.chip.st-aposentado{color:#a9c6e4;border-color:#3d5a78}
.chip.st-falecido{color:var(--muted);border-color:var(--line2)}
.card.st-card-falecido .portrait{filter:grayscale(1);opacity:.75}
.card.st-card-falecido h2,.card.st-card-aposentado h2{color:var(--muted)}
.req{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel2);margin-bottom:10px}
.err{color:#f0a492;font-size:12px;margin:2px 0}
.ok-t{color:#b6e0ae;font-size:12px}
.log{max-height:260px;overflow:auto}
.log .e{padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.stack>*+*{margin-top:14px}
.pb-ctl{display:flex;align-items:center;gap:6px;justify-content:center}
.pb-ctl b{min-width:22px;text-align:center;font-size:16px}
.abcell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.abcell .t{font-size:11px;color:var(--muted);letter-spacing:.06em}
.abcell .fin{font-size:20px;font-weight:700;color:var(--gold2)}
.skills-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px}
.skills-pick label{display:flex;gap:8px;align-items:center;color:var(--text);font-size:13px;margin:0}
.skills-pick label.dis{color:var(--muted)}
.card{display:flex;gap:12px;align-items:flex-start}
.card-body{flex:1;min-width:0}
.portrait{width:72px;height:96px;flex:none;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);object-fit:cover;object-position:50% 20%;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:28px;color:var(--gold)}
.portrait.md{width:120px;height:160px;font-size:44px}
.portrait.lg{width:100%;max-width:260px;height:auto;aspect-ratio:3/4;margin:0 auto;font-size:64px}
.img-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.img-actions input[type=file]{display:none}
.lvl-box{margin-top:8px;padding:10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2)}
.rl{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.rl:hover,.rl:focus-visible{color:var(--gold2);text-decoration-color:var(--gold);outline:none}
#pop{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:16px}
#pop[hidden]{display:none}
.pop-bg{position:absolute;inset:0;background:rgba(8,6,4,.72)}
.pop-box{position:relative;background:var(--panel);border:1px solid var(--gold);border-radius:var(--r);padding:16px 18px;width:min(520px,100%);max-height:min(80vh,640px);overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.pop-box h3{font-size:18px;color:var(--gold2);margin-top:2px}
.pop-body{margin-top:10px;font-size:13.5px}
.pop-body p{margin:0 0 8px}
.pop-body h4{font-size:13px;color:var(--gold);margin:10px 0 4px}
.pop-stats{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 10px;margin-bottom:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:13px}
.pop-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding:8px 10px;margin-bottom:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:12.5px}
.pop-grid span{color:var(--muted)}
.pop-grid b{font-weight:600}
.pop-sec{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2a2117;border:1px solid var(--gold);padding:10px 16px;border-radius:8px;display:none;z-index:9;max-width:90vw}
@media (max-width:1150px){.sheet{grid-template-columns:220px minmax(0,1fr)}.sheet .c3{grid-column:1/-1}}
@media (max-width:820px){.sheet,.create{grid-template-columns:1fr}.create .side{position:static}.stats{grid-template-columns:repeat(3,1fr)}.cols6{grid-template-columns:repeat(3,1fr)}.abil{grid-template-columns:repeat(2,1fr)}main{padding:14px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Fichas de Personagem</h1>
    <div class="sub">D&amp;D 5.5 · regras do SRD 5.2 · mudanças aprovadas pelo mestre</div>
  </div>
  <div class="badges" id="badges"></div>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="pop" hidden></div>
<div id="toast"></div>

<script>
/* ============ DADOS DE REGRAS (mecânicas do D&D 5.5 / SRD 5.2) ============ */
const AB = ['FOR','DES','CON','INT','SAB','CAR'];
const AB_NOME = {FOR:'Força',DES:'Destreza',CON:'Constituição',INT:'Inteligência',SAB:'Sabedoria',CAR:'Carisma'};
const SKILLS = [
  ['acrobacia','Acrobacia','DES'],['adestrar','Adestrar Animais','SAB'],['arcanismo','Arcanismo','INT'],
  ['atletismo','Atletismo','FOR'],['atuacao','Atuação','CAR'],['enganacao','Enganação','CAR'],
  ['furtividade','Furtividade','DES'],['historia','História','INT'],['intimidacao','Intimidação','CAR'],
  ['intuicao','Intuição','SAB'],['investigacao','Investigação','INT'],['medicina','Medicina','SAB'],
  ['natureza','Natureza','INT'],['percepcao','Percepção','SAB'],['persuasao','Persuasão','CAR'],
  ['prestidigitacao','Prestidigitação','DES'],['religiao','Religião','INT'],['sobrevivencia','Sobrevivência','SAB']
];
const SKILL_NOME = Object.fromEntries(SKILLS.map(s=>[s[0],s[1]]));
const ALL_SKILLS = SKILLS.map(s=>s[0]);

const CLASSES = {
  barbaro:{nome:'Bárbaro',dado:12,saves:['FOR','CON'],n:2,skills:['adestrar','atletismo','intimidacao','natureza','percepcao','sobrevivencia'],magia:null,sem:'CON'},
  bardo:{nome:'Bardo',dado:8,saves:['DES','CAR'],n:3,skills:ALL_SKILLS,magia:{tipo:'total',ab:'CAR'}},
  bruxo:{nome:'Bruxo',dado:8,saves:['SAB','CAR'],n:2,skills:['arcanismo','enganacao','historia','intimidacao','investigacao','natureza','religiao'],magia:{tipo:'pacto',ab:'CAR'}},
  clerigo:{nome:'Clérigo',dado:8,saves:['SAB','CAR'],n:2,skills:['historia','intuicao','medicina','persuasao','religiao'],magia:{tipo:'total',ab:'SAB'}},
  druida:{nome:'Druida',dado:8,saves:['INT','SAB'],n:2,skills:['arcanismo','adestrar','intuicao','medicina','natureza','percepcao','religiao','sobrevivencia'],magia:{tipo:'total',ab:'SAB'}},
  feiticeiro:{nome:'Feiticeiro',dado:6,saves:['CON','CAR'],n:2,skills:['arcanismo','enganacao','intuicao','intimidacao','persuasao','religiao'],magia:{tipo:'total',ab:'CAR'}},
  guerreiro:{nome:'Guerreiro',dado:10,saves:['FOR','CON'],n:2,skills:['acrobacia','adestrar','atletismo','historia','intuicao','intimidacao','persuasao','percepcao','sobrevivencia'],magia:null,asiExtra:[6,14]},
  ladino:{nome:'Ladino',dado:8,saves:['DES','INT'],n:4,skills:['acrobacia','atletismo','enganacao','intuicao','intimidacao','investigacao','percepcao','persuasao','prestidigitacao','furtividade'],magia:null,asiExtra:[10]},
  mago:{nome:'Mago',dado:6,saves:['INT','SAB'],n:2,skills:['arcanismo','historia','intuicao','investigacao','medicina','natureza','religiao'],magia:{tipo:'total',ab:'INT'}},
  monge:{nome:'Monge',dado:8,saves:['FOR','DES'],n:2,skills:['acrobacia','atletismo','historia','intuicao','religiao','furtividade'],magia:null,sem:'SAB'},
  paladino:{nome:'Paladino',dado:10,saves:['SAB','CAR'],n:2,skills:['atletismo','intuicao','intimidacao','medicina','persuasao','religiao'],magia:{tipo:'meia',ab:'CAR'}},
  patrulheiro:{nome:'Patrulheiro',dado:10,saves:['FOR','DES'],n:3,skills:['adestrar','atletismo','intuicao','investigacao','natureza','percepcao','furtividade','sobrevivencia'],magia:{tipo:'meia',ab:'SAB'}}
};
const SPECIES = {
  anao:{nome:'Anão',desl:30,pvExtra:1,tracos:['Visão no escuro (36 m)','Resiliência anã: resistência a veneno','Robustez anã: +1 PV por nível']},
  draconato:{nome:'Draconato',desl:30,tracos:['Ancestralidade dracônica','Arma de sopro','Resistência a dano do ancestral','Visão no escuro (18 m)']},
  elfo:{nome:'Elfo',desl:30,extraSkill:['intuicao','percepcao','sobrevivencia'],tracos:['Visão no escuro (18 m)','Ancestralidade feérica','Linhagem élfica','Sentidos aguçados (+1 perícia)','Transe']},
  gnomo:{nome:'Gnomo',desl:30,tracos:['Visão no escuro (18 m)','Astúcia gnômica','Linhagem gnômica']},
  golias:{nome:'Golias',desl:35,tracos:['Ancestralidade gigante','Forma grande (nível 5)','Constituição poderosa']},
  halfling:{nome:'Halfling',desl:30,tracos:['Bravura','Agilidade halfling','Sortudo','Furtividade natural']},
  humano:{nome:'Humano',desl:30,extraSkill:ALL_SKILLS,tracos:['Engenhoso: Inspiração heroica a cada descanso longo','Habilidoso (+1 perícia)','Versátil (talento de origem)']},
  orc:{nome:'Orc',desl:30,tracos:['Surto de adrenalina','Visão no escuro (36 m)','Resistência implacável']},
  tiefling:{nome:'Tiefling',desl:30,tracos:['Legado ínfero','Presença sobrenatural','Visão no escuro (18 m)']}
};
/* Os 16 antecedentes do Livro do Jogador 2024 (só 4 estão no SRD 5.2). A chave antiga de cada um foi mantida para não quebrar fichas já criadas. */
const BACKGROUNDS = {
  acolito:{nome:'Acólito',abs:['INT','SAB','CAR'],skills:['intuicao','religiao'],talento:'Iniciado em Magia (Clérigo)'},
  andarilho:{nome:'Andarilho',abs:['DES','SAB','CAR'],skills:['intuicao','furtividade'],talento:'Sortudo'},
  artesao:{nome:'Artesão',abs:['FOR','DES','INT'],skills:['investigacao','persuasao'],talento:'Fabricante'},
  artista:{nome:'Artista',abs:['FOR','DES','CAR'],skills:['acrobacia','atuacao'],talento:'Músico'},
  charlatao:{nome:'Charlatão',abs:['DES','CON','CAR'],skills:['enganacao','prestidigitacao'],talento:'Habilidoso'},
  criminoso:{nome:'Criminoso',abs:['DES','CON','INT'],skills:['prestidigitacao','furtividade'],talento:'Alerta'},
  eremita:{nome:'Eremita',abs:['CON','SAB','CAR'],skills:['medicina','religiao'],talento:'Curandeiro'},
  escriba:{nome:'Escriba',abs:['DES','INT','SAB'],skills:['investigacao','percepcao'],talento:'Habilidoso'},
  fazendeiro:{nome:'Fazendeiro',abs:['FOR','CON','SAB'],skills:['adestrar','natureza'],talento:'Vigoroso'},
  guarda:{nome:'Guarda',abs:['FOR','INT','SAB'],skills:['atletismo','percepcao'],talento:'Alerta'},
  guia:{nome:'Guia',abs:['DES','CON','SAB'],skills:['furtividade','sobrevivencia'],talento:'Iniciado em Magia (Druida)'},
  marinheiro:{nome:'Marinheiro',abs:['FOR','DES','SAB'],skills:['acrobacia','percepcao'],talento:'Brigão de Taverna'},
  mercador:{nome:'Mercador',abs:['CON','INT','CAR'],skills:['adestrar','persuasao'],talento:'Sortudo'},
  nobre:{nome:'Nobre',abs:['FOR','INT','CAR'],skills:['historia','persuasao'],talento:'Habilidoso'},
  sabio:{nome:'Sábio',abs:['CON','INT','SAB'],skills:['arcanismo','historia'],talento:'Iniciado em Magia (Mago)'},
  soldado:{nome:'Soldado',abs:['FOR','DES','CON'],skills:['atletismo','intimidacao'],talento:'Atacante Selvagem'},
  custom:{nome:'Personalizado (de outro livro)',custom:true}
};
const ARMORS = {
  nenhuma:{nome:'Sem armadura',base:10,dex:'full'},
  acolchoada:{nome:'Acolchoada (leve)',base:11,dex:'full'},
  couro:{nome:'Couro (leve)',base:11,dex:'full'},
  couro_batido:{nome:'Couro batido (leve)',base:12,dex:'full'},
  gibao:{nome:'Gibão de peles (média)',base:12,dex:2},
  camisao:{nome:'Camisão de malha (média)',base:13,dex:2},
  brunea:{nome:'Brunea (média)',base:14,dex:2},
  peitoral:{nome:'Peitoral (média)',base:14,dex:2},
  meia:{nome:'Meia-armadura (média)',base:15,dex:2},
  aneis:{nome:'Cota de anéis (pesada)',base:14,dex:0},
  malha:{nome:'Cota de malha (pesada)',base:16,dex:0},
  talas:{nome:'Cota de talas (pesada)',base:17,dex:0},
  placas:{nome:'Placas (pesada)',base:18,dex:0}
};
const FULL_SLOTS = [null,[2],[3],[4,2],[4,3],[4,3,2],[4,3,3],[4,3,3,1],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,2],
  [4,3,3,3,2,1],[4,3,3,3,2,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1],
  [4,3,3,3,2,1,1,1,1],[4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1]];
const PACT = l => ({qtd: l===1?1 : l<=10?2 : l<=16?3 : 4, circ: Math.min(5, Math.ceil(l/2))});
const PB_COST = {8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
const STD_ARRAY = [15,14,13,12,10,8];
const COINS = [['pl','PL','platina'],['po','PO','ouro'],['pe','PE','electro'],['pp','PP','prata'],['pc','PC','cobre']];

/* Armas (SRD 5.2). cat: s = simples, m = marcial · dist: 1 = à distância · alcance em pés */
const W = (nome,cat,dist,dado,dano,props='',extra={}) => ({nome,cat,dist,dado,dano,props:props?props.split(','):[],...extra});
const WEAPONS = {
  adaga:W('Adaga','s',0,'1d4','perfurante','acuidade,leve,arremesso',{alc:'20/60'}),
  azagaia:W('Azagaia','s',0,'1d6','perfurante','arremesso',{alc:'30/120'}),
  bordao:W('Bordão','s',0,'1d6','concussão','versátil',{vers:'1d8'}),
  clava:W('Clava','s',0,'1d4','concussão','leve'),
  clava_grande:W('Clava grande','s',0,'1d8','concussão','duas mãos'),
  foice_curta:W('Foice curta','s',0,'1d4','cortante','leve'),
  lanca:W('Lança','s',0,'1d6','perfurante','arremesso,versátil',{vers:'1d8',alc:'20/60'}),
  maca:W('Maça','s',0,'1d6','concussão'),
  machadinha:W('Machadinha','s',0,'1d6','cortante','leve,arremesso',{alc:'20/60'}),
  martelo_leve:W('Martelo leve','s',0,'1d4','concussão','leve,arremesso',{alc:'20/60'}),

}

const ruleKey = n => String(n||'').split(':')[0].replace(/\([^)]*\)/g,'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const ruleSlug = n => ruleKey(n).replace(/ /g,'-').slice(0,80) || 'x';

}

function featPre(f){
  const p=[]; if(f.cat==='geral') p.push('nível 4+'); if(f.cat==='epica') p.push('nível 19+'); if(f.cat==='estilo') p.push('característica Estilo de Luta (Guerreiro, Paladino ou Patrulheiro)');
  if (f.req.ab) p.push(f.req.ab.map(a=>AB_NOME[a]).join(' ou ')+' '+f.req.min+'+'); if (f.req.mag) p.push('conjuração ou Magia de Pacto'); if (f.pre) p.push(f.pre);
  return p.join(', ');
}
FEAT_LIST.forEach(f=>{
  if (f.cat==='origem') return;
  const pre=featPre(f);
  const corpo = f.txt + (f.abs.length ? `\nAumento de atributo: +1 em ${f.abs.length===6?'um atributo à sua escolha':f.abs.map(a=>AB_NOME[a]).join(' ou ')} (máximo ${f.max}). A ficha aplica ao escolher o talento na subida de nível.` : '');
  [f.nome,f.en].forEach(n=>{ RULES[ruleKey(n)+'|talento'] ||= [`${FEAT_CAT[f.cat]}${pre?' · Pré-requisito: '+pre:''}`, corpo]; });
});
/* motivo pelo qual o personagem não pode pegar o talento no nível nl (ou '' se pode) */
function featCheck(f, c, nl){
  if (f.cat==='geral' && nl<4) return `${f.nome} exige nível 4.`;
  if (f.cat==='epica' && nl<19) return `${f.nome} exige nível 19.`;
  if (f.cat==='estilo' && !ESTILO_CLASSES.includes(c.classe)) return `${f.nome} exige a característica Estilo de Luta (Guerreiro, Paladino ou Patrulheiro).`;
  if (f.req.ab && !f.req.ab.some(a=>(c.atributos[a]||0)>=f.req.min)) return `${f.nome} exige ${f.req.ab.map(a=>AB_NOME[a]).join(' ou ')} ${f.req.min}.`;
  if (f.req.mag && !CLASSES[c.classe]?.magia) return `${f.nome} exige conjuração ou Magia de Pacto.`;
  if (!f.rep && (c.talentos||[]).some(t=>FEATS[ruleKey(t)]===f)) return `O personagem já tem ${f.nome}.`;
  return '';
}
function featOptions(c, nl, sel){
  const grupos = nl>=19 ? ['epica','geral','estilo','origem'] : ['geral','estilo','origem'];
  return `<option value="">Escolha o talento…</option>` + grupos.map(g=>`<optgroup label="${FEAT_CAT[g]}">${FEAT_LIST.filter(f=>f.cat===g).map(f=>{ const err=featCheck(f,c,nl);
    return `<option value="${h(f.nome)}" ${f.nome===sel?'selected':''} ${err?'disabled':''}>${h(f.nome)}${f.abs.length?` (+1 ${f.abs.length===6?'qualquer':f.abs.join('/')})`:''}${err?' · indisponível':''}</option>`; }).join('')}</optgroup>`).join('')
    + `<option value="__outro" ${sel==='__outro'?'selected':''}>Outro talento (escrever o nome)</option>`;
}
function featAbsOptions(f, c, sel){
  if (!f || !f.abs.length) return '';
  return `<option value="">Atributo +1…</option>`+f.abs.map(a=>`<option value="${a}" ${a===sel?'selected':''} ${(c.atributos[a]||0)>=f.max?'disabled':''}>${AB_NOME[a]} (${c.atributos[a]||0})</option>`).join('');
}

  ['Vida Falsa','False Life',1,'Necromancia','Ação','Pessoal','V, S, M','Instantânea','Você ganha 2d4 + 4 pontos de vida temporários.\nCírculos maiores: +5 PV temporários por círculo acima do 1º.'],
  ['Queda Suave','Feather Fall',1,'Transmutação','Reação, quando você ou uma criatura a até 18 m começa a cair','18 m (60 pés)','V, M','1 minuto','Escolha até cinco criaturas em queda ao alcance. Elas descem devagar, 18 m por rodada, até a magia acabar. Se pousarem antes disso, não sofrem dano de queda e caem de pé.',['Queda de Pena','Queda Lenta']],
  ['Convocar Familiar','Find Familiar',1,'Conjuração · ritual','1 hora','3 m (10 pés)','V, S, M (incenso de 10 PO, consumido)','Instantânea','Você ganha um familiar: um espírito que toma a forma de um animal Miúdo à sua escolha, como coruja, gato, morcego, rato, corvo, sapo, lagarto, aranha ou doninha. Ele age por conta própria, mas obedece a você, e age logo depois de você na iniciativa. Não pode atacar, mas pode fazer outras ações. A até 30 m, vocês se comunicam por telepatia, e você pode usar uma ação bônus para ver e ouvir pelos sentidos dele. Ele pode entregar magias de toque que você conjurar. Se cair a 0 PV, desaparece; você pode convocá-lo de novo com esta magia.',['Encontrar Familiar']],
  ['Nuvem de Névoa','Fog Cloud',1,'Conjuração','Ação','36 m (120 pés)','V, S','Concentração, até 1 hora','Uma esfera de neblina de 6 m de raio aparece num ponto ao alcance. A área fica totalmente obscurecida. Um vento forte dispersa a névoa.\nCírculos maiores: o raio aumenta 6 m por círculo acima do 1º.',['Névoa Obscurecente','Nuvem de Neblina']],
  ['Bom Fruto','Goodberry',1,'Conjuração','Ação','Pessoal','V, S, M','24 horas','Dez frutinhas aparecem na sua mão. Uma criatura pode usar uma ação bônus para comer uma: recupera 1 ponto de vida, e a fruta a alimenta pelo dia inteiro. As frutas perdem o poder se não forem comidas em 24 horas.',['Frutos Bons','Boa Fruta']],
  ['Graxa','Grease',1,'Conjuração','Ação','18 m (60 pés)','V, S, M','1 minuto','Uma graxa escorregadia cobre o chão num quadrado de 3 m. A área vira terreno difícil. Cada criatura na área quando a graxa aparece faz um teste de resistência de Destreza; quem falhar fica Caída. Uma criatura que entrar na área ou terminar o turno nela também faz o teste.',['Área Escorregadia']],
  ['Raio Guiador','Guiding Bolt',1,'Evocação','Ação','36 m (120 pés)','V, S','1 rodada','Um clarão de luz voa até uma criatura. Faça um ataque à distância com magia. Se acertar, o alvo sofre 4d6 de dano radiante, e a próxima jogada de ataque contra ele antes do fim do seu próximo turno tem vantagem.\nCírculos maiores: +1d6 por círculo acima do 1º.',['Raio Guia','Raio Orientador']],
  ['Palavra Curativa','Healing Word',1,'Abjuração','Ação bônus','18 m (60 pés)','V','Instantânea','Uma criatura que você consiga ver recupera pontos de vida iguais a 2d4 + seu modificador de conjuração.\nCírculos maiores: +2d4 por círculo acima do 1º.',['Palavra de Cura']],
  ['Repreensão Infernal','Hellish Rebuke',1,'Evocação','Reação, quando uma criatura que você consiga ver a até 18 m causa dano a você','18 m (60 pés)','V, S','Instantânea','A criatura que feriu você é envolvida por chamas e faz um teste de resistência de Destreza. Se falhar, sofre 2d10 de dano de fogo; se passar, sofre metade.\nCírculos maiores: +1d10 por círculo acima do 1º.'],
  ['Heroísmo','Heroism',1,'Encantamento','Ação','Toque','V, S','Concentração, até 1 minuto','Uma criatura disposta que você tocar fica imune à condição Amedrontado e, no início de cada turno dela, ganha pontos de vida temporários iguais ao seu modificador de conjuração, até a magia acabar.\nCírculos maiores: +1 criatura por círculo acima do 1º.'],
  ['Riso Histérico','Hideous Laughter',1,'Encantamento','Ação','9 m (30 pés)','V, S, M','Concentração, até 1 minuto','Uma criatura que você consiga ver faz um teste de resistência de Sabedoria. Se falhar, fica Caída e Incapacitada, tomada por um riso incontrolável, e não consegue se levantar. No fim de cada turno dela, e sempre que sofrer dano, ela repete o teste (com vantagem se o teste vier do dano). Se passar, a magia acaba.',['Riso Histérico de Tasha','Gargalhada Histérica']],
  ['Marca do Caçador','Hunter\'s Mark',1,'Adivinhação','Ação bônus','27 m (90 pés)','V','Concentração, até 1 hora','Você marca uma criatura que consiga ver como sua presa. Até a magia acabar, ela sofre +1d6 de dano de energia sempre que você a acertar com uma jogada de ataque, e você tem vantagem em testes de Sabedoria (Percepção ou Sobrevivência) para encontrá-la. Se ela cair a 0 PV antes da magia acabar, você pode usar uma ação bônus para marcar outra criatura.\nCírculos maiores: a duração vira até 8 horas com espaço de 3º ou 4º círculo, e até 24 horas com espaço de 5º ou maior.'],
  ['Identificar','Identify',1,'Adivinhação · ritual','1 minuto','Toque','V, S, M (pérola de 100 PO)','Instantânea','Você toca um objeto. Se for mágico ou estiver imbuído de magia, descobre suas propriedades, como usá-las, se exige sintonização e quantas cargas tem, além das magias que o afetam. Se tocar uma criatura, descobre quais magias a estão afetando.'],
  ['Infligir Ferimentos','Inflict Wounds',1,'Necromancia','Ação','Toque','V, S','Instantânea','Uma criatura que você tocar faz um teste de resistência de Constituição. Se falhar, sofre 2d10 de dano necrótico; se passar, sofre metade.\nCírculos maiores: +1d10 por círculo acima do 1º.',['Causar Ferimentos']],
  ['Salto','Jump',1,'Transmutação','Ação bônus','Toque','V, S, M','1 minuto','Uma criatura disposta que você tocar pode, uma vez em cada turno dela até a magia acabar, saltar até 9 m gastando apenas 3 m de movimento.\nCírculos maiores: +1 criatura por círculo acima do 1º.'],
  ['Passos Longos','Longstrider',1,'Transmutação','Ação','Toque','V, S, M','1 hora','O deslocamento da criatura tocada aumenta em 3 m até a magia acabar.\nCírculos maiores: +1 criatura por círculo acima do 1º.'],
  ['Armadura Arcana','Mage Armor',1,'Abjuração','Ação','Toque','V, S, M','8 horas','Toque uma criatura disposta que não esteja usando armadura. Até a magia acabar, a CA base dela vira 13 + modificador de Destreza. A magia acaba se ela vestir uma armadura. (A ficha não aplica esta CA sozinha: peça ao mestre o ajuste se ela ficar ativa o dia todo.)',['Armadura Mágica']],
  ['Mísseis Mágicos','Magic Missile',1,'Evocação','Ação','36 m (120 pés)','V, S','Instantânea','Você cria três dardos de energia brilhante. Cada dardo acerta automaticamente uma criatura que você consiga ver ao alcance e causa 1d4 + 1 de dano de energia. Os dardos atingem ao mesmo tempo, e você pode mirar todos numa criatura ou dividi-los.\nCírculos maiores: +1 dardo por círculo acima do 1º.',['Míssil Mágico']],
  ['Proteção contra o Bem e o Mal','Protection from Evil and Good',1,'Abjuração','Ação','Toque','V, S, M (água benta ou pó de prata e ferro, consumidos)','Concentração, até 10 minutos','Até a magia acabar, uma criatura disposta que você tocar fica protegida contra Aberrações, Celestiais, Corruptores, Elementais, Fadas e Mortos-vivos: eles têm desvantagem nas jogadas de ataque contra ela, e ela não pode ser possuída por eles nem ficar Enfeitiçada ou Amedrontada por eles. Se já estiver possuída, Enfeitiçada ou Amedrontada por uma dessas criaturas, tem vantagem em qualquer novo teste de resistência contra o efeito.'],
  ['Raio Nauseante','Ray of Sickness',1,'Necromancia','Ação','18 m (60 pés)','V, S','Instantânea','Faça um ataque à distância com magia contra uma criatura. Se acertar, ela sofre 2d8 de dano de veneno e fica Envenenada até o fim do seu próximo turno.\nCírculos maiores: +1d8 por círculo acima do 1º.',['Raio do Enjoo']],
  ['Santuário','Sanctuary',1,'Abjuração','Ação bônus','9 m (30 pés)','V, S, M','1 minuto','Você protege uma criatura ao alcance. Até a magia acabar, quem mirar a criatura protegida com uma jogada de ataque ou uma magia que cause dano precisa antes passar num teste de resistência de Sabedoria. Se falhar, escolhe outro alvo ou perde o ataque ou a magia. A magia não protege contra efeitos de área. Ela acaba se a criatura protegida fizer uma jogada de ataque, conjurar uma magia ou causar dano.'],
  ['Escudo Arcano','Shield',1,'Abjuração','Reação, quando você é atingido por uma jogada de ataque ou alvo de Mísseis Mágicos','Pessoal','V, S','1 rodada','Uma barreira invisível de força protege você. Até o início do seu próximo turno, você ganha +5 na CA, inclusive contra o ataque que disparou a magia, e não sofre dano de Mísseis Mágicos.',['Escudo']],
  ['Escudo da Fé','Shield of Faith',1,'Abjuração','Ação bônus','18 m (60 pés)','V, S, M','Concentração, até 10 minutos','Um campo cintilante envolve uma criatura ao alcance, dando a ela +2 na CA até a magia acabar.',['Escudo da Fe']],
  ['Imagem Silenciosa','Silent Image',1,'Ilusão','Ação','18 m (60 pés)','V, S, M','Concentração, até 10 minutos','Você cria a imagem de um objeto, criatura ou outro fenômeno visível que caiba num cubo de 4,5 m. Ela não tem som, cheiro nem temperatura. Com a ação de Magia, você move a imagem dentro do alcance e muda sua aparência para que o movimento pareça natural. Qualquer toque atravessa a imagem. Uma criatura pode usar a ação de Estudar e fazer um teste de Inteligência (Investigação) contra a sua CD de magia; se passar, percebe a ilusão.'],
  ['Sono','Sleep',1,'Encantamento','Ação','18 m (60 pés)','V, S, M','Concentração, até 1 minuto','Cada criatura que você escolher numa esfera de 1,5 m de raio faz um teste de resistência de Sabedoria. Quem falhar fica Incapacitada até o fim do próximo turno dela, e então repete o teste. Se falhar de novo, fica Inconsciente até a magia acabar. A magia acaba para a criatura se ela sofrer dano ou se alguém a 1,5 m usar uma ação para acordá-la. Criaturas que não dormem, como elfos, ou que são imunes à condição Exaustão não são afetadas.'],
  ['Falar com Animais','Speak with Animals',1,'Adivinhação · ritual','Ação','Pessoal','V, S','10 minutos','Até a magia acabar, você entende Feras e consegue se comunicar verbalmente com elas. O que elas sabem é limitado pela inteligência delas, mas costumam ao menos contar sobre lugares e monstros próximos, inclusive o que perceberam no último dia.'],
  ['Onda Trovejante','Thunderwave',1,'Evocação','Ação','Pessoal (cubo de 4,5 m)','V, S','Instantânea','Uma onda de força trovejante sai de você. Cada criatura num cubo de 4,5 m que começa em você faz um teste de resistência de Constituição. Quem falha sofre 2d8 de dano trovejante e é empurrada 3 m para longe de você; quem passa sofre metade e não é empurrada. Objetos soltos na área também são empurrados 3 m. O estrondo é ouvido a até 90 m.\nCírculos maiores: +1d8 por círculo acima do 1º.',['Onda de Trovão']],
  ['Servo Invisível','Unseen Servant',1,'Conjuração · ritual','Ação','18 m (60 pés)','V, S, M','1 hora','Uma força invisível e sem mente aparece no chão ao alcance e faz tarefas simples para você até a magia acabar: buscar coisas, limpar, consertar, dobrar roupas, acender fogo, servir comida e bebida. Tem CA 10, 1 PV e Força 2, e não pode atacar. Como ação bônus, você manda ele se mover até 4,5 m e interagir com um objeto.'],

  /* ---------- 2º círculo ---------- */
  ['Auxílio','Aid',2,'Abjuração','Ação','9 m (30 pés)','V, S, M','8 horas','Escolha até três criaturas ao alcance. O máximo de pontos de vida e os pontos de vida atuais de cada uma aumentam em 5 até a magia acabar.\nCírculos maiores: +5 PV por círculo acima do 2º.',['Ajuda']],
  ['Pele de Árvore','Barkskin',2,'Transmutação','Ação bônus','Toque','V, S, M','1 hora','A pele de uma criatura disposta que você tocar fica dura como casca de árvore. Até a magia acabar, a CA dela não pode ser menor que 17.',['Pele de Casca','Pele de Arvore']],
  ['Cegueira/Surdez','Blindness/Deafness',2,'Transmutação','Ação','36 m (120 pés)','V','1 minuto','Uma criatura que você consiga ver faz um teste de resistência de Constituição. Se falhar, fica Cega ou Surda (à sua escolha) até a magia acabar. No fim de cada turno dela, repete o teste; se passar, a magia acaba.\nCírculos maiores: +1 criatura por círculo acima do 2º.',['Cegueira','Surdez','Cegueira Surdez']],
  ['Nublar','Blur',2,'Ilusão','Ação','Pessoal','V','Concentração, até 1 minuto','Seu corpo fica borrado e difícil de enxergar. Até a magia acabar, as jogadas de ataque contra você têm desvantagem. Quem tem Percepção às Cegas ou Visão Verdadeira não é afetado.',['Borrão']],
  ['Acalmar Emoções','Calm Emotions',2,'Encantamento','Ação','18 m (60 pés)','V, S','Concentração, até 1 minuto','Cada Humanoide numa esfera de 6 m de raio faz um teste de resistência de Carisma (pode falhar de propósito). Para quem falhar, escolha um efeito:\n• As condições Enfeitiçado e Amedrontado ficam suspensas nela até a magia acabar.\n• Ela fica Indiferente às criaturas de sua escolha contra as quais era hostil, até a magia acabar ou até sofrer dano ou ver um aliado ser atacado.'],
  ['Escuridão','Darkness',2,'Evocação','Ação','18 m (60 pés)','V, M','Concentração, até 10 minutos','Uma escuridão mágica preenche uma esfera de 4,5 m de raio a partir de um ponto ou de um objeto que você esteja segurando (aí ela se move com o objeto). Visão no escuro não enxerga através dela, e luz não mágica não ilumina a área. Cobrir o objeto com algo opaco bloqueia a escuridão.',['Escuridao']],
  ['Visão no Escuro','Darkvision',2,'Transmutação','Ação','Toque','V, S, M','8 horas','Uma criatura disposta que você tocar ganha visão no escuro de 45 m (150 pés) até a magia acabar.',['Visao no Escuro (magia)']],
  ['Aprimorar Atributo','Enhance Ability',2,'Transmutação','Ação','Toque','V, S, M','Concentração, até 1 hora','Toque uma criatura e escolha Força, Destreza, Constituição, Inteligência, Sabedoria ou Carisma. Até a magia acabar, ela tem vantagem nos testes de atributo que usem o atributo escolhido.\nCírculos maiores: +1 criatura por círculo acima do 2º.',['Aumentar Atributo','Melhorar Atributo']],
  ['Esfera Flamejante','Flaming Sphere',2,'Conjuração','Ação','18 m (60 pés)','V, S, M','Concentração, até 1 minuto','Uma esfera de fogo de 1,5 m de diâmetro aparece num espaço vazio ao alcance. Qualquer criatura que termine o turno a até 1,5 m dela faz um teste de resistência de Destreza: falha, 2d6 de dano de fogo; sucesso, metade. Como ação bônus, você rola a esfera até 9 m pelo chão. Se ela entrar no espaço de uma criatura, essa criatura faz o teste e a esfera para naquele turno. Ela incendeia objetos inflamáveis que ninguém esteja segurando e emite luz plena num raio de 6 m e penumbra por mais 6 m.\nCírculos maiores: +1d6 por círculo acima do 2º.'],
  ['Aquecer Metal','Heat Metal',2,'Transmutação','Ação','18 m (60 pés)','V, S, M','Concentração, até 1 minuto','Escolha um objeto de metal fabricado ao alcance, como uma arma ou uma armadura de metal. Ele fica em brasa, e a criatura em contato com ele sofre 2d8 de dano de fogo. Nos turnos seguintes, você pode usar uma ação bônus para causar esse dano de novo. Se a criatura estiver segurando ou vestindo o objeto ao sofrer o dano, faz um teste de resistência de Constituição; se falhar e não conseguir largá-lo, tem desvantagem em jogadas de ataque e testes de atributo até o início do seu próximo turno.\nCírculos maiores: +1d8 por círculo acima do 2º.',['Esquentar Metal']],
  ['Imobilizar Pessoa','Hold Person',2,'Encantamento','Ação','18 m (60 pés)','V, S, M','Concentração, até 1 minuto','Um Humanoide que você consiga ver faz um teste de resistência de Sabedoria. Se falhar, fica Paralisado até a magia acabar. No fim de cada turno dele, repete o teste; se passar, a magia acaba.\nCírculos maiores: +1 Humanoide por círculo acima do 2º.',['Paralisar Pessoa']],
  ['Invisibilidade','Invisibility',2,'Ilusão','Ação','Toque','V, S, M','Concentração, até 1 hora','Uma criatura que você tocar fica Invisível até a magia acabar. A magia acaba para ela se fizer uma jogada de ataque, causar dano ou conjurar uma magia.\nCírculos maiores: +1 criatura por círculo acima do 2º.'],
  ['Arrombar','Knock',2,'Transmutação','Ação','18 m (60 pés)','V','Instantânea','Escolha um objeto que você consiga ver ao alcance, como uma porta, uma caixa, um baú, correntes, um cadeado ou algemas, que esteja trancado, preso ou emperrado. Uma tranca ou fechadura dele se abre (se tiver várias, só uma). Uma Tranca Arcana fica suspensa por 10 minutos. A magia faz uma batida alta, ouvida a até 90 m.',['Abrir']],
  ['Restauração Menor','Lesser Restoration',2,'Abjuração','Ação bônus','Toque','V, S','Instantânea','Você toca uma criatura e encerra uma condição nela: Cego, Envenenado, Paralisado ou Surdo.'],
  ['Arma Mágica','Magic Weapon',2,'Transmutação','Ação bônus','Toque','V, S','1 hora','Uma arma não mágica que você tocar vira mágica até a magia acabar, com +1 nas jogadas de ataque e de dano. A magia acaba se você conjurá-la de novo.\nCírculos maiores: o bônus vira +2 com espaço de 3º a 5º círculo e +3 com espaço de 6º ou maior.'],
  ['Imagem Espelhada','Mirror Image',2,'Ilusão','Ação','Pessoal','V, S','1 minuto','Três cópias ilusórias suas aparecem no seu espaço e se movem com você. Sempre que uma criatura o acertar com uma jogada de ataque, role um d6 para cada cópia que restar. Se algum dado tirar 3 ou mais, uma cópia é atingida no seu lugar e é destruída. A magia acaba quando as três forem destruídas. Uma criatura que não consiga ver, ou que tenha Percepção às Cegas ou Visão Verdadeira, não é afetada.',['Imagens Espelhadas']],
  ['Passo Nebuloso','Misty Step',2,'Conjuração','Ação bônus','Pessoal','V','Instantânea','Envolto em névoa prateada, você se teleporta até 9 m para um espaço vazio que consiga ver.',['Passo Brumoso']],
  ['Raio Lunar','Moonbeam',2,'Evocação','Ação','36 m (120 pés)','V, S, M','Concentração, até 1 minuto','Um feixe de luz prateada forma um cilindro de 1,5 m de raio e 12 m de altura. Quando ele aparece, cada criatura nele faz um teste de resistência de Constituição: falha, 2d10 de dano radiante; sucesso, metade. Uma criatura metamorfa que falhar volta à forma verdadeira e não pode mudar de forma enquanto estiver na luz. Também faz o teste quem entrar no cilindro, terminar o turno nele, ou tiver o cilindro movido para cima de si, no máximo uma vez por turno. Nos turnos seguintes, você pode mover o cilindro até 18 m. O cilindro emite penumbra.\nCírculos maiores: +1d10 por círculo acima do 2º.',['Feixe Lunar','Luar']],
  ['Passos sem Pegadas','Pass without Trace',2,'Abjuração','Ação','Pessoal (emanação de 9 m)','V, S, M','Concentração, até 1 hora','Uma aura de 9 m emana de você. Até a magia acabar, você e as criaturas que escolher dentro da aura somam +10 aos testes de Destreza (Furtividade) e não deixam rastros, a não ser que sejam rastreadas por magia.',['Passar sem Rastro','Passos sem Rastros']],
  ['Raio do Enfraquecimento','Ray of Enfeeblement',2,'Necromancia','Ação','18 m (60 pés)','V, S','Concentração, até 1 minuto','Um raio de energia debilitante atinge uma criatura ao alcance, que faz um teste de resistência de Constituição. Se passar, tem desvantagem na próxima jogada de ataque até o início do seu próximo turno. Se falhar, até a magia acabar tem desvantagem nos Testes de D20 de Força e subtrai 1d8 de todas as suas jogadas de dano. No fim de cada turno dela, repete o teste; se passar, a magia acaba.',['Raio de Enfraquecimento']],
  ['Raio Ardente','Scorching Ray',2,'Evocação','Ação','36 m (120 pés)','V, S','Instantânea','Você dispara três raios de fogo, contra o mesmo alvo ou alvos diferentes ao alcance. Faça um ataque à distância com magia para cada raio. Cada raio que acertar causa 2d6 de dano de fogo.\nCírculos maiores: +1 raio por círculo acima do 2º.',['Raios Ardentes','Raio Escaldante']],
  ['Despedaçar','Shatter',2,'Evocação','Ação','18 m (60 pés)','V, S, M','Instantânea','Um estrondo alto explode numa esfera de 3 m de raio. Cada criatura na área faz um teste de resistência de Constituição: falha, 3d8 de dano trovejante; sucesso, metade. Constructos têm desvantagem no teste. Objetos não mágicos na área que ninguém esteja vestindo ou carregando também sofrem o dano.\nCírculos maiores: +1d8 por círculo acima do 2º.',['Estilhaçar']],
  ['Silêncio','Silence',2,'Ilusão · ritual','Ação','36 m (120 pés)','V, S','Concentração, até 10 minutos','Até a magia acabar, nenhum som é criado dentro de uma esfera de 6 m de raio nem passa por ela. Quem estiver totalmente dentro da esfera fica imune a dano trovejante e fica Surdo. Não é possível conjurar magias com componente verbal ali dentro.',['Silencio']],
  ['Patas de Aranha','Spider Climb',2,'Transmutação','Ação','Toque','V, S, M','Concentração, até 1 hora','Até a magia acabar, uma criatura disposta que você tocar pode se mover em superfícies verticais e de cabeça para baixo pelo teto, com as mãos livres, e ganha deslocamento de escalada igual ao seu deslocamento.',['Escalada de Aranha','Escalar como Aranha']],
  ['Arma Espiritual','Spiritual Weapon',2,'Evocação','Ação bônus','18 m (60 pés)','V, S','Concentração, até 1 minuto','Você cria uma força espectral flutuante, na forma de uma arma à sua escolha, num espaço ao alcance. Ao conjurar, pode fazer um ataque corpo a corpo com magia contra uma criatura a até 1,5 m da arma: se acertar, causa dano de energia igual a 1d8 + seu modificador de conjuração. Nos turnos seguintes, como ação bônus, você move a arma até 6 m e repete o ataque.\nCírculos maiores: +1d8 por círculo acima do 2º.'],
  ['Sugestão','Suggestion',2,'Encantamento','Ação','9 m (30 pés)','V, M','Concentração, até 8 horas','Você sugere um rumo de ação (em até 25 palavras) a uma criatura que consiga ver e ouvir você. A sugestão precisa parecer possível e não pode envolver nada claramente nocivo a ela. O alvo faz um teste de resistência de Sabedoria. Se falhar, fica Enfeitiçado e segue a sugestão da melhor forma que puder até a magia acabar. A magia acaba se você ou um aliado causar dano a ele.',['Sugestao']],
  ['Teia','Web',2,'Conjuração','Ação','18 m (60 pés)','V, S, M','Concentração, até 1 hora','Teias grossas e grudentas enchem um cubo de 6 m. A área vira terreno difícil e fica levemente obscurecida. Se as teias não estiverem presas entre duas superfícies sólidas, como paredes ou árvores, ou presas a um chão, parede ou teto, desabam e a magia acaba no início do seu próximo turno. Cada criatura que começa o turno nas teias ou entra nelas faz um teste de resistência de Destreza; se falhar, fica Contida enquanto estiver nas teias ou até se soltar. Uma criatura Contida pode usar a ação para um teste de Força (Atletismo) contra a sua CD de magia; se passar, se solta. As teias são inflamáveis: um cubo de 1,5 m exposto ao fogo queima em 1 rodada, causando 2d4 de dano de fogo a quem começar o turno nele.'],

  /* ---------- 3º círculo ---------- */
  ['Sinal de Esperança','Beacon of Hope',3,'Abjuração','Ação','9 m (30 pés)','V, S','Concentração, até 1 minuto','Escolha qualquer número de criaturas ao alcance. Até a magia acabar, elas têm vantagem nos testes de resistência de Sabedoria e nos testes contra a morte, e recuperam o máximo possível de pontos de vida em qualquer cura que receberem.',['Farol de Esperança']],
  ['Contramágica','Counterspell',3,'Abjuração','Reação, quando você vê uma criatura a até 18 m conjurar uma magia com componentes verbais, somáticos ou materiais','18 m (60 pés)','S','Instantânea','Você tenta interromper a magia. A criatura que está conjurando faz um teste de resistência de Constituição. Se falhar, a magia se dissipa sem efeito, e a ação, ação bônus ou reação usada para conjurá-la é desperdiçada. Se a magia usava um espaço de magia, esse espaço não é gasto.',['Contra Magia','Contramagica']],
  ['Luz do Dia','Daylight',3,'Evocação','Ação','18 m (60 pés)','V, S','1 hora','Uma esfera de luz de 18 m de raio se espalha a partir de um ponto ou de um objeto (que pode ser carregado, e a luz vai junto). A esfera emite luz plena, e mais 18 m de penumbra além dela. Cobrir o objeto com algo opaco bloqueia a luz. Se a área tocar uma escuridão criada por magia de 3º círculo ou menor, essa magia é dissipada.'],
  ['Dissipar Magia','Dispel Magic',3,'Abjuração','Ação','36 m (120 pés)','V, S','Instantânea','Escolha uma criatura, objeto ou efeito mágico ao alcance. Toda magia de 3º círculo ou menor ativa no alvo termina. Para cada magia de 4º círculo ou maior, faça um teste usando sua habilidade de conjuração com CD 10 + o círculo da magia; se passar, ela termina.\nCírculos maiores: você encerra automaticamente magias de círculo igual ou menor ao do espaço usado.'],
  ['Medo','Fear',3,'Ilusão','Ação','Pessoal (cone de 9 m)','V, S, M','Concentração, até 1 minuto','Cada criatura num cone de 9 m faz um teste de resistência de Sabedoria. Quem falhar larga o que estiver segurando e fica Amedrontada até a magia acabar. Enquanto Amedrontada, em cada turno faz a ação de Disparada e se afasta de você pelo caminho mais seguro. Se terminar o turno num lugar sem linha de visão até você, repete o teste; se passar, a magia acaba para ela.',['Medo (magia)']],
  ['Bola de Fogo','Fireball',3,'Evocação','Ação','45 m (150 pés)','V, S, M','Instantânea','Um risco de luz voa até um ponto ao alcance e explode numa esfera de fogo de 6 m de raio. Cada criatura na área faz um teste de resistência de Destreza: falha, 8d6 de dano de fogo; sucesso, metade. Objetos inflamáveis na área que ninguém esteja vestindo ou carregando pegam fogo.\nCírculos maiores: +1d6 por círculo acima do 3º.'],
  ['Voo','Fly',3,'Transmutação','Ação','Toque','V, S, M','Concentração, até 10 minutos','Uma criatura disposta que você tocar ganha deslocamento de voo de 18 m e pode pairar no ar, até a magia acabar. Quando a magia acaba, se ainda estiver no ar, ela cai, a menos que consiga se sustentar.\nCírculos maiores: +1 criatura por círculo acima do 3º.',['Vôo']],
  ['Velocidade','Haste',3,'Transmutação','Ação','9 m (30 pés)','V, S, M','Concentração, até 1 minuto','Escolha uma criatura disposta que você consiga ver. Até a magia acabar, o deslocamento dela dobra, ela ganha +2 na CA, tem vantagem nos testes de resistência de Destreza e ganha uma ação extra em cada turno. Essa ação extra só pode ser usada para Atacar (apenas um ataque com arma), Disparada, Desengajar, Esconder ou Usar um objeto. Quando a magia acaba, o alvo fica Incapacitado e com deslocamento 0 até o fim do próximo turno dele, tomado por uma onda de cansaço.',['Acelerar','Pressa']],
  ['Padrão Hipnótico','Hypnotic Pattern',3,'Ilusão','Ação','36 m (120 pés)','S, M','Concentração, até 1 minuto','Um padrão de cores hipnótico aparece num cubo de 9 m. Cada criatura na área que veja o padrão faz um teste de resistência de Sabedoria. Quem falhar fica Enfeitiçada até a magia acabar; enquanto isso, fica Incapacitada e com deslocamento 0. O efeito acaba para a criatura se ela sofrer dano ou se alguém usar uma ação para sacudi-la.'],
  ['Relâmpago','Lightning Bolt',3,'Evocação','Ação','Pessoal (linha de 30 m)','V, S, M','Instantânea','Um raio sai de você numa linha de 30 m de comprimento por 1,5 m de largura. Cada criatura na linha faz um teste de resistência de Destreza: falha, 8d6 de dano elétrico; sucesso, metade. Objetos inflamáveis na área que ninguém esteja vestindo ou carregando pegam fogo.\nCírculos maiores: +1d6 por círculo acima do 3º.',['Raio Relampejante','Raio']],
  ['Palavra Curativa em Massa','Mass Healing Word',3,'Abjuração','Ação bônus','18 m (60 pés)','V','Instantânea','Até seis criaturas que você consiga ver recuperam, cada uma, pontos de vida iguais a 2d4 + seu modificador de conjuração.',['Palavra de Cura em Massa']],
  ['Proteção contra Energia','Protection from Energy',3,'Abjuração','Ação','Toque','V, S','Concentração, até 1 hora','Até a magia acabar, uma criatura disposta que você tocar tem resistência a um tipo de dano à sua escolha: ácido, elétrico, fogo, frio ou trovejante.'],
  ['Remover Maldição','Remove Curse',3,'Abjuração','Ação','Toque','V, S','Instantânea','Todas as maldições que afetam uma criatura ou objeto que você tocar terminam. Se o objeto for um item mágico amaldiçoado, a maldição continua, mas a magia quebra a sintonização do dono com ele, para que ele possa se livrar do item.'],
  ['Revivificar','Revivify',3,'Necromancia','Ação','Toque','V, S, M (diamante de 300 PO, consumido)','Instantânea','Você toca uma criatura que morreu há no máximo 1 minuto. Ela volta à vida com 1 ponto de vida. A magia não revive quem morreu de velhice nem recupera partes do corpo perdidas.',['Revivificação']],
  ['Lentidão','Slow',3,'Transmutação','Ação','36 m (120 pés)','V, S, M','Concentração, até 1 minuto','Até seis criaturas que você escolher num cubo de 12 m fazem um teste de resistência de Sabedoria. Quem falhar, até a magia acabar: tem o deslocamento reduzido à metade, sofre −2 na CA e nos testes de resistência de Destreza e não pode usar reações. No turno dela, pode usar uma ação ou uma ação bônus, não as duas, e faz só um ataque com a ação de Ataque. Se conjurar uma magia com componente somático, há 25% de chance de a magia falhar. No fim de cada turno dela, repete o teste; se passar, a magia acaba para ela.',['Lentidao']],
  ['Espíritos Guardiões','Spirit Guardians',3,'Conjuração','Ação','Pessoal (emanação de 4,5 m)','V, S, M','Concentração, até 10 minutos','Espíritos protetores voam à sua volta numa emanação de 4,5 m. Você escolhe criaturas que eles ignoram. O deslocamento de qualquer outra criatura dentro da emanação cai à metade. Quando a emanação alcança uma criatura inimiga que você veja, ou ela entra na área ou termina o turno lá, ela faz um teste de resistência de Sabedoria: falha, 3d8 de dano radiante (se você for bom ou neutro) ou necrótico (se for mau); sucesso, metade. Cada criatura faz esse teste no máximo uma vez por turno.\nCírculos maiores: +1d8 por círculo acima do 3º.',['Espiritos Guardioes','Guardiões Espirituais']],
  ['Toque Vampírico','Vampiric Touch',3,'Necromancia','Ação','Pessoal','V, S','Concentração, até 1 minuto','Seu toque drena vida. Faça um ataque corpo a corpo com magia contra uma criatura ao seu alcance. Se acertar, ela sofre 3d6 de dano necrótico, e você recupera pontos de vida iguais à metade do dano causado. Até a magia acabar, você pode repetir o ataque usando a ação de Magia em cada turno.\nCírculos maiores: +1d6 por círculo acima do 3º.',['Toque Vampirico']],
  ['Respirar na Água','Water Breathing',3,'Transmutação · ritual','Ação','9 m (30 pés)','V, S, M','24 horas','Até dez criaturas dispostas que você consiga ver conseguem respirar debaixo d\'água até a magia acabar, sem perder a capacidade de respirar normalmente.',['Respirar na Agua','Respiração Aquática']]

  ['Flecha Ácida','Acid Arrow',2,'Evocação','Ação','27 m (90 pés)','V, S, M','Instantânea','Uma flecha verde voa até um alvo. Faça um ataque à distância com magia. Se acertar, o alvo sofre 4d4 de dano ácido na hora e mais 2d4 de dano ácido no fim do próximo turno dele. Se errar, a flecha respinga e causa metade do dano inicial.\nCírculos maiores: os dois danos aumentam em 1d4 por círculo acima do 2º.',['Flecha Ácida de Melf','Flecha Acida']],

  ['Mensageiro Animal','Animal Messenger',2,'Encantamento · ritual','Ação','9 m (30 pés)','V, S, M','24 horas','Uma Fera Miúda que você consiga ver leva uma mensagem de até 25 palavras a um lugar que você descrever, procurando a criatura que você indicar. Ela viaja cerca de 75 km por dia (voando) ou 40 km (andando). Ao chegar, entrega a mensagem com a sua voz.\nCírculos maiores: a duração aumenta 48 horas por círculo acima do 2º.'],
  ['Tranca Arcana','Arcane Lock',2,'Abjuração','Ação','Toque','V, S, M (pó de ouro de 25 PO, consumido)','Até ser dissipada','Você tranca magicamente uma porta, janela, portão, baú ou outra entrada fechada. Você e as criaturas que escolher abrem normalmente. Você pode definir uma senha que suspende a magia por 1 minuto. Fora isso, só abre se for quebrada ou se a magia for dissipada ou suprimida. A CD para arrombar ou forçar aumenta em 10.'],
  ['Augúrio','Augury',2,'Adivinhação · ritual','1 minuto','Pessoal','V, S, M (varetas, ossos ou cartas de 25 PO)','Instantânea','Você recebe um presságio sobre uma ação específica que pretende fazer nos próximos 30 minutos: Bem (bom resultado), Mal (mau resultado), Bem e mal, ou Indiferente. Se conjurar de novo antes de um descanso longo, há 25% de chance cumulativa de receber uma resposta aleatória.',['Augurio']],
  ['Chama Contínua','Continual Flame',2,'Evocação','Ação','Toque','V, S, M (pó de rubi de 50 PO, consumido)','Até ser dissipada','Uma chama do brilho de uma tocha surge num objeto que você tocar. Ela não esquenta nem consome oxigênio, e pode ser coberta ou escondida, mas não apagada.',['Chama Continua']],
  ['Detectar Pensamentos','Detect Thoughts',2,'Adivinhação','Ação','Pessoal','V, S, M','Concentração, até 1 minuto','Você sente a presença de mentes a até 9 m (não de criaturas sem mente). Com a ação de Magia, pode ler os pensamentos superficiais de uma criatura que consiga ver nesse alcance. Pode tentar ir mais fundo: o alvo faz um teste de resistência de Sabedoria; se falhar, você entende o raciocínio, o estado emocional e o que ocupa a mente dele. O alvo percebe a sondagem e pode usar a ação para tentar expulsar você, com um teste de Inteligência (Arcanismo) contra a sua CD.'],
  ['Aumentar/Reduzir','Enlarge/Reduce',2,'Transmutação','Ação','9 m (30 pés)','V, S, M','Concentração, até 1 minuto','Uma criatura ou objeto que você consiga ver muda de tamanho. Uma criatura relutante faz um teste de resistência de Constituição.\n• Aumentar: o alvo fica um tamanho maior, tem vantagem em testes de Força e testes de resistência de Força, e os ataques dele com arma ou desarmados causam +1d4 de dano.\n• Reduzir: o alvo fica um tamanho menor, tem desvantagem em testes de Força e testes de resistência de Força, e os ataques dele causam −1d4 de dano (mínimo 1).',['Aumentar Reduzir','Aumentar','Reduzir']],
  ['Convocar Corcel','Find Steed',2,'Conjuração','Ação','9 m (30 pés)','V, S','Instantânea','Você convoca um espírito na forma de uma montaria Grande, leal a você. Escolha a natureza dele: Celestial, Fada ou Corruptor. Ele usa o bloco de estatísticas de Corcel de Outro Mundo do livro, que melhora com o círculo da magia. Ele age na sua iniciativa e obedece aos seus comandos. Enquanto estiver montado, você pode fazer magias que mirem só você mirarem também o corcel. Se ele cair a 0 PV, desaparece. Você só pode ter um corcel por vez.',['Encontrar Montaria','Encontrar Corcel']],
  ['Encontrar Armadilhas','Find Traps',2,'Adivinhação','Ação','36 m (120 pés)','V, S','Instantânea','Você sente a presença de armadilhas ao alcance e na sua linha de visão, inclusive mágicas. Descobre que existe uma armadilha e o tipo geral do perigo, mas não onde ela está exatamente.'],
  ['Lâmina Flamejante','Flame Blade',2,'Evocação','Ação bônus','Pessoal','V, S, M','Concentração, até 10 minutos','Uma lâmina de fogo surge na sua mão livre. Ela emite luz plena num raio de 3 m e penumbra por mais 3 m. Com a ação de Magia, você faz um ataque corpo a corpo com magia usando a lâmina; se acertar, causa 3d6 de dano de fogo mais seu modificador de conjuração. Se você soltar a lâmina, ela some, mas você pode chamá-la de volta com uma ação bônus.',['Lamina Flamejante']],
  ['Repouso Tranquilo','Gentle Repose',2,'Necromancia · ritual','Ação','Toque','V, S, M','10 dias','Você toca um cadáver. Até a magia acabar, ele não apodrece e não pode virar morto-vivo. Os dias sob o efeito não contam no limite de tempo de magias como Reviver os Mortos.'],
  ['Lufada de Vento','Gust of Wind',2,'Evocação','Ação','Pessoal (linha de 18 m)','V, S, M','Concentração, até 1 minuto','Um vento forte sopra numa linha de 18 m de comprimento por 3 m de largura. Cada criatura que começa o turno na linha faz um teste de resistência de Força; se falhar, é empurrada 4,5 m na direção do vento. Andar contra o vento custa o dobro de movimento. O vento dispersa gases e vapores e apaga velas e tochas. Como ação bônus, você muda a direção da linha.',['Rajada de Vento']],
  ['Levitação','Levitate',2,'Transmutação','Ação','18 m (60 pés)','V, S, M','Concentração, até 10 minutos','Uma criatura ou objeto solto de até 250 kg sobe até 6 m e fica flutuando. Uma criatura relutante faz um teste de resistência de Constituição. O alvo só se move empurrando ou puxando algo fixo. Em cada turno seu, você pode subir ou descer o alvo até 6 m. Quando a magia acaba, ele desce flutuando até o chão.',['Levitar']],
  ['Localizar Animais ou Plantas','Locate Animals or Plants',2,'Adivinhação · ritual','Ação','Pessoal','V, S, M','Instantânea','Diga o nome de um tipo de Fera ou Planta. Você descobre a direção e a distância até a criatura ou planta desse tipo mais próxima, a até 8 km.'],
  ['Localizar Objeto','Locate Object',2,'Adivinhação','Ação','Pessoal','V, S, M','Concentração, até 10 minutos','Descreva ou diga o nome de um objeto que você conheça. Você sente a direção dele, se estiver a até 300 m. Também pode procurar o objeto mais próximo de um tipo, como uma joia ou uma espada. Uma camada de chumbo, mesmo fina, bloqueia a magia.'],
  ['Boca Encantada','Magic Mouth',2,'Ilusão · ritual','1 minuto','9 m (30 pés)','V, S, M (pó de jade de 10 PO, consumido)','Até ser dissipada','Você grava uma mensagem de até 25 palavras num objeto e define uma condição para ela ser dita, como "quando alguém se aproximar da porta". Quando a condição acontece, uma boca mágica aparece e fala a mensagem com a sua voz, por até 10 minutos.',['Boca Mágica']],
  ['Oração Curativa','Prayer of Healing',2,'Abjuração','10 minutos','9 m (30 pés)','V','Instantânea','Até cinco criaturas que fiquem ao alcance durante toda a conjuração recebem os benefícios de um descanso curto e recuperam 2d8 pontos de vida. Uma criatura só pode ser afetada de novo depois de terminar um descanso longo.\nCírculos maiores: +1d8 de cura por círculo acima do 2º.',['Oração de Cura']],
  ['Proteção contra Veneno','Protection from Poison',2,'Abjuração','Ação','Toque','V, S','1 hora','Você toca uma criatura e encerra a condição Envenenado nela. Até a magia acabar, ela tem vantagem nos testes de resistência para evitar ou encerrar a condição Envenenado e resistência a dano de veneno.'],
  ['Truque de Corda','Rope Trick',2,'Transmutação','Ação','Toque','V, S, M','1 hora','Você toca uma corda de até 18 m. A ponta dela sobe até ficar de pé no ar, e no topo surge uma entrada invisível para um espaço extradimensional que abriga até oito criaturas Médias. A corda pode ser puxada para dentro. Ataques e magias não atravessam a entrada. Quando a magia acaba, quem estiver lá dentro cai.'],
  ['Ver o Invisível','See Invisibility',2,'Adivinhação','Ação','Pessoal','V, S, M','1 hora','Até a magia acabar, você vê criaturas e objetos com a condição Invisível como se fossem visíveis, e enxerga o Plano Etéreo. Criaturas e objetos de lá parecem translúcidos.',['Ver o Invisivel']],
  ['Crescer Espinhos','Spike Growth',2,'Transmutação','Ação','45 m (150 pés)','V, S, M','Concentração, até 10 minutos','O chão numa esfera de 6 m de raio se enche de espinhos e vira terreno difícil. Uma criatura que entrar na área ou se mover dentro dela sofre 2d4 de dano perfurante a cada 1,5 m que percorrer. A área parece natural: quem não viu a magia sendo feita precisa de um teste de Sabedoria (Percepção) contra a sua CD para notar o perigo.',['Espinhos','Crescimento de Espinhos']],
  ['Vínculo de Proteção','Warding Bond',2,'Abjuração','Ação','Toque','V, S, M (dois anéis de platina de 50 PO, usados por vocês dois)','1 hora','Você toca uma criatura disposta e cria um elo místico. Até a magia acabar, ela ganha +1 na CA e nos testes de resistência e tem resistência a todo dano. Cada vez que ela sofrer dano, você sofre a mesma quantidade. A magia acaba se vocês ficarem a mais de 18 m de distância ou se você cair a 0 PV.',['Elo de Proteção','Vinculo de Protecao']],
  ['Zona da Verdade','Zone of Truth',2,'Encantamento','Ação','18 m (60 pés)','V, S','10 minutos','Cria uma esfera de 4,5 m de raio. Uma criatura que entra nela pela primeira vez num turno, ou começa o turno nela, faz um teste de resistência de Carisma. Se falhar, não consegue mentir de propósito enquanto estiver na área. Você sabe quem passou e quem falhou. A criatura afetada sabe que está sob a magia e pode evitar responder ou dar respostas evasivas.'],

  ['Animar Mortos','Animate Dead',3,'Necromancia','1 minuto','3 m (10 pés)','V, S, M','Instantânea','Escolha uma pilha de ossos ou o cadáver de um Humanoide Médio ou Pequeno. Ele se ergue como um Esqueleto (ossos) ou um Zumbi (cadáver) sob seu controle. Em cada turno seu, com uma ação bônus, você comanda mentalmente os mortos-vivos a até 18 m. O controle dura 24 horas. Para manter o controle, conjure a magia de novo sobre eles antes disso (cada conjuração reafirma o controle de até quatro).\nCírculos maiores: +2 mortos-vivos animados ou controlados por círculo acima do 3º.'],
  ['Rogar Maldição','Bestow Curse',3,'Necromancia','Ação','Toque','V, S','Concentração, até 1 minuto','A criatura tocada faz um teste de resistência de Sabedoria. Se falhar, sofre uma maldição à sua escolha:\n• Desvantagem em testes de atributo e de resistência de um atributo.\n• Desvantagem nas jogadas de ataque contra você.\n• Em cada turno, faz um teste de resistência de Sabedoria; se falhar, perde a ação.\n• Seus ataques e magias causam +1d8 de dano necrótico a ela.\nCírculos maiores: com espaço de 4º, dura até 10 minutos; 5º, até 8 horas; 7º, até 24 horas; 9º, até ser dissipada. A partir do 5º não precisa de concentração.',['Lançar Maldição','Maldição']],
  ['Piscar','Blink',3,'Transmutação','Ação','Pessoal','V, S','1 minuto','No fim de cada um dos seus turnos, você tem 50% de chance de sumir para o Plano Etéreo (o mestre combina o dado). Lá, só criaturas no Plano Etéreo podem afetar você, e você só as afeta. No início do seu próximo turno, você volta para um espaço vazio a até 3 m de onde sumiu.',['Piscadela']],
  ['Convocar Relâmpagos','Call Lightning',3,'Conjuração','Ação','36 m (120 pés)','V, S','Concentração, até 10 minutos','Uma nuvem de tempestade surge acima de você. Ao conjurar, e depois com a ação de Magia em cada turno, você faz cair um raio num ponto abaixo da nuvem: cada criatura a até 1,5 m dele faz um teste de resistência de Destreza; falha, 3d10 de dano elétrico; sucesso, metade. Se já houver uma tempestade ao ar livre, o dano aumenta em 1d10.\nCírculos maiores: +1d10 por círculo acima do 3º.',['Chamar Relâmpagos']],
  ['Clarividência','Clairvoyance',3,'Adivinhação','10 minutos','1,5 km','V, S, M (foco de 100 PO)','Concentração, até 10 minutos','Você cria um sensor invisível num lugar conhecido ou óbvio ao alcance, como dentro de uma sala do outro lado de uma porta. Escolha ver ou ouvir: você percebe pelo sensor como se estivesse lá. Com uma ação bônus, pode trocar entre ver e ouvir.',['Clarividencia']],
  ['Conjurar Animais','Conjure Animals',3,'Conjuração','Ação','18 m (60 pés)','V, S','Concentração, até 10 minutos','Você convoca espíritos que formam uma matilha Grande e intangível de animais num espaço vazio. Sempre que a matilha se mover a até 3 m de uma criatura que você consiga ver, ou uma criatura entrar ou terminar o turno a até 3 m dela, você pode forçar um teste de resistência de Destreza: falha, 3d10 de dano cortante. Cada criatura faz esse teste no máximo uma vez por turno. Você pode mover a matilha até 9 m em cada turno seu. Seus aliados têm vantagem em testes de resistência de Força enquanto estiverem a até 1,5 m dela.\nCírculos maiores: +1d10 por círculo acima do 3º.'],
  ['Criar Alimentos e Água','Create Food and Water',3,'Conjuração','Ação','9 m (30 pés)','V, S','Instantânea','Você cria cerca de 20 kg de comida e 120 litros de água, o bastante para quinze Humanoides ou cinco montarias por 24 horas. A comida estraga se não for comida em 24 horas; a água não estraga.',['Criar Comida e Água']],
  ['Forma Gasosa','Gaseous Form',3,'Transmutação','Ação','Toque','V, S, M','Concentração, até 1 hora','Uma criatura disposta que você tocar vira uma nuvem de névoa, com o que estiver vestindo e carregando. Ela ganha deslocamento de voo de 3 m, pode pairar, tem resistência a dano de concussão, perfurante e cortante, tem vantagem em testes de resistência de Força, Destreza e Constituição e passa por frestas estreitas. Não pode falar, manipular objetos, atacar nem conjurar magias.'],
  ['Glifo de Vigilância','Glyph of Warding',3,'Abjuração','1 hora','Toque','V, S, M (pó de diamante de 200 PO, consumido)','Até ser dissipado ou ativado','Você grava um glifo numa superfície ou objeto fechado e define o que o ativa. Escolha:\n• Runas explosivas: ao ativar, explodem numa esfera de 6 m de raio; teste de resistência de Destreza; falha, 5d8 de dano (ácido, elétrico, fogo, frio ou trovejante, à sua escolha); sucesso, metade.\n• Glifo de magia: guarda uma magia de até 3º círculo, que é solta quando o glifo é ativado.\nO glifo é quase invisível: encontrá-lo exige um teste de Inteligência (Investigação) contra a sua CD.\nCírculos maiores: +1d8 nas runas, e o glifo de magia guarda magias do mesmo círculo do espaço usado.',['Glifo de Proteção']],
  ['Círculo Mágico','Magic Circle',3,'Abjuração','1 minuto','3 m (10 pés)','V, S, M (sal e pó de prata de 100 PO, consumidos)','1 hora','Você cria um cilindro de 3 m de raio e 6 m de altura. Escolha tipos de criatura: Celestiais, Elementais, Fadas, Corruptores ou Mortos-vivos. Elas não conseguem entrar no cilindro por meios não mágicos (para se teletransportar para dentro, precisam passar num teste de resistência de Carisma), têm desvantagem em ataques contra quem está dentro e não podem possuir, enfeitiçar ou amedrontar quem está dentro. Você pode inverter o círculo para prender uma criatura lá dentro.\nCírculos maiores: +1 hora por círculo acima do 3º.',['Circulo Magico']],
  ['Imagem Maior','Major Image',3,'Ilusão','Ação','36 m (120 pés)','V, S, M','Concentração, até 10 minutos','Você cria a imagem de um objeto, criatura ou fenômeno que caiba num cubo de 6 m. Ela parece real, com sons, cheiros e temperatura, mas não causa dano. Com a ação de Magia, você move a imagem e muda sua aparência. Qualquer toque atravessa a imagem. Uma criatura pode usar a ação de Estudar e fazer um teste de Inteligência (Investigação) contra a sua CD para perceber a ilusão.\nCírculos maiores: com espaço de 4º círculo ou maior, dura até ser dissipada, sem concentração.'],
  ['Fundir-se às Rochas','Meld into Stone',3,'Transmutação · ritual','Ação','Toque','V, S','8 horas','Você entra num bloco de pedra grande o bastante para conter seu corpo, levando o que estiver vestindo e carregando. Lá dentro, ninguém vê você, e você ouve o que acontece fora. Você pode sair a qualquer momento. Dano pequeno na pedra não o afeta, mas se ela for destruída ou muito danificada, você é expulso e sofre dano.',['Mesclar-se às Rochas','Fundir-se a Pedra']],
  ['Não Detecção','Nondetection',3,'Abjuração','Ação','Toque','V, S, M (pó de diamante de 25 PO, consumido)','8 horas','Uma criatura disposta, um lugar ou um objeto de até 3 m que você tocar fica escondido de magias de adivinhação. Ele não pode ser alvo dessas magias nem percebido por sensores mágicos de vidência.',['Nao Deteccao','Indetectável']],
  ['Corcel Fantasma','Phantom Steed',3,'Ilusão · ritual','1 minuto','9 m (30 pés)','V, S','1 hora','Um cavalo Grande e semirreal aparece, com sela e rédeas. Você ou uma criatura escolhida pode montá-lo. Ele tem deslocamento de 30 m e viaja cerca de 16 km por hora. A magia acaba se ele sofrer dano ou se você usar uma ação para dispensá-lo.',['Montaria Fantasma']],
  ['Crescimento de Plantas','Plant Growth',3,'Transmutação','Ação ou 8 horas','45 m (150 pés)','V, S','Instantânea','Escolha:\n• Crescimento (ação): as plantas num raio de 30 m ficam tão densas que cada 30 cm de movimento ali custa 1,2 m. Você pode deixar áreas livres.\n• Enriquecimento (8 horas): as plantas num raio de 800 m ficam férteis e produzem o dobro por um ano.'],
  ['Enviar Mensagem','Sending',3,'Adivinhação','Ação','Ilimitado','V, S, M','Instantânea','Você manda uma mensagem de até 25 palavras a uma criatura que você conheça. Ela ouve a mensagem na mente, reconhece você e pode responder com até 25 palavras na hora. Se ela estiver em outro plano, há 5% de chance de a mensagem não chegar.',['Enviar Mensagens']],
  ['Tempestade de Granizo','Sleet Storm',3,'Conjuração','Ação','45 m (150 pés)','V, S, M','Concentração, até 1 minuto','Chuva congelante cai num cilindro de 12 m de raio e 6 m de altura. A área fica totalmente obscurecida e vira terreno difícil, e chamas expostas se apagam. Uma criatura que entra na área ou começa o turno nela faz um teste de resistência de Destreza; se falhar, fica Caída. Quem estiver concentrado numa magia dentro da área faz um teste de Constituição contra a sua CD ou perde a concentração.',['Tempestade de Neve','Tempestade de Gelo e Neve']],
  ['Falar com os Mortos','Speak with Dead',3,'Necromancia','Ação','3 m (10 pés)','V, S, M','10 minutos','Um cadáver que ainda tenha boca responde até cinco perguntas suas. Ele só sabe o que sabia em vida, pode responder de forma enigmática e não é obrigado a dizer a verdade se for hostil. A magia não funciona no mesmo cadáver de novo por 10 dias.'],
  ['Falar com as Plantas','Speak with Plants',3,'Transmutação','Ação','Pessoal (raio de 9 m)','V, S','10 minutos','As plantas a até 9 m ganham uma consciência limitada e podem se comunicar com você e obedecer a comandos simples. Você pode perguntar sobre o que aconteceu ali no último dia e fazer as plantas abrirem caminho em terreno difícil, ou o contrário.'],
  ['Nuvem Fétida','Stinking Cloud',3,'Conjuração','Ação','27 m (90 pés)','V, S, M','Concentração, até 1 minuto','Uma esfera de gás amarelo e nauseante de 6 m de raio aparece. A área fica totalmente obscurecida. Cada criatura que começa o turno na esfera faz um teste de resistência de Constituição; se falhar, fica Envenenada até o fim do turno e, enquanto isso, não pode usar ação nem ação bônus. Um vento forte dispersa a nuvem.',['Nuvem Fetida']],
  ['Cabana','Tiny Hut',3,'Evocação · ritual','1 minuto','Pessoal (hemisfério de 3 m)','V, S, M','8 horas','Uma cúpula de força de 3 m de raio surge à sua volta e fica parada. Cabem até nove criaturas Médias. Criaturas e objetos que estavam dentro saem e entram à vontade; outros não atravessam. Magias e efeitos mágicos não passam pela cúpula. Lá dentro o clima é agradável, e você escolhe se a cúpula é transparente ou opaca. A magia acaba se você sair.',['Pequena Cabana de Leomund','Cabana de Leomund','Pequena Cabana']],
  ['Idiomas','Tongues',3,'Adivinhação','Ação','Toque','V, M','1 hora','A criatura tocada entende qualquer idioma falado que ouvir e, quando fala, é entendida por qualquer criatura que conheça pelo menos um idioma.',['Línguas']],
  ['Andar na Água','Water Walk',3,'Transmutação · ritual','Ação','9 m (30 pés)','V, S, M','1 hora','Até dez criaturas dispostas que você consiga ver podem andar sobre qualquer superfície líquida, como água, ácido, lama, neve ou lava, como se fosse chão firme (a lava ainda causa dano pelo calor). Uma criatura submersa sobe até a superfície a 18 m por rodada.',['Caminhar sobre a Água','Andar sobre as Águas']],
  ['Muralha de Vento','Wind Wall',3,'Evocação','Ação','36 m (120 pés)','V, S, M','Concentração, até 1 minuto','Uma muralha de vento forte surge, com até 15 m de comprimento, 4,5 m de altura e 30 cm de espessura. Quando ela aparece, cada criatura na área faz um teste de resistência de Força: falha, 3d8 de dano de concussão; sucesso, metade. O vento afasta neblina, fumaça e outros gases, impede a passagem de criaturas ou objetos voadores Pequenos ou menores, e flechas, virotes e outras munições comuns que tentam atravessá-la são desviadas e erram.',['Parede de Vento']]

  ['Controlar a Água','Control Water',4,'Transmutação','Ação','90 m (300 pés)','V, S, M','Concentração, até 10 minutos','Você controla a água num cubo de até 30 m. Ao conjurar, e depois com a ação de Magia, escolha um efeito: Inundação (o nível da água sobe até 6 m, ou forma uma onda), Separar as Águas (abre um caminho seco), Redirecionar o Fluxo (a água corre na direção que você quiser) ou Redemoinho (cria um vórtice que puxa e causa dano a quem estiver nele).'],

  ['Porta Dimensional','Dimension Door',4,'Conjuração','Ação','150 m (500 pés)','V','Instantânea','Você se teletransporta para um lugar ao alcance que consiga ver, ou que descreva (como "150 m para baixo" ou "60 m a noroeste"). Pode levar junto uma criatura disposta a até 1,5 m, do tamanho seu ou menor. Se o destino estiver ocupado, cada um sofre 4d6 de dano de energia e o teletransporte falha.'],
  ['Adivinhação','Divination',4,'Adivinhação · ritual','Ação','Pessoal','V, S, M (incenso de 25 PO, consumido)','Instantânea','Você faz uma pergunta sobre um objetivo, evento ou atividade que vai acontecer nos próximos 7 dias e recebe uma resposta verdadeira, que pode ser uma frase curta, um verso enigmático ou um presságio. Se conjurar de novo antes de um descanso longo, há 25% de chance cumulativa de não receber resposta.',['Adivinhacao']],
  ['Dominar Fera','Dominate Beast',4,'Encantamento','Ação','18 m (60 pés)','V, S','Concentração, até 1 minuto','Uma Fera que você consiga ver faz um teste de resistência de Sabedoria, com vantagem se você ou aliados estiverem lutando contra ela. Se falhar, fica Enfeitiçada. Enquanto estiverem no mesmo plano, você dá ordens telepáticas e ela obedece. Você pode controlar cada ação dela diretamente usando sua reação. Sempre que sofrer dano, ela repete o teste.\nCírculos maiores: dura até 10 minutos com 5º círculo, até 1 hora com 6º e até 8 horas com 7º ou maior.'],
  ['Fabricar','Fabricate',4,'Transmutação','10 minutos','36 m (120 pés)','V, S','Instantânea','Você transforma matéria-prima em produtos do mesmo material: madeira em ponte, linho em roupas, minério em lingotes. O resultado pode ter até tamanho Grande (cubo de 3 m), ou Médio (cubo de 1,5 m) se for de metal, pedra ou outro mineral. A qualidade depende do material. Itens que exigem grande habilidade, como armas e joias, pedem proficiência com as ferramentas de artesão adequadas.'],

  ['Escudo de Fogo','Fire Shield',4,'Evocação','Ação','Pessoal','V, S, M','10 minutos','Chamas finas envolvem você, emitindo luz plena num raio de 3 m e penumbra por mais 3 m. Escolha:\n• Escudo quente: você tem resistência a frio.\n• Escudo frio: você tem resistência a fogo.\nSempre que uma criatura a até 1,5 m acertar você com um ataque corpo a corpo, sofre 2d8 de dano de fogo (escudo quente) ou de frio (escudo frio).'],
