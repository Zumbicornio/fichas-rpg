async function exportSheet(c){
  const nome=String(c.nome||'personagem').replace(/[\\/:*?"<>|]+/g,'').trim()||'personagem';
  const filename=`Ficha - ${nome} - nivel ${c.nivel}.html`;
  const data=sheetHtml(c);
  let dl=null;
  if (window.claude && typeof window.claude.use==='function'){ try { dl=await window.claude.use('downloads'); } catch { dl=null; } }
  if (dl){
    try { await dl.save({filename, data}); toast('Ficha exportada. Abra o arquivo e use "Imprimir ou salvar em PDF".'); }
    catch(err){ if (err?.code!=='declined') toast('Não foi possível salvar o arquivo ('+(err?.code||'erro')+').'); }
    return;
  }
  try {
    const url=URL.createObjectURL(new Blob([data],{type:'text/html'}));
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000); toast('Ficha exportada. Abra o arquivo e use "Imprimir ou salvar em PDF".');
  } catch { toast('Não foi possível exportar a ficha neste navegador.'); }
}

/* ============ EVENTOS ============ */
function setPath(obj,path,val){ const ks=path.split('.'); let o=obj; ks.slice(0,-1).forEach(k=>o=o[k]); o[ks.at(-1)]=val; }
document.addEventListener('click', async e=>{
  const t=e.target.closest('[data-act]'); if(!t || t.tagName==='SELECT') return;
  const a=t.dataset.act;
  if (a==='tab'){ S.tab=t.dataset.tab; S.delArm=null; S.cloneArm=null; if(S.tab==='criar'&&!S.draft) S.draft=newDraft(); render(true); }
  else if (a==='open'){ S.charId=t.dataset.id; S.tab='ficha'; S.delArm=null; S.cloneArm=null; render(true); window.scrollTo(0,0); }
  else if (a==='role'){ S.isMaster = t.dataset.role==='mestre'; S.myId = S.isMaster?'demo-mestre':'demo-jogador'; if(S.tab==='aprovacoes'||S.tab==='solicitacoes') S.tab='personagens'; render(true); }
  else if (a==='pb'){ const ab=t.dataset.ab; S.draft.compra[ab]=Math.max(8,Math.min(15,S.draft.compra[ab]+(+t.dataset.d))); render(true); }
  else if (a==='reset-draft'){ S.draft=newDraft(); render(true); }
  else if (a==='lvl-roll'){ const c=S.chars.find(x=>x.id===S.charId); if(!c) return;
    if (lvlRollFor(c)){ toast('O dado de vida deste nível já foi rolado.'); return; }
    const form=t.closest('form'); const keep=form?Object.fromEntries(new FormData(form).entries()):{};
    t.disabled=true; const nl=c.nivel+1; const v=rollExpr('1d'+CLASSES[c.classe].dado).total;
    await changeEstado(c,e=>{ e.lvlRoll={nivel:nl, v, at:nowIso()}; });
    render(true); toast(`Rolou ${v} no d${CLASSES[c.classe].dado}.`);
    const nf=document.querySelector('form[data-form="acao"][data-type="nivel"]');
    if (nf) Object.entries(keep).forEach(([k,val])=>{ if(k==='hp'||k==='rolado') return; const el=nf.elements[k]; if(el && 'value' in el) el.value=val; }); }
  else if (a==='lvl-media'){ const inp=document.querySelector(`.lvl-hp[data-for="${CSS.escape(t.dataset.for)}"]`); if(inp) inp.value=t.dataset.v; }
  else if (a==='img-clear-draft'){ S.draft.retrato=''; render(true); }
  else if (a==='export'){ const c=S.chars.find(x=>x.id===S.charId); if(!c) return; t.disabled=true; try{ await exportSheet(c); } finally { t.disabled=false; } }
  else if (a==='clone'){ S.cloneArm=S.charId; render(true); const i=$('#clone-nome'); if(i){ i.focus(); i.select(); } }
  else if (a==='clone-cancel'){ S.cloneArm=null; render(true); }
  else if (a==='clone-ok'){ const c=S.chars.find(x=>x.id===S.charId); if(!c) return; t.disabled=true;
    if (await submitClone(c, $('#clone-nome')?.value)) render(true); else t.disabled=false; }
  else if (a==='img-remove'){ const c=S.chars.find(x=>x.id===S.charId); if(!c) return;
    if (S.delArm!=='img:'+c.id){ S.delArm='img:'+c.id; render(true); return; }
    S.delArm=null; await submitPortrait(c,''); render(true); }
  else if (a==='del'){ const id=t.dataset.id; if(S.delArm!==id){ S.delArm=id; render(true); return; }
    try{ await store.deleteCharacter(id); S.delArm=null; S.tab='personagens'; toast('Personagem excluído.'); render(true); } catch(err){ toast('Não foi possível excluir ('+(err.code||'erro')+').'); } }
  else if (a==='approve'){ t.disabled=true; if(await approve(t.dataset.owner,t.dataset.id)) toast('Aprovado.'); else t.disabled=false; }
  else if (a==='reject'){ const inp=document.querySelector(`.rej-motivo[data-for="${CSS.escape(t.dataset.id)}"]`); t.disabled=true; await reject(t.dataset.owner,t.dataset.id,inp?.value); }
  else if (a==='hp'){ const c=S.chars.find(x=>x.id===S.charId); const n=Math.floor(+($('#hp-n')?.value)||0); if(!c) return; if(n<1){ toast('Digite a quantidade.'); return; }
    const modo=t.dataset.mode;
    await changeEstado(c,(e,d)=>{ if(modo==='dano'){ const t2=Math.min(e.temp,n); e.temp-=t2; const resto=n-t2; if(d.max-e.dano<=0 && resto>0) e.morte.f=Math.min(3,e.morte.f+1); e.dano+=resto; } else if(modo==='cura') e.dano-=n; else e.temp=Math.max(e.temp,n); }); }
  else if (a==='rest'){ const c=S.chars.find(x=>x.id===S.charId); if(!c) return; const longo=t.dataset.tipo==='longo';
    await changeEstado(c,e=>{ e.pacto=0; if(longo){ e.dano=0; e.temp=0; e.espacos=[0,0,0,0,0,0,0,0,0]; } }); toast(longo?'Descanso longo: PV e espaços de magia restaurados.':'Descanso curto feito. Gaste dados de vida curando pelo campo de PV.'); }
  else if (a==='slot'){ const c=S.chars.find(x=>x.id===S.charId); if(!c) return; const gastar=t.dataset.on==='1'; const i=t.dataset.i;
    await changeEstado(c,(e,d)=>{ if(i==='pacto'){ e.pacto=Math.max(0,Math.min(d.magia.pacto.qtd,e.pacto+(gastar?1:-1))); } else { const k=+i; const tot=d.magia.slots[k]||0; e.espacos[k]=Math.max(0,Math.min(tot,(e.espacos[k]||0)+(gastar?1:-1))); } }); }
  else if (a==='ds'){ const c=S.chars.find(x=>x.id===S.charId); if(!c) return; const k=t.dataset.k, n=+t.dataset.n;
    await changeEstado(c,e=>{ e.morte[k] = e.morte[k]===n ? n-1 : n; }); }
  else if (a==='atk'){ const c=S.chars.find(x=>x.id===S.charId); if(c) doAttack(c,t.dataset.id,t.dataset.vers==='1'); }
  else if (a==='approve-all'){ t.disabled=true; let ok=0; for (const i of pendingList()){ if(await approve(i.owner,i.id)) ok++; } toast(`${ok} solicitação(ões) aprovada(s).`); t.disabled=false; }
});
document.addEventListener('change', async e=>{
  const el=e.target;
  if (el.matches('input[type=file][data-img]')){
    const file=el.files&&el.files[0]; el.value=''; if(!file) return;
    let img; try { img=await fileToPortrait(file); } catch(err){ toast(err.message); return; }
    if (el.dataset.img==='draft'){ if(S.draft){ S.draft.retrato=img; render(true); } }
    else { const c=S.chars.find(x=>x.id===S.charId); if(c){ await submitPortrait(c,img); render(true); } }
    return;
  }
  if (el.matches('[data-filter]')){ S.filtro[el.dataset.filter]=el.value; render(true); return; }
  if (el.matches('[data-act-type]')){ S.actionType=el.value; render(true); return; }
  if (!S.draft || !el.closest('form[data-form="criar"]')) return;
  if (el.dataset.skill){ const k=el.dataset.skill; const s=new Set(S.draft.classSkills); el.checked?s.add(k):s.delete(k); S.draft.classSkills=[...s]; render(true); return; }
  const f=el.dataset.f; if(!f) return;
  const val = el.type==='checkbox' ? el.checked : el.value;
  setPath(S.draft,f,val);
  if (f==='classe') S.draft.classSkills=[];
  if (f==='especie') S.draft.extraSkill='';
  if (f==='antecedente'){ S.draft.b2=''; S.draft.b1=''; }
  if (f==='metodo' && val==='padrao') AB.forEach(a=>S.draft.padrao[a]='');
  if (!el.hasAttribute('data-live')) render(true);
});
document.addEventListener('input', e=>{
  const el=e.target; if(!S.draft || !el.hasAttribute('data-live') || !el.closest('form[data-form="criar"]')) return;
  setPath(S.draft, el.dataset.f, el.value);
});
document.addEventListener('focusout', ()=>setTimeout(()=>{ if(S.deferred) render(); },0));
document.addEventListener('submit', async e=>{
  e.preventDefault(); const f=e.target;
  if (f.dataset.form==='acao') await submitAction(f);
  else if (f.dataset.form==='criar') { document.activeElement?.blur?.(); await submitCreate(); }
  else if (f.dataset.form==='notas'){ const c=S.chars.find(x=>x.id===S.charId); if(!c) return; const n=clone(c); n.notas=String(new FormData(f).get('notas')||'').slice(0,4000);
    if (n.notas===c.notas) return; try{ await store.saveCharacter(n); toast('Anotações salvas.'); }catch(err){ toast('Não foi possível salvar ('+(err.code||'erro')+').'); } }
  render(true);
});

/* ============ INICIALIZAÇÃO ============ */
function subscribe(){
  const timer=setTimeout(()=>{ if(!S.loaded){ S.notice='Não foi possível alcançar os dados ainda. Verifique sua conexão; a página continua tentando.'; render(); } },10000);
  store.onCharacters((list,meta)=>{
    S.chars=list;
    if (!meta || !meta.fromCache){ S.loaded=true; clearTimeout(timer); if(S.notice.startsWith('Não foi possível alcançar')) S.notice=''; }
    loadNames(); render();
  }, err=>{ clearTimeout(timer); S.loaded=true; S.notice='Não foi possível carregar as fichas ('+h(err.code)+').'; render(); });
  store.onEstado(m=>{ S.estado=m||{}; render(); }, err=>{ S.notice='Não foi possível carregar os pontos de vida ('+h(err.code)+').'; render(); });
  store.onRequests(m=>{ S.reqDocs=m||{}; loadNames(); render(); }, err=>{ S.notice='Não foi possível carregar as solicitações ('+h(err.code)+').'; render(); });
}
async function init(){
  S.draft=newDraft(); render();
  let db=null, user=null;
  if (window.claude && typeof window.claude.use==='function'){
    try {
      const timeout=new Promise(r=>setTimeout(()=>r([null,null]),10000));
      [db,user] = await Promise.race([Promise.all([window.claude.use('db'), window.claude.use('user')]), timeout]);
    } catch { db=null; user=null; }
  }
  let id=null;
  if (db && user){ try { id=await user.id(); } catch {} }
  if (db && user && id){
    S.mode='db'; S.user=user; S.myId=id;
    try { S.isMaster = !!(await user.canEdit()); } catch { S.isMaster=false; }
    store=makeDbStore(db);
  } else {
    S.mode='local'; S.myId='demo-mestre'; S.isMaster=true; S.loaded=true;
    S.notice='<b>Modo demonstração.</b> O banco compartilhado não está disponível nesta visualização, então os dados ficam só nesta aba. Use "Ver como" para testar o fluxo de jogador e mestre.';
    store=makeLocalStore();
  }
  subscribe(); render();
}
init();
</script>
