  ['Inseto Gigante','Giant Insect',4,'Conjuração','Ação','18 m (60 pés)','V, S','Concentração, até 10 minutos','Você convoca o espírito de uma centopeia, aranha ou vespa gigante, que usa o bloco de estatísticas de Inseto Gigante do livro (melhora com o círculo da magia). Ele é seu aliado, age logo depois de você na iniciativa e obedece aos seus comandos.'],
  ['Invisibilidade Maior','Greater Invisibility',4,'Ilusão','Ação','Toque','V, S','Concentração, até 1 minuto','A criatura tocada fica Invisível até a magia acabar, mesmo se atacar ou conjurar magias.',['Invisibilidade Maior (Greater)']],
  ['Guardião da Fé','Guardian of Faith',4,'Conjuração','Ação','9 m (30 pés)','V','8 horas','Um guardião espectral Grande aparece num espaço vazio ao alcance e fica lá. Quando um inimigo entra pela primeira vez num turno a até 3 m dele, ou começa o turno lá, faz um teste de resistência de Destreza: falha, 20 de dano radiante; sucesso, metade. O guardião some depois de causar 60 de dano no total.',['Guardiao da Fe']],
  ['Terreno Alucinógeno','Hallucinatory Terrain',4,'Ilusão','10 minutos','90 m (300 pés)','V, S, M','24 horas','Um terreno natural num cubo de até 45 m parece, soa e cheira como outro tipo de terreno natural: um campo vira pântano, uma estrada vira charco, um precipício vira descida suave. Construções e criaturas não mudam. Tocar revela a ilusão. Uma criatura pode usar a ação de Estudar com teste de Inteligência (Investigação) contra a sua CD para perceber.',['Terreno Alucinatório']],
  ['Tempestade de Gelo','Ice Storm',4,'Evocação','Ação','90 m (300 pés)','V, S, M','Instantânea','Granizo cai num cilindro de 6 m de raio e 12 m de altura. Cada criatura na área faz um teste de resistência de Destreza: falha, 2d10 de dano de concussão e 4d6 de dano de frio; sucesso, metade. A área vira terreno difícil até o fim do seu próximo turno.\nCírculos maiores: +1d10 de concussão por círculo acima do 4º.'],
  ['Localizar Criatura','Locate Creature',4,'Adivinhação','Ação','Pessoal','V, S, M','Concentração, até 1 hora','Descreva ou diga o nome de uma criatura que você conheça. Você sente a direção dela, se estiver a até 300 m. Também pode procurar a criatura mais próxima de um tipo. Água corrente com pelo menos 3 m de largura bloqueia a magia.'],
  ['Assassino Fantasmagórico','Phantasmal Killer',4,'Ilusão','Ação','36 m (120 pés)','V, S','Concentração, até 1 minuto','Você usa os piores medos de uma criatura que consiga ver para criar uma ilusão que só ela percebe. Ela faz um teste de resistência de Sabedoria: falha, 4d10 de dano psíquico e desvantagem em testes de atributo e jogadas de ataque até a magia acabar; sucesso, metade do dano e a magia acaba. No fim de cada turno dela, repete o teste: se falhar, sofre 4d10 de dano psíquico de novo; se passar, a magia acaba.\nCírculos maiores: +1d10 por círculo acima do 4º.',['Assassino Fantasmagorico','Matador Fantasmagórico']],
  ['Metamorfose','Polymorph',4,'Transmutação','Ação','18 m (60 pés)','V, S, M','Concentração, até 1 hora','Uma criatura que você consiga ver vira uma Fera. Uma criatura relutante faz um teste de resistência de Sabedoria; metamorfos passam automaticamente. A nova forma tem nível de desafio igual ou menor que o do alvo (ou o nível, se for personagem). O alvo usa as estatísticas da Fera, mantendo personalidade e alinhamento, e ganha pontos de vida temporários iguais aos PV da Fera. A magia acaba quando esses PV temporários acabam. Ele não pode falar, conjurar magias nem usar ações que exijam mãos, se a forma não permitir.',['Polimorfia','Polimorfismo']],
  ['Santuário Particular','Private Sanctum',4,'Abjuração','10 minutos','36 m (120 pés)','V, S, M','24 horas','Você protege uma área de até um cubo de 30 m. Escolha qualquer combinação: o som não atravessa os limites; os limites ficam escuros e enevoados por fora; sensores de adivinhação não aparecem lá dentro; criaturas não entram nem saem por teletransporte; viagem entre planos fica bloqueada. Conjurar no mesmo lugar todo dia por um ano torna o efeito permanente.',['Santuário Particular de Mordenkainen','Santuario Privado']],
  ['Esfera Resiliente','Resilient Sphere',4,'Evocação','Ação','9 m (30 pés)','V, S, M','Concentração, até 1 minuto','Uma esfera de força cintilante envolve uma criatura ou objeto Grande ou menor. Uma criatura relutante faz um teste de resistência de Destreza; se passar, não é envolvida. Nada atravessa a esfera, nem para dentro nem para fora, e ela é imune a todo dano. Quem está dentro pode empurrar a esfera e rolá-la a metade do deslocamento. Desintegrar destrói a esfera.',['Esfera Resiliente de Otiluke']],
  ['Baú Secreto','Secret Chest',4,'Conjuração','Ação','Toque','V, S, M (baú de 5.000 PO e réplica de 50 PO)','Até ser dissipada','Você esconde um baú e o que há nele no Plano Etéreo. Enquanto a magia durar, você pode chamar o baú de volta usando a réplica (uma ação). Depois de 60 dias, há 5% de chance cumulativa por dia de o baú se perder para sempre.',['Baú Secreto de Leomund','Bau Secreto']],
  ['Moldar Rochas','Stone Shape',4,'Transmutação','Ação','Toque','V, S, M','Instantânea','Você toca um objeto de pedra Médio ou menor, ou uma seção de pedra de até 1,5 m em qualquer dimensão, e dá a ela a forma que quiser: uma arma, uma estátua, um baú, uma passagem, uma porta lacrada. Peças móveis simples são possíveis, mas não mecanismos.',['Moldar Pedra']],
  ['Pele de Pedra','Stoneskin',4,'Abjuração','Ação','Toque','V, S, M (pó de diamante de 100 PO, consumido)','Concentração, até 1 hora','Até a magia acabar, a criatura disposta tocada tem resistência a dano de concussão, perfurante e cortante.'],
  ['Muralha de Fogo','Wall of Fire',4,'Evocação','Ação','36 m (120 pés)','V, S, M','Concentração, até 1 minuto','Uma muralha de fogo surge no chão: até 18 m de comprimento, 6 m de altura e 30 cm de espessura, ou um anel de 6 m de diâmetro. A área fica levemente obscurecida. Quando ela aparece, cada criatura na área faz um teste de resistência de Destreza: falha, 5d8 de dano de fogo; sucesso, metade. Um lado da muralha (à sua escolha) causa 5d8 de dano de fogo a quem terminar o turno a até 3 m dele ou dentro da muralha, e a quem entrar nela pela primeira vez num turno.\nCírculos maiores: +1d8 por círculo acima do 4º.',['Parede de Fogo']]
);

SPELL_DB.push(
  ['Animar Objetos','Animate Objects',5,'Transmutação','Ação','36 m (120 pés)','V, S','Concentração, até 1 minuto','Objetos não mágicos ao alcance, que ninguém esteja vestindo ou carregando, ganham vida e viram aliados seus. O número máximo depende do seu modificador de conjuração (um objeto Médio ou menor conta 1, um Grande conta 2, um Enorme conta 3). Eles usam o bloco de estatísticas de Objeto Animado do livro. Como ação bônus, você comanda todos os que estiverem a até 150 m.\nCírculos maiores: o dano dos ataques dos objetos aumenta com o círculo (veja o livro).'],
  ['Concha Antivida','Antilife Shell',5,'Abjuração','Ação','Pessoal (emanação de 3 m)','V, S','Concentração, até 1 hora','Uma barreira de 3 m em volta de você impede a entrada de qualquer criatura que não seja Constructo ou Morto-vivo. Criaturas afetadas podem conjurar magias e fazer ataques à distância ou com armas de alcance através dela. Se você se mover de modo que uma criatura afetada fique obrigada a atravessar a barreira, a magia acaba.'],
  ['Mão Arcana','Arcane Hand',5,'Evocação','Ação','36 m (120 pés)','V, S, M','Concentração, até 1 minuto','Uma mão Grande de força brilhante aparece. Ela tem CA 20 e pontos de vida iguais ao seu máximo de PV. Ao conjurar, e depois com ação bônus, você a move até 18 m e escolhe um efeito:\n• Punho cerrado: ataque corpo a corpo com magia; se acertar, 5d8 de dano de energia.\n• Mão poderosa: empurra uma criatura (teste de Força).\n• Mão agarradora: agarra uma criatura Enorme ou menor; depois, pode esmagá-la (dano de concussão).\n• Mão interposta: fica entre você e uma criatura, dando cobertura parcial e atrapalhando o movimento dela.\nCírculos maiores: o dano do punho aumenta 2d8 por círculo acima do 5º.',['Mão de Bigby','Mao Arcana']],
  ['Despertar','Awaken',5,'Transmutação','8 horas','Toque','V, S, M (ágata de 1.000 PO, consumida)','Instantânea','Você toca uma Fera ou Planta Enorme ou menor com Inteligência 3 ou menos. Ela ganha Inteligência 10 e a capacidade de falar um idioma que você conheça. Uma planta também ganha a capacidade de se mover e sentidos parecidos com os humanos. O alvo fica Enfeitiçado por você por 30 dias, ou até você ou um aliado causar dano a ele.'],
  ['Névoa Mortal','Cloudkill',5,'Conjuração','Ação','36 m (120 pés)','V, S','Concentração, até 10 minutos','Uma esfera de névoa venenosa verde-amarelada de 6 m de raio aparece. A área fica totalmente obscurecida. Quando a névoa aparece, cada criatura nela faz um teste de resistência de Constituição: falha, 5d8 de dano de veneno; sucesso, metade. O mesmo vale para quem entra nela pela primeira vez num turno ou termina o turno nela. A névoa se afasta 3 m de você no início de cada turno seu.\nCírculos maiores: +1d8 por círculo acima do 5º.',['Névoa Letal','Nuvem Mortal']],
  ['Comunhão','Commune',5,'Adivinhação · ritual','1 minuto','Pessoal','V, S, M (incenso de 25 PO)','1 minuto','Você contata sua divindade ou um representante dela e faz até três perguntas de sim ou não, que são respondidas com sinceridade (ou "não está claro"). Se conjurar de novo antes de um descanso longo, há 25% de chance cumulativa de não receber resposta.',['Comunhao']],
  ['Comunhão com a Natureza','Commune with Nature',5,'Adivinhação · ritual','1 minuto','Pessoal','V, S','Instantânea','Você se une à natureza e descobre até três fatos sobre o terreno num raio de 4,5 km (ou 90 m em cavernas e subterrâneos): terreno e corpos d\'água, plantas, minerais, animais e povos dominantes, influência de criaturas sobrenaturais, assentamentos, e assim por diante.'],
  ['Cone de Frio','Cone of Cold',5,'Evocação','Ação','Pessoal (cone de 18 m)','V, S, M','Instantânea','Um sopro de ar gelado sai das suas mãos. Cada criatura num cone de 18 m faz um teste de resistência de Constituição: falha, 8d8 de dano de frio; sucesso, metade. Uma criatura morta por esta magia vira uma estátua congelada até derreter.\nCírculos maiores: +1d8 por círculo acima do 5º.'],
  ['Conjurar Elemental','Conjure Elemental',5,'Conjuração','Ação','18 m (60 pés)','V, S','Concentração, até 10 minutos','Você convoca um espírito elemental Grande (ar, terra, fogo ou água) num espaço vazio. Quando uma criatura que você consiga ver entra no espaço dele ou começa o turno a até 1,5 m dele, você pode forçar um teste de resistência de Destreza: se falhar, sofre 8d8 de dano do elemento (elétrico, trovejante, fogo ou frio) e pode ficar Contida pelo espírito. Confira os detalhes de cada elemento no livro.\nCírculos maiores: +2d8 por círculo acima do 5º.'],
  ['Contatar Outro Plano','Contact Other Plane',5,'Adivinhação · ritual','1 minuto','Pessoal','V','1 minuto','Você contata uma entidade de outro plano. Faça um teste de resistência de Inteligência CD 15: se falhar, sofre 6d6 de dano psíquico e fica Incapacitado até terminar um descanso longo. Se passar, pode fazer até cinco perguntas, que a entidade responde com uma palavra ("sim", "não", "talvez", "nunca", "irrelevante" ou "não está claro").'],
  ['Contágio','Contagion',5,'Necromancia','Ação','Toque','V, S','7 dias','Seu toque transmite uma doença mágica. O alvo faz um teste de resistência de Constituição; se falhar, sofre 11d8 de dano necrótico e fica Envenenado. Escolha um atributo: enquanto Envenenado, o alvo tem desvantagem nos testes de resistência desse atributo. No fim de cada turno, o alvo repete o teste até somar três sucessos (a magia acaba) ou três falhas (a magia dura 7 dias nele).',['Contagio']],
  ['Criação','Creation',5,'Ilusão','1 minuto','9 m (30 pés)','V, S, M','Especial','Você tira de outro plano material para criar um objeto não vivo de matéria vegetal ou mineral, de até um cubo de 1,5 m. A duração depende do material: vegetal, 24 horas; pedra ou cristal, 12 horas; metais preciosos, 1 hora; gemas, 10 minutos; adamante ou mithral, 1 minuto. Usar o objeto como componente de magia faz a magia falhar.\nCírculos maiores: o cubo aumenta 1,5 m por círculo acima do 5º.',['Criacao']],
  ['Dissipar o Bem e o Mal','Dispel Evil and Good',5,'Abjuração','Ação','Pessoal','V, S, M','Concentração, até 1 minuto','Até a magia acabar, Celestiais, Elementais, Fadas, Corruptores e Mortos-vivos têm desvantagem nas jogadas de ataque contra você. Você pode encerrar a magia antes para:\n• Quebrar encantamento: tocar uma criatura enfeitiçada, amedrontada ou possuída por uma dessas criaturas e libertá-la.\n• Expulsão: fazer um ataque corpo a corpo com magia contra uma dessas criaturas; se acertar, ela faz um teste de resistência de Carisma e, se falhar, volta ao plano de origem.'],
  ['Dominar Pessoa','Dominate Person',5,'Encantamento','Ação','18 m (60 pés)','V, S','Concentração, até 1 minuto','Um Humanoide que você consiga ver faz um teste de resistência de Sabedoria, com vantagem se você ou aliados estiverem lutando contra ele. Se falhar, fica Enfeitiçado. Enquanto estiverem no mesmo plano, você dá ordens telepáticas e ele obedece. Você pode controlar cada ação dele diretamente usando sua reação. Sempre que sofrer dano, ele repete o teste.\nCírculos maiores: dura até 10 minutos com 6º círculo, até 1 hora com 7º e até 8 horas com 8º ou maior.'],
  ['Sonho','Dream',5,'Ilusão','1 minuto','Especial','V, S, M','8 horas','Você, ou uma criatura disposta que você tocar, entra nos sonhos de uma criatura conhecida no mesmo plano e pode conversar com ela enquanto ela dorme. Você também pode criar um pesadelo: o alvo faz um teste de resistência de Sabedoria e, se falhar, sofre 3d6 de dano psíquico ao acordar e não recebe os benefícios do descanso.'],
  ['Coluna de Chamas','Flame Strike',5,'Evocação','Ação','18 m (60 pés)','V, S, M','Instantânea','Uma coluna de fogo divino desce num cilindro de 3 m de raio e 12 m de altura. Cada criatura na área faz um teste de resistência de Destreza: falha, 5d6 de dano de fogo e 5d6 de dano radiante; sucesso, metade.\nCírculos maiores: +1d6 de fogo e +1d6 radiante por círculo acima do 5º.',['Golpe Flamejante','Coluna de Chama']],
  ['Missão','Geas',5,'Encantamento','1 minuto','18 m (60 pés)','V','30 dias','Você dá uma ordem a uma criatura que consiga ver e que entenda você. Ela faz um teste de resistência de Sabedoria e, se falhar, fica Enfeitiçada e obrigada a cumprir a ordem. Sempre que agir contra a ordem, sofre 5d10 de dano psíquico, no máximo uma vez por dia. Uma ordem suicida encerra a magia.\nCírculos maiores: dura 1 ano com 7º ou 8º círculo, e até ser dissipada com 9º.',['Missao','Geas']],
  ['Restauração Maior','Greater Restoration',5,'Abjuração','Ação','Toque','V, S, M (pó de diamante de 100 PO, consumido)','Instantânea','Você toca uma criatura e desfaz um destes efeitos: 1 nível de Exaustão; a condição Enfeitiçado ou Petrificado; uma maldição, inclusive a sintonização com um item amaldiçoado; qualquer redução num valor de atributo; ou qualquer redução no máximo de pontos de vida.',['Restauracao Maior']],
  ['Consagrar','Hallow',5,'Abjuração','24 horas','Toque','V, S, M (ervas e óleos de 1.000 PO, consumidos)','Até ser dissipada','Você consagra uma área de até 18 m de raio. Celestiais, Elementais, Fadas, Corruptores e Mortos-vivos (os tipos que você escolher) não conseguem entrar na área nem enfeitiçar, amedrontar ou possuir quem estiver nela. Você também prende à área um efeito extra, como coragem, escuridão, luz do dia, proteção ou vulnerabilidade a um tipo de dano, descanso eterno dos mortos, interferência extradimensional, medo, silêncio ou idiomas (veja o livro).'],
  ['Imobilizar Monstro','Hold Monster',5,'Encantamento','Ação','27 m (90 pés)','V, S, M','Concentração, até 1 minuto','Uma criatura que você consiga ver faz um teste de resistência de Sabedoria. Se falhar, fica Paralisada até a magia acabar. No fim de cada turno dela, repete o teste; se passar, a magia acaba.\nCírculos maiores: +1 criatura por círculo acima do 5º.',['Paralisar Monstro']],
  ['Praga de Insetos','Insect Plague',5,'Conjuração','Ação','90 m (300 pés)','V, S, M','Concentração, até 10 minutos','Um enxame de gafanhotos enche uma esfera de 6 m de raio. A área fica levemente obscurecida e vira terreno difícil. Quando o enxame aparece, cada criatura nele faz um teste de resistência de Constituição: falha, 4d10 de dano perfurante; sucesso, metade. O mesmo vale para quem entra na área pela primeira vez num turno ou termina o turno nela.\nCírculos maiores: +1d10 por círculo acima do 5º.'],
  ['Lenda','Legend Lore',5,'Adivinhação','10 minutos','Pessoal','V, S, M (incenso de 250 PO, consumido, e quatro tiras de marfim de 50 PO)','Instantânea','Diga o nome ou descreva uma pessoa, lugar ou objeto famoso. Você recebe um resumo das lendas importantes sobre ele, que podem ser histórias, canções ou fatos esquecidos. Quanto mais você souber, mais precisa a informação. Se não for algo lendário, você não descobre nada.',['Conhecimento Lendário','Lendas e Histórias']],
  ['Curar Ferimentos em Massa','Mass Cure Wounds',5,'Abjuração','Ação','18 m (60 pés)','V, S','Instantânea','Até seis criaturas numa esfera de 9 m de raio recuperam, cada uma, 5d8 + seu modificador de conjuração em pontos de vida.\nCírculos maiores: +1d8 por círculo acima do 5º.',['Curar Feridas em Massa']],
  ['Despistar','Mislead',5,'Ilusão','Ação','Pessoal','S','Concentração, até 1 hora','Você fica Invisível e uma cópia ilusória sua aparece no seu lugar. A invisibilidade acaba se você atacar ou conjurar uma magia. Como ação bônus, você move a cópia até 18 m e controla os gestos e a fala dela, e pode ver e ouvir pelos sentidos dela (ficando cego e surdo para o que está à sua volta).',['Ilusão Enganosa']],
  ['Modificar Memória','Modify Memory',5,'Encantamento','Ação','9 m (30 pés)','V, S','Concentração, até 1 minuto','Uma criatura que você consiga ver faz um teste de resistência de Sabedoria, com vantagem se estiver lutando contra você. Se falhar, fica Enfeitiçada e Incapacitada, sem perceber o que está acontecendo. Enquanto isso, você pode apagar ou alterar a lembrança que ela tem de um evento das últimas 24 horas que durou até 10 minutos. A mudança precisa fazer algum sentido para ela.\nCírculos maiores: pode alterar memórias de até 7 dias (6º), 30 dias (7º), 1 ano (8º) ou qualquer época (9º).'],
  ['Passagem','Passwall',5,'Transmutação','Ação','9 m (30 pés)','V, S, M','1 hora','Uma passagem de até 1,5 m de largura, 2,4 m de altura e 6 m de profundidade se abre numa superfície de madeira, gesso ou pedra que você consiga ver. Quando a magia acaba, quem estiver dentro é empurrado para fora com segurança.',['Passar pela Parede']],
  ['Vínculo Planar','Planar Binding',5,'Abjuração','1 hora','18 m (60 pés)','V, S, M (joia de 1.000 PO, consumida)','24 horas','Você tenta prender a seu serviço um Celestial, Elemental, Fada ou Corruptor ao alcance (que costuma estar preso num círculo mágico). Ele faz um teste de resistência de Carisma; se falhar, precisa servir você até a magia acabar, seguindo suas ordens da melhor forma possível.\nCírculos maiores: dura 10 dias (6º), 30 dias (7º), 180 dias (8º) ou 1 ano e 1 dia (9º).'],
  ['Reviver os Mortos','Raise Dead',5,'Necromancia','1 hora','Toque','V, S, M (diamante de 500 PO, consumido)','Instantânea','Você traz de volta à vida uma criatura que morreu há no máximo 10 dias, se a alma dela quiser voltar. Ela volta com 1 ponto de vida. A magia neutraliza venenos, mas não doenças mágicas, maldições nem partes do corpo perdidas, e não funciona em mortos-vivos nem em quem morreu de velhice. Ao voltar, a criatura sofre −4 em todos os Testes de D20, e a penalidade diminui 1 a cada descanso longo.',['Reviver Mortos','Ressuscitar os Mortos']],
  ['Vidência','Scrying',5,'Adivinhação','10 minutos','Pessoal','V, S, M (foco de 1.000 PO)','Concentração, até 10 minutos','Você vê e ouve uma criatura específica no mesmo plano. Ela faz um teste de resistência de Sabedoria, modificado pelo quanto você a conhece e pela ligação que tem com ela (retrato, objeto pessoal, parte do corpo). Se falhar, um sensor invisível aparece perto dela e segue os movimentos dela. Se passar, você não pode tentar de novo por 24 horas. Também pode mirar um lugar que você já tenha visto.',['Videncia']],
  ['Semblante','Seeming',5,'Ilusão','Ação','9 m (30 pés)','V, S','8 horas','Você muda a aparência de qualquer número de criaturas que consiga ver, inclusive roupas e equipamentos. Uma criatura relutante faz um teste de resistência de Carisma. Cada aparência pode ficar até 30 cm mais alta ou mais baixa. A ilusão não resiste ao toque. Uma criatura pode usar a ação de Estudar com teste de Inteligência (Investigação) contra a sua CD para perceber.',['Aparência','Disfarce em Grupo']],
  ['Telecinese','Telekinesis',5,'Transmutação','Ação','18 m (60 pés)','V, S','Concentração, até 10 minutos','Ao conjurar, e depois com a ação de Magia, você move com a mente uma criatura Enorme ou menor ou um objeto de até 500 kg ao alcance:\n• Criatura: ela faz um teste de resistência de Força; se falhar, você a move até 9 m (até o limite do alcance), e ela fica Contida até o fim do seu próximo turno.\n• Objeto: você o move até 9 m. Se alguém estiver segurando, faz um teste contra a sua CD. Você pode manipular o objeto com precisão.'],
  ['Vínculo Telepático','Telepathic Bond',5,'Adivinhação · ritual','Ação','9 m (30 pés)','V, S, M','1 hora','Até oito criaturas dispostas que você escolher ficam ligadas por telepatia. Até a magia acabar, elas se comunicam mentalmente em qualquer distância, desde que estejam no mesmo plano, mesmo sem falar o mesmo idioma.',['Elo Telepático de Rary','Elo Telepático','Vinculo Telepatico']],
  ['Círculo de Teletransporte','Teleportation Circle',5,'Conjuração','1 minuto','3 m (10 pés)','V, M (giz e tintas de 50 PO, consumidos)','1 rodada','Você desenha um círculo de 3 m de diâmetro ligado a um círculo de teletransporte permanente cuja sequência de símbolos você conhece, no mesmo plano. Um portal se abre até o fim do seu próximo turno, e quem entrar nele aparece a até 1,5 m do círculo de destino.',['Circulo de Teletransporte']],
  ['Caminhar em Árvores','Tree Stride',5,'Conjuração','Ação','Pessoal','V, S','Concentração, até 1 minuto','Você pode entrar numa árvore e sair de outra do mesmo tipo a até 150 m. As duas precisam ser vivas e pelo menos do seu tamanho. Entrar e sair custa 1,5 m de movimento. Pode fazer isso uma vez por turno até a magia acabar.',['Andar em Árvores','Passos de Árvore']],
  ['Muralha de Energia','Wall of Force',5,'Evocação','Ação','36 m (120 pés)','V, S, M','Concentração, até 10 minutos','Uma muralha invisível de força surge: uma cúpula ou esfera de até 3 m de raio, ou uma superfície de até dez painéis de 3 m por 3 m ligados entre si. Nada atravessa a muralha fisicamente. Ela é imune a todo dano e não pode ser dissipada por Dissipar Magia, mas Desintegrar a destrói na hora. Ela também se estende ao Plano Etéreo.',['Muralha de Força','Parede de Força']],

/* A imagem é reduzida no navegador (lado maior até 400 px, JPEG) e guardada como texto na própria ficha. */
const IMG_MAX = 90000;
const IMG_RE = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
const imgOk = s => typeof s==='string' && s.length<=IMG_MAX && IMG_RE.test(s);
async function fileToPortrait(file){
  if (!file || !/^image\//.test(file.type)) throw new Error('Escolha um arquivo de imagem (JPG, PNG, WEBP…).');
  if (file.size > 20e6) throw new Error('Imagem grande demais (máximo 20 MB).');
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { throw new Error('Não foi possível ler essa imagem.'); }
  const esc = Math.min(1, 400/Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(bmp.width*esc)); cv.height = Math.max(1, Math.round(bmp.height*esc));
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#1d1915'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(bmp, 0, 0, cv.width, cv.height); bmp.close?.();
  let q = .85, url;
  do { url = cv.toDataURL('image/jpeg', q); q -= .1; } while (url.length > IMG_MAX && q > .25);
  if (!imgOk(url)) throw new Error('Não foi possível reduzir a imagem o bastante. Tente outra.');
  return url;
}

/* ============ ARMAZENAMENTO ============ */
function makeLocalStore(){
  const mem = {chars:{}, reqs:{}, est:{}, regras:{}, mestres:[]}; const cc=[], rc=[], ec=[], gc=[], mc=[];
  const emitG = () => gc.forEach(f=>f(clone(mem.regras)));
  const emitC = () => cc.forEach(f=>f(Object.values(mem.chars).map(clone)));
  const emitR = () => rc.forEach(f=>f(clone(mem.reqs)));
  const emitE = () => ec.forEach(f=>f(clone(mem.est)));
  return {
    onCharacters(cb){ cc.push(cb); setTimeout(emitC); },
    onEstado(cb){ ec.push(cb); setTimeout(emitE); },
    async setEstado(owner,charId,e){ (mem.est[owner] ||= {chars:{}}).chars[charId]=clone(e); emitE(); },
    onRequests(cb){ rc.push(cb); setTimeout(emitR); },
    onRegras(cb){ gc.push(cb); setTimeout(emitG); },
    onMestres(cb){ mc.push(cb); setTimeout(()=>cb({ids:[...mem.mestres], dono:'demo-mestre'})); },
    async saveMestres(ids){ mem.mestres=[...ids]; mc.forEach(f=>f({ids:[...ids], dono:'demo-mestre'})); },
    async saveRegra(slug,r){ mem.regras[slug]=clone(r); emitG(); },
    async deleteRegra(slug){ delete mem.regras[slug]; emitG(); },
    async ensureEstado(){ if(!mem.est[S.myId]){ mem.est[S.myId]={chars:{}}; emitE(); } },
    async saveCharacter(c){ mem.chars[c.id]=clone(c); emitC(); },
    async deleteCharacter(id){ delete mem.chars[id]; emitC(); },
    async addRequest(item){ (mem.reqs[S.myId] ||= {items:{}}).items[item.id]=clone(item); emitR(); },
    async resolveRequest(owner,id,patch){ const it=mem.reqs[owner].items[id]; const {payload,...rest}=patch; Object.assign(it,rest); if(payload) Object.assign(it.payload,payload); emitR(); }
  };
}
function makeDbStore(db){
  const chain = {};
  const q = (path,fn) => (chain[path] = (chain[path]||Promise.resolve()).catch(()=>{}).then(fn));
  return {
    onCharacters(cb,err){
      return db.collection('characters').onSnapshot(s => cb(s.docs.filter(d=>d.exists).map(d=>({...clone(d.data()), id:d.id})), s.metadata), err);
    },
    onRequests(cb,err){
      if (S.isMaster) return db.collection('requests').onSnapshot(s => { const m={}; s.docs.forEach(d=>{ if(d.exists) m[d.id]=clone(d.data()); }); cb(m); }, err);
      return db.doc('requests/'+S.myId).onSnapshot(d => cb(d.exists ? {[S.myId]:clone(d.data())} : {}), err);
    },
    saveCharacter(c){ const {id,...rest}=clone(c); return q('characters/'+id, ()=>db.doc('characters/'+id).set(rest)); },
    deleteCharacter(id){ return q('characters/'+id, ()=>db.doc('characters/'+id).delete()); },
    onEstado(cb,err){
      return db.collection('estado').onSnapshot(s => { const m={}; s.docs.forEach(d=>{ if(d.exists) m[d.id]=clone(d.data()); }); cb(m); }, err);
    },
    setEstado(owner,charId,e){
      const p='estado/'+owner; e=clone(e);
      return q(p, async ()=>{ const ref=db.doc(p); const snap=await ref.get();
        if (!snap.exists) return ref.set({chars:{[charId]:e}});
        return ref.update({chars:{[charId]:e}}); });
    },
    ensureEstado(){ const p='estado/'+S.myId; return q(p, async ()=>{ const ref=db.doc(p); const snap=await ref.get(); if(!snap.exists) await ref.set({chars:{}}); }); },
    addRequest(item){
      const p='requests/'+S.myId; item=clone(item);
      return q(p, async ()=>{
        const ref=db.doc(p); const snap=await ref.get();
        if (!snap.exists) return ref.set({items:{[item.id]:item}});
        const items = snap.data().items || {};
        const done = Object.values(items).filter(i=>i.status!=='pendente').sort((a,b)=>a.at<b.at?1:-1);
        if (done.length > 40) {
          const keep = {}; Object.values(items).forEach(i=>{ if(i.status==='pendente') keep[i.id]=i; });
          done.slice(0,20).forEach(i=>keep[i.id]=i); keep[item.id]=item;
          return ref.set({items:keep});
        }
        return ref.update({items:{[item.id]:item}});
      });
    },
    onMestres(cb,err){ return db.doc('config/mestres').onSnapshot(d => { const v=d.exists?d.data():{}; cb({ids:(v.ids||[]).filter(x=>typeof x==='string'), dono:typeof v.dono==='string'?v.dono:null}); }, err); },
    saveMestres(ids){ return q('config/mestres', ()=>db.doc('config/mestres').set({ids:[...ids], dono:S.myId})); },
    onRegras(cb,err){ return db.collection('regras').onSnapshot(s => { const m={}; s.docs.forEach(d=>{ if(d.exists) m[d.id]=clone(d.data()); }); cb(m); }, err); },
    saveRegra(slug,r){ return q('regras/'+slug, ()=>db.doc('regras/'+slug).set(clone(r))); },
    deleteRegra(slug){ return q('regras/'+slug, ()=>db.doc('regras/'+slug).delete()); },
    resolveRequest(owner,id,patch){ const p='requests/'+owner; return q(p, ()=>db.doc(p).update({items:{[id]:patch}})); }
  };
}

/* ============ REGRAS: CÁLCULOS DA FICHA ============ */
function hpMax(c){
  const sp=SPECIES[c.especie]||{};
  const vigoroso = ((c.talentos||[]).some(t=>/vigoroso|tough/i.test(t)) ? 2*c.nivel : 0) + ((c.talentos||[]).some(t=>/fortitude/i.test(t)) ? 40 : 0);
  return Math.max(c.nivel, c.pvBase + c.nivel*mod(c.atributos.CON) + (sp.pvExtra ? sp.pvExtra*c.nivel : 0) + vigoroso);
}
function derive(c){
  const cls=CLASSES[c.classe], sp=SPECIES[c.especie];
  const m={}; AB.forEach(a=>m[a]=mod(c.atributos[a]));
  const P=profBonus(c.nivel);
  const ar=ARMORS[c.armadura]||ARMORS.nenhuma;
  let ac;
  if (c.armadura==='nenhuma' && cls.sem && !(c.classe==='monge' && c.escudo)) ac = 10 + m.DES + m[cls.sem];
  else ac = ar.base + (ar.dex==='full' ? m.DES : ar.dex===0 ? 0 : Math.min(m.DES, ar.dex));
  if (c.escudo) ac += 2;
  ac += (+c.caBonus||0);
  const alerta = (c.talentos||[]).some(t=>/alerta/i.test(t));
  const resil = (c.talentos||[]).map(t=>/^ *(?:resiliente|resilient)[^(]*[(](?:[+]1 *)?(FOR|DES|CON|INT|SAB|CAR)[)]/i.exec(t)).filter(Boolean).map(x=>x[1].toUpperCase());
  const saves = AB.map(a=>{ const prof=cls.saves.includes(a)||resil.includes(a); return {a, prof, v:m[a]+(prof?P:0)}; });
  const skills = SKILLS.map(([k,n,a])=>{ const prof=(c.pericias||[]).includes(k); return {k,n,a,prof,v:m[a]+(prof?P:0)}; });
  const perc = skills.find(s=>s.k==='percepcao').v;
  let magia=null;
  if (cls.magia){
    const ab=cls.magia.ab;
    const slots = cls.magia.tipo==='total' ? FULL_SLOTS[c.nivel] : cls.magia.tipo==='meia' ? FULL_SLOTS[Math.ceil(c.nivel/2)] : null;
    const pacto = cls.magia.tipo==='pacto' ? PACT(c.nivel) : null;
    magia = {ab, cd:8+P+m[ab], atk:P+m[ab], tipo:cls.magia.tipo, slots, pacto,
      truques: truquesDe(c.classe,c.nivel), preparadas: PREP[c.classe][c.nivel-1], maxCirc: pacto ? pacto.circ : slots.length};
  }
  const d = {cls, sp, m, P, max:hpMax(c), ac, init:m.DES+(alerta?P:0), desl:sp.desl, saves, skills, passiva:10+perc, magia};
  d.ataques = attacks(c,d);
  return d;
}
function attacks(c,d){
  const out=[];
  const monge = c.classe==='monge';
  const artes = monge ? (c.nivel<5?'1d6':c.nivel<11?'1d8':c.nivel<17?'1d10':'1d12') : null;
  const abU = monge && d.m.DES>d.m.FOR ? 'DES' : 'FOR';
  out.push({id:'_desarmado', nome:'Ataque desarmado', ab:abU, prof:true, atk:d.m[abU]+d.P, dado:artes||'1', mod:d.m[abU], dano:'concussão', props:monge?['artes marciais']:[], fixo:true});
  (c.armas||[]).forEach(w=>{
    const fin = w.props.includes('acuidade');
    const mongeArma = monge && !w.dist && (w.cat==='s' || w.props.includes('leve'));
    let ab = w.dist ? 'DES' : 'FOR';
    if ((fin || mongeArma) && d.m.DES > d.m.FOR) ab='DES';
    const prof = w.base==='custom' ? !!w.prof : weaponProf(c.classe,w);
    const b = +w.bonus||0;
    let dado = w.dado;
    if (mongeArma && artes && avgDie(artes)>avgDie(w.dado)) dado=artes;
    out.push({id:w.id, nome:w.nome, dist:w.dist, ab, prof, atk:d.m[ab]+(prof?d.P:0)+b, dado, vers:w.vers, mod:d.m[ab]+b, dano:w.dano, props:w.props, alc:w.alc, obs:w.obs, bonus:b, base:w.base, cat:w.cat});
  });
  return out;
}
function avgDie(e){ const m=/^(\d+)d(\d+)$/.exec(e||''); return m ? +m[1]*(+m[2]+1)/2 : +e||0; }
function est(c){ const e=S.estado[c.ownerId]?.chars?.[c.id]; const base=ESTADO_PADRAO(); return e ? {...base, ...clone(e), morte:{...base.morte, ...(e.morte||{})}} : base; }
/* rolagem do dado de vida feita no app para o próximo nível (fica no estado do personagem; uma por nível) */
function lvlRollFor(c){ const r=est(c).lvlRoll; return r && r.nivel===c.nivel+1 && +r.v>=1 ? r : null; }
function pvAtual(c,d){ return Math.max(0, (d||derive(c)).max - est(c).dano); }
function spellWarnings(c){
  const d=derive(c); if(!d.magia) return (c.magias||[]).length ? ['Esta classe não conjura magias por conta própria.'] : [];
  const w=[], ms=c.magias||[];
  const tr=ms.filter(s=>+s.circ===0 && !s.extra).length, pr=ms.filter(s=>+s.circ>0 && s.prep && !s.extra).length;
  if (tr>d.magia.truques) w.push(`Truques acima do limite (${tr}/${d.magia.truques}).`);
  if (pr>d.magia.preparadas) w.push(`Magias preparadas acima do limite (${pr}/${d.magia.preparadas}).`);
  const alto=ms.filter(s=>+s.circ>d.magia.maxCirc && !s.extra);
  if (alto.length) w.push(`Acima do círculo máximo (${d.magia.maxCirc}º): ${alto.map(s=>s.nome).join(', ')}.`);
  return w;
}

function newDraft(){
  const z = v => Object.fromEntries(AB.map(a=>[a,v]));
  return {nome:'', especie:'humano', classe:'guerreiro', antecedente:'soldado', bonusModo:'2-1', b2:'', b1:'',
    customAbs:['','',''], customSkills:['',''], customTalento:'', metodo:'padrao', padrao:z(''), compra:z(8), manual:z(10),
    classSkills:[], extraSkill:'', armadura:'nenhuma', escudo:false, arma1:'', arma2:'', ouro:0, alinhamento:'', historia:'', retrato:'', campanha:'',
    nivel:1, hpModo:'media', hpRolls:{}, subclasse:'', melhorias:{}};
}
function draftCompute(d){
  const cls=CLASSES[d.classe], sp=SPECIES[d.especie], bg=BACKGROUNDS[d.antecedente];
  const errors=[]; const base={};
  AB.forEach(a=>{ base[a] = d.metodo==='padrao' ? (+d.padrao[a]||0) : d.metodo==='compra' ? +d.compra[a] : (+d.manual[a]||0); });
  let spent=0;
  if (d.metodo==='padrao'){
    const used=AB.map(a=>d.padrao[a]).filter(v=>v!=='').map(Number);
    if (used.length<6) errors.push('Distribua todos os valores do conjunto padrão (15, 14, 13, 12, 10, 8).');
    else if ([...used].sort().join()!==[...STD_ARRAY].sort().join()) errors.push('Cada valor do conjunto padrão deve ser usado uma única vez.');
  }
  if (d.metodo==='compra'){ spent=AB.reduce((s,a)=>s+PB_COST[d.compra[a]],0); if (spent>27) errors.push(`Compra de pontos: ${spent}/27 pontos gastos.`); }
  if (d.metodo==='manual') AB.forEach(a=>{ if(!(base[a]>=3 && base[a]<=18)) errors.push(`${AB_NOME[a]}: o valor rolado deve ficar entre 3 e 18.`); });
  const bgAbs = bg.custom ? d.customAbs : bg.abs;
  if (bg.custom && (bgAbs.some(v=>!v) || new Set(bgAbs).size<3)) errors.push('Antecedente: escolha três atributos diferentes.');
  const bonus=Object.fromEntries(AB.map(a=>[a,0]));
  if (d.bonusModo==='2-1'){
    if (!d.b2 || !d.b1 || d.b2===d.b1 || !bgAbs.includes(d.b2) || !bgAbs.includes(d.b1)) errors.push('Antecedente: escolha +2 e +1 em atributos diferentes da lista do antecedente.');
    else { bonus[d.b2]+=2; bonus[d.b1]+=1; }
  } else bgAbs.filter(Boolean).forEach(a=>bonus[a]+=1);
  const final={}; AB.forEach(a=>{ final[a]=base[a]+bonus[a]; if(final[a]>20) errors.push(`${AB_NOME[a]} não pode passar de 20.`); });
  const bgSkills = bg.custom ? d.customSkills.filter(Boolean) : bg.skills;
  if (bg.custom && (bgSkills.length<2 || bgSkills[0]===bgSkills[1])) errors.push('Antecedente: escolha duas perícias diferentes.');
  const skills=new Set(bgSkills);
  const cs=d.classSkills.filter(s=>!skills.has(s) && cls.skills.includes(s));
  if (cs.length!==cls.n) errors.push(`Perícias da classe: escolha ${cls.n} (${cs.length}/${cls.n}).`);
  cs.forEach(s=>skills.add(s));
  if (sp.extraSkill){
    if (!d.extraSkill) errors.push(`Escolha a perícia extra de ${sp.nome}.`);
    else if (skills.has(d.extraSkill)) errors.push('A perícia extra da espécie repete outra já escolhida.');
    else skills.add(d.extraSkill);
  }
  if (!String(d.nome).trim()) errors.push('Dê um nome ao personagem.');
  if (!(+d.ouro>=0)) errors.push('O ouro inicial não pode ser negativo.');
  const talentos=[]; const t = bg.custom ? String(d.customTalento).trim() : bg.talento; if (t) talentos.push(t);
  if (d.especie==='humano') talentos.push('Talento de origem extra (Versátil): definir com o mestre');
  const r={cls,sp,bg,base,bonus,final,skills,errors,spent,bgAbs,bgSkills,talentos,nivel:draftLevel(d),sim:null};
  if (!errors.length && r.nivel>1){ try { r.sim=applyLevels(baseCharacter(d,r,'x'), d); } catch(e){ errors.push(e.message); } }
  return r;
}
/* Criação em nível alto: a ficha nasce no nível 1 e sobe nível a nível com as mesmas regras do pedido "Subir de nível". */
const draftLevel = d => Math.max(1, Math.min(20, Math.floor(+d.nivel||1)));
function levelPayload(d, l){
  const m=(d.melhorias||{})[l]||{};
  return {hp:d.hpModo==='rolado'?'rolado':'media', rolado:(d.hpRolls||{})[l], subclasse:d.subclasse, asiModo:m.modo||'2', a1:m.a1||'', a2:m.a2||'', talento:m.talento||'', talentoOutro:m.talentoOutro||'', fatr:m.fatr||''};
}
function applyLevels(c, d){
  const alvo=draftLevel(d);
  for (let l=2; l<=alvo; l++){ try { c=applyChange(c,'nivel',levelPayload(d,l)); } catch(e){ throw new Error(`Nível ${l}: ${e.message}`); } }
  return c;
}
function buildCharacter(d, ownerId){

function newWeapon(base, p={}){

function describe(type,p,c){

    case 'nivel': {
      const dv=CLASSES[c?.classe]?.dado; const dd=dv?`d${dv}`:'dado de vida';
      let s=`Subir para o nível ${(c?.nivel||0)+1}, ${p.hp==='rolado'?`PV: rolou ${p.rolado} no ${dd}${p.rolApp?' (rolado no app)':''}`:`PV pela média${dv?` (${dv/2+1})`:''}`}`;
      if (p.ajusteMestre) s+=` (ajustado pelo mestre; o jogador ${p.ajusteMestre})`;
      if (p.asiModo==='2') s+=`, +2 ${p.a1}`; else if (p.asiModo==='11') s+=`, +1 ${p.a1} e +1 ${p.a2}`; else if (p.asiModo==='talento') s+=`, talento: ${p.talento==='__outro'?p.talentoOutro:p.talento}${p.fatr?` (+1 ${p.fatr})`:''}`;
      if (p.subclasse) s+=`, subclasse: ${p.subclasse}`; return s;
    }
    case 'equip': return `Equipar: ${ARMORS[p.armadura]?.nome}${p.escudo?' + escudo':''}${+p.caBonus?`, bônus mágico ${sg(+p.caBonus)} CA`:''}`;
    case 'atributo': return 'Atributos: '+atrPares(p).map(([a,v])=>`${AB_NOME[a]} ${sg(v)}${c?.atributos?` (${c.atributos[a]} → ${c.atributos[a]+v})`:''}`).join(', ');
    case 'nota': return `Anotação: ${p.texto}`;
    case 'status': return `Status: ${STATUS[p.tipo]?.nome||'?'}${String(p.campanha||'').trim()?`, campanha ${String(p.campanha).trim()}`:', sem campanha'}`;
    case 'retrato': return p.acao==='remover' ? 'Remover a imagem do personagem' : 'Nova imagem do personagem';
    case 'clonar': return `Clonar a ficha${c?` de ${c.nome}`:''} como "${p.nome}"`;
  }
  return 'Mudança: '+type;
}

function applyChange(c0, type, p){
  const c=clone(c0); const cls=CLASSES[c.classe];
  c.armas ||= []; c.magias ||= [];
  const int = (v,min=0) => { const n=Math.floor(+v); if(!Number.isFinite(n) || n<min) throw new Error('Valor inválido.'); return n; };
  switch(type){
    case 'moedas': {
      if (!COINS.some(([k])=>Math.floor(+p[k]||0))) throw new Error('Informe algum valor.');
      COINS.forEach(([k,ab])=>{ const d=Math.floor(+p[k]||0); const v=(c.moedas[k]||0)+d; if(v<0) throw new Error(`Moedas insuficientes de ${ab}.`); c.moedas[k]=v; });
      break;
    }
    case 'item': {
      const n=int(p.qtd,1); const nome=String(p.nome||'').trim(); if(!nome) throw new Error('Informe o item.');
      const i=c.inventario.findIndex(x=>x.nome.toLowerCase()===nome.toLowerCase());
      if (p.acao==='add'){ if(i>=0){ c.inventario[i].qtd+=n; if(p.obs) c.inventario[i].obs=p.obs; } else c.inventario.push({nome:nome.slice(0,80),qtd:n,obs:String(p.obs||'').slice(0,120)}); }
      else { if(i<0) throw new Error('Item não está no inventário.'); if(c.inventario[i].qtd<n) throw new Error('Quantidade maior que a disponível.'); c.inventario[i].qtd-=n; if(!c.inventario[i].qtd) c.inventario.splice(i,1); }
      break;
    }
    case 'arma_add': {
      if (c.armas.length>=12) throw new Error('Limite de 12 armas na ficha.');
      c.armas.push(newWeapon(p.base, p));
      break;
    }
    case 'arma_rem': {
      const i=c.armas.findIndex(w=>w.id===p.ref); if(i<0) throw new Error('Arma não encontrada na ficha.');
      c.armas.splice(i,1); break;
    }
    case 'magia_nova': {
      if (!cls.magia && !p.extra) throw new Error('Esta classe não conjura magias. Marque "não conta no limite" para magias vindas de talento ou item.');
      const nome=String(p.nome||'').trim().slice(0,60); if(!nome) throw new Error('Informe o nome da magia.');
      const circ=int(p.circ,0); if(circ>9) throw new Error('Círculo inválido.');
      if (c.magias.some(s=>s.nome.toLowerCase()===nome.toLowerCase())) throw new Error('Essa magia já está na ficha.');
      if (c.magias.length>=80) throw new Error('Limite de magias na ficha.');
      c.magias.push({id:newId(), nome, circ, prep: circ===0 || !!p.prep, extra:!!p.extra, obs:String(p.obs||'').slice(0,120)});
      c.magias.sort((a,b)=>a.circ-b.circ || a.nome.localeCompare(b.nome));
      break;
    }
    case 'magia_prep': {
      const s=c.magias.find(x=>x.id===p.ref); if(!s) throw new Error('Magia não encontrada na ficha.');
      if (+s.circ===0) throw new Error('Truques estão sempre disponíveis.');
      const want = p.prep==='1'; if (s.prep===want) throw new Error(want?'A magia já está preparada.':'A magia já não está preparada.');
      s.prep=want; break;
    }
    case 'magia_rem': {
      const i=c.magias.findIndex(x=>x.id===p.ref); if(i<0) throw new Error('Magia não encontrada na ficha.');
      c.magias.splice(i,1); break;
    }
    case 'nivel': {
      const nl=c.nivel+1; if (nl>20) throw new Error('O personagem já está no nível 20.');
      let ganho = cls.dado/2+1;
      if (p.hp==='rolado'){
        ganho = Math.floor(+p.rolado);
        if (String(p.rolado??'').trim()==='' || !Number.isFinite(ganho)) throw new Error(`Informe o valor que saiu no d${cls.dado} de vida.`);
        if (ganho<1 || ganho>cls.dado) throw new Error(`O valor rolado deve ficar entre 1 e ${cls.dado} (dado de vida d${cls.dado}).`);
      }
      c.nivel=nl; c.pvBase+=ganho;
      if (isAsiLevel(cls,nl)){
        if (p.asiModo==='2'){ if(!p.a1) throw new Error('Escolha o atributo.'); c.atributos[p.a1]+=2; }
        else if (p.asiModo==='11'){ if(!p.a1||!p.a2||p.a1===p.a2) throw new Error('Escolha dois atributos diferentes.'); c.atributos[p.a1]+=1; c.atributos[p.a2]+=1; }
        let lim=20;
        if (p.asiModo==='talento'){
          const nm=String((p.talento==='__outro' ? p.talentoOutro : p.talento)||'').trim(); if(!nm) throw new Error('Escolha o talento.');
          const f=FEATS[ruleKey(nm)];
          if (f){ const err=featCheck(f,c,nl); if(err) throw new Error(err);
            let txt=f.nome;
            if (f.abs.length){ if(!f.abs.includes(p.fatr)) throw new Error(`${f.nome}: escolha o atributo que recebe +1 (${f.abs.map(a=>AB_NOME[a]).join(', ')}).`);
              lim=f.max; c.atributos[p.fatr]+=1; txt+=` (+1 ${p.fatr})`;
              if (c.atributos[p.fatr]>lim) throw new Error(`${AB_NOME[p.fatr]} não pode passar de ${lim}.`); }
            c.talentos.push(txt);
          } else c.talentos.push(nm.slice(0,80));
        }
        else if (p.asiModo!=='2' && p.asiModo!=='11') throw new Error('Este nível concede Melhoria de Atributo ou talento: escolha uma opção.');
        if (lim===20) AB.forEach(a=>{ if(c.atributos[a]>20) throw new Error(`${AB_NOME[a]} não pode passar de 20.`); });
      }
      if (nl===3){ if(!String(p.subclasse||'').trim()) throw new Error('No nível 3 o personagem escolhe a subclasse.'); c.subclasse=String(p.subclasse).trim().slice(0,60); }
      break;
    }
    case 'equip': {
      if(!ARMORS[p.armadura]) throw new Error('Armadura inválida.');
      c.armadura=p.armadura; c.escudo=!!p.escudo; c.caBonus=Math.max(-5,Math.min(5,Math.floor(+p.caBonus||0)));
      break;
    }
    case 'status': {
      if (!STATUS[p.tipo]) throw new Error('Escolha um status.');
      const campanha=String(p.campanha||'').trim().replace(/\s+/g,' ').slice(0,60); const s=statusOf(c);
      if (s.tipo===p.tipo && s.campanha===campanha) throw new Error('O status e a campanha já são esses.');
      c.status={tipo:p.tipo, campanha}; break;
    }
    case 'atributo': {
      const pares=atrPares(p); if(!pares.length) throw new Error('Escolha o atributo e o valor.');
      if (pares.length===2 && pares[0][0]===pares[1][0]) throw new Error('Escolha dois atributos diferentes.');
      const max = p.limite==='30' ? 30 : 20;
      pares.forEach(([a,v])=>{ const nv=c.atributos[a]+v;
        if (nv>max) throw new Error(`${AB_NOME[a]} não pode passar de ${max}${max===20?' (escolha o limite 30 se for item mágico ou dádiva épica)':''}.`);
        if (nv<1) throw new Error(`${AB_NOME[a]} não pode ficar abaixo de 1.`);
        c.atributos[a]=nv; });
      break;
    }
    case 'nota': {
      const t=String(p.texto||'').trim(); if(!t) throw new Error('Escreva a anotação.');
      c.notas = (c.notas ? c.notas+'\n' : '') + `[${new Date().toLocaleDateString('pt-BR')}] ` + t.slice(0,500);
      break;
    }
    case 'retrato': {
      if (p.acao==='remover'){ if(!c.retrato) throw new Error('O personagem não tem imagem.'); c.retrato=''; }
      else { if(!imgOk(p.img)) throw new Error('A imagem foi descartada ou é inválida. Envie de novo.'); c.retrato=p.img; }
      break;
    }
    default: throw new Error('Este tipo de mudança não é mais usado.');
  }
  return c;
}
function addLog(c, text, by, motivo){
  c.log = [{at:nowIso(), text, by, approvedBy:S.myId, motivo:motivo||''}, ...(c.log||[])].slice(0,80);
}

/* ============ AÇÕES ============ */
async function submitAction(form){
  const c=S.chars.find(x=>x.id===S.charId); if(!c) return;
  const fd=new FormData(form); const p=Object.fromEntries(fd.entries()); const type=form.dataset.type;
  if (type==='equip') p.escudo = fd.get('escudo')==='on';
  if (type==='arma_rem') p.nomeRef = (c.armas||[]).find(w=>w.id===p.ref)?.nome;
  if (type==='magia_prep' || type==='magia_rem') p.nomeRef = (c.magias||[]).find(x=>x.id===p.ref)?.nome;
  if (type==='nivel'){ const lr=lvlRollFor(c); if (lr){ p.hp='rolado'; p.rolado=String(lr.v); p.rolApp='1'; } else delete p.rolApp; }
  const motivo=String(p.motivo||'').slice(0,200); delete p.motivo;
  try {
    applyChange(c, type, p); // valida antes de enviar
    if (S.isMaster){
      const n=applyChange(c,type,p); addLog(n, describe(type,p,c), S.myId, motivo);
      await store.saveCharacter(n); toast('Mudança aplicada.');
    } else {
      await store.addRequest({id:newId(), charId:c.id, charNome:c.nome, type, payload:p, motivo, by:S.myId, at:nowIso(), status:'pendente'});
      toast('Enviado ao mestre para aprovação.');
    }
    form.reset();
  } catch(e){ toast(errTxt(e) || ('Não foi possível salvar ('+(e.code||'erro')+').')); }
}
async function submitCreate(){
  const r=draftCompute(S.draft); if (r.errors.length){ toast(r.errors[0]); return; }
  try {
    if (S.isMaster){
      const dono=S.draft.dono||S.myId; if(!knownPeople().some(p=>p.id===dono)) throw new Error('Escolha o dono da ficha.');
      const c=buildCharacter(S.draft, dono); addLog(c,'Personagem criado'+(c.nivel>1?` no nível ${c.nivel}`:''),S.myId,''); if(dono!==S.myId) c.log[0].dono=dono;
      await store.saveCharacter(c); toast('Personagem criado.'); S.charId=c.id; S.tab='ficha';
    } else {
      await store.addRequest({id:newId(), charId:null, charNome:S.draft.nome, type:'criar', payload:clone(S.draft), motivo:'', by:S.myId, at:nowIso(), status:'pendente'});
      toast('Ficha enviada ao mestre para aprovação.'); S.tab='solicitacoes';
    }
    S.draft=newDraft(); render(true);
  } catch(e){ toast(errTxt(e) || ('Não foi possível salvar ('+(e.code||'erro')+').')); }
}
async function approve(owner, id){
  const item=S.reqDocs[owner]?.items?.[id]; if(!item || item.status!=='pendente') return;
  try {
    if (item.type==='clonar'){
      const c=S.chars.find(x=>x.id===item.charId); if(!c) throw new Error('A ficha original não existe mais.');
      await store.saveCharacter(cloneCharacter(c, owner, item.payload.nome, owner));
    } else if (item.type==='criar'){
      const c=buildCharacter(item.payload, owner); addLog(c,'Personagem criado'+(c.nivel>1?` no nível ${c.nivel}`:''),owner,''); await store.saveCharacter(c);
    } else {
      const c=S.chars.find(x=>x.id===item.charId); if(!c) throw new Error('Personagem não encontrado.');
      const payload=levelHpOverride(item, c);
      const n=applyChange(c,item.type,payload); addLog(n, describe(item.type,payload,c), owner, item.motivo); await store.saveCharacter(n);
      if (payload!==item.payload){ await store.resolveRequest(owner,id,{status:'aprovado', resolvedAt:nowIso(), resolvedBy:S.myId, payload:{hp:payload.hp, rolado:payload.rolado, rolApp:'', ajusteMestre:payload.ajusteMestre}}); return true; }
    }
    await store.resolveRequest(owner,id,{status:'aprovado', resolvedAt:nowIso(), resolvedBy:S.myId, ...stripImg(item)});
    return true;
  } catch(e){ toast(`${item.charNome||''}: ${e.message||'erro ao aprovar'}`); return false; }
}
/* subida de nível: o mestre pode trocar o valor do dado de vida antes de aprovar (campo na tela de aprovações) */
function levelHpOverride(item, c){
  if (item.type!=='nivel') return item.payload;
  const inp=document.querySelector(`.lvl-hp[data-for="${CSS.escape(item.id)}"]`); if(!inp) return item.payload;
  const dv=CLASSES[c.classe].dado, p=item.payload;
  const pedido = p.hp==='rolado' ? Math.floor(+p.rolado) : dv/2+1;
  const v=Math.floor(+inp.value);
  if (!Number.isFinite(v) || v<1 || v>dv) throw new Error(`PV do nível: use um valor entre 1 e ${dv}.`);
  if (v===pedido) return p;
  return {...p, hp:'rolado', rolado:String(v), rolApp:'', ajusteMestre:p.hp==='rolado'?`rolou ${pedido}`:`pediu a média (${pedido})`};
}
/* cópia completa da ficha (nível, atributos, itens, magias, imagem); vida cheia e histórico novo */
function cloneName(n){ const s=String(n||'').trim().replace(/\s+/g,' ').slice(0,60); if(!s) throw new Error('Dê um nome à cópia.'); return s; }
function cloneCharacter(c, ownerId, nome, by){
  const n=clone(c); n.id=newId(); n.ownerId=ownerId; n.nome=cloneName(nome); n.criadoEm=nowIso(); n.log=[];
  addLog(n, `Ficha clonada de ${c.nome}`, by, ''); return n;
}
async function submitClone(c, nome){
  try {
    nome=cloneName(nome);
    if (S.isMaster){
      const n=cloneCharacter(c, c.ownerId, nome, S.myId); await store.saveCharacter(n);
      S.charId=n.id; toast('Ficha clonada. Você está vendo a cópia.');
    } else {
      if (myRequests().some(r=>r.charId===c.id && r.type==='clonar' && r.status==='pendente')) throw new Error('Já existe um pedido de cópia desta ficha aguardando o mestre.');
      await store.addRequest({id:newId(), charId:c.id, charNome:c.nome, type:'clonar', payload:{nome}, motivo:'', by:S.myId, at:nowIso(), status:'pendente'});
      toast('Pedido de cópia enviado ao mestre.');
    }
    S.cloneArm=null; return true;
  } catch(e){ toast(errTxt(e) || ('Não foi possível clonar ('+(e.code||'erro')+').')); return false; }
}
async function reject(owner,id,motivo){
  const item=S.reqDocs[owner]?.items?.[id];
  try { await store.resolveRequest(owner,id,{status:'rejeitado', motivoRejeicao:String(motivo||'').slice(0,200), resolvedAt:nowIso(), resolvedBy:S.myId, ...stripImg(item)}); toast('Solicitação rejeitada.'); }
  catch(e){ toast('Não foi possível rejeitar ('+(e.code||'erro')+').'); }
}
/* depois de resolvida, a imagem sai da solicitação (ela já está na ficha ou foi recusada) para não encher o documento */
function stripImg(item){
  if (item?.type==='retrato' && item.payload?.img) return {payload:{img:''}};
  if (item?.type==='criar' && item.payload?.retrato) return {payload:{retrato:''}};
  return {};
}
async function submitPortrait(c, img){
  const p = img ? {acao:'trocar', img} : {acao:'remover', img:''};
  try {
    applyChange(c,'retrato',p); // valida antes de enviar
    if (S.isMaster){
      const n=applyChange(c,'retrato',p); addLog(n, describe('retrato',p,c), S.myId, '');
      await store.saveCharacter(n); toast(img?'Imagem atualizada.':'Imagem removida.');
    } else {
      if (myRequests().some(r=>r.charId===c.id && r.type==='retrato' && r.status==='pendente')) throw new Error('Já existe uma imagem aguardando o mestre. Espere a aprovação antes de enviar outra.');
      await store.addRequest({id:newId(), charId:c.id, charNome:c.nome, type:'retrato', payload:p, motivo:'', by:S.myId, at:nowIso(), status:'pendente'});
      toast('Enviado ao mestre para aprovação.');
    }
  } catch(e){ toast(errTxt(e) || ('Não foi possível salvar ('+(e.code||'erro')+').')); }
}
function pendingList(){
  const out=[]; Object.entries(S.reqDocs).forEach(([owner,doc])=>Object.values(doc.items||{}).forEach(i=>{ if(i.status==='pendente') out.push({owner,...i}); }));
  return out.sort((a,b)=>a.at<b.at?-1:1);
}
function myRequests(){ return Object.values(S.reqDocs[S.myId]?.items||{}).sort((a,b)=>a.at<b.at?1:-1); }

/* ============ NOMES ============ */
function nameOf(id){
  if (!id) return '—';
  if (S.mode==='local') return {'demo-mestre':'Mestre (demo)','demo-jogador':'Jogador (demo)'}[id]||'—';
  if (id===S.myId) return 'Você';
  return S.names[id] || '…';
}
async function loadNames(){
  if (S.mode!=='db' || !S.user?.profiles) return;
  const ids=new Set();
  S.chars.forEach(c=>{ ids.add(c.ownerId); (c.log||[]).forEach(l=>{ ids.add(l.by); ids.add(l.approvedBy); }); });
  Object.keys(S.reqDocs).forEach(i=>ids.add(i)); Object.keys(S.estado).forEach(i=>ids.add(i));
  const need=[...ids].filter(i=>i && i!==S.myId && !(i in S.names) && !S.namesPending.has(i));
  if (!need.length) return;
  need.forEach(i=>S.namesPending.add(i));
  try { const ps=await S.user.profiles(need); need.forEach(i=>S.names[i]=(ps&&ps[i]&&ps[i].name)||'Jogador'); }
  catch { need.forEach(i=>S.names[i]='Jogador'); }
  render();
}
/* Dono da ficha: pessoas conhecidas (quem já abriu o app, fez pedido ou tem ficha) + busca por nome */
function knownPeople(){
  const ids=new Set([S.myId]);
  if (S.mode==='local') ids.add('demo-jogador');
  S.chars.forEach(c=>ids.add(c.ownerId)); Object.keys(S.reqDocs).forEach(i=>ids.add(i)); Object.keys(S.estado).forEach(i=>ids.add(i)); S.people.forEach(i=>ids.add(i));
  ids.delete(undefined); ids.delete(null); ids.delete('');
  const lbl = i => i===S.myId ? 'Você (mestre)' : S.mode==='local' ? nameOf(i) : (S.names[i] && S.names[i]!=='Jogador' && S.names[i]!=='…') ? nameOf(i) : 'Jogador sem nome ('+String(i).slice(-4)+')';
  return [...ids].map(i=>({id:i, nome:lbl(i)})).sort((a,b)=> a.id===S.myId ? -1 : b.id===S.myId ? 1 : a.nome.localeCompare(b.nome));
}
function ownerOptions(sel, exclMestres){ return knownPeople().filter(p=>!exclMestres || (p.id!==S.myId && !S.mestres.includes(p.id))).map(p=>`<option value="${h(p.id)}" ${p.id===sel?'selected':''}>${h(p.nome)}</option>`).join(''); }
function ownerPicker(selAttrs, sel){

/* ============ RENDERIZAÇÃO ============ */
function render(force){
  const a=document.activeElement;
  if (!force && a && a.closest && a.closest('#app') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ S.deferred=true; renderChrome(); return; }
  S.deferred=false;
  renderChrome();
  const app=$('#app');
  let html = S.notice ? `<div class="notice">${S.notice}</div>` : '';
  if (S.mode==='carregando') html += `<div class="empty">Carregando…</div>`;
  else if (S.tab==='personagens') html += viewList();
  else if (S.tab==='criar') html += viewCreate();
  else if (S.tab==='ficha') html += viewSheet();
  else if (S.tab==='aprovacoes') html += viewApprovals();
  else if (S.tab==='solicitacoes') html += viewMine();
  else if (S.tab==='mestres' && S.isOwner) html += viewMestres();
  app.innerHTML = html;
  if (S.pop && S.tab!=='ficha') S.pop=null;
  renderPop();
}
function renderChrome(){
  const b=[];
  if (S.mode==='local'){
    b.push(`<span class="badge">Demonstração: dados só nesta aba</span>`);
    b.push(`<span class="muted small">Ver como:</span><button class="btn sm ${S.isOwner?'pri':''}" data-act="role" data-role="mestre">Mestre</button><button class="btn sm ${!S.isOwner?'pri':''}" data-act="role" data-role="jogador">Jogador</button>`);
  } else if (S.mode==='db'){
    b.push(`<span class="badge gold">${S.isMaster?'Mestre':'Jogador'}</span>`);
    b.push(`<span class="badge">${S.loaded?'Sincronizado':'Conectando…'}</span>`);
  }
  $('#badges').innerHTML=b.join('');
  const pend=pendingList().length;
  const tabs=[['personagens',S.isMaster?'Todos os personagens':'Personagens'],['criar','Criar personagem']];
  if (S.isMaster) tabs.push(['aprovacoes',`Aprovações${pend?`<span class="count">${pend}</span>`:''}`]);
  else tabs.push(['solicitacoes','Minhas solicitações']);
  if (S.isOwner) tabs.push(['mestres','Mestres']);
  $('#nav').innerHTML = tabs.map(([k,l])=>`<button class="${S.tab===k||(S.tab==='ficha'&&k==='personagens')?'on':''}" data-act="tab" data-tab="${k}">${l}</button>`).join('');
}
/* Jogadores veem as próprias fichas e as dos outros jogadores, mas não as dos mestres (dono do app e lista de mestres). */
const isMasterId = id => !!id && (id===S.donoId || S.mestres.includes(id));
const canSee = c => S.isMaster || c.ownerId===S.myId || !isMasterId(c.ownerId);
const isMine = c => S.isMaster || c.ownerId===S.myId;
function visibleChars(){ return S.chars.filter(canSee).sort((a,b)=> (S.isMaster?0:(b.ownerId===S.myId)-(a.ownerId===S.myId)) || a.nome.localeCompare(b.nome)); }
function hpColor(r){ return r>.5?'var(--green)':r>.25?'var(--gold)':'var(--red)'; }
function pendingFor(charId){ return pendingList().filter(r=>r.charId===charId).length + (S.isMaster?0:myRequests().filter(r=>r.charId===charId&&r.status==='pendente').length); }

function viewList(){
  const all=visibleChars();
  if (!all.length) return `<div class="empty"><h2 style="margin-bottom:8px">Nenhum personagem ainda</h2><p>${S.isMaster?'Crie um personagem ou aguarde os jogadores enviarem fichas para aprovação.':'Crie seu personagem. Ele aparece aqui quando o mestre aprovar.'}</p><button class="btn pri" data-act="tab" data-tab="criar">Criar personagem</button></div>`;
  const camps=campaigns(all);
  const fs=S.filtro.status, fc=S.filtro.campanha;
  const list=all.filter(c=>{ const s=statusOf(c); return (!fs||s.tipo===fs) && (!fc || (fc==='__sem'?!s.campanha:s.campanha===fc)); });
  const filtros=`<div class="row" style="margin-bottom:14px;gap:8px">
    <select data-filter="status" style="width:auto" aria-label="Filtrar por status">${opt('','Todos os status',fs)}${Object.entries(STATUS).map(([k,v])=>opt(k,v.nome,fs)).join('')}</select>
    ${camps.length?`<select data-filter="campanha" style="width:auto" aria-label="Filtrar por campanha">${opt('','Todas as campanhas',fc)}${camps.map(n=>opt(n,n,fc)).join('')}${opt('__sem','Sem campanha',fc)}</select>`:''}
    <span class="small muted">${list.length} de ${all.length}</span></div>`;
  if (!list.length) return filtros+`<div class="empty">Nenhum personagem com esse filtro.</div>`;
  return filtros+`<div class="grid-cards">${list.map(c=>{
    const d=derive(c); const e=est(c); const pv=pvAtual(c,d); const r=Math.max(0,Math.min(1,pv/d.max)); const pend=pendingFor(c.id);
    return `<div class="card st-card-${statusOf(c).tipo}" data-act="open" data-id="${h(c.id)}">${portrait(c.retrato, c.nome)}<div class="card-body">
      <div class="row between"><h2>${h(c.nome)}</h2>${pend?`<span class="chip pendente">${pend} pendente${pend>1?'s':''}</span>`:''}</div>
      <div class="muted">${h(d.sp.nome)} · ${h(d.cls.nome)}${c.subclasse?` (${h(c.subclasse)})`:''} · nível ${c.nivel}</div>
      <div style="margin-top:6px">${statusChip(c)}</div>
      <div class="hpbar"><i style="width:${r*100}%;background:${hpColor(r)}"></i></div>
      <div class="row between small"><span>PV ${pv}/${d.max}${e.temp?` (+${e.temp})`:''}</span><span>CA ${d.ac}</span><span>Iniciativa ${sg(d.init)}</span></div>
      ${S.isMaster||c.ownerId!==S.myId?`<div class="small muted" style="margin-top:6px">Jogador: ${h(nameOf(c.ownerId))}</div>`:'<div class="small" style="margin-top:6px;color:var(--gold2)">Sua ficha</div>'}
    </div></div>`;}).join('')}</div>`;
}

function opt(v,l,sel){ return `<option value="${h(v)}" ${String(sel)===String(v)?'selected':''}>${h(l)}</option>`; }
function weaponOptions(classe,sel){
  const grp=(cat,dist,label)=>`<optgroup label="${label}">${Object.entries(WEAPONS).filter(([k,w])=>w.cat===cat&&w.dist===dist).map(([k,w])=>opt(k,`${w.nome} (${w.dado} ${w.dano})${weaponProf(classe,w)?'':' · sem proficiência'}`,sel)).join('')}</optgroup>`;
  return grp('s',0,'Simples corpo a corpo')+grp('s',1,'Simples à distância')+grp('m',0,'Marciais corpo a corpo')+grp('m',1,'Marciais à distância');
}
function levelPanel(d, r){

  return `<div class="panel"><h3>Nível inicial</h3>

    ${lv===1?'<div class="small muted">Para começar acima do nível 1, escolha o nível: a ficha aplica cada subida de nível com as mesmas regras do pedido "Subir de nível".</div>':''}

    ${lv>=3?`<div class="f"><label>Subclasse (nível 3)</label><input data-f="subclasse" data-live maxlength="60" value="${h(d.subclasse||'')}" placeholder="Ex.: Campeão"></div>`:''}
    ${asis.map(l=>{ const m=(d.melhorias||{})[l]||{}; const modo=m.modo||'2';

      ${modo==='talento'?`<select data-f="melhorias.${l}.talento" aria-label="Talento no nível ${l}">${featOptions(cBase,l,m.talento||'')}</select>${m.talento==='__outro'?`<input data-f="melhorias.${l}.talentoOutro" data-live maxlength="80" value="${h(m.talentoOutro||'')}" placeholder="Nome do talento" aria-label="Nome do talento no nível ${l}">`:FEATS[ruleKey(m.talento)]?.abs.length?`<select data-f="melhorias.${l}.fatr" aria-label="Atributo +1 do talento no nível ${l}">${featAbsOptions(FEATS[ruleKey(m.talento)],cBase,m.fatr||'')}</select>`:''}`
        :`<select data-f="melhorias.${l}.a1" aria-label="Atributo no nível ${l}">${abOpts(m.a1)}</select>${modo==='11'?`<select data-f="melhorias.${l}.a2" aria-label="Segundo atributo no nível ${l}">${abOpts(m.a2)}</select>`:''}`}</div></div>`; }).join('')}
    ${lv>1?'<div class="small muted">As magias entram depois, pelo pedido "Aprender magia", já com os espaços do nível escolhido.</div>':''}
  </div>`;
}

function rollExpr(expr, crit){
  const m=/^(\d+)d(\d+)$/.exec(expr||''); if(!m) return {total:+expr||0, dados:[]};
  const n=+m[1]*(crit?2:1), f=+m[2]; const buf=new Uint32Array(n); crypto.getRandomValues(buf);
  const dados=[...buf].map(x=>1+(x%f)); return {total:dados.reduce((a,b)=>a+b,0), dados};
}
function doAttack(c, id, vers){
  const d=derive(c); const buf=new Uint32Array(1); crypto.getRandomValues(buf); const nat=1+(buf[0]%20);
  let texto;
  if (id==='_magia'){
    texto=`Ataque com magia: d20 (${nat}) ${sg(d.magia.atk)} = ${nat+d.magia.atk}${nat===20?' · CRÍTICO':nat===1?' · falha automática':''}`;
  } else {
    const a=d.ataques.find(x=>x.id===id); if(!a) return;
    const crit=nat===20; const dado=vers&&a.vers?a.vers:a.dado; const r=rollExpr(dado,crit); const dano=Math.max(1,r.total+a.mod);
    texto=`${a.nome}${vers?' (2 mãos)':''}: d20 (${nat}) ${sg(a.atk)} = ${nat+a.atk}${crit?' · CRÍTICO':nat===1?' · falha automática':''} → dano ${r.dados.length?`${dado}${crit?' ×2':''} [${r.dados.join(', ')}]`:dado}${a.mod?sg(a.mod):''} = ${dano} ${a.dano}`;
  }
  S.rolls.unshift({charId:c.id, texto, at:Date.now()}); S.rolls=S.rolls.slice(0,30); render(true);
}

async function changeEstado(c, fn){
  if (!isMine(c)) return;
  const d=derive(c); const e=est(c); fn(e,d);
  e.dano=Math.max(0,Math.min(d.max,Math.floor(e.dano))); e.temp=Math.max(0,Math.floor(e.temp));
  if (d.max-e.dano>0) e.morte={s:0,f:0};
  try { await store.setEstado(c.ownerId,c.id,e); } catch(err){ toast('Não foi possível salvar ('+(err.code||'erro')+').'); }
}

        </div>
        ${hpPanel(c,d)}
        ${attackPanel(c,d)}
        <div class="cols2">
          <div class="stack">
            ${spellPanel(c,d)}
            <div class="panel"><h3>Traços e talentos</h3><div class="small">${d.sp.tracos.map(t=>`<div>• ${ruleLink(t,'traco')}</div>`).join('')}${(c.talentos||[]).map(t=>`<div>• ${ruleLink(t,'talento')}</div>`).join('')}</div></div>
          </div>
          <div class="stack">
            <div class="panel"><h3>Equipamento</h3><div class="small">${ARMORS[c.armadura]?ruleLink(ARMORS[c.armadura].nome,'armadura',` data-arm="${h(c.armadura)}"`):''}${c.escudo?` · ${ruleLink('Escudo','armadura')}`:''}${+c.caBonus?` · bônus ${sg(+c.caBonus)} CA`:''}</div></div>
            <div class="panel"><h3>Moedas</h3><div class="row" style="gap:14px">${COINS.map(([k,ab])=>`<span><b>${c.moedas[k]||0}</b> <span class="muted small">${ab}</span></span>`).join('')}</div></div>
            <div class="panel"><h3>Inventário</h3>${c.inventario.length?`<div class="list">${c.inventario.map(i=>`<div class="li small"><span>${ruleLink(i.nome,'item')}${i.obs?` <span class="muted">· ${h(i.obs)}</span>`:''}</span><b>×${i.qtd}</b></div>`).join('')}</div>`:'<div class="muted small">Vazio.</div>'}</div>
          </div>
        </div>
      </div>
      <div class="stack c3">${ro?`<div class="panel small muted">Esta ficha é de ${h(nameOf(c.ownerId))}. Você pode consultá-la, mas só o dono pede mudanças.</div>`:`
        <div class="panel"><h3>${S.isMaster?'Alterar ficha':'Propor mudança'}</h3>
          <div class="f"><select data-act-type>${Object.entries(ACTIONS).map(([k,l])=>opt(k,l,S.actionType)).join('')}</select></div>

        </div>
        ${mine.length?`<div class="panel"><h3>Aguardando aprovação</h3>${mine.map(m=>`<div class="small" style="margin-bottom:6px">• ${h(describe(m.type,m.payload,c))}</div>`).join('')}${S.isMaster?`<button class="btn sm" data-act="tab" data-tab="aprovacoes">Ver aprovações</button>`:''}</div>`:''}
        <div class="panel"><h3>Anotações</h3>${S.isMaster?`<form data-form="notas"><textarea name="notas" maxlength="4000" style="min-height:110px">${h(c.notas)}</textarea><button class="btn sm" style="margin-top:8px">Salvar anotações</button></form>`:`<div class="small" style="white-space:pre-wrap">${h(c.notas)||'<span class="muted">Sem anotações.</span>'}</div>`}</div>
`}
        <div class="panel"><h3>Histórico de mudanças</h3><div class="log">${(c.log||[]).map(l=>`<div class="e"><div>${h(l.text)}${l.dono?` para ${h(nameOf(l.dono))}`:''}${l.motivo?` <span class="muted">· ${h(l.motivo)}</span>`:''}</div><div class="muted">${fmtDate(l.at)} · por ${h(nameOf(l.by))}${l.approvedBy&&l.approvedBy!==l.by?`, aprovado por ${h(nameOf(l.approvedBy))}`:''}</div></div>`).join('')||'<div class="muted small">Sem registros.</div>'}</div></div>
      </div>
    </div>`;
}

function viewApprovals(){
  const list=pendingList();
  if (!list.length) return `<div class="empty">Nenhuma solicitação pendente.</div>`;
  return `<div class="row between" style="margin-bottom:12px"><span class="muted">${list.length} solicitação(ões) pendente(s)</span><button class="btn ok" data-act="approve-all">Aprovar todas</button></div>
  ${list.map(i=>{ const c=S.chars.find(x=>x.id===i.charId);
    let extra='';
    if (i.type==='retrato'){ extra = i.payload.acao!=='remover' && imgOk(i.payload.img) ? `<div class="row" style="margin-top:8px;align-items:flex-start">${c?`<div class="small muted" style="text-align:center">Atual<br>${portrait(c.retrato,c.nome,'md')}</div>`:''}<div class="small muted" style="text-align:center">Nova<br>${portrait(i.payload.img,'','md')}</div></div>` : ''; }
    if (i.type==='criar'){ const r=draftCompute(i.payload); extra=`${imgOk(i.payload.retrato)?`<div style="margin-top:8px">${portrait(i.payload.retrato,i.payload.nome,'md')}</div>`:''}<div class="small muted" style="margin-top:6px">${AB.map(a=>`${a} ${r.final[a]}`).join(' · ')} · Perícias: ${[...r.skills].map(k=>SKILL_NOME[k]).join(', ')}</div>${r.errors.length?`<div class="err">Problemas: ${r.errors.map(h).join(' ')}</div>`:''}`; }
    if (i.type==='clonar'){ extra = c ? `<div class="small muted" style="margin-top:6px">Cópia completa: nível ${c.nivel}, itens, magias e imagem. A cópia fica com ${h(nameOf(i.owner))}, com vida cheia e histórico novo.</div>` : `<div class="err">A ficha original não existe mais.</div>`; }
    else if (i.type!=='criar'){ try{ const n=applyChange(c,i.type,i.payload);
        if (i.type==='nivel'){ const d0=derive(c), d1=derive(n), dv=d0.cls.dado, media=dv/2+1, pedido=i.payload.hp==='rolado'?Math.floor(+i.payload.rolado):media, extraNv=d1.max-d0.max-pedido;
          extra+=`<div class="lvl-box"><div><b>PV máximo: ${d0.max} → ${d1.max}</b> <span class="muted">(+${d1.max-d0.max})</span></div>
          <div class="small muted">${i.payload.hp==='rolado'?`Rolou ${pedido} no d${dv} (a média seria ${media})`:`Escolheu a média do d${dv} (${media})`}${extraNv?`, ${sg(extraNv)} de Constituição${d0.sp.pvExtra?' e espécie':''}`:''}.</div>
          ${i.payload.hp!=='rolado'?'':(()=>{ const lr=lvlRollFor(c);
            if (i.payload.rolApp && lr && lr.v===pedido) return `<div class="ok-t">✓ Rolado no app em ${fmtDate(lr.at)}.</div>`;
            if (i.payload.rolApp) return `<div class="err">Diz que foi rolado no app, mas o valor não confere com a rolagem registrada${lr?` (${lr.v})`:''}.</div>`;
            return `<div class="small muted">Valor digitado pelo jogador (rolado fora do app).</div>`; })()}
          <div class="row" style="margin-top:8px;gap:8px;align-items:center"><label class="small" style="margin:0">Valor do dado aprovado</label>
          <input class="lvl-hp" data-for="${h(i.id)}" type="number" min="1" max="${dv}" value="${pedido}" style="width:80px">
          <button type="button" class="btn sm" data-act="lvl-media" data-for="${h(i.id)}" data-v="${media}">Usar média (${media})</button>
          <span class="small muted">Mude antes de aprovar se a mesa permitir rolar de novo ou usar a média.</span></div></div>`; }
        if(/^magia|nivel/.test(i.type)){ const w=spellWarnings(n); if(w.length) extra+=`<div class="err">Atenção, as regras indicam: ${w.map(h).join(' ')} Aprove só se houver um motivo (característica, item, decisão da mesa).</div>`; } }
      catch(e){ extra=`<div class="err">Não pode ser aplicada agora: ${h(e.message)}</div>`; } }
    return `<div class="req"><div class="row between"><div><b>${h(c?.nome||i.charNome||'Novo personagem')}</b> <span class="muted small">· ${h(nameOf(i.owner))} · ${fmtDate(i.at)}</span></div><span class="chip pendente">${h(ACTIONS[i.type]||{retrato:'Imagem',clonar:'Clonar ficha'}[i.type]||'Criação de ficha')}</span></div>
      <div style="margin-top:6px">${h(describe(i.type,i.payload,c))}${i.motivo?` <span class="muted">· ${h(i.motivo)}</span>`:''}</div>${extra}
      <div class="row" style="margin-top:10px"><button class="btn sm ok" data-act="approve" data-owner="${h(i.owner)}" data-id="${h(i.id)}">Aprovar</button>
      <input class="rej-motivo" data-for="${h(i.id)}" placeholder="Motivo da rejeição (opcional)" style="flex:1;min-width:160px">
      <button class="btn sm danger" data-act="reject" data-owner="${h(i.owner)}" data-id="${h(i.id)}">Rejeitar</button></div></div>`; }).join('')}`;
}
function viewMine(){
  const list=myRequests();
  if (!list.length) return `<div class="empty">Você ainda não enviou solicitações.</div>`;
  return list.map(i=>{ const c=S.chars.find(x=>x.id===i.charId);
    return `<div class="req"><div class="row between"><b>${h(c?.nome||i.charNome||'Novo personagem')}</b><span class="chip ${i.status}">${i.status}</span></div>
    <div style="margin-top:6px">${h(describe(i.type,i.payload,c))}</div>${i.type==='retrato'&&imgOk(i.payload.img)?`<div style="margin:6px 0">${portrait(i.payload.img,'')}</div>`:''}<div class="small muted">${fmtDate(i.at)}${i.motivoRejeicao?` · motivo: ${h(i.motivoRejeicao)}`:''}</div></div>`; }).join('');
}

/* ============ EXPORTAR FICHA ============ */
/* Gera um HTML independente com as seções da ficha do jogador do Livro do Jogador 2024 (duas páginas A4, pronto para imprimir/salvar em PDF).
   Os dados da ficha vão embutidos no arquivo (bloco JSON) para servir de backup. */
const TREINO_ARMADURA = {barbaro:'Leves, médias e escudos', bardo:'Leves', bruxo:'Leves', clerigo:'Leves, médias e escudos', druida:'Leves, médias e escudos',
  feiticeiro:'Nenhuma', guerreiro:'Leves, médias, pesadas e escudos', ladino:'Leves', mago:'Nenhuma', monge:'Nenhuma', paladino:'Leves, médias, pesadas e escudos', patrulheiro:'Leves, médias e escudos'};
const TREINO_ARMAS = {sm:'Simples e marciais', s:'Simples', ladino:'Simples e marciais com Acuidade ou Leve', monge:'Simples e marciais com a propriedade Leve'};
function sheetHtml(c){
  const d=derive(c), e=est(c), s=statusOf(c), pv=pvAtual(c,d);
  const box=(label,val,cls='')=>`<div class="bx ${cls}"><div class="v">${val}</div><div class="l">${label}</div></div>`;
  const line=(label,val)=>`<div class="ln"><span class="lv">${val||'&nbsp;'}</span><span class="ll">${label}</span></div>`;
  const dot=on=>`<i class="d ${on?'on':''}"></i>`;
  const abil=a=>{ const sv=d.saves.find(x=>x.a===a); const sk=d.skills.filter(x=>x.a===a);
    return `<div class="ab"><div class="abh"><div class="abn">${AB_NOME[a]}</div><div class="abm">${sg(d.m[a])}</div><div class="abs">${c.atributos[a]}</div></div>
      <div class="sk sv">${dot(sv.prof)}<b>${sg(sv.v)}</b> Teste de resistência</div>
      ${sk.map(x=>`<div class="sk">${dot(x.prof)}<b>${sg(x.v)}</b> ${x.n}</div>`).join('')}</div>`; };
  const rows=(n,arr,fn,cols)=>{ const out=arr.map(fn); while(out.length<n) out.push(`<tr>${'<td>&nbsp;</td>'.repeat(cols)}</tr>`); return out.join(''); };
  const armas=rows(6,d.ataques,a=>`<tr><td>${h(a.nome)}${a.bonus?` +${a.bonus}`:''}</td><td>${sg(a.atk)}</td><td>${/d/.test(a.dado)?h(a.dado)+(a.mod?sg(a.mod):''):Math.max(1,+a.dado+a.mod)} ${h(a.dano)}</td><td>${[...a.props, a.alc?`${a.alc} pés`:'', a.obs||'', a.prof?'':'sem proficiência'].filter(Boolean).map(h).join(', ')}</td></tr>`,4);
  const ms=(c.magias||[]);
  const magias=rows(22,ms,m=>`<tr><td>${+m.circ===0?'T':m.circ}</td><td>${h(m.nome)}</td><td class="c">${+m.circ===0||m.prep?'●':'○'}</td><td>${[m.extra?'fora do limite':'',m.obs||''].filter(Boolean).map(h).join(' · ')}</td></tr>`,4);
  let slots='';
  if (d.magia?.pacto) slots=`<div class="slot"><b>Pacto (${d.magia.pacto.circ}º)</b> ${Array.from({length:d.magia.pacto.qtd},(_,i)=>dot(i<e.pacto)).join('')}</div>`;
  else slots=[1,2,3,4,5,6,7,8,9].map(n=>{ const tot=d.magia?.slots?.[n-1]||0; return `<div class="slot"><b>${n}º</b> ${tot?Array.from({length:tot},(_,i)=>dot(i<(e.espacos[n-1]||0))).join(''):'<span class="mut">—</span>'}</div>`; }).join('');
  const inv=(c.inventario||[]).map(i=>`${h(i.nome)}${i.qtd>1?` ×${i.qtd}`:''}${i.obs?` (${h(i.obs)})`:''}`);
  const equip=[h(ARMORS[c.armadura]?.nome||''), c.escudo?'Escudo':'', ...inv].filter(Boolean);
  const dados=JSON.stringify({formato:'fichas-dnd55', versao:1, exportadoEm:nowIso(), ficha:c}).replace(/</g,'\\u003c');
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${h(c.nome)} · Ficha de Personagem</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>

<div class="noprint"><button onclick="window.print()">Imprimir ou salvar em PDF</button></div>
<section class="pg">

async function exportSheet(c){

}

const para = t => String(t).split('\n').map(l=>`<p>${h(l)}</p>`).join('');
function popData(p){
  const c=S.chars.find(x=>x.id===S.charId);
  let titulo=p.n, tipo='', corpo='', srd=false, comp=p.n;
  const add = r => { if(!r) return; tipo = tipo || r[0]; corpo += para(r[1]); srd=true; };
  if (p.ctx==='arma' && c){
    const d=derive(c); const a=d.ataques.find(x=>x.id===p.w);

      tipo = a.id==='_desarmado' ? 'Ataque' : `Arma ${a.base==='custom'?'personalizada':a.cat==='m'?'marcial':'simples'}${a.dist?' à distância':' corpo a corpo'}`;
      corpo += `<div class="pop-stats"><span>Ataque <b>${sg(a.atk)}</b></span><span>Dano <b>${/d/.test(a.dado)?h(a.dado)+(a.mod?sg(a.mod):''):Math.max(1,+a.dado+a.mod)}</b> ${h(a.dano)}</span>${a.vers?`<span>Duas mãos <b>${h(a.vers)}${a.mod?sg(a.mod):''}</b></span>`:''}${a.alc?`<span>Alcance <b>${h(a.alc)}</b> pés</span>`:''}</div>

      if (a.id==='_desarmado') add(RULES['ataque desarmado']);
      a.props.forEach(pr=>{ const r=ruleBuiltin(pr,'prop'); if(r){ corpo+=`<h4>${h(pr[0].toUpperCase()+pr.slice(1))}</h4>${para(r[1])}`; srd=true; } });
    }
  } else if (p.ctx==='armadura'){
    const k=p.arm, A=ARMORS[k], I=ARMOR_INFO[k];
    if (A){ titulo=A.nome.replace(/ \(.*\)$/,''); comp=titulo;
      if (k==='nenhuma'){ tipo='Armadura'; corpo+=para('Sem armadura, sua CA é 10 + seu modificador de Destreza. Bárbaros (somando Constituição) e monges (somando Sabedoria) têm Defesa sem Armadura, e a ficha já faz essa conta.'); }
      else { tipo=`Armadura ${I.cat}`;

        corpo += para(ARMOR_CAT_TXT[I.cat] + (I.for?` Se sua Força for menor que ${I.for}, seu deslocamento cai 3 m.`:'') + (I.furt?' Você tem desvantagem em testes de Destreza (Furtividade) usando esta armadura.':'') + ' Sem treinamento nessa categoria, você tem desvantagem em qualquer teste de Força ou Destreza e não pode conjurar magias.');
      }
      srd=true; }
    else add(ruleBuiltin(p.n, p.ctx));
  } else if (p.ctx==='pericia'){
    const sk=SKILLS.find(s=>s[0]===p.sk);
    if (sk){ titulo=sk[1]; comp=sk[1]; tipo=`Perícia · ${AB_NOME[sk[2]]}`;
      const v = c ? derive(c).skills.find(s=>s.k===sk[0]) : null;
      if (v) corpo += `<div class="pop-stats"><span>Bônus <b>${sg(v.v)}</b></span><span>${v.prof?'Com proficiência':'Sem proficiência'}</span></div>`;
      corpo += para(SKILL_TXT[sk[0]]) + para(`Teste: d20 ${v?sg(v.v):'+ mod. de '+AB_NOME[sk[2]]} contra a CD que o mestre definir.`); srd=true; }
  } else if (p.ctx==='magia' && SPELLS[ruleKey(p.n)]){
    const m=SPELLS[ruleKey(p.n)];

    if (ruleKey(m.nome)!==ruleKey(p.n)) titulo = p.n+' ('+m.nome+')';
    corpo += `<div class="pop-grid"><span>Conjuração</span><b>${h(m.tempo)}</b><span>Alcance</span><b>${h(m.alc)}</b><span>Componentes</span><b>${h(m.comp)}</b><span>Duração</span><b>${h(m.dur)}</b></div>` + para(m.txt);
    srd=true;

  if (!tipo) tipo = {magia:'Magia', item:'Item', talento:'Talento', traco:'Traço'}[p.ctx] || 'Regra';
  return {titulo, tipo, corpo, srd, comp, slug:ruleSlug(comp)};
}

/* ============ INICIALIZAÇÃO ============ */
function subscribe(){
  const timer=setTimeout(()=>{ if(!S.loaded){ S.notice='Não foi possível alcançar os dados ainda. Verifique sua conexão; a página continua tentando.'; render(); } },10000);
  store.onCharacters((list,meta)=>{
    S.chars=list;
    if (!meta || !meta.fromCache){ S.loaded=true; clearTimeout(timer); if(S.notice.startsWith('Não foi possível alcançar')) S.notice=''; }
    loadNames(); render();
  }, err=>{ clearTimeout(timer); S.loaded=true; S.notice='Não foi possível carregar as fichas ('+h(err.code)+').'; render(); });
  store.onMestres(v=>{ S.mestres=v.ids||[]; S.donoId=v.dono||null;
    if (S.mode==='db' && S.isOwner && S.donoId!==S.myId && !S.donoSaving){ S.donoSaving=true; store.saveMestres(S.mestres).catch(()=>{}).finally(()=>{ S.donoSaving=false; }); }
    applyRole(); }, ()=>{});
  resubRoles();
  store.onRegras(m=>{ S.regras=m||{}; renderPop(); }, ()=>{});
}
/* Mestre = dono do app ou alguém que o dono pôs na lista de mestres (config/mestres). */
let roleUnsubs=[];
function applyRole(){
  const m = S.isOwner || S.mestres.includes(S.myId);
  if (m!==S.isMaster){ S.isMaster=m; if(!m && (S.tab==='aprovacoes'||S.tab==='mestres')) S.tab='personagens'; if(m && S.tab==='solicitacoes') S.tab='personagens'; if (S.mode==='db') resubRoles(); }
  render();
}
function resubRoles(){
  roleUnsubs.forEach(u=>{ try{ typeof u==='function' && u(); }catch{} }); roleUnsubs=[];
  roleUnsubs.push(store.onEstado(m=>{ S.estado=m||{};
    if (S.mode==='db' && !S.isMaster && !S.registered && !S.estado[S.myId]){ S.registered=true; store.ensureEstado().catch(()=>{ S.registered=false; }); }
    loadNames(); render(); }, err=>{ S.notice='Não foi possível carregar os pontos de vida ('+h(err.code)+').'; render(); }));
  roleUnsubs.push(store.onRequests(m=>{ S.reqDocs=m||{}; loadNames(); render(); }, err=>{ S.notice='Não foi possível carregar as solicitações ('+h(err.code)+').'; render(); }));
}
async function init(){
  S.draft=newDraft(); render();
  let db=null, user=null;
  if (window.claude && typeof window.claude.use==='function'){
    try {
      const timeout=new Promise(r=>setTimeout(()=>r([null,null]),10000));
      [db,user] = await Promise.race([Promise.all([window.claude.use('db'), window.claude.use('user')]), timeout]);
    } catch { db=null; user=null; }
  }
  let id=null;
  if (db && user){ try { id=await user.id(); } catch {} }
  if (db && user && id){
    S.mode='db'; S.user=user; S.myId=id;
    /* Mestre = dono do app. Jogadores convidados de fora da organização só gravam dados como Editores, então Editor não basta para ser mestre. */
    try { S.isOwner = !!(await user.isOwner()); } catch { S.isOwner=false; }
    S.isMaster = S.isOwner;
    store=makeDbStore(db);
  } else {
    S.mode='local'; S.myId='demo-mestre'; S.isMaster=true; S.isOwner=true; S.loaded=true;
    S.notice='<b>Modo demonstração.</b> O banco compartilhado não está disponível nesta visualização, então os dados ficam só nesta aba. Use "Ver como" para testar o fluxo de jogador e mestre.';
    store=makeLocalStore();
  }
  subscribe(); render();
}
init();
</script>
