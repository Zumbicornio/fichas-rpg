<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de Masmorras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho + abas; na mesa, mapa em pergaminho à esquerda e painel da sala à direita (empilha no celular).
   Visual escuro único, de propósito, igual ao app das fichas. */
:root{
  color-scheme:dark;
  --bg:#12100e; --panel:#1c1814; --panel2:#251f19; --line:#382e25; --line2:#4b3e32;
  --text:#eee5d3; --muted:#a8998a; --gold:#d1a84e; --gold2:#f0cd7a; --red:#cf5b43; --green:#74a96d; --blue:#6f9cc9; --orange:#d9853b; --violet:#a48bc9;
  --floor:#d8c9a3; --floorgrid:rgba(70,52,34,.20); --wall:#2b2119; --rock:#191512; --hatch:#3a3027; --ink:#3a2a1c; --sel:#b8402a;
  --display:Cinzel,Georgia,"Times New Roman",serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;margin:0;text-wrap:balance}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--line);background:linear-gradient(#1b1611,var(--bg))}
header h1{font-size:20px;color:var(--gold2)}
header .sub{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:99px;border:1px solid var(--line2);font-size:12px;color:var(--muted);white-space:nowrap}
.badge.gold{color:var(--gold2);border-color:var(--gold)}
nav{display:flex;gap:4px;padding-top:6px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--gold2);border-color:var(--gold)}
nav .count{background:var(--line2);color:var(--text);border-radius:99px;padding:0 7px;margin-left:6px;font-size:11px}
main{padding-block:18px 40px;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.notice{background:#2a2117;border:1px solid var(--line2);border-radius:var(--r);padding:10px 14px;color:var(--muted)}
.notice b{color:var(--text)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)} .small{font-size:12px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a140c;font-weight:600}
.btn.pri:hover{background:var(--gold2)}
.btn.danger{color:var(--red);border-color:#6a3328}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,nav button:focus-visible,.roomlink:focus-visible,.card:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{width:100%;min-height:80px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
.form .wide{grid-column:span 2}
@media (max-width:520px){.form .wide{grid-column:auto}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .nm{font-family:var(--display);font-size:18px;font-weight:700;color:var(--gold2);background:transparent;border:1px solid transparent;padding:4px 6px;width:min(520px,100%)}
.toolbar .nm:hover{border-color:var(--line2)}
.mesa{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:920px){.mesa{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mapwrap{overflow:auto;border-radius:6px;max-height:80vh}
#mapa{display:block;width:100%;cursor:pointer;touch-action:manipulation}
.mapwrap.zoom #mapa{width:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px;align-items:center;justify-content:space-between}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.side .panel h3{font-size:14px;color:var(--gold);margin-bottom:8px}
.side h2{font-size:19px;color:var(--gold2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.t-entrada{color:var(--gold2)} .t-combate{color:var(--red)} .t-chefe{color:#ff8a6b;background:rgba(207,91,67,.15)} .t-armadilha{color:var(--orange)}
.t-tesouro{color:var(--gold)} .t-misterio{color:var(--blue)} .t-descanso{color:var(--green)} .t-vazia{color:var(--muted)}
.rooms{display:flex;flex-direction:column;gap:2px}
.roomlink{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer}
.roomlink:hover{background:var(--panel2)}
.roomlink .n{font-family:var(--display);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.mon{display:flex;flex-direction:column;gap:6px}
.mon .m{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:6px}
.mon .m:last-child{border-bottom:0}
.mon .q{font-weight:600}
.en{color:var(--muted);font-size:12px}
.num{font-variant-numeric:tabular-nums}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
table.d6{width:100%;border-collapse:collapse;font-size:13px}
table.d6 td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
table.d6 td:first-child{width:2em;color:var(--gold);font-family:var(--display);font-weight:700;text-align:center}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer}
.card:hover{border-color:var(--gold)}
.card h2{font-size:16px;color:var(--gold2)}
.empty{padding:32px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{color:var(--text);font-size:17px}
.dirty{color:var(--orange);font-size:12px}
.ok{color:var(--green);font-size:12px}
.prose{max-width:65ch}
.rl{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline dotted var(--gold);text-underline-offset:3px;text-align:left}
.rl:hover{color:var(--gold2)}
.rl:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.pop-bg{position:fixed;inset:0;background:rgba(8,6,4,.72);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:20}
.pop{background:var(--panel);border:1px solid var(--gold);border-radius:var(--r);width:min(640px,100%);padding:18px;display:flex;flex-direction:column;gap:12px}
.pop h2{font-size:20px;color:var(--gold2)}
.atr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;text-align:center;border-block:1px solid var(--line);padding-block:8px}
.atr b{display:block;font-size:11px;letter-spacing:.08em;color:var(--gold)}
.atr span{font-variant-numeric:tabular-nums;font-size:13px}
.sb p{margin:0 0 6px} .sb p b{color:var(--gold2)}
.mon-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.atr-ed label{display:flex;flex-direction:column;gap:4px;align-items:center}
.atr-ed input{width:100%;max-width:56px;text-align:center}
.pop textarea{min-height:200px}
.sb h4{margin:12px 0 6px;font-family:Cinzel,Georgia,serif;font-size:14px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:3px}
.sb h4:first-child{margin-top:0}
.kv.info{font-size:13px}
details.oficial{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-top:8px}
details.oficial summary{cursor:pointer;color:var(--gold);font-size:13px}
.credito{margin:0;font-size:10.5px;line-height:1.4;color:var(--muted)}
.sb textarea{min-height:240px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

S_('Balor',19,'262 (21d12+126)','12 m, voo 24 m','26 15 22 20 16 22','Resistência a Magia. Resiste a Frio, Elétrico e armas não mágicas; Imune: Ígneo, Veneno.|Aura de Fogo. Quem o toca ou começa o turno a 1,5 m sofre 10 (3d6) Ígneo.|Espasmo da Morte. Ao morrer explode: raio de 9 m, Destreza CD 20, 70 (20d6) Ígneo (metade no sucesso).|Ataque Múltiplo. Espada Longa e Chicote.|Espada Longa. Corpo a corpo +14 (3 m). Acerto: 21 (3d8+8) Cortante + 13 (3d8) Elétrico.|Chicote. Corpo a corpo +14 (9 m). Acerto: 15 (2d6+8) Cortante + 10 (3d6) Ígneo; Força CD 20 ou puxado até 7,5 m.|Teletransporte. Até 36 m.');
S_('Pit Fiend',19,'300 (24d10+168)','9 m, voo 18 m','26 14 24 22 18 24','Aura de Medo. Inimigos que começam o turno a 6 m: Sabedoria CD 21 ou Amedrontados.|Resistência a Magia. Resiste a Frio e armas não prateadas; Imune: Ígneo, Veneno.|Ataque Múltiplo. Mordida, Garras, Maça e Cauda.|Mordida. Corpo a corpo +14 (1,5 m). Acerto: 22 (4d6+8) Perfurante; Constituição CD 21 ou Envenenado e 21 (6d6) Venenoso por turno.|Garras. Corpo a corpo +14 (3 m). Acerto: 17 (2d8+8) Cortante.|Maça. Corpo a corpo +14 (3 m). Acerto: 15 (2d6+8) Contundente + 21 (6d6) Ígneo.|Cauda. Corpo a corpo +14 (3 m). Acerto: 24 (3d10+8) Contundente.|Conjuração (Carisma, CD 21). À vontade: Detectar Magia, Bola de Fogo. 3/dia cada: Imobilizar Monstro, Muralha de Fogo.');
S_('Lich',17,'135 (18d8+54)','9 m','11 16 16 20 14 16','Resistência Lendária (3/dia). Resiste a Frio, Elétrico, Necrótico; Imune: Veneno e armas não mágicas.|Rejuvenescimento. Volta em 1d10 dias se o filactério não for destruído. Resistência a Expulsão.|Toque Paralisante. Corpo a corpo +12 (1,5 m). Acerto: 10 (3d6) Frio; Constituição CD 18 ou Paralisado por 1 minuto.|Conjuração (Inteligência, CD 20, +12). Raio de Fogo, Mãos Mágicas; Detectar Magia, Mísseis Mágicos, Escudo; Detectar Pensamentos, Invisibilidade, Flecha Ácida, Imagem Espelhada; Animar Mortos, Contramágica, Dissipar Magia, Bola de Fogo; Praga, Porta Dimensional; Nuvem Mortal, Vidência; Desintegrar, Globo de Invulnerabilidade; Dedo da Morte, Mudança de Plano; Dominar Monstro, Palavra de Poder: Atordoar; Palavra de Poder: Matar.|Ações Lendárias (3). Truque, Toque Paralisante (2 ações), Olhar Aterrorizante (2 ações), Perturbar Vida (3 ações).');
S_('Ancient Black Dragon',22,'367 (21d20+147)','12 m, voo 24 m, natação 12 m','27 14 25 16 15 19','Resistência Lendária (3/dia). Imune: Ácido. Anfíbio.|Presença Aterradora. Criaturas a 36 m: Sabedoria CD 19 ou Amedrontadas por 1 minuto.|Ataque Múltiplo. Presença Aterradora, Mordida e duas Garras.|Mordida. Corpo a corpo +15 (4,5 m). Acerto: 19 (2d10+8) Perfurante + 9 (2d8) Ácido.|Garras. Corpo a corpo +15 (3 m). Acerto: 15 (2d6+8) Cortante.|Sopro Ácido (Recarga 5–6). Linha de 27 m: Destreza CD 22, 67 (15d8) Ácido (metade no sucesso).|Ações Lendárias (3). Detectar, Cauda, Ataque de Asas (2 ações).');

const SRD = {"Aboleth":{"tipo":"Grande Aberração, Leal e Mau","ca":"17","pv":"150 (20d10+40)","desl":"3 m, natação 12 m","ini":"+7 (17)","atr":[21,9,15,18,15,18],"info":[["Salvaguardas","Des +3, Con +6, Int +8, Sab +6"],["Perícias","História +12, Percepção +10"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 20"],["Idiomas","Dialeto Subterrâneo; telepatia 36 m"]],"cr":"10","secoes":[["Traços",["Amphibious. The aboleth can breathe air and water.","Eldritch Restoration. If destroyed, the aboleth gains a new body in 5d10 days, reviving with all its Hit Points in the Far Realm or another location chosen by the GM.","Legendary Resistance (3/Day, or 4/Day in Lair). If the aboleth fails a saving throw, it can choose to succeed instead.","Mucus Cloud. While underwater, the aboleth is surrounded by mucus. Constitution Saving Throw: DC 14, each creature in a 5-foot Emanation originating from the aboleth at the end of the aboleth's turn. Failure: The target is cursed. Until the curse ends, the target's skin becomes slimy, the target can breathe air and water, and it can't regain Hit Points unless it is underwater. While the cursed creature is outside a body of water, the creature takes 6 (1d12) Acid damage at the end of every 10 minutes unless moisture is applied to its skin before those minutes have passed.","Probing Telepathy. If a creature the aboleth can see communicates telepathically with the aboleth, the aboleth learns the creature's greatest desires."]],["Ações",["Multiattack. The aboleth makes two Tentacle attacks and uses either Consume Memories or Dominate Mind if available.","Tentacle. Melee Attack Roll: +9, reach 15 ft. Hit: 12 (2d6 + 5) Bludgeoning damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14) from one of four tentacles.","Consume Memories. Intelligence Saving Throw: DC 16, one creature within 30 feet that is Charmed or Grappled by the aboleth. Failure: 10 (3d6) Psychic damage. Success: Half damage. Failure or Success: The aboleth gains the target's memories if the target is a Humanoid and is reduced to 0 Hit Points by this action.","Dominate Mind (2/Day). Wisdom Saving Throw: DC 16, one creature the aboleth can see within 30 feet. Failure: The target has the Charmed condition until the aboleth dies or is on a different plane of existence from the target. While Charmed, the target acts as an ally to the aboleth and is under its control while within 60 feet of it. In addition, the aboleth and the target can communicate telepathically with each other over any distance. The target repeats the save whenever it takes damage as well as after every 24 hours it spends at least 1 mile away from the aboleth, ending the effect on itself on a success."]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the aboleth can expend a use to take one of the following actions. The aboleth regains all expended uses at the start of each of its turns.","Lash. The aboleth makes one Tentacle attack.","Psychic Drain. If the aboleth has at least one creature Charmed or Grappled, it uses Consume Memories and regains 5 (1d10) Hit Points."]]]},"Air Elemental":{"tipo":"Grande Elemental, Neutro","ca":"15","pv":"90 (12d10+24)","desl":"3 m, voo 27 m (pairar)","ini":"+5 (15)","atr":[14,20,14,6,10,6],"info":[["Resistências","Contundente, Elétrico, Perfurante, Cortante"],["Imunidades","Venenoso, Trovejante; Exaustão, Agarrado, Paralisado, Petrificado, Envenenado, Caído, Impedido, Inconsciente"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Primordial (Auran)"]],"cr":"5","secoes":[["Traços",["Air Form. The elemental can enter a creature's space and stop there. It can move through a space as narrow as 1 inch without expending extra movement to do so."]],["Ações",["Multiattack. The elemental makes two Thunderous Slam attacks.","Thunderous Slam. Melee Attack Roll: +8, reach 10 ft. Hit: 14 (2d8 + 5) Thunder damage.","Whirlwind (Rech y checks and attack rolls.","Web Walker. The drider ignores movement restrictions caused by webs, and the drider knows the location of any other creature in contact with the same web."]],["Ações",["Multiattack. The drider makes three attacks, using Foreleg or Poison Burst in any combination.","Foreleg. Melee Attack Roll: +7, reach 10 ft. Hit: 13 (2d8 + 4) Piercing damage.","Poison Burst. Ranged Attack Roll: +6, range 120 ft. Hit: 13 (3d6 + 3) Poison damage."]],["Ações Bônus",["Magic of the Spider Queen (Recharge 5-6). The drider casts Darkness, Faerie Fire, or Web, requiring no Material components and using Wisdom as the spellcasting ability (spell save DC 14)."]]]},"Druid":{"tipo":"Médio ou Pequeno Humanoide (Druid), Neutro","ca":"13","pv":"44 (8d8+8)","desl":"9 m","ini":"+1 (11)","atr":[10,12,13,12,16,11],"info":[["Perícias","Medicina +5, Natureza +3, Percepção +5"],["Equipamento","Studded Leather Armor"],["Sentidos","Percepção passiva 15"],["Idiomas","Comum, Druídico, Silvestre"]],"cr":"2","secoes":[["Ações",["Multiattack. The druid makes two attacks, using Vine Staff or Verdant Wisp in any combination.","Vine Staff. Melee Attack Roll: +5, reach 5 ft. Hit: 7 (1d8 + 3) Bludgeoning damage plus 2 (1d4) Poison damage.","Verdant Wisp. Ranged Attack Roll: +5, range 90 ft. Hit: 10 (3d6) Radiant damage.","Spellcasting. The druid casts one of the following spells, using Wisdom as the spellcasting ability (spell save DC 13): At Will: Druidcraft, Speak with Animals 2/Day Each: Entangle, Thunderwave 1/Day Each: Animal Messenger, Longstrider, Moonbeam"]]]},"Dryad":{"tipo":"Médio Fada, Neutro","ca":"16","pv":"22 (5d8)","desl":"9 m","ini":"+1 (11)","atr":[10,12,11,14,15,18],"info":[["Perícias","Percepção +4, Furtividade +5"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Élfico, Silvestre"]],"cr":"1","secoes":[["Traços",["Magic Resistance. The dryad has Advantage on saving throws against spells and other magical effects.","Speak with Beasts and Plants. The dryad can communicate with Beasts and Plants as if they shared a language."]],["Ações",["Multiattack. The dryad makes one Vine Lash or Thorn Burst attack, and it can use Spellcasting to cast Charm Monster.","Vine Lash. Melee Attack Roll: +6, reach 10 ft. Hit: 8 (1d8 + 4) Slashing damage.","Thorn Burst. Ranged Attack Roll: +6, range 60 ft. Hit: 7 (1d6 + 4) Piercing damage.","Spellcasting. The dryad casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 14): At Will: Animal Friendship, Charm Monster (lasts 24 hours; ends early if the dryad casts the spell again), Druidcraft 1/Day Each: Entangle, Pass without Trace"]],["Ações Bônus",["Tree Stride. If within 5 feet of a Large or bigger tree, the dryad teleports to an unoccupied space within 5 feet of a second Large or bigger tree that is within 60 feet of the previous tree."]]]},"Earth Elemental":{"tipo":"Grande Elemental, Neutro","ca":"17","pv":"147 (14d10+70)","desl":"9 m, escavação 9 m","ini":"-1 (9)","atr":[20,8,20,5,10,5],"info":[["Vulnerabilidades","Trovejante"],["Imunidades","Venenoso; Exaustão, Paralisado, Petrificado, Envenenado, Inconsciente"],["Sentidos","Visão no Escuro 18 m, Sentido Sísmico 18 m; Percepção passiva 10"],["Idiomas","Primordial (Terran)"]],"cr":"5","secoes":[["Traços",["Earth Glide. The elemental can burrow through nonmagical, unworked earth and stone. While doing so, the elemental doesn't disturb the material it moves through.","Siege Monster. The elemental deals double damage to objects and structures."]],["Ações",["Multiattack. The elemental makes two attacks, using Slam or Rock Launch in any combination.","Slam. Melee Attack Roll: +8, reach 10 ft. Hit: 14 (2d8 + 5) Bludgeoning damage.","Rock Launch. Ranged Attack Roll: +8, range 60 ft. Hit: 8 (1d6 + 5) Bludgeoning damage. If the target is a Large or smaller creature, it has the Prone condition."]]]},"Efreeti":{"tipo":"Grande Elemental (Genie), Neutro","ca":"17","pv":"212 (17d10+119)","desl":"12 m, voo 18 m (pairar)","ini":"+1 (11)","atr":[22,12,24,16,15,19],"info":[["Salvaguardas","Sab +6, Car +8"],["Imunidades","Fogo"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 12"],["Idiomas","Primordial (Ignan)"]],"cr":"11","secoes":[["Traços",["Elemental Restoration. If the efreeti dies outside the Elemental Plane of Fire, its body dissolves into ash, and it gains a new body in 1d4 days, reviving with all its Hit Points somewhere on the Plane of Fire.","Magic Resistance. The efreeti has Advantage on saving throws against spells and other magical effects.","Wishes. The efreeti has a 30 percent chance of knowing the Wish spell. If the efreeti knows it, the efreeti can cast it only on behalf of a non-genie creature who communicates a wish in a way the efreeti can understand. If the efreeti casts the spell for the creature, the efreeti suffers none of the spell's stress. Once the efreeti has cast it three times, the efreeti can't do so again for 365 days."]],["Ações",["Multiattack. The efreeti makes three attacks, using Heated Blade or Hurl Flame in any combination.","Heated Blade. Melee Attack Roll: +10, reach 5 ft. Hit: 13 (2d6 + 6) Slashing damage plus 13 (2d12) Fire damage.","Hurl Flame. Ranged Attack Roll: +8, range 120 ft. Hit: 24 (7d6) Fire damage.","Spellcasting. The efreeti casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 16): At Will: Detect Magic, Elementalism 1/Day Each: Gaseous Form, Invisibility, Major Image, Plane Shift, Tongues, Wall of Fire (level 7 version)"]]]},"Erinyes":{"tipo":"Médio Ínfero (Diabo), Leal e Mau","ca":"18","pv":"178 (21d8+84)","desl":"9 m, voo 18 m","ini":"+7 (17)","atr":[18,16,18,14,14,18],"info":[["Salvaguardas","Des +7, Con +8, Car +8"],["Perícias","Percepção +6, Persuasão +8"],["Resistências","Frio"],["Imunidades","Fogo, Venenoso; Envenenado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 16"],["Idiomas","Infernal; telepatia 36 m"]],"cr":"12","secoes":[["Traços",["Diabolical Restoration. If the erinyes dies outside the Nine Hells, its body disappears in sulfurous smoke, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.","Magic Resistance. The erinyes has Advantage on saving throws against spells and other magical effects.","Magic Rope. The erinyes has a magic rope. While bearing it, the erinyes can use the Entangling Rope action. The rope has AC 20, HP 90, and Immunity to Poison and Psychic damage. The rope turns to dust if reduced to 0 Hit Points, if it is 5+ feet away from the erinyes for 1 hour or more, or if the erinyes dies. If the rope is damaged or destroyed, the erinyes can fully restore it when finishing a Short or Long Rest."]],["Ações",["Multiattack. The erinyes makes three Withering Sword attacks and can use Entangling Rope.","Withering Sword. Melee Attack Roll: +8, reach 5 ft. Hit: 13 (2d8 + 4) Slashing damage plus 11 (2d10) Necrotic damage.","Entangling Rope (Requires Magic Rope). Strength Saving Throw: DC 16, one creature the erinyes can see within 120 feet. Failure: 14 (4d6) Force damage, and the target has the Restrained condition until the rope is destroyed, the erinyes uses a Bonus Action to release the target, or the erinyes uses Entangling Rope again."]],["Reações",["Parry. Trigger: The erinyes is hit by a melee attack roll while holding a weapon. Response: The erinyes adds 4 to its AC against that attack, possibly causing it to miss."]]]},"Ettercap":{"tipo":"Médio Monstruosidade, Neutro e Mau","ca":"13","pv":"44 (8d8+8)","desl":"9 m, escalada 9 m","ini":"+2 (12)","atr":[14,15,13,7,12,8],"info":[["Perícias","Percepção +3, Furtividade +4, Sobrevivência +3"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 13"],["Idiomas","Nenhum"]],"cr":"2","secoes":[["Traços",["Spider Climb. The ettercap can climb difficult surfaces, including along ceilings, without needing to make an ability check.","Web Walker. The ettercap ignores movement restrictions caused by webs, and the ettercap knows the location of any other creature in contact with the same web."]],["Ações",["Multiattack. The ettercap makes one Bite attack and one Claw attack.","Bite. Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Piercing damage plus 2 (1d4) Poison damage, and the target has the Poisoned condition until the start of the ettercap's next turn.","Claw. Melee Attack Roll: +4, reach 5 ft. Hit: 7 (2d4 + 2) Slashing damage.","Web Strand (Recharge 5-6). Dexterity Saving Throw: DC 12, one Large or smaller creature the ettercap can see within 30 feet. Failure: The target has the Restrained condition until the web is destroyed (AC 10; HP 5; Vulnerability to Fire damage; Immunity to Bludgeoning, Poison, and Psychic damage)."]],["Ações Bônus",["Reel. The ettercap pulls one creature within 30 feet of itself that is Restrained by its Web Strand up to 25 feet straight toward itself."]]]},"Ettin":{"tipo":"Grande Gigante, Caótico e Mau","ca":"12","pv":"85 (10d10+30)","desl":"12 m","ini":"-1 (9)","atr":[21,8,17,6,10,8],"info":[["Perícias","Percepção +4"],["Imunidades","Cego, Enfeitiçado, Surdo, Amedrontado, Atordoado, Inconsciente"],["Equipamento","Battleaxe, Morningstar"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Gigante"]],"cr":"4","secoes":[["Ações",["Multiattack. The ettin makes one Battleaxe attack and one Morningstar attack.","Battleaxe. Melee Attack Roll: +7, reach 5 ft. Hit: 14 (2d8 + 5) Slashing damage. If the target is a Large or smaller creature, it has the Prone condition.","Morningstar. Melee Attack Roll: +7, reach 5 ft. Hit: 14 (2d8 + 5) Piercing damage, and the target has Disadvantage on the next attack roll it makes before the end of its next turn."]]]},"Fire Elemental":{"tipo":"Grande Elemental, Neutro","ca":"13","pv":"93 (11d10+33)","desl":"15 m","ini":"+3 (13)","atr":[10,17,16,6,10,7],"info":[["Resistências","Contundente, Perfurante, Cortante"],["Imunidades"," s next turn."]]]},"Flesh Golem":{"tipo":"Médio Constructo, Neutro","ca":"9","pv":"127 (15d8+60)","desl":"9 m","ini":"-1 (9)","atr":[19,9,18,6,10,5],"info":[["Imunidades","Elétrico, Venenoso; Enfeitiçado, Exaustão, Amedrontado, Paralisado, Petrificado, Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Understands Comum mais one other language mas não fala"]],"cr":"5","secoes":[["Traços",["Aversion to Fire. If the golem takes Fire damage, it has Disadvantage on attack rolls and ability checks until the end of its next turn.","Berserk. Whenever the golem starts its turn Bloodied, roll 1d6. On a 6, the golem goes berserk. On each of its turns while berserk, the golem attacks the nearest creature it can see. If no creature is near enough to move to and attack, the golem attacks an object. Once the golem goes berserk, it remains so until it is destroyed or it is no longer Bloodied. The golem's creator, if within 60 feet of the berserk golem, can try to calm it by taking an action to make a DC 15 Charisma (Persuasion) check; the golem must be able to hear its creator. If this check succeeds, the golem ceases being berserk until the start of its next turn, at which point it resumes rolling for the Berserk trait again if it is still Bloodied.","Immutable Form. The golem can't shape-shift.","Lightning Absorption. Whenever the golem is subjected to Lightning damage, it regains a number of Hit Points equal to the Lightning damage dealt.","Magic Resistance. The golem has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The golem makes two Slam attacks.","Slam. Melee Attack Roll: +7, reach 5 ft. Hit: 13 (2d8 + 4) Bludgeoning damage plus 4 (1d8) Lightning damage."]]]},"Frost Giant":{"tipo":"Enorme Gigante, Neutro e Mau","ca":"15","pv":"149 (13d12+65)","desl":"12 m","ini":"+2 (12)","atr":[23,9,21,9,10,12],"info":[["Salvaguardas","Con +8, Sab +3, Car +4"],["Perícias","Atletismo +9, Percepção +3"],["Imunidades","Frio"],["Sentidos","Percepção passiva 13"],["Idiomas","Gigante"]],"cr":"8","secoes":[["Ações",["Multiattack. The giant makes two attacks, using Frost Axe or Great Bow in any combination.","Frost Axe. Melee Attack Roll: +9, reach 10 ft. Hit: 19 (2d12 + 6) Slashing damage plus 9 (2d8) Cold damage.","Great Bow. Ranged Attack Roll: +9, range 150/600 ft. Hit: 17 (2d10 + 6) Piercing damage plus 7 (2d6) Cold damage, and the target's Speed decreases by 10 feet until the end of its next turn."]],["Ações Bônus",["War Cry (Recharge 5-6). The giant or one creature of its choice that can see or hear it gains 16 (2d10 + 5) Temporary Hit Points and has Advantage on attack rolls until the start of the giant's next turn."]]]},"Shrieker Fungus":{"tipo":"Médio Planta, Sem Tendência","ca":"5","pv":"13 (3d8)","desl":"1,5 m","ini":"-5 (5)","atr":[1,1,10,1,3,1],"info":[["Imunidades","Cego, Enfeitiçado, Surdo, Amedrontado"],["Sentidos","Percepção às Cegas 9 m; Percepção passiva 6"],["Idiomas","Nenhum"]],"cr":"0","secoes":[["Reações",["Shriek. Trigger: A creature or a source of Bright Light moves within 30 feet of the shrieker. Response: The shrieker emits a shriek audible within 300 feet of itself for 1 minute or until the shrieker dies."]]]},"Violet Fungus":{"tipo":"Médio Planta, Sem Tendência","ca":"5","pv":"18 (4d8)","desl":"1,5 m","ini":"-5 (5)","atr":[3,1,10,1,3,1],"info":[["Imunidades","Cego, Enfeitiçado, Surdo, Amedrontado"],["Sentidos","Percepção às Cegas 9 m; Percepção passiva 6"],["Idiomas","Nenhum"]],"cr":"1/4","secoes":[["Ações",["Multiattack. The fungus makes two Rotting Touch attacks.","Rotting Touch. Melee Attack Roll: +2, reach 10 ft. Hit: 4 (1d8) Necrotic damage."]]]},"Gargoyle":{"tipo":"Médio Elemental, Caótico e Mau","ca":"15","pv":"67 (9d8+27)","desl":"9 m, voo 18 m","ini":"+2 (12)","atr":[15,11,16,6,11,7],"info":[["Perícias","Furtividade +4"],["Imunidades","Venenoso; Exaustão, Petrificado, Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Primordial (Terran)"]],"cr":"2","secoes":[["Traços",["Flyby. The gargoyle doesn't provoke an Opportunity Attack when it flies out of an enemy's reach."]],["Ações",["Multiattack. The gargoyle makes two Claw attacks.","Claw. Melee Attack Roll: +4, reach 5 ft. Hit: 7 (2d4 + 2) Slashing damage."]]]},"Gelatinous Cube":{"tipo":"Grande Gosma, Sem Tendência","ca":"6","pv":"63 (6d10+30)","desl":"4,5 m","ini":"-4 (6)","atr":[14,3,20,1,6,1],"info":[["Imunidades","Ácido; Cego, Enfeitiçado, Surdo, Exaustão, Amedrontado, Caído"],["Sentidos","Percepção às Cegas 18 m; Percepção passiva 8"],["Idiomas","Nenhum"]],"cr":"2","secoes":[["Traços",["Ooze Cube. The cube fills its entire space and is transparent. Other creatures can enter that space, but a creature that does so is subjected to the cube's Engulf and has Disadvantage on the saving throw. Creatures inside the cube have Total Cover, and the cube can hold one Large creature or up to four Medium or Small creatures inside itself at a time. As an action, a creature within 5 feet of the cube can pull a creature or an object out of the cube by succeeding on a DC 12 Strength (Athletics) check, and the puller takes 10 (3d6) Acid damage.","Transparent. Even when the cube is in plain sight, a creature must succeed on a DC 15 Wisdom (Perception) check to notice the cube if the creature hasn't witnessed the cube move or otherwise act."]],["Ações",["Pseudopod. Melee Attack Roll: +4, reach 5 ft. Hit: 12 (3d6 + 2) Acid damage.","Engulf. The cube moves up to its Speed without provoking Opportunity Attacks. The cube can move through the spaces of Large or smaller creatures if it has room inside itself to contain them (see the Ooze Cube trait). Dexterity Saving Throw: DC 12, each creature whose space the cube enters for the first time during this move. Failure: 10 (3d6) Acid damage, and the target is engulfed. An engulfed target is suffocating, can't cast spells with a Verbal component, has the Restrained condition, and takes 10 (3d6) ["Traços",["Ethereal Sight. The ghost can see 60 feet into the Ethereal Plane when it is on the Material Plane.","Incorporeal Movement. The ghost can move through other creatures and objects as if they were Difficult Terrain. It takes 5 (1d10) Force damage if it ends its turn inside an object."]],["Ações",["Multiattack. The ghost makes two Withering Touch attacks.","Withering Touch. Melee Attack Roll: +5, reach 5 ft. Hit: 19 (3d10 + 3) Necrotic damage.","Etherealness. The ghost casts the Etherealness spell, requiring no spell components and using Charisma as the spellcasting ability. The ghost is visible on the Material Plane while on the Border Ethereal and vice versa, but it can't affect or be affected by anything on the other plane.","Horrific Visage. Wisdom Saving Throw: DC 13, each creature in a 60-foot Cone that can see the ghost and isn't an Undead. Failure: 10 (2d6 + 3) Psychic damage, and the target has the Frightened condition until the start of the ghost's next turn. Success: The target is immune to this ghost's Horrific Visage for 24 hours.","Possession (Recharge 6). Charisma Saving Throw: DC 13, one Humanoid the ghost can see within 5 feet. Failure: The target is possessed by the ghost; the ghost disappears, and the target has the Incapacitated condition and loses control of its body. The ghost now controls the body, but the target retains awareness. The ghost can't be targeted by any attack, spell, or other effect, except ones that specifically target Undead. The ghost's game statistics are the same, except it uses the possessed target's Speed, as well as the target's Strength, Dexterity, and Constitution modifiers. The possession lasts until the body drops to 0 Hit Points or the ghost leaves as a Bonus Action. When the possession ends, the ghost appears in an unoccupied space within 5 feet of the target, and the target is immune to this ghost's Possession for 24 hours. Success: The target is immune to this ghost's Possession for 24 hours."]]]},"Ghoul" tion again until the start of its next turn."]]]},"Lamia":{"tipo":"Grande Ínfero, Caótico e Mau","ca":"13","pv":"97 (13d10+26)","desl":"12 m","ini":"+1 (11)","atr":[16,13,15,14,15,16],"info":[["Perícias","Enganação +7, Intuição +4, Furtividade +5"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 12"],["Idiomas","Abissal, Comum"]],"cr":"4","secoes":[["Ações",["Multiattack. The lamia makes two Claw attacks. It can replace one attack with a use of Corrupting Touch.","Claw. Melee Attack Roll: +5, reach 5 ft. Hit: 7 (1d8 + 3) Slashing damage plus 7 (2d6) Psychic damage.","Corrupting Touch. Wisdom Saving Throw: DC 13, one creature the lamia can see within 5 feet. Failure: 13 (3d8) Psychic damage, and the target is cursed for 1 hour. Until the curse ends, the target has the Charmed and Poisoned conditions.","Spellcasting. The lamia casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 13): At Will: Disguise Self (can appear as a Large or Medium biped), Minor Illusion 1/Day Each: Geas, Major Image, Scrying"]],["Ações Bônus",["Leap. The lamia jumps up to 30 feet by spending 10 feet of movement."]]]},"Lemure":{"tipo":"Médio Ínfero (Diabo), Leal e Mau","ca":"9","pv":"9 (2d8)","desl":"6 m","ini":"-3 (7)","atr":[10,5,11,1,11,3],"info":[["Resistências","Frio"],["Imunidades","Fogo, Venenoso; Enfeitiçado, Amedrontado, Envenenado"],["Sentidos","Visão no Escuro 36 m (unimpeded by magical Darkness); Percepção passiva 10"],["Idiomas","Understands Infernal mas não fala"]],"cr":"0","secoes":[["Traços",["Hellish Restoration. If the lemure dies in the Nine Hells, it revives with all its Hit Points in 1d10 days unless it is killed by a creature under the effects of a Bless spell or its remains are sprinkled with Holy Water."]],["Ações",["Vile Slime. Melee Attack Roll: +2, reach 5 ft. Hit: 2 (1d4) Poison damage."]]]},"Lich":{"tipo":"Médio Morto-Vivo (Mago), Neutro e Mau","ca":"20","pv":"315 (42d8+126)","desl":"9 ear magically returns to the merfolk's hand immediately after a ranged attack."]]]},"Merrow":{"tipo":"Grande Monstruosidade, Caótico e Mau","ca":"13","pv":"45 (6d10+12)","desl":"3 m, natação 12 m","ini":"+2 (12)","atr":[18,15,15,8,10,9],"info":[["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Abissal, Primordial (Aquan)"]],"cr":"2","secoes":[["Traços",["Amphibious. The merrow can breathe air and water."]],["Ações",["Multiattack. The merrow makes two attacks, using Bite, Claw, or Harpoon in any combination.","Bite. Melee Attack Roll: +6, reach 5 ft. Hit: 6 (1d4 + 4) Piercing damage, and the target has the Poisoned condition until the end of the merrow's next turn.","Claw. Melee Attack Roll: +6, reach 5 ft. Hit: 9 (2d4 + 4) Slashing damage.","Harpoon. Melee or Ranged Attack Roll: +6, reach 5 ft. or range 20/60 ft. Hit: 11 (2d6 + 4) Piercing damage. If the target is a Large or smaller creature, the merrow pulls the target up to 15 feet straight toward itself."]]]},"Mimic":{"tipo":"Médio Monstruosidade, Neutro","ca":"12","pv":"58 (9d8+18)","desl":"6 m","ini":"+3 (13)","atr":[17,12,15,5,13,8],"info":[["Perícias","Furtividade +5"],["Imunidades","Ácido; Caído"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 11"],["Idiomas","Nenhum"]],"cr":"2","secoes":[["Traços",["Adhesive (Object Form Only). The mimic adheres to anything that touches it. A Huge or smaller creature adhered to the mimic has the Grappled condition (escape DC 13). Ability checks made to escape this grapple have Disadvantage."]],["Ações",["Bite. Melee Attack Roll: +5 (with Advantage if the target is Grappled by the mimic), reach 5 ft. Hit: 7 (1d8 + 3) Piercing damage--or 12 (2d8 + 3) Piercing damage if the target is Grappled by the mimic--plus 4 (1d8) Acid damage.","Pseudopod. Melee Attack Roll: +5, reach 5 ft. Hit: 7 (1d8 + 3) Bludgeoning damage plus 4 (1d8) Acid damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 13). Ability checks made to escape this grapple have Disadvantage."]],["Ações Bônus",["Shape-Shift. The mimic shape-shifts to resemble a Medium or Small object while retaining its game statistics, or it returns to its true blob form. Any equipment it is wearing or carrying isn't transformed."]]]},"Minotaur of Baphomet":{"tipo":"Grande Monstruosidade, Caótico e Mau","ca":"14","pv":"85 (10d10+30)","desl":"12 m","ini":"+0 (10)","atr":[18,11,16,6,16,9],"info":[["Perícias","Percepção +7, Sobrevivência +7"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 17"],["Idiomas","Abissal"]],"cr":"3","secoes":[["Ações",["Abyssal Glaive. Melee Attack Roll: +6, reach 10 ft. Hit: 10 (1d12 + 4) Slashing damage plus 10 (3d6) Necrotic damage.","Gore (Recharge 5-6). Melee Attack Roll: +6, reach 5 ft. Hit: 18 (4d6 + 4) Piercing damage. If the target is a Large or smaller creature and the minotaur moved 10+ feet straight toward it immediately before the hit, the target takes an extra 10 (3d6) Piercing damage and has the Prone condition."]]]},"Mummy":{"tipo":"Médio ou Pequeno Morto-Vivo, Leal e Mau","ca":"11","pv":"58 (9d8+18)","desl":"6 m","ini":"-1 (9)","atr":[16,8,15,6,12,12],"info":[["Salvaguardas","Sab +3"],["Vulnerabilidades","Fogo"],["Imunidades","Necrótico, Venenoso; Enfeitiçado, Exaustão, Amedrontado, Paralisado, Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 11"],["Idiomas","Comum mais two other languages"]],"cr":"3","secoes":[["Ações",["Multiattack. The mummy makes two Rotting Fist attacks and uses Dreadful Glare.","Rotting Fist. Melee Attack Roll: +5, reach 5 ft. Hit: 8 (1d10 + 3) Bludgeoning damage plus 10 (3d6) Necrotic damage. If the target is a creature, it is cursed. While cursed, the target can't regain Hit Points, its Hit Point maximum doesn't return to normal when finishing a Long Rest, and its Hit Point maximum decreases by 10 (3d6) every 24 hours that elapse. A creature dies and turns to dust if reduced to 0 Hit Points by this attack.","Dreadful Glare. Wisdom Saving Throw: DC 11, one creature the mummy can see within 60 feet. Failure: The target has the Frightened condition until the end of the mummy's next turn. Success: The target is immune to this mummy's Dreadful Glare for 24 hours."]]]},"Mummy Lord":{"tipo":"Médio ou Pequeno Morto-Vivo (Clérigo), Leal e Mau","ca":"17","pv":"187 (25d8+75)","desl":"9 m","ini":"+10 (20)","atr":[18,10,17,11,19,16],"info":[["Salvaguardas","Int +5, Sab +9"],["Perícias","História +5, Percepção +9, Religião +5"],["Vulnerabilidades","Fogo"],["Imunidades","Necrótico, Venenoso; Enfeitiçado, Exaustão, Amedrontado, Paralisado, Envenenado"],["Sentidos","Visão Verdadeira 18 m; Percepção passiva 19"],["Idiomas","Comum mais three other languages"]],"cr":"15","secoes":[["Traços",["Legendary Resistance (3/Day, or 4/Day in Lair). If the mummy fails a saving throw, it can choose to succeed instead.","Magic Resistance. The mummy has Advantage on saving throws against spells and other magical effects.","Undead Restoration. If destroyed, the mummy gains a new body in 24 hours if its heart is intact, reviving with all its Hit Points. The new body appears in an unoccupied space within the mummy's lair. The heart is a Tiny object that has AC 17, HP 10, and Immunity to all damage except Fire."]],["Ações",["Multiattack. The mummy makes one Rotting Fist or Channel Negative Energy attack, and it uses Dreadful Glare.","Rotting Fist. Melee Attack Roll: +9, reach 5 ft. Hit: 15 (2d10 + 4) Bludgeoning damage plus 10 (3d6) Necrotic damage. If the target is a creature, it is cursed. While cursed, the target can't regain Hit Points, it gains no benefit from finishing a Long Rest, and its Hit Point maximum decreases by 10 (3d6) every 24 hours that elapse. A creature dies and turns to dust if reduced to 0 Hit Points by this attack.","Channel Negative Energy. Ranged Attack Roll: +9, range 60 ft. Hit: 25 (6d6 + 4) Necrotic damage.","Dreadful Glare. Wisdom Saving Throw: DC 17, one creature the mummy can see within 60 feet. Failure: 25 (6d6 + 4) Psychic damage, and the target has the Paralyzed condition until the end of the mummy's next turn.","Spellcasting. The mummy casts one of the following spells, requiring no Material components and using Wisdom as the spellcasting ability (spell save DC 17, +9 to hit with spell attacks): At Will: Dispel Magic, Thaumaturgy 1/Day Each: Animate Dead, Harm, Insect Plague (level 7 version)"]],["Reações",["Whirlwind of Sand. Trigger: The mummy is hit by an attack roll. Response: The mummy adds 2 to its AC against the attack, possibly causing the attack to miss, and the mummy teleports up to 60 feet to an unoccupied space it can see. Each creature of its choice that it can see within 5 feet of its destination space has the Blinded condition until the end of the mummy's next turn."]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the mummy can expend a use to take one of the following actions. The mummy regains all expended uses at the start of each of its turns.","Dread Command. The mummy casts Command (level 2 version), using the same spellcasting ability as Spellcasting. The mummy can't take this action again until the start of its next turn.","Glare. The mummy uses Dreadful Glare. The mummy can't take this action again until the start of its next turn.","Necrotic Strike. The mummy makes one Rotting Fist or Channel Negative Energy attack."]]]},"Nalfeshnee":{"tipo":"Grande Ínfero (Demônio), Caótico e Mau","ca":"18","pv":"184 (16d10+96)","desl":"6 m, voo 9 m","ini":"+5 (15)","atr":[21,10,22,19,12,15],"info":[["Salvaguardas","Con +11, Int +9, Sab +6, Car +7"],["Resistências","Frio, Fogo, Elétrico"],["Imunidades","Venenoso; Amedrontado, Envenenado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 11"],["Idiomas","Abissal; telepatia 36 m"]],"cr":"13","secoes":[["Traços",["Demonic Restoration. If the nalfeshnee dies outside the Abyss, its body dissolves into ichor, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Abyss.","Magic Resistance. The nalfeshnee has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The nalfeshnee makes three Rend attacks.","Rend. Melee Attack Roll: +10, reach 10 ft. Hit: 16 (2d10 + 5) Slashing damage plus 11 (2d10) Force damage.","Teleport. The nalfeshnee teleports up to 120 feet to an unoccupied space it can see."]],["Ações Bônus",["Horror Nimbus (Recharge 5-6). Wisdom Saving Throw: DC 15, each creature in a 15-foot Emanation originating from the nalfeshnee. Failure: 28 (8d6) Psychic damage, and the target has the Frightened condition for 1 minute, until it takes damage, or until it ends its turn with the nalfeshnee out of line of sight. Success: System Reference Document 5.2.1 The target is immune to this nalfeshnee's Horror Nimbus for 24 hours."]],["Reações",["Pursuit. Trigger: Another creature the nalfeshnee can see ends its move within 120 feet of the nalfeshnee. Response: The nalfeshnee uses Teleport, but its destination space must be within 10 feet of the triggering creature."]]]},"Night Hag":{"tipo":"Médio Ínfero, Neutro e Mau","ca":"17","pv":"112 (15d8+45)","desl":"9 m","ini":"+5 (15)","atr":[18,15,16,16,14,16],"info":[["Perícias","Enganação +6, Intuição +5, Percepção +5, Furtividade +5"],["Resistências","Frio, Fogo"],["Imunidades","Enfeitiçado"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 15"],["Idiomas","Abissal, Comum, Infernal, Primordial"]],"cr":"5","secoes":[["Traços",["Coven Magic. While within 30 feet of at least two hag allies, the hag can cast one of the following spells, requiring no Material components, using the spell's normal casting time, and using Intelligence as the spellcasting ability (spell save DC 14): Augury, Find Familiar, Identify, Locate Object, Scrying, or Unseen Servant. The hag must finish a Long Rest before using this trait to cast that spell again.","Magic Resistance. The hag has Advantage on saving throws against spells and other magical effects.","Soul Bag. The hag has a soul bag. While holding or carrying the bag, the hag can use its Nightmare Haunting action. The bag has AC 15, HP 20, and Resistance to all damage. The bag turns to dust if reduced to 0 Hit Points. If the bag is destroyed, any souls the bag is holding are released. The hag can create a new bag after 7 days."]],["Ações",["Multiattack. The hag makes two Claw attacks.","Claw. Melee Attack Roll: +7, reach 5 ft. Hit: 13 (2d8 + 4) Slashing damage.","Nightmare Haunting (1/Day; Requires Soul Bag). While on the Ethereal Plane, the hag casts Dream, using the same spellcasting ability as Spellcasting. Only the hag can serve as the spell's messenger, and the target must be a creature the hag can see on the Material Plane. The spell fails and is wasted if the target is under the effect of the Protection from Evil and Good spell or within a Magic Circle spell. If the target takes damage from the Dream spell, the target's Hit Point maximum decreases by an amount equal to that damage. If the spell kills the target, its soul is trapped in the hag's soul bag, and the target can't be raised from the dead until its soul is released.","Spellcasting. The hag casts one of the following spells, requiring no Material components and using Intelligence as the spellcasting ability (spell save DC 14): At Will: Detect Magic, Etherealness, Magic Missile (level 4 version) 2/Day Each: Phantasmal Killer, Plane Shift (self only)"]],["Ações Bônus",["Shape-Shift. The hag shape-shifts into a Small or Medium Humanoid, or it returns to its true form. Other than its size, its game statistics are the same in each form. Any equipment it is wearing or carrying isn't transformed."]]]},"Nightmare":{"tipo":"Grande Ínfero, Neutro e Mau","ca":"13","pv":"68 (8d10+24)","desl":"18 m, voo 27 m (pairar)","ini":"+2 (12)","atr":[18,15,16,10,13,15],"info":[["Imunidades","Fogo"],["Sentidos","Percepção passiva 11"],["Idiomas","Understands Abissal, Comum, e Infernal ma 10, Persuasão +19"],["Resistências","Frio"],["Imunidades","Fogo, Venenoso; Envenenado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 20"],["Idiomas","Infernal; telepatia 36 m"]],"cr":"20","secoes":[["Traços",["Diabolical Restoration. If the pit fiend dies outside the Nine Hells, its body disappears in sulfurous smoke, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.","Fear Aura. The pit fiend emanates an aura in a 20foot Emanation while it doesn't have the Incapacitated condition. Wisdom Saving Throw: DC 21, any enemy that starts its turn in the aura. Failure: The target has the Frightened condition until the start of its next turn. Success: The target is immune to this pit fiend's aura for 24 hours.","Legendary Resistance (4/Day). If the pit fiend fails a saving throw, it can choose to succeed instead.","Magic Resistance. The pit fiend has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The pit fiend makes one Bite attack, two Devilish Claw attacks, and one Fiery Mace attack.","Bite. Melee Attack Roll: +14, reach 10 ft. Hit: 18 (3d6 + 8) Piercing damage. If the target is a creature, it must make the following saving throw. Constitution Saving Throw: DC 21. Failure: The target has the Poisoned condition. While Poisoned, the target can't regain Hit Points and takes 21 (6d6) Poison damage at the start of each of its turns, and it repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically.","Devilish Claw. Melee Attack Roll: +14, reach 10 ft. Hit: 26 (4d8 + 8) Necrotic damage.","Fiery Mace. Melee Attack Roll: +14, reach 10 ft. Hit: 22 (4d6 + 8) Force damage plus 21 (6d6) Fire damage.","Hellfire Spellcasting (Recharge 4-6). The pit fiend casts Fireball (level 5 version) twice, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 21). It can replace one Fireball with Hold Monster (level 7 version) or Wall of Fire."]]]},"Planetar":{"tipo":"Grande Celestial (Angel), Leal e Bom","ca":"19","pv":"262 (21d10+147)","desl":"12 m, voo 36 m (pairar)","ini":"+10 (20)","atr":[24,20,24,19,22,25],"info":[["Salvaguardas","For +12, Con +12, Sab +11, Car +12"],["Perícias","Percepção +11"],["Resistências","Radiante"],["Imunidades","Enfeitiçado, Exaustão, Amedrontado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 21"],["Idiomas","All; telepatia 36 m"]],"cr":"16","secoes":[["Traços",["Divine Awareness. The planetar knows if it hears a lie.","Exalted Restoration. If the planetar dies outside Mount Celestia, its body disappears, and it gains a new body instantly, reviving with all its Hit Points somewhere in Mount Celestia.","Magic Resistance. The planetar has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The planetar makes three Radiant Sword attacks or uses Holy Burst twice.","Radiant Sword. Melee Attack Roll: +12, reach 10 ft. Hit: 14 (2d6 + 7) Slashing damage plus 18 (4d8) Radiant damage.","Holy Burst. Dexterity Saving Throw: DC 20, each enemy in a 20-foot-radius Sphere centered on a point the planetar can see within 120 feet. Failure: 24 (7d6) Radiant damage. Success: Half damage.","Spellcasting. The planetar casts one of the following spells, requiring no Material components and using Charisma as spellcasting ability (spell save DC 20): At Will: Detect Evil and Good 1/Day Each: Commune, Control Weather, Dispel Evil and Good, Raise Dead"]],["Ações Bônus",["Divine Aid (2/Day). The planetar casts Cure Wounds, Invisibility, Lesser Restoration, or Remove Curse, using the same spellcasting ability as Spellcasting. System Reference Document 5.2.1"]]]},"Priest Acolyte":{"tipo":"Médio ou Pequeno Humanoide (Clérigo), Neutro","ca":"13","pv":"11 (2d8+2)","desl":"9 m","ini":"+0 (10)","atr":[14,10,12,10,14,11],"info":[["Perícias","Medicina +4, Religião +2"],["Equipamento","Chain Shirt, eck."]],["Ações",["Multiattack. The roper makes two Tentacle attacks, uses Reel, and makes two Bite attacks.","Bite. Melee Attack Roll: +7, reach 5 ft. Hit: 17 (3d8 + 4) Piercing damage.","Tentacle. Melee Attack Roll: +7, reach 60 ft. Hit: The target has the Grappled condition (escape DC 14) from one of six tentacles, and the target has the Poisoned condition until the grapple ends. The tentacle can be damaged, freeing a creature it has Grappled when destroyed (AC 20, HP 10, Immunity to Poison and Psychic damage). Damaging the tentacle deals no damage to the roper, and a destroyed tentacle regrows at the start of the roper's next turn.","Reel. The roper pulls each creature Grappled by it up to 30 feet straight toward it."]]]},"Rust Monster":{"tipo":"Médio Monstruosidade, Sem Tendência","ca":"14","pv":"33 (6d8+6)","desl":"12 m","ini":"+1 (11)","atr":[13,12,13,2,13,6],"info":[["Sentidos","Visão no Escuro 18 m; Percepção passiva 11"],["Idiomas","Nenhum"]],"cr":"1/2","secoes":[["Traços",["Iron Scent. The rust monster can pinpoint the location of ferrous metal within 30 feet of itself."]],["Ações",["Multiattack. The rust monster makes one Bite attack and uses Antennae twice.","Bite. Melee Attack Roll: +3, reach 5 ft. Hit: 5 (1d8 + 1) Piercing damage.","Antennae. The rust monster targets one nonmagical metal object--armor or a weapon--worn or carried by a creature within 5 feet of itself. Dexterity Saving Throw: DC 11, the creature with the object. Failure: The object takes a -1 penalty to the AC it offers (armor) or to its attack rolls (weapon). Armor is destroyed if the penalty reduces its AC to 10, and a weapon is destroyed if its penalty reaches -5. The penalty can be removed by casting the Mending spell on the armor or weapon.","Destroy Metal. The rust monster touches a nonmagical metal object within 5 feet of itself that isn't being worn or carried. The touch destroys a 1-foot Cube of the object."]],["Reações",["Reflexive Antennae. Trigger: An attack roll hits the rust monster. Response: The rust monster uses Antennae."]]]},"Sahuagin Warrior":{"tipo":"Médio Ínfero, Leal e Mau","ca":"12","pv":"22 (4d8+4)","desl":"9 m, natação 12 m","ini":"+0 (10)","atr":[13,11,12,12,13,9],"info":[["Perícias","Percepção +5"],["Resistências","Ácido, Frio"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 15"],["Idiomas","Sahuagin"]],"cr":"1/2","secoes":[["Traços",["Blood Frenzy. The sahuagin has Advantage on attack rolls against any creature that doesn't have all its Hit Points.","Limited Amphibiousness. The sahuagin can breathe air and water, but it must be submerged at least once every 4 hours to avoid suffocating outside water.","Shark Telepathy. The sahuagin can magically control sharks within 120 feet of itself, using a special telepathy."]],["Ações",["Multiattack. The sahuagin makes two Claw attacks.","Claw. Melee Attack Roll: +3, reach 5 ft. Hit: 4 (1d6 + 1) Slashing damage."]],["Ações Bônus",["Aquatic Charge. The sahuagin swims up to its Swim Speed straight toward an enemy it can see."]]]},"Salamander":{"tipo":"Grande Elemental, Neutro e Mau","ca":"15","pv":"90 (12d10+24)","desl":"9 m, escalada 9 m","ini":"+2 (12)","atr":[18,14,15,11,10,12],"info":[["Vulnerabilidades","Frio"],["Imunidades","Fogo"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Primordial (Ignan)"]],"cr":"5","secoes":[["Traços",["Fire Aura. At the end of each of the salamander's turns, each creature of the salamander's choice in a 5-foot Emanation originating from the salamander takes 7 (2d6) Fire damage."]],["Ações",["Multiattack. The salamander makes two Flame Spear attacks. It can replace one attack with a use of Constrict.","Flame Spear. Melee or Ranged Attack Roll: +7, reach 5 ft. or range 20/60 ft. Hit: 13 (2d8 + 4) Piercing damage plus 7 (2d6) Fire damage. Hit or Miss: The spear magically returns to the salamander's hand immediately after a ranged attack.","Constrict. Strength Saving Throw: DC 15, one Large or smaller creature the salamander can see within 10 feet. Failure: 11 (2d6 + 4) Bludgeoning damage plus 7 (2d6) Fire damage. The target has the Grappled condition (escape DC 14), and it has the Restrained condition until the grapple ends."]]]},"Satyr":{"tipo":"Médio Fada, Caótico e Neutro","ca":"13","pv":"31 (7d8)","desl":"12 m","ini":"+3 (13)","atr":[12,16,11,12,10,14],"info":[["Perícias","Percepção +2, Atuação +6, Furtividade +5"],["Sentidos","Percepção passiva 12"],["Idiomas","Comum, Élfico, Silvestre"]],"cr":"1/2","secoes":[["Traços",["Magic Resistance. The satyr has Advantage on saving throws against spells and other magical effects."]],["Ações",["Hooves. Melee Attack Roll: +5, reach 5 ft. Hit: 5 (1d4 + 3) Bludgeoning damage. If the target is a Medium or smaller creature, the satyr pushes the target up to 10 feet straight away from itself.","Mockery. Wisdom Saving Throw: DC 12, one creature the satyr can see within 90 feet. Failure: 5 (1d6 + 2) Psychic damage."]]]},"Scout":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"13","pv":"16 (3d8+3)","desl":"9 m","ini":"+2 (12)","atr":[11,14,12,11,13,11],"info":[["Perícias","Natureza +4, Percepção +5, Furtividade +6, Sobrevivência +5"],["Equipamento","Leather Armor, Longbow, Shortsword"],["Sentidos","Percepção passiva 15"],["Idiomas","Comum mais one other language"]],"cr":"1/2","secoes":[["Ações",["Multiattack. The scout makes two attacks, using Shortsword and Longbow in any combination.","Shortsword. Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Piercing damage.","Longbow. Ranged Attack Roll: +4, range 150/600 ft. Hit: 6 (1d8 + 2) Piercing damage."]]]},"Sea Hag":{"tipo":"Médio Fada, Caótico e Mau","ca":"14","pv":"52 (7d8+21)","desl":"9 m, natação 12 m","ini":"+1 (11)","atr":[16,13,16,12,12,13],"info":[["Sentidos","Visão no Escuro 18 m; Percepção passiva 11"],["Idiomas","Comum, Gigante, Primordial (Aquan)"]],"cr":"2","secoes":[["Traços",["Amphibious. The hag can breathe air and water.","Coven Magic. While within 30 feet of at least two hag allies, the hag can cast one of the following spells, requiring no Material components, using the spell's normal casting time, and using Intelligence as the spellcasting ability (spell save DC 11): Augury, Find Familiar, Identify, Locate Object, Scrying, or Unseen Servant. The hag must finish a Long Rest before using this trait to cast that spell again.","Vile Appearance. Wisdom Saving Throw: DC 11, any Beast or Humanoid that starts its turn within 30 feet of the hag and can see the hag's true form. Failure: The target has the Frightened condition until the start of its next turn. Success: The target is immune to this hag's Vile Appearance for 24 hours."]],["Ações",["Claw. Melee Attack Roll: +5, reach 5 ft. Hit: 10 (2d6 + 3) Slashing damage.","Death Glare (Recharge 5-6). Wisdom Saving Throw: DC 11, one Frightened creature the hag can see within 30 feet. Failure: If the target has 20 Hit Points or fewer, it drops to 0 Hit Points. Otherwise, the target takes 13 (3d8) Psychic damage.","Illusory Appearance. The hag casts Disguise Self, using Constitution as the spellcasting ability (spell save DC 13). The spell's duration is 24 hours."]]]},"Shadow":{"tipo":"Médio Morto-Vivo, Caótico e Mau","ca":"12","pv":"27 (5d8+5)","desl":"12 m","ini":"+2 (12)","atr":[6,14,13,6,10,8],"info":[["Perícias","Furtividade +6"],["Vulnerabilidades","Radiante"],["Resistências","Ácido, Frio, Fogo, Elétrico, Trovejante"],["Imunidades","Necrótico, Venenoso; Exaustão, Amedrontado, Agarrado, Paralisado, Petrificado, Envenenado, Caído, Impedido, Inconsciente"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Nenhum"]],"cr":"1/2","secoes":[["Traços",["Amorphous. The shadow can move through a space as narrow as 1 inch without expending extra movement to do so.","Sunlight Weakness. While in sunlight, the shadow has Disadvantage on D20 Tests."]],["Ações",["Draining Swipe. Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Necrotic damage, and the target's Strength score decreases by 1d4. The target dies if this reduces that score to 0. If a Humanoid is slain by this attack, a Shadow rises from the corpse 1d4 hours later."]],["Ações Bônus",["Shadow Stealth. While in Dim Light or Darkness, the shadow takes the Hide action."]]]},"Shambling Mound":{"tipo":"Grande Planta, Sem Tendência","ca":"15","pv":"110 (13d10+39)","desl":"9 m, natação 6 m","ini":"-1 (9)","atr":[18,8,16,5,10,5],"info":[["Perícias","Furtividade +3"],["Resistências","Frio, Fogo"],["Imunidades","Elétrico; Surdo, Exaustão"],["Sentidos","Percepção às Cegas 18 m; Percepção passiva 10"],["Idiomas","Nenhum"]],"cr":"5","secoes":[["Traços",["Lightning Absorption. Whenever the shambling mound is subjected to Lightning damage, it regains a number of Hit Points equal to the Lightning damage dealt."]],["Ações",["Multiattack. The shambling mound makes three Charged Tendril attacks. It can replace one attack with a use of Engulf.","Charged Tendril. Melee Attack Roll: +7, reach 10 ft. Hit: 7 (1d6 + 4) Bludgeoning damage plus 5 (2d4) Lightning damage. If the target is a Medium or smaller creature, the shambling mound pulls the target 5 feet straight toward itself.","Engulf. Strength Saving Throw: DC 15, one Medium or smaller creature within 5 feet. Failure: The target is pulled into the shambling mound's space and has the Grappled condition (escape DC 14). Until the grapple ends, the target has the Blinded and Restrained conditions, and it takes 10 (3d6) Lightning damage at the start of each of its turns. When the shambling mound moves, the Grappled target moves with it, costing it no extra movement. The shambling mound can have only one creature Grappled by this action at a time."]]]},"Shield Guardian":{"tipo":"Grande Constructo, Sem Tendência","ca":"17","pv":"142 (15d10+60)","desl":"9 m","ini":"-1 (9)","atr":[18,8,18,7,10,3],"info":[["Imunidades","Venenoso; Enfeitiçado, Exaustão, Amedrontado, Paralisado, Petrificado, Envenenado"],["Sentidos","Percepção às Cegas 3 m, Visão no Escuro 18 m; Percep
