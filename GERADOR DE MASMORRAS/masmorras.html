o, Venenoso, Psíquico"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 15"],["Idiomas","Abissal, Comum, Infernal; telepatia 18 m"]],"cr":"4","secoes":[["Traços",["Incubus Form. When the succubus finishes a Long Rest, it can shape-shift into an Incubus, using that stat block instead of this one."]],["Ações",["Multiattack. The succubus makes one Fiendish Touch attack and uses Charm or Draining Kiss.","Fiendish Touch. Melee Attack Roll: +7, reach 5 ft. Hit: 16 (2d10 + 5) Psychic damage.","Charm. The succubus casts Dominate Person (level 8 version), requiring no spell components and using Charisma as the spellcasting ability (spell save DC 15).","Draining Kiss. Constitution Saving Throw: DC 15, one creature Charmed by the succubus within 5 feet. Failure: 13 (3d8) Psychic damage. Success: Half damage. Failure or Success: The target's Hit Point maximum decreases by an amount equal to the damage taken."]],["Ações Bônus",["Shape-Shift. The succubus shape-shifts into a Medium or Small Humanoid, or it returns to its true form. Its game statistics are the same in each form, except its Fly Speed is available only in its true form. Any equipment it is wearing or carrying isn't transformed."]]]},"Tarrasque":{"tipo":"Imenso Monstruosidade (Titã), Sem Tendência","ca":"25","pv":"697 (34d20+340)","desl":"18 m, escavação 12 m, escalada 18 m","ini":"+18 (28)","atr":[30,11,30,3,11,11],"info":[["Salvaguardas","Des +9, Int +5, Sab +9, Car +9"],["Perícias","Percepção +9"],["Resistências","Contundente, Perfurante, Cortante"],["Imunidades","Fogo, Venenoso; Enfeitiçado, Surdo, Amedrontado, Paralisado, Envenenado"],["Sentidos","Percepção às Cegas 36 m; Percepção passiva 19"],["Idiomas","Nenhum"]],"cr":"30","secoes":[["Traços",["Legendary Resistance (6/Day). If the tarrasque fails a saving throw, it can choose to succeed instead.","Magic Resistance. The tarrasque has Advantage on saving throws against spells and other magical effects.","Reflective Carapace. If the tarrasque is targeted by a Magic Missile spell or a spell that requires a ranged attack roll, roll 1d6. On a 1-5, the tarrasque is unaffected. On a 6, the tarrasque is unaffected and reflects the spell, turning the caster into the target.","Siege Monster. The tarrasque deals double damage to objects and structures."]],["Ações",["Multiattack. The tarrasque makes one Bite attack and three other attacks, using Claw or Tail in any combination.","Bite. Melee Attack Roll: +19, reach 15 ft. Hit: 36 (4d12 + 10) Piercing damage, and the target has the Grappled System Reference Document 5.2.1 condition (escape DC 20). Until the grapple ends, the target has the Restrained condition and can't teleport.","Claw. Melee Attack Roll: +19, reach 15 ft. Hit: 28 (4d8 + 10) Slashing damage.","Tail. Melee Attack Roll: +19, reach 30 ft. Hit: 23 (3d8 + 10) Bludgeoning damage. If the target is a Huge or smaller creature, it has the Prone condition.","Thunderous Bellow (Recharge 5-6). Constitution Saving Throw: DC 27, each creature and each object that isn't being worn or carried in a 150-foot Cone. Failure: 78 (12d12) Thunder damage, and the target has the Deafened and Frightened conditions until the end of its next turn. Success: Half damage only."]],["Ações Bônus",["Swallow. Strength Saving Throw: DC 27, one Large or smaller creature Grappled by the tarrasque (it can have up to six creatures swallowed at a time). Failure: The target is swallowed, and the Grappled condition ends. A swallowed creature has the Blinded and Restrained conditions and can't teleport, it has Total Cover against attacks and other effects outside the tarrasque, and it takes 56 (16d6) Acid damage at the start of each of the tarrasque's turns. If the tarrasque takes 60 damage or more on a single turn from a creature inside it, the tarrasque must succeed on a DC 20 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, each of which falls in a space within 10 feet of the tarrasque and has the Prone condition. If the tarrasque dies, any swallowed creature no longer has the Restrained condition and can escape from the corpse using 20 feet of movement, exiting Prone."]],["Ações Lendárias",["Legendary Action Uses: 3. Immediately after another creature's turn, the tarrasque can expend a use to take one of the following actions. The tarrasque regains all expended uses at the start of each of its turns.","Onslaught. The tarrasque moves up to half its Speed, and it makes one Claw or Tail attack.","World-Shaking Movement. The tarrasque moves up to its Speed. At the end of this movement, the tarrasque creates an instantaneous shock wave in a 60-foot Emanation originating from itself. Creatures in that area lose Concentration and, if Medium or smaller, have the Prone condition. The tarrasque can't take this action again until the start of its next turn."]]]},"Tough":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"12","pv":"32 (5d8+10)","desl":"9 m","ini":"+1 (11)","atr":[15,12,14,10,10,11],"info":[["Equipamento","Heavy Crossbow, Leather Armor, Mace"],["Sentidos","Percepção passiva 10"],["Idiomas","Comum"]],"cr":"1/2","secoes":[["Traços",["Pack Tactics. The tough has Advantage on an attack roll against a creature if at least one of the tough's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."]],["Ações",["Mace. Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Bludgeoning damage.","Heavy Crossbow. Ranged Attack Roll: +3, range 100/400 ft. Hit: 6 (1d10 + 1) Piercing damage."]]]},"Tough Boss":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"16","pv":"82 (11d8+33)","desl":"9 m","ini":"+2 (12)","atr":[17,14,16,11,10,11],"info":[["Salvaguardas","For +5, Con +5, Car +2"],["Equipamento","Chain Mail, Heavy Crossbow, Warhammer"],["Sentidos","Percepção passiva 10"],["Idiomas","Comum mais one other language"]],"cr":"4","secoes":[["Traços",["Pack Tactics. The tough has Advantage on an attack roll against a creature if at least one of the tough's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."]],["Ações",["Multiattack. The tough makes two attacks, using Warhammer or Heavy Crossbow in any combination.","Warhammer. Melee Attack Roll: +5, reach 5 ft. Hit: 12 (2d8 + 3) Bludgeoning damage. If the target is a Large or smaller creature, the tough pushes the target up to 10 feet straight away from itself.","Heavy Crossbow. Ranged Attack Roll: +4, range 100/400 ft. Hit: 13 (2d10 + 2) Piercing damage."]]]},"Treant":{"tipo":"Enorme Planta, Caótico e Bom","ca":"16","pv":"138 (12d12+60)","desl":"9 m","ini":"+3 (13)","atr":[23,8,21,12,16,12],"info":[["Vulnerabilidades","Fogo"],["Resistências","Contundente, Perfurante"],["Sentidos","Percepção passiva 13"],["Idiomas","Comum, Druídico, Élfico, Silvestre"]],"cr":"9","secoes":[["Traços",["Siege Monster. The treant deals double damage to objects and structures."]],["Ações",["Multiattack. The treant makes two Slam attacks.","Slam. Melee Attack Roll: +10, reach 5 ft. Hit: 16 (3d6 + 6) Bludgeoning damage.","Hail of Bark. Ranged Attack Roll: +10, range 180 ft. Hit: 28 (4d10 + 6) Piercing damage.","Animate Trees (1/Day). The treant magically animates up to two trees it can see within 60 feet of itself. Each tree uses the Treant stat block, except it has Intelligence and Charisma scores of 1, it can't speak, and it lacks this action. The tree takes its turn immediately after the treant on the same Initiative count, and it obeys the treant. A tree remains animate for 1 day or until it dies, the treant dies, or it is more than 120 feet from the treant. The tree then takes root if possible."]]]},"Troll":{"tipo":"Grande Gigante, Caótico e Mau","ca":"15","pv":"94 (9d10+45)","desl":"9 m","ini":"+1 (11)","atr":[18,13,20,7,9,7],"info":[["Perícias","Percepção +5"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 15"],["Idiomas","Gigante"]],"cr":"5","secoes":[["Traços",["Loathsome Limbs (4/Day). If the troll ends any turn Bloodied and took 15+ Slashing damage during that turn, one of the troll's limbs is severed, falls into the troll's space, and becomes a Troll Limb. The limb acts immediately after the troll's turn. The troll has 1 Exhaustion level for each missing limb, and it grows replacement limbs the next time it regains Hit Points.","Regeneration. The troll regains 15 Hit Points at the start of each of its turns. If the troll takes Acid or Fire damage, this trait doesn't function on the troll's next turn. The troll dies only if it starts its turn with 0 Hit Points and doesn't regenerate."]],["Ações",["Multiattack. The troll makes three Rend attacks.","Rend. Melee Attack Roll: +7, reach 10 ft. Hit: 11 (2d6 + 4) Slashing damage."]],["Ações Bônus",["Charge. The troll moves up to half its Speed straight toward an enemy it can see."]]]},"Troll Limb":{"tipo":"Pequeno Gigante, Caótico e Mau","ca":"13","pv":"14 (4d6)","desl":"6 m","ini":"+1 (11)","atr":[18,12,10,1,9,1],"info":[["Sentidos","Visão no Escuro 18 m; Percepção passiva 9"],["Idiomas","Nenhum"]],"cr":"1/2","secoes":[["Traços",["Regeneration. The limb regains 5 Hit Points at the start of each of its turns. If the limb takes Acid or Fire damage, this trait doesn't function on the limb's next turn. The limb dies only if it starts its turn with 0 Hit Points and doesn't regenerate.","Troll Spawn. The limb uncannily has the same senses as a whole troll. If the limb isn't destroyed within 24 hours, roll 1d12. On a 12, the limb turns into a Troll. Otherwise, the limb withers away."]],["Ações",["Rend. Melee Attack Roll: +6, reach 5 ft. Hit: 9 (2d4 + 4) Slashing damage."]]]},"Unicorn":{"tipo":"Grande Celestial, Leal e Bom","ca":"12","pv":"97 (13d10+26)","desl":"15 m","ini":"+8 (18)","atr":[18,14,15,11,17,16],"info":[["Imunidades","Venenoso; Enfeitiçado, Paralisado, Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 13"],["Idiomas","Celestial, Élfico, Silvestre; telepatia 36 m"]],"cr":"5","secoes":[["Traços",["Legendary Resistance (3/Day). If the unicorn fails a saving throw, it can choose to succeed instead.","Magic Resistance. The unicorn has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The unicorn makes one Hooves attack and one Radiant Horn attack.","Hooves. Melee Attack Roll: +7, reach 5 ft. Hit: 11 (2d6 + 4) Bludgeoning damage.","Radiant Horn. Melee Attack Roll: +7, reach 5 ft. Hit: 9 (1d10 + 4) Radiant damage.","Spellcasting. The unicorn casts one of the following spells, requiring no spell components and using Charisma as the spellcasting ability (spell save DC 14): At Will: Detect Evil and Good, Druidcraft 1/Day Each: Calm Emotions, Dispel Evil and Good, Entangle, Pass without Trace, Word of Recall"]],["Ações Bônus",["Unicorn's Blessing (3/Day). The unicorn touches another creature with its horn and casts Cure Wounds or Lesser Restoration on that creature, using the same spellcasting ability as Spellcasting."]],["Ações Lendárias",["Legendary Action Uses: 3. Immediately after another creature's turn, the unicorn can expend a use to take one of the following actions. The unicorn regains all expended uses at the start of each of its turns.","Charging Horn. The unicorn moves up to half its Speed without provoking Opportunity Attacks, and it makes one Radiant Horn attack.","Shimmering Shield. The unicorn targets itself or one creature it can see within 60 feet of itself. The target gains 10 (3d6) Temporary Hit Points, and its AC increases by 2 until the end of the unicorn's next turn. The unicorn can't take this action again until the start of its next turn."]]]},"Vampire Familiar":{"tipo":"Médio ou Pequeno Humanoide, Neutro e Mau","ca":"15","pv":"65 (10d8+20)","desl":"9 m, escalada 9 m","ini":"+5 (15)","atr":[17,16,15,10,10,14],"info":[["Salvaguardas","Des +5, Sab +2"],["Perícias","Percepção +4, Persuasão +4, Furtividade +7"],["Resistências","Necrótico"],["Imunidades","Enfeitiçado (except from its vampire master)"],["Equipamento","Daggers (10)"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Comum mais one other language"]],"cr":"3","secoes":[["Traços",["Vampiric Connection. While the familiar and its vampire master are on the same plane of existence, the vampire can communicate with the familiar telepathically, and the vampire can perceive through the familiar's senses."]],["Ações",["Multiattack. The familiar makes two Umbral Dagger attacks.","Umbral Dagger. Melee or Ranged Attack Roll: +5, reach 5 ft. or range 20/60 ft. Hit: 5 (1d4 + 3) Piercing damage plus 7 (3d4) Necrotic damage. If the target is reduced to 0 Hit Points by this attack, the target becomes Stable but has the Poisoned condition for 1 hour. While it has the Poisoned condition, the target has the Paralyzed condition."]],["Ações Bônus",["Deathless Agility. The familiar takes the Dash or Disengage action."]]]},"Vampire Spawn":{"tipo":"Médio ou Pequeno Morto-Vivo, Neutro e Mau","ca":"16","pv":"90 (12d8+36)","desl":"9 m","ini":"+3 (13)","atr":[16,16,16,11,10,12],"info":[["Salvaguardas","Des +6, Sab +3"],["Perícias","Percepção +3, Furtividade +6"],["Resistências","Necrótico"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 13"],["Idiomas","Comum mais one other language"]],"cr":"5","secoes":[["Traços",["Spider Climb. The vampire can climb difficult surfaces, including along ceilings, without needing to make an ability check.","Vampire Weakness. The vampire has these weaknesses:","Forbiddance. The vampire can't enter a residence without an invitation from an occupant.","Running Water. The vampire takes 20 Acid damage if it ends its turn in running water.","Stake to the Heart. The vampire is destroyed if a weapon that deals Piercing damage is driven into the vampire's heart while the vampire has the Incapacitated condition.","Sunlight. The vampire takes 20 Radiant damage if it starts its turn in sunlight. While in sunlight, it has Disadvantage on attack rolls and ability checks."]],["Ações",["Multiattack. The vampire makes two Claw attacks and uses Bite.","Claw. Melee Attack Roll: +6, reach 5 ft. Hit: 8 (2d4 + 3) Slashing damage. If the target is a Medium or smaller creature, it has the Grappled condition (escape DC 13) from one of two claws.","Bite. Constitution Saving Throw: DC 14, one creature within 5 feet that is willing or that has the Grappled, Incapacitated, or Restrained condition. Failure: 5 (1d4 + 3) Piercing damage plus 10 (3d6) Necrotic damage. The target's Hit Point maximum decreases by an amount equal to the Necrotic damage taken, and the vampire regains Hit Points equal to that amount."]],["Ações Bônus",["Deathless Agility. The vampire takes the Dash or Disengage action."]]]},"Vampire":{"tipo":"Médio ou Pequeno Morto-Vivo, Leal e Mau","ca":"16","pv":"195 (23d8+92)","desl":"12 m, escalada 12 m","ini":"+14 (24)","atr":[18,18,18,17,15,18],"info":[["Salvaguardas","Des +9, Con +9, Sab +7, Car +9"],["Perícias","Percepção +7, Furtividade +9"],["Resistências","Necrótico"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 17"],["Idiomas","Comum mais two other languages"]],"cr":"13","secoes":[["Traços",["Legendary Resistance (3/Day, or 4/Day in Lair). If the vampire fails a saving throw, it can choose to succeed instead.","Misty Escape. If the vampire drops to 0 Hit Points outside its resting place, the vampire uses Shape-Shift to become mist (no action required). If it can't use ShapeShift, it is destroyed. While it has 0 Hit Points in mist form, it can't return to its vampire form, and it must reach its resting place within 2 hours or be destroyed. Once in its resting place, it returns to its vampire form and has the Paralyzed condition until it regains any Hit Points, and it regains 1 Hit Point after spending 1 hour there.","Spider Climb. The vampire can climb difficult surfaces, including along ceilings, without needing to make an ability check.","Vampire Weakness. The vampire has these weaknesses:","Forbiddance. The vampire can't enter a residence without an invitation from an occupant.","Running Water. The vampire takes 20 Acid damage if it ends its turn in running water.","Stake to the Heart. If a weapon that deals Piercing damage is driven into the vampire's heart while the vampire has the Incapacitated condition in its resting place, the vampire has the Paralyzed condition until the weapon is removed.","Sunlight. The vampire takes 20 Radiant damage if it starts its turn in sunlight. While in sunlight, it has Disadvantage on attack rolls and ability checks."]],["Ações",["Multiattack (Vampire Form Only). The vampire makes two Grave Strike attacks and uses Bite.","Grave Strike (Vampire Form Only). Melee Attack Roll: +9, reach 5 ft. Hit: 8 (1d8 + 4) Bludgeoning damage plus 7 (2d6) Necrotic damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14) from one of two hands.","Bite (Bat or Vampire Form Only). Constitution Saving Throw: DC 17, one creature within 5 feet that is willing or that has the Grappled, Incapacitated, or Restrained condition. Failure: 6 (1d4 + 4) Piercing damage plus 13 (3d8) Necrotic damage. The target's Hit Point maximum decreases by an amount equal to the Necrotic damage taken, and the vampire regains Hit Points equal to that amount. A Humanoid reduced to 0 Hit Points by this damage and then buried rises the following sunset as a Vampire Spawn under the vampire's control."]],["Ações Bônus",["Charm (Recharge 5-6). The vampire casts Charm Person, requiring no spell components and using Charisma as the spellcasting ability (spell save DC 17), and the duration is 24 hours. The Charmed target is a willing recipient of the vampire's Bite, the damage of which doesn't end the spell. When the spell ends, the target is unaware it was Charmed by the vampire.","Shape-Shift. If the vampire isn't in sunlight or running water, it shape-shifts into a Tiny bat (Speed 5 ft., Fly Speed 30 ft.) or a Medium cloud of mist (Speed 5 ft., Fly Speed 20 ft. [hover]), or it returns to its vampire form. Anything it is wearing transforms with it. While in bat form, the vampire can't speak. Its game statistics, other than its size and Speed, are unchanged. While in mist form, the vampire can't take any actions, speak, or manipulate objects. It is weightless and can enter an enemy's space and stop there. If air can pass through a space, the mist can do so, but it can't pass through liquid. It has Resistance to all damage, except the damage it takes from sunlight."]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the vampire can expend a use to take one of the following actions. The vampire regains all expended uses at the start of each of its turns.","Beguile. The vampire casts Command, requiring no spell components and using Charisma as the spellcasting ability (spell save DC 17). The vampire can't take this action again until the start of its next turn.","Deathless Strike. The vampire moves up to half its Speed, and it makes one Grave Strike attack."]]]},"Vrock":{"tipo":"Grande Ínfero (Demônio), Caótico e Mau","ca":"15","pv":"152 (16d10+64)","desl":"12 m, voo 18 m","ini":"+2 (12)","atr":[17,15,18,8,13,8],"info":[["Salvaguardas","Des +5, Sab +4, Car +2"],["Resistências","Frio, Fogo, Elétrico"],["Imunidades","Venenoso; Envenenado"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 11"],["Idiomas","Abissal; telepatia 36 m"]],"cr":"6","secoes":[["Traços",["Demonic Restoration. If the vrock dies outside the Abyss, its body dissolves into ichor, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Abyss.","Magic Resistance. The vrock has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The vrock makes two Shred attacks.","Shred. Melee Attack Roll: +6, reach 5 ft. Hit: 10 (2d6 + 3) Piercing damage plus 10 (3d6) Poison damage.","Spores (Recharge 6). Constitution Saving Throw: DC 15, each creature in a 20-foot Emanation origina /* "Espada Longa +1 · incomum" -> "Arma +1"; "Pergaminho de Magia (2º círculo)" -> "Pergaminho de Magia" */
function itemKey(txt){
  const nome = String(txt).split(' · ')[0].trim();
  if (ITEM_DESC[nome]) return nome;
  const m = nome.match(/^(.+) \+([123])$/);
  if (m){ if (ARMAS.includes(m[1])) return 'Arma +'+m[2]; if (ARMADURAS.includes(m[1])) return 'Armadura +'+m[2]; }
  if (nome.startsWith('Pergaminho de Magia')) return 'Pergaminho de Magia';
  return null;
}
const itemSlug = k => 'item-'+String(k).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const linkItem = txt => itemKey(txt) ? `<button class="rl" data-act="item" data-it="${h(txt)}">${h(txt)}</button>` : h(txt);
const RAR_TIER = {1:{comum:6,incomum:4},2:{incomum:6,rara:4},3:{rara:6,muitorara:4},4:{muitorara:6,lendaria:4}};

/* ================= gerador de mapa ================= */
const SIZES = {pequena:{w:40,h:30,n:[6,8],nome:'Pequena (6–8 salas)'}, media:{w:54,h:38,n:[10,13],nome:'Média (10–13 salas)'}, grande:{w:68,h:48,n:[15,19],nome:'Grande (15–19 salas)'}};
function genMap(rng, tamanho, tema){
  const Z = SIZES[tamanho]||SIZES.media, W=Z.w, H=Z.h, alvo=rng.int(Z.n[0],Z.n[1]);
  const g = new Uint8Array(W*H); let rooms=[];
  for(let a=0; a<900 && rooms.length<alvo; a++){
    const w=rng.int(4,9), hh=rng.int(4,8), x=rng.int(1,W-w-1), y=rng.int(1,H-hh-1);
    if (rooms.some(r => x<r.x+r.w+2 && x+w+2>r.x && y<r.y+r.h+2 && y+hh+2>r.y)) continue;
    rooms.push({x,y,w,h:hh});
  }
  const cen = r => [r.x+(r.w>>1), r.y+(r.h>>1)];
  const dist = (a,b) => { const [p,q]=cen(a),[s,t]=cen(b); return Math.hypot(p-s,q-t); };
  /* árvore mínima + alguns atalhos para criar ciclos */
  const edges=[], inT=[0], rest=rooms.map((_,i)=>i).slice(1);
  while(rest.length){ let best=null; for(const i of inT) for(const j of rest){ const d=dist(rooms[i],rooms[j]); if(!best||d<best[2]) best=[i,j,d]; } edges.push([best[0],best[1]]); inT.push(best[1]); rest.splice(rest.indexOf(best[1]),1); }
  const has = (i,j) => edges.some(e => (e[0]===i&&e[1]===j)||(e[0]===j&&e[1]===i));
  for(let k=0;k<Math.max(1,Math.round(rooms.length*.18));k++){
    const i=rng.int(0,rooms.length-1); const c=rooms.map((r,j)=>[j,dist(rooms[i],r)]).filter(([j])=>j!==i&&!has(i,j)).sort((a,b)=>a[1]-b[1]);
    if (c.length && c[0][1] < 22) edges.push([i,c[0][0]]);
  }
  /* entrada = sala mais perto da borda; numeração em ordem de exploração (busca em largura) */
  const adj = rooms.map(()=>[]); edges.forEach(([a,b])=>{ adj[a].push(b); adj[b].push(a); });
  let ent=0, bd=1e9; rooms.forEach((r,i)=>{ const d=Math.min(r.x, r.y, W-(r.x+r.w), H-(r.y+r.h)); if(d<bd){bd=d; ent=i;} });
  const order=[ent], depth={[ent]:0}; for(let q=0;q<order.length;q++){ const u=order[q]; for(const v of adj[u]) if(depth[v]===undefined){ depth[v]=depth[u]+1; order.push(v); } }
  const maxD = Math.max(...order.map(i=>depth[i]));
  const boss = order.filter(i=>depth[i]===maxD).sort((a,b)=>rooms[b].w*rooms[b].h-rooms[a].w*rooms[a].h)[0];
  const ord = order.filter(i=>i!==boss).concat([boss]);
  const remap = {}; ord.forEach((old,nw)=>remap[old]=nw);
  rooms = ord.map(i=>rooms[i]);
  const conex = edges.map(([a,b])=>({a:remap[a], b:remap[b]}));
  rooms.forEach(r=>{ for(let j=r.y;j<r.y+r.h;j++) for(let i=r.x;i<r.x+r.w;i++) g[j*W+i]=1; });
  const roomAt = (x,y) => rooms.findIndex(r => x>=r.x && x<r.x+r.w && y>=r.y && y<r.y+r.h);
  const doors = new Map();
  for(const {a,b} of conex){
    const [x0,y0]=cen(rooms[a]), [x1,y1]=cen(rooms[b]); const path=[[x0,y0]]; let x=x0, y=y0;
    const sx=()=>{ while(x!==x1){ x+=Math.sign(x1-x); path.push([x,y]); } }, sy=()=>{ while(y!==y1){ y+=Math.sign(y1-y); path.push([x,y]); } };
    if (rng.chance(.5)){ sx(); sy(); } else { sy(); sx(); }
    let prev = roomAt(x0,y0);
    for(let k=1;k<path.length;k++){
      const [px,py]=path[k], ri=roomAt(px,py);
      if (ri<0 && g[py*W+px]===0) g[py*W+px]=2;
      if (prev>=0 && ri<0) doors.set(px+','+py,{x:px,y:py});
      if (prev<0 && ri>=0){ const [qx,qy]=path[k-1]; doors.set(qx+','+qy,{x:qx,y:qy}); }
      prev=ri;
    }
  }
  const at = (i,j) => (i<0||j<0||i>=W||j>=H) ? 0 : g[j*W+i];
  /* porta só onde a passagem tem exatamente dois lados abertos e opostos */
  const dl = [];
  for (const d of doors.values()){
    const L=!!at(d.x-1,d.y), R=!!at(d.x+1,d.y), U=!!at(d.x,d.y-1), D=!!at(d.x,d.y+1);
    if ((L&&R&&!U&&!D) || (U&&D&&!L&&!R)) dl.push({x:d.x, y:d.y, o:(L&&R)?'h':'v', t:rng.weighted({normal:70,trancada:14,secreta:8,emperrada:8})});
  }
  if (tema==='caverna'){
    /* bordas irregulares nas grutas */
    const keep = new Set(); dl.forEach(d=>{ for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) keep.add((d.x+dx)+','+(d.y+dy)); });
    rooms.forEach(r=>{
      for(let j=r.y;j<r.y+r.h;j++) for(let i=r.x;i<r.x+r.w;i++){
        const edge = i===r.x||j===r.y||i===r.x+r.w-1||j===r.y+r.h-1, corner=(i===r.x||i===r.x+r.w-1)&&(j===r.y||j===r.y+r.h-1);
        if (!edge || keep.has(i+','+j)) continue;
        const nearCorr = [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>at(i+dx,j+dy)===2);
        if (!nearCorr && (corner || rng.chance(.35))) g[j*W+i]=0;
      }
      for(let j=r.y-1;j<=r.y+r.h;j++) for(let i=r.x-1;i<=r.x+r.w;i++){
        if (i<1||j<1||i>=W-1||j>=H-1) continue;
        const out = i<r.x||j<r.y||i>=r.x+r.w||j>=r.y+r.h, corner=(i<r.x||i>=r.x+r.w)&&(j<r.y||j>=r.y+r.h);
        if (out && !corner && g[j*W+i]===0 && rng.chance(.18)) g[j*W+i]=1;
      }
    });
  }
  return {w:W, h:H, grid:Array.from(g).join(''), doors:dl, rooms, conex};
}

/* ================= gerador de conteúdo ================= */
const MON_DG = MON.filter(m=>m.tags!=='x'); /* reserva quando o tema não tem opções: só criaturas de masmorra */
function poolFor(tema){ const t=TEMAS[tema].tag; return MON.filter(m=>m.tags.includes(t)); }
function buildEncounter(rng, p, dif, chefe){
  const per = BUD[p.nivel][dif]; let alvo = per*p.jogadores; if (chefe && p.ritmo==='pesado') alvo=Math.round(alvo*1.25);
  const pool = poolFor(p.tema);
  const fits = (list,lo,hi) => list.filter(m=>m.xp<=hi && m.xp>=lo);
  let cand = fits(pool, alvo/(chefe?4:10), alvo*(chefe?.85:1)); if (cand.length<2) cand = fits(MON_DG, alvo/(chefe?4:10), alvo*(chefe?.85:1));
  if (!cand.length) cand = [MON_DG.filter(m=>m.xp<=alvo).sort((a,b)=>b.xp-a.xp)[0] || MON[0]];
  let prim, n;
  if (chefe){ const sorted=[...cand].sort((a,b)=>b.xp-a.xp); prim = rng.pick(sorted.slice(0,Math.max(1,Math.ceil(sorted.length/3)))); n=1; }
  else { prim = rng.pick(cand); const maxN=Math.max(1,Math.min(8,Math.floor(alvo/prim.xp))); n=Math.max(1,Math.round(maxN*(.6+.4*rng.f()))); }
  const grupos=[{pt:prim.pt,en:prim.en,cr:prim.cr,xp:prim.xp,qtd:n}];
  let resto = alvo - n*prim.xp;
  if (resto >= alvo*.2){
    let c2 = pool.filter(m=>m.xp<=resto && m.pt!==prim.pt && m.xp>=resto/6); if(!c2.length) c2 = MON_DG.filter(m=>m.xp<=resto && m.pt!==prim.pt && m.xp>=resto/6);
    if (c2.length){ const s=rng.pick(c2); const k=Math.max(1,Math.min(6,Math.floor(resto/s.xp))); grupos.push({pt:s.pt,en:s.en,cr:s.cr,xp:s.xp,qtd:k}); }
  }
  const xp = grupos.reduce((t,gp)=>t+gp.xp*gp.qtd,0);
  return {dif, orcamento:alvo, xp, grupos, comport:''};
}
const fill = (txt, ctx) => txt.replace(/\{(\w+)\}/g,(m,k)=>ctx[k]!==undefined?ctx[k]:m).replace(/\bde o /g,'do ').replace(/\bde a /g,'da ').replace(/^(o|a) /,c=>c.toUpperCase());
/* sorteia um item mágico que ainda não está na masmorra (usados = Set de nomes sem raridade).
   Se a raridade esgotou, tenta as outras do mesmo tier e depois as menores; sem opção, devolve null. */
const RAR_ORDEM = ['comum','incomum','rara','muitorara','lendaria'];
const itemNome = txt => String(txt).split(' · ')[0].trim();
function pickItem(rng, rar, usados, t){
  usados = usados || new Set();
  const ordem = [rar, ...(t ? Object.keys(RAR_TIER[t]).filter(r=>r!==rar) : []), ...RAR_ORDEM.slice(0, RAR_ORDEM.indexOf(rar)).reverse()];
  for (const r of [...new Set(ordem)]){
    const livres = [];
    for (const tpl of ITENS[r]){
      const vs = tpl.includes('{arma}') ? ARMAS.map(a=>tpl.replace('{arma}',a)) : tpl.includes('{armadura}') ? ARMADURAS.map(a=>tpl.replace('{armadura}',a)) : [tpl];
      const ok = vs.filter(v=>!usados.has(v)); if (ok.length) livres.push(ok);
    }
    if (livres.length){ const nome = rng.pick(rng.pick(livres)); usados.add(nome); return nome+' · '+RAR_NOME[r]; }
  }
  return null;
}
function usadosNa(d, excetoI){
  const u = new Set();
  (d.salas||[]).forEach((s,j)=>{ if (j!==excetoI && s && s.tesouro) s.tesouro.itens.forEach(it=>u.add(itemNome(it))); });
  return u;
}
function gem(rng, v){ return rng.pick(GEMAS[v])+' ('+fmt(v)+' PO)'; }
function individual(rng,t){ return t===1?rng.roll(3,6)+' PO' : t===2?fmt(rng.roll(2,8)*10)+' PO' : t===3?fmt(rng.roll(2,10)*10)+' PL' : fmt(rng.roll(2,8)*100)+' PL'; }
function pouco(rng,t){ return individual(rng,t); }
function genTesouro(rng, t, tipo, qtd, usados){
  const Q = ITEM_QTD[qtd] || ITEM_QTD.normal; usados = usados || new Set();
  const itens=[], mag=[]; let moedas;
  const add = rar => { const it = pickItem(rng, rar, usados, t); if (it) mag.push(it); };
  const baixa = Object.keys(RAR_TIER[t])[0];
  if (tipo==='chefe'){
    moedas = t===1 ? fmt(rng.roll(2,4)*100)+' PO' : t===2 ? fmt(rng.roll(2,6)*100)+' PO e '+fmt(rng.roll(3,6)*10)+' PL' : t===3 ? fmt(rng.roll(4,6)*1000)+' PO e '+fmt(rng.roll(5,6)*100)+' PL' : fmt(rng.roll(12,6)*1000)+' PO e '+fmt(rng.roll(8,6)*1000)+' PL';
    const gv = {1:[10,50],2:[50,100],3:[100,500,1000],4:[1000,5000]}[t]; const ng=rng.int(1,3)+t-1;
    for(let i=0;i<ng;i++) itens.push(gem(rng, rng.pick(gv)));
    const av = {1:25,2:250,3:750,4:2500}[t]; if (rng.chance(.6)) itens.push(rng.pick(ARTE[av])+' ('+fmt(av)+' PO)');
    const [lo,hi] = Q.chefe[t<=2?0:1], nm = rng.int(lo,hi);
    for(let i=0;i<nm;i++) add(rng.weighted(RAR_TIER[t]));
  } else if (tipo==='tesouro'){
    moedas = individual(rng,t)+' + '+individual(rng,t)+' + '+individual(rng,t);
    itens.push(gem(rng, {1:10,2:50,3:100,4:1000}[t]));
    for(let i=0;i<Q.tes[0];i++) add(i===0 ? baixa : rng.weighted(RAR_TIER[t]));
    if (rng.chance(Q.tes[1])) add(Q.tes[0] ? rng.weighted(RAR_TIER[t]) : baixa);
  } else {
    moedas = individual(rng,t);
    if (rng.chance(Q.ind)) add(baixa);
  }
  return {moedas, itens:[...itens, ...mag]};
}
function genSala(rng, d, i, tipo, nomeUsado){
  const p=d.params, T=TEMAS[p.tema], t=tierOf(p.nivel), r=d.mapa.rooms[i], ns=d.mapa.rooms.length;
  const US = usadosNa(d, i);
  let k = rng.int(1,ns); if (k===i+1) k = (k % ns)+1;
  const ctx = {det:TDC.det[t-1], sv:TDC.sv[t-1], dano:TDC.dano[t-1], leve:TDC.leve[t-1], k, n:d.vilao, pouco:pouco(rng,t)};
  const s = {tipo, nome:'', desc:'', sentido:rng.pick(T.sentidos), encontro:null, armadilha:null, tesouro:null, misterio:'', descanso:'', pista:'', notas:''};
  const det = rng.shuffle(T.detalhes);
  if (tipo==='entrada'){ s.nome='Entrada'; s.desc = rng.pick(T.entrada)+' '+det[0]; }
  else if (tipo==='chefe'){ s.nome = fill(rng.pick(T.chefe), ctx); s.desc = det[0]+' '+det[1]; }
  else { s.nome = nomeUsado || rng.pick(T.salas); s.desc = det[0] + (rng.chance(.5)?' '+det[1]:''); }
  const ritmo = {leve:{0:6,1:3,2:1}, padrao:{0:4,1:4,2:2}, pesado:{0:2,1:4,2:4}}[p.ritmo] || {0:4,1:4,2:2};
  const enc = chefe => { const e = buildEncounter(rng, p, chefe?2:+rng.weighted(ritmo), chefe); e.comport = fill(chefe?'O chefe, {n}, lidera os defensores e luta até o fim, a menos que os personagens ofereçam algo que deseje mais do que a vitória.':rng.pick(COMPORT), ctx); return e; };
  if (tipo==='combate'){ s.encontro = enc(false); if (rng.chance(.5)) s.tesouro = genTesouro(rng,t,'individual',p.itens,US); }
  if (tipo==='chefe'){ s.encontro = enc(true); s.tesouro = genTesouro(rng,t,'chefe',p.itens,US); }
  if (tipo==='entrada' && rng.chance(.35)){ s.encontro = buildEncounter(rng,p,0,false); s.encontro.comport = 'Vigiam a entrada; um deles corre para dar o alarme na sala '+Math.min(2,ns)+'.'; }
  if (tipo==='armadilha'){ const a=rng.pick(ARMADILHAS); s.armadilha = {nome:a.nome, gatilho:a.gat, efeito:fill(a.ef,ctx), det:ctx.det}; if (rng.chance(.35)) s.tesouro = genTesouro(rng,t,'individual',p.itens,US); }
  if (tipo==='tesouro'){ s.tesouro = genTesouro(rng,t,'tesouro',p.itens,US); if (rng.chance(.4)){ const a=rng.pick(ARMADILHAS); s.armadilha={nome:a.nome, gatilho:'Mexer no tesouro', efeito:fill(a.ef,ctx), det:ctx.det}; } }
  if (tipo==='misterio') s.misterio = fill(rng.pick(MISTERIOS), ctx);
  if (tipo==='descanso') s.descanso = rng.pick(DESCANSOS);
  if (tipo==='vazia') s.pista = fill(rng.pick(PISTAS), ctx);
  return s;
}
function genErrantes(rng, d){
  const out=[]; for(let i=0;i<6;i++){ const e=buildEncounter(rng, d.params, 0, false); out.push(e.grupos.map(gp=>gp.qtd+'× '+gp.pt).join(' e ')+' ('+fmt(e.xp)+' XP)'); }
  return out;
}
function genDungeon(params){
  const p = {...params, nivel:Math.max(1,Math.min(20,+params.nivel||1)), jogadores:Math.max(1,Math.min(8,+params.jogadores||4))};
  const semente = (p.semente||'').trim() || randSeed();
  const rng = makeRng(semente+'|'+p.tema+'|'+p.tamanho+'|'+p.nivel+'|'+p.jogadores+'|'+p.ritmo);
  const T = TEMAS[p.tema];
  const vilao = rng.pick(T.nomes);
  const mapa = genMap(rng, p.tamanho, p.tema);
  const ns = mapa.rooms.length;
  const d = {id:null, nome:(p.nome||'').trim() || fill(rng.pick(T.titulos),{n:vilao}), vilao, gancho:fill(rng.pick(T.ganchos),{n:vilao}), semente,
    params:{tema:p.tema, tamanho:p.tamanho, nivel:p.nivel, jogadores:p.jogadores, ritmo:p.ritmo, itens:ITEM_QTD[p.itens]?p.itens:'normal'}, mapa, salas:[], errantes:[], publicada:false, criada:Date.now(), atualizada:Date.now()};
  const tipos = ['entrada'];
  for(let i=1;i<ns-1;i++) tipos.push(rng.weighted({combate:40, armadilha:13, tesouro:9, vazia:18, misterio:12, descanso:5}));
  tipos.push('chefe');
  if (ns>=6){
    if (!tipos.includes('tesouro')) tipos[rng.int(1,ns-2)]='tesouro';
    if (!tipos.includes('armadilha')){ let j=rng.int(1,ns-2); if (tipos[j]==='tesouro') j = j===1?2:j-1; tipos[j]='armadilha'; }
  }
  const nomes = rng.shuffle(T.salas); let ni=0;
  tipos.forEach((tp,i)=>{ d.salas.push(genSala(rng, d, i, tp, nomes[(ni++)%nomes.length])); });
  d.errantes = genErrantes(rng, d);
  return d;
}

function playerCopy(d){ const c = clone(d); c.salas.forEach(s=>{ delete s.notas; }); return c; }

function makeLocalStore(){
  let mem = {masmorras:{}, publicas:{}};
  try { const raw = localStorage.getItem('gerador-masmorras-demo'); if (raw) mem = JSON.parse(raw); } catch {}
  const persist = () => { try { localStorage.setItem('gerador-masmorras-demo', JSON.stringify(mem)); } catch {} };
  const L=[], P=[], M=[];
  return {
    onLista(cb){ L.push(cb); setTimeout(()=>cb(clone(mem.masmorras))); },
    onPublicas(cb){ P.push(cb); setTimeout(()=>cb(clone(mem.publicas))); },
    async save(d){ mem.masmorras[d.id]=clone(d); if (d.publicada) mem.publicas[d.id]=playerCopy(d); else delete mem.publicas[d.id]; persist(); L.forEach(f=>f(clone(mem.masmorras))); P.forEach(f=>f(clone(mem.publicas))); },
    async remove(id){ delete mem.masmorras[id]; delete mem.publicas[id]; persist(); L.forEach(f=>f(clone(mem.masmorras))); P.forEach(f=>f(clone(mem.publicas))); },
    onMonstros(cb){ M.push(cb); setTimeout(()=>cb(clone(mem.monstros||{}))); },
    async saveMonstro(slug, dados){ mem.monstros = mem.monstros||{}; mem.monstros[slug] = clone(dados); persist(); M.forEach(f=>f(clone(mem.monstros))); },
    async delMonstro(slug){ if (mem.monstros) delete mem.monstros[slug]; persist(); M.forEach(f=>f(clone(mem.monstros||{}))); }
  };
}
function makeDbStore(db){
  const chain = {};
  const q = (k,fn) => (chain[k] = (chain[k]||Promise.resolve()).catch(()=>{}).then(fn));
  const toMap = s => { const m={}; s.docs.forEach(x=>{ if (x.exists) m[x.id] = {...clone(x.data()), id:x.id}; }); return m; };
  return {
    onLista(cb, err){ return db.collection('masmorras').onSnapshot(s=>cb(toMap(s)), err); },
    onPublicas(cb, err){ return db.collection('publicas').onSnapshot(s=>cb(toMap(s)), err); },
    save(d){ const {id, ...rest} = clone(d); return q(id, async ()=>{
      await db.doc('masmorras/'+id).set(rest);
      if (d.publicada){ const {id:_, ...pub} = playerCopy(d); await db.doc('publicas/'+id).set(pub); }
      else { await db.doc('publicas/'+id).delete().catch(()=>{}); }
    }); },
    remove(id){ return q(id, async ()=>{ await db.doc('publicas/'+id).delete().catch(()=>{}); await db.doc('masmorras/'+id).delete(); }); },
    onMonstros(cb, err){ return db.collection('monstros').onSnapshot(s=>cb(toMap(s)), err); },
    saveMonstro(slug, dados){ return q('mon:'+slug, ()=>db.doc('monstros/'+slug).set(dados)); },
    delMonstro(slug){ return q('mon:'+slug, ()=>db.doc('monstros/'+slug).delete()); }
  };
}

/* ================= desenho do mapa ================= */
function drawMap(d){
  const cv = document.getElementById('mapa'); if (!cv || !d) return;
  const wrap = cv.parentElement, m = d.mapa;
  const cssW = S.zoom ? m.w*18 : wrap.clientWidth; if (!cssW) return;
  const c = cssW/m.w, cssH = c*m.h, dpr = window.devicePixelRatio||1;
  cv.width = Math.round(cssW*dpr); cv.height = Math.round(cssH*dpr); cv.style.width = cssW+'px'; cv.style.height = cssH+'px';
  const x = cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  const G = m.grid, at = (i,j) => (i<0||j<0||i>=m.w||j>=m.h) ? 0 : +G[j*m.w+i];
  x.fillStyle = col('--rock'); x.fillRect(0,0,cssW,cssH);
  /* hachura da rocha junto às paredes */
  x.strokeStyle = col('--hatch'); x.lineWidth = 1; x.beginPath();
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++){
    if (at(i,j)) continue; let near=false; for(let dy=-1;dy<=1&&!near;dy++) for(let dx=-1;dx<=1;dx++) if (at(i+dx,j+dy)){ near=true; break; }
    if (!near) continue; const px=i*c, py=j*c;
    x.moveTo(px,py+c); x.lineTo(px+c,py);
    x.moveTo(px,py+c/2); x.lineTo(px+c/2,py); x.moveTo(px+c/2,py+c); x.lineTo(px+c,py+c/2);
  }
  x.stroke();
  x.fillStyle = col('--floor');
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++) if (at(i,j)) x.fillRect(i*c, j*c, c+.5, c+.5);
  x.strokeStyle = col('--floorgrid'); x.lineWidth = 1; x.beginPath();
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++) if (at(i,j)) x.rect(i*c+.5, j*c+.5, c-1, c-1);
  x.stroke();
  /* paredes */
  x.strokeStyle = col('--wall'); x.lineWidth = Math.max(2, c*.18); x.lineCap='square'; x.beginPath();
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++){
    if (!at(i,j)) continue; const px=i*c, py=j*c;
    if (!at(i,j-1)){ x.moveTo(px,py); x.lineTo(px+c,py); }
    if (!at(i,j+1)){ x.moveTo(px,py+c); x.lineTo(px+c,py+c); }
    if (!at(i-1,j)){ x.moveTo(px,py); x.lineTo(px,py+c); }
    if (!at(i+1,j)){ x.moveTo(px+c,py); x.lineTo(px+c,py+c); }
  }
  x.stroke();
  /* portas */
  const showSecret = isMestre();
  m.doors.forEach(dr=>{
    const cx=dr.x*c+c/2, cy=dr.y*c+c/2, horiz = dr.o==='h'; const dw = horiz? c*.32 : c*.86, dh = horiz? c*.86 : c*.32;
    if (dr.t==='secreta'){
      x.strokeStyle = col('--wall'); x.lineWidth = Math.max(2,c*.18); x.beginPath();
      if (horiz){ x.moveTo(cx,dr.y*c); x.lineTo(cx,dr.y*c+c); } else { x.moveTo(dr.x*c,cy); x.lineTo(dr.x*c+c,cy); } x.stroke();
      if (showSecret){ x.fillStyle = col('--sel'); x.font = `700 ${Math.max(8,c*.7)}px ${col('--display')}`; x.textAlign='center'; x.textBaseline='middle'; x.fillText('S', cx + (horiz? c*.32:0), cy + (horiz?0:-c*.32)); }
      return;
    }
    x.fillStyle = dr.t==='trancada' ? col('--wall') : col('--floor');
    x.fillRect(cx-dw/2, cy-dh/2, dw, dh);
    x.strokeStyle = col('--wall'); x.lineWidth = Math.max(1, c*.08); x.strokeRect(cx-dw/2, cy-dh/2, dw, dh);
    if (dr.t==='emperrada'){ x.beginPath(); x.moveTo(cx-dw/2,cy-dh/2); x.lineTo(cx+dw/2,cy+dh/2); x.stroke(); }
  });
  /* escada na entrada */
  const e = m.rooms[0]; if (e){ const sx=(e.x+1)*c, sy=(e.y+1)*c; x.strokeStyle=col('--ink'); x.lineWidth=Math.max(1,c*.08); x.beginPath(); for(let k=0;k<5;k++){ const yy=sy+k*c/5+c*.1; x.moveTo(sx+c*.1,yy); x.lineTo(sx+c*.9,yy); } x.stroke(); }
  /* números das salas */
  x.textAlign='center'; x.textBaseline='middle';
  m.rooms.forEach((r,i)=>{
    const fs = Math.max(9, Math.min(c*1.1, 22)); x.font = `700 ${fs}px ${col('--display')}`;
    const cx=(r.x+r.w/2)*c, cy=(r.y+r.h/2)*c;
    x.fillStyle = col('--ink'); x.fillText(String(i+1), cx, cy);
    if (S.sel===i){ x.strokeStyle = col('--sel'); x.lineWidth = Math.max(2,c*.2); x.strokeRect(r.x*c+c*.2, r.y*c+c*.2, r.w*c-c*.4, r.h*c-c*.4); }
  });
}
function mapClick(e, d){

  const i = Math.floor((e.clientX-rc.left)/rc.width*m.w), j = Math.floor((e.clientY-rc.top)/rc.height*m.h);
  const idx = m.rooms.findIndex(r => i>=r.x && i<r.x+r.w && j>=r.y && j<r.y+r.h);

/* junta o resumo embutido (STATS) com o que o mestre salvou em monstros/{slug}.
   Campo salvo (mesmo vazio/null) vence o embutido; docs antigos só têm "texto". */
/* junta a ficha oficial (SRD 5.2.1), o resumo em português (STATS) e o que o mestre salvou em monstros/{slug}.
   Números: mestre > SRD > STATS. Campo salvo (mesmo vazio/null) vence; docs antigos só têm "texto". */
function monFicha(en, cu){
  const o = SRD[en] || null, s = STATS[en], c = cu && typeof cu==='object' ? cu : null;
  const b = o || s;
  const has = k => !!c && Object.prototype.hasOwnProperty.call(c, k);
  const txt = v => v==null ? '' : String(v);
  let atr = has('atr') ? c.atr : (b ? b.atr : null);
  atr = Array.isArray(atr) && atr.length===6 && atr.every(v=>Number.isFinite(Number(v)) && String(v).trim()!=='') ? atr.map(Number) : null;
  const meu = has('texto') && typeof c.texto==='string';
  return {
    ca: has('ca') ? (c.ca==null || c.ca==='' ? null : txt(c.ca)) : (b ? String(b.ca) : null),
    pv: has('pv') ? txt(c.pv) : (b ? b.pv : ''),
    desl: has('desl') ? txt(c.desl) : (b ? b.desl : ''),
    atr, pag: has('pag') ? txt(c.pag) : '',
    texto: meu ? c.texto : (s && !o ? s.linhas.join('\n') : ''),
    textoMeu: meu, resumoPt: !meu && !!s && !o, oficial: o,
    editada: !!c
  };
}
const oficialTexto = o => o.secoes.map(([t,ls]) => '— '+t+' —\n'+ls.join('\n')).join('\n');
function oficialHtml(o){
  return o.secoes.map(([t,ls]) => `<h4>${h(t)}</h4>${statLinesHtml(ls)}`).join('');
}

}

/* ================= ações ================= */
function markDirty(){ if (!S.dirty){ S.dirty = true; render(); } }
async function salvar(){
  const d = S.cur; if (!d || S.saving) return;
  if (!d.id) d.id = newId();
  d.atualizada = Date.now(); S.saving = true; render();
  try { await store.save(d); S.dirty = false; S.notice = ''; }
  catch(err){ S.notice = 'Não foi possível salvar ('+h(err && (err.code||err.message) || 'erro')+'). Tente de novo.'; }
  S.saving = false; render();
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a!=='excluir') S.delArm = null;
  if (a!=='mon-reset') S.popResetArm = false;
  if (a==='noop') return;
  if (a==='mon' || a==='item'){ S.pop = a==='item' ? 'item:'+t.dataset.it : t.dataset.en; S.popEdit = false; render(); const c=document.getElementById('pop-close'); if (c) c.focus(); return; }
  if (a==='pop-close' || (a==='pop-bg' && e.target===t)){ S.pop = null; S.popEdit = false; render(); return; }
  if (a==='mon-edit'){ S.popEdit = true; render(); const ta=document.getElementById('mon-txt'); if (ta) ta.focus(); return; }
  if (a==='mon-cancel'){ S.popEdit = false; render(); return; }
  if (a==='mon-save'){
    const slug = popSlug(); let dados;
    if (isItemPop()){ const ta = document.getElementById('mon-txt'); dados = {texto: ta ? ta.value : ''}; }
    else { const r = lerFichaForm(); if (r.erro){ const el = document.getElementById('mf-err'); if (el) el.textContent = r.erro; return; } dados = r.dados; }
    S.monTxt[slug] = dados; S.popEdit = false; render();
    store.saveMonstro(slug, dados).catch(err=>{ S.notice='Não foi possível salvar o texto do monstro ('+h(err && (err.code||err.message))+').'; render(); });
    return;
  }
  if (a==='mon-reset'){
    if (!S.popResetArm){ S.popResetArm = true; render(); return; }
    S.popResetArm = false; const slug = popSlug(); delete S.monTxt[slug]; render();
    store.delMonstro(slug).catch(err=>{ S.notice='Não foi possível restaurar o resumo ('+h(err && (err.code||err.message))+').'; render(); });
    return;
  }
  if (a==='tab'){ S.tab = t.dataset.tab; S.sel = null; render(); }
  else if (a==='ver-como'){ S.viewAs = t.dataset.v; S.sel = null; S.openPub = null; S.tab = S.viewAs==='mestre'?'gerar':'jogador'; render(); }
  else if (a==='gerar'){
    if (S.dirty && !S.genArm){ S.genArm = true; render(); return; }
    S.genArm = false; S.cur = genDungeon(S.params); S.sel = null; S.dirty = true; render();
  }
  else if (a==='sel'){ e.stopPropagation(); S.sel = t.dataset.i===''?null:+t.dataset.i; render(); }
  else if (a==='zoom'){ S.zoom = !S.zoom; render(); }
  else if (a==='salvar') salvar();
  else if (a==='publicar'){ if (!S.cur) return; S.cur.publicada = !S.cur.publicada; S.dirty = true; salvar(); }
  else if (a==='reroll-sala' || a==='reroll-enc'){
    const i = +t.dataset.i, d = S.cur, rng = makeRng(d.semente+':'+i+':'+Date.now()+Math.random());
    const old = d.salas[i];
    if (a==='reroll-sala'){ const ns = genSala(rng, d, i, old.tipo, rng.pick(TEMAS[d.params.tema].salas)); ns.notas = old.notas||''; if (old.tipo!=='entrada' && old.tipo!=='chefe') ns.nome = rng.pick(TEMAS[d.params.tema].salas); d.salas[i] = ns; }
    else { const enc = buildEncounter(rng, d.params, old.tipo==='chefe'?2:old.encontro.dif, old.tipo==='chefe'); enc.comport = old.encontro.comport; old.encontro = enc; }
    S.dirty = true; render();
  }
  else if (a==='abrir'){ if (e.target.closest('[data-act="excluir"]')) return; const d = S.lista[t.dataset.id]; if (!d) return; if (S.dirty && S.cur && !confirmLeave()) return; S.cur = clone(d); S.sel = null; S.dirty = false; S.tab = 'gerar'; render(); window.scrollTo(0,0); }
  else if (a==='excluir'){ e.stopPropagation(); const id = t.dataset.id;
    if (S.delArm !== id){ S.delArm = id; render(); return; }
    S.delArm = null; store.remove(id).catch(err=>{ S.notice='Não foi possível excluir ('+h(err && (err.code||err.message))+').'; render(); });
    if (S.cur && S.cur.id===id){ S.cur.id = null; S.cur.publicada = false; S.dirty = true; }
  }
  else if (a==='ver'){ S.openPub = t.dataset.id; S.sel = null; render(); window.scrollTo(0,0); }
  else if (a==='voltar'){ S.openPub = null; S.sel = null; render(); }
});
/* abrir uma masmorra salva por cima de alterações não salvas: segundo clique confirma */
let leaveArm = 0;
function confirmLeave(){ if (Date.now()-leaveArm < 4000) return true; leaveArm = Date.now(); S.notice = 'A masmorra aberta no Gerador tem alterações não salvas. Clique de novo na masmorra para abri-la mesmo assim.'; render(); return false; }
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && S.pop){ S.pop = null; S.popEdit = false; render(); return; }if ((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('card')){ e.preventDefault(); e.target.click(); } });

function subscribe(){
  const err = what => e => { S.notice = 'Não foi possível carregar '+what+' ('+h(e && (e.code||e.message))+').'; render(); };
  if (S.isOwner) store.onLista(m=>{ S.lista = m; render(); }, err('as masmorras salvas'));
  store.onMonstros(m=>{ S.monTxt = m; if (!S.popEdit) render(); }, err('os textos dos monstros'));
  store.onPublicas(m=>{ S.publicas = m; if (S.openPub && !m[S.openPub]) S.openPub = null; render(); }, err('as masmorras visíveis'));
}
async function init(){
  S.cur = genDungeon({...S.params, semente:'exemplo-cripta'}); S.dirty = true;
  render();
  let db=null, user=null;
  if (window.claude && typeof window.claude.use==='function'){
    try {
      const timeout = new Promise(r=>setTimeout(()=>r([null,null]),10000));
      [db,user] = await Promise.race([Promise.all([window.claude.use('db'), window.claude.use('user')]), timeout]);
    } catch { db=null; user=null; }
  }
  if (db && user){
    S.mode = 'db'; store = makeDbStore(db);
    try { S.isOwner = !!(await user.isOwner()); } catch { S.isOwner = false; }
    try { S.myId = await user.id(); } catch {}
    S.viewAs = S.isOwner ? 'mestre' : 'jogador';
    if (!S.isOwner){ S.cur = null; S.dirty = false; }
  } else {
    S.mode = 'local'; store = makeLocalStore(); S.isOwner = true;
    S.notice = '<b>Modo demonstração.</b> O banco compartilhado não está disponível aqui, então as masmorras ficam só neste navegador. Use "Ver como" para testar a visão do jogador.';
  }
  S.loaded = true; subscribe(); render();
}
init();
</script>
