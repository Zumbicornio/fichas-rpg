ondition until the wisp's Concentration ends on this effect, which ends early immediately after the wisp makes an attack roll or uses Consume Life."]]]},"Winter Wolf":{"tipo":"Grande Monstruosidade, Neutro e Mau","ca":"13","pv":"75 (10d10+20)","desl":"15 m","ini":"+1 (11)","atr":[18,13,14,7,12,8],"info":[["Perícias","Percepção +5, Furtividade +5"],["Imunidades","Frio"],["Sentidos","Percepção passiva 15"],["Idiomas","Comum, Gigante"]],"cr":"3","secoes":[["Traços",["Táticas de Matilha. O lobo tem Vantagem numa jogada de ataque contra uma criatura se pelo menos um aliado do lobo estiver a até 1,5 m dela e não estiver na condição Incapacitado."]],["Ações",["Mordida. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 11 (2d6 + 4) de dano Perfurante. Se o alvo for uma criatura Grande ou menor, ele fica na condição Caído.","Sopro Gélido (Recarga 5–6). Salvaguarda de Constituição: CD 12, cada criatura num Cone de 4,5 m. Falha: 18 (4d8) de dano de Frio. Sucesso: Metade do dano."]]],"secoesEn":[["Traços",["Pack Tactics. The wolf has Advantage on an attack roll against a creature if at least one of the wolf's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."]],["Ações",["Bite. Melee Attack Roll: +6, reach 5 ft. Hit: 11 (2d6 + 4) Piercing damage. If the target is a Large or smaller creature, it has the Prone condition.","Cold Breath (Recharge 5-6). Constitution Saving Throw: DC 12, each creature in a 15-foot Cone. Failure: 18 (4d8) Cold damage. Success: Half damage."]]]},"Worg":{"tipo":"Grande Fada, Neutro e Mau","ca":"13","pv":"26 (4d10+4)","desl":"15 m","ini":"+1 (11)","atr":[16,13,13,7,11,8],"info":[["Perícias","Percepção +4"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Goblin, Worg"]],"cr":"1/2","secoes":[["Ações",["Mordida. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 7 (1d8 + 3) de dano Perfurante, e a próxima jogada de ataque contra o alvo antes do início do próximo turno do wor /* "Espada Longa +1 · incomum" -> "Arma +1"; "Pergaminho de Magia (2º círculo)" -> "Pergaminho de Magia" */
function itemKey(txt){
  const nome = String(txt).split(' · ')[0].trim();
  if (ITEM_DESC[nome]) return nome;
  const m = nome.match(/^(.+) \+([123])$/);
  if (m){ if (ARMAS.includes(m[1])) return 'Arma +'+m[2]; if (ARMADURAS.includes(m[1])) return 'Armadura +'+m[2]; }
  if (nome.startsWith('Pergaminho de Magia')) return 'Pergaminho de Magia';
  return null;
}
const itemSlug = k => 'item-'+String(k).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const linkItem = txt => itemKey(txt) ? `<button class="rl" data-act="item" data-it="${h(txt)}">${h(txt)}</button>` : h(txt);
const RAR_TIER = {1:{comum:6,incomum:4},2:{incomum:6,rara:4},3:{rara:6,muitorara:4},4:{muitorara:6,lendaria:4}};

/* ================= gerador de mapa ================= */
const SIZES = {pequena:{w:40,h:30,n:[6,8],nome:'Pequena (6–8 salas)'}, media:{w:54,h:38,n:[10,13],nome:'Média (10–13 salas)'}, grande:{w:68,h:48,n:[15,19],nome:'Grande (15–19 salas)'}};
function genMap(rng, tamanho, tema, rngSec){
  const Z = SIZES[tamanho]||SIZES.media, W=Z.w, H=Z.h, alvo=rng.int(Z.n[0],Z.n[1]);
  const g = new Uint8Array(W*H); let rooms=[];
  for(let a=0; a<900 && rooms.length<alvo; a++){
    const w=rng.int(4,9), hh=rng.int(4,8), x=rng.int(1,W-w-1), y=rng.int(1,H-hh-1);
    if (rooms.some(r => x<r.x+r.w+2 && x+w+2>r.x && y<r.y+r.h+2 && y+hh+2>r.y)) continue;
    rooms.push({x,y,w,h:hh});
  }
  const cen = r => [r.x+(r.w>>1), r.y+(r.h>>1)];
  const dist = (a,b) => { const [p,q]=cen(a),[s,t]=cen(b); return Math.hypot(p-s,q-t); };
  /* árvore mínima + alguns atalhos para criar ciclos */
  const edges=[], inT=[0], rest=rooms.map((_,i)=>i).slice(1);
  while(rest.length){ let best=null; for(const i of inT) for(const j of rest){ const d=dist(rooms[i],rooms[j]); if(!best||d<best[2]) best=[i,j,d]; } edges.push([best[0],best[1]]); inT.push(best[1]); rest.splice(rest.indexOf(best[1]),1); }
  const has = (i,j) => edges.some(e => (e[0]===i&&e[1]===j)||(e[0]===j&&e[1]===i));
  for(let k=0;k<Math.max(1,Math.round(rooms.length*.18));k++){
    const i=rng.int(0,rooms.length-1); const c=rooms.map((r,j)=>[j,dist(rooms[i],r)]).filter(([j])=>j!==i&&!has(i,j)).sort((a,b)=>a[1]-b[1]);
    if (c.length && c[0][1] < 22) edges.push([i,c[0][0]]);
  }
  /* entrada = sala mais perto da borda; numeração em ordem de exploração (busca em largura) */
  const adj = rooms.map(()=>[]); edges.forEach(([a,b])=>{ adj[a].push(b); adj[b].push(a); });
  let ent=0, bd=1e9; rooms.forEach((r,i)=>{ const d=Math.min(r.x, r.y, W-(r.x+r.w), H-(r.y+r.h)); if(d<bd){bd=d; ent=i;} });
  const order=[ent], depth={[ent]:0}; for(let q=0;q<order.length;q++){ const u=order[q]; for(const v of adj[u]) if(depth[v]===undefined){ depth[v]=depth[u]+1; order.push(v); } }
  const maxD = Math.max(...order.map(i=>depth[i]));
  const boss = order.filter(i=>depth[i]===maxD).sort((a,b)=>rooms[b].w*rooms[b].h-rooms[a].w*rooms[a].h)[0];
  const ord = order.filter(i=>i!==boss).concat([boss]);
  const remap = {}; ord.forEach((old,nw)=>remap[old]=nw);
  rooms = ord.map(i=>rooms[i]);
  const conex = edges.map(([a,b])=>({a:remap[a], b:remap[b]}));
  rooms.forEach(r=>{ for(let j=r.y;j<r.y+r.h;j++) for(let i=r.x;i<r.x+r.w;i++) g[j*W+i]=1; });
  const roomAt = (x,y) => rooms.findIndex(r => x>=r.x && x<r.x+r.w && y>=r.y && y<r.y+r.h);
  const doors = new Map();
  /* corredor em L entre os centros; "paralelo" conta quantos quadrados novos correm lado a lado
     (a 1 ou 2 quadrados) com um corredor que já existe */
  const caminho = (a,b,xPrimeiro) => {
    const [x0,y0]=cen(rooms[a]), [x1,y1]=cen(rooms[b]); const path=[[x0,y0]]; let x=x0, y=y0;
    const sx=()=>{ while(x!==x1){ x+=Math.sign(x1-x); path.push([x,y]); } }, sy=()=>{ while(y!==y1){ y+=Math.sign(y1-y); path.push([x,y]); } };
    if (xPrimeiro){ sx(); sy(); } else { sy(); sx(); }
    return path;
  };
  const corr = (i,j) => i>=0 && j>=0 && i<W && j<H && g[j*W+i]===2;
  const paralelo = path => {
    let n=0;
    for(let k=1;k<path.length;k++){
      const [px,py]=path[k], [qx,qy]=path[k-1]; if (roomAt(px,py)>=0 || g[py*W+px]!==0) continue;
      const hor = py===qy, lado = d => hor ? corr(px,py+d)||corr(px,py-d) : corr(px+d,py)||corr(px-d,py);
      if (lado(1) || lado(2)) n++;
    }
    return n;
  };
  const feitas = [], viaCorr = new Set(); /* quadrados por onde passa algum corredor (a erosão da caverna não pode cortá-los) */
  /* distância andando pelo que já foi escavado (salas e corredores), de centro a centro */
  const distJa = (a,b) => {
    const [x0,y0]=cen(rooms[a]), [x1,y1]=cen(rooms[b]), alvo=y1*W+x1, dist=new Int32Array(W*H).fill(-1), fila=[y0*W+x0]; dist[fila[0]]=0;
    for (let q=0;q<fila.length;q++){ const c=fila[q]; if (c===alvo) return dist[c]; const x=c%W, y=(c-x)/W;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const i=x+dx, j=y+dy, n=j*W+i;
        if (i>=0 && j>=0 && i<W && j<H && g[n] && dist[n]<0){ dist[n]=dist[c]+1; fila.push(n); } } }
    return Infinity;
  };
  const perto = (a,b) => { if (a===b) return true; const [ax,ay]=cen(rooms[a]), [bx,by]=cen(rooms[b]); return distJa(a,b) <= 1.5*(Math.abs(ax-bx)+Math.abs(ay-by)) + 4; };
  conex.forEach(({a,b}, idx)=>{
    /* salas que já estão ligadas por um caminho curto (por exemplo, um corredor que passou por dentro de uma delas) não ganham outro corredor */
    if (perto(a,b)){ rng.chance(.5); return; }
    /* entre os dois L, prefere o que não corre paralelo a outro corredor e atravessa menos salas */
    const pref = rng.chance(.5), p1 = caminho(a,b,pref), p2 = caminho(a,b,!pref), s1 = paralelo(p1), s2 = paralelo(p2);
    const raspa = p => { let n=0; for(let k=1;k<p.length-1;k++){ const [x,y]=p[k]; if (roomAt(x,y)>=0) continue;
      const viz = [roomAt(...p[k-1]), roomAt(...p[k+1])];
      if ([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{ const r=roomAt(x+dx,y+dy); return r>=0 && !viz.includes(r); })) n++; } return n; };
    const nota = (p,sp) => sp*10 + raspa(p)*6 + new Set(p.map(([x,y])=>roomAt(x,y)).filter(r=>r>=0 && r!==a && r!==b)).size*3;
    const path = nota(p2,s2) < nota(p1,s1) ? p2 : p1, atalho = idx >= rooms.length-1;
    /* atalho que duplicaria um corredor ou rasparia na parede de outra sala é descartado */
    if (atalho && (Math.min(s1,s2) >= 2 || raspa(path) > 0)) return;
    /* se o L atravessa outras salas, só escava o trecho que falta: começa na última sala já perto de a
       e para na primeira sala já perto de b */
    const salaK = path.map(([x,y])=>roomAt(x,y));
    let ini = 0, fim = path.length-1;
    for (let k=1;k<path.length;k++){ const r=salaK[k]; if (r>=0 && r!==b && r!==salaK[k-1] && perto(a,r)){ ini=k; } }
    while (ini<fim && salaK[ini]>=0 && salaK[ini+1]===salaK[ini]) ini++;
    for (let k=ini+1;k<path.length;k++){ const r=salaK[k]; if (r>=0 && r!==salaK[k-1] && (r===b || perto(r,b))){ fim=k; break; } }
    if (salaK[ini]>=0 && salaK[ini]===salaK[fim]) return;
    feitas.push(conex[idx]);
    const [x0,y0]=path[ini];
    let prev = salaK[ini];
    for(let k=ini+1;k<=fim;k++){
      const [px,py]=path[k], ri=salaK[k];
      viaCorr.add(py*W+px);
      if (ri<0 && g[py*W+px]===0) g[py*W+px]=2;
      if (prev>=0 && ri<0) doors.set(px+','+py,{x:px,y:py});
      if (prev<0 && ri>=0){ const [qx,qy]=path[k-1]; doors.set(qx+','+qy,{x:qx,y:qy}); }
      prev=ri;
    }
  });
  conex.splice(0, conex.length, ...feitas);
  const at = (i,j) => (i<0||j<0||i>=W||j>=H) ? 0 : g[j*W+i];
  /* porta só onde a passagem tem exatamente dois lados abertos e opostos */
  const dl = [];
  for (const d of doors.values()){
    const L=!!at(d.x-1,d.y), R=!!at(d.x+1,d.y), U=!!at(d.x,d.y-1), D=!!at(d.x,d.y+1);
    if ((L&&R&&!U&&!D) || (U&&D&&!L&&!R)) dl.push({x:d.x, y:d.y, o:(L&&R)?'h':'v', t:rng.weighted({normal:70,trancada:14,secreta:8,emperrada:8})});
  }
  const g0 = tema==='caverna' ? g.slice() : null;
  if (tema==='caverna'){
    /* bordas irregulares nas grutas */
    const keep = new Set(); dl.forEach(d=>{ for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) keep.add((d.x+dx)+','+(d.y+dy)); });
    rooms.forEach(r=>{
      for(let j=r.y;j<r.y+r.h;j++) for(let i=r.x;i<r.x+r.w;i++){
        const edge = i===r.x||j===r.y||i===r.x+r.w-1||j===r.y+r.h-1, corner=(i===r.x||i===r.x+r.w-1)&&(j===r.y||j===r.y+r.h-1);
        if (!edge || keep.has(i+','+j) || viaCorr.has(j*W+i)) continue;
        const nearCorr = [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>at(i+dx,j+dy)===2);
        if (!nearCorr && (corner || rng.chance(.35))) g[j*W+i]=0;
      }
      for(let j=r.y-1;j<=r.y+r.h;j++) for(let i=r.x-1;i<=r.x+r.w;i++){
        if (i<1||j<1||i>=W-1||j>=H-1) continue;
        const out = i<r.x||j<r.y||i>=r.x+r.w||j>=r.y+r.h, corner=(i<r.x||i>=r.x+r.w)&&(j<r.y||j>=r.y+r.h);
        if (out && !corner && g[j*W+i]===0 && rng.chance(.18)) g[j*W+i]=1;
      }
    });
  }
  /* porta secreta só em atalho: sem ela, todas as salas continuam alcançáveis a partir da entrada (sala 1) */
  const foraDoAlcance = bloq => {
    const seen = new Uint8Array(W*H), [sx,sy] = cen(rooms[0]), fila=[sy*W+sx]; seen[sy*W+sx]=1;
    while(fila.length){ const c=fila.pop(), x=c%W, y=(c-x)/W;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const i=x+dx, j=y+dy, n=j*W+i;
        if (at(i,j) && !seen[n] && !bloq.has(n)){ seen[n]=1; fila.push(n); } } }
    return rooms.map((r,i)=>i).filter(i=>{ const [cx,cy]=cen(rooms[i]); return !seen[cy*W+cx]; });
  };
  const alcancaTudo = bloq => !foraDoAlcance(bloq).length;
  /* se as bordas irregulares da caverna cortaram alguma passagem, desfaz a erosão neste mapa */
  if (g0 && !alcancaTudo(new Set())) g.set(g0);
  const bloq = new Set();
  /* ...e atalho de verdade: sem a porta, o outro caminho entre os dois lados dela tem que ser bem mais longo */
  const desvio = (dr, bl) => {
    const [ax,ay,bx,by] = dr.o==='h' ? [dr.x-1,dr.y,dr.x+1,dr.y] : [dr.x,dr.y-1,dr.x,dr.y+1];
    const dist = new Int32Array(W*H).fill(-1), fila=[ay*W+ax]; dist[ay*W+ax]=0;
    for (let q=0;q<fila.length;q++){ const c=fila[q], x=c%W, y=(c-x)/W; if (c===by*W+bx) return dist[c];
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const i=x+dx, j=y+dy, n=j*W+i;
        if (at(i,j) && dist[n]<0 && !bl.has(n)){ dist[n]=dist[c]+1; fila.push(n); } } }
    return Infinity;
  };
  for (const dr of dl) if (dr.t==='secreta'){ const n=dr.y*W+dr.x; bloq.add(n); if (!alcancaTudo(bloq) || desvio(dr,bloq) < 24){ bloq.delete(n); dr.t='normal'; } }
  /* salas secretas: uma sala que só se alcança por uma porta secreta, fora do caminho até o chefe.
     A porta fica, de preferência, na parede da sala vizinha, escondendo também o corredor. */
  let secretas = [];
  if (rngSec){
    const ultima = rooms.length-1;
    const qtd = tamanho==='grande' ? rngSec.int(1,2) : tamanho==='pequena' ? (rngSec.chance(.5)?1:0) : (rngSec.chance(.75)?1:0);
    const encosta = (dr,r) => (dr.x>=r.x && dr.x<r.x+r.w && (dr.y===r.y-1 || dr.y===r.y+r.h)) || (dr.y>=r.y && dr.y<r.y+r.h && (dr.x===r.x-1 || dr.x===r.x+r.w));
    for (let k=0;k<qtd;k++){
      const cand = [];
      for (const dr of dl) if (dr.t!=='secreta'){
        const n=dr.y*W+dr.x; bloq.add(n); const fora = foraDoAlcance(bloq).filter(ri=>!secretas.some(x=>x.sala===ri)); bloq.delete(n);
        if (fora.length===1 && fora[0]!==0 && fora[0]!==ultima && !secretas.some(x=>x.sala===fora[0])) cand.push({dr, sala:fora[0], longe:!encosta(dr, rooms[fora[0]])});
      }
      const melhores = cand.filter(c=>c.longe); const c = rngSec.pick(melhores.length ? melhores : cand); if (!c) break;
      c.dr.t='secreta'; bloq.add(c.dr.y*W+c.dr.x); secretas.push({sala:c.sala, x:c.dr.x, y:c.dr.y});
    }
    /* salas secretas vão para o fim da numeração (depois do chefe), para não deixar buracos na lista dos jogadores */
    if (secretas.length){
      const sec = secretas.map(x=>x.sala), ord = rooms.map((r,i)=>i).filter(i=>!sec.includes(i)).concat(sec);
      const novo = {}; ord.forEach((old,nw)=>novo[old]=nw);
      rooms = ord.map(i=>rooms[i]);
      conex.forEach(c=>{ c.a=novo[c.a]; c.b=novo[c.b]; });
      secretas = secretas.map(x=>({...x, sala:novo[x.sala]}));
    }
  }
  return {w:W, h:H, grid:Array.from(g).join(''), doors:dl, rooms, conex, secretas};
}

const MON_DG = MON.filter(m=>m.tags!=='x'); /* reserva quando o tema não tem opções: só criaturas de masmorra */
function poolFor(tema){ const t=TEMAS[tema].tag; return MON.filter(m=>m.tags.includes(t)); }
function buildEncounter(rng, p, dif, chefe, forcar){
  const per = BUD[p.nivel][dif]; let alvo = per*p.jogadores; if (chefe && p.ritmo==='pesado') alvo=Math.round(alvo*1.25);
  const pool = poolFor(p.tema);
  const fits = (list,lo,hi) => list.filter(m=>m.xp<=hi && m.xp>=lo);
  let cand = fits(pool, alvo/(chefe?4:10), alvo*(chefe?.85:1)); if (cand.length<2) cand = fits(MON_DG, alvo/(chefe?4:10), alvo*(chefe?.85:1));
  if (!cand.length) cand = [MON_DG.filter(m=>m.xp<=alvo).sort((a,b)=>b.xp-a.xp)[0] || MON[0]];
  let prim, n;
  if (chefe){ const sorted=[...cand].sort((a,b)=>b.xp-a.xp); prim = forcar || rng.pick(sorted.slice(0,Math.max(1,Math.ceil(sorted.length/3)))); n=1; }
  else { prim = rng.pick(cand); const maxN=Math.max(1,Math.min(8,Math.floor(alvo/prim.xp))); n=Math.max(1,Math.round(maxN*(.6+.4*rng.f()))); }
  const grupos=[{pt:prim.pt,en:prim.en,cr:prim.cr,xp:prim.xp,qtd:n}];
  let resto = alvo - n*prim.xp;
  if (resto >= alvo*.2){
    let c2 = pool.filter(m=>m.xp<=resto && m.pt!==prim.pt && m.xp>=resto/6); if(!c2.length) c2 = MON_DG.filter(m=>m.xp<=resto && m.pt!==prim.pt && m.xp>=resto/6);
    if (c2.length){ const s=rng.pick(c2); const k=Math.max(1,Math.min(6,Math.floor(resto/s.xp))); grupos.push({pt:s.pt,en:s.en,cr:s.cr,xp:s.xp,qtd:k}); }
  }
  const xp = grupos.reduce((t,gp)=>t+gp.xp*gp.qtd,0);
  return {dif, orcamento:alvo, xp, grupos, comport:''};
}

function pickItem(rng, rar, usados, t){

const S = {

function makeDbStore(db){
  const chain = {};
  const q = (k,fn) => (chain[k] = (chain[k]||Promise.resolve()).catch(()=>{}).then(fn));

  return {
    onLista(cb, err){ return db.collection('masmorras').onSnapshot(s=>cb(toMap(s)), err); },
    onPublicas(cb, err){ return db.collection('publicas').onSnapshot(s=>cb(toMap(s)), err); },
    save(d){ const {id, ...rest} = clone(d); return q(id, async ()=>{

function drawMap(d){
  const cv = document.getElementById('mapa'); if (!cv || !d) return;
  const wrap = cv.parentElement, m = d.mapa;
  const cssW = S.zoom ? m.w*18 : wrap.clientWidth; if (!cssW) return;
  const c = cssW/m.w, cssH = c*m.h, dpr = window.devicePixelRatio||1;
  cv.width = Math.round(cssW*dpr); cv.height = Math.round(cssH*dpr); cv.style.width = cssW+'px'; cv.style.height = cssH+'px';
  const x = cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  const G = m.grid, oculto = celulasOcultas(d), at = (i,j) => (i<0||j<0||i>=m.w||j>=m.h||(oculto&&oculto.has(j*m.w+i))) ? 0 : +G[j*m.w+i];
  x.fillStyle = col('--rock'); x.fillRect(0,0,cssW,cssH);
  /* hachura da rocha junto às paredes */
  x.strokeStyle = col('--hatch'); x.lineWidth = 1; x.beginPath();
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++){
    if (at(i,j)) continue; let near=false; for(let dy=-1;dy<=1&&!near;dy++) for(let dx=-1;dx<=1;dx++) if (at(i+dx,j+dy)){ near=true; break; }
    if (!near) continue; const px=i*c, py=j*c;
    x.moveTo(px,py+c); x.lineTo(px+c,py);
    x.moveTo(px,py+c/2); x.lineTo(px+c/2,py); x.moveTo(px+c/2,py+c); x.lineTo(px+c,py+c/2);
  }
  x.stroke();
  x.fillStyle = col('--floor');
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++) if (at(i,j)) x.fillRect(i*c, j*c, c+.5, c+.5);
  x.strokeStyle = col('--floorgrid'); x.lineWidth = 1; x.beginPath();
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++) if (at(i,j)) x.rect(i*c+.5, j*c+.5, c-1, c-1);
  x.stroke();
  /* paredes */
  x.strokeStyle = col('--wall'); x.lineWidth = Math.max(2, c*.18); x.lineCap='square'; x.beginPath();
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++){

    if (!at(i,j-1)){ x.moveTo(px,py); x.lineTo(px+c,py); }
    if (!at(i,j+1)){ x.moveTo(px,py+c); x.lineTo(px+c,py+c); }
    if (!at(i-1,j)){ x.moveTo(px,py); x.lineTo(px,py+c); }
    if (!at(i+1,j)){ x.moveTo(px+c,py); x.lineTo(px+c,py+c); }
  }
  x.stroke();
  /* portas */
  const showSecret = isMestre();
  m.doors.forEach(dr=>{
    if (oculto && oculto.has(dr.y*m.w+dr.x)) return;
    const revelada = !showSecret && dr.t==='secreta' && (m.secretas||[]).some(x=>x.x===dr.x&&x.y===dr.y);
    const cx=dr.x*c+c/2, cy=dr.y*c+c/2, horiz = dr.o==='h'; const dw = horiz? c*.32 : c*.86, dh = horiz? c*.86 : c*.32;
    if (dr.t==='secreta' && !revelada){
      x.strokeStyle = col('--wall'); x.lineWidth = Math.max(2,c*.18); x.beginPath();
      if (horiz){ x.moveTo(cx,dr.y*c); x.lineTo(cx,dr.y*c+c); } else { x.moveTo(dr.x*c,cy); x.lineTo(dr.x*c+c,cy); } x.stroke();
      if (showSecret){ x.fillStyle = col('--sel'); x.font = `700 ${Math.max(8,c*.7)}px ${col('--display')}`; x.textAlign='center'; x.textBaseline='middle'; x.fillText('S', cx + (horiz? c*.32:0), cy + (horiz?0:-c*.32)); }
      return;
    }
    x.fillStyle = dr.t==='trancada' ? col('--wall') : col('--floor');
    x.fillRect(cx-dw/2, cy-dh/2, dw, dh);
    x.strokeStyle = col('--wall'); x.lineWidth = Math.max(1, c*.08); x.strokeRect(cx-dw/2, cy-dh/2, dw, dh);

/* junta a ficha oficial (SRD 5.2.1), o resumo em português (STATS) e o que o mestre salvou em monstros/{slug}.
   Números: mestre > SRD > STATS. Campo salvo (mesmo vazio/null) vence; docs antigos só têm "texto". */
function monFicha(en, cu){
  const o = SRD[en] || null, s = STATS[en], c = cu && typeof cu==='object' ? cu : null;
  const b = o || s;
  const has = k => !!c && Object.prototype.hasOwnProperty.call(c, k);
  const txt = v => v==null ? '' : String(v);
  let atr = has('atr') ? c.atr : (b ? b.atr : null);
  atr = Array.isArray(atr) && atr.length===6 && atr.every(v=>Number.isFinite(Number(v)) && String(v).trim()!=='') ? atr.map(Number) : null;
  const meu = has('texto') && typeof c.texto==='string';
  return {
    ca: has('ca') ? (c.ca==null || c.ca==='' ? null : txt(c.ca)) : (b ? String(b.ca) : null),
    pv: has('pv') ? txt(c.pv) : (b ? b.pv : ''),
    desl: has('desl') ? txt(c.desl) : (b ? b.desl : ''),
    atr, pag: has('pag') ? txt(c.pag) : '',
    texto: meu ? c.texto : (s && !o ? s.linhas.join('\n') : ''),
    textoMeu: meu, resumoPt: !meu && !!s && !o, oficial: o,
    editada: !!c
  };
}

        ${S.dirty?'<span class="dirty">Alterações não salvas</span>':(d.id?'<span class="ok">Salva</span>':'')}
        <button class="btn ${S.dirty||!d.id?'pri':''}" data-act="salvar" ${S.saving?'disabled':''}>${S.saving?'Salvando…':'Salvar'}</button>
        <button class="btn" data-act="publicar" ${S.saving?'disabled':''}>${d.publicada?'Ocultar dos jogadores':'Mostrar aos jogadores'}</button>
        ${d.publicada?'<span class="badge gold">Visível aos jogadores</span>':'<span class="badge">Só o mestre vê</span>'}
      </div></div>`
    : `<div class="toolbar"><h2 style="color:var(--gold2);font-size:20px">${h(d.nome)}</h2><button class="btn" data-act="voltar">← Todas as masmorras</button></div>`;
  return `${toolbar}<div class="mesa">
    <div class="mapbox"><div class="mapwrap ${S.zoom?'zoom':''}"><canvas id="mapa" role="img" aria-label="Mapa da masmorra ${h(d.nome)}"></canvas></div>
      <div class="legend"><span>1 quadrado = 1,5 m · toque numa sala para ver os detalhes${edit?' · S = porta secreta':''} · porta escura = trancada</span><button class="btn sm" data-act="zoom">${S.zoom?'Ajustar à tela':'Ampliar mapa'}</button></div></div>
    <aside class="side">${S.sel==null || !salaVisivel(d,S.sel) ? overview(d,edit) : roomView(d,S.sel,edit)}</aside></div>`;
}
function cards(map, actOpen, master){
  const list = Object.values(map).sort((a,b)=>(b.atualizada||0)-(a.atualizada||0));
  return `<div class="grid-cards">${list.map(d=>`<div class="card" tabindex="0" role="button" data-act="${actOpen}" data-id="${h(d.id)}">
    <h2>${h(d.nome)}</h2>
    <div class="row"><span class="badge gold">${h(TEMAS[d.params.tema]?.nome||'')}</span><span class="badge">Nível ${d.params.nivel}</span><span class="badge">${d.salas.length-(master?0:(d.mapa.secretas||[]).filter(x=>!(d.salas[x.sala]&&d.salas[x.sala].revelada)).length)} salas</span>${master?(d.publicada?'<span class="badge gold">Visível aos jogadores</span>':'<span class="badge">Só o mestre</span>'):''}</div>
    <p class="muted small" style="margin:0">${h(d.gancho)}</p>
    ${master && S.mestres.length && d.autor ? `<div class="muted small">Criada por ${h(nomeDe(d.autor))}</div>` : ''}
    ${master?`<div class="row"><button class="btn sm danger" data-act="excluir" data-id="${h(d.id)}">${S.delArm===d.id?'Confirmar exclusão':'Excluir'}</button></div>`:''}
  </div>`).join('')}</div>`;
}
function viewSalvas(){
  const n = Object.keys(S.lista).length;
  if (!n) return `<div class="panel empty"><h2>Nenhuma masmorra salva</h2><p>Gere uma masmorra na aba Gerador e clique em Salvar. Ela aparece aqui para você abrir depois.</p><button class="btn pri" data-act="tab" data-tab="gerar">Ir para o Gerador</button></div>`;
  return cards(S.lista, 'abrir', true);
}
function nomeDe(id){ return id===S.myId ? 'Você' : (S.nomes[id] || 'Pessoa sem nome'); }
async function carregarNomes(){
  if (!S.userApi) return;
  const ids = [...new Set([...S.mestres, ...S.pessoas, ...Object.values(S.lista).map(d=>d.autor)].filter(x=>typeof x==='string' && !(x in S.nomes)))];
  if (!ids.length) return;
  ids.forEach(i=>S.nomes[i]='');
  try { const ps = await S.userApi.profiles(ids); ids.forEach(i=>{ S.nomes[i] = (ps && ps[i] && ps[i].name) || ''; }); } catch {}
  render();
}
function viewMestres(){
  const cand = [...new Set([...S.achados.map(p=>p.id), ...S.pessoas])].filter(id=>id && id!==S.myId && !S.mestres.includes(id));
  return `<div class="panel" style="max-width:680px"><h2>Mestres do gerador</h2>
    <p class="muted small" style="margin-top:0">Você é o mestre principal, por ser o dono do app. Quem estiver nesta lista também vira mestre: gera, salva, edita e mostra masmorras aos jogadores, e vê todas as masmorras salvas (as suas também). Só você pode mudar esta lista.</p>
    <div class="mlist">
      <div class="li"><span>${h(nomeDe(S.myId))} <span class="muted small">· dono do app</span></span></div>
      ${S.mestres.map(id=>`<div class="li"><span>${h(nomeDe(id))}</span><button class="btn sm danger" data-act="mestre-rem" data-id="${h(id)}">Remover</button></div>`).join('')}
    </div>
    <label class="f" for="busca-mestre">Adicionar mestre</label>
    <input style="width:100%" type="search" id="busca-mestre" data-busca-mestre value="${h(S.busca)}" placeholder="Buscar pelo nome ou e-mail…" autocomplete="off">
    <div class="mlist" style="margin-top:8px">${cand.length ? cand.map(id=>{ const a = S.achados.find(p=>p.id===id); return `<div class="li"><span>${h(a ? a.name : nomeDe(id))}${a && a.email ? ` <span class="muted small">· ${h(a.email)}</span>` : ''}</span><button class="btn sm pri" data-act="mestre-add" data-id="${h(id)}">Tornar mestre</button></div>`; }).join('') : '<div class="muted small">Ninguém para mostrar ainda.</div>'}</div>
    <p class="muted small">A pessoa precisa ter acesso de <b>Editor</b> a este app (menu Compartilhar) e aparece nesta lista depois de abrir o app uma vez.</p></div>`;
}
function viewJogador(){
  if (S.openPub && S.publicas[S.openPub]) return viewMesa(S.publicas[S.openPub], false);
  const n = Object.keys(S.publicas).length;
  if (!n) return `<div class="panel empty"><h2>Nenhuma masmorra à vista</h2><p>Quando o mestre mostrar uma masmorra, ela aparece aqui com o mapa.</p></div>`;
  return cards(S.publicas, 'ver', false);
}
function render(){
  const mestre = isMestre();
  if (!mestre) S.tab = 'jogador'; else if (S.tab==='jogador') S.tab='gerar';
  const nl = Object.keys(S.lista).length;
  if (S.tab==='mestres' && !(mestre && S.isOwner)) S.tab = 'gerar';
  const tabs = mestre ? [['gerar','Gerador'],['salvas','Masmorras salvas',nl]] : [['jogador','Masmorras']];
  if (mestre && S.isOwner && S.mode==='db') tabs.push(['mestres','Mestres',S.mestres.length]);
  let body = '';
  if (S.tab==='gerar') body = viewForm() + (S.cur ? viewMesa(S.cur, true) : '');
  else if (S.tab==='salvas') body = viewSalvas();
  else if (S.tab==='mestres') body = viewMestres();
  else body = viewJogador();
  const ae = document.activeElement, focusId = ae && ae.id, selStart = ae && 'selectionStart' in ae ? ae.selectionStart : null;
  const scroll = window.scrollY;
  document.getElementById('app').innerHTML = `
  <header class="gut"><div><h1>Gerador de Masmorras</h1><div class="sub">D&amp;D 5.5 · ${mestre?'visão do mestre':'visão do jogador'}</div></div>
    <div class="row">${podeMestrar()?`<span class="muted small">Ver como:</span><button class="btn sm ${S.viewAs==='mestre'?'pri':''}" data-act="ver-como" data-v="mestre">Mestre</button><button class="btn sm ${S.viewAs==='jogador'?'pri':''}" data-act="ver-como" data-v="jogador">Jogador</button>`:'<span class="badge">Jogador</span>'}</div></header>
  <nav class="gut">${tabs.map(([k,l,c])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-tab="${k}">${l}${c?`<span class="count">${c}</span>`:''}</button>`).join('')}</nav>
  <main class="gut">${S.notice?`<div class="notice">${S.notice}</div>`:''}${body}</main>${S.pop?popView():''}`;
  if (focusId){ const el=document.getElementById(focusId); if (el){ el.focus(); if (selStart!=null && el.setSelectionRange) try{ el.setSelectionRange(selStart,selStart); }catch{} } }
  window.scrollTo(0, scroll);
  const d = S.tab==='gerar' ? S.cur : (S.tab==='jogador' && S.openPub ? S.publicas[S.openPub] : null);
  const cv = document.getElementById('mapa');
  if (cv && d){ drawMap(d); cv.addEventListener('click', e=>mapClick(e,d)); }
}

/* ================= ações ================= */
function markDirty(){ if (!S.dirty){ S.dirty = true; render(); } }
async function salvar(){
  const d = S.cur; if (!d || S.saving) return;
  if (!d.id) d.id = newId();
  if (!d.autor && S.myId) d.autor = S.myId;
  d.atualizada = Date.now(); S.saving = true; render();
  try { await store.save(d); S.dirty = false; S.notice = ''; }
  catch(err){ S.notice = 'Não foi possível salvar ('+h(err && (err.code||err.message) || 'erro')+'). Tente de novo.'; }
  S.saving = false; render();
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a!=='excluir') S.delArm = null;
  if (a!=='mon-reset') S.popResetArm = false;
  if (a==='noop') return;
  if (a==='mon' || a==='item'){ S.pop = a==='item' ? 'item:'+t.dataset.it : t.dataset.en; S.popEdit = false; render(); const c=document.getElementById('pop-close'); if (c) c.focus(); return; }
  if (a==='pop-close' || (a==='pop-bg' && e.target===t)){ S.pop = null; S.popEdit = false; render(); return; }
  if (a==='mon-edit'){ S.popEdit = true; render(); const ta=document.getElementById('mon-txt'); if (ta) ta.focus(); return; }
  if (a==='mon-cancel'){ S.popEdit = false; render(); return; }
  if (a==='mon-save'){
    const slug = popSlug(); let dados;
    if (isItemPop()){ const ta = document.getElementById('mon-txt'); dados = {texto: ta ? ta.value : ''}; }
    else { const r = lerFichaForm(); if (r.erro){ const el = document.getElementById('mf-err'); if (el) el.textContent = r.erro; return; } dados = r.dados; }
    S.monTxt[slug] = dados; S.popEdit = false; render();
    store.saveMonstro(slug, dados).catch(err=>{ S.notice='Não foi possível salvar o texto do monstro ('+h(err && (err.code||err.message))+').'; render(); });
    return;
  }
  if (a==='mon-reset'){
    if (!S.popResetArm){ S.popResetArm = true; render(); return; }
    S.popResetArm = false; const slug = popSlug(); delete S.monTxt[slug]; render();
    store.delMonstro(slug).catch(err=>{ S.notice='Não foi possível restaurar o resumo ('+h(err && (err.code||err.message))+').'; render(); });
    return;
  }
  if (a==='mestre-add' || a==='mestre-rem'){
    const id = t.dataset.id; if (!S.isOwner || !id || id===S.myId) return;
    const ids = a==='mestre-add' ? [...new Set([...S.mestres, id])] : S.mestres.filter(x=>x!==id);
    t.disabled = true;
    store.saveMestres(ids).then(()=>{ S.notice = ''; }).catch(err=>{ S.notice = 'Não foi possível salvar a lista de mestres ('+h(err && (err.code||err.message) || 'erro')+').'; render(); });
    return;
  }
  if (a==='tab'){ S.tab = t.dataset.tab; S.sel = null; render(); }
  else if (a==='ver-como'){ S.viewAs = t.dataset.v; S.sel = null; S.openPub = null; S.tab = S.viewAs==='mestre'?'gerar':'jogador'; render(); }
  else if (a==='gerar'){
    if (S.dirty && !S.genArm){ S.genArm = true; render(); return; }
    S.genArm = false; S.cur = genDungeon(S.params); S.sel = null; S.dirty = true; render();
  }
  else if (a==='sel'){ e.stopPropagation(); S.sel = t.dataset.i===''?null:+t.dataset.i; render(); }
  else if (a==='zoom'){ S.zoom = !S.zoom; render(); }
  else if (a==='revelar'){ const sl = S.cur && S.cur.salas[+t.dataset.i]; if (!sl) return; sl.revelada = !sl.revelada; S.dirty = true; render(); }
  else if (a==='salvar') salvar();
  else if (a==='publicar'){ if (!S.cur) return; S.cur.publicada = !S.cur.publicada; S.dirty = true; salvar(); }
  else if (a==='reroll-sala' || a==='reroll-enc'){
    const i = +t.dataset.i, d = S.cur, rng = makeRng(d.semente+':'+i+':'+Date.now()+Math.random());
    const old = d.salas[i];
    if (a==='reroll-sala'){ const ns = genSala(rng, d, i, old.tipo, rng.pick(TEMAS[d.params.tema].salas)); ns.notas = old.notas||''; if (old.tipo!=='entrada' && old.tipo!=='chefe' && old.tipo!=='secreta') ns.nome = rng.pick(TEMAS[d.params.tema].salas); ns.revelada = old.revelada; d.salas[i] = ns; }
    else { const enc = buildEncounter(rng, d.params, old.tipo==='chefe'?2:old.encontro.dif, old.tipo==='chefe', old.tipo==='chefe' ? chefeForcado(d) : null); enc.comport = old.encontro.comport; old.encontro = enc; }
    S.dirty = true; render();
  }
  else if (a==='abrir'){ if (e.target.closest('[data-act="excluir"]')) return; const d = S.lista[t.dataset.id]; if (!d) return; if (S.dirty && S.cur && !confirmLeave()) return; S.cur = clone(d); S.sel = null; S.dirty = false; S.tab = 'gerar'; render(); window.scrollTo(0,0); }
  else if (a==='excluir'){ e.stopPropagation(); const id = t.dataset.id;
    if (S.delArm !== id){ S.delArm = id; render(); return; }
    S.delArm = null; store.remove(id).catch(err=>{ S.notice='Não foi possível excluir ('+h(err && (err.code||err.message))+').'; render(); });
    if (S.cur && S.cur.id===id){ S.cur.id = null; S.cur.publicada = false; S.dirty = true; }
  }
  else if (a==='ver'){ S.openPub = t.dataset.id; S.sel = null; render(); window.scrollTo(0,0); }
  else if (a==='voltar'){ S.openPub = null; S.sel = null; render(); }
});
/* abrir uma masmorra salva por cima de alterações não salvas: segundo clique confirma */
let leaveArm = 0;
function confirmLeave(){ if (Date.now()-leaveArm < 4000) return true; leaveArm = Date.now(); S.notice = 'A masmorra aberta no Gerador tem alterações não salvas. Clique de novo na masmorra para abri-la mesmo assim.'; render(); return false; }
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && S.pop){ S.pop = null; S.popEdit = false; render(); return; }if ((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('card')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.dataset.p){ S.params[t.dataset.p] = t.value; return; }
  if (t.dataset.buscaMestre!==undefined){
    S.busca = t.value; const q = t.value.trim();
    if (!q || !S.userApi || !S.userApi.search){ S.achados = []; render(); return; }
    S.userApi.search(q).then(hits=>{ if (S.busca.trim()!==q) return; S.achados = (hits||[]).filter(p=>p.id && p.name); S.achados.forEach(p=>{ S.nomes[p.id] = p.name; }); render(); }).catch(()=>{});
    return;
  }
  if (t.dataset.notas!==undefined && S.cur){ S.cur.salas[+t.dataset.notas].notas = t.value; if (!S.dirty){ S.dirty = true; const tb=document.querySelector('.toolbar .row'); if (tb) render(); } return; }
  if (t.dataset.nome!==undefined && S.cur){ S.cur.nome = t.value; if (!S.dirty){ S.dirty = true; render(); } }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if (t.dataset.p){ S.params[t.dataset.p] = t.tagName==='SELECT' && t.dataset.p!=='tema' && t.dataset.p!=='tamanho' && t.dataset.p!=='ritmo' && t.dataset.p!=='itens' ? +t.value : t.value; return; }
  if (t.dataset.actChange==='tipo' && S.cur){
    const i = +t.dataset.i, d = S.cur, rng = makeRng(d.semente+':t:'+i+':'+Date.now());
    const old = d.salas[i]; const ns = genSala(rng, d, i, t.value, old.nome); ns.notas = old.notas||''; if (t.value!=='entrada' && t.value!=='chefe' && t.value!=='secreta') ns.nome = old.tipo==='entrada'||old.tipo==='chefe' ? rng.pick(TEMAS[d.params.tema].salas) : old.nome; ns.revelada = old.revelada;
    d.salas[i] = ns; S.dirty = true; render();
  }
});
let rzT; window.addEventListener('resize', ()=>{ clearTimeout(rzT); rzT = setTimeout(()=>{ const d = S.tab==='gerar' ? S.cur : (S.openPub ? S.publicas[S.openPub] : null); drawMap(d); }, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ const d = S.tab==='gerar' ? S.cur : (S.openPub ? S.publicas[S.openPub] : null); drawMap(d); });

/* ================= início ================= */
function subscribe(){
  const err = what => e => { S.notice = 'Não foi possível carregar '+what+' ('+h(e && (e.code||e.message))+').'; render(); };
  store.onMestres(ids=>{ S.mestres = ids; aplicarPapel(); carregarNomes(); }, ()=>{});
  if (S.mode==='db' && S.isOwner) store.onPessoas(ids=>{ S.pessoas = ids; carregarNomes(); render(); }, ()=>{});
  if (S.mode==='db' && S.myId && !S.isOwner) store.registrar(S.myId).catch(()=>{});
  aplicarPapel();
  store.onMonstros(m=>{ S.monTxt = m; if (!S.popEdit) render(); }, err('os textos dos monstros'));
  store.onPublicas(m=>{ S.publicas = m; if (S.openPub && !m[S.openPub]) S.openPub = null; render(); }, err('as masmorras visíveis'));
}
/* liga/desliga a visão de mestre quando a lista de mestres muda */
let listaUnsub = null, eraMestre = null;
function aplicarPapel(){
  const pode = podeMestrar();
  if (pode && !listaUnsub){
    listaUnsub = store.onLista(m=>{ S.lista = m; carregarNomes(); render(); }, e=>{ S.notice = 'Não foi possível carregar as masmorras salvas ('+h(e && (e.code||e.message))+').'; render(); }) || (()=>{});
  }
  if (!pode && listaUnsub){ try { listaUnsub(); } catch {} listaUnsub = null; S.lista = {}; }
  if (pode !== eraMestre){
    if (eraMestre !== null || !S.isOwner){
      S.viewAs = pode ? 'mestre' : 'jogador'; S.sel = null; S.openPub = null; S.tab = pode ? 'gerar' : 'jogador';
      if (pode && !S.cur){ S.cur = genDungeon({...S.params, semente:'exemplo-cripta'}); S.dirty = true; }
      if (!pode){ S.cur = null; S.dirty = false; }
    }
    eraMestre = pode;
  }
  render();
}
async function init(){
  S.cur = genDungeon({...S.params, semente:'exemplo-cripta'}); S.dirty = true;
  render();
  let db=null, user=null;
  if (window.claude && typeof window.claude.use==='function'){
    try {
      const timeout = new Promise(r=>setTimeout(()=>r([null,null]),10000));
      [db,user] = await Promise.race([Promise.all([window.claude.use('db'), window.claude.use('user')]), timeout]);
    } catch { db=null; user=null; }
  }
  if (db && user){
    S.mode = 'db'; store = makeDbStore(db);
    try { S.isOwner = !!(await user.isOwner()); } catch { S.isOwner = false; }
    try { S.myId = await user.id(); } catch {}
    S.userApi = user;
    S.viewAs = S.isOwner ? 'mestre' : 'jogador';
    if (!S.isOwner){ S.cur = null; S.dirty = false; }
  } else {
    S.mode = 'local'; store = makeLocalStore(); S.isOwner = true;
    S.notice = '<b>Modo demonstração.</b> O banco compartilhado não está disponível aqui, então as masmorras ficam só neste navegador. Use "Ver como" para testar a visão do jogador.';
  }
  S.loaded = true; subscribe(); render();
}
init();
</script>
