<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de Masmorras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho + abas; na mesa, mapa em pergaminho à esquerda e painel da sala à direita (empilha no celular).
   Visual escuro único, de propósito, igual ao app das fichas. */
:root{
  color-scheme:dark;
  --bg:#12100e; --panel:#1c1814; --panel2:#251f19; --line:#382e25; --line2:#4b3e32;
  --text:#eee5d3; --muted:#a8998a; --gold:#d1a84e; --gold2:#f0cd7a; --red:#cf5b43; --green:#74a96d; --blue:#6f9cc9; --orange:#d9853b; --violet:#a48bc9;
  --floor:#d8c9a3; --floorgrid:rgba(70,52,34,.20); --wall:#2b2119; --rock:#191512; --hatch:#3a3027; --ink:#3a2a1c; --sel:#b8402a;
  --display:Cinzel,Georgia,"Times New Roman",serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;margin:0;text-wrap:balance}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--line);background:linear-gradient(#1b1611,var(--bg))}
header h1{font-size:20px;color:var(--gold2)}
header .sub{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:99px;border:1px solid var(--line2);font-size:12px;color:var(--muted);white-space:nowrap}
.badge.gold{color:var(--gold2);border-color:var(--gold)}
nav{display:flex;gap:4px;padding-top:6px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--gold2);border-color:var(--gold)}
nav .count{background:var(--line2);color:var(--text);border-radius:99px;padding:0 7px;margin-left:6px;font-size:11px}
main{padding-block:18px 40px;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.notice{background:#2a2117;border:1px solid var(--line2);border-radius:var(--r);padding:10px 14px;color:var(--muted)}
.notice b{color:var(--text)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)} .small{font-size:12px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a140c;font-weight:600}
.btn.pri:hover{background:var(--gold2)}
.btn.danger{color:var(--red);border-color:#6a3328}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,nav button:focus-visible,.roomlink:focus-visible,.card:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{width:100%;min-height:80px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
.form .wide{grid-column:span 2}
@media (max-width:520px){.form .wide{grid-column:auto}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .nm{font-family:var(--display);font-size:18px;font-weight:700;color:var(--gold2);background:transparent;border:1px solid transparent;padding:4px 6px;width:min(520px,100%)}
.toolbar .nm:hover{border-color:var(--line2)}
.mesa{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:920px){.mesa{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mapwrap{overflow:auto;border-radius:6px;max-height:80vh}
#mapa{display:block;width:100%;cursor:pointer;touch-action:manipulation}
.mapwrap.zoom #mapa{width:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px;align-items:center;justify-content:space-between}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.side .panel h3{font-size:14px;color:var(--gold);margin-bottom:8px}
.side h2{font-size:19px;color:var(--gold2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.t-entrada{color:var(--gold2)} .t-combate{color:var(--red)} .t-chefe{color:#ff8a6b;background:rgba(207,91,67,.15)} .t-armadilha{color:var(--orange)}
.t-tesouro{color:var(--gold)} .t-misterio{color:var(--blue)} .t-descanso{color:var(--green)} .t-vazia{color:var(--muted)}
.rooms{display:flex;flex-direction:column;gap:2px}
.roomlink{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer}
.roomlink:hover{background:var(--panel2)}
.roomlink .n{font-family:var(--display);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.mon{display:flex;flex-direction:column;gap:6px}
.mon .m{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:6px}
.mon .m:last-child{border-bottom:0}
.mon .q{font-weight:600}
.en{color:var(--muted);font-size:12px}
.num{font-variant-numeric:tabular-nums}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
table.d6{width:100%;border-collapse:collapse;font-size:13px}
table.d6 td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
table.d6 td:first-child{width:2em;color:var(--gold);font-family:var(--display);font-weight:700;text-align:center}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer}
.card:hover{border-color:var(--gold)}
.card h2{font-size:16px;color:var(--gold2)}
.empty{padding:32px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{color:var(--text);font-size:17px}
.dirty{color:var(--orange);font-size:12px}
.ok{color:var(--green);font-size:12px}
.prose{max-width:65ch}
.rl{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline dotted var(--gold);text-underline-offset:3px;text-align:left}
.rl:hover{color:var(--gold2)}
.rl:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.pop-bg{position:fixed;inset:0;background:rgba(8,6,4,.72);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:20}
.pop{background:var(--panel);border:1px solid var(--gold);border-radius:var(--r);width:min(640px,100%);padding:18px;display:flex;flex-direction:column;gap:12px}
.pop h2{font-size:20px;color:var(--gold2)}
.atr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;text-align:center;border-block:1px solid var(--line);padding-block:8px}
.atr b{display:block;font-size:11px;letter-spacing:.08em;color:var(--gold)}
.atr span{font-variant-numeric:tabular-nums;font-size:13px}
.sb p{margin:0 0 6px} .sb p b{color:var(--gold2)}
.sb textarea{min-height:240px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= utilidades ================= */
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const fmt = n => Number(n).toLocaleString('pt-BR');
function hashStr(str){ let a=1779033703^str.length; for(let i=0;i<str.length;i++){ a=Math.imul(a^str.charCodeAt(i),3432918353); a=a<<13|a>>>19; } a=Math.imul(a^a>>>16,2246822507); a=Math.imul(a^a>>>13,3266489909); return (a^=a>>>16)>>>0; }
function makeRng(seed){
  let s = hashStr(String(seed));
  const f = () => { s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const R = {
    f, int:(a,b)=>a+Math.floor(f()*(b-a+1)), pick:arr=>arr[Math.floor(f()*arr.length)], chance:p=>f()<p,
    roll:(n,d)=>{ let t=0; for(let i=0;i<n;i++) t+=1+Math.floor(f()*d); return t; },
    shuffle:arr=>{ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(f()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; },
    weighted:obj=>{ let tot=0; for(const k in obj) tot+=obj[k]; let x=f()*tot; for(const k in obj){ x-=obj[k]; if(x<0) return k; } return Object.keys(obj)[0]; }
  };
  return R;
}
const SEED_WORDS=['lua','osso','ferro','cinza','corvo','brasa','nevoa','pedra','sal','espinho','raiz','prata','sombra','vela','cripta','dente'];

const newId = () => 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ================= regras: orçamento de XP (Livro do Mestre 2024) ================= */
/* XP por personagem: [Baixa, Moderada, Alta] */
const BUD = {1:[50,75,100],2:[100,150,200],3:[150,225,400],4:[250,375,500],5:[500,750,1100],6:[600,1000,1400],7:[750,1300,1700],8:[1000,1700,2100],9:[1300,2000,2600],10:[1600,2300,3100],11:[1900,2900,4100],12:[2200,3700,4700],13:[2600,4200,5400],14:[2900,4900,6200],15:[3300,5400,7800],16:[3800,6100,9800],17:[4500,7200,11700],18:[5000,8700,14200],19:[5500,10700,17200],20:[6400,13200,22000]};
const DIFS = ['Baixa','Moderada','Alta'];
const CRXP = {'0':10,'1/8':25,'1/4':50,'1/2':100,'1':200,'2':450,'3':700,'4':1100,'5':1800,'6':2300,'7':2900,'8':3900,'9':5000,'10':5900,'11':7200,'12':8400,'13':10000,'14':11500,'15':13000,'16':15000,'17':18000,'18':20000,'19':22000,'20':25000,'21':33000};

const TDC = {det:[12,14,16,18], sv:[13,15,17,19], dano:['2d10','4d10','8d10','12d10'], leve:['1d10','2d10','4d10','6d10']};

/* Monstros (nome, nome em inglês, ND, temas). Temas: c cripta, v caverna, f fortaleza, t templo, e esgoto, g covil, a arcana */
const MON = [
['Rato Gigante','Giant Rat','1/8','ve'],['Kobold Guerreiro','Kobold Warrior','1/8','vg'],['Bandido','Bandit','1/8','fe'],['Cultista','Cultist','1/8','t'],['Guarda','Guard','1/8','f'],
['Enxame de Ratos','Swarm of Rats','1/4','ec'],['Morcego Gigante','Giant Bat','1/4','vc'],['Esqueleto','Skeleton','1/4','cfa'],['Zumbi','Zombie','1/4','ce'],['Goblin Guerreiro','Goblin Warrior','1/4','gv'],
['Lobo','Wolf','1/4','g'],['Grimlock','Grimlock','1/4','v'],['Fungo Violeta','Violet Fungus','1/4','ve'],['Espada Voadora','Flying Sword','1/4','a'],['Dretch','Dretch','1/4','t'],['Acólito','Priest Acolyte','1/4','t'],
['Sombra','Shadow','1/2','ct'],['Hobgoblin Guerreiro','Hobgoblin Warrior','1/2','gf'],['Gnoll Guerreiro','Gnoll Warrior','1/2','gv'],['Worg','Worg','1/2','g'],['Lodo Cinzento','Gray Ooze','1/2','ve'],
['Crocodilo','Crocodile','1/2','e'],['Brutamontes','Tough','1/2','fe'],['Batedor','Scout','1/2','f'],['Cocatriz','Cockatrice','1/2','v'],
['Armadura Animada','Animated Armor','1','acf'],['Carniçal','Ghoul','1','ce'],['Aranha Gigante','Giant Spider','1','vc'],['Bugbear Guerreiro','Bugbear Warrior','1','g'],['Goblin Chefe','Goblin Boss','1','g'],
['Diabrete','Imp','1','ta'],['Quasit','Quasit','1','t'],['Espectro','Specter','1','c'],['Espião','Spy','1','fe'],
['Lívido','Ghast','2','ce'],['Cubo Gelatinoso','Gelatinous Cube','2','vea'],['Gosma Ocre','Ochre Jelly','2','ve'],['Mímico','Mimic','2','av'],['Ogro','Ogre','2','vgf'],['Zumbi Ogro','Ogre Zombie','2','c'],

['Otyugh','Otyugh','5','ev'],['Troll','Troll','5','vg'],['Aparição','Wraith','5','c'],['Cria Vampírica','Vampire Spawn','5','ce'],['Golem de Carne','Flesh Golem','5','a'],['Elemental da Terra','Earth Elemental','5','av'],

['Vampiro','Vampire','13','c'],['Nalfeshnee','Nalfeshnee','13','t'],['Dragão Negro Adulto','Adult Black Dragon','14','ve'],
['Múmia Senhora','Mummy Lord','15','c'],['Verme Púrpura','Purple Worm','15','v'],['Golem de Ferro','Iron Golem','16','a'],['Marilith','Marilith','16','t'],
['Dragão Vermelho Adulto','Adult Red Dragon','17','vfg'],['Balor','Balor','19','t'],['Pit Fiend','Pit Fiend','20','t'],['Lich','Lich','21','ca'],['Dragão Negro Ancião','Ancient Black Dragon','21','ve']
].map(([pt,en,cr,tags]) => ({pt,en,cr,xp:CRXP[cr],tags}));
const MON_BY_EN = Object.fromEntries(MON.map(m=>[m.en,m]));
const MON_BY_PT = Object.fromEntries(MON.map(m=>[m.pt,m]));

/* ================= fichas resumidas dos monstros =================
   Resumo baseado no SRD (valores do SRD 5.1, com ajustes do 5.2 onde conhecidos). O mestre pode substituir o texto.
   S(en, CA, PV, deslocamento, "FOR DES CON INT SAB CAR", "Linha 1|Linha 2|...") — cada linha começa com "Nome." */
const STATS = {};
function S_(en, ca, pv, desl, atr, txt){ STATS[en] = {ca, pv, desl, atr:atr.split(' ').map(Number), linhas:txt.split('|')}; }
S_('Giant Rat',13,'7 (2d6)','9 m, escalada 9 m','7 15 11 2 10 4','Sentidos. Visão no Escuro 18 m.|Táticas de Matilha. Vantagem no ataque se um aliado estiver a 1,5 m do alvo.|Mordida. Corpo a corpo +4 (1,5 m). Acerto: 4 (1d4+2) Perfurante.');
S_('Kobold Warrior',14,'7 (3d6−3)','9 m','7 15 9 8 7 8','Sentidos. Visão no Escuro 18 m.|Sensibilidade à Luz Solar. Desvantagem em ataques e Percepção sob luz do sol.|Táticas de Matilha. Vantagem no ataque se um aliado estiver a 1,5 m do alvo.|Adaga. Corpo a corpo ou arremesso +4 (1,5 m ou 6/18 m). Acerto: 4 (1d4+2) Perfurante.');

S_('Swarm of Rats',10,'14 (4d8−4)','9 m','9 11 9 2 10 3','Resistências. Contundente, Cortante, Perfurante.|Enxame. Ocupa o espaço de outra criatura e passa por frestas de rato; não recupera PV nem ganha PV temporários.|Mordidas. Corpo a corpo +2 (1,5 m), alvo no espaço do enxame. Acerto: 7 (2d6) Perfurante, ou 3 (1d6) se o enxame tiver metade dos PV ou menos.');
S_('Giant Bat',13,'22 (4d10)','3 m, voo 18 m','15 16 11 2 12 6','Ecolocalização. Percepção às Cegas 18 m; não funciona Surdo.|Mordida. Corpo a corpo +5 (1,5 m). Acerto: 6 (1d6+3) Perfurante.');

S_('Zombie',8,'15 (2d8+6)','6 m','13 6 16 3 6 5','Imune. Veneno; Exaustão, Envenenado.|Fortitude de Morto-Vivo. Se o dano o levaria a 0 PV, Constituição CD 5 + dano (exceto Radiante ou acerto crítico): sucesso, fica com 1 PV.|Pancada. Corpo a corpo +3 (1,5 m). Acerto: 5 (1d8+1) Contundente.');

const monSlug = en => String(en).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const mod = v => { const m = Math.floor((v-10)/2); return (m>=0?'+':'−')+Math.abs(m); };
/* troca nomes de monstros conhecidos dentro de um texto por links (nomes mais longos primeiro) */
const MON_RE = new RegExp('('+MON.map(m=>m.pt).sort((a,b)=>b.length-a.length).map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
const linkMon = txt => h(txt).replace(MON_RE, n => MON_BY_PT[n] ? `<button class="rl" data-act="mon" data-en="${h(MON_BY_PT[n].en)}">${n}</button>` : n);

/* ================= gerador de mapa ================= */
const SIZES = {pequena:{w:40,h:30,n:[6,8],nome:'Pequena (6–8 salas)'}, media:{w:54,h:38,n:[10,13],nome:'Média (10–13 salas)'}, grande:{w:68,h:48,n:[15,19],nome:'Grande (15–19 salas)'}};
function genMap(rng, tamanho, tema){
  const Z = SIZES[tamanho]||SIZES.media, W=Z.w, H=Z.h, alvo=rng.int(Z.n[0],Z.n[1]);
  const g = new Uint8Array(W*H); let rooms=[];
  for(let a=0; a<900 && rooms.length<alvo; a++){
    const w=rng.int(4,9), hh=rng.int(4,8), x=rng.int(1,W-w-1), y=rng.int(1,H-hh-1);
    if (rooms.some(r => x<r.x+r.w+2 && x+w+2>r.x && y<r.y+r.h+2 && y+hh+2>r.y)) continue;
    rooms.push({x,y,w,h:hh});
  }
  const cen = r => [r.x+(r.w>>1), r.y+(r.h>>1)];
  const dist = (a,b) => { const [p,q]=cen(a),[s,t]=cen(b); return Math.hypot(p-s,q-t); };
  /* árvore mínima + alguns atalhos para criar ciclos */
  const edges=[], inT=[0], rest=rooms.map((_,i)=>i).slice(1);
  while(rest.length){ let best=null; for(const i of inT) for(const j of rest){ const d=dist(rooms[i],rooms[j]); if(!best||d<best[2]) best=[i,j,d]; } edges.push([best[0],best[1]]); inT.push(best[1]); rest.splice(rest.indexOf(best[1]),1); }
  const has = (i,j) => edges.some(e => (e[0]===i&&e[1]===j)||(e[0]===j&&e[1]===i));
  for(let k=0;k<Math.max(1,Math.round(rooms.length*.18));k++){
    const i=rng.int(0,rooms.length-1); const c=rooms.map((r,j)=>[j,dist(rooms[i],r)]).filter(([j])=>j!==i&&!has(i,j)).sort((a,b)=>a[1]-b[1]);
    if (c.length && c[0][1] < 22) edges.push([i,c[0][0]]);
  }
  /* entrada = sala mais perto da borda; numeração em ordem de exploração (busca em largura) */
  const adj = rooms.map(()=>[]); edges.forEach(([a,b])=>{ adj[a].push(b); adj[b].push(a); });
  let ent=0, bd=1e9; rooms.forEach((r,i)=>{ const d=Math.min(r.x, r.y, W-(r.x+r.w), H-(r.y+r.h)); if(d<bd){bd=d; ent=i;} });
  const order=[ent], depth={[ent]:0}; for(let q=0;q<order.length;q++){ const u=order[q]; for(const v of adj[u]) if(depth[v]===undefined){ depth[v]=depth[u]+1; order.push(v); } }
  const maxD = Math.max(...order.map(i=>depth[i]));
  const boss = order.filter(i=>depth[i]===maxD).sort((a,b)=>rooms[b].w*rooms[b].h-rooms[a].w*rooms[a].h)[0];
  const ord = order.filter(i=>i!==boss).concat([boss]);
  const remap = {}; ord.forEach((old,nw)=>remap[old]=nw);
  rooms = ord.map(i=>rooms[i]);
  const conex = edges.map(([a,b])=>({a:remap[a], b:remap[b]}));
  rooms.forEach(r=>{ for(let j=r.y;j<r.y+r.h;j++) for(let i=r.x;i<r.x+r.w;i++) g[j*W+i]=1; });
  const roomAt = (x,y) => rooms.findIndex(r => x>=r.x && x<r.x+r.w && y>=r.y && y<r.y+r.h);
  const doors = new Map();
  for(const {a,b} of conex){
    const [x0,y0]=cen(rooms[a]), [x1,y1]=cen(rooms[b]); const path=[[x0,y0]]; let x=x0, y=y0;
    const sx=()=>{ while(x!==x1){ x+=Math.sign(x1-x); path.push([x,y]); } }, sy=()=>{ while(y!==y1){ y+=Math.sign(y1-y); path.push([x,y]); } };
    if (rng.chance(.5)){ sx(); sy(); } else { sy(); sx(); }
    let prev = roomAt(x0,y0);
    for(let k=1;k<path.length;k++){
      const [px,py]=path[k], ri=roomAt(px,py);
      if (ri<0 && g[py*W+px]===0) g[py*W+px]=2;
      if (prev>=0 && ri<0) doors.set(px+','+py,{x:px,y:py});
      if (prev<0 && ri>=0){ const [qx,qy]=path[k-1]; doors.set(qx+','+qy,{x:qx,y:qy}); }
      prev=ri;
    }
  }
  const at = (i,j) => (i<0||j<0||i>=W||j>=H) ? 0 : g[j*W+i];
  /* porta só onde a passagem tem exatamente dois lados abertos e opostos */
  const dl = [];
  for (const d of doors.values()){
    const L=!!at(d.x-1,d.y), R=!!at(d.x+1,d.y), U=!!at(d.x,d.y-1), D=!!at(d.x,d.y+1);
    if ((L&&R&&!U&&!D) || (U&&D&&!L&&!R)) dl.push({x:d.x, y:d.y, o:(L&&R)?'h':'v', t:rng.weighted({normal:70,trancada:14,secreta:8,emperrada:8})});
  }
  if (tema==='caverna'){
    /* bordas irregulares nas grutas */
    const keep = new Set(); dl.forEach(d=>{ for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) keep.add((d.x+dx)+','+(d.y+dy)); });
    rooms.forEach(r=>{
      for(let j=r.y;j<r.y+r.h;j++) for(let i=r.x;i<r.x+r.w;i++){
        const edge = i===r.x||j===r.y||i===r.x+r.w-1||j===r.y+r.h-1, corner=(i===r.x||i===r.x+r.w-1)&&(j===r.y||j===r.y+r.h-1);
        if (!edge || keep.has(i+','+j)) continue;
        const nearCorr = [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>at(i+dx,j+dy)===2);
        if (!nearCorr && (corner || rng.chance(.35))) g[j*W+i]=0;
      }
      for(let j=r.y-1;j<=r.y+r.h;j++) for(let i=r.x-1;i<=r.x+r.w;i++){
        if (i<1||j<1||i>=W-1||j>=H-1) continue;
        const out = i<r.x||j<r.y||i>=r.x+r.w||j>=r.y+r.h, corner=(i<r.x||i>=r.x+r.w)&&(j<r.y||j>=r.y+r.h);
        if (out && !corner && g[j*W+i]===0 && rng.chance(.18)) g[j*W+i]=1;
      }
    });
  }
  return {w:W, h:H, grid:Array.from(g).join(''), doors:dl, rooms, conex};
}

function poolFor(tema){ const t=TEMAS[tema].tag; return MON.filter(m=>m.tags.includes(t)); }
function buildEncounter(rng, p, dif, chefe){
  const per = BUD[p.nivel][dif]; let alvo = per*p.jogadores; if (chefe && p.ritmo==='pesado') alvo=Math.round(alvo*1.25);
  const pool = poolFor(p.tema);
  const fits = (list,lo,hi) => list.filter(m=>m.xp<=hi && m.xp>=lo);
  let cand = fits(pool, alvo/(chefe?4:10), alvo*(chefe?.85:1)); if (cand.length<2) cand = fits(MON, alvo/(chefe?4:10), alvo*(chefe?.85:1));
  if (!cand.length) cand = [MON.filter(m=>m.xp<=alvo).sort((a,b)=>b.xp-a.xp)[0] || MON[0]];
  let prim, n;
  if (chefe){ const sorted=[...cand].sort((a,b)=>b.xp-a.xp); prim = rng.pick(sorted.slice(0,Math.max(1,Math.ceil(sorted.length/3)))); n=1; }
  else { prim = rng.pick(cand); const maxN=Math.max(1,Math.min(8,Math.floor(alvo/prim.xp))); n=Math.max(1,Math.round(maxN*(.6+.4*rng.f()))); }
  const grupos=[{pt:prim.pt,en:prim.en,cr:prim.cr,xp:prim.xp,qtd:n}];
  let resto = alvo - n*prim.xp;
  if (resto >= alvo*.2){
    let c2 = pool.filter(m=>m.xp<=resto && m.pt!==prim.pt && m.xp>=resto/6); if(!c2.length) c2 = MON.filter(m=>m.xp<=resto && m.pt!==prim.pt && m.xp>=resto/6);
    if (c2.length){ const s=rng.pick(c2); const k=Math.max(1,Math.min(6,Math.floor(resto/s.xp))); grupos.push({pt:s.pt,en:s.en,cr:s.cr,xp:s.xp,qtd:k}); }
  }
  const xp = grupos.reduce((t,gp)=>t+gp.xp*gp.qtd,0);
  return {dif, orcamento:alvo, xp, grupos, comport:''};
}
const fill = (txt, ctx) => txt.replace(/\{(\w+)\}/g,(m,k)=>ctx[k]!==undefined?ctx[k]:m).replace(/\bde o /g,'do ').replace(/\bde a /g,'da ').replace(/^(o|a) /,c=>c.toUpperCase());
function pickItem(rng, rar){ return fill(rng.pick(ITENS[rar]), {arma:rng.pick(ARMAS), armadura:rng.pick(ARMADURAS)}) + ' · '+RAR_NOME[rar]; }
function gem(rng, v){ return rng.pick(GEMAS[v])+' ('+fmt(v)+' PO)'; }
function individual(rng,t){ return t===1?rng.roll(3,6)+' PO' : t===2?fmt(rng.roll(2,8)*10)+' PO' : t===3?fmt(rng.roll(2,10)*10)+' PL' : fmt(rng.roll(2,8)*100)+' PL'; }
function pouco(rng,t){ return individual(rng,t); }
function genTesouro(rng, t, tipo){
  const itens=[]; let moedas;
  if (tipo==='chefe'){
    moedas = t===1 ? fmt(rng.roll(2,4)*100)+' PO' : t===2 ? fmt(rng.roll(2,6)*100)+' PO e '+fmt(rng.roll(3,6)*10)+' PL' : t===3 ? fmt(rng.roll(4,6)*1000)+' PO e '+fmt(rng.roll(5,6)*100)+' PL' : fmt(rng.roll(12,6)*1000)+' PO e '+fmt(rng.roll(8,6)*1000)+' PL';
    const gv = {1:[10,50],2:[50,100],3:[100,500,1000],4:[1000,5000]}[t]; const ng=rng.int(1,3)+t-1;
    for(let i=0;i<ng;i++) itens.push(gem(rng, rng.pick(gv)));
    const av = {1:25,2:250,3:750,4:2500}[t]; if (rng.chance(.6)) itens.push(rng.pick(ARTE[av])+' ('+fmt(av)+' PO)');
    const nm = t<=2 ? rng.int(1,3) : rng.int(1,4);
    for(let i=0;i<nm;i++) itens.push(pickItem(rng, rng.weighted(RAR_TIER[t])));
  } else if (tipo==='tesouro'){
    moedas = individual(rng,t)+' + '+individual(rng,t)+' + '+individual(rng,t);
    itens.push(gem(rng, {1:10,2:50,3:100,4:1000}[t]));
    if (rng.chance(.45)){ const r=RAR_TIER[t]; const low=Object.keys(r)[0]; itens.push(pickItem(rng, low)); }
  } else {
    moedas = individual(rng,t);
    if (rng.chance(.15)) itens.push(pickItem(rng, Object.keys(RAR_TIER[t])[0]));
  }
  return {moedas, itens};
}
function genSala(rng, d, i, tipo, nomeUsado){
  const p=d.params, T=TEMAS[p.tema], t=tierOf(p.nivel), r=d.mapa.rooms[i], ns=d.mapa.rooms.length;
  let k = rng.int(1,ns); if (k===i+1) k = (k % ns)+1;
  const ctx = {det:TDC.det[t-1], sv:TDC.sv[t-1], dano:TDC.dano[t-1], leve:TDC.leve[t-1], k, n:d.vilao, pouco:pouco(rng,t)};
  const s = {tipo, nome:'', desc:'', sentido:rng.pick(T.sentidos), encontro:null, armadilha:null, tesouro:null, misterio:'', descanso:'', pista:'', notas:''};
  const det = rng.shuffle(T.detalhes);
  if (tipo==='entrada'){ s.nome='Entrada'; s.desc = rng.pick(T.entrada)+' '+det[0]; }
  else if (tipo==='chefe'){ s.nome = fill(rng.pick(T.chefe), ctx); s.desc = det[0]+' '+det[1]; }
  else { s.nome = nomeUsado || rng.pick(T.salas); s.desc = det[0] + (rng.chance(.5)?' '+det[1]:''); }
  const ritmo = {leve:{0:6,1:3,2:1}, padrao:{0:4,1:4,2:2}, pesado:{0:2,1:4,2:4}}[p.ritmo] || {0:4,1:4,2:2};
  const enc = chefe => { const e = buildEncounter(rng, p, chefe?2:+rng.weighted(ritmo), chefe); e.comport = fill(chefe?'O chefe, {n}, lidera os defensores e luta até o fim, a menos que os personagens ofereçam algo que deseje mais do que a vitória.':rng.pick(COMPORT), ctx); return e; };
  if (tipo==='combate'){ s.encontro = enc(false); if (rng.chance(.5)) s.tesouro = genTesouro(rng,t,'individual'); }
  if (tipo==='chefe'){ s.encontro = enc(true); s.tesouro = genTesouro(rng,t,'chefe'); }
  if (tipo==='entrada' && rng.chance(.35)){ s.encontro = buildEncounter(rng,p,0,false); s.encontro.comport = 'Vigiam a entrada; um deles corre para dar o alarme na sala '+Math.min(2,ns)+'.'; }
  if (tipo==='armadilha'){ const a=rng.pick(ARMADILHAS); s.armadilha = {nome:a.nome, gatilho:a.gat, efeito:fill(a.ef,ctx), det:ctx.det}; if (rng.chance(.35)) s.tesouro = genTesouro(rng,t,'individual'); }
  if (tipo==='tesouro'){ s.tesouro = genTesouro(rng,t,'tesouro'); if (rng.chance(.4)){ const a=rng.pick(ARMADILHAS); s.armadilha={nome:a.nome, gatilho:'Mexer no tesouro', efeito:fill(a.ef,ctx), det:ctx.det}; } }
  if (tipo==='misterio') s.misterio = fill(rng.pick(MISTERIOS), ctx);
  if (tipo==='descanso') s.descanso = rng.pick(DESCANSOS);
  if (tipo==='vazia') s.pista = fill(rng.pick(PISTAS), ctx);
  return s;
}
function genErrantes(rng, d){
  const out=[]; for(let i=0;i<6;i++){ const e=buildEncounter(rng, d.params, 0, false); out.push(e.grupos.map(gp=>gp.qtd+'× '+gp.pt).join(' e ')+' ('+fmt(e.xp)+' XP)'); }
  return out;
}
function genDungeon(params){
  const p = {...params, nivel:Math.max(1,Math.min(20,+params.nivel||1)), jogadores:Math.max(1,Math.min(8,+params.jogadores||4))};
  const semente = (p.semente||'').trim() || randSeed();
  const rng = makeRng(semente+'|'+p.tema+'|'+p.tamanho+'|'+p.nivel+'|'+p.jogadores+'|'+p.ritmo);
  const T = TEMAS[p.tema];
  const vilao = rng.pick(T.nomes);
  const mapa = genMap(rng, p.tamanho, p.tema);
  const ns = mapa.rooms.length;
  const d = {id:null, nome:(p.nome||'').trim() || fill(rng.pick(T.titulos),{n:vilao}), vilao, gancho:fill(rng.pick(T.ganchos),{n:vilao}), semente,
    params:{tema:p.tema, tamanho:p.tamanho, nivel:p.nivel, jogadores:p.jogadores, ritmo:p.ritmo}, mapa, salas:[], errantes:[], publicada:false, criada:Date.now(), atualizada:Date.now()};
  const tipos = ['entrada'];
  for(let i=1;i<ns-1;i++) tipos.push(rng.weighted({combate:40, armadilha:13, tesouro:9, vazia:18, misterio:12, descanso:5}));
  tipos.push('chefe');
  if (ns>=6){
    if (!tipos.includes('tesouro')) tipos[rng.int(1,ns-2)]='tesouro';
    if (!tipos.includes('armadilha')){ let j=rng.int(1,ns-2); if (tipos[j]==='tesouro') j = j===1?2:j-1; tipos[j]='armadilha'; }
  }
  const nomes = rng.shuffle(T.salas); let ni=0;
  d.salas = tipos.map((tp,i)=>genSala(rng, d, i, tp, nomes[(ni++)%nomes.length]));
  d.errantes = genErrantes(rng, d);
  return d;
}

function playerCopy(d){ const c = clone(d); c.salas.forEach(s=>{ delete s.notas; }); return c; }

function makeLocalStore(){
  let mem = {masmorras:{}, publicas:{}};
  try { const raw = localStorage.getItem('gerador-masmorras-demo'); if (raw) mem = JSON.parse(raw); } catch {}
  const persist = () => { try { localStorage.setItem('gerador-masmorras-demo', JSON.stringify(mem)); } catch {} };
  const L=[], P=[], M=[];
  return {
    onLista(cb){ L.push(cb); setTimeout(()=>cb(clone(mem.masmorras))); },
    onPublicas(cb){ P.push(cb); setTimeout(()=>cb(clone(mem.publicas))); },
    async save(d){ mem.masmorras[d.id]=clone(d); if (d.publicada) mem.publicas[d.id]=playerCopy(d); else delete mem.publicas[d.id]; persist(); L.forEach(f=>f(clone(mem.masmorras))); P.forEach(f=>f(clone(mem.publicas))); },
    async remove(id){ delete mem.masmorras[id]; delete mem.publicas[id]; persist(); L.forEach(f=>f(clone(mem.masmorras))); P.forEach(f=>f(clone(mem.publicas))); },
    onMonstros(cb){ M.push(cb); setTimeout(()=>cb(clone(mem.monstros||{}))); },
    async saveMonstro(slug, texto){ mem.monstros = mem.monstros||{}; mem.monstros[slug] = {texto}; persist(); M.forEach(f=>f(clone(mem.monstros))); },
    async delMonstro(slug){ if (mem.monstros) delete mem.monstros[slug]; persist(); M.forEach(f=>f(clone(mem.monstros||{}))); }
  };
}
function makeDbStore(db){
  const chain = {};
  const q = (k,fn) => (chain[k] = (chain[k]||Promise.resolve()).catch(()=>{}).then(fn));
  const toMap = s => { const m={}; s.docs.forEach(x=>{ if (x.exists) m[x.id] = {...clone(x.data()), id:x.id}; }); return m; };
  return {
    onLista(cb, err){ return db.collection('masmorras').onSnapshot(s=>cb(toMap(s)), err); },
    onPublicas(cb, err){ return db.collection('publicas').onSnapshot(s=>cb(toMap(s)), err); },
    save(d){ const {id, ...rest} = clone(d); return q(id, async ()=>{
      await db.doc('masmorras/'+id).set(rest);
      if (d.publicada){ const {id:_, ...pub} = playerCopy(d); await db.doc('publicas/'+id).set(pub); }
      else { await db.doc('publicas/'+id).delete().catch(()=>{}); }
    }); },
    remove(id){ return q(id, async ()=>{ await db.doc('publicas/'+id).delete().catch(()=>{}); await db.doc('masmorras/'+id).delete(); }); },
    onMonstros(cb, err){ return db.collection('monstros').onSnapshot(s=>cb(toMap(s)), err); },
    saveMonstro(slug, texto){ return q('mon:'+slug, ()=>db.doc('monstros/'+slug).set({texto})); },
    delMonstro(slug){ return q('mon:'+slug, ()=>db.doc('monstros/'+slug).delete()); }
  };
}

/* ================= desenho do mapa ================= */
function drawMap(d){
  const cv = document.getElementById('mapa'); if (!cv || !d) return;
  const wrap = cv.parentElement, m = d.mapa;
  const cssW = S.zoom ? m.w*18 : wrap.clientWidth; if (!cssW) return;
  const c = cssW/m.w, cssH = c*m.h, dpr = window.devicePixelRatio||1;
  cv.width = Math.round(cssW*dpr); cv.height = Math.round(cssH*dpr); cv.style.width = cssW+'px'; cv.style.height = cssH+'px';
  const x = cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  const G = m.grid, at = (i,j) => (i<0||j<0||i>=m.w||j>=m.h) ? 0 : +G[j*m.w+i];
  x.fillStyle = col('--rock'); x.fillRect(0,0,cssW,cssH);
  /* hachura da rocha junto às paredes */
  x.strokeStyle = col('--hatch'); x.lineWidth = 1; x.beginPath();
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++){
    if (at(i,j)) continue; let near=false; for(let dy=-1;dy<=1&&!near;dy++) for(let dx=-1;dx<=1;dx++) if (at(i+dx,j+dy)){ near=true; break; }
    if (!near) continue; const px=i*c, py=j*c;
    x.moveTo(px,py+c); x.lineTo(px+c,py);
    x.moveTo(px,py+c/2); x.lineTo(px+c/2,py); x.moveTo(px+c/2,py+c); x.lineTo(px+c,py+c/2);
  }
  x.stroke();
  x.fillStyle = col('--floor');
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++) if (at(i,j)) x.fillRect(i*c, j*c, c+.5, c+.5);
  x.strokeStyle = col('--floorgrid'); x.lineWidth = 1; x.beginPath();
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++) if (at(i,j)) x.rect(i*c+.5, j*c+.5, c-1, c-1);
  x.stroke();
  /* paredes */
  x.strokeStyle = col('--wall'); x.lineWidth = Math.max(2, c*.18); x.lineCap='square'; x.beginPath();
  for(let j=0;j<m.h;j++) for(let i=0;i<m.w;i++){
    if (!at(i,j)) continue; const px=i*c, py=j*c;
    if (!at(i,j-1)){ x.moveTo(px,py); x.lineTo(px+c,py); }
    if (!at(i,j+1)){ x.moveTo(px,py+c); x.lineTo(px+c,py+c); }
    if (!at(i-1,j)){ x.moveTo(px,py); x.lineTo(px,py+c); }
    if (!at(i+1,j)){ x.moveTo(px+c,py); x.lineTo(px+c,py+c); }
  }
  x.stroke();
  /* portas */
  const showSecret = isMestre();
  m.doors.forEach(dr=>{
    const cx=dr.x*c+c/2, cy=dr.y*c+c/2, horiz = dr.o==='h'; const dw = horiz? c*.32 : c*.86, dh = horiz? c*.86 : c*.32;
    if (dr.t==='secreta'){
      x.strokeStyle = col('--wall'); x.lineWidth = Math.max(2,c*.18); x.beginPath();
      if (horiz){ x.moveTo(cx,dr.y*c); x.lineTo(cx,dr.y*c+c); } else { x.moveTo(dr.x*c,cy); x.lineTo(dr.x*c+c,cy); } x.stroke();
      if (showSecret){ x.fillStyle = col('--sel'); x.font = `700 ${Math.max(8,c*.7)}px ${col('--display')}`; x.textAlign='center'; x.textBaseline='middle'; x.fillText('S', cx + (horiz? c*.32:0), cy + (horiz?0:-c*.32)); }
      return;
    }
    x.fillStyle = dr.t==='trancada' ? col('--wall') : col('--floor');
    x.fillRect(cx-dw/2, cy-dh/2, dw, dh);
    x.strokeStyle = col('--wall'); x.lineWidth = Math.max(1, c*.08); x.strokeRect(cx-dw/2, cy-dh/2, dw, dh);
    if (dr.t==='emperrada'){ x.beginPath(); x.moveTo(cx-dw/2,cy-dh/2); x.lineTo(cx+dw/2,cy+dh/2); x.stroke(); }
  });
  /* escada na entrada */
  const e = m.rooms[0]; if (e){ const sx=(e.x+1)*c, sy=(e.y+1)*c; x.strokeStyle=col('--ink'); x.lineWidth=Math.max(1,c*.08); x.beginPath(); for(let k=0;k<5;k++){ const yy=sy+k*c/5+c*.1; x.moveTo(sx+c*.1,yy); x.lineTo(sx+c*.9,yy); } x.stroke(); }
  /* números das salas */
  x.textAlign='center'; x.textBaseline='middle';
  m.rooms.forEach((r,i)=>{
    const fs = Math.max(9, Math.min(c*1.1, 22)); x.font = `700 ${fs}px ${col('--display')}`;
    const cx=(r.x+r.w/2)*c, cy=(r.y+r.h/2)*c;
    x.fillStyle = col('--ink'); x.fillText(String(i+1), cx, cy);
    if (S.sel===i){ x.strokeStyle = col('--sel'); x.lineWidth = Math.max(2,c*.2); x.strokeRect(r.x*c+c*.2, r.y*c+c*.2, r.w*c-c*.4, r.h*c-c*.4); }
  });
}
function mapClick(e, d){
  const cv = e.currentTarget, rc = cv.getBoundingClientRect(), m = d.mapa;
  const i = Math.floor((e.clientX-rc.left)/rc.width*m.w), j = Math.floor((e.clientY-rc.top)/rc.height*m.h);
  const idx = m.rooms.findIndex(r => i>=r.x && i<r.x+r.w && j>=r.y && j<r.y+r.h);
  if (idx>=0){ S.sel = S.sel===idx ? null : idx; render(); const side=document.querySelector('.side'); if (side && window.innerWidth<=920) side.scrollIntoView({behavior:'smooth', block:'start'}); }
}

  let body;
  if (S.popEdit) body = `<textarea id="mon-txt" aria-label="Texto da ficha">${h(custom ?? base)}</textarea>
      <p class="small muted" style="margin:0">Uma linha por item. O trecho até o primeiro ponto aparece em destaque.</p>
      <div class="row"><button class="btn pri" data-act="mon-save">Salvar texto</button><button class="btn" data-act="mon-cancel">Cancelar</button></div>`;
  else body = statLinesHtml((custom ?? base).split('\n').filter(x=>x.trim())) || '<p class="muted">Ainda não há resumo para este monstro.</p>';
  return `<div class="pop-bg" data-act="pop-bg"><div class="pop" data-act="noop" role="dialog" aria-modal="true" aria-label="Ficha de ${h(m.pt)}">
    <div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>${h(m.pt)}</h2><div class="en">${h(m.en)} · ND ${h(m.cr)} · ${fmt(m.xp)} XP</div></div><button class="btn sm" data-act="pop-close" id="pop-close">Fechar</button></div>
    ${st?`<dl class="kv"><dt>Classe de Armadura</dt><dd>${st.ca}</dd><dt>Pontos de Vida</dt><dd>${h(st.pv)}</dd><dt>Deslocamento</dt><dd>${h(st.desl)}</dd></dl>
    <div class="atr">${st.atr.map((v,i)=>`<div><b>${NOMES_ATR[i]}</b><span>${v} (${mod(v)})</span></div>`).join('')}</div>`:''}
    <div class="sb">${body}</div>
    ${S.popEdit?'':`<div class="row" style="justify-content:space-between"><span class="small muted">${custom!=null?'Texto editado pelo mestre.':'Resumo do SRD; confira o livro em caso de dúvida.'}</span>
      ${isMestre()?`<span class="row"><button class="btn sm" data-act="mon-edit">Editar texto</button>${custom!=null?`<button class="btn sm danger" data-act="mon-reset">${S.popResetArm?'Confirmar: voltar ao resumo':'Voltar ao resumo'}</button>`:''}</span>`:''}</div>`}
  </div></div>`;
}
function viewMesa(d, edit){
  const toolbar = edit ? `<div class="toolbar">
      <input class="nm" id="nome-masmorra" data-nome value="${h(d.nome)}" aria-label="Nome da masmorra">
      <div class="row">
        <span class="muted small">Semente <b class="num">${h(d.semente)}</b></span>
        ${S.dirty?'<span class="dirty">Alterações não salvas</span>':(d.id?'<span class="ok">Salva</span>':'')}
        <button class="btn ${S.dirty||!d.id?'pri':''}" data-act="salvar" ${S.saving?'disabled':''}>${S.saving?'Salvando…':'Salvar'}</button>
        <button class="btn" data-act="publicar" ${S.saving?'disabled':''}>${d.publicada?'Ocultar dos jogadores':'Mostrar aos jogadores'}</button>
        ${d.publicada?'<span class="badge gold">Visível aos jogadores</span>':'<span class="badge">Só o mestre vê</span>'}
      </div></div>`
    : `<div class="toolbar"><h2 style="color:var(--gold2);font-size:20px">${h(d.nome)}</h2><button class="btn" data-act="voltar">← Todas as masmorras</button></div>`;
  return `${toolbar}<div class="mesa">
    <div class="mapbox"><div class="mapwrap ${S.zoom?'zoom':''}"><canvas id="mapa" role="img" aria-label="Mapa da masmorra ${h(d.nome)}"></canvas></div>
      <div class="legend"><span>1 quadrado = 1,5 m · toque numa sala para ver os detalhes${edit?' · S = porta secreta':''} · porta escura = trancada</span><button class="btn sm" data-act="zoom">${S.zoom?'Ajustar à tela':'Ampliar mapa'}</button></div></div>
    <aside class="side">${S.sel==null ? overview(d,edit) : roomView(d,S.sel,edit)}</aside></div>`;
}
function cards(map, actOpen, master){
  const list = Object.values(map).sort((a,b)=>(b.atualizada||0)-(a.atualizada||0));
  return `<div class="grid-cards">${list.map(d=>`<div class="card" tabindex="0" role="button" data-act="${actOpen}" data-id="${h(d.id)}">
    <h2>${h(d.nome)}</h2>
    <div class="row"><span class="badge gold">${h(TEMAS[d.params.tema]?.nome||'')}</span><span class="badge">Nível ${d.params.nivel}</span><span class="badge">${d.salas.length} salas</span>${master?(d.publicada?'<span class="badge gold">Visível aos jogadores</span>':'<span class="badge">Só o mestre</span>'):''}</div>
    <p class="muted small" style="margin:0">${h(d.gancho)}</p>
    ${master?`<div class="row"><button class="btn sm danger" data-act="excluir" data-id="${h(d.id)}">${S.delArm===d.id?'Confirmar exclusão':'Excluir'}</button></div>`:''}
  </div>`).join('')}</div>`;
}
function viewSalvas(){
  const n = Object.keys(S.lista).length;
  if (!n) return `<div class="panel empty"><h2>Nenhuma masmorra salva</h2><p>Gere uma masmorra na aba Gerador e clique em Salvar. Ela aparece aqui para você abrir depois.</p><button class="btn pri" data-act="tab" data-tab="gerar">Ir para o Gerador</button></div>`;
  return cards(S.lista, 'abrir', true);
}
function viewJogador(){
  if (S.openPub && S.publicas[S.openPub]) return viewMesa(S.publicas[S.openPub], false);
  const n = Object.keys(S.publicas).length;
  if (!n) return `<div class="panel empty"><h2>Nenhuma masmorra à vista</h2><p>Quando o mestre mostrar uma masmorra, ela aparece aqui com o mapa.</p></div>`;
  return cards(S.publicas, 'ver', false);
}
function render(){
  const mestre = isMestre();
  if (!mestre) S.tab = 'jogador'; else if (S.tab==='jogador') S.tab='gerar';
  const nl = Object.keys(S.lista).length;
  const tabs = mestre ? [['gerar','Gerador'],['salvas','Masmorras salvas',nl]] : [['jogador','Masmorras']];
  let body = '';
  if (S.tab==='gerar') body = viewForm() + (S.cur ? viewMesa(S.cur, true) : '');
  else if (S.tab==='salvas') body = viewSalvas();
  else body = viewJogador();
  const ae = document.activeElement, focusId = ae && ae.id, selStart = ae && 'selectionStart' in ae ? ae.selectionStart : null;
  const scroll = window.scrollY;
  document.getElementById('app').innerHTML = `
  <header class="gut"><div><h1>Gerador de Masmorras</h1><div class="sub">D&amp;D 5.5 · ${mestre?'visão do mestre':'visão do jogador'}</div></div>
    <div class="row">${S.isOwner?`<span class="muted small">Ver como:</span><button class="btn sm ${S.viewAs==='mestre'?'pri':''}" data-act="ver-como" data-v="mestre">Mestre</button><button class="btn sm ${S.viewAs==='jogador'?'pri':''}" data-act="ver-como" data-v="jogador">Jogador</button>`:'<span class="badge">Jogador</span>'}</div></header>
  <nav class="gut">${tabs.map(([k,l,c])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-tab="${k}">${l}${c?`<span class="count">${c}</span>`:''}</button>`).join('')}</nav>
  <main class="gut">${S.notice?`<div class="notice">${S.notice}</div>`:''}${body}</main>${S.pop?popView():''}`;
  if (focusId){ const el=document.getElementById(focusId); if (el){ el.focus(); if (selStart!=null && el.setSelectionRange) try{ el.setSelectionRange(selStart,selStart); }catch{} } }
  window.scrollTo(0, scroll);
  const d = S.tab==='gerar' ? S.cur : (S.tab==='jogador' && S.openPub ? S.publicas[S.openPub] : null);
  const cv = document.getElementById('mapa');
  if (cv && d){ drawMap(d); cv.addEventListener('click', e=>mapClick(e,d)); }
}

/* ================= ações ================= */
function markDirty(){ if (!S.dirty){ S.dirty = true; render(); } }
async function salvar(){
  const d = S.cur; if (!d || S.saving) return;
  if (!d.id) d.id = newId();
  d.atualizada = Date.now(); S.saving = true; render();
  try { await store.save(d); S.dirty = false; S.notice = ''; }
  catch(err){ S.notice = 'Não foi possível salvar ('+h(err && (err.code||err.message) || 'erro')+'). Tente de novo.'; }
  S.saving = false; render();
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a!=='excluir') S.delArm = null;
  if (a!=='mon-reset') S.popResetArm = false;
  if (a==='noop') return;
  if (a==='mon'){ S.pop = t.dataset.en; S.popEdit = false; render(); const c=document.getElementById('pop-close'); if (c) c.focus(); return; }
  if (a==='pop-close' || (a==='pop-bg' && e.target===t)){ S.pop = null; S.popEdit = false; render(); return; }
  if (a==='mon-edit'){ S.popEdit = true; render(); const ta=document.getElementById('mon-txt'); if (ta) ta.focus(); return; }
  if (a==='mon-cancel'){ S.popEdit = false; render(); return; }
  if (a==='mon-save'){
    const ta = document.getElementById('mon-txt'), slug = monSlug(S.pop), txt = ta ? ta.value : '';
    S.monTxt[slug] = {texto:txt}; S.popEdit = false; render();
    store.saveMonstro(slug, txt).catch(err=>{ S.notice='Não foi possível salvar o texto do monstro ('+h(err && (err.code||err.message))+').'; render(); });
    return;
  }
  if (a==='mon-reset'){
    if (!S.popResetArm){ S.popResetArm = true; render(); return; }
    S.popResetArm = false; const slug = monSlug(S.pop); delete S.monTxt[slug]; render();
    store.delMonstro(slug).catch(err=>{ S.notice='Não foi possível restaurar o resumo ('+h(err && (err.code||err.message))+').'; render(); });
    return;
  }
  if (a==='tab'){ S.tab = t.dataset.tab; S.sel = null; render(); }
  else if (a==='ver-como'){ S.viewAs = t.dataset.v; S.sel = null; S.openPub = null; S.tab = S.viewAs==='mestre'?'gerar':'jogador'; render(); }
  else if (a==='gerar'){
    if (S.dirty && !S.genArm){ S.genArm = true; render(); return; }
    S.genArm = false; S.cur = genDungeon(S.params); S.sel = null; S.dirty = true; render();
  }
  else if (a==='sel'){ e.stopPropagation(); S.sel = t.dataset.i===''?null:+t.dataset.i; render(); }
  else if (a==='zoom'){ S.zoom = !S.zoom; render(); }
  else if (a==='salvar') salvar();
  else if (a==='publicar'){ if (!S.cur) return; S.cur.publicada = !S.cur.publicada; S.dirty = true; salvar(); }
  else if (a==='reroll-sala' || a==='reroll-enc'){
    const i = +t.dataset.i, d = S.cur, rng = makeRng(d.semente+':'+i+':'+Date.now()+Math.random());
    const old = d.salas[i];
    if (a==='reroll-sala'){ const ns = genSala(rng, d, i, old.tipo, rng.pick(TEMAS[d.params.tema].salas)); ns.notas = old.notas||''; if (old.tipo!=='entrada' && old.tipo!=='chefe') ns.nome = rng.pick(TEMAS[d.params.tema].salas); d.salas[i] = ns; }
    else { const enc = buildEncounter(rng, d.params, old.tipo==='chefe'?2:old.encontro.dif, old.tipo==='chefe'); enc.comport = old.encontro.comport; old.encontro = enc; }
    S.dirty = true; render();
  }
  else if (a==='abrir'){ if (e.target.closest('[data-act="excluir"]')) return; const d = S.lista[t.dataset.id]; if (!d) return; if (S.dirty && S.cur && !confirmLeave()) return; S.cur = clone(d); S.sel = null; S.dirty = false; S.tab = 'gerar'; render(); window.scrollTo(0,0); }
  else if (a==='excluir'){ e.stopPropagation(); const id = t.dataset.id;
    if (S.delArm !== id){ S.delArm = id; render(); return; }
    S.delArm = null; store.remove(id).catch(err=>{ S.notice='Não foi possível excluir ('+h(err && (err.code||err.message))+').'; render(); });
    if (S.cur && S.cur.id===id){ S.cur.id = null; S.cur.publicada = false; S.dirty = true; }
  }
  else if (a==='ver'){ S.openPub = t.dataset.id; S.sel = null; render(); window.scrollTo(0,0); }
  else if (a==='voltar'){ S.openPub = null; S.sel = null; render(); }
});
/* abrir uma masmorra salva por cima de alterações não salvas: segundo clique confirma */
let leaveArm = 0;
function confirmLeave(){ if (Date.now()-leaveArm < 4000) return true; leaveArm = Date.now(); S.notice = 'A masmorra aberta no Gerador tem alterações não salvas. Clique de novo na masmorra para abri-la mesmo assim.'; render(); return false; }
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && S.pop){ S.pop = null; S.popEdit = false; render(); return; }if ((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('card')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.dataset.p){ S.params[t.dataset.p] = t.value; return; }
  if (t.dataset.notas!==undefined && S.cur){ S.cur.salas[+t.dataset.notas].notas = t.value; if (!S.dirty){ S.dirty = true; const tb=document.querySelector('.toolbar .row'); if (tb) render(); } return; }
  if (t.dataset.nome!==undefined && S.cur){ S.cur.nome = t.value; if (!S.dirty){ S.dirty = true; render(); } }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if (t.dataset.p){ S.params[t.dataset.p] = t.tagName==='SELECT' && t.dataset.p!=='tema' && t.dataset.p!=='tamanho' && t.dataset.p!=='ritmo' ? +t.value : t.value; return; }
  if (t.dataset.actChange==='tipo' && S.cur){
    const i = +t.dataset.i, d = S.cur, rng = makeRng(d.semente+':t:'+i+':'+Date.now());
    const old = d.salas[i]; const ns = genSala(rng, d, i, t.value, old.nome); ns.notas = old.notas||''; if (t.value!=='entrada' && t.value!=='chefe') ns.nome = old.tipo==='entrada'||old.tipo==='chefe' ? rng.pick(TEMAS[d.params.tema].salas) : old.nome;
    d.salas[i] = ns; S.dirty = true; render();
  }
});
let rzT; window.addEventListener('resize', ()=>{ clearTimeout(rzT); rzT = setTimeout(()=>{ const d = S.tab==='gerar' ? S.cur : (S.openPub ? S.publicas[S.openPub] : null); drawMap(d); }, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ const d = S.tab==='gerar' ? S.cur : (S.openPub ? S.publicas[S.openPub] : null); drawMap(d); });

/* ================= início ================= */
function subscribe(){
  const err = what => e => { S.notice = 'Não foi possível carregar '+what+' ('+h(e && (e.code||e.message))+').'; render(); };
  if (S.isOwner) store.onLista(m=>{ S.lista = m; render(); }, err('as masmorras salvas'));
  store.onMonstros(m=>{ S.monTxt = m; if (!S.popEdit) render(); }, err('os textos dos monstros'));
  store.onPublicas(m=>{ S.publicas = m; if (S.openPub && !m[S.openPub]) S.openPub = null; render(); }, err('as masmorras visíveis'));
}
async function init(){
  S.cur = genDungeon({...S.params, semente:'exemplo-cripta'}); S.dirty = true;
  render();
  let db=null, user=null;
  if (window.claude && typeof window.claude.use==='function'){
    try {
      const timeout = new Promise(r=>setTimeout(()=>r([null,null]),10000));
      [db,user] = await Promise.race([Promise.all([window.claude.use('db'), window.claude.use('user')]), timeout]);
    } catch { db=null; user=null; }
  }
  if (db && user){
    S.mode = 'db'; store = makeDbStore(db);
    try { S.isOwner = !!(await user.isOwner()); } catch { S.isOwner = false; }
    try { S.myId = await user.id(); } catch {}
    S.viewAs = S.isOwner ? 'mestre' : 'jogador';
    if (!S.isOwner){ S.cur = null; S.dirty = false; }
  } else {
    S.mode = 'local'; store = makeLocalStore(); S.isOwner = true;
    S.notice = '<b>Modo demonstração.</b> O banco compartilhado não está disponível aqui, então as masmorras ficam só neste navegador. Use "Ver como" para testar a visão do jogador.';
  }
  S.loaded = true; subscribe(); render();
}
init();
</script>
</body>
</html>
