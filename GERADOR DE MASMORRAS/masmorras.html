nte fazendo-o errar, e se teletransporta até 18 m para um espaço desocupado que consiga ver. Cada criatura à sua escolha que ela consiga ver a até 1,5 m do espaço de destino fica na condição Cego até o fim do próximo turno da múmia."]],["Ações Lendárias",["Usos de Ação Lendária: 3 (4 no Covil). Imediatamente após o turno de outra criatura, a múmia pode gastar um uso para realizar uma das ações a seguir. A múmia recupera todos os usos gastos no início de cada um de seus turnos.","Comando Terrível. A múmia conjura Comando (versão de 2º círculo), usando o mesmo atributo de conjuração de Conjuração. A múmia não pode realizar esta ação de novo até o início do seu próximo turno.","Olhar. A múmia usa Olhar Aterrador. A múmia não pode realizar esta ação de novo até o início do seu próximo turno.","Golpe Necrótico. A múmia faz um ataque de Punho Apodrecido ou de Canalizar Energia Negativa."]]],"secoesEn":[["Traços",["Legendary Resistance (3/Day, or 4/Day in Lair). If the mummy fails a saving throw, it can choose to succeed instead.","Magic Resistance. The mummy has Advantage on saving throws against spells and other magical effects.","Undead Restoration. If destroyed, the mummy gains a new body in 24 hours if its heart is intact, reviving with all its Hit Points. The new body appears in an unoccupied space within the mummy's lair. The heart is a Tiny object that has AC 17, HP 10, and Immunity to all damage except Fire."]],["Ações",["Multiattack. The mummy makes one Rotting Fist or Channel Negative Energy attack, and it uses Dreadful Glare.","Rotting Fist. Melee Attack Roll: +9, reach 5 ft. Hit: 15 (2d10 + 4) Bludgeoning damage plus 10 (3d6) Necrotic damage. If the target is a creature, it is cursed. While cursed, the target can't regain Hit Points, it gains no benefit from finishing a Long Rest, and its Hit Point maximum decreases by 10 (3d6) every 24 hours that elapse. A creature dies and turns to dust if reduced to 0 Hit Points by this attack.","Channel Negative Energy. Ranged Attack Roll: +9, range 60 ft. Hit: 25 (6d6 + 4) Necrotic damage.","Dreadful Glare. Wisdom Saving Throw: DC 17, one creature the mummy can see within 60 feet. Failure: 25 (6d6 + 4) Psychic damage, and the target has the Paralyzed condition until the end of the mummy's next turn.","Spellcasting. The mummy casts one of the following spells, requiring no Material components and using Wisdom as the spellcasting ability (spell save DC 17, +9 to hit with spell attacks): At Will: Dispel Magic, Thaumaturgy 1/Day Each: Animate Dead, Harm, Insect Plague (level 7 version)"]],["Reações",["Whirlwind of Sand. Trigger: The mummy is hit by an attack roll. Response: The mummy adds 2 to its AC against the attack, possibly causing the attack to miss, and the mummy teleports up to 60 feet to an unoccupied space it can see. Each creature of its choice that it can see within 5 feet of its destination space has the Blinded condition until the end of the mummy's next turn."]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the mummy can expend a use to take one of the following actions. The mummy regains all expended uses at the start of each of its turns.","Dread Command. The mummy casts Command (level 2 version), using the same spellcasting ability as Spellcasting. The mummy can't take this action again until the start of its next turn.","Glare. The mummy uses Dreadful Glare. The mummy can't take this action again until the start of its next turn.","Necrotic Strike. The mummy makes one Rotting Fist or Channel Negative Energy attack."]]]},"Nalfeshnee":{"tipo":"Grande Ínfero (Demônio), Caótico e Mau","ca":"18","pv":"184 (16d10+96)","desl":"6 m, voo 9 m","ini":"+5 (15)","atr":[21,10,22,19,12,15],"info":[["Salvaguardas","Con +11, Int +9, Sab +6, Car +7"],["Resistências","Frio, Fogo, Elétrico"],["Imunidades","Venenoso; Amedrontado, Envenenado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 11"],["Idiomas","Abissal; telepatia 36 m"]],"cr":"13","secoes":[["Traços",["Restauração Demoníaca. Se o nalfeshnee morrer fora do Abismo, seu corpo se dissolve em icor e ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar do Abismo.","Resistência à Magia. O nalfeshnee tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O nalfeshnee faz três ataques de Dilacerar.","Dilacerar. Jogada de Ataque Corpo a Corpo: +10, alcance 3 m. Acerto: 16 (2d10 + 5) de dano Cortante mais 11 (2d10) de dano de Energia.","Teletransporte. O nalfeshnee se teletransporta até 36 m para um espaço desocupado que consiga ver."]],["Ações Bônus",["Auréola de Horror (Recarga 5–6). Salvaguarda de Sabedoria: CD 15, cada criatura numa Emanação de 4,5 m a partir do nalfeshnee. Falha: 28 (8d6) de dano Psíquico, e o alvo fica na condição Amedrontado por 1 minuto, até sofrer dano ou até terminar o turno sem linha de visão para o nalfeshnee. Sucesso: O alvo fica imune à Auréola de Horror deste nalfeshnee por 24 horas."]],["Reações",["Perseguição. Gatilho: Outra criatura que o nalfeshnee consiga ver termina seu movimento a até 36 m dele. Resposta: O nalfeshnee usa Teletransporte, mas o espaço de destino precisa estar a até 3 m da criatura que ativou o gatilho."]]],"secoesEn":[["Traços",["Demonic Restoration. If the nalfeshnee dies outside the Abyss, its body dissolves into ichor, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Abyss.","Magic Resistance. The nalfeshnee has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The nalfeshnee makes three Rend attacks.","Rend. Melee Attack Roll: +10, reach 10 ft. Hit: 16 (2d10 + 5) Slashing damage plus 11 (2d10) Force damage.","Teleport. The nalfeshnee teleports up to 120 feet to an unoccupied space it can see."]],["Ações Bônus",["Horror Nimbus (Recharge 5-6). Wisdom Saving Throw: DC 15, each creature in a 15-foot Emanation originating from the nalfeshnee. Failure: 28 (8d6) Psychic damage, and the target has the Frightened condition for 1 minute, until it takes damage, or until it ends its turn with the nalfeshnee out of line of sight. Success: The target is immune to this nalfeshnee's Horror Nimbus for 24 hours."]],["Reações",["Pursuit. Trigger: Another creature the nalfeshnee can see ends its move within 120 feet of the nalfeshnee. Response: The nalfeshnee uses Teleport, but its destination space must be within 10 feet of the triggering creature."]]]},"Night Hag":{"tipo":"Médio Ínfero, Neutro e Mau","ca":"17","pv":"112 (15d8+45)","desl":"9 m","ini":"+5 (15)","atr":[18,15,16,16,14,16],"info":[["Perícias","Enganação +6, Intuição +5, Percepção +5, Furtividade +5"],["Resistências","Frio, Fogo"],["Imunidades","Enfeitiçado"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 15"],["Idiomas","Abissal, Comum, Infernal, Primordial"]],"cr":"5","secoes":[["Traços",["Magia do Conciliábulo. Enquanto estiver a até 9 m de pelo menos duas bruxas aliadas, a bruxa pode conjurar uma das magias a seguir, sem precisar de componentes Materiais, usando o tempo de conjuração normal da magia e Inteligência como atributo de conjuração (CD de salvaguarda de magia 14): Augúrio, Convocar Familiar, Identificar, Localizar Objeto, Vidência ou Servo Invisível. A bruxa precisa terminar um Descanso Longo antes de usar este traço para conjurar essa mesma magia de novo.","Resistência à Magia. A bruxa tem Vantagem em salvaguardas contra magias e outros efeitos mágicos.","Bolsa de Almas. A bruxa tem uma bolsa de almas. Enquanto segura ou carrega a bolsa, ela pode usar a ação Assombração de Pesadelo. A bolsa tem CA 15, 20 PV e Resistência a todo dano. A bolsa vira pó se for reduzida a 0 Pontos de Vida. Se a bolsa for destruída, as almas que ela guarda são libertadas. A bruxa pode criar uma bolsa nova após 7 dias."]],["Ações",["Ataque Múltiplo. A bruxa faz dois ataques de Garra.","Garra. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 13 (2d8 + 4) de dano Cortante.","Assombração de Pesadelo (1/Dia; Requer Bolsa de Almas). Enquanto está no Plano Etéreo, a bruxa conjura Sonho, usando o mesmo atributo de conjuração de Conjuração. Somente a bruxa pode ser a mensageira da magia, e o alvo precisa ser uma criatura que ela consiga ver no Plano Material. A magia falha e é desperdiçada se o alvo estiver sob o efeito da magia Proteção contra o Bem e o Mal ou dentro de uma magia Círculo Mágico. Se o alvo sofrer dano da magia Sonho, seu máximo de Pontos de Vida diminui numa quantidade igual a esse dano. Se a magia matar o alvo, sua alma fica presa na bolsa de almas da bruxa, e o alvo não pode ser trazido de volta dos mortos até a alma ser libertada.","Conjuração. A bruxa conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Inteligência como atributo de conjuração (CD de salvaguarda de magia 14): À Vontade: Detectar Magia, Forma Etérea, Mísseis Mágicos (versão de 4º círculo). 2/Dia Cada: Assassino Fantasmagórico, Mudança de Plano (apenas em si mesma)."]],["Ações Bônus",["Mudar de Forma. A bruxa se transforma num Humanoide Pequeno ou Médio, ou volta à sua forma verdadeira. Exceto pelo tamanho, suas estatísticas de jogo são as mesmas em todas as formas. Equipamentos que esteja vestindo ou carregando não se transformam."]]],"secoesEn":[["Traços",["Coven Magic. While within 30 feet of at least two hag allies, the hag can cast one of the following spells, requiring no Material components, using the spell's normal casting time, and using Intelligence as the spellcasting ability (spell save DC 14): Augury, Find Familiar, Identify, Locate Object, Scrying, or Unseen Servant. The hag must finish a Long Rest before using this trait to cast that spell again.","Magic Resistance. The hag has Advantage on saving throws against spells and other magical effects.","Soul Bag. The hag has a soul bag. While holding or carrying the bag, the hag can use its Nightmare Haunting action. The bag has AC 15, HP 20, and Resistance to all damage. The bag turns to dust if reduced to 0 Hit Points. If the bag is destroyed, any souls the bag is holding are released. The hag can create a new bag after 7 days."]],["Ações",["Multiattack. The hag makes two Claw attacks.","Claw. Melee Attack Roll: +7, reach 5 ft. Hit: 13 (2d8 + 4) Slashing damage.","Nightmare Haunting (1/Day; Requires Soul Bag). While on the Ethereal Plane, the hag casts Dream, using the same spellcasting ability as Spellcasting. Only the hag can serve as the spell's messenger, and the target must be a creature the hag can see on the Material Plane. The spell fails and is wasted if the target is under the effect of the Protection from Evil and Good spell or within a Magic Circle spell. If the target takes damage from the Dream spell, the target's Hit Point maximum decreases by an amount equal to that damage. If the spell kills the target, its soul is trapped in the hag's soul bag, and the target can't be raised from the dead until its soul is released.","Spellcasting. The hag casts one of the following spells, requiring no Material components and using Intelligence as the spellcasting ability (spell save DC 14): At Will: Detect Magic, Etherealness, Magic Missile (level 4 version) 2/Day Each: Phantasmal Killer, Plane Shift (self only)"]],["Ações Bônus",["Shape-Shift. The hag shape-shifts into a Small or Medium Humanoid, or it returns to its true form. Other than its size, its game statistics are the same in each form. Any equipment it is wearing or carrying isn't transformed."]]]},"Nightmare":{"tipo":"Grande Ínfero, Neutro e Mau","ca":"13","pv":"68 (8d10+24)","desl":"18 m, voo 27 m (pairar)","ini":"+2 (12)","atr":[18,15,16,10,13,15],"info":[["Imunidades","Fogo"],["Sentidos","Percepção passiva 11"],["Idiomas","Understands Abissal, Comum, e Infernal mas não fala"]],"cr":"3","secoes":[["Traços",["Conceder Resistência ao Fogo. O pesadelo pode conceder Resistência a dano de Fogo a quem o montar.","Iluminação. O pesadelo emite Luz Plena num raio de 3 m e Penumbra por mais 3 m."]],["Ações",["Cascos. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 13 (2d8 + 4) de dano Contundente mais 10 (3d6) de dano de Fogo.","Passo Etéreo. O pesadelo e até três criaturas voluntárias a até 1,5 m dele se teletransportam do Plano Material para o Plano Etéreo, ou vice-versa."]]],"secoesEn":[["Traços",["Confer Fire Resistance. The nightmare can grant Resistance to Fire damage to a rider while it is on the nightmare.","Illumination. The nightmare sheds Bright Light in a 10foot radius and Dim Light for an additional 10 feet."]],["Ações",["Hooves. Melee Attack Roll: +6, reach 5 ft. Hit: 13 (2d8 + 4) Bludgeoning damage plus 10 (3d6) Fire damage.","Ethereal Stride. The nightmare and up to three willing creatures within 5 feet of it teleport to the Ethereal Plane from the Material Plane or vice versa."]]]},"Noble":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"15","pv":"9 (2d8)","desl":"9 m","ini":"+1 (11)","atr":[11,12,11,12,14,16],"info":[["Perícias","Enganação +5, Intuição +4, Persuasão +5"],["Equipamento","Breastplate, Rapier"],["Sentidos","Percepção passiva 12"],["Idiomas","Comum mais two other languages"]],"cr":"1/8","secoes":[["Ações",["Rapieira. Jogada de Ataque Corpo a Corpo: +3, alcance 1,5 m. Acerto: 5 (1d8 + 1) de dano Perfurante."]],["Reações",["Aparar. Gatilho: O nobre é atingido por uma jogada de ataque corpo a corpo enquanto empunha uma arma. Resposta: O nobre soma 2 à sua CA contra esse ataque, possivelmente fazendo-o errar."]]],"secoesEn":[["Ações",["Rapier. Melee Attack Roll: +3, reach 5 ft. Hit: 5 (1d8 + 1) Piercing damage."]],["Reações",["Parry. Trigger: The noble is hit by a melee attack roll while holding a weapon. Response: The noble adds 2 to its AC against that attack, possibly causing it to miss."]]]},"Ochre Jelly":{"tipo":"Grande Gosma, Sem Tendência","ca":"8","pv":"52 (7d10+14)","desl":"6 m, escalada 6 m","ini":"-2 (8)","atr":[15,6,14,2,6,1],"info":[["Resistências","Ácido"],["Imunidades","Elétrico, Cortante; Enfeitiçado, Surdo, Exaustão, Amedrontado, Agarrado, Caído, Impedido"],["Sentidos","Percepção às Cegas 18 m; Percepção passiva 8"],["Idiomas","Nenhum"]],"cr":"2","secoes":[["Traços",["Amorfo. A gosma pode passar por um espaço de apenas 2,5 cm de largura sem gastar movimento extra.","Patas de Aranha. A gosma consegue escalar superfícies difíceis, inclusive pelo teto, sem precisar fazer um teste de atributo."]],["Ações",["Pseudópode. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 12 (3d6 + 2) de dano Ácido."]],["Reações",["Dividir. Gatilho: Enquanto for Grande ou Média e tiver 10 ou mais Pontos de Vida, a gosma fica Sangrando ou sofre dano Elétrico ou Cortante. Resposta: A gosma se divide em duas novas Gosmas Ocres. Cada nova gosma é um tamanho menor que a original e age na Iniciativa dela. Os Pontos de Vida da gosma original são divididos igualmente entre as novas (arredondados para baixo)."]]],"secoesEn":[["Traços",["Amorphous. The jelly can move through a space as narrow as 1 inch without expending extra movement to do so.","Spider Climb. The jelly can climb difficult surfaces, including along ceilings, without needing to make an ability check."]],["Ações",["Pseudopod. Melee Attack Roll: +4, reach 5 ft. Hit: 12 (3d6 + 2) Acid damage."]],["Reações",["Split. Trigger: While the jelly is Large or Medium and has 10+ Hit Points, it becomes Bloodied or is subjected to Lightning or Slashing damage. Response: The jelly splits into two new Ochre Jellies. Each new jelly is one size smaller than the original jelly and acts on its Initiative. The original jelly's Hit Points are divided evenly between the new jellies (round down)."]]]},"Ogre":{"tipo":"Grande Gigante, Caótico e Mau","ca":"11","pv":"68 (8d10+24)","desl":"12 m","ini":"-1 (9)","atr":[19,8,16,5,7,7],"info":[["Equipamento","Greatclub, Javelins (3)"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 8"],["Idiomas","Comum, Gigante"]],"cr":"2","secoes":[["Ações",["Clava Grande. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 13 (2d8 + 4) de dano Contundente.","Azagaia. Jogada de Ataque Corpo a Corpo ou à Distância: +6, alcance 1,5 m ou distância 9/36 m. Acerto: 11 (2d6 + 4) de dano Perfurante."]]],"secoesEn":[["Ações",["Greatclub. Melee Attack Roll: +6, reach 5 ft. Hit: 13 (2d8 + 4) Bludgeoning damage.","Javelin. Melee or Ranged Attack Roll: +6, reach 5 ft. or range 30/120 ft. Hit: 11 (2d6 + 4) Piercing damage."]]]},"Oni":{"tipo":"Grande Ínfero, Leal e Mau","ca":"17","pv":"119 (14d10+42)","desl":"9 m, voo 9 m (pairar)","ini":"+0 (10)","atr":[19,11,16,14,12,15],"info":[["Salvaguardas","Des +3, Con +6, Sab +4, Car +5"],["Perícias","Arcanismo +5, Enganação +8, Percepção +4"],["Resistências","Frio"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Comum, Gigante"]],"cr":"7","secoes":[["Traços",["Regeneração. O oni recupera 10 Pontos de Vida no início de cada um de seus turnos se tiver pelo menos 1 Ponto de Vida."]],["Ações",["Ataque Múltiplo. O oni faz dois ataques de Garra ou de Raio de Pesadelo. Ele pode substituir um ataque por um uso de Conjuração.","Garra. Jogada de Ataque Corpo a Corpo: +7, alcance 3 m. Acerto: 10 (1d12 + 4) de dano Cortante mais 9 (2d8) de dano Necrótico.","Raio de Pesadelo. Jogada de Ataque à Distância: +5, distância 18 m. Acerto: 9 (2d6 + 2) de dano Psíquico, e o alvo fica na condição Amedrontado até o início do próximo turno do oni.","Mudar de Forma. O oni se transforma num Humanoide Pequeno ou Médio ou num Gigante Grande, ou volta à sua forma verdadeira. Exceto pelo tamanho, suas estatísticas de jogo são as mesmas em todas as formas. Equipamentos que esteja vestindo ou carregando não se transformam.","Conjuração. O oni conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 13): 1/Dia Cada: Enfeitiçar Pessoa (versão de 2º círculo), Escuridão, Forma Gasosa, Sono."]],["Ações Bônus",["Invisibilidade. O oni conjura Invisibilidade em si mesmo, sem precisar de componentes de magia e usando o mesmo atributo de conjuração de Conjuração."]]],"secoesEn":[["Traços",["Regeneration. The oni regains 10 Hit Points at the start of each of its turns if it has at least 1 Hit Point."]],["Ações",["Multiattack. The oni makes two Claw or Nightmare Ray attacks. It can replace one attack with a use of Spellcasting.","Claw. Melee Attack Roll: +7, reach 10 ft. Hit: 10 (1d12 + 4) Slashing damage plus 9 (2d8) Necrotic damage.","Nightmare Ray. Ranged Attack Roll: +5, range 60 ft. Hit: 9 (2d6 + 2) Psychic damage, and the target has the Frightened condition until the start of the oni's next turn.","Shape-Shift. The oni shape-shifts into a Small or Medium Humanoid or a Large Giant, or it returns to its true form. Other than its size, its game statistics are the same in each form. Any equipment it is wearing or carrying isn't transformed.","Spellcasting. The oni casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 13): 1/Day Each: Charm Person (level 2 version), Darkness, Gaseous Form, Sleep"]],["Ações Bônus",["Invisibility. The oni casts Invisibility on itself, requiring no spell components and using the same spellcasting ability as Spellcasting."]]]},"Otyugh":{"tipo":"Grande Aberração, Neutro","ca":"14","pv":"104 (11d10+44)","desl":"9 m","ini":"+0 (10)","atr":[16,11,19,6,13,6],"info":[["Salvaguardas","Con +7"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 11"],["Idiomas","Otyugh; telepatia 36 m (doesn't allow the receiving creature to respond telepathically)"]],"cr":"5","secoes":[["Ações",["Ataque Múltiplo. O otyugh faz um ataque de Mordida e dois ataques de Tentáculo.","Mordida. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 12 (2d8 + 3) de dano Perfurante, e o alvo fica na condição Envenenado. Sempre que o alvo Envenenado terminar um Descanso Longo, ele é submetido ao efeito a seguir. Salvaguarda de Constituição: CD 15. Falha: O máximo de Pontos de Vida do alvo diminui em 5 (1d10) e não volta ao normal até a condição Envenenado acabar. Sucesso: A condição Envenenado acaba.","Tentáculo. Jogada de Ataque Corpo a Corpo: +6, alcance 3 m. Acerto: 12 (2d8 + 3) de dano Perfurante. Se o alvo for uma criatura Média ou menor, ele fica na condição Agarrado (CD 13 para escapar) por um de dois tentáculos.","Pancada de Tentáculo. Salvaguarda de Constituição: CD 14, cada criatura Agarrada pelo otyugh. Falha: 16 (3d8 + 3) de dano Contundente, e o alvo fica na condição Atordoado até o início do próximo turno do otyugh. Sucesso: Apenas metade do dano."]]],"secoesEn":[["Ações",["Multiattack. The otyugh makes one Bite attack and two Tentacle attacks.","Bite. Melee Attack Roll: +6, reach 5 ft. Hit: 12 (2d8 + 3) Piercing damage, and the target has the Poisoned condition. Whenever the Poisoned target finishes a Long Rest, it is subjected to the following effect. Constitution Saving Throw: DC 15. Failure: The target's Hit Point maximum decreases by 5 (1d10) and doesn't return to normal until the Poisoned condition ends on the target. Success: The Poisoned condition ends.","Tentacle. Melee Attack Roll: +6, reach 10 ft. Hit: 12 (2d8 + 3) Piercing damage. If the target is a Medium or smaller creature, it has the Grappled condition (escape DC 13) from one of two tentacles.","Tentacle Slam. Constitution Saving Throw: DC 14, each creature Grappled by the otyugh. Failure: 16 (3d8 + 3) Bludgeoning damage, and the target has the Stunned condition until the start of the otyugh's next turn. Success: Half damage only."]]]},"Owlbear":{"tipo":"Grande Monstruosidade, Sem Tendência","ca":"13","pv":"59 (7d10+21)","desl":"12 m, escalada 12 m","ini":"+1 (11)","atr":[20,12,17,3,12,7],"info":[["Perícias","Percepção +5"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 15"],["Idiomas","Nenhum"]],"cr":"3","secoes":[["Ações",["Ataque Múltiplo. O urso-coruja faz dois ataques de Dilacerar.","Dilacerar. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 14 (2d8 + 5) de dano Cortante."]]],"secoesEn":[["Ações",["Multiattack. The owlbear makes two Rend attacks.","Rend. Melee Attack Roll: +7, reach 5 ft. Hit: 14 (2d8 + 5) Slashing damage."]]]},"Pegasus":{"tipo":"Grande Celestial, Caótico e Bom","ca":"12","pv":"59 (7d10+21)","desl":"18 m, voo 27 m","ini":"+2 (12)","atr":[18,15,16,10,15,13],"info":[["Salvaguardas","Des +4, Con +5, Sab +4, Car +3"],["Perícias","Percepção +6"],["Sentidos","Percepção passiva 16"],["Idiomas","Understands Celestial, Comum, Élfico, e Silvestre mas não fala"]],"cr":"2","secoes":[["Ações",["Cascos. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 7 (1d6 + 4) de dano Contundente mais 5 (2d4) de dano Radiante."]]],"secoesEn":[["Ações",["Hooves. Melee Attack Roll: +6, reach 5 ft. Hit: 7 (1d6 + 4) Bludgeoning damage plus 5 (2d4) Radiant damage."]]]},"Phase Spider":{"tipo":"Grande Monstruosidade, Sem Tendência","ca":"14","pv":"45 (7d10+7)","desl":"9 m, escalada 9 m","ini":"+3 (13)","atr":[15,16,12,6,10,6],"info":[["Perícias","Furtividade +7"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Nenhum"]],"cr":"3","secoes":[["Traços",["Visão Etérea. A aranha consegue enxergar 18 m dentro do Plano Etéreo enquanto está no Plano Material, e vice-versa.","Patas de Aranha. A aranha consegue escalar superfícies difíceis, inclusive pelo teto, sem precisar fazer um teste de atributo.","Andarilha da Teia. A aranha ignora restrições de movimento causadas por teias e sabe a localização de qualquer outra criatura em contato com a mesma teia."]],["Ações",["Ataque Múltiplo. A aranha faz dois ataques de Mordida.","Mordida. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 8 (1d10 + 3) de dano Perfurante mais 9 (2d8) de dano Venenoso. Se esse dano reduzir o alvo a 0 Pontos de Vida, ele fica Estável e na condição Envenenado por 1 hora. Enquanto Envenenado, o alvo também fica na condição Paralisado."]],["Ações Bônus",["Salto Etéreo. A aranha se teletransporta do Plano Material para o Plano Etéreo, ou vice-versa."]]],"secoesEn":[["Traços",["Ethereal Sight. The spider can see 60 feet into the Ethereal Plane while on the Material Plane and vice versa.","Spider Climb. The spider can climb difficult surfaces, including along ceilings, without needing to make an ability check.","Web Walker. The spider ignores movement restrictions caused by webs, and the spider knows the location of any other creature in contact with the same web."]],["Ações",["Multiattack. The spider makes two Bite attacks.","Bite. Melee Attack Roll: +5, reach 5 ft. Hit: 8 (1d10 + 3) Piercing damage plus 9 (2d8) Poison damage. If this damage reduces the target to 0 Hit Points, the target becomes Stable, and it has the Poisoned condition for 1 hour. While Poisoned, the target also has the Paralyzed condition."]],["Ações Bônus",["Ethereal Jaunt. The spider teleports from the Material Plane to the Ethereal Plane or vice versa."]]]},"Pirate":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"14","pv":"33 (6d8+6)","desl":"9 m","ini":"+5 (15)","atr":[10,16,12,8,12,14],"info":[["Salvaguardas","Des +5, Car +4"],["Equipamento","Daggers (6), Leather Armor"],["Sentidos","Percepção passiva 11"],["Idiomas","Comum mais one other language"]],"cr":"1","secoes":[["Ações",["Ataque Múltiplo. O pirata faz dois ataques de Adaga. Ele pode substituir um ataque por um uso de Charme Cativante.","Adaga. Jogada de Ataque Corpo a Corpo ou à Distância: +5, alcance 1,5 m ou distância 6/18 m. Acerto: 5 (1d4 + 3) de dano Perfurante.","Charme Cativante. Salvaguarda de Sabedoria: CD 12, uma criatura que o pirata consiga ver a até 9 m. Falha: O alvo fica na condição Enfeitiçado até o início do próximo turno do pirata."]]],"secoesEn":[["Ações",["Multiattack. The pirate makes two Dagger attacks. It can replace one attack with a use of Enthralling Panache.","Dagger. Melee or Ranged Attack Roll: +5, reach 5 ft. or range 20/60 ft. Hit: 5 (1d4 + 3) Piercing damage.","Enthralling Panache. Wisdom Saving Throw: DC 12, one creature the pirate can see within 30 feet. Failure: The target has the Charmed condition until the start of the pirate's next turn."]]]},"Pirate Captain":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"17","pv":"84 (13d8+26)","desl":"9 m","ini":"+7 (17)","atr":[10,18,14,10,14,17],"info":[["Salvaguardas","For +3, Des +7, Sab +5, Car +6"],["Perícias","Acrobacia +7, Percepção +5"],["Equipamento","Pistol, Rapier"],["Sentidos","Percepção passiva 15"],["Idiomas","Comum mais one other language"]],"cr":"6","secoes":[["Ações",["Ataque Múltiplo. O pirata faz três ataques, usando Rapieira ou Pistola em qualquer combinação.","Rapieira. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 13 (2d8 + 4) de dano Perfurante, e o pirata tem Vantagem na próxima jogada de ataque que fizer antes do fim deste turno.","Pistola. Jogada de Ataque à Distância: +7, distância 9/27 m. Acerto: 15 (2d10 + 4) de dano Perfurante."]],["Ações Bônus",["Charme do Capitão. Salvaguarda de Sabedoria: CD 14, uma criatura que o pirata consiga ver a até 9 m. Falha: O alvo fica na condição Enfeitiçado até o início do próximo turno do pirata."]],["Reações",["Contra-ataque. Gatilho: O pirata é atingido por uma jogada de ataque corpo a corpo enquanto empunha uma arma. Resposta: O pirata soma 3 à sua CA contra esse ataque, possivelmente fazendo-o errar. Se o ataque errar, o pirata faz um ataque de Rapieira contra a criatura que ativou o gatilho, se ela estiver ao alcance."]]],"secoesEn":[["Ações",["Multiattack. The pirate makes three attacks, using Rapier or Pistol in any combination.","Rapier. Melee Attack Roll: +7, reach 5 ft. Hit: 13 (2d8 + 4) Piercing damage, and the pirate has Advantage on the next attack roll it makes before the end of this turn.","Pistol. Ranged Attack Roll: +7, range 30/90 ft. Hit: 15 (2d10 + 4) Piercing damage."]],["Ações Bônus",["Captain's Charm. Wisdom Saving Throw: DC 14, one creature the pirate can see within 30 feet. Failure: The target has the Charmed condition until the start of the pirate's next turn."]],["Reações",["Riposte. Trigger: The pirate is hit by a melee attack roll while holding a weapon. Response: The pirate adds 3 to its AC against that attack, possibly causing it to miss. On a miss, the pirate makes one Rapier attack against the triggering creature if within range."]]]},"Pit Fiend":{"tipo":"Grande Ínfero (Diabo), Leal e Mau","ca":"21","pv":"337 (27d10+189)","desl":"9 m, voo 18 m","ini":"+14 (24)","atr":[26,14,24,22,18,24],"info":[["Salvaguardas","Des +8, Sab +10"],["Perícias","Percepção +10, Persuasão +19"],["Resistências","Frio"],["Imunidades","Fogo, Venenoso; Envenenado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 20"],["Idiomas","Infernal; telepatia 36 m"]],"cr":"20","secoes":[["Traços",["Restauração Diabólica. Se o pit fiend morrer fora dos Nove Infernos, seu corpo desaparece em fumaça sulfurosa e ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar dos Nove Infernos.","Aura de Medo. O pit fiend emana uma aura numa Emanação de 6 m enquanto não estiver na condição Incapacitado. Salvaguarda de Sabedoria: CD 21, qualquer inimigo que comece o turno na aura. Falha: O alvo fica na condição Amedrontado até o início do seu próximo turno. Sucesso: O alvo fica imune à aura deste pit fiend por 24 horas.","Resistência Lendária (4/Dia). Se o pit fiend falhar numa salvaguarda, ele pode escolher ser bem-sucedido.","Resistência à Magia. O pit fiend tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O pit fiend faz um ataque de Mordida, dois ataques de Garra Diabólica e um ataque de Maça Flamejante.","Mordida. Jogada de Ataque Corpo a Corpo: +14, alcance 3 m. Acerto: 18 (3d6 + 8) de dano Perfurante. Se o alvo for uma criatura, ele precisa fazer a salvaguarda a seguir. Salvaguarda de Constituição: CD 21. Falha: O alvo fica na condição Envenenado. Enquanto Envenenado, o alvo não pode recuperar Pontos de Vida, sofre 21 (6d6) de dano Venenoso no início de cada um de seus turnos e repete a salvaguarda no fim de cada um de seus turnos, encerrando o efeito em si mesmo com um sucesso. Após 1 minuto, ele é bem-sucedido automaticamente.","Garra Diabólica. Jogada de Ataque Corpo a Corpo: +14, alcance 3 m. Acerto: 26 (4d8 + 8) de dano Necrótico.","Maça Flamejante. Jogada de Ataque Corpo a Corpo: +14, alcance 3 m. Acerto: 22 (4d6 + 8) de dano de Energia mais 21 (6d6) de dano de Fogo.","Conjuração do Fogo Infernal (Recarga 4–6). O pit fiend conjura Bola de Fogo (versão de 5º círculo) duas vezes, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 21). Ele pode substituir uma das Bola de Fogo por Imobilizar Monstro (versão de 7º círculo) ou Muralha de Fogo."]]],"secoesEn":[["Traços",["Diabolical Restoration. If the pit fiend dies outside the Nine Hells, its body disappears in sulfurous smoke, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.","Fear Aura. The pit fiend emanates an aura in a 20foot Emanation while it doesn't have the Incapacitated condition. Wisdom Saving Throw: DC 21, any enemy that starts its turn in the aura. Failure: The target has the Frightened condition until the start of its next turn. Success: The target is immune to this pit fiend's aura for 24 hours.","Legendary Resistance (4/Day). If the pit fiend fails a saving throw, it can choose to succeed instead.","Magic Resistance. The pit fiend has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The pit fiend makes one Bite attack, two Devilish Claw attacks, and one Fiery Mace attack.","Bite. Melee Attack Roll: +14, reach 10 ft. Hit: 18 (3d6 + 8) Piercing damage. If the target is a creature, it must make the following saving throw. Constitution Saving Throw: DC 21. Failure: The target has the Poisoned condition. While Poisoned, the target can't regain Hit Points and takes 21 (6d6) Poison damage at the start of each of its turns, and it repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically.","Devilish Claw. Melee Attack Roll: +14, reach 10 ft. Hit: 26 (4d8 + 8) Necrotic damage.","Fiery Mace. Melee Attack Roll: +14, reach 10 ft. Hit: 22 (4d6 + 8) Force damage plus 21 (6d6) Fire damage.","Hellfire Spellcasting (Recharge 4-6). The pit fiend casts Fireball (level 5 version) twice, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 21). It can replace one Fireball with Hold Monster (level 7 version) or Wall of Fire."]]]},"Planetar":{"tipo":"Grande Celestial (Angel), Leal e Bom","ca":"19","pv":"262 (21d10+147)","desl":"12 m, voo 36 m (pairar)","ini":"+10 (20)","atr":[24,20,24,19,22,25],"info":[["Salvaguardas","For +12, Con +12, Sab +11, Car +12"],["Perícias","Percepção +11"],["Resistências","Radiante"],["Imunidades","Enfeitiçado, Exaustão, Amedrontado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 21"],["Idiomas","All; telepatia 36 m"]],"cr":"16","secoes":[["Traços",["Percepção Divina. O planetar sabe quando ouve uma mentira.","Restauração Exaltada. Se o planetar morrer fora do Monte Celéstia, seu corpo desaparece e ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar do Monte Celéstia.","Resistência à Magia. O planetar tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O planetar faz três ataques de Espada Radiante ou usa Explosão Sagrada duas vezes.","Espada Radiante. Jogada de Ataque Corpo a Corpo: +12, alcance 3 m. Acerto: 14 (2d6 + 7) de dano Cortante mais 18 (4d8) de dano Radiante.","Explosão Sagrada. Salvaguarda de Destreza: CD 20, cada inimigo numa Esfera de 6 m de raio centrada num ponto que o planetar consiga ver a até 36 m. Falha: 24 (7d6) de dano Radiante. Sucesso: Metade do dano.","Conjuração. O planetar conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 20): À Vontade: Detectar o Bem e o Mal. 1/Dia Cada: Comunhão, Controlar o Clima, Dissipar o Bem e o Mal, Reviver os Mortos."]],["Ações Bônus",["Auxílio Divino (2/Dia). O planetar conjura Curar Ferimentos, Invisibilidade, Restauração Menor ou Remover Maldição, usando o mesmo atributo de conjuração de Conjuração."]]],"secoesEn":[["Traços",["Divine Awareness. The planetar knows if it hears a lie.","Exalted Restoration. If the planetar dies outside Mount Celestia, its body disappears, and it gains a new body instantly, reviving with all its Hit Points somewhere in Mount Celestia.","Magic Resistance. The planetar has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The planetar makes three Radiant Sword attacks or uses Holy Burst twice.","Radiant Sword. Melee Attack Roll: +12, reach 10 ft. Hit: 14 (2d6 + 7) Slashing damage plus 18 (4d8) Radiant damage.","Holy Burst. Dexterity Saving Throw: DC 20, each enemy in a 20-foot-radius Sphere centered on a point the planetar can see within 120 feet. Failure: 24 (7d6) Radiant damage. Success: Half damage.","Spellcasting. The planetar casts one of the following spells, requiring no Material components and using Charisma as spellcasting ability (spell save DC 20): At Will: Detect Evil and Good 1/Day Each: Commune, Control Weather, Dispel Evil and Good, Raise Dead"]],["Ações Bônus",["Divine Aid (2/Day). The planetar casts Cure Wounds, Invisibility, Lesser Restoration, or Remove Curse, using the same spellcasting ability as Spellcasting."]]]},"Priest Acolyte":{"tipo":"Médio ou Pequeno Humanoide (Clérigo), Neutro","ca":"13","pv":"11 (2d8+2)","desl":"9 m","ini":"+0 (10)","atr":[14,10,12,10,14,11],"info":[["Perícias","Medicina +4, Religião +2"],["Equipamento","Chain Shirt, Holy Symbol, Mace"],["Sentidos","Percepção passiva 12"],["Idiomas","Comum"]],"cr":"1/4","secoes":[["Ações",["Maça. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 5 (1d6 + 2) de dano Contundente mais 2 (1d4) de dano Radiante.","Chama Radiante. Jogada de Ataque à Distância: +4, distância 18 m. Acerto: 7 (2d6) de dano Radiante.","Conjuração. O sacerdote conjura uma das magias a seguir, usando Sabedoria como atributo de conjuração: À Vontade: Luz, Taumaturgia."]],["Ações Bônus",["Auxílio Divino (1/Dia). O sacerdote conjura Bênção, Palavra Curativa ou Santuário, usando o mesmo atributo de conjuração de Conjuração."]]],"secoesEn":[["Ações",["Mace. Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Bludgeoning damage plus 2 (1d4) Radiant damage.","Radiant Flame. Ranged Attack Roll: +4, range 60 ft. Hit: 7 (2d6) Radiant damage.","Spellcasting. The priest casts one of the following spells, using Wisdom as the spellcasting ability: At Will: Light, Thaumaturgy"]],["Ações Bônus",["Divine Aid (1/Day). The priest casts Bless, Healing Word, or Sanctuary, using the same spellcasting ability as Spellcasting."]]]},"Priest":{"tipo":"Médio ou Pequeno Humanoide (Clérigo), Neutro","ca":"13","pv":"38 (7d8+7)","desl":"9 m","ini":"+0 (10)","atr":[16,10,12,13,16,13],"info":[["Perícias","Medicina +7, Percepção +5, Religião +5"],["Equipamento","Chain Shirt, Holy Symbol, Mace"],["Sentidos","Percepção passiva 15"],["Idiomas","Comum mais one other language"]],"cr":"2","secoes":[["Ações",["Ataque Múltiplo. O sacerdote faz dois ataques, usando Maça ou Chama Radiante em qualquer combinação.","Maça. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 6 (1d6 + 3) de dano Contundente mais 5 (2d4) de dano Radiante.","Chama Radiante. Jogada de Ataque à Distância: +5, distância 18 m. Acerto: 11 (2d10) de dano Radiante.","Conjuração. O sacerdote conjura uma das magias a seguir, usando Sabedoria como atributo de conjuração (CD de salvaguarda de magia 13): À Vontade: Luz, Taumaturgia. 1/Dia: Espíritos Guardiões."]],["Ações Bônus",["Auxílio Divino (3/Dia). O sacerdote conjura Bênção, Dissipar Magia, Palavra Curativa ou Restauração Menor, usando o mesmo atributo de conjuração de Conjuração."]]],"secoesEn":[["Ações",["Multiattack. The priest makes two attacks, using Mace or Radiant Flame in any combination.","Mace. Melee Attack Roll: +5, reach 5 ft. Hit: 6 (1d6 + 3) Bludgeoning damage plus 5 (2d4) Radiant damage.","Radiant Flame. Ranged Attack Roll: +5, range 60 ft. Hit: 11 (2d10) Radiant damage.","Spellcasting. The priest casts one of the following spells, using Wisdom as the spellcasting ability (spell save DC 13): At Will: Light, Thaumaturgy 1/Day: Spirit Guardians"]],["Ações Bônus",["Divine Aid (3/Day). The priest casts Bless, Dispel Magic, Healing Word, or Lesser Restoration, using the same spellcasting ability as Spellcasting."]]]},"Pseudodragon":{"tipo":"Miúdo Dragão, Neutro e Bom","ca":"14","pv":"10 (3d4+3)","desl":"4,5 m, voo 18 m","ini":"+2 (12)","atr":[6,15,13,10,12,10],"info":[["Perícias","Percepção +5, Furtividade +4"],["Sentidos","Percepção às Cegas 3 m, Visão no Escuro 18 m; Percepção passiva 15"],["Idiomas","Understands Comum e Dracônico mas não fala"]],"cr":"1/4","secoes":[["Traços",["Resistência à Magia. O pseudodragão tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O pseudodragão faz dois ataques de Mordida.","Mordida. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 4 (1d4 + 2) de dano Perfurante.","Ferrão. Salvaguarda de Constituição: CD 12, uma criatura que o pseudodragão consiga ver a até 1,5 m. Falha: 5 (2d4) de dano Venenoso, e o alvo fica na condição Envenenado por 1 hora. Falha por 5 ou Mais: Enquanto Envenenado, o alvo também fica na condição Inconsciente, que acaba antes se ele sofrer dano ou se uma criatura a até 1,5 m dele usar uma ação para acordá-lo."]]],"secoesEn":[["Traços",["Magic Resistance. The pseudodragon has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The pseudodragon makes two Bite attacks.","Bite. Melee Attack Roll: +4, reach 5 ft. Hit: 4 (1d4 + 2) Piercing damage.","Sting. Constitution Saving Throw: DC 12, one creature the pseudodragon can see within 5 feet. Failure: 5 (2d4) Poison damage, and the target has the Poisoned condition for 1 hour. Failure by 5 or More: While Poisoned, the target also has the Unconscious condition, which ends early if the target takes damage or a creature within 5 feet of it takes an action to wake it."]]]},"Purple Worm":{"tipo":"Imenso Monstruosidade, Sem Tendência","ca":"18","pv":"247 (15d20+90)","desl":"15 m, escavação 15 m","ini":"+3 (13)","atr":[28,7,22,1,8,4],"info":[["Salvaguardas","Con +11, Sab +4"],["Sentidos","Percepção às Cegas 9 m, Sentido Sísmico 18 m; Percepção passiva 9"],["Idiomas","Nenhum"]],"cr":"15","secoes":[["Traços",["Escavador de Túneis. O verme consegue escavar rocha sólida com metade do seu Deslocamento de Escavação e deixa para trás um túnel de 3 m de diâmetro."]],["Ações",["Ataque Múltiplo. O verme faz um ataque de Mordida e um ataque de Ferrão da Cauda.","Mordida. Jogada de Ataque Corpo a Corpo: +14, alcance 3 m. Acerto: 22 (3d8 + 9) de dano Perfurante. Se o alvo for uma criatura Grande ou menor, ele fica na condição Agarrado (CD 19 para escapar) e na condição Impedido até o agarrão acabar.","Ferrão da Cauda. Jogada de Ataque Corpo a Corpo: +14, alcance 3 m. Acerto: 16 (2d6 + 9) de dano Perfurante mais 35 (10d6) de dano Venenoso."]],["Ações Bônus",["Engolir. Salvaguarda de Força: CD 19, uma criatura Grande ou menor Agarrada pelo verme (ele pode ter até três criaturas engolidas ao mesmo tempo). Falha: O alvo é engolido pelo verme e a condição Agarrado acaba. Uma criatura engolida fica nas condições Cego e Impedido, tem Cobertura Total contra ataques e outros efeitos de fora do verme e sofre 17 (5d6) de dano Ácido no início de cada turno do verme. Se o verme sofrer 30 ou mais de dano num único turno vindo de uma criatura dentro dele, ele precisa ser bem-sucedido numa salvaguarda de Constituição CD 21 no fim desse turno ou regurgita todas as criaturas engolidas, que caem num espaço a até 1,5 m do verme na condição Caído. Se o verme morrer, qualquer criatura engolida deixa de estar Impedida e pode escapar do cadáver usando 6 m de movimento, saindo Caída."]]],"secoesEn":[["Traços",["Tunneler. The worm can burrow through solid rock at half its Burrow Speed and leaves a 10-foot-diameter tunnel in its wake."]],["Ações",["Multiattack. The worm makes one Bite attack and one Tail Stinger attack.","Bite. Melee Attack Roll: +14, reach 10 ft. Hit: 22 (3d8 + 9) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 19), and it has the Restrained condition until the grapple ends.","Tail Stinger. Melee Attack Roll: +14, reach 10 ft. Hit: 16 (2d6 + 9) Piercing damage plus 35 (10d6) Poison damage."]],["Ações Bônus",["Swallow. Strength Saving Throw: DC 19, one Large or smaller creature Grappled by the worm (it can have up to three creatures swallowed at a time). Failure: The target is swallowed by the worm, and the Grappled condition ends. A swallowed creature has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the worm, and takes 17 (5d6) Acid damage at the start of each of the worm's turns. If the worm takes 30 damage or more on a single turn from a creature inside it, the worm must succeed on a DC 21 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, each of which falls in a space within 5 feet of the worm and has the Prone condition. If the worm dies, any swallowed creature no longer has the Restrained condition and can escape from the corpse using 20 feet of movement, exiting Prone."]]]},"Quasit":{"tipo":"Miúdo Ínfero (Demônio), Caótico e Mau","ca":"13","pv":"25 (10d4)","desl":"12 m","ini":"+3 (13)","atr":[5,17,10,7,10,10],"info":[["Perícias","Furtividade +5"],["Resistências","Frio, Fogo, Elétrico"],["Imunidades","Venenoso; Envenenado"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 10"],["Idiomas","Abissal, Comum"]],"cr":"1","secoes":[["Traços",["Resistência à Magia. O quasit tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Dilacerar. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 5 (1d4 + 3) de dano Cortante, e o alvo fica na condição Envenenado até o início do próximo turno do quasit.","Invisibilidade. O quasit conjura Invisibilidade em si mesmo, sem precisar de componentes de magia e usando Carisma como atributo de conjuração.","Assustar (1/Dia). Salvaguarda de Sabedoria: CD 10, uma criatura a até 6 m. Falha: O alvo fica na condição Amedrontado. No fim de cada um de seus turnos, o alvo repete a salvaguarda, encerrando o efeito em si mesmo com um sucesso. Após 1 minuto, ele é bem-sucedido automaticamente.","Mudar de Forma. O quasit se transforma para parecer um morcego (Deslocamento 3 m, voo 12 m), uma centopeia (12 m, escalada 12 m) ou um sapo (12 m, natação 12 m), ou volta à sua forma verdadeira. Suas estatísticas de jogo são as mesmas em todas as formas, exceto o Deslocamento. Equipamentos que esteja vestindo ou carregando não se transformam."]]],"secoesEn":[["Traços",["Magic Resistance. The quasit has Advantage on saving throws against spells and other magical effects."]],["Ações",["Rend. Melee Attack Roll: +5, reach 5 ft. Hit: 5 (1d4 + 3) Slashing damage, and the target has the Poisoned condition until the start of the quasit's next turn.","Invisibility. The quasit casts Invisibility on itself, requiring no spell components and using Charisma as the spellcasting ability.","Scare (1/Day). Wisdom Saving Throw: DC 10, one creature within 20 feet. Failure: The target has the Frightened condition. At the end of each of its turns, the target repeats the save, ending the effect on itself on a success. After 1 minute, it succeeds automatically.","Shape-Shift. The quasit shape-shifts to resemble a bat (Speed 10 ft., Fly 40 ft.), a centipede (40 ft., Climb 40 ft.), or a toad (40 ft., Swim 40 ft.), or it returns to its true form. Its game statistics are the same in each form, except for its Speed. Any equipment it is wearing or carrying isn't transformed."]]]},"Rakshasa":{"tipo":"Médio Ínfero, Leal e Mau","ca":"17","pv":"221 (26d8+104)","desl":"12 m","ini":"+8 (18)","atr":[14,17,18,13,16,20],"info":[["Perícias","Enganação +10, Intuição +8, Percepção +8"],["Vulnerabilidades","Perfurante damage from weapons wielded by creatures under the effect of a Bless spell"],["Imunidades","Enfeitiçado, Amedrontado"],["Sentidos","Visão Verdadeira 18 m; Percepção passiva 18"],["Idiomas","Comum, Infernal"]],"cr":"13","secoes":[["Traços",["Resistência à Magia Maior. O rakshasa é bem-sucedido automaticamente em salvaguardas contra magias e outros efeitos mágicos, e as jogadas de ataque de magias erram automaticamente contra ele. Sem a permissão do rakshasa, nenhuma magia consegue observá-lo à distância nem detectar seus pensamentos, tipo de criatura ou tendência.","Restauração Ínfera. Se o rakshasa morrer fora dos Nove Infernos, seu corpo vira icor e ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar dos Nove Infernos."]],["Ações",["Ataque Múltiplo. O rakshasa faz três ataques de Toque Amaldiçoado.","Toque Amaldiçoado. Jogada de Ataque Corpo a Corpo: +10, alcance 1,5 m. Acerto: 12 (2d6 + 5) de dano Cortante mais 19 (3d12) de dano Necrótico. Se o alvo for uma criatura, ele fica amaldiçoado. Enquanto amaldiçoado, o alvo não recebe benefício ao terminar um Descanso Curto ou Longo.","Comando Funesto (Recarga 5–6). Salvaguarda de Sabedoria: CD 18, cada inimigo numa Emanação de 9 m a partir do rakshasa. Falha: 28 (8d6) de dano Psíquico, e o alvo fica nas condições Amedrontado e Incapacitado até o início do próximo turno do rakshasa.","Conjuração. O rakshasa conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 18): À Vontade: Detectar Magia, Detectar Pensamentos, Disfarçar-se, Mão Mágica, Ilusão Menor. 1/Dia Cada: Voo, Invisibilidade, Imagem Maior, Mudança de Plano."]]],"secoesEn":[["Traços",["Greater Magic Resistance. The rakshasa automatically succeeds on saving throws against spells and other magical effects, and the attack rolls of spells automatically miss it. Without the rakshasa's permission, no spell can observe the rakshasa remotely or detect its thoughts, creature type, or alignment.","Fiendish Restoration. If the rakshasa dies outside the Nine Hells, its body turns to ichor, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells."]],["Ações",["Multiattack. The rakshasa makes three Cursed Touch attacks.","Cursed Touch. Melee Attack Roll: +10, reach 5 ft. Hit: 12 (2d6 + 5) Slashing damage plus 19 (3d12) Necrotic damage. If the target is a creature, it is cursed. While cursed, the target gains no benefit from finishing a Short or Long Rest.","Baleful Command (Recharge 5-6). Wisdom Saving Throw: DC 18, each enemy in a 30-foot Emanation originating from the rakshasa. Failure: 28 (8d6) Psychic damage, and the target has the Frightened and Incapacitated conditions until the start of the rakshasa's next turn.","Spellcasting. The rakshasa casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 18): At Will: Detect Magic, Detect Thoughts, Disguise Self, Mage Hand, Minor Illusion 1/Day Each: Fly, Invisibility, Major Image, Plane Shift"]]]},"Red Dragon Wyrmling":{"tipo":"Médio Dragão (Cromático), Caótico e Mau","ca":"17","pv":"75 (10d8+30)","desl":"9 m, escalada 9 m, voo 18 m","ini":"+2 (12)","atr":[19,10,17,12,11,15],"info":[["Salvaguardas","Des +2, Sab +2"],["Perícias","Percepção +4, Furtividade +2"],["Imunidades","Fogo"],["Sentidos","Percepção às Cegas 3 m, Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Dracônico"]],"cr":"4","secoes":[["Ações",["Ataque Múltiplo. O dragão faz dois ataques de Dilacerar.","Dilacerar. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 9 (1d10 + 4) de dano Cortante mais 3 (1d6) de dano de Fogo.","Sopro de Fogo (Recarga 5–6). Salvaguarda de Destreza: CD 13, cada criatura num Cone de 4,5 m. Falha: 24 (7d6) de dano de Fogo. Sucesso: Metade do dano."]]],"secoesEn":[["Ações",["Multiattack. The dragon makes two Rend attacks.","Rend. Melee Attack Roll: +6, reach 5 ft. Hit: 9 (1d10 + 4) Slashing damage plus 3 (1d6) Fire damage.","Fire Breath (Recharge 5-6). Dexterity Saving Throw: DC 13, each creature in a 15-foot Cone. Failure: 24 (7d6) Fire damage. Success: Half damage."]]]},"Young Red Dragon":{"tipo":"Grande Dragão (Cromático), Caótico e Mau","ca":"18","pv":"178 (17d10+85)","desl":"12 m, escalada 12 m, voo 24 m","ini":"+4 (14)","atr":[23,10,21,14,11,19],"info":[["Salvaguardas","Des +4, Sab +4"],["Perícias","Percepção +8, Furtividade +4"],["Imunidades","Fogo"],["Sentidos","Percepção às Cegas 9 m, Visão no Escuro 36 m; Percepção passiva 18"],["Idiomas","Comum, Dracônico"]],"cr":"10","secoes":[["Ações",["Ataque Múltiplo. O dragão faz três ataques de Dilacerar.","Dilacerar. Jogada de Ataque Corpo a Corpo: +10, alcance 3 m. Acerto: 13 (2d6 + 6) de dano Cortante mais 3 (1d6) de dano de Fogo.","Sopro de Fogo (Recarga 5–6). Salvaguarda de Destreza: CD 17, cada criatura num Cone de 9 m. Falha: 56 (16d6) de dano de Fogo. Sucesso: Metade do dano."]]],"secoesEn":[["Ações",["Multiattack. The dragon makes three Rend attacks.","Rend. Melee Attack Roll: +10, reach 10 ft. Hit: 13 (2d6 + 6) Slashing damage plus 3 (1d6) Fire damage.","Fire Breath (Recharge 5-6). Dexterity Saving Throw: DC 17, each creature in a 30-foot Cone. Failure: 56 (16d6) Fire damage. Success: Half damage."]]]},"Adult Red Dragon":{"tipo":"Enorme Dragão (Cromático), Caótico e Mau","ca":"19","pv":"256 (19d12+133)","desl":"12 m, escalada 12 m, voo 24 m","ini":"+12 (22)","atr":[27,10,25,16,13,23],"info":[["Salvaguardas","Des +6, Sab +7"],["Perícias","Percepção +13, Furtividade +6"],["Imunidades","Fogo"],["Sentidos","Percepção às Cegas 18 m, Visão no Escuro 36 m; Percepção passiva 23"],["Idiomas","Comum, Dracônico"]],"cr":"17","secoes":[["Traços",["Resistência Lendária (3/Dia, ou 4/Dia no Covil). Se o dragão falhar numa salvaguarda, ele pode escolher ser bem-sucedido."]],["Ações",["Ataque Múltiplo. O dragão faz três ataques de Dilacerar. Ele pode substituir um ataque por um uso de Conjuração para conjurar Raio Ardente.","Dilacerar. Jogada de Ataque Corpo a Corpo: +14, alcance 3 m. Acerto: 13 (1d10 + 8) de dano Cortante mais 5 (2d4) de dano de Fogo.","Sopro de Fogo (Recarga 5–6). Salvaguarda de Destreza: CD 21, cada criatura num Cone de 18 m. Falha: 59 (17d6) de dano de Fogo. Sucesso: Metade do dano.","Conjuração. O dragão conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 20, +12 para acertar com ataques de magia): À Vontade: Comando (versão de 2º círculo), Detectar Magia, Raio Ardente. 1/Dia: Bola de Fogo."]],["Ações Lendárias",["Usos de Ação Lendária: 3 (4 no Covil). Imediatamente após o turno de outra criatura, o dragão pode gastar um uso para realizar uma das ações a seguir. O dragão recupera todos os usos gastos no início de cada um de seus turnos.","Presença Imperiosa. O dragão usa Conjuração para conjurar Comando (versão de 2º círculo). O dragão não pode realizar esta ação de novo até o início do seu próximo turno.","Raios Ígneos. O dragão usa Conjuração para conjurar Raio Ardente. O dragão não pode realizar esta ação de novo até o início do seu próximo turno.","Bote. O dragão se move até metade do seu Deslocamento e faz um ataque de Dilacerar."]]],"secoesEn":[["Traços",["Legendary Resistance (3/Day, or 4/Day in Lair). If the dragon fails a saving throw, it can choose to succeed instead."]],["Ações",["Multiattack. The dragon makes three Rend attacks. It can replace one attack with a use of Spellcasting to cast Scorching Ray.","Rend. Melee Attack Roll: +14, reach 10 ft. Hit: 13 (1d10 + 8) Slashing damage plus 5 (2d4) Fire damage.","Fire Breath (Recharge 5-6). Dexterity Saving Throw: DC 21, each creature in a 60-foot Cone. Failure: 59 (17d6) Fire damage. Success: Half damage.","Spellcasting. The dragon casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 20, +12 to hit with spell attacks): At Will: Command (level 2 version), Detect Magic, Scorching Ray 1/Day: Fireball"]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the dragon can expend a use to take one of the following actions. The dragon regains all expended uses at the start of each of its turns.","Commanding Presence. The dragon uses Spellcasting to cast Command (level 2 version). The dragon can't take this action again until the start of its next turn.","Fiery Rays. The dragon uses Spellcasting to cast Scorching Ray. The dragon can't take this action again until the start of its next turn.","Pounce. The dragon moves up to half its Speed, and it makes one Rend attack."]]]},"Ancient Red Dragon":{"tipo":"Imenso Dragão (Cromático), Caótico e Mau","ca":"22","pv":"507 (26d20+234)","desl":"12 m, escalada 12 m, voo 24 m","ini":"+14 (24)","atr":[30,10,29,18,15,27],"info":[["Salvaguardas","Des +7, Sab +9"],["Perícias","Percepção +16, Furtividade +7"],["Imunidades","Fogo"],["Sentidos","Percepção às Cegas 18 m, Visão no Escuro 36 m; Percepção passiva 26"],["Idiomas","Comum, Dracônico"]],"cr":"24","secoes":[["Traços",["Resistência Lendária (4/Dia, ou 5/Dia no Covil). Se o dragão falhar numa salvaguarda, ele pode escolher ser bem-sucedido."]],["Ações",["Ataque Múltiplo. O dragão faz três ataques de Dilacerar. Ele pode substituir um ataque por um uso de Conjuração para conjurar Raio Ardente (versão de 3º círculo).","Dilacerar. Jogada de Ataque Corpo a Corpo: +17, alcance 4,5 m. Acerto: 19 (2d8 + 10) de dano Cortante mais 10 (3d6) de dano de Fogo.","Sopro de Fogo (Recarga 5–6). Salvaguarda de Destreza: CD 24, cada criatura num Cone de 27 m. Falha: 91 (26d6) de dano de Fogo. Sucesso: Metade do dano.","Conjuração. O dragão conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 23, +15 para acertar com ataques de magia): À Vontade: Comando (versão de 2º círculo), Detectar Magia, Raio Ardente (versão de 3º círculo). 1/Dia Cada: Bola de Fogo (versão de 6º círculo), Vidência."]],["Ações Lendárias",["Usos de Ação Lendária: 3 (4 no Covil). Imediatamente após o turno de outra criatura, o dragão pode gastar um uso para realizar uma das ações a seguir. O dragão recupera todos os usos gastos no início de cada um de seus turnos.","Presença Imperiosa. O dragão usa Conjuração para conjurar Comando (versão de 2º círculo). O dragão não pode realizar esta ação de novo até o início do seu próximo turno.","Raios Ígneos. O dragão usa Conjuração para conjurar Raio Ardente (versão de 3º círculo). O dragão não pode realizar esta ação de novo até o início do seu próximo turno.","Bote. O dragão se move até metade do seu Deslocamento e faz um ataque de Dilacerar."]]],"secoesEn":[["Traços",["Legendary Resistance (4/Day, or 5/Day in Lair). If the dragon fails a saving throw, it can choose to succeed instead."]],["Ações",["Multiattack. The dragon makes three Rend attacks. It can replace one attack with a use of Spellcasting to cast Scorching Ray (level 3 version).","Rend. Melee Attack Roll: +17, reach 15 ft. Hit: 19 (2d8 + 10) Slashing damage plus 10 (3d6) Fire damage.","Fire Breath (Recharge 5-6). Dexterity Saving Throw: DC 24, each creature in a 90-foot Cone. Failure: 91 (26d6) Fire damage. Success: Half damage.","Spellcasting. The dragon casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 23, +15 to hit with spell attacks): At Will: Command (level 2 version), Detect Magic, Scorching Ray (level 3 version) 1/Day Each: Fireball (level 6 version), Scrying"]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the dragon can expend a use to take one of the following actions. The dragon regains all expended uses at the start of each of its turns.","Commanding Presence. The dragon uses Spellcasting to cast Command (level 2 version). The dragon can't take this action again until the start of its next turn.","Fiery Rays. The dragon uses Spellcasting to cast Scorching Ray (level 3 version). The dragon can't take this action again until the start of its next turn.","Pounce. The dragon moves up to half its Speed, and it makes one Rend attack."]]]},"Remorhaz":{"tipo":"Enorme Monstruosidade, Sem Tendência","ca":"17","pv":"195 (17d12+85)","desl":"12 m, escavação 9 m","ini":"+5 (15)","atr":[24,13,21,4,10,5],"info":[["Imunidades","Frio, Fogo"],["Sentidos","Visão no Escuro 18 m, Sentido Sísmico 18 m; Percepção passiva 10"],["Idiomas","Nenhum"]],"cr":"11","secoes":[["Traços",["Aura de Calor. No fim de cada turno do remorhaz, cada criatura numa Emanação de 1,5 m a partir dele sofre 16 (3d10) de dano de Fogo."]],["Ações",["Mordida. Jogada de Ataque Corpo a Corpo: +11, alcance 3 m. Acerto: 18 (2d10 + 7) de dano Perfurante mais 14 (4d6) de dano de Fogo. Se o alvo for uma criatura Grande ou menor, ele fica na condição Agarrado (CD 17 para escapar) e na condição Impedido até o agarrão acabar."]],["Ações Bônus",["Engolir. Salvaguarda de Força: CD 19, uma criatura Grande ou menor Agarrada pelo remorhaz (ele pode ter até duas criaturas engolidas ao mesmo tempo). Falha: O alvo é engolido pelo remorhaz e a condição Agarrado acaba. Uma criatura engolida fica nas condições Cego e Impedido, tem Cobertura Total contra ataques e outros efeitos de fora do remorhaz e sofre 10 (3d6) de dano Ácido mais 10 (3d6) de dano de Fogo no início de cada turno do remorhaz. Se o remorhaz sofrer 30 ou mais de dano num único turno vindo de uma criatura dentro dele, ele precisa ser bem-sucedido numa salvaguarda de Constituição CD 15 no fim desse turno ou regurgita todas as criaturas engolidas, que caem num espaço a até 1,5 m dele na condição Caído. Se o remorhaz morrer, qualquer criatura engolida deixa de estar Impedida e pode escapar do cadáver usando 4,5 m de movimento, saindo Caída."]]],"secoesEn":[["Traços",["Heat Aura. At the end of each of the remorhaz's turns, each creature in a 5-foot Emanation originating from the remorhaz takes 16 (3d10) Fire damage."]],["Ações",["Bite. Melee Attack Roll: +11, reach 10 ft. Hit: 18 (2d10 + 7) Piercing damage plus 14 (4d6) Fire damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 17), and it has the Restrained condition until the grapple ends."]],["Ações Bônus",["Swallow. Strength Saving Throw: DC 19, one Large or smaller creature Grappled by the remorhaz (it can have up to two creatures swallowed at a time). Failure: The target is swallowed by the remorhaz, and the Grappled condition ends. A swallowed creature has the Blinded and Restrained conditions, it has Total Cover against attacks and other effects outside the remorhaz, and it takes 10 (3d6) Acid damage plus 10 (3d6) Fire damage at the start of each of the remorhaz's turns. If the remorhaz takes 30 damage or more on a single turn from a creature inside it, the remorhaz must succeed on a DC 15 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, each of which falls in a space within 5 feet of the remorhaz and has the Prone condition. If the remorhaz dies, any swallowed creature no longer has the Restrained condition and can escape from the corpse by using 15 feet of movement, exiting Prone."]]]},"Roc":{"tipo":"Imenso Monstruosidade, Sem Tendência","ca":"15","pv":"248 (16d20+80)","desl":"6 m, voo 36 m","ini":"+8 (18)","atr":[28,10,20,3,10,9],"info":[["Salvaguardas","Des +4, Sab +4"],["Perícias","Percepção +8"],["Sentidos","Percepção passiva 18"],["Idiomas","Nenhum"]],"cr":"11","secoes":[["Ações",["Ataque Múltiplo. A roca faz dois ataques de Bico. Ela pode substituir um ataque por um ataque de Garras.","Bico. Jogada de Ataque Corpo a Corpo: +13, alcance 3 m. Acerto: 28 (3d12 + 9) de dano Perfurante.","Garras. Jogada de Ataque Corpo a Corpo: +13, alcance 1,5 m. Acerto: 23 (4d6 + 9) de dano Cortante. Se o alvo for uma criatura Enorme ou menor, ele fica na condição Agarrado (CD 19 para escapar) pelas duas garras e na condição Impedido até o agarrão acabar."]],["Ações Bônus",["Rasante (Recarga 5–6). Se a roca estiver agarrando uma criatura, ela voa até metade do seu Deslocamento de Voo sem provocar Ataques de Oportunidade e solta essa criatura."]]],"secoesEn":[["Ações",["Multiattack. The roc makes two Beak attacks. It can replace one attack with a Talons attack.","Beak. Melee Attack Roll: +13, reach 10 ft. Hit: 28 (3d12 + 9) Piercing damage.","Talons. Melee Attack Roll: +13, reach 5 ft. Hit: 23 (4d6 + 9) Slashing damage. If the target is a Huge or smaller creature, it has the Grappled condition (escape DC 19) from both talons, and it has the Restrained condition until the grapple ends."]],["Ações Bônus",["Swoop (Recharge 5-6). If the roc has a creature Grappled, the roc flies up to half its Fly Speed without provoking Opportunity Attacks and drops that creature."]]]},"Roper":{"tipo":"Grande Aberração, Neutro e Mau","ca":"20","pv":"93 (11d10+33)","desl":"3 m, escalada 6 m","ini":"+5 (15)","atr":[18,8,17,7,16,6],"info":[["Perícias","Percepção +6, Furtividade +5"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 16"],["Idiomas","Nenhum"]],"cr":"5","secoes":[["Traços",["Patas de Aranha. O roper consegue escalar superfícies difíceis, inclusive pelo teto, sem precisar fazer um teste de atributo."]],["Ações",["Ataque Múltiplo. O roper faz dois ataques de Tentáculo, usa Puxar e faz dois ataques de Mordida.","Mordida. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 17 (3d8 + 4) de dano Perfurante.","Tentáculo. Jogada de Ataque Corpo a Corpo: +7, alcance 18 m. Acerto: O alvo fica na condição Agarrado (CD 14 para escapar) por um de seis tentáculos e na condição Envenenado até o agarrão acabar. O tentáculo pode ser danificado, libertando a criatura agarrada quando destruído (CA 20, 10 PV, Imunidade a dano Venenoso e Psíquico). Danificar o tentáculo não causa dano ao roper, e um tentáculo destruído volta a crescer no início do próximo turno do roper.","Puxar. O roper puxa cada criatura Agarrada por ele até 9 m em linha reta na sua direção."]]],"secoesEn":[["Traços",["Spider Climb. The roper can climb difficult surfaces, including along ceilings, without needing to make an ability check."]],["Ações",["Multiattack. The roper makes two Tentacle attacks, uses Reel, and makes two Bite attacks.","Bite. Melee Attack Roll: +7, reach 5 ft. Hit: 17 (3d8 + 4) Piercing damage.","Tentacle. Melee Attack Roll: +7, reach 60 ft. Hit: The target has the Grappled condition (escape DC 14) from one of six tentacles, and the target has the Poisoned condition until the grapple ends. The tentacle can be damaged, freeing a creature it has Grappled when destroyed (AC 20, HP 10, Immunity to Poison and Psychic damage). Damaging the tentacle deals no damage to the roper, and a destroyed tentacle regrows at the start of the roper's next turn.","Reel. The roper pulls each creature Grappled by it up to 30 feet straight toward it."]]]},"Rust Monster":{"tipo":"Médio Monstruosidade, Sem Tendência","ca":"14","pv":"33 (6d8+6)","desl":"12 m","ini":"+1 (11)","atr":[13,12,13,2,13,6],"info":[["Sentidos","Visão no Escuro 18 m; Percepção passiva 11"],["Idiomas","Nenhum"]],"cr":"1/2","secoes":[["Traços",["Faro de Ferro. O monstro da ferrugem consegue localizar com precisão metais ferrosos a até 9 m de si."]],["Ações",["Ataque Múltiplo. O monstro da ferrugem faz um ataque de Mordida e usa Antenas duas vezes.","Mordida. Jogada de Ataque Corpo a Corpo: +3, alcance 1,5 m. Acerto: 5 (1d8 + 1) de dano Perfurante.","Antenas. O monstro da ferrugem escolhe um objeto de metal não mágico (armadura ou arma) vestido ou carregado por uma criatura a até 1,5 m de si. Salvaguarda de Destreza: CD 11, a criatura com o objeto. Falha: O objeto sofre uma penalidade de −1 na CA que concede (armadura) ou nas jogadas de ataque (arma). A armadura é destruída se a penalidade reduzir sua CA a 10, e a arma é destruída se a penalidade chegar a −5. A penalidade pode ser removida conjurando a magia Consertar na armadura ou na arma.","Destruir Metal. O monstro da ferrugem toca um objeto de metal não mágico a até 1,5 m de si que ninguém esteja vestindo ou carregando. O toque destrói um Cubo de 30 cm do objeto."]],["Reações",["Antenas Reflexas. Gatilho: Uma jogada de ataque atinge o monstro da ferrugem. Resposta: O monstro da ferrugem usa Antenas."]]],"secoesEn":[["Traços",["Iron Scent. The rust monster can pinpoint the location of ferrous metal within 30 feet of itself."]],["Ações",["Multiattack. The rust monster makes one Bite attack and uses Antennae twice.","Bite. Melee Attack Roll: +3, reach 5 ft. Hit: 5 (1d8 + 1) Piercing damage.","Antennae. The rust monster targets one nonmagical metal object--armor or a weapon--worn or carried by a creature within 5 feet of itself. Dexterity Saving Throw: DC 11, the creature with the object. Failure: The object takes a -1 penalty to the AC it offers (armor) or to its attack rolls (weapon). Armor is destroyed if the penalty reduces its AC to 10, and a weapon is destroyed if its penalty reaches -5. The penalty can be removed by casting the Mending spell on the armor or weapon.","Destroy Metal. The rust monster touches a nonmagical metal object within 5 feet of itself that isn't being worn or carried. The touch destroys a 1-foot Cube of the object."]],["Reações",["Reflexive Antennae. Trigger: An attack roll hits the rust monster. Response: The rust monster uses Antennae."]]]},"Sahuagin Warrior":{"tipo":"Médio Ínfero, Leal e Mau","ca":"12","pv":"22 (4d8+4)","desl":"9 m, natação 12 m","ini":"+0 (10)","atr":[13,11,12,12,13,9],"info":[["Perícias","Percepção +5"],["Resistências","Ácido, Frio"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 15"],["Idiomas","Sahuagin"]],"cr":"1/2","secoes":[["Traços",["Frenesi Sangrento. O sahuagin tem Vantagem em jogadas de ataque contra qualquer criatura que não esteja com todos os seus Pontos de Vida.","Anfíbio Limitado. O sahuagin consegue respirar ar e água, mas precisa ficar submerso pelo menos uma vez a cada 4 horas para não sufocar fora d'água.","Telepatia com Tubarões. O sahuagin consegue controlar magicamente tubarões a até 36 m de si, usando uma telepatia especial."]],["Ações",["Ataque Múltiplo. O sahuagin faz dois ataques de Garra.","Garra. Jogada de Ataque Corpo a Corpo: +3, alcance 1,5 m. Acerto: 4 (1d6 + 1) de dano Cortante."]],["Ações Bônus",["Investida Aquática. O sahuagin nada até o seu Deslocamento de Natação em linha reta na direção de um inimigo que consiga ver."]]],"secoesEn":[["Traços",["Blood Frenzy. The sahuagin has Advantage on attack rolls against any creature that doesn't have all its Hit Points.","Limited Amphibiousness. The sahuagin can breathe air and water, but it must be submerged at least once every 4 hours to avoid suffocating outside water.","Shark Telepathy. The sahuagin can magically control sharks within 120 feet of itself, using a special telepathy."]],["Ações",["Multiattack. The sahuagin makes two Claw attacks.","Claw. Melee Attack Roll: +3, reach 5 ft. Hit: 4 (1d6 + 1) Slashing damage."]],["Ações Bônus",["Aquatic Charge. The sahuagin swims up to its Swim Speed straight toward an enemy it can see."]]]},"Salamander":{"tipo":"Grande Elemental, Neutro e Mau","ca":"15","pv":"90 (12d10+24)","desl":"9 m, escalada 9 m","ini":"+2 (12)","atr":[18,14,15,11,10,12],"info":[["Vulnerabilidades","Frio"],["Imunidades","Fogo"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Primordial (Ignan)"]],"cr":"5","secoes":[["Traços",["Aura de Fogo. No fim de cada turno da salamandra, cada criatura à escolha dela numa Emanação de 1,5 m a partir da salamandra sofre 7 (2d6) de dano de Fogo."]],["Ações",["Ataque Múltiplo. A salamandra faz dois ataques de Lança Flamejante. Ela pode substituir um ataque por um uso de Constringir.","Lança Flamejante. Jogada de Ataque Corpo a Corpo ou à Distância: +7, alcance 1,5 m ou distância 6/18 m. Acerto: 13 (2d8 + 4) de dano Perfurante mais 7 (2d6) de dano de Fogo. Acerto ou Erro: A lança volta magicamente para a mão da salamandra logo após um ataque à distância.","Constringir. Salvaguarda de Força: CD 15, uma criatura Grande ou menor que a salamandra consiga ver a até 3 m. Falha: 11 (2d6 + 4) de dano Contundente mais 7 (2d6) de dano de Fogo. O alvo fica na condição Agarrado (CD 14 para escapar) e na condição Impedido até o agarrão acabar."]]],"secoesEn":[["Traços",["Fire Aura. At the end of each of the salamander's turns, each creature of the salamander's choice in a 5-foot Emanation originating from the salamander takes 7 (2d6) Fire damage."]],["Ações",["Multiattack. The salamander makes two Flame Spear attacks. It can replace one attack with a use of Constrict.","Flame Spear. Melee or Ranged Attack Roll: +7, reach 5 ft. or range 20/60 ft. Hit: 13 (2d8 + 4) Piercing damage plus 7 (2d6) Fire damage. Hit or Miss: The spear magically returns to the salamander's hand immediately after a ranged attack.","Constrict. Strength Saving Throw: DC 15, one Large or smaller creature the salamander can see within 10 feet. Failure: 11 (2d6 + 4) Bludgeoning damage plus 7 (2d6) Fire damage. The target has the Grappled condition (escape DC 14), and it has the Restrained condition until the grapple ends."]]]},"Satyr":{"tipo":"Médio Fada, Caótico e Neutro","ca":"13","pv":"31 (7d8)","desl":"12 m","ini":"+3 (13)","atr":[12,16,11,12,10,14],"info":[["Perícias","Percepção +2, Atuação +6, Furtividade +5"],["Sentidos","Percepção passiva 12"],["Idiomas","Comum, Élfico, Silvestre"]],"cr":"1/2","secoes":[["Traços",["Resistência à Magia. O sátiro tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Cascos. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 5 (1d4 + 3) de dano Contundente. Se o alvo for uma criatura Média ou menor, o sátiro o empurra até 3 m em linha reta para longe de si.","Zombaria. Salvaguarda de Sabedoria: CD 12, uma criatura que o sátiro consiga ver a até 27 m. Falha: 5 (1d6 + 2) de dano Psíquico."]]],"secoesEn":[["Traços",["Magic Resistance. The satyr has Advantage on saving throws against spells and other magical effects."]],["Ações",["Hooves. Melee Attack Roll: +5, reach 5 ft. Hit: 5 (1d4 + 3) Bludgeoning damage. If the target is a Medium or smaller creature, the satyr pushes the target up to 10 feet straight away from itself.","Mockery. Wisdom Saving Throw: DC 12, one creature the satyr can see within 90 feet. Failure: 5 (1d6 + 2) Psychic damage."]]]},"Scout":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"13","pv":"16 (3d8+3)","desl":"9 m","ini":"+2 (12)","atr":[11,14,12,11,13,11],"info":[["Perícias","Natureza +4, Percepção +5, Furtividade +6, Sobrevivência +5"],["Equipamento","Leather Armor, Longbow, Shortsword"],["Sentidos","Percepção passiva 15"],["Idiomas","Comum mais one other language"]],"cr":"1/2","secoes":[["Ações",["Ataque Múltiplo. O batedor faz dois ataques, usando Espada Curta e Arco Longo em qualquer combinação.","Espada Curta. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 5 (1d6 + 2) de dano Perfurante.","Arco Longo. Jogada de Ataque à Distância: +4, distância 45/180 m. Acerto: 6 (1d8 + 2) de dano Perfurante."]]],"secoesEn":[["Ações",["Multiattack. The scout makes two attacks, using Shortsword and Longbow in any combination.","Shortsword. Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Piercing damage.","Longbow. Ranged Attack Roll: +4, range 150/600 ft. Hit: 6 (1d8 + 2) Piercing damage."]]]},"Sea Hag":{"tipo":"Médio Fada, Caótico e Mau","ca":"14","pv":"52 (7d8+21)","desl":"9 m, natação 12 m","ini":"+1 (11)","atr":[16,13,16,12,12,13],"info":[["Sentidos","Visão no Escuro 18 m; Percepção passiva 11"],["Idiomas","Comum, Gigante, Primordial (Aquan)"]],"cr":"2","secoes":[["Traços",["Anfíbio. A bruxa consegue respirar ar e água.","Magia do Conciliábulo. Enquanto estiver a até 9 m de pelo menos duas bruxas aliadas, a bruxa pode conjurar uma das magias a seguir, sem precisar de componentes Materiais, usando o tempo de conjuração normal da magia e Inteligência como atributo de conjuração (CD de salvaguarda de magia 11): Augúrio, Convocar Familiar, Identificar, Localizar Objeto, Vidência ou Servo Invisível. A bruxa precisa terminar um Descanso Longo antes de usar este traço para conjurar essa mesma magia de novo.","Aparência Vil. Salvaguarda de Sabedoria: CD 11, qualquer Fera ou Humanoide que comece o turno a até 9 m da bruxa e consiga ver sua verdadeira forma. Falha: O alvo fica na condição Amedrontado até o início do seu próximo turno. Sucesso: O alvo fica imune à Aparência Vil desta bruxa por 24 horas."]],["Ações",["Garra. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 10 (2d6 + 3) de dano Cortante.","Olhar Mortal (Recarga 5–6). Salvaguarda de Sabedoria: CD 11, uma criatura Amedrontada que a bruxa consiga ver a até 9 m. Falha: Se o alvo tiver 20 Pontos de Vida ou menos, ele cai a 0 Pontos de Vida. Caso contrário, o alvo sofre 13 (3d8) de dano Psíquico.","Aparência Ilusória. A bruxa conjura Disfarçar-se, usando Constituição como atributo de conjuração (CD de salvaguarda de magia 13). A duração da magia é de 24 horas."]]],"secoesEn":[["Traços",["Amphibious. The hag can breathe air and water.","Coven Magic. While within 30 feet of at least two hag allies, the hag can cast one of the following spells, requiring no Material components, using the spell's normal casting time, and using Intelligence as the spellcasting ability (spell save DC 11): Augury, Find Familiar, Identify, Locate Object, Scrying, or Unseen Servant. The hag must finish a Long Rest before using this trait to cast that spell again.","Vile Appearance. Wisdom Saving Throw: DC 11, any Beast or Humanoid that starts its turn within 30 feet of the hag and can see the hag's true form. Failure: The target has the Frightened condition until the start of its next turn. Success: The target is immune to this hag's Vile Appearance for 24 hours."]],["Ações",["Claw. Melee Attack Roll: +5, reach 5 ft. Hit: 10 (2d6 + 3) Slashing damage.","Death Glare (Recharge 5-6). Wisdom Saving Throw: DC 11, one Frightened creature the hag can see within 30 feet. Failure: If the target has 20 Hit Points or fewer, it drops to 0 Hit Points. Otherwise, the target takes 13 (3d8) Psychic damage.","Illusory Appearance. The hag casts Disguise Self, using Constitution as the spellcasting ability (spell save DC 13). The spell's duration is 24 hours."]]]},"Shadow":{"tipo":"Médio Morto-Vivo, Caótico e Mau","ca":"12","pv":"27 (5d8+5)","desl":"12 m","ini":"+2 (12)","atr":[6,14,13,6,10,8],"info":[["Perícias","Furtividade +6"],["Vulnerabilidades","Radiante"],["Resistências","Ácido, Frio, Fogo, Elétrico, Trovejante"],["Imunidades","Necrótico, Venenoso; Exaustão, Amedrontado, Agarrado, Paralisado, Petrificado, Envenenado, Caído, Impedido, Inconsciente"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Nenhum"]],"cr":"1/2","secoes":[["Traços",["Amorfo. A sombra pode passar por um espaço de apenas 2,5 cm de largura sem gastar movimento extra.","Fraqueza à Luz Solar. Sob luz do sol, a sombra tem Desvantagem em Testes de D20."]],["Ações",["Golpe Drenante. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 5 (1d6 + 2) de dano Necrótico, e o valor de Força do alvo diminui em 1d4. O alvo morre se isso reduzir esse valor a 0. Se um Humanoide for morto por este ataque, uma Sombra se ergue do cadáver 1d4 horas depois."]],["Ações Bônus",["Furtividade Sombria. Sob Penumbra ou Escuridão, a sombra realiza a ação Esconder."]]],"secoesEn":[["Traços",["Amorphous. The shadow can move through a space as narrow as 1 inch without expending extra movement to do so.","Sunlight Weakness. While in sunlight, the shadow has Disadvantage on D20 Tests."]],["Ações",["Draining Swipe. Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Necrotic damage, and the target's Strength score decreases by 1d4. The target dies if this reduces that score to 0. If a Humanoid is slain by this attack, a Shadow rises from the corpse 1d4 hours later."]],["Ações Bônus",["Shadow Stealth. While in Dim Light or Darkness, the shadow takes the Hide action."]]]},"Shambling Mound":{"tipo":"Grande Planta, Sem Tendência","ca":"15","pv":"110 (13d10+39)","desl":"9 m, natação 6 m","ini":"-1 (9)","atr":[18,8,16,5,10,5],"info":[["Perícias","Furtividade +3"],["Resistências","Frio, Fogo"],["Imunidades","Elétrico; Surdo, Exaustão"],["Sentidos","Percepção às Cegas 18 m; Percepção passiva 10"],["Idiomas","Nenhum"]],"cr":"5","secoes":[["Traços",["Absorção Elétrica. Sempre que o monte rastejante for submetido a dano Elétrico, ele recupera Pontos de Vida iguais ao dano Elétrico causado."]],["Ações",["Ataque Múltiplo. O monte rastejante faz três ataques de Gavinha Carregada. Ele pode substituir um ataque por um uso de Engolfar.","Gavinha Carregada. Jogada de Ataque Corpo a Corpo: +7, alcance 3 m. Acerto: 7 (1d6 + 4) de dano Contundente mais 5 (2d4) de dano Elétrico. Se o alvo for uma criatura Média ou menor, o monte rastejante o puxa 1,5 m em linha reta na sua direção.","Engolfar. Salvaguarda de Força: CD 15, uma criatura Média ou menor a até 1,5 m. Falha: O alvo é puxado para o espaço do monte rastejante e fica na condição Agarrado (CD 14 para escapar). Até o agarrão acabar, o alvo fica nas condições Cego e Impedido e sofre 10 (3d6) de dano Elétrico no início de cada um de seus turnos. Q
