s","Venenoso, Radiante; Enfeitiçado, Exaustão, Amedrontado, Envenenado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 24"],["Idiomas","All; telepatia 36 m"]],"cr":"21","secoes":[["Traços",["Percepção Divina. O solar sabe quando ouve uma mentira.","Restauração Exaltada. Se o solar morrer fora do Monte Celéstia, seu corpo desaparece e ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar do Monte Celéstia.","Resistência Lendária (4/Dia). Se o solar falhar numa salvaguarda, ele pode escolher ser bem-sucedido.","Resistência à Magia. O solar tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O solar faz dois ataques de Espada Voadora. Ele pode substituir um ataque por um uso de Arco Mortífero.","Espada Voadora. Jogada de Ataque Corpo a Corpo ou à Distância: +15, alcance 3 m ou distância 36 m. Acerto: 22 (4d6 + 8) de dano Cortante mais 36 (8d8) de dano Radiante. Acerto ou Erro: A espada volta magicamente para a mão do solar ou paira a até 1,5 m dele logo após um ataque à distância.","Arco Mortífero. Salvaguarda de Destreza: CD 21, uma criatura que o solar consiga ver a até 180 m. Falha: Se a criatura tiver 100 Pontos de Vida ou menos, ela morre. Caso contrário, sofre 24 (4d8 + 6) de dano Perfurante mais 36 (8d8) de dano Radiante.","Conjuração. O solar conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 25): À Vontade: Detectar o Bem e o Mal. 1/Dia Cada: Comunhão, Controlar o Clima, Dissipar o Bem e o Mal, Ressurreição."]],["Ações Bônus",["Auxílio Divino (3/Dia). O solar conjura Curar Ferimentos (versão de 2º círculo), Restauração Menor ou Remover Maldição, usando o mesmo atributo de conjuração de Conjuração."]],["Ações Lendárias",["Usos de Ação Lendária: 3. Imediatamente após o turno de outra criatura, o solar pode gastar um uso para realizar uma das ações a seguir. O solar recupera todos os usos gastos no início de cada um de seus turnos.","Olhar Cegante. Salvaguarda de Constituição: CD 25, uma criatura que o solar consiga ver a até 36 m. Falha: O alvo fica na condição Cego por 1 minuto. Falha ou Sucesso: O solar não pode realizar esta ação de novo até o início do seu próximo turno.","Teletransporte Radiante. O solar se teletransporta até 18 m para um espaço desocupado que consiga ver. Salvaguarda de Destreza: CD 25, cada criatura numa Emanação de 3 m a partir do solar no espaço de destino. Falha: 11 (2d10) de dano Radiante. Sucesso: Metade do dano."]]],"secoesEn":[["Traços",["Divine Awareness. The solar knows if it hears a lie.","Exalted Restoration. If the solar dies outside Mount Celestia, its body disappears, and it gains a new body instantly, reviving with all its Hit Points somewhere in Mount Celestia.","Legendary Resistance (4/Day). If the solar fails a saving throw, it can choose to succeed instead.","Magic Resistance. The solar has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The solar makes two Flying Sword attacks. It can replace one attack with a use of Slaying Bow.","Flying Sword. Melee or Ranged Attack Roll: +15, reach 10 ft. or range 120 ft. Hit: 22 (4d6 + 8) Slashing damage plus 36 (8d8) Radiant damage. Hit or Miss: The sword magically returns to the solar's hand or hovers within 5 feet of the solar immediately after a ranged attack.","Slaying Bow. Dexterity Saving Throw: DC 21, one creature the solar can see within 600 feet. Failure: If the creature has 100 Hit Points or fewer, it dies. It otherwise takes 24 (4d8 + 6) Piercing damage plus 36 (8d8) Radiant damage.","Spellcasting. The solar casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 25): At Will: Detect Evil and Good 1/Day Each: Commune, Control Weather, Dispel Evil and Good, Resurrection"]],["Ações Bônus",["Divine Aid (3/Day). The solar casts Cure Wounds (level 2 version), Lesser Restoration, or Remove Curse, using the same spellcasting ability as Spellcasting."]],["Ações Lendárias",["Legendary Action Uses: 3. Immediately after another creature's turn, the solar can expend a use to take one of the following actions. The solar regains all expended uses at the start of each of its turns.","Blinding Gaze. Constitution Saving Throw: DC 25, one creature the solar can see within 120 feet. Failure: The target has the Blinded condition for 1 minute. Failure or Success: The solar can't take this action again until the start of its next turn.","Radiant Teleport. The solar teleports up to 60 feet to an unoccupied space it can see. Dexterity Saving Throw: DC 25, each creature in a 10-foot Emanation originating from the solar at its destination space. Failure: 11 (2d10) Radiant damage. Success: Half damage."]]]},"Specter":{"tipo":"Médio Morto-Vivo, Caótico e Mau","ca":"12","pv":"22 (5d8)","desl":"9 m, voo 15 m (pairar)","ini":"+2 (12)","atr":[1,14,11,10,10,11],"info":[["Resistências","Ácido, Contundente, Frio, Fogo, Elétrico, Perfurante, Cortante, Trovejante"],["Imunidades","Necrótico, Venenoso; Enfeitiçado, Exaustão, Agarrado, Paralisado, Petrificado, Envenenado, Caído, Impedido, Inconsciente"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Understands Comum mais one other language mas não fala"]],"cr":"1","secoes":[["Traços",["Movimento Incorpóreo. O espectro pode atravessar outras criaturas e objetos como se fossem Terreno Difícil. Ele sofre 5 (1d10) de dano de Energia se terminar o turno dentro de um objeto.","Sensibilidade à Luz Solar. Sob luz do sol, o espectro tem Desvantagem em testes de atributo e jogadas de ataque."]],["Ações",["Drenar Vida. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 7 (2d6) de dano Necrótico. Se o alvo for uma criatura, seu máximo de Pontos de Vida diminui numa quantidade igual ao dano sofrido."]]],"secoesEn":[["Traços",["Incorporeal Movement. The specter can move through other creatures and objects as if they were Difficult Terrain. It takes 5 (1d10) Force damage if it ends its turn inside an object.","Sunlight Sensitivity. While in sunlight, the specter has Disadvantage on ability checks and attack rolls."]],["Ações",["Life Drain. Melee Attack Roll: +4, reach 5 ft. Hit: 7 (2d6) Necrotic damage. If the target is a creature, its Hit Point maximum decreases by an amount equal to the damage taken."]]]},"Sphinx of Wonder":{"tipo":"Miúdo Celestial, Leal e Bom","ca":"13","pv":"24 (7d4+7)","desl":"6 m, voo 12 m","ini":"+3 (13)","atr":[6,17,13,15,12,11],"info":[["Perícias","Arcanismo +4, Religião +4, Furtividade +5"],["Resistências","Necrótico, Psíquico, Radiante"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 11"],["Idiomas","Celestial, Comum"]],"cr":"1","secoes":[["Traços",["Resistência à Magia. A esfinge tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Dilacerar. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 5 (1d4 + 3) de dano Cortante mais 7 (2d6) de dano Radiante."]],["Reações",["Lampejo de Engenhosidade (2/Dia). Gatilho: A esfinge ou outra criatura a até 9 m faz um teste de atributo ou uma salvaguarda. Resposta: A esfinge soma 2 à rolagem."]]],"secoesEn":[["Traços",["Magic Resistance. The sphinx has Advantage on saving throws against spells and other magical effects."]],["Ações",["Rend. Melee Attack Roll: +5, reach 5 ft. Hit: 5 (1d4 + 3) Slashing damage plus 7 (2d6) Radiant damage."]],["Reações",["Burst of Ingenuity (2/Day). Trigger: The sphinx or another creature within 30 feet makes an ability check or a saving throw. Response: The sphinx adds 2 to the roll."]]]},"Sphinx of Lore":{"tipo":"Grande Celestial, Leal e Neutro","ca":"17","pv":"170 (20d10+60)","desl":"12 m, voo 18 m","ini":"+10 (20)","atr":[18,15,16,18,18,18],"info":[["Perícias","Arcanismo +12, História +12, Percepção +8, Religião +12"],["Resistências","Necrótico, Radiante"],["Imunidades","Psíquico; Enfeitiçado, Amedrontado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 18"],["Idiomas","Celestial, Comum"]],"cr":"11","secoes":[["Traços",["Inescrutável. Nenhuma magia consegue observar a esfinge à distância nem detectar seus pensamentos sem a permissão dela. Testes de Sabedoria (Intuição) para descobrir suas intenções ou sinceridade são feitos com Desvantagem.","Resistência Lendária (3/Dia, ou 4/Dia no Covil). Se a esfinge falhar numa salvaguarda, ela pode escolher ser bem-sucedida."]],["Ações",["Ataque Múltiplo. A esfinge faz três ataques de Garra.","Garra. Jogada de Ataque Corpo a Corpo: +8, alcance 1,5 m. Acerto: 14 (3d6 + 4) de dano Cortante.","Rugido Dilacerador de Mentes (Recarga 5–6). Salvaguarda de Sabedoria: CD 16, cada inimigo numa Emanação de 90 m a partir da esfinge. Falha: 35 (10d6) de dano Psíquico, e o alvo fica na condição Incapacitado até o início do próximo turno da esfinge.","Conjuração. A esfinge conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Inteligência como atributo de conjuração (CD de salvaguarda de magia 16): À Vontade: Detectar Magia, Identificar, Mão Mágica, Ilusão Menor, Prestidigitação. 1/Dia Cada: Dissipar Magia, Lenda, Localizar Objeto, Mudança de Plano, Remover Maldição, Idiomas."]],["Ações Lendárias",["Usos de Ação Lendária: 3 (4 no Covil). Imediatamente após o turno de outra criatura, a esfinge pode gastar um uso para realizar uma das ações a seguir. A esfinge recupera todos os usos gastos no início de cada um de seus turnos.","Espreita Arcana. A esfinge pode se teletransportar até 9 m para um espaço desocupado que consiga ver e faz um ataque de Garra.","Peso dos Anos. Salvaguarda de Constituição: CD 16, uma criatura que a esfinge consiga ver a até 36 m. Falha: O alvo ganha 1 nível de Exaustão. Enquanto tiver algum nível de Exaustão, o alvo aparenta 3d10 anos a mais. Falha ou Sucesso: A esfinge não pode realizar esta ação de novo até o início do seu próximo turno."]]],"secoesEn":[["Traços",["Inscrutable. No magic can observe the sphinx remotely or detect its thoughts without its permission. Wisdom (Insight) checks made to ascertain its intentions or sincerity are made with Disadvantage.","Legendary Resistance (3/Day, or 4/Day in Lair). If the sphinx fails a saving throw, it can choose to succeed instead."]],["Ações",["Multiattack. The sphinx makes three Claw attacks.","Claw. Melee Attack Roll: +8, reach 5 ft. Hit: 14 (3d6 + 4) Slashing damage.","Mind-Rending Roar (Recharge 5-6). Wisdom Saving Throw: DC 16, each enemy in a 300-foot Emanation originating from the sphinx. Failure: 35 (10d6) Psychic damage, and the target has the Incapacitated condition until the start of the sphinx's next turn.","Spellcasting. The sphinx casts one of the following spells, requiring no Material components and using Intelligence as the spellcasting ability (spell save DC 16): At Will: Detect Magic, Identify, Mage Hand, Minor Illusion, Prestidigitation 1/Day Each: Dispel Magic, Legend Lore, Locate Object, Plane Shift, Remove Curse, Tongues"]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the sphinx can expend a use to take one of the following actions. The sphinx regains all expended uses at the start of each of its turns.","Arcane Prowl. The sphinx can teleport up to 30 feet to an unoccupied space it can see, and it makes one Claw attack.","Weight of Years. Constitution Saving Throw: DC 16, one creature the sphinx can see within 120 feet. Failure: The target gains 1 Exhaustion level. While the target has any Exhaustion levels, it appears 3d10 years older. Failure or Success: The sphinx can't take this action again until the start of its next turn."]]]},"Sphinx of Valor":{"tipo":"Grande Celestial, Leal e Neutro","ca":"17","pv":"199 (19d10+95)","desl":"12 m, voo 18 m","ini":"+12 (22)","atr":[22,10,20,16,23,18],"info":[["Salvaguardas","Des +6, Con +11, Int +9, Sab +12"],["Perícias","Arcanismo +9, Percepção +12, Religião +15"],["Resistências","Necrótico, Radiante"],["Imunidades","Psíquico; Enfeitiçado, Amedrontado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 22"],["Idiomas","Celestial, Comum"]],"cr":"17","secoes":[["Traços",["Inescrutável. Nenhuma magia consegue observar a esfinge à distância nem detectar seus pensamentos sem a permissão dela. Testes de Sabedoria (Intuição) para descobrir suas intenções ou sinceridade são feitos com Desvantagem.","Resistência Lendária (3/Dia, ou 4/Dia no Covil). Se a esfinge falhar numa salvaguarda, ela pode escolher ser bem-sucedida."]],["Ações",["Ataque Múltiplo. A esfinge faz dois ataques de Garra e usa Rugido.","Garra. Jogada de Ataque Corpo a Corpo: +12, alcance 1,5 m. Acerto: 20 (4d6 + 6) de dano Cortante.","Rugido (3/Dia). A esfinge emite um rugido mágico. Cada vez que ruge, o rugido tem um efeito diferente, conforme abaixo (a sequência recomeça quando ela faz um Descanso Longo):","Primeiro Rugido. Salvaguarda de Sabedoria: CD 20, cada inimigo numa Emanação de 150 m a partir da esfinge. Falha: O alvo fica na condição Amedrontado por 1 minuto.","Segundo Rugido. Salvaguarda de Sabedoria: CD 20, cada inimigo numa Emanação de 150 m a partir da esfinge. Falha: O alvo fica na condição Paralisado e repete a salvaguarda no fim de cada um de seus turnos, encerrando o efeito em si mesmo com um sucesso. Após 1 minuto, ele é bem-sucedido automaticamente.","Terceiro Rugido. Salvaguarda de Constituição: CD 20, cada inimigo numa Emanação de 150 m a partir da esfinge. Falha: 44 (8d10) de dano Trovejante, e o alvo fica na condição Caído. Sucesso: Apenas metade do dano.","Conjuração. A esfinge conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Sabedoria como atributo de conjuração (CD de salvaguarda de magia 20): À Vontade: Detectar o Bem e o Mal, Taumaturgia. 1/Dia Cada: Detectar Magia, Dissipar Magia, Restauração Maior, Banquete de Heróis, Zona da Verdade."]],["Ações Lendárias",["Usos de Ação Lendária: 3 (4 no Covil). Imediatamente após o turno de outra criatura, a esfinge pode gastar um uso para realizar uma das ações a seguir. A esfinge recupera todos os usos gastos no início de cada um de seus turnos.","Espreita Arcana. A esfinge pode se teletransportar até 9 m para um espaço desocupado que consiga ver e faz um ataque de Garra.","Peso dos Anos. Salvaguarda de Constituição: CD 16, uma criatura que a esfinge consiga ver a até 36 m. Falha: O alvo ganha 1 nível de Exaustão. Enquanto tiver algum nível de Exaustão, o alvo aparenta 3d10 anos a mais. Falha ou Sucesso: A esfinge não pode realizar esta ação de novo até o início do seu próximo turno."]]],"secoesEn":[["Traços",["Inscrutable. No magic can observe the sphinx remotely or detect its thoughts without its permission. Wisdom (Insight) checks made to ascertain its intentions or sincerity are made with Disadvantage.","Legendary Resistance (3/Day, or 4/Day in Lair). If the sphinx fails a saving throw, it can choose to succeed instead."]],["Ações",["Multiattack. The sphinx makes two Claw attacks and uses Roar.","Claw. Melee Attack Roll: +12, reach 5 ft. Hit: 20 (4d6 + 6) Slashing damage.","Roar (3/Day). The sphinx emits a magical roar. Whenever it roars, the roar has a different effect, as detailed below (the sequence resets when it takes a Long Rest):","First Roar. Wisdom Saving Throw: DC 20, each enemy in a 500-foot Emanation originating from the sphinx. Failure: The target has the Frightened condition for 1 minute.","Second Roar. Wisdom Saving Throw: DC 20, each enemy in a 500-foot Emanation originating from the sphinx. Failure: The target has the Paralyzed condition, and it repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically.","Third Roar. Constitution Saving Throw: DC 20, each enemy in a 500-foot Emanation originating from the sphinx. Failure: 44 (8d10) Thunder damage, and the target has the Prone condition. Success: Half damage only.","Spellcasting. The sphinx casts one of the following spells, requiring no Material components and using Wisdom as the spellcasting ability (spell save DC 20): At Will: Detect Evil and Good, Thaumaturgy 1/Day Each: Detect Magic, Dispel Magic, Greater Restoration, Heroes' Feast, Zone of Truth"]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the sphinx can expend a use to take one of the following actions. The sphinx regains all expended uses at the start of each of its turns.","Arcane Prowl. The sphinx can teleport up to 30 feet to an unoccupied space it can see, and it makes one Claw attack.","Weight of Years. Constitution Saving Throw: DC 16, one creature the sphinx can see within 120 feet. Failure: The target gains 1 Exhaustion level. While the target has any Exhaustion levels, it appears 3d10 years older. Failure or Success: The sphinx can't take this action again until the start of its next turn."]]]},"Spirit Naga":{"tipo":"Grande Ínfero, Caótico e Mau","ca":"17","pv":"135 (18d10+36)","desl":"12 m","ini":"+3 (13)","atr":[18,17,14,16,15,16],"info":[["Salvaguardas","Des +6, Con +5, Sab +5, Car +6"],["Imunidades","Venenoso; Enfeitiçado, Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 12"],["Idiomas","Abissal, Comum"]],"cr":"8","secoes":[["Traços",["Restauração Ínfera. Se morrer, a naga volta à vida em 1d6 dias e recupera todos os seus Pontos de Vida. Só uma magia Desejo pode impedir este traço de funcionar."]],["Ações",["Ataque Múltiplo. A naga faz três ataques, usando Mordida ou Raio Necrótico em qualquer combinação.","Mordida. Jogada de Ataque Corpo a Corpo: +7, alcance 3 m. Acerto: 7 (1d6 + 4) de dano Perfurante mais 14 (4d6) de dano Venenoso.","Raio Necrótico. Jogada de Ataque à Distância: +6, distância 18 m. Acerto: 21 (6d6) de dano Necrótico.","Conjuração. A naga conjura uma das magias a seguir, sem precisar de componentes Somáticos ou Materiais e usando Inteligência como atributo de conjuração (CD de salvaguarda de magia 14): À Vontade: Detectar Magia, Mão Mágica, Ilusão Menor, Respirar na Água. 2/Dia Cada: Detectar Pensamentos, Porta Dimensional, Imobilizar Pessoa (versão de 3º círculo), Relâmpago (versão de 4º círculo)."]]],"secoesEn":[["Traços",["Fiendish Restoration. If it dies, the naga returns to life in 1d6 days and regains all its Hit Points. Only a Wish spell can prevent this trait from functioning."]],["Ações",["Multiattack. The naga makes three attacks, using Bite or Necrotic Ray in any combination.","Bite. Melee Attack Roll: +7, reach 10 ft. Hit: 7 (1d6 + 4) Piercing damage plus 14 (4d6) Poison damage.","Necrotic Ray. Ranged Attack Roll: +6, range 60 ft. Hit: 21 (6d6) Necrotic damage.","Spellcasting. The naga casts one of the following spells, requiring no Somatic or Material components and using Intelligence as the spellcasting ability (spell save DC 14): At Will: Detect Magic, Mage Hand, Minor Illusion, Water Breathing 2/Day Each: Detect Thoughts, Dimension Door, Hold Person (level 3 version), Lightning Bolt (level 4 version)"]]]},"Sprite":{"tipo":"Miúdo Fada, Neutro e Bom","ca":"15","pv":"10 (4d4)","desl":"3 m, voo 12 m","ini":"+4 (14)","atr":[3,18,10,14,13,11],"info":[["Perícias","Percepção +3, Furtividade +8"],["Sentidos","Percepção passiva 13"],["Idiomas","Comum, Élfico, Silvestre"]],"cr":"1/4","secoes":[["Ações",["Espada de Agulha. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 6 (1d4 + 4) de dano Perfurante.","Arco Encantador. Jogada de Ataque à Distância: +6, distância 12/48 m. Acerto: 1 de dano Perfurante, e o alvo fica na condição Enfeitiçado até o início do próximo turno do sprite.","Ver o Coração. Salvaguarda de Carisma: CD 10, uma criatura a até 1,5 m que o sprite consiga ver (Celestiais, Ínferos e Mortos-Vivos falham automaticamente). Falha: O sprite descobre as emoções e a tendência do alvo.","Invisibilidade. O sprite conjura Invisibilidade em si mesmo, sem precisar de componentes de magia e usando Carisma como atributo de conjuração."]]],"secoesEn":[["Ações",["Needle Sword. Melee Attack Roll: +6, reach 5 ft. Hit: 6 (1d4 + 4) Piercing damage.","Enchanting Bow. Ranged Attack Roll: +6, range 40/160 ft. Hit: 1 Piercing damage, and the target has the Charmed condition until the start of the sprite's next turn.","Heart Sight. Charisma Saving Throw: DC 10, one creature within 5 feet the sprite can see (Celestials, Fiends, and Undead automatically fail the save). Failure: The sprite knows the target's emotions and alignment.","Invisibility. The sprite casts Invisibility on itself, requiring no spell components and using Charisma as the spellcasting ability."]]]},"Spy":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"12","pv":"27 (6d8)","desl":"9 m, escalada 9 m","ini":"+4 (14)","atr":[10,15,10,12,14,16],"info":[["Perícias","Enganação +5, Intuição +4, Investigação +5, Percepção +6, Prestidigitação +4, Furtividade +6"],["Equipamento","Hand Crossbow, Shortsword, Thieves' Tools"],["Sentidos","Percepção passiva 16"],["Idiomas","Comum mais one other language"]],"cr":"1","secoes":[["Ações",["Espada Curta. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 5 (1d6 + 2) de dano Perfurante mais 7 (2d6) de dano Venenoso.","Besta de Mão. Jogada de Ataque à Distância: +4, distância 9/36 m. Acerto: 5 (1d6 + 2) de dano Perfurante mais 7 (2d6) de dano Venenoso."]],["Ações Bônus",["Ação Ardilosa. O espião realiza a ação Disparada, Desengajar ou Esconder."]]],"secoesEn":[["Ações",["Shortsword. Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Piercing damage plus 7 (2d6) Poison damage.","Hand Crossbow. Ranged Attack Roll: +4, range 30/120 ft. Hit: 5 (1d6 + 2) Piercing damage plus 7 (2d6) Poison damage."]],["Ações Bônus",["Cunning Action. The spy takes the Dash, Disengage, or Hide action."]]]},"Stirge":{"tipo":"Miúdo Monstruosidade, Sem Tendência","ca":"13","pv":"5 (2d4)","desl":"3 m, voo 12 m","ini":"+3 (13)","atr":[4,16,11,2,8,6],"info":[["Sentidos","Visão no Escuro 18 m; Percepção passiva 9"],["Idiomas","Nenhum"]],"cr":"1/8","secoes":[["Ações",["Probóscide. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 6 (1d6 + 3) de dano Perfurante, e a estirge se prende ao alvo. Enquanto presa, a estirge não pode fazer ataques de Probóscide, e o alvo sofre 5 (2d4) de dano Necrótico no início de cada turno da estirge. A estirge pode se soltar gastando 1,5 m de movimento. O alvo ou uma criatura a até 1,5 m dele pode soltar a estirge com uma ação."]]],"secoesEn":[["Ações",["Proboscis. Melee Attack Roll: +5, reach 5 ft. Hit: 6 (1d6 + 3) Piercing damage, and the stirge attaches to the target. While attached, the stirge can't make Proboscis attacks, and the target takes 5 (2d4) Necrotic damage at the start of each of the stirge's turns. The stirge can detach itself by spending 5 feet of its movement. The target or a creature within 5 feet of it can detach the stirge as an action."]]]},"Stone Giant":{"tipo":"Enorme Gigante, Neutro","ca":"17","pv":"126 (11d12+55)","desl":"12 m","ini":"+5 (15)","atr":[23,15,20,10,12,9],"info":[["Salvaguardas","Des +5, Con +8, Sab +4"],["Perícias","Atletismo +12, Percepção +4, Furtividade +5"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Gigante"]],"cr":"7","secoes":[["Ações",["Ataque Múltiplo. O gigante faz dois ataques, usando Clava de Pedra ou Pedregulho em qualquer combinação.","Clava de Pedra. Jogada de Ataque Corpo a Corpo: +9, alcance 4,5 m. Acerto: 22 (3d10 + 6) de dano Contundente.","Pedregulho. Jogada de Ataque à Distância: +9, distância 18/72 m. Acerto: 15 (2d8 + 6) de dano Contundente. Se o alvo for uma criatura Grande ou menor, ele fica na condição Caído."]],["Reações",["Desviar Projétil (Recarga 5–6). Gatilho: O gigante é atingido por uma jogada de ataque à distância e sofre dano Contundente, Perfurante ou Cortante dela. Resposta: O gigante reduz o dano que sofre do ataque em 11 (1d10 + 6) e, se esse dano for reduzido a 0, pode redirecionar parte da força do ataque. Salvaguarda de Destreza: CD 17, uma criatura que o gigante consiga ver a até 18 m. Falha: 11 (1d10 + 6) de dano de Energia."]]],"secoesEn":[["Ações",["Multiattack. The giant makes two attacks, using Stone Club or Boulder in any combination.","Stone Club. Melee Attack Roll: +9, reach 15 ft. Hit: 22 (3d10 + 6) Bludgeoning damage.","Boulder. Ranged Attack Roll: +9, range 60/240 ft. Hit: 15 (2d8 + 6) Bludgeoning damage. If the target is a Large or smaller creature, it has the Prone condition."]],["Reações",["Deflect Missile (Recharge 5-6). Trigger: The giant is hit by a ranged attack roll and takes Bludgeoning, Piercing, or Slashing damage from it. Response: The giant reduces the damage it takes from the attack by 11 (1d10 + 6), and if that damage is reduced to 0, the giant can redirect some of the attack's force. Dexterity Saving Throw: DC 17, one creature the giant can see within 60 feet. Failure: 11 (1d10 + 6) Force damage."]]]},"Stone Golem":{"tipo":"Grande Constructo, Sem Tendência","ca":"18","pv":"220 (21d10+105)","desl":"9 m","ini":"+3 (13)","atr":[22,9,20,3,11,1],"info":[["Imunidades","Venenoso, Psíquico; Enfeitiçado, Exaustão, Amedrontado, Paralisado, Petrificado, Envenenado"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 10"],["Idiomas","Understands Comum mais two other languages mas não fala"]],"cr":"10","secoes":[["Traços",["Forma Imutável. O golem não pode mudar de forma.","Resistência à Magia. O golem tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O golem faz dois ataques, usando Pancada ou Raio de Energia em qualquer combinação.","Pancada. Jogada de Ataque Corpo a Corpo: +10, alcance 1,5 m. Acerto: 15 (2d8 + 6) de dano Contundente mais 9 (2d8) de dano de Energia.","Raio de Energia. Jogada de Ataque à Distância: +9, distância 36 m. Acerto: 22 (4d10) de dano de Energia."]],["Ações Bônus",["Lentidão (Recarga 5–6). O golem conjura a magia Lentidão, sem precisar de componentes de magia e usando Constituição como atributo de conjuração (CD de salvaguarda de magia 17)."]]],"secoesEn":[["Traços",["Immutable Form. The golem can't shape-shift.","Magic Resistance. The golem has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The golem makes two attacks, using Slam or Force Bolt in any combination.","Slam. Melee Attack Roll: +10, reach 5 ft. Hit: 15 (2d8 + 6) Bludgeoning damage plus 9 (2d8) Force damage.","Force Bolt. Ranged Attack Roll: +9, range 120 ft. Hit: 22 (4d10) Force damage."]],["Ações Bônus",["Slow (Recharge 5-6). The golem casts the Slow spell, requiring no spell components and using Constitution as the spellcasting ability (spell save DC 17)."]]]},"Storm Giant":{"tipo":"Enorme Gigante, Caótico e Bom","ca":"16","pv":"230 (20d12+100)","desl":"15 m, voo 7,5 m (pairar), natação 15 m","ini":"+7 (17)","atr":[29,14,20,16,20,18],"info":[["Salvaguardas","For +14, Con +10, Sab +10, Car +9"],["Perícias","Arcanismo +8, Atletismo +14, História +8, Percepção +10"],["Resistências","Frio"],["Imunidades","Elétrico, Trovejante"],["Sentidos","Visão no Escuro 36 m, Visão Verdadeira 9 m; Percepção passiva 20"],["Idiomas","Comum, Gigante"]],"cr":"13","secoes":[["Traços",["Anfíbio. O gigante consegue respirar ar e água."]],["Ações",["Ataque Múltiplo. O gigante faz dois ataques, usando Espada da Tempestade ou Relâmpago em qualquer combinação.","Espada da Tempestade. Jogada de Ataque Corpo a Corpo: +14, alcance 3 m. Acerto: 23 (4d6 + 9) de dano Cortante mais 13 (3d8) de dano Elétrico.","Relâmpago. Jogada de Ataque à Distância: +14, distância 150 m. Acerto: 22 (2d12 + 9) de dano Elétrico, e o alvo fica nas condições Cego e Surdo até o início do próximo turno do gigante.","Tempestade de Raios (Recarga 5–6). Salvaguarda de Destreza: CD 18, cada criatura num Cilindro de 3 m de raio e 12 m de altura a partir de um ponto que o gigante consiga ver a até 150 m. Falha: 55 (10d10) de dano Elétrico. Sucesso: Metade do dano.","Conjuração. O gigante conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Sabedoria como atributo de conjuração (CD de salvaguarda de magia 18): À Vontade: Detectar Magia, Luz. 1/Dia: Controlar o Clima."]]],"secoesEn":[["Traços",["Amphibious. The giant can breathe air and water."]],["Ações",["Multiattack. The giant makes two attacks, using Storm Sword or Thunderbolt in any combination.","Storm Sword. Melee Attack Roll: +14, reach 10 ft. Hit: 23 (4d6 + 9) Slashing damage plus 13 (3d8) Lightning damage.","Thunderbolt. Ranged Attack Roll: +14, range 500 ft. Hit: 22 (2d12 + 9) Lightning damage, and the target has the Blinded and Deafened conditions until the start of the giant's next turn.","Lightning Storm (Recharge 5-6). Dexterity Saving Throw: DC 18, each creature in a 10-foot-radius, 40-foot-high Cylinder originating from a point the giant can see within 500 feet. Failure: 55 (10d10) Lightning damage. Success: Half damage.","Spellcasting. The giant casts one of the following spells, requiring no Material components and using Wisdom as the spellcasting ability (spell save DC 18): At Will: Detect Magic, Light 1/Day: Control Weather"]]]},"Succubus":{"tipo":"Médio Ínfero, Neutro e Mau","ca":"15","pv":"71 (13d8+13)","desl":"9 m, voo 18 m","ini":"+3 (13)","atr":[8,17,13,15,12,20],"info":[["Perícias","Enganação +9, Intuição +5, Percepção +5, Persuasão +9, Furtividade +7"],["Resistências","Frio, Fogo, Venenoso, Psíquico"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 15"],["Idiomas","Abissal, Comum, Infernal; telepatia 18 m"]],"cr":"4","secoes":[["Traços",["Forma de Íncubo. Quando o súcubo termina um Descanso Longo, ele pode se transformar num Íncubo, usando aquela ficha em vez desta."]],["Ações",["Ataque Múltiplo. O súcubo faz um ataque de Toque Ínfero e usa Encanto ou Beijo Drenante.","Toque Ínfero. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 16 (2d10 + 5) de dano Psíquico.","Encanto. O súcubo conjura Dominar Pessoa (versão de 8º círculo), sem precisar de componentes de magia e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 15).","Beijo Drenante. Salvaguarda de Constituição: CD 15, uma criatura Enfeitiçada pelo súcubo a até 1,5 m. Falha: 13 (3d8) de dano Psíquico. Sucesso: Metade do dano. Falha ou Sucesso: O máximo de Pontos de Vida do alvo diminui numa quantidade igual ao dano sofrido."]],["Ações Bônus",["Mudar de Forma. O súcubo se transforma num Humanoide Médio ou Pequeno, ou volta à sua forma verdadeira. Suas estatísticas de jogo são as mesmas em todas as formas, exceto que o Deslocamento de Voo só existe na forma verdadeira. Equipamentos que esteja vestindo ou carregando não se transformam."]]],"secoesEn":[["Traços",["Incubus Form. When the succubus finishes a Long Rest, it can shape-shift into an Incubus, using that stat block instead of this one."]],["Ações",["Multiattack. The succubus makes one Fiendish Touch attack and uses Charm or Draining Kiss.","Fiendish Touch. Melee Attack Roll: +7, reach 5 ft. Hit: 16 (2d10 + 5) Psychic damage.","Charm. The succubus casts Dominate Person (level 8 version), requiring no spell components and using Charisma as the spellcasting ability (spell save DC 15).","Draining Kiss. Constitution Saving Throw: DC 15, one creature Charmed by the succubus within 5 feet. Failure: 13 (3d8) Psychic damage. Success: Half damage. Failure or Success: The target's Hit Point maximum decreases by an amount equal to the damage taken."]],["Ações Bônus",["Shape-Shift. The succubus shape-shifts into a Medium or Small Humanoid, or it returns to its true form. Its game statistics are the same in each form, except its Fly Speed is available only in its true form. Any equipment it is wearing or carrying isn't transformed."]]]},"Tarrasque":{"tipo":"Imenso Monstruosidade (Titã), Sem Tendência","ca":"25","pv":"697 (34d20+340)","desl":"18 m, escavação 12 m, escalada 18 m","ini":"+18 (28)","atr":[30,11,30,3,11,11],"info":[["Salvaguardas","Des +9, Int +5, Sab +9, Car +9"],["Perícias","Percepção +9"],["Resistências","Contundente, Perfurante, Cortante"],["Imunidades","Fogo, Venenoso; Enfeitiçado, Surdo, Amedrontado, Paralisado, Envenenado"],["Sentidos","Percepção às Cegas 36 m; Percepção passiva 19"],["Idiomas","Nenhum"]],"cr":"30","secoes":[["Traços",["Resistência Lendária (6/Dia). Se o tarrasque falhar numa salvaguarda, ele pode escolher ser bem-sucedido.","Resistência à Magia. O tarrasque tem Vantagem em salvaguardas contra magias e outros efeitos mágicos.","Carapaça Refletora. Se o tarrasque for alvo de uma magia Mísseis Mágicos ou de uma magia que exija jogada de ataque à distância, role 1d6. Com 1–5, o tarrasque não é afetado. Com 6, o tarrasque não é afetado e reflete a magia, transformando o conjurador no alvo.","Monstro de Cerco. O tarrasque causa dano dobrado a objetos e estruturas."]],["Ações",["Ataque Múltiplo. O tarrasque faz um ataque de Mordida e três outros ataques, usando Garra ou Cauda em qualquer combinação.","Mordida. Jogada de Ataque Corpo a Corpo: +19, alcance 4,5 m. Acerto: 36 (4d12 + 10) de dano Perfurante, e o alvo fica na condição Agarrado (CD 20 para escapar). Até o agarrão acabar, o alvo fica na condição Impedido e não pode se teletransportar.","Garra. Jogada de Ataque Corpo a Corpo: +19, alcance 4,5 m. Acerto: 28 (4d8 + 10) de dano Cortante.","Cauda. Jogada de Ataque Corpo a Corpo: +19, alcance 9 m. Acerto: 23 (3d8 + 10) de dano Contundente. Se o alvo for uma criatura Enorme ou menor, ele fica na condição Caído.","Bramido Trovejante (Recarga 5–6). Salvaguarda de Constituição: CD 27, cada criatura e cada objeto que ninguém esteja vestindo ou carregando num Cone de 45 m. Falha: 78 (12d12) de dano Trovejante, e o alvo fica nas condições Surdo e Amedrontado até o fim do seu próximo turno. Sucesso: Apenas metade do dano."]],["Ações Bônus",["Engolir. Salvaguarda de Força: CD 27, uma criatura Grande ou menor Agarrada pelo tarrasque (ele pode ter até seis criaturas engolidas ao mesmo tempo). Falha: O alvo é engolido e a condição Agarrado acaba. Uma criatura engolida fica nas condições Cego e Impedido e não pode se teletransportar, tem Cobertura Total contra ataques e outros efeitos de fora do tarrasque e sofre 56 (16d6) de dano Ácido no início de cada turno do tarrasque. Se o tarrasque sofrer 60 ou mais de dano num único turno vindo de uma criatura dentro dele, ele precisa ser bem-sucedido numa salvaguarda de Constituição CD 20 no fim desse turno ou regurgita todas as criaturas engolidas, que caem num espaço a até 3 m dele na condição Caído. Se o tarrasque morrer, qualquer criatura engolida deixa de estar Impedida e pode escapar do cadáver usando 6 m de movimento, saindo Caída."]],["Ações Lendárias",["Usos de Ação Lendária: 3. Imediatamente após o turno de outra criatura, o tarrasque pode gastar um uso para realizar uma das ações a seguir. O tarrasque recupera todos os usos gastos no início de cada um de seus turnos.","Investida. O tarrasque se move até metade do seu Deslocamento e faz um ataque de Garra ou de Cauda.","Passo que Abala o Mundo. O tarrasque se move até o seu Deslocamento. No fim desse movimento, ele cria uma onda de choque instantânea numa Emanação de 18 m a partir de si. Criaturas nessa área perdem a Concentração e, se forem Médias ou menores, ficam na condição Caído. O tarrasque não pode realizar esta ação de novo até o início do seu próximo turno."]]],"secoesEn":[["Traços",["Legendary Resistance (6/Day). If the tarrasque fails a saving throw, it can choose to succeed instead.","Magic Resistance. The tarrasque has Advantage on saving throws against spells and other magical effects.","Reflective Carapace. If the tarrasque is targeted by a Magic Missile spell or a spell that requires a ranged attack roll, roll 1d6. On a 1-5, the tarrasque is unaffected. On a 6, the tarrasque is unaffected and reflects the spell, turning the caster into the target.","Siege Monster. The tarrasque deals double damage to objects and structures."]],["Ações",["Multiattack. The tarrasque makes one Bite attack and three other attacks, using Claw or Tail in any combination.","Bite. Melee Attack Roll: +19, reach 15 ft. Hit: 36 (4d12 + 10) Piercing damage, and the target has the Grappled condition (escape DC 20). Until the grapple ends, the target has the Restrained condition and can't teleport.","Claw. Melee Attack Roll: +19, reach 15 ft. Hit: 28 (4d8 + 10) Slashing damage.","Tail. Melee Attack Roll: +19, reach 30 ft. Hit: 23 (3d8 + 10) Bludgeoning damage. If the target is a Huge or smaller creature, it has the Prone condition.","Thunderous Bellow (Recharge 5-6). Constitution Saving Throw: DC 27, each creature and each object that isn't being worn or carried in a 150-foot Cone. Failure: 78 (12d12) Thunder damage, and the target has the Deafened and Frightened conditions until the end of its next turn. Success: Half damage only."]],["Ações Bônus",["Swallow. Strength Saving Throw: DC 27, one Large or smaller creature Grappled by the tarrasque (it can have up to six creatures swallowed at a time). Failure: The target is swallowed, and the Grappled condition ends. A swallowed creature has the Blinded and Restrained conditions and can't teleport, it has Total Cover against attacks and other effects outside the tarrasque, and it takes 56 (16d6) Acid damage at the start of each of the tarrasque's turns. If the tarrasque takes 60 damage or more on a single turn from a creature inside it, the tarrasque must succeed on a DC 20 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, each of which falls in a space within 10 feet of the tarrasque and has the Prone condition. If the tarrasque dies, any swallowed creature no longer has the Restrained condition and can escape from the corpse using 20 feet of movement, exiting Prone."]],["Ações Lendárias",["Legendary Action Uses: 3. Immediately after another creature's turn, the tarrasque can expend a use to take one of the following actions. The tarrasque regains all expended uses at the start of each of its turns.","Onslaught. The tarrasque moves up to half its Speed, and it makes one Claw or Tail attack.","World-Shaking Movement. The tarrasque moves up to its Speed. At the end of this movement, the tarrasque creates an instantaneous shock wave in a 60-foot Emanation originating from itself. Creatures in that area lose Concentration and, if Medium or smaller, have the Prone condition. The tarrasque can't take this action again until the start of its next turn."]]]},"Tough":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"12","pv":"32 (5d8+10)","desl":"9 m","ini":"+1 (11)","atr":[15,12,14,10,10,11],"info":[["Equipamento","Heavy Crossbow, Leather Armor, Mace"],["Sentidos","Percepção passiva 10"],["Idiomas","Comum"]],"cr":"1/2","secoes":[["Traços",["Táticas de Matilha. O brutamontes tem Vantagem numa jogada de ataque contra uma criatura se pelo menos um aliado dele estiver a até 1,5 m dela e não estiver na condição Incapacitado."]],["Ações",["Maça. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 5 (1d6 + 2) de dano Contundente.","Besta Pesada. Jogada de Ataque à Distância: +3, distância 30/120 m. Acerto: 6 (1d10 + 1) de dano Perfurante."]]],"secoesEn":[["Traços",["Pack Tactics. The tough has Advantage on an attack roll against a creature if at least one of the tough's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."]],["Ações",["Mace. Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Bludgeoning damage.","Heavy Crossbow. Ranged Attack Roll: +3, range 100/400 ft. Hit: 6 (1d10 + 1) Piercing damage."]]]},"Tough Boss":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"16","pv":"82 (11d8+33)","desl":"9 m","ini":"+2 (12)","atr":[17,14,16,11,10,11],"info":[["Salvaguardas","For +5, Con +5, Car +2"],["Equipamento","Chain Mail, Heavy Crossbow, Warhammer"],["Sentidos","Percepção passiva 10"],["Idiomas","Comum mais one other language"]],"cr":"4","secoes":[["Traços",["Táticas de Matilha. O brutamontes tem Vantagem numa jogada de ataque contra uma criatura se pelo menos um aliado dele estiver a até 1,5 m dela e não estiver na condição Incapacitado."]],["Ações",["Ataque Múltiplo. O brutamontes faz dois ataques, usando Martelo de Guerra ou Besta Pesada em qualquer combinação.","Martelo de Guerra. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 12 (2d8 + 3) de dano Contundente. Se o alvo for uma criatura Grande ou menor, o brutamontes o empurra até 3 m em linha reta para longe de si.","Besta Pesada. Jogada de Ataque à Distância: +4, distância 30/120 m. Acerto: 13 (2d10 + 2) de dano Perfurante."]]],"secoesEn":[["Traços",["Pack Tactics. The tough has Advantage on an attack roll against a creature if at least one of the tough's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."]],["Ações",["Multiattack. The tough makes two attacks, using Warhammer or Heavy Crossbow in any combination.","Warhammer. Melee Attack Roll: +5, reach 5 ft. Hit: 12 (2d8 + 3) Bludgeoning damage. If the target is a Large or smaller creature, the tough pushes the target up to 10 feet straight away from itself.","Heavy Crossbow. Ranged Attack Roll: +4, range 100/400 ft. Hit: 13 (2d10 + 2) Piercing damage."]]]},"Treant":{"tipo":"Enorme Planta, Caótico e Bom","ca":"16","pv":"138 (12d12+60)","desl":"9 m","ini":"+3 (13)","atr":[23,8,21,12,16,12],"info":[["Vulnerabilidades","Fogo"],["Resistências","Contundente, Perfurante"],["Sentidos","Percepção passiva 13"],["Idiomas","Comum, Druídico, Élfico, Silvestre"]],"cr":"9","secoes":[["Traços",["Monstro de Cerco. O treant causa dano dobrado a objetos e estruturas."]],["Ações",["Ataque Múltiplo. O treant faz dois ataques de Pancada.","Pancada. Jogada de Ataque Corpo a Corpo: +10, alcance 1,5 m. Acerto: 16 (3d6 + 6) de dano Contundente.","Chuva de Casca. Jogada de Ataque à Distância: +10, distância 54 m. Acerto: 28 (4d10 + 6) de dano Perfurante.","Animar Árvores (1/Dia). O treant anima magicamente até duas árvores que consiga ver a até 18 m de si. Cada árvore usa a ficha do Treant, exceto que tem Inteligência e Carisma 1, não fala e não tem esta ação. A árvore age logo depois do treant, na mesma contagem de Iniciativa, e obedece ao treant. A árvore permanece animada por 1 dia ou até morrer, até o treant morrer ou até ficar a mais de 36 m dele. Depois, ela finca raízes, se possível."]]],"secoesEn":[["Traços",["Siege Monster. The treant deals double damage to objects and structures."]],["Ações",["Multiattack. The treant makes two Slam attacks.","Slam. Melee Attack Roll: +10, reach 5 ft. Hit: 16 (3d6 + 6) Bludgeoning damage.","Hail of Bark. Ranged Attack Roll: +10, range 180 ft. Hit: 28 (4d10 + 6) Piercing damage.","Animate Trees (1/Day). The treant magically animates up to two trees it can see within 60 feet of itself. Each tree uses the Treant stat block, except it has Intelligence and Charisma scores of 1, it can't speak, and it lacks this action. The tree takes its turn immediately after the treant on the same Initiative count, and it obeys the treant. A tree remains animate for 1 day or until it dies, the treant dies, or it is more than 120 feet from the treant. The tree then takes root if possible."]]]},"Troll":{"tipo":"Grande Gigante, Caótico e Mau","ca":"15","pv":"94 (9d10+45)","desl":"9 m","ini":"+1 (11)","atr":[18,13,20,7,9,7],"info":[["Perícias","Percepção +5"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 15"],["Idiomas","Gigante"]],"cr":"5","secoes":[["Traços",["Membros Repugnantes (4/Dia). Se o troll terminar qualquer turno Sangrando e tiver sofrido 15 ou mais de dano Cortante nesse turno, um dos membros do troll é decepado, cai no espaço do troll e se torna um Membro de Troll. O membro age imediatamente após o turno do troll. O troll tem 1 nível de Exaustão para cada membro perdido e faz crescer membros novos na próxima vez que recuperar Pontos de Vida.","Regeneração. O troll recupera 15 Pontos de Vida no início de cada um de seus turnos. Se o troll sofrer dano Ácido ou de Fogo, este traço não funciona no próximo turno dele. O troll só morre se começar o turno com 0 Pontos de Vida e não regenerar."]],["Ações",["Ataque Múltiplo. O troll faz três ataques de Dilacerar.","Dilacerar. Jogada de Ataque Corpo a Corpo: +7, alcance 3 m. Acerto: 11 (2d6 + 4) de dano Cortante."]],["Ações Bônus",["Investida. O troll se move até metade do seu Deslocamento em linha reta na direção de um inimigo que consiga ver."]]],"secoesEn":[["Traços",["Loathsome Limbs (4/Day). If the troll ends any turn Bloodied and took 15+ Slashing damage during that turn, one of the troll's limbs is severed, falls into the troll's space, and becomes a Troll Limb. The limb acts immediately after the troll's turn. The troll has 1 Exhaustion level for each missing limb, and it grows replacement limbs the next time it regains Hit Points.","Regeneration. The troll regains 15 Hit Points at the start of each of its turns. If the troll takes Acid or Fire damage, this trait doesn't function on the troll's next turn. The troll dies only if it starts its turn with 0 Hit Points and doesn't regenerate."]],["Ações",["Multiattack. The troll makes three Rend attacks.","Rend. Melee Attack Roll: +7, reach 10 ft. Hit: 11 (2d6 + 4) Slashing damage."]],["Ações Bônus",["Charge. The troll moves up to half its Speed straight toward an enemy it can see."]]]},"Troll Limb":{"tipo":"Pequeno Gigante, Caótico e Mau","ca":"13","pv":"14 (4d6)","desl":"6 m","ini":"+1 (11)","atr":[18,12,10,1,9,1],"info":[["Sentidos","Visão no Escuro 18 m; Percepção passiva 9"],["Idiomas","Nenhum"]],"cr":"1/2","secoes":[["Traços",["Regeneração. O membro recupera 5 Pontos de Vida no início de cada um de seus turnos. Se o membro sofrer dano Ácido ou de Fogo, este traço não funciona no próximo turno dele. O membro só morre se começar o turno com 0 Pontos de Vida e não regenerar.","Cria de Troll. Estranhamente, o membro tem os mesmos sentidos de um troll inteiro. Se o membro não for destruído em 24 horas, role 1d12. Com 12, o membro se transforma num Troll. Caso contrário, o membro definha."]],["Ações",["Dilacerar. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 9 (2d4 + 4) de dano Cortante."]]],"secoesEn":[["Traços",["Regeneration. The limb regains 5 Hit Points at the start of each of its turns. If the limb takes Acid or Fire damage, this trait doesn't function on the limb's next turn. The limb dies only if it starts its turn with 0 Hit Points and doesn't regenerate.","Troll Spawn. The limb uncannily has the same senses as a whole troll. If the limb isn't destroyed within 24 hours, roll 1d12. On a 12, the limb turns into a Troll. Otherwise, the limb withers away."]],["Ações",["Rend. Melee Attack Roll: +6, reach 5 ft. Hit: 9 (2d4 + 4) Slashing damage."]]]},"Unicorn":{"tipo":"Grande Celestial, Leal e Bom","ca":"12","pv":"97 (13d10+26)","desl":"15 m","ini":"+8 (18)","atr":[18,14,15,11,17,16],"info":[["Imunidades","Venenoso; Enfeitiçado, Paralisado, Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 13"],["Idiomas","Celestial, Élfico, Silvestre; telepatia 36 m"]],"cr":"5","secoes":[["Traços",["Resistência Lendária (3/Dia). Se o unicórnio falhar numa salvaguarda, ele pode escolher ser bem-sucedido.","Resistência à Magia. O unicórnio tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O unicórnio faz um ataque de Cascos e um ataque de Chifre Radiante.","Cascos. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 11 (2d6 + 4) de dano Contundente.","Chifre Radiante. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 9 (1d10 + 4) de dano Radiante.","Conjuração. O unicórnio conjura uma das magias a seguir, sem precisar de componentes de magia e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 14): À Vontade: Detectar o Bem e o Mal, Arte Druídica. 1/Dia Cada: Acalmar Emoções, Dissipar o Bem e o Mal, Constrição, Passos sem Pegadas, Palavra de Recordação."]],["Ações Bônus",["Bênção do Unicórnio (3/Dia). O unicórnio toca outra criatura com o chifre e conjura Curar Ferimentos ou Restauração Menor nela, usando o mesmo atributo de conjuração de Conjuração."]],["Ações Lendárias",["Usos de Ação Lendária: 3. Imediatamente após o turno de outra criatura, o unicórnio pode gastar um uso para realizar uma das ações a seguir. O unicórnio recupera todos os usos gastos no início de cada um de seus turnos.","Investida do Chifre. O unicórnio se move até metade do seu Deslocamento sem provocar Ataques de Oportunidade e faz um ataque de Chifre Radiante.","Escudo Cintilante. O unicórnio escolhe a si mesmo ou uma criatura que consiga ver a até 18 m. O alvo ganha 10 (3d6) Pontos de Vida Temporários, e sua CA aumenta em 2 até o fim do próximo turno do unicórnio. O unicórnio não pode realizar esta ação de novo até o início do seu próximo turno."]]],"secoesEn":[["Traços",["Legendary Resistance (3/Day). If the unicorn fails a saving throw, it can choose to succeed instead.","Magic Resistance. The unicorn has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The unicorn makes one Hooves attack and one Radiant Horn attack.","Hooves. Melee Attack Roll: +7, reach 5 ft. Hit: 11 (2d6 + 4) Bludgeoning damage.","Radiant Horn. Melee Attack Roll: +7, reach 5 ft. Hit: 9 (1d10 + 4) Radiant damage.","Spellcasting. The unicorn casts one of the following spells, requiring no spell components and using Charisma as the spellcasting ability (spell save DC 14): At Will: Detect Evil and Good, Druidcraft 1/Day Each: Calm Emotions, Dispel Evil and Good, Entangle, Pass without Trace, Word of Recall"]],["Ações Bônus",["Unicorn's Blessing (3/Day). The unicorn touches another creature with its horn and casts Cure Wounds or Lesser Restoration on that creature, using the same spellcasting ability as Spellcasting."]],["Ações Lendárias",["Legendary Action Uses: 3. Immediately after another creature's turn, the unicorn can expend a use to take one of the following actions. The unicorn regains all expended uses at the start of each of its turns.","Charging Horn. The unicorn moves up to half its Speed without provoking Opportunity Attacks, and it makes one Radiant Horn attack.","Shimmering Shield. The unicorn targets itself or one creature it can see within 60 feet of itself. The target gains 10 (3d6) Temporary Hit Points, and its AC increases by 2 until the end of the unicorn's next turn. The unicorn can't take this action again until the start of its next turn."]]]},"Vampire Familiar":{"tipo":"Médio ou Pequeno Humanoide, Neutro e Mau","ca":"15","pv":"65 (10d8+20)","desl":"9 m, escalada 9 m","ini":"+5 (15)","atr":[17,16,15,10,10,14],"info":[["Salvaguardas","Des +5, Sab +2"],["Perícias","Percepção +4, Persuasão +4, Furtividade +7"],["Resistências","Necrótico"],["Imunidades","Enfeitiçado (except from its vampire master)"],["Equipamento","Daggers (10)"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Comum mais one other language"]],"cr":"3","secoes":[["Traços",["Conexão Vampírica. Enquanto o familiar e seu mestre vampiro estiverem no mesmo plano de existência, o vampiro pode se comunicar com o familiar telepaticamente e perceber pelos sentidos dele."]],["Ações",["Ataque Múltiplo. O familiar faz dois ataques de Adaga Umbral.","Adaga Umbral. Jogada de Ataque Corpo a Corpo ou à Distância: +5, alcance 1,5 m ou distância 6/18 m. Acerto: 5 (1d4 + 3) de dano Perfurante mais 7 (3d4) de dano Necrótico. Se o alvo for reduzido a 0 Pontos de Vida por este ataque, ele fica Estável, mas na condição Envenenado por 1 hora. Enquanto estiver na condição Envenenado, o alvo fica na condição Paralisado."]],["Ações Bônus",["Agilidade Imortal. O familiar realiza a ação Disparada ou Desengajar."]]],"secoesEn":[["Traços",["Vampiric Connection. While the familiar and its vampire master are on the same plane of existence, the vampire can communicate with the familiar telepathically, and the vampire can perceive through the familiar's senses."]],["Ações",["Multiattack. The familiar makes two Umbral Dagger attacks.","Umbral Dagger. Melee or Ranged Attack Roll: +5, reach 5 ft. or range 20/60 ft. Hit: 5 (1d4 + 3) Piercing damage plus 7 (3d4) Necrotic damage. If the target is reduced to 0 Hit Points by this attack, the target becomes Stable but has the Poisoned condition for 1 hour. While it has the Poisoned condition, the target has the Paralyzed condition."]],["Ações Bônus",["Deathless Agility. The familiar takes the Dash or Disengage action."]]]},"Vampire Spawn":{"tipo":"Médio ou Pequeno Morto-Vivo, Neutro e Mau","ca":"16","pv":"90 (12d8+36)","desl":"9 m","ini":"+3 (13)","atr":[16,16,16,11,10,12],"info":[["Salvaguardas","Des +6, Sab +3"],["Perícias","Percepção +3, Furtividade +6"],["Resistências","Necrótico"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 13"],["Idiomas","Comum mais one other language"]],"cr":"5","secoes":[["Traços",["Patas de Aranha. O vampiro consegue escalar superfícies difíceis, inclusive pelo teto, sem precisar fazer um teste de atributo.","Fraquezas do Vampiro. O vampiro tem estas fraquezas:","Proibição. O vampiro não pode entrar numa residência sem o convite de um morador.","Água Corrente. O vampiro sofre 20 de dano Ácido se terminar o turno em água corrente.","Estaca no Coração. O vampiro é destruído se uma arma que cause dano Perfurante for cravada no seu coração enquanto ele estiver na condição Incapacitado.","Luz do Sol. O vampiro sofre 20 de dano Radiante se começar o turno sob luz do sol. Sob luz do sol, ele tem Desvantagem em jogadas de ataque e testes de atributo."]],["Ações",["Ataque Múltiplo. O vampiro faz dois ataques de Garra e usa Mordida.","Garra. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 8 (2d4 + 3) de dano Cortante. Se o alvo for uma criatura Média ou menor, ele fica na condição Agarrado (CD 13 para escapar) por uma de duas garras.","Mordida. Salvaguarda de Constituição: CD 14, uma criatura a até 1,5 m que esteja voluntária ou nas condições Agarrado, Incapacitado ou Impedido. Falha: 5 (1d4 + 3) de dano Perfurante mais 10 (3d6) de dano Necrótico. O máximo de Pontos de Vida do alvo diminui numa quantidade igual ao dano Necrótico sofrido, e o vampiro recupera Pontos de Vida iguais a essa quantidade."]],["Ações Bônus",["Agilidade Imortal. O vampiro realiza a ação Disparada ou Desengajar."]]],"secoesEn":[["Traços",["Spider Climb. The vampire can climb difficult surfaces, including along ceilings, without needing to make an ability check.","Vampire Weakness. The vampire has these weaknesses:","Forbiddance. The vampire can't enter a residence without an invitation from an occupant.","Running Water. The vampire takes 20 Acid damage if it ends its turn in running water.","Stake to the Heart. The vampire is destroyed if a weapon that deals Piercing damage is driven into the vampire's heart while the vampire has the Incapacitated condition.","Sunlight. The vampire takes 20 Radiant damage if it starts its turn in sunlight. While in sunlight, it has Disadvantage on attack rolls and ability checks."]],["Ações",["Multiattack. The vampire makes two Claw attacks and uses Bite.","Claw. Melee Attack Roll: +6, reach 5 ft. Hit: 8 (2d4 + 3) Slashing damage. If the target is a Medium or smaller creature, it has the Grappled condition (escape DC 13) from one of two claws.","Bite. Constitution Saving Throw: DC 14, one creature within 5 feet that is willing or that has the Grappled, Incapacitated, or Restrained condition. Failure: 5 (1d4 + 3) Piercing damage plus 10 (3d6) Necrotic damage. The target's Hit Point maximum decreases by an amount equal to the Necrotic damage taken, and the vampire regains Hit Points equal to that amount."]],["Ações Bônus",["Deathless Agility. The vampire takes the Dash or Disengage action."]]]},"Vampire":{"tipo":"Médio ou Pequeno Morto-Vivo, Leal e Mau","ca":"16","pv":"195 (23d8+92)","desl":"12 m, escalada 12 m","ini":"+14 (24)","atr":[18,18,18,17,15,18],"info":[["Salvaguardas","Des +9, Con +9, Sab +7, Car +9"],["Perícias","Percepção +7, Furtividade +9"],["Resistências","Necrótico"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 17"],["Idiomas","Comum mais two other languages"]],"cr":"13","secoes":[["Traços",["Resistência Lendária (3/Dia, ou 4/Dia no Covil). Se o vampiro falhar numa salvaguarda, ele pode escolher ser bem-sucedido.","Fuga em Névoa. Se o vampiro cair a 0 Pontos de Vida fora do seu local de descanso, ele usa Mudar de Forma para virar névoa (não exige ação). Se não puder usar Mudar de Forma, ele é destruído. Enquanto estiver com 0 Pontos de Vida na forma de névoa, ele não pode voltar à forma de vampiro e precisa chegar ao seu local de descanso em até 2 horas ou será destruído. No local de descanso, ele volta à forma de vampiro e fica na condição Paralisado até recuperar algum Ponto de Vida, e recupera 1 Ponto de Vida após passar 1 hora ali.","Patas de Aranha. O vampiro consegue escalar superfícies difíceis, inclusive pelo teto, sem precisar fazer um teste de atributo.","Fraquezas do Vampiro. O vampiro tem estas fraquezas:","Proibição. O vampiro não pode entrar numa residência sem o convite de um morador.","Água Corrente. O vampiro sofre 20 de dano Ácido se terminar o turno em água corrente.","Estaca no Coração. Se uma arma que cause dano Perfurante for cravada no coração do vampiro enquanto ele estiver na condição Incapacitado no seu local de descanso, ele fica na condição Paralisado até a arma ser removida.","Luz do Sol. O vampiro sofre 20 de dano Radiante se começar o turno sob luz do sol. Sob luz do sol, ele tem Desvantagem em jogadas de ataque e testes de atributo."]],["Ações",["Ataque Múltiplo (Somente na Forma de Vampiro). O vampiro faz dois ataques de Golpe Sepulcral e usa Mordida.","Golpe Sepulcral (Somente na Forma de Vampiro). Jogada de Ataque Corpo a Corpo: +9, alcance 1,5 m. Acerto: 8 (1d8 + 4) de dano Contundente mais 7 (2d6) de dano Necrótico. Se o alvo for uma criatura Grande ou menor, ele fica na condição Agarrado (CD 14 para escapar) por uma de duas mãos.","Mordida (Somente nas Formas de Morcego ou Vampiro). Salvaguarda de Constituição: CD 17, uma criatura a até 1,5 m que esteja voluntária ou nas condições Agarrado, Incapacitado ou Impedido. Falha: 6 (1d4 + 4) de dano Perfurante mais 13 (3d8) de dano Necrótico. O máximo de Pontos de Vida do alvo diminui numa quantidade igual ao dano Necrótico sofrido, e o vampiro recupera Pontos de Vida iguais a essa quantidade. Um Humanoide reduzido a 0 Pontos de Vida por esse dano e depois enterrado se ergue no pôr do sol seguinte como uma Cria Vampírica sob o controle do vampiro."]],["Ações Bônus",["Encanto (Recarga 5–6). O vampiro conjura Enfeitiçar Pessoa, sem precisar de componentes de magia e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 17), e a duração é de 24 horas. O alvo Enfeitiçado aceita de bom grado a Mordida do vampiro, cujo dano não encerra a magia. Quando a magia acaba, o alvo não sabe que foi Enfeitiçado pelo vampiro.","Mudar de Forma. Se não estiver sob luz do sol nem em água corrente, o vampiro se transforma num morcego Miúdo (Deslocamento 1,5 m, Deslocamento de Voo 9 m) ou numa nuvem de névoa Média (Deslocamento 1,5 m, Deslocamento de Voo 6 m [pairar]), ou volta à forma de vampiro. O que estiver vestindo se transforma junto. Na forma de morcego, o vampiro não pode falar. Suas estatísticas de jogo, exceto tamanho e Deslocamento, não mudam. Na forma de névoa, o vampiro não pode realizar ações, falar nem manipular objetos. Ele não tem peso e pode entrar no espaço de um inimigo e parar ali. A névoa passa por qualquer espaço por onde o ar passe, mas não atravessa líquidos. Ela tem Resistência a todo dano, exceto o dano que sofre da luz do sol."]],["Ações Lendárias",["Usos de Ação Lendária: 3 (4 no Covil). Imediatamente após o turno de outra criatura, o vampiro pode gastar um uso para realizar uma das ações a seguir. O vampiro recupera todos os usos gastos no início de cada um de seus turnos.","Seduzir. O vampiro conjura Comando, sem precisar de componentes de magia e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 17). O vampiro não pode realizar esta ação de novo até o início do seu próximo turno.","Golpe Imortal. O vampiro se move até metade do seu Deslocamento e faz um ataque de Golpe Sepulcral."]]],"secoesEn":[["Traços",["Legendary Resistance (3/Day, or 4/Day in Lair). If the vampire fails a saving throw, it can choose to succeed instead.","Misty Escape. If the vampire drops to 0 Hit Points outside its resting place, the vampire uses Shape-Shift to become mist (no action required). If it can't use ShapeShift, it is destroyed. While it has 0 Hit Points in mist form, it can't return to its vampire form, and it must reach its resting place within 2 hours or be destroyed. Once in its resting place, it returns to its vampire form and has the Paralyzed condition until it regains any Hit Points, and it regains 1 Hit Point after spending 1 hour there.","Spider Climb. The vampire can climb difficult surfaces, including along ceilings, without needing to make an ability check.","Vampire Weakness. The vampire has these weaknesses:","Forbiddance. The vampire can't enter a residence without an invitation from an occupant.","Running Water. The vampire takes 20 Acid damage if it ends its turn in running water.","Stake to the Heart. If a weapon that deals Piercing damage is driven into the vampire's heart while the vampire has the Incapacitated condition in its resting place, the vampire has the Paralyzed condition until the weapon is removed.","Sunlight. The vampire takes 20 Radiant damage if it starts its turn in sunlight. While in sunlight, it has Disadvantage on attack rolls and ability checks."]],["Ações",["Multiattack (Vampire Form Only). The vampire makes two Grave Strike attacks and uses Bite.","Grave Strike (Vampire Form Only). Melee Attack Roll: +9, reach 5 ft. Hit: 8 (1d8 + 4) Bludgeoning damage plus 7 (2d6) Necrotic damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14) from one of two hands.","Bite (Bat or Vampire Form Only). Constitution Saving Throw: DC 17, one creature within 5 feet that is willing or that has the Grappled, Incapacitated, or Restrained condition. Failure: 6 (1d4 + 4) Piercing damage plus 13 (3d8) Necrotic damage. The target's Hit Point maximum decreases by an amount equal to the Necrotic damage taken, and the vampire regains Hit Points equal to that amount. A Humanoid reduced to 0 Hit Points by this damage and then buried rises the following sunset as a Vampire Spawn under the vampire's control."]],["Ações Bônus",["Charm (Recharge 5-6). The vampire casts Charm Person, requiring no spell components and using Charisma as the spellcasting ability (spell save DC 17), and the duration is 24 hours. The Charmed target is a willing recipient of the vampire's Bite, the damage of which doesn't end the spell. When the spell ends, the target is unaware it was Charmed by the vampire.","Shape-Shift. If the vampire isn't in sunlight or running water, it shape-shifts into a Tiny bat (Speed 5 ft., Fly Speed 30 ft.) or a Medium cloud of mist (Speed 5 ft., Fly Speed 20 ft. [hover]), or it returns to its vampire form. Anything it is wearing transforms with it. While in bat form, the vampire can't speak. Its game statistics, other than its size and Speed, are unchanged. While in mist form, the vampire can't take any actions, speak, or manipulate objects. It is weightless and can enter an enemy's space and stop there. If air can pass through a space, the mist can do so, but it can't pass through liquid. It has Resistance to all damage, except the damage it takes from sunlight."]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the vampire can expend a use to take one of the following actions. The vampire regains all expended uses at the start of each of its turns.","Beguile. The vampire casts Command, requiring no spell components and using Charisma as the spellcasting ability (spell save DC 17). The vampire can't take this action again until the start of its next turn.","Deathless Strike. The vampire moves up to half its Speed, and it makes one Grave Strike attack."]]]},"Vrock":{"tipo":"Grande Ínfero (Demônio), Caótico e Mau","ca":"15","pv":"152 (16d10+64)","desl":"12 m, voo 18 m","ini":"+2 (12)","atr":[17,15,18,8,13,8],"info":[["Salvaguardas","Des +5, Sab +4, Car +2"],["Resistências","Frio, Fogo, Elétrico"],["Imunidades","Venenoso; Envenenado"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 11"],["Idiomas","Abissal; telepatia 36 m"]],"cr":"6","secoes":[["Traços",["Restauração Demoníaca. Se o vrock morrer fora do Abismo, seu corpo se dissolve em icor e ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar do Abismo.","Resistência à Magia. O vrock tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O vrock faz dois ataques de Retalhar.","Retalhar. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 10 (2d6 + 3) de dano Perfurante mais 10 (3d6) de dano Venenoso.","Esporos (Recarga 6). Salvaguarda de Constituição: CD 15, cada criatura numa Emanação de 6 m a partir do vrock. Falha: O alvo fica na condição Envenenado e repete a salvaguarda no fim de cada um de seus turnos, encerrando o efeito em si mesmo com um sucesso. Enquanto Envenenado, o alvo sofre 5 (1d10) de dano Venenoso no início de cada um de seus turnos. Derramar um frasco de Água Benta no alvo encerra o efeito antes.","Guincho Atordoante (1/Dia). Salvaguarda de Constituição: CD 15, cada criatura numa Emanação de 6 m a partir do vrock (demônios são bem-sucedidos automaticamente). Falha: 10 (3d6) de dano Trovejante, e o alvo fica na condição Atordoado até o fim do próximo turno do vrock."]]],"secoesEn":[["Traços",["Demonic Restoration. If the vrock dies outside the Abyss, its body dissolves into ichor, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Abyss.","Magic Resistance. The vrock has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The vrock makes two Shred attacks.","Shred. Melee Attack Roll: +6, reach 5 ft. Hit: 10 (2d6 + 3) Piercing damage plus 10 (3d6) Poison damage.","Spores (Recharge 6). Constitution Saving Throw: DC 15, each creature in a 20-foot Emanation originating from the vrock. Failure: The target has the Poisoned condition and repeats the save at the end of each of its turns, ending the effect on itself on a success. While Poisoned, the target takes 5 (1d10) Poison damage at the start of each of its turns. Emptying a flask of Holy Water on the target ends the effect early.","Stunning Screech (1/Day). Constitution Saving Throw: DC 15, each creature in a 20-foot Emanation originating from the vrock (demons succeed automatically). Failure: 10 (3d6) Thunder damage, and the target has the Stunned condition until the end of the vrock's next turn."]]]},"Warrior Infantry":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"13","pv":"9 (2d8)","desl":"9 m","ini":"+0 (10)","atr":[13,11,11,8,11,8],"info":[["Equipamento","Chain Shirt, Spear"],["Sentidos","Percepção passiva 10"],["Idiomas","Comum"]],"cr":"1/8","secoes":[["Traços",["Táticas de Matilha. O guerreiro tem Vantagem numa jogada de ataque contra uma criatura se pelo menos um aliado dele estiver a até 1,5 m dela e não estiver na condição Incapacitado."]],["Ações",["Lança. Jogada de Ataque Corpo a Corpo ou à Distância: +3, alcance 1,5 m ou distância 6/18 m. Acerto: 4 (1d6 + 1) de dano Perfurante."]]],"secoesEn":[["Traços",["Pack Tactics. The warrior has Advantage on an attack roll against a creature if at least one of the warrior's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."]],["Ações",["Spear. Melee or Ranged Attack Roll: +3, reach 5 ft. or range 20/60 ft. Hit: 4 (1d6 + 1) Piercing damage."]]]},"Warrior Veteran":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"17","pv":"65 (10d8+20)","desl":"9 m","ini":"+3 (13)","atr":[16,13,14,10,11,10],"info":[["Perícias","Atletismo +5, Percepção +2"],["Equipamento","Greatsword, Heavy Crossbow, Splint Armor"],["Sentidos","Percepção passiva 12"],["Idiomas","Comum mais one other language"]],"cr":"3","secoes":[["Ações",["Ataque Múltiplo. O guerreiro faz dois ataques de Montante ou de Besta Pesada.","Montante. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 10 (2d6 + 3) de dano Cortante.","Besta Pesada. Jogada de Ataque à Distância: +3, distância 30/120 m. Acerto: 12 (2d10 + 1) de dano Perfurante."]],["Reações",["Aparar. Gatilho: O guerreiro é atingido por uma jogada de ataque corpo a corpo enquanto empunha uma arma. Resposta: O guerreiro soma 2 à sua CA contra esse ataque, possivelmente fazendo-o errar."]]],"secoesEn":[["Ações",["Multiattack. The warrior makes two Greatsword or Heavy Crossbow attacks.","Greatsword. Melee Attack Roll: +5, reach 5 ft. Hit: 10 (2d6 + 3) Slashing damage.","Heavy Crossbow. Ranged Attack Roll: +3, range 100/400 ft. Hit: 12 (2d10 + 1) Piercing damage."]],["Reações",["Parry. Trigger: The warrior is hit by a melee attack roll while holding a weapon. Response: The warrior adds 2 to its AC against that attack, possibly causing it to miss."]]]},"Water Elemental":{"tipo":"Grande Elemental, Neutro","ca":"14","pv":"114 (12d10+48)","desl":"9 m, natação 27 m","ini":"+2 (12)","atr":[18,14,18,5,10,8],"info":[["Resistências","Ácido, Fogo"],["Imunidades","Venenoso; Exaustão, Agarrado, Paralisado, Petrificado, Envenenado, Caído, Impedido, Inconsciente"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Primordial (Aquan)"]],"cr":"5","secoes":[["Traços",["Congelar. Se o elemental sofrer dano de Frio, seu Deslocamento diminui em 6 m até o fim do seu próximo turno.","Forma Aquática. O elemental pode entrar no espaço de um inimigo e parar ali. Ele pode passar por um espaço de apenas 2,5 cm de largura sem gastar movimento extra."]],["Ações",["Ataque Múltiplo. O elemental faz dois ataques de Pancada.","Pancada. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 13 (2d8 + 4) de dano Contundente. Se o alvo for uma criatura Média ou menor, ele fica na condição Caído.","Submergir (Recarga 4–6). Salvaguarda de Força: CD 15, cada criatura no espaço do elemental. Falha: 22 (4d8 + 4) de dano Contundente. Se o alvo for uma criatura Grande ou menor, ele fica na condição Agarrado (CD 14 para escapar). Até o agarrão acabar, o alvo fica na condição Impedido, está sufocando a menos que respire água e sofre 9 (2d8) de dano Contundente no início de cada turno do elemental. O elemental pode agarrar uma criatura Grande ou até duas criaturas Médias ou menores ao mesmo tempo com Submergir. Com uma ação, uma criatura a até 1,5 m do elemental pode puxar uma criatura para fora dele com um teste de Força (Atletismo) CD 14 bem-sucedido. Sucesso: Apenas metade do dano."]]],"secoesEn":[["Traços",["Freeze. If the elemental takes Cold damage, its Speed decreases by 20 feet until the end of its next turn.","Water Form. The elemental can enter an enemy's space and stop there. It can move through a space as narrow as 1 inch without expending extra movement to do so."]],["Ações",["Multiattack. The elemental makes two Slam attacks.","Slam. Melee Attack Roll: +7, reach 5 ft. Hit: 13 (2d8 + 4) Bludgeoning damage. If the target is a Medium or smaller creature, it has the Prone condition.","Whelm (Recharge 4-6). Strength Saving Throw: DC 15, each creature in the elemental's space. Failure: 22 (4d8 + 4) Bludgeoning damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14). Until the grapple ends, the target has the Restrained condition, is suffocating unless it can breathe water, and takes 9 (2d8) Bludgeoning damage at the start of each of the elemental's turns. The elemental can grapple one Large creature or up to two Medium or smaller creatures at a time with Whelm. As an action, a creature within 5 feet of the elemental can pull a creature out of it by succeeding on a DC 14 Strength (Athletics) check. Success: Half damage only."]]]},"Werebear":{"tipo":"Médio ou Pequeno Monstruosidade (Lycanthrope), Neutro e Bom","ca":"15","pv":"135 (18d8+54)","desl":"9 m, 12 m (bear form only), escalada 9 m (bear","ini":"+3 (13)","atr":[19,10,17,11,12,12],"info":[["Perícias","Percepção +7"],["Equipamento","Handaxes (4)"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 17"],["Idiomas","Comum (não fala in bear form)"]],"cr":"5","secoes":[["Ações",["Ataque Múltiplo. O urso-lobisomem faz dois ataques, usando Machadinha ou Dilacerar em qualquer combinação. Ele pode substituir um ataque por um ataque de Mordida.","Mordida (Somente nas Formas de Urso ou Híbrida). Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 17 (2d12 + 4) de dano Perfurante. Se o alvo for um Humanoide, ele é submetido ao efeito a seguir. Salvaguarda de Constituição: CD 14. Falha: O alvo fica amaldiçoado. Se o alvo amaldiçoado cair a 0 Pontos de Vida, em vez disso ele se torna um Urso-Lobisomem sob o controle do mestre, com 10 Pontos de Vida. Sucesso: O alvo fica imune à maldição deste urso-lobisomem por 24 horas.","Machadinha (Somente nas Formas Humanoide ou Híbrida). Jogada de Ataque Corpo a Corpo ou à Distância: +7, alcance 1,5 m ou distância 6/18 m. Acerto: 14 (3d6 + 4) de dano Cortante.","Dilacerar (Somente nas Formas de Urso ou Híbrida). Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 13 (2d8 + 4) de dano Cortante."]],["Ações Bônus",["Mudar de Forma. O urso-lobisomem se transforma numa forma híbrida Grande de urso e humanoide ou num urso Grande, ou volta à sua forma humanoide verdadeira. Suas estatísticas de jogo, exceto o tamanho, são as mesmas em todas as formas. Equipamentos que esteja vestindo ou carregando não se transformam."]]],"secoesEn":[["Ações",["Multiattack. The werebear makes two attacks, using Handaxe or Rend in any combination. It can replace one attack with a Bite attack.","Bite (Bear or Hybrid Form Only). Melee Attack Roll: +7, reach 5 ft. Hit: 17 (2d12 + 4) Piercing damage. If the target is a Humanoid, it is subjected to the following effect. Constitution Saving Throw: DC 14. Failure: The target is cursed. If the cursed target drops to 0 Hit Points, it instead becomes a Werebear under the GM's control and has 10 Hit Points. Success: The target is immune to this werebear's curse for 24 hours.","Handaxe (Humanoid or Hybrid Form Only). Melee or Ranged Attack Roll: +7, reach 5 ft or range 20/60 ft. Hit: 14 (3d6 + 4) Slashing damage.","Rend (Bear or Hybrid Form Only). Melee Attack Roll: +7, reach 5 ft. Hit: 13 (2d8 + 4) Slashing damage."]],["Ações Bônus",["Shape-Shift. The werebear shape-shifts into a Large bear-humanoid hybrid form or a Large bear, or it returns to its true humanoid form. Its game statistics, other than its size, are the same in each form. Any equipment it is wearing or carrying isn't transformed."]]]},"Wereboar":{"tipo":"Médio ou Pequeno Monstruosidade (Lycanthrope), Neutro e Mau","ca":"15","pv":"97 (15d8+30)","desl":"9 m, 12 m (boar form only)","ini":"+2 (12)","atr":[17,10,15,10,11,8],"info":[["Perícias","Percepção +2"],["Equipamento","Javelins (6)"],["Sentidos","Percepção passiva 12"],["Idiomas","Comum (não fala in boar form)"]],"cr":"4","secoes":[["Ações",["Ataque Múltiplo. O javali-lobisomem faz dois ataques, usando Azagaia ou Presa em qualquer combinação. Ele pode substituir um ataque por um ataque de Chifrada.","Chifrada (Somente nas Formas de Javali ou Híbrida). Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 12 (2d8 + 3) de dano Perfurante. Se o alvo for um Humanoide, ele é submetido ao efeito a seguir. Salvaguarda de Constituição: CD 12. Falha: O alvo fica amaldiçoado. Se o alvo amaldiçoado cair a 0 Pontos de Vida, em vez disso ele se torna um Javali-Lobisomem sob o controle do mestre, com . It can replace one attack with a Bite attack.","Bite (Rat or Hybrid Form Only). Melee Attack Roll: +5, reach 5 ft. Hit: 8 (2d4 + 3) Piercing damage. If the target is a Humanoid, it is subjected to the following effect. Constitution Saving Throw: DC 11. Failure: The target is cursed. If the cursed target drops to 0 Hit Points, it instead becomes a Wererat under the GM's control and has 10 Hit Points. Success: The target is immune to this wererat's curse for 24 hours.","Scratch. Melee Attack Roll: +5, reach 5 ft. Hit: 6 (1d6 + 3) Slashing damage.","Hand Crossbow (Humanoid or Hybrid Form Only). Ranged Attack Roll: +5, range 30/120 ft. Hit: 6 (1d6 + 3) Piercing damage."]],["Ações Bônus",["Shape-Shift. The wererat shape-shifts into a Medium rat-humanoid hybrid or a Small rat, or it returns to its true humanoid form. Its game statistics, other than its size, are the same in each form. Any equipment it is wearing or carrying isn't transformed."]]]},"Weretiger":{"tipo":"Médio ou Pequeno Monstruosidade (Lycanthrope), Neutro","ca":"12","pv":"120 (16d8+48)","desl":"9 m, 12 m (tiger form only)","ini":"+2 (12)","atr":[17,15,16,10,13,11],"info":[["Perícias","Percepção +5, Furtividade +4"],["Equipamento","Longbow"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 15"],["Idiomas","Comum (não fala in tiger form)"]],"cr":"4","secoes":[["Ações",["Ataque Múltiplo. O tigre-lobisomem faz dois ataques, usando Arranhão ou Arco Longo em qualquer combinação. Ele pode substituir um ataque por um ataque de Mordida.","Mordida (Somente nas Formas de Tigre ou Híbrida). Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 12 (2d8 + 3) de dano Perfurante. Se o alvo for um Humanoide, ele é submetido ao efeito a seguir. Salvaguarda de Constituição: CD 13. Falha: O alvo fica amaldiçoado. Se o alvo amaldiçoado cair a 0 Pontos de Vida, em vez disso ele se torna um Tigre-Lobisomem sob o controle do mestre, com 10 Pontos de Vida. Sucesso: O alvo fica imune à maldição deste tigre-lobisomem por  wearing or carrying isn't transformed."]]]},"Werewolf":{"tipo":"Médio ou Pequeno Monstruosidade (Lycanthrope), Caótico e Mau","ca":"15","pv":"71 (11d8+22)","desl":"9 m, 12 m (wolf form only)","ini":"+4 (14)","atr":[16,14,14,10,11,10],"info":[["Perícias","Percepção +4, Furtividade +4"],["Equipamento","Longbow"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Comum (não fala in wolf form)"]],"cr":"3","secoes":[["Traços",["Táticas de Matilha. O lobisomem tem Vantagem numa jogada de ataque contra uma criatura se pelo menos um aliado dele estiver a até 1,5 m dela e não estiver na condição Incapacitado."]],["Ações",["Ataque Múltiplo. O lobisomem faz dois ataques, usando Arranhão ou Arco Longo em qualquer combinação. Ele pode substituir um ataque por um ataque de Mordida.","Mordida (Somente nas Formas de Lobo ou Híbrida). Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 12 (2d8 + 3) de dano Perfurante. Se o alvo for um Humanoide, ele é submetido ao efeito a seguir. Salvaguarda de Constituição: CD 12. Falha: O alvo fica amaldiçoado. Se o alvo amaldiçoado cair a 0 Pontos de Vida, em vez disso ele se torna um Lobisomem sob o controle do mestre, com 10 Pontos de Vida. Sucesso: O alvo fica imune à maldição deste lobisomem por 24 horas.","Arranhão. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 10 (2d6 + 3) de dano Cortante.","Arco Longo (Somente nas Formas Humanoide ou Híbrida). Jogada de Ataque à Distância: +4, distância 45/180 m. Acerto: 11 (2d8 + 2) de dano Perfurante."]],["Ações Bônus",["Mudar de Forma. O lobisomem se transforma num híbrido Grande de lobo e humanoide ou num lobo Médio, ou volta à sua forma humanoide verdadeira. Suas estatísticas de jogo, exceto o tamanho, são as mesmas em todas as formas. Equipamentos que esteja vestindo ou carregando não se transformam."]]],"secoesEn":[["Traços",["Pack Tactics. The werewolf has Advantage on an attack roll against a creature if at least one of the werewolf's allies is within 5 fe
