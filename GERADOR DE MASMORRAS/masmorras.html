 +4, Furtividade +3"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Comum, Élfico, Silvestre"]],"cr":"3","secoes":[["Traços",["Anfíbio. A bruxa consegue respirar ar e água.","Magia do Conciliábulo. Enquanto estiver a até 9 m de pelo menos duas bruxas aliadas, a bruxa pode conjurar uma das magias a seguir, sem precisar de componentes Materiais, usando o tempo de conjuração normal da magia e Inteligência como atributo de conjuração (CD de salvaguarda de magia 11): Augúrio, Convocar Familiar, Identificar, Localizar Objeto, Vidência ou Servo Invisível. A bruxa precisa terminar um Descanso Longo antes de usar este traço para conjurar essa mesma magia de novo.","Mimetismo. A bruxa consegue imitar sons de animais e vozes humanoides. Uma criatura que ouça os sons só percebe que são imitações com um teste de Sabedoria (Intuição) CD 14 bem-sucedido."]],["Ações",["Ataque Múltiplo. A bruxa faz dois ataques de Garra.","Garra. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 8 (1d8 + 4) de dano Cortante mais 3 (1d6) de dano Venenoso.","Conjuração. A bruxa conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Sabedoria como atributo de conjuração (CD de salvaguarda de magia 12, +4 para acertar com ataques de magia): À Vontade: Luzes Dançantes, Disfarçar-se (duração de 24 horas), Invisibilidade (apenas em si mesma, e a bruxa não deixa rastros enquanto estiver Invisível), Ilusão Menor, Raio Nauseante (versão de 3º círculo)."]]],"secoesEn":[["Traços",["Amphibious. The hag can breathe air and water.","Coven Magic. While within 30 feet of at least two hag allies, the hag can cast one of the following spells, requiring no Material components, using the spell's normal casting time, and using Intelligence as the spellcasting ability (spell save DC 11): Augury, Find Familiar, Identify, Locate Object, Scrying, or Unseen Servant. The hag must finish a Long Rest before using this trait to cast that spell again.","Mimicry. The hag can mimic animal sounds and humanoid voices. A creature that hears the sounds can tell they are imitations only with a successful DC 14 Wisdom (Insight) check."]],["Ações",["Multiattack. The hag makes two Claw attacks.","Claw. Melee Attack Roll: +6, reach 5 ft. Hit: 8 (1d8 + 4) Slashing damage plus 3 (1d6) Poison damage.","Spellcasting. The hag casts one of the following spells, requiring no Material components and using Wisdom as the spellcasting ability (spell save DC 12, +4 to hit with spell attacks): At Will: Dancing Lights, Disguise Self (24-hour duration), Invisibility (self only, and the hag leaves no tracks while Invisible), Minor Illusion, Ray of Sickness (level 3 version)"]]]},"Grick":{"tipo":"Médio Aberração, Sem Tendência","ca":"14","pv":"54 (12d8)","desl":"9 m, escalada 9 m","ini":"+2 (12)","atr":[14,14,11,3,14,5],"info":[["Perícias","Furtividade +4"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 12"],["Idiomas","Nenhum"]],"cr":"2","secoes":[["Ações",["Ataque Múltiplo. O grick faz um ataque de Bico e um ataque de Tentáculos.","Bico. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 9 (2d6 + 2) de dano Perfurante.","Tentáculos. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 7 (1d10 + 2) de dano Cortante. Se o alvo for uma criatura Média ou menor, ele fica na condição Agarrado (CD 12 para escapar) pelos quatro tentáculos."]]],"secoesEn":[["Ações",["Multiattack. The grick makes one Beak attack and one Tentacles attack.","Beak. Melee Attack Roll: +4, reach 5 ft. Hit: 9 (2d6 + 2) Piercing damage.","Tentacles. Melee Attack Roll: +4, reach 5 ft. Hit: 7 (1d10 + 2) Slashing damage. If the target is a Medium or smaller creature, it has the Grappled condition (escape DC 12) from all four tentacles."]]]},"Griffon":{"tipo":"Grande Monstruosidade, Sem Tendência","ca":"12","pv":"59 (7d10+21)","desl":"9 m, voo 24 m","ini":"+2 (12)","atr":[18,15,16,2,13,8],"info":[["Perícias","Percepção +5"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 15"],["Idiomas","Nenhum"]],"cr":"2","secoes":[["Ações",["Ataque Múltiplo. O grifo faz dois ataques de Dilacerar.","Dilacerar. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 8 (1d8 + 4) de dano Perfurante. Se o alvo for uma criatura Média ou menor, ele fica na condição Agarrado (CD 14 para escapar) pelas duas garras dianteiras do grifo."]]],"secoesEn":[["Ações",["Multiattack. The griffon makes two Rend attacks.","Rend. Melee Attack Roll: +6, reach 5 ft. Hit: 8 (1d8 + 4) Piercing damage. If the target is a Medium or smaller creature, it has the Grappled condition (escape DC 14) from both of the griffon's front claws."]]]},"Grimlock":{"tipo":"Médio Aberração, Neutro e Mau","ca":"11","pv":"11 (2d8+2)","desl":"9 m, escalada 9 m","ini":"+1 (11)","atr":[16,12,12,9,8,6],"info":[["Perícias","Atletismo +5, Percepção +3, Furtividade +5"],["Sentidos","Percepção às Cegas 9 m; Percepção passiva 13"],["Idiomas","Nenhum"]],"cr":"1/4","secoes":[["Ações",["Porrete de Osso. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 6 (1d6 + 3) de dano Contundente mais 2 (1d4) de dano Psíquico."]]],"secoesEn":[["Ações",["Bone Cudgel. Melee Attack Roll: +5, reach 5 ft. Hit: 6 (1d6 + 3) Bludgeoning damage plus 2 (1d4) Psychic damage."]]]},"Guardian Naga":{"tipo":"Grande Celestial, Leal e Bom","ca":"18","pv":"136 (16d10+48)","desl":"12 m, escalada 12 m, natação 12 m","ini":"+4 (14)","atr":[19,18,16,16,19,18],"info":[["Salvaguardas","Des +8, Con +7, Int +7, Sab +8, Car +8"],["Perícias","Arcanismo +11, História +11, Religião +11"],["Imunidades","Venenoso; Enfeitiçado, Paralisado, Envenenado, Impedido"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Celestial, Comum"]],"cr":"10","secoes":[["Traços",["Restauração Celestial. Se a naga morrer, ela volta à vida em 1d6 dias e recupera todos os seus Pontos de Vida, a menos que Dissipar o Bem e o Mal seja conjurada sobre seus restos."]],["Ações",["Ataque Múltiplo. A naga faz dois ataques de Mordida. Ela pode substituir qualquer ataque por um uso de Cuspe Venenoso.","Mordida. Jogada de Ataque Corpo a Corpo: +8, alcance 3 m. Acerto: 17 (2d12 + 4) de dano Perfurante mais 22 (4d10) de dano Venenoso.","Cuspe Venenoso. Salvaguarda de Constituição: CD 16, uma criatura que a naga consiga ver a até 18 m. Falha: 31 (7d8) de dano Venenoso, e o alvo fica na condição Cego até o início do próximo turno da naga. Sucesso: Apenas metade do dano.","Conjuração. A naga conjura uma das magias a seguir, sem precisar de componentes Somáticos ou Materiais e usando Sabedoria como atributo de conjuração (CD de salvaguarda de magia 16): À Vontade: Taumaturgia. 1/Dia Cada: Clarividência, Curar Ferimentos (versão de 6º círculo), Coluna de Chamas (versão de 6º círculo), Missão, Visão da Verdade."]]],"secoesEn":[["Traços",["Celestial Restoration. If the naga dies, it returns to life in 1d6 days and regains all its Hit Points unless Dispel Evil and Good is cast on its remains."]],["Ações",["Multiattack. The naga makes two Bite attacks. It can replace any attack with a use of Poisonous Spittle.","Bite. Melee Attack Roll: +8, reach 10 ft. Hit: 17 (2d12 + 4) Piercing damage plus 22 (4d10) Poison damage.","Poisonous Spittle. Constitution Saving Throw: DC 16, one creature the naga can see within 60 feet. Failure: 31 (7d8) Poison damage, and the target has the Blinded condition until the start of the naga's next turn. Success: Half damage only.","Spellcasting. The naga casts one of the following spells, requiring no Somatic or Material components and using Wisdom as the spellcasting ability (spell save DC 16): At Will: Thaumaturgy 1/Day Each: Clairvoyance, Cure Wounds (level 6 version), Flame Strike (level 6 version), Geas, True Seeing"]]]},"Guard":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"16","pv":"11 (2d8+2)","desl":"9 m","ini":"+1 (11)","atr":[13,12,12,10,11,10],"info":[["Perícias","Percepção +2"],["Equipamento","Chain Shirt, Shield, Spear"],["Sentidos","Percepção passiva 12"],["Idiomas","Comum"]],"cr":"1/8","secoes":[["Ações",["Lança. Jogada de Ataque Corpo a Corpo ou à Distância: +3, alcance 1,5 m ou distância 6/18 m. Acerto: 4 (1d6 + 1) de dano Perfurante."]]],"secoesEn":[["Ações",["Spear. Melee or Ranged Attack Roll: +3, reach 5 ft. or range 20/60 ft. Hit: 4 (1d6 + 1) Piercing damage."]]]},"Guard Captain":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"18","pv":"75 (10d8+30)","desl":"9 m","ini":"+4 (14)","atr":[18,14,16,12,14,13],"info":[["Perícias","Atletismo +6, Percepção +4"],["Equipamento","Breastplate, Javelins (6), Longsword, Shield"],["Sentidos","Percepção passiva 14"],["Idiomas","Comum"]],"cr":"4","secoes":[["Ações",["Ataque Múltiplo. O capitão faz dois ataques, usando Azagaia ou Espada Longa em qualquer combinação.","Azagaia. Jogada de Ataque Corpo a Corpo ou à Distância: +6, alcance 1,5 m ou distância 9/36 m. Acerto: 14 (3d6 + 4) de dano Perfurante.","Espada Longa. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 15 (2d10 + 4) de dano Cortante."]]],"secoesEn":[["Ações",["Multiattack. The guard makes two attacks, using Javelin or Longsword in any combination.","Javelin. Melee or Ranged Attack Roll: +6, reach 5 ft. or range 30/120 ft. Hit: 14 (3d6 + 4) Piercing damage.","Longsword. Melee Attack Roll: +6, reach 5 ft. Hit: 15 (2d10 + 4) Slashing damage."]]]},"Half-Dragon":{"tipo":"Médio Dragão, Neutro","ca":"18","pv":"105 (14d8+42)","desl":"12 m","ini":"+5 (15)","atr":[19,14,16,10,15,14],"info":[["Salvaguardas","Des +5, Sab +5"],["Perícias","Atletismo +7, Percepção +5, Furtividade +5"],["Resistências","Damage type chosen for the Dracônico Origin trait below"],["Sentidos","Percepção às Cegas 3 m, Visão no Escuro 18 m; Percepção passiva 15"],["Idiomas","Comum, Dracônico"]],"cr":"5","secoes":[["Traços",["Origem Dracônica. O meio-dragão é aparentado de um tipo de dragão associado a um dos tipos de dano a seguir (à escolha do mestre): Ácido, Frio, Fogo, Elétrico ou Venenoso. Essa escolha afeta outros pontos da ficha."]],["Ações",["Ataque Múltiplo. O meio-dragão faz dois ataques de Garra.","Garra. Jogada de Ataque Corpo a Corpo: +7, alcance 3 m. Acerto: 6 (1d4 + 4) de dano Cortante mais 7 (2d6) de dano do tipo escolhido no traço Origem Dracônica.","Sopro de Dragão (Recarga 5–6). Salvaguarda de Destreza: CD 14, cada criatura num Cone de 9 m. Falha: 28 (8d6) de dano do tipo escolhido no traço Origem Dracônica. Sucesso: Metade do dano."]],["Ações Bônus",["Salto. O meio-dragão salta até 9 m gastando 3 m de movimento."]]],"secoesEn":[["Traços",["Draconic Origin. The half-dragon is related to a type of dragon associated with one of the following damage types (GM's choice): Acid, Cold, Fire, Lightning, or Poison. This choice affects other aspects of the stat block."]],["Ações",["Multiattack. The half-dragon makes two Claw attacks.","Claw. Melee Attack Roll: +7, reach 10 ft. Hit: 6 (1d4 + 4) Slashing damage plus 7 (2d6) damage of the type chosen for the Draconic Origin trait.","Dragon's Breath (Recharge 5-6). Dexterity Saving Throw: DC 14, each creature in a 30-foot Cone. Failure: 28 (8d6) damage of the type chosen for the Draconic Origin trait. Success: Half damage."]],["Ações Bônus",["Leap. The half-dragon jumps up to 30 feet by spending 10 feet of movement."]]]},"Harpy":{"tipo":"Médio Monstruosidade, Caótico e Mau","ca":"11","pv":"38 (7d8+7)","desl":"6 m, voo 12 m","ini":"+1 (11)","atr":[12,13,12,7,10,13],"info":[["Sentidos","Percepção passiva 10"],["Idiomas","Comum"]],"cr":"1","secoes":[["Ações",["Garra. Jogada de Ataque Corpo a Corpo: +3, alcance 1,5 m. Acerto: 6 (2d4 + 1) de dano Cortante.","Canção Sedutora. A harpia canta uma melodia mágica, que dura até a Concentração da harpia nela acabar. Salvaguarda de Sabedoria: CD 11, cada Humanoide e Gigante numa Emanação de 90 m a partir da harpia quando a canção começa. Falha: O alvo fica na condição Enfeitiçado até a canção acabar e repete a salvaguarda no fim de cada um de seus turnos. Enquanto Enfeitiçado, o alvo fica na condição Incapacitado e ignora a Canção Sedutora de outras harpias. Se o alvo estiver a mais de 1,5 m da harpia, ele se move no seu turno na direção dela pelo caminho mais direto, tentando chegar a até 1,5 m. Ele não evita Ataques de Oportunidade; porém, antes de entrar em terreno perigoso (como lava ou um poço) e sempre que sofrer dano de uma fonte que não seja a harpia, o alvo repete a salvaguarda. Sucesso: O alvo fica imune à Canção Sedutora desta harpia por 24 horas."]]],"secoesEn":[["Ações",["Claw. Melee Attack Roll: +3, reach 5 ft. Hit: 6 (2d4 + 1) Slashing damage.","Luring Song. The harpy sings a magical melody, which lasts until the harpy's Concentration ends on it. Wisdom Saving Throw: DC 11, each Humanoid and Giant in a 300-foot Emanation originating from the harpy when the song starts. Failure: The target has the Charmed condition until the song ends and repeats the save at the end of each of its turns. While Charmed, the target has the Incapacitated condition and ignores the Luring Song of other harpies. If the target is more than 5 feet from the harpy, the target moves on its turn toward the harpy by the most direct route, trying to get within 5 feet of the harpy. It doesn't avoid Opportunity Attacks; however, before moving into damaging terrain (such as lava or a pit) and whenever it takes damage from a source other than the harpy, the target repeats the save. Success: The target is immune to this harpy's Luring Song for 24 hours."]]]},"Hell Hound":{"tipo":"Médio Ínfero, Leal e Mau","ca":"15","pv":"58 (9d8+18)","desl":"15 m","ini":"+1 (11)","atr":[17,12,14,6,13,6],"info":[["Perícias","Percepção +5"],["Imunidades","Fogo"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 15"],["Idiomas","Understands Infernal mas não fala"]],"cr":"3","secoes":[["Traços",["Táticas de Matilha. O cão tem Vantagem numa jogada de ataque contra uma criatura se pelo menos um aliado do cão estiver a até 1,5 m dela e não estiver na condição Incapacitado."]],["Ações",["Ataque Múltiplo. O cão faz dois ataques de Mordida.","Mordida. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 7 (1d8 + 3) de dano Perfurante mais 3 (1d6) de dano de Fogo.","Sopro de Fogo (Recarga 5–6). Salvaguarda de Destreza: CD 12, cada criatura num Cone de 4,5 m. Falha: 17 (5d6) de dano de Fogo. Sucesso: Metade do dano."]]],"secoesEn":[["Traços",["Pack Tactics. The hound has Advantage on an attack roll against a creature if at least one of the hound's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."]],["Ações",["Multiattack. The hound makes two Bite attacks.","Bite. Melee Attack Roll: +5, reach 5 ft. Hit: 7 (1d8 + 3) Piercing damage plus 3 (1d6) Fire damage.","Fire Breath (Recharge 5-6). Dexterity Saving Throw: DC 12, each creature in a 15-foot Cone. Failure: 17 (5d6) Fire damage. Success: Half damage."]]]},"Hezrou":{"tipo":"Grande Ínfero (Demônio), Caótico e Mau","ca":"18","pv":"157 (15d10+75)","desl":"9 m","ini":"+6 (16)","atr":[19,17,20,5,12,13],"info":[["Salvaguardas","For +7, Con +8, Sab +4"],["Resistências","Frio, Fogo, Elétrico"],["Imunidades","Venenoso; Envenenado"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 11"],["Idiomas","Abissal; telepatia 36 m"]],"cr":"8","secoes":[["Traços",["Restauração Demoníaca. Se o hezrou morrer fora do Abismo, seu corpo se dissolve em icor e ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar do Abismo.","Resistência à Magia. O hezrou tem Vantagem em salvaguardas contra magias e outros efeitos mágicos.","Fedor. Salvaguarda de Constituição: CD 16, qualquer criatura que comece o turno numa Emanação de 3 m a partir do hezrou. Falha: O alvo fica na condição Envenenado até o início do seu próximo turno."]],["Ações",["Ataque Múltiplo. O hezrou faz três ataques de Dilacerar.","Dilacerar. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 6 (1d4 + 4) de dano Cortante mais 9 (2d8) de dano Venenoso."]],["Ações Bônus",["Salto. O hezrou salta até 9 m gastando 3 m de movimento."]]],"secoesEn":[["Traços",["Demonic Restoration. If the hezrou dies outside the Abyss, its body dissolves into ichor, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Abyss.","Magic Resistance. The hezrou has Advantage on saving throws against spells and other magical effects.","Stench. Constitution Saving Throw: DC 16, any creature that starts its turn in a 10-foot Emanation originating from the hezrou. Failure: The target has the Poisoned condition until the start of its next turn."]],["Ações",["Multiattack. The hezrou makes three Rend attacks.","Rend. Melee Attack Roll: +7, reach 5 ft. Hit: 6 (1d4 + 4) Slashing damage plus 9 (2d8) Poison damage."]],["Ações Bônus",["Leap. The hezrou jumps up to 30 feet by spending 10 feet of movement."]]]},"Hill Giant":{"tipo":"Enorme Gigante, Caótico e Mau","ca":"13","pv":"105 (10d12+40)","desl":"12 m","ini":"+2 (12)","atr":[21,8,19,5,9,6],"info":[["Perícias","Percepção +2"],["Sentidos","Percepção passiva 12"],["Idiomas","Gigante"]],"cr":"5","secoes":[["Ações",["Ataque Múltiplo. O gigante faz dois ataques, usando Clava de Árvore ou Arremesso de Lixo em qualquer combinação.","Clava de Árvore. Jogada de Ataque Corpo a Corpo: +8, alcance 3 m. Acerto: 18 (3d8 + 5) de dano Contundente. Se o alvo for uma criatura Grande ou menor, ele fica na condição Caído.","Arremesso de Lixo. Jogada de Ataque à Distância: +8, distância 18/72 m. Acerto: 16 (2d10 + 5) de dano Contundente, e o alvo fica na condição Envenenado até o fim do seu próximo turno."]]],"secoesEn":[["Ações",["Multiattack. The giant makes two attacks, using Tree Club or Trash Lob in any combination.","Tree Club. Melee Attack Roll: +8, reach 10 ft. Hit: 18 (3d8 + 5) Bludgeoning damage. If the target is a Large or smaller creature, it has the Prone condition.","Trash Lob. Ranged Attack Roll: +8, range 60/240 ft. Hit: 16 (2d10 + 5) Bludgeoning damage, and the target has the Poisoned condition until the end of its next turn."]]]},"Hippogriff":{"tipo":"Grande Monstruosidade, Sem Tendência","ca":"11","pv":"26 (4d10+4)","desl":"12 m, voo 18 m","ini":"+1 (11)","atr":[17,13,13,2,12,8],"info":[["Perícias","Percepção +5"],["Sentidos","Percepção passiva 15"],["Idiomas","Nenhum"]],"cr":"1","secoes":[["Traços",["Sobrevoo. O hipogrifo não provoca Ataque de Oportunidade quando voa para fora do alcance de um inimigo."]],["Ações",["Ataque Múltiplo. O hipogrifo faz dois ataques de Dilacerar.","Dilacerar. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 7 (1d8 + 3) de dano Cortante."]]],"secoesEn":[["Traços",["Flyby. The hippogriff doesn't provoke an Opportunity Attack when it flies out of an enemy's reach."]],["Ações",["Multiattack. The hippogriff makes two Rend attacks.","Rend. Melee Attack Roll: +5, reach 5 ft. Hit: 7 (1d8 + 3) Slashing damage."]]]},"Hobgoblin Warrior":{"tipo":"Médio Fada (Goblinoid), Leal e Mau","ca":"18","pv":"11 (2d8+2)","desl":"9 m","ini":"+3 (13)","atr":[13,12,12,10,10,9],"info":[["Equipamento","Half Plate Armor, Longbow, Longsword, Shield"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Comum, Goblin"]],"cr":"1/2","secoes":[["Traços",["Táticas de Matilha. O hobgoblin tem Vantagem numa jogada de ataque contra uma criatura se pelo menos um aliado do hobgoblin estiver a até 1,5 m dela e não estiver na condição Incapacitado."]],["Ações",["Espada Longa. Jogada de Ataque Corpo a Corpo: +3, alcance 1,5 m. Acerto: 12 (2d10 + 1) de dano Cortante.","Arco Longo. Jogada de Ataque à Distância: +3, distância 45/180 m. Acerto: 5 (1d8 + 1) de dano Perfurante mais 7 (3d4) de dano Venenoso."]]],"secoesEn":[["Traços",["Pack Tactics. The hobgoblin has Advantage on an attack roll against a creature if at least one of the hobgoblin's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition."]],["Ações",["Longsword. Melee Attack Roll: +3, reach 5 ft. Hit: 12 (2d10 + 1) Slashing damage.","Longbow. Ranged Attack Roll: +3, range 150/600 ft. Hit: 5 (1d8 + 1) Piercing damage plus 7 (3d4) Poison damage."]]]},"Hobgoblin Captain":{"tipo":"Médio Fada (Goblinoid), Leal e Mau","ca":"17","pv":"58 (9d8+18)","desl":"9 m","ini":"+4 (14)","atr":[15,14,14,12,10,13],"info":[["Equipamento","Greatsword, Half Plate Armor, Longbow"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Comum, Goblin"]],"cr":"3","secoes":[["Traços",["Aura de Autoridade. Enquanto estiverem numa Emanação de 3 m a partir do hobgoblin, ele e seus aliados têm Vantagem em jogadas de ataque e salvaguardas, desde que o hobgoblin não esteja na condição Incapacitado."]],["Ações",["Ataque Múltiplo. O hobgoblin faz dois ataques, usando Montante ou Arco Longo em qualquer combinação.","Montante. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 9 (2d6 + 2) de dano Cortante mais 3 (1d6) de dano Venenoso.","Arco Longo. Jogada de Ataque à Distância: +4, distância 45/180 m. Acerto: 6 (1d8 + 2) de dano Perfurante mais 5 (2d4) de dano Venenoso."]]],"secoesEn":[["Traços",["Aura of Authority. While in a 10-foot Emanation originating from the hobgoblin, the hobgoblin and its allies have Advantage on attack rolls and saving throws, provided the hobgoblin doesn't have the Incapacitated condition."]],["Ações",["Multiattack. The hobgoblin makes two attacks, using Greatsword or Longbow in any combination.","Greatsword. Melee Attack Roll: +4, reach 5 ft. Hit: 9 (2d6 + 2) Slashing damage plus 3 (1d6) Poison damage.","Longbow. Ranged Attack Roll: +4, range 150/600 ft. Hit: 6 (1d8 + 2) Piercing damage plus 5 (2d4) Poison damage."]]]},"Homunculus":{"tipo":"Miúdo Constructo, Neutro","ca":"13","pv":"4 (1d4+2)","desl":"6 m, voo 12 m","ini":"+2 (12)","atr":[4,15,14,10,10,7],"info":[["Salvaguardas","Sab +2, Car +0"],["Imunidades","Venenoso; Enfeitiçado, Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Understands Comum mais one other language mas não fala"]],"cr":"0","secoes":[["Traços",["Vínculo Telepático. Enquanto o homúnculo estiver no mesmo plano de existência que seu mestre, os dois podem se comunicar telepaticamente."]],["Ações",["Mordida. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 1 de dano Perfurante, e o alvo é submetido ao efeito a seguir. Salvaguarda de Constituição: CD 12. Falha: O alvo fica na condição Envenenado até o fim do próximo turno do homúnculo. Falha por 5 ou Mais: O alvo fica na condição Envenenado por 1 minuto. Enquanto Envenenado, o alvo fica na condição Inconsciente, que acaba antes se ele sofrer qualquer dano."]]],"secoesEn":[["Traços",["Telepathic Bond. While the homunculus is on the same plane of existence as its master, the two of them can communicate telepathically with each other."]],["Ações",["Bite. Melee Attack Roll: +4, reach 5 ft. Hit: 1 Piercing damage, and the target is subjected to the following effect. Constitution Saving Throw: DC 12. Failure: The target has the Poisoned condition until the end of the homunculus's next turn. Failure by 5 or More: The target has the Poisoned condition for 1 minute. While Poisoned, the target has the Unconscious condition, which ends early if the target takes any damage."]]]},"Horned Devil":{"tipo":"Grande Ínfero (Diabo), Leal e Mau","ca":"18","pv":"199 (19d10+95)","desl":"9 m, voo 18 m","ini":"+7 (17)","atr":[22,17,21,12,16,18],"info":[["Salvaguardas","For +10, Des +7, Sab +7, Car +8"],["Resistências","Frio"],["Imunidades","Fogo, Venenoso; Envenenado"],["Sentidos","Visão no Escuro 45 m (unimpeded by magical Darkness); Percepção passiva 13"],["Idiomas","Infernal; telepatia 36 m"]],"cr":"11","secoes":[["Traços",["Restauração Diabólica. Se o diabo morrer fora dos Nove Infernos, seu corpo desaparece em fumaça sulfurosa e ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar dos Nove Infernos.","Resistência à Magia. O diabo tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O diabo faz três ataques, usando Forcado Abrasador ou Arremessar Chama em qualquer combinação. Ele pode substituir um ataque por um uso de Cauda Infernal.","Forcado Abrasador. Jogada de Ataque Corpo a Corpo: +10, alcance 3 m. Acerto: 15 (2d8 + 6) de dano Perfurante mais 9 (2d8) de dano de Fogo.","Arremessar Chama. Jogada de Ataque à Distância: +8, distância 45 m. Acerto: 26 (5d8 + 4) de dano de Fogo. Se o alvo for um objeto inflamável que ninguém esteja vestindo ou carregando, ele começa a queimar.","Cauda Infernal. Salvaguarda de Destreza: CD 17, uma criatura que o diabo consiga ver a até 3 m. Falha: 10 (1d8 + 6) de dano Necrótico, e o alvo recebe um ferimento infernal se ainda não tiver um. Enquanto estiver ferido, o alvo perde 10 (3d6) Pontos de Vida no início de cada um de seus turnos. O ferimento se fecha após 1 minuto, depois que uma magia restaurar Pontos de Vida do alvo, ou depois que o alvo ou uma criatura a até 1,5 m dele usar uma ação para estancar o ferimento, sendo bem-sucedida num teste de Sabedoria (Medicina) CD 17."]]],"secoesEn":[["Traços",["Diabolical Restoration. If the devil dies outside the Nine Hells, its body disappears in sulfurous smoke, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.","Magic Resistance. The devil has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The devil makes three attacks, using Searing Fork or Hurl Flame in any combination. It can replace one attack with a use of Infernal Tail.","Searing Fork. Melee Attack Roll: +10, reach 10 ft. Hit: 15 (2d8 + 6) Piercing damage plus 9 (2d8) Fire damage.","Hurl Flame. Ranged Attack Roll: +8, range 150 ft. Hit: 26 (5d8 + 4) Fire damage. If the target is a flammable object that isn't being worn or carried, it starts burning.","Infernal Tail. Dexterity Saving Throw: DC 17, one creature the devil can see within 10 feet. Failure: 10 (1d8 + 6) Necrotic damage, and the target receives an infernal wound if it doesn't have one. While wounded, the target loses 10 (3d6) Hit Points at the start of each of its turns. The wound closes after 1 minute, after a spell restores Hit Points to the target, or after the target or a creature within 5 feet of it takes an action to stanch the wound, doing so by succeeding on a DC 17 Wisdom (Medicine) check."]]]},"Hydra":{"tipo":"Enorme Monstruosidade, Sem Tendência","ca":"15","pv":"184 (16d12+80)","desl":"12 m, natação 12 m","ini":"+4 (14)","atr":[20,12,20,2,10,7],"info":[["Perícias","Percepção +6"],["Imunidades","Cego, Enfeitiçado, Surdo, Amedrontado, Atordoado, Inconsciente"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 16"],["Idiomas","Nenhum"]],"cr":"8","secoes":[["Traços",["Prender a Respiração. A hidra consegue prender a respiração por 1 hora.","Várias Cabeças. A hidra tem cinco cabeças. Sempre que sofrer 25 ou mais de dano num único turno, uma das cabeças morre. A hidra morre se todas as cabeças estiverem mortas. No fim de cada um de seus turnos em que tiver pelo menos uma cabeça viva, a hidra faz crescer duas cabeças para cada cabeça que morreu desde o seu último turno, a menos que tenha sofrido dano de Fogo desde o seu último turno. A hidra recupera 20 Pontos de Vida quando novas cabeças crescem.","Cabeças Reativas. Para cada cabeça além da primeira, a hidra ganha uma Reação extra que só pode ser usada para Ataques de Oportunidade."]],["Ações",["Ataque Múltiplo. A hidra faz tantos ataques de Mordida quanto o número de cabeças que tem.","Mordida. Jogada de Ataque Corpo a Corpo: +8, alcance 3 m. Acerto: 10 (1d10 + 5) de dano Perfurante."]]],"secoesEn":[["Traços",["Hold Breath. The hydra can hold its breath for 1 hour.","Multiple Heads. The hydra has five heads. Whenever the hydra takes 25 damage or more on a single turn, one of its heads dies. The hydra dies if all its heads are dead. At the end of each of its turns when it has at least one living head, the hydra grows two heads for each of its heads that died since its last turn, unless it has taken Fire damage since its last turn. The hydra regains 20 Hit Points when it grows new heads.","Reactive Heads. For each head the hydra has beyond one, it gets an extra Reaction that can be used only for Opportunity Attacks."]],["Ações",["Multiattack. The hydra makes as many Bite attacks as it has heads.","Bite. Melee Attack Roll: +8, reach 10 ft. Hit: 10 (1d10 + 5) Piercing damage."]]]},"Ice Devil":{"tipo":"Grande Ínfero (Diabo), Leal e Mau","ca":"18","pv":"228 (24d10+96)","desl":"12 m","ini":"+7 (17)","atr":[21,14,18,18,15,18],"info":[["Salvaguardas","Des +7, Con +9, Sab +7, Car +9"],["Perícias","Intuição +7, Percepção +7, Persuasão +9"],["Imunidades","Frio, Fogo, Venenoso; Envenenado"],["Sentidos","Percepção às Cegas 36 m; Percepção passiva 17"],["Idiomas","Infernal; telepatia 36 m"]],"cr":"14","secoes":[["Traços",["Restauração Diabólica. Se o diabo morrer fora dos Nove Infernos, seu corpo desaparece em fumaça sulfurosa e ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar dos Nove Infernos.","Resistência à Magia. O diabo tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O diabo faz três ataques de Lança de Gelo. Ele pode substituir um ataque por um ataque de Cauda.","Lança de Gelo. Jogada de Ataque Corpo a Corpo ou à Distância: +10, alcance 1,5 m ou distância 9/36 m. Acerto: 14 (2d8 + 5) de dano Perfurante mais 10 (3d6) de dano de Frio. Até o fim do seu próximo turno, o alvo não pode realizar Ação Bônus nem Reação, seu Deslocamento diminui em 3 m, e ele pode se mover ou realizar uma ação no seu turno, não ambos. Acerto ou Erro: A lança volta magicamente para a mão do diabo logo após um ataque à distância.","Cauda. Jogada de Ataque Corpo a Corpo: +10, alcance 3 m. Acerto: 15 (3d6 + 5) de dano Contundente mais 18 (4d8) de dano de Frio.","Muralha de Gelo (Recarga 6). O diabo conjura Muralha de Gelo (versão de 8º círculo), sem precisar de componentes de magia e usando Inteligência como atributo de conjuração (CD de salvaguarda de magia 17)."]]],"secoesEn":[["Traços",["Diabolical Restoration. If the devil dies outside the Nine Hells, its body disappears in sulfurous smoke, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.","Magic Resistance. The devil has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The devil makes three Ice Spear attacks. It can replace one attack with a Tail attack.","Ice Spear. Melee or Ranged Attack Roll: +10, reach 5 ft. or range 30/120 ft. Hit: 14 (2d8 + 5) Piercing damage plus 10 (3d6) Cold damage. Until the end of its next turn, the target can't take a Bonus Action or Reaction, its Speed decreases by 10 feet, and it can move or take one action on its turn, not both. Hit or Miss: The spear magically returns to the devil's hand immediately after a ranged attack.","Tail. Melee Attack Roll: +10, reach 10 ft. Hit: 15 (3d6 + 5) Bludgeoning damage plus 18 (4d8) Cold damage.","Ice Wall (Recharge 6). The devil casts Wall of Ice (level 8 version), requiring no spell components and using Intelligence as the spellcasting ability (spell save DC 17)."]]]},"Imp":{"tipo":"Miúdo Ínfero (Diabo), Leal e Mau","ca":"13","pv":"21 (6d4+6)","desl":"6 m, voo 12 m","ini":"+3 (13)","atr":[6,17,13,11,12,14],"info":[["Perícias","Enganação +4, Intuição +3, Furtividade +5"],["Resistências","Frio"],["Imunidades","Fogo, Venenoso; Envenenado"],["Sentidos","Visão no Escuro 36 m (unimpeded by magical Darkness); Percepção passiva 11"],["Idiomas","Comum, Infernal"]],"cr":"1","secoes":[["Traços",["Resistência à Magia. O diabrete tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ferrão. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 6 (1d6 + 3) de dano Perfurante mais 7 (2d6) de dano Venenoso.","Invisibilidade. O diabrete conjura Invisibilidade em si mesmo, sem precisar de componentes de magia e usando Carisma como atributo de conjuração.","Mudar de Forma. O diabrete se transforma para parecer um rato (Deslocamento 6 m), um corvo (6 m, voo 18 m) ou uma aranha (6 m, escalada 6 m), ou volta à sua forma verdadeira. Suas estatísticas de jogo são as mesmas em todas as formas, exceto o Deslocamento. Equipamentos que esteja vestindo ou carregando não se transformam."]]],"secoesEn":[["Traços",["Magic Resistance. The imp has Advantage on saving throws against spells and other magical effects."]],["Ações",["Sting. Melee Attack Roll: +5, reach 5 ft. Hit: 6 (1d6 + 3) Piercing damage plus 7 (2d6) Poison damage.","Invisibility. The imp casts Invisibility on itself, requiring no spell components and using Charisma as the spellcasting ability.","Shape-Shift. The imp shape-shifts to resemble a rat (Speed 20 ft.), a raven (20 ft., Fly 60 ft.), or a spider (20 ft., Climb 20 ft.), or it returns to its true form. Its game statistics are the same in each form, except for its Speed. Any equipment it is wearing or carrying isn't transformed."]]]},"Incubus":{"tipo":"Médio Ínfero, Neutro e Mau","ca":"15","pv":"66 (12d8+12)","desl":"9 m, voo 18 m","ini":"+3 (13)","atr":[8,17,13,15,12,20],"info":[["Perícias","Enganação +9, Intuição +5, Percepção +5, Persuasão +9, Furtividade +7"],["Resistências","Frio, Fogo, Venenoso, Psíquico"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 15"],["Idiomas","Abissal, Comum, Infernal; telepatia 18 m"]],"cr":"4","secoes":[["Traços",["Forma de Súcubo. Quando o íncubo termina um Descanso Longo, ele pode se transformar num Súcubo, usando aquela ficha em vez desta. Equipamentos que esteja vestindo ou carregando não se transformam."]],["Ações",["Ataque Múltiplo. O íncubo faz dois ataques de Toque Inquietante.","Toque Inquietante. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 15 (3d6 + 5) de dano Psíquico, e o alvo fica amaldiçoado por 24 horas ou até o íncubo morrer. Até a maldição acabar, o alvo não recebe nenhum benefício ao terminar Descansos Curtos.","Conjuração. O íncubo conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 15): À Vontade: Disfarçar-se, Forma Etérea. 1/Dia Cada: Sonho, Padrão Hipnótico."]],["Ações Bônus",["Pesadelo (Recarga 6). Salvaguarda de Sabedoria: CD 15, uma criatura que o íncubo consiga ver a até 18 m. Falha: Se o alvo tiver 20 Pontos de Vida ou menos, ele fica na condição Inconsciente por 1 hora, até sofrer dano ou até uma criatura a até 1,5 m dele usar uma ação para acordá-lo. Caso contrário, o alvo sofre 18 (4d8) de dano Psíquico."]]],"secoesEn":[["Traços",["Succubus Form. When the incubus finishes a Long Rest, it can shape-shift into a Succubus, using that stat block instead of this one. Any equipment it is wearing or carrying isn't transformed."]],["Ações",["Multiattack. The incubus makes two Restless Touch attacks.","Restless Touch. Melee Attack Roll: +7, reach 5 ft. Hit: 15 (3d6 + 5) Psychic damage, and the target is cursed for 24 hours or until the incubus dies. Until the curse ends, the target gains no benefit from finishing Short Rests.","Spellcasting. The incubus casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 15): At Will: Disguise Self, Etherealness 1/Day Each: Dream, Hypnotic Pattern"]],["Ações Bônus",["Nightmare (Recharge 6). Wisdom Saving Throw: DC 15, one creature the incubus can see within 60 feet. Failure: If the target has 20 Hit Points or fewer, it has the Unconscious condition for 1 hour, until it takes damage, or until a creature within 5 feet of it takes an action to wake it. Otherwise, the target takes 18 (4d8) Psychic damage."]]]},"Invisible Stalker":{"tipo":"Grande Elemental, Neutro","ca":"14","pv":"97 (13d10+26)","desl":"15 m, voo 15 m (pairar)","ini":"+7 (22)","atr":[16,19,14,10,15,11],"info":[["Perícias","Percepção +8, Furtividade +10"],["Resistências","Contundente, Perfurante, Cortante"],["Imunidades","Venenoso; Exaustão, Agarrado, Paralisado, Petrificado, Envenenado, Caído, Impedido, Inconsciente"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 18"],["Idiomas","Comum, Primordial (Auran)"]],"cr":"6","secoes":[["Traços",["Forma Aérea. O perseguidor pode entrar no espaço de um inimigo e parar ali. Ele pode passar por um espaço de apenas 2,5 cm de largura sem gastar movimento extra.","Invisibilidade. O perseguidor está na condição Invisível."]],["Ações",["Ataque Múltiplo. O perseguidor faz três ataques de Golpe de Vento. Ele pode substituir um ataque por um uso de Vórtice.","Golpe de Vento. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 11 (2d6 + 4) de dano de Energia.","Vórtice. Salvaguarda de Constituição: CD 14, uma criatura Grande ou menor no espaço do perseguidor. Falha: 7 (1d8 + 3) de dano Trovejante, e o alvo fica na condição Agarrado (CD 13 para escapar). Até o agarrão acabar, o alvo não pode conjurar magias com componente Verbal e sofre 7 (2d6) de dano Trovejante no início de cada turno do perseguidor."]]],"secoesEn":[["Traços",["Air Form. The stalker can enter an enemy's space and stop there. It can move through a space as narrow as 1 inch without expending extra movement to do so.","Invisibility. The stalker has the Invisible condition."]],["Ações",["Multiattack. The stalker makes three Wind Swipe attacks. It can replace one attack with a use of Vortex.","Wind Swipe. Melee Attack Roll: +7, reach 5 ft. Hit: 11 (2d6 + 4) Force damage.","Vortex. Constitution Saving Throw: DC 14, one Large or smaller creature in the stalker's space. Failure: 7 (1d8 + 3) Thunder damage, and the target has the Grappled condition (escape DC 13). Until the grapple ends, the target can't cast spells with a Verbal component and takes 7 (2d6) Thunder damage at the start of each of the stalker's turns."]]]},"Iron Golem":{"tipo":"Grande Constructo, Sem Tendência","ca":"20","pv":"252 (24d10+120)","desl":"9 m","ini":"+9 (19)","atr":[24,9,20,3,11,1],"info":[["Imunidades","Fogo, Venenoso, Psíquico; Enfeitiçado, Exaustão, Amedrontado, Paralisado, Petrificado, Envenenado"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 10"],["Idiomas","Understands Comum mais two other languages mas não fala"]],"cr":"16","secoes":[["Traços",["Absorção de Fogo. Sempre que o golem for submetido a dano de Fogo, ele recupera Pontos de Vida iguais ao dano de Fogo causado.","Forma Imutável. O golem não pode mudar de forma.","Resistência à Magia. O golem tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O golem faz dois ataques, usando Braço de Lâmina ou Raio Flamejante em qualquer combinação.","Braço de Lâmina. Jogada de Ataque Corpo a Corpo: +12, alcance 3 m. Acerto: 20 (3d8 + 7) de dano Cortante mais 10 (3d6) de dano de Fogo.","Raio Flamejante. Jogada de Ataque à Distância: +10, distância 36 m. Acerto: 36 (8d8) de dano de Fogo.","Sopro Venenoso (Recarga 6). Salvaguarda de Constituição: CD 18, cada criatura num Cone de 18 m. Falha: 55 (10d10) de dano Venenoso. Sucesso: Metade do dano."]]],"secoesEn":[["Traços",["Fire Absorption. Whenever the golem is subjected to Fire damage, it regains a number of Hit Points equal to the Fire damage dealt.","Immutable Form. The golem can't shape-shift.","Magic Resistance. The golem has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The golem makes two attacks, using Bladed Arm or Fiery Bolt in any combination.","Bladed Arm. Melee Attack Roll: +12, reach 10 ft. Hit: 20 (3d8 + 7) Slashing damage plus 10 (3d6) Fire damage.","Fiery Bolt. Ranged Attack Roll: +10, range 120 ft. Hit: 36 (8d8) Fire damage.","Poison Breath (Recharge 6). Constitution Saving Throw: DC 18, each creature in a 60-foot Cone. Failure: 55 (10d10) Poison damage. Success: Half damage."]]]},"Knight":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"18","pv":"52 (8d8+16)","desl":"9 m","ini":"+0 (10)","atr":[16,11,14,11,11,15],"info":[["Salvaguardas","Con +4, Sab +2"],["Imunidades","Amedrontado"],["Equipamento","Greatsword, Heavy Crossbow, Plate Armor"],["Sentidos","Percepção passiva 10"],["Idiomas","Comum mais one other language"]],"cr":"3","secoes":[["Ações",["Ataque Múltiplo. O cavaleiro faz dois ataques, usando Montante ou Besta Pesada em qualquer combinação.","Montante. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 10 (2d6 + 3) de dano Cortante mais 4 (1d8) de dano Radiante.","Besta Pesada. Jogada de Ataque à Distância: +2, distância 30/120 m. Acerto: 11 (2d10) de dano Perfurante mais 4 (1d8) de dano Radiante."]],["Reações",["Aparar. Gatilho: O cavaleiro é atingido por uma jogada de ataque corpo a corpo enquanto empunha uma arma. Resposta: O cavaleiro soma 2 à sua CA contra esse ataque, possivelmente fazendo-o errar."]]],"secoesEn":[["Ações",["Multiattack. The knight makes two attacks, using Greatsword or Heavy Crossbow in any combination.","Greatsword. Melee Attack Roll: +5, reach 5 ft. Hit: 10 (2d6 + 3) Slashing damage plus 4 (1d8) Radiant damage.","Heavy Crossbow. Ranged Attack Roll: +2, range 100/400 ft. Hit: 11 (2d10) Piercing damage plus 4 (1d8) Radiant damage."]],["Reações",["Parry. Trigger: The knight is hit by a melee attack roll while holding a weapon. Response: The knight adds 2 to its AC against that attack, possibly causing it to miss."]]]},"Kobold Warrior":{"tipo":"Pequeno Dragão, Neutro","ca":"14","pv":"7 (3d6−3)","desl":"9 m","ini":"+2 (12)","atr":[7,15,9,8,7,8],"info":[["Equipamento","Daggers (3)"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 8"],["Idiomas","Comum, Dracônico"]],"cr":"1/8","secoes":[["Traços",["Táticas de Matilha. O kobold tem Vantagem numa jogada de ataque contra uma criatura se pelo menos um aliado do kobold estiver a até 1,5 m dela e não estiver na condição Incapacitado.","Sensibilidade à Luz Solar. Sob luz do sol, o kobold tem Desvantagem em testes de atributo e jogadas de ataque."]],["Ações",["Adaga. Jogada de Ataque Corpo a Corpo ou à Distância: +4, alcance 1,5 m ou distância 6/18 m. Acerto: 4 (1d4 + 2) de dano Perfurante."]]],"secoesEn":[["Traços",["Pack Tactics. The kobold has Advantage on an attack roll against a creature if at least one of the kobold's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition.","Sunlight Sensitivity. While in sunlight, the kobold has Disadvantage on ability checks and attack rolls."]],["Ações",["Dagger. Melee or Ranged Attack Roll: +4, reach 5 ft. or range 20/60 ft. Hit: 4 (1d4 + 2) Piercing damage."]]]},"Kraken":{"tipo":"Imenso Monstruosidade (Titã), Caótico e Mau","ca":"18","pv":"481 (26d20+208)","desl":"9 m, natação 36 m","ini":"+14 (24)","atr":[30,11,26,22,18,20],"info":[["Salvaguardas","For +17, Des +7, Con +15, Sab +11"],["Perícias","História +13, Percepção +11"],["Imunidades","Frio, Elétrico; Amedrontado, Agarrado, Paralisado, Impedido"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 21"],["Idiomas","Understands Abissal, Celestial, Infernal, e Primordial mas não fala; telepatia 36 m"]],"cr":"23","secoes":[["Traços",["Anfíbio. O kraken consegue respirar ar e água.","Resistência Lendária (4/Dia, ou 5/Dia no Covil). Se o kraken falhar numa salvaguarda, ele pode escolher ser bem-sucedido.","Monstro de Cerco. O kraken causa dano dobrado a objetos e estruturas."]],["Ações",["Ataque Múltiplo. O kraken faz dois ataques de Tentáculo e usa Arremessar, Descarga Elétrica ou Engolir.","Tentáculo. Jogada de Ataque Corpo a Corpo: +17, alcance 9 m. Acerto: 24 (4d6 + 10) de dano Contundente. O alvo fica na condição Agarrado (CD 20 para escapar) por um de dez tentáculos e na condição Impedido até o agarrão acabar.","Arremessar. O kraken arremessa uma criatura Grande ou menor que esteja Agarrada por ele para um espaço que consiga ver a até 18 m de si e que não esteja no ar. Salvaguarda de Destreza: CD 25, a criatura arremessada e cada criatura no espaço de destino. Falha: 18 (4d8) de dano Contundente, e o alvo fica na condição Caído. Sucesso: Apenas metade do dano.","Descarga Elétrica. Salvaguarda de Destreza: CD 23, uma criatura que o kraken consiga ver a até 36 m. Falha: 33 (6d10) de dano Elétrico. Sucesso: Metade do dano.","Engolir. Salvaguarda de Destreza: CD 25, uma criatura Agarrada pelo kraken (ele pode ter até quatro criaturas engolidas ao mesmo tempo). Falha: 23 (3d8 + 10) de dano Perfurante. Se o alvo for Grande ou menor, ele é engolido e deixa de estar Agarrado. Uma criatura engolida fica na condição Impedido, tem Cobertura Total contra ataques e outros efeitos de fora do kraken e sofre 24 (7d6) de dano Ácido no início de cada um de seus turnos. Se o kraken sofrer 50 ou mais de dano num único turno vindo de uma criatura dentro dele, ele precisa ser bem-sucedido numa salvaguarda de Constituição CD 25 no fim desse turno ou regurgita todas as criaturas engolidas, que caem num espaço a até 3 m do kraken na condição Caído. Se o kraken morrer, qualquer criatura engolida deixa de estar Impedida e pode escapar do cadáver usando 4,5 m de movimento, saindo Caída."]],["Ações Lendárias",["Usos de Ação Lendária: 3 (4 no Covil). Imediatamente após o turno de outra criatura, o kraken pode gastar um uso para realizar uma das ações a seguir. O kraken recupera todos os usos gastos no início de cada um de seus turnos.","Raio da Tempestade. O kraken usa Descarga Elétrica.","Tinta Tóxica. Salvaguarda de Constituição: CD 23, cada criatura numa Emanação de 4,5 m a partir do kraken enquanto ele está submerso. Falha: O alvo fica nas condições Cego e Envenenado até o fim do próximo turno do kraken. Depois, o kraken se move até o seu Deslocamento. Falha ou Sucesso: O kraken não pode realizar esta ação de novo até o início do seu próximo turno."]]],"secoesEn":[["Traços",["Amphibious. The kraken can breathe air and water.","Legendary Resistance (4/Day, or 5/Day in Lair). If the kraken fails a saving throw, it can choose to succeed instead.","Siege Monster. The kraken deals double damage to objects and structures."]],["Ações",["Multiattack. The kraken makes two Tentacle attacks and uses Fling, Lightning Strike, or Swallow.","Tentacle. Melee Attack Roll: +17, reach 30 ft. Hit: 24 (4d6 + 10) Bludgeoning damage. The target has the Grappled condition (escape DC 20) from one of ten tentacles, and it has the Restrained condition until the grapple ends.","Fling. The kraken throws a Large or smaller creature Grappled by it to a space it can see within 60 feet of itself that isn't in the air. Dexterity Saving Throw: DC 25, the creature thrown and each creature in the destination space. Failure: 18 (4d8) Bludgeoning damage, and the target has the Prone condition. Success: Half damage only.","Lightning Strike. Dexterity Saving Throw: DC 23, one creature the kraken can see within 120 feet. Failure: 33 (6d10) Lightning damage. Success: Half damage.","Swallow. Dexterity Saving Throw: DC 25, one creature Grappled by the kraken (it can have up to four creatures swallowed at a time). Failure: 23 (3d8 + 10) Piercing damage. If the target is Large or smaller, it is swallowed and no longer Grappled. A swallowed creature has the Restrained condition, has Total Cover against attacks and other effects outside the kraken, and takes 24 (7d6) Acid damage at the start of each of its turns. If the kraken takes 50 damage or more on a single turn from a creature inside it, the kraken must succeed on a DC 25 Constitution saving throw at the end of that turn or regurgitate all swallowed creatures, each of which falls in a space within 10 feet of the kraken with the Prone condition. If the kraken dies, any swallowed creature no longer has the Restrained condition and can escape from the corpse using 15 feet of movement, exiting Prone."]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the kraken can expend a use to take one of the following actions. The kraken regains all expended uses at the start of each of its turns.","Storm Bolt. The kraken uses Lightning Strike.","Toxic Ink. Constitution Saving Throw: DC 23, each creature in a 15-foot Emanation originating from the kraken while it is underwater. Failure: The target has the Blinded and Poisoned conditions until the end of the kraken's next turn. The kraken then moves up to its Speed. Failure or Success: The kraken can't take this action again until the start of its next turn."]]]},"Lamia":{"tipo":"Grande Ínfero, Caótico e Mau","ca":"13","pv":"97 (13d10+26)","desl":"12 m","ini":"+1 (11)","atr":[16,13,15,14,15,16],"info":[["Perícias","Enganação +7, Intuição +4, Furtividade +5"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 12"],["Idiomas","Abissal, Comum"]],"cr":"4","secoes":[["Ações",["Ataque Múltiplo. A lâmia faz dois ataques de Garra. Ela pode substituir um ataque por um uso de Toque Corruptor.","Garra. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 7 (1d8 + 3) de dano Cortante mais 7 (2d6) de dano Psíquico.","Toque Corruptor. Salvaguarda de Sabedoria: CD 13, uma criatura que a lâmia consiga ver a até 1,5 m. Falha: 13 (3d8) de dano Psíquico, e o alvo fica amaldiçoado por 1 hora. Até a maldição acabar, o alvo fica nas condições Enfeitiçado e Envenenado.","Conjuração. A lâmia conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 13): À Vontade: Disfarçar-se (pode parecer um bípede Grande ou Médio), Ilusão Menor. 1/Dia Cada: Missão, Imagem Maior, Vidência."]],["Ações Bônus",["Salto. A lâmia salta até 9 m gastando 3 m de movimento."]]],"secoesEn":[["Ações",["Multiattack. The lamia makes two Claw attacks. It can replace one attack with a use of Corrupting Touch.","Claw. Melee Attack Roll: +5, reach 5 ft. Hit: 7 (1d8 + 3) Slashing damage plus 7 (2d6) Psychic damage.","Corrupting Touch. Wisdom Saving Throw: DC 13, one creature the lamia can see within 5 feet. Failure: 13 (3d8) Psychic damage, and the target is cursed for 1 hour. Until the curse ends, the target has the Charmed and Poisoned conditions.","Spellcasting. The lamia casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 13): At Will: Disguise Self (can appear as a Large or Medium biped), Minor Illusion 1/Day Each: Geas, Major Image, Scrying"]],["Ações Bônus",["Leap. The lamia jumps up to 30 feet by spending 10 feet of movement."]]]},"Lemure":{"tipo":"Médio Ínfero (Diabo), Leal e Mau","ca":"9","pv":"9 (2d8)","desl":"6 m","ini":"-3 (7)","atr":[10,5,11,1,11,3],"info":[["Resistências","Frio"],["Imunidades","Fogo, Venenoso; Enfeitiçado, Amedrontado, Envenenado"],["Sentidos","Visão no Escuro 36 m (unimpeded by magical Darkness); Percepção passiva 10"],["Idiomas","Understands Infernal mas não fala"]],"cr":"0","secoes":[["Traços",["Restauração Infernal. Se o lêmure morrer nos Nove Infernos, ele revive com todos os seus Pontos de Vida em 1d10 dias, a menos que tenha sido morto por uma criatura sob o efeito da magia Bênção ou que seus restos sejam aspergidos com Água Benta."]],["Ações",["Gosma Vil. Jogada de Ataque Corpo a Corpo: +2, alcance 1,5 m. Acerto: 2 (1d4) de dano Venenoso."]]],"secoesEn":[["Traços",["Hellish Restoration. If the lemure dies in the Nine Hells, it revives with all its Hit Points in 1d10 days unless it is killed by a creature under the effects of a Bless spell or its remains are sprinkled with Holy Water."]],["Ações",["Vile Slime. Melee Attack Roll: +2, reach 5 ft. Hit: 2 (1d4) Poison damage."]]]},"Lich":{"tipo":"Médio Morto-Vivo (Mago), Neutro e Mau","ca":"20","pv":"315 (42d8+126)","desl":"9 m","ini":"+17 (27)","atr":[11,16,16,21,14,16],"info":[["Salvaguardas","Des +10, Con +10, Int +12, Sab +9"],["Perícias","Arcanismo +19, História +12, Intuição +9, Percepção +9"],["Resistências","Frio, Elétrico"],["Imunidades","Necrótico, Venenoso; Enfeitiçado, Exaustão, Amedrontado, Paralisado, Envenenado"],["Equipamento","Component Pouch"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 19"],["Idiomas","All"]],"cr":"21","secoes":[["Traços",["Resistência Lendária (4/Dia, ou 5/Dia no Covil). Se o lich falhar numa salvaguarda, ele pode escolher ser bem-sucedido.","Filactério. Se for destruído, o lich se refaz em 1d10 dias se tiver um filactério, revivendo com todos os seus Pontos de Vida. O novo corpo aparece num espaço desocupado dentro do covil do lich."]],["Ações",["Ataque Múltiplo. O lich faz três ataques, usando Explosão Sobrenatural ou Toque Paralisante em qualquer combinação.","Explosão Sobrenatural. Jogada de Ataque Corpo a Corpo ou à Distância: +12, alcance 1,5 m ou distância 36 m. Acerto: 31 (4d12 + 5) de dano de Energia.","Toque Paralisante. Jogada de Ataque Corpo a Corpo: +12, alcance 1,5 m. Acerto: 15 (3d6 + 5) de dano de Frio, e o alvo fica na condição Paralisado até o início do próximo turno do lich.","Conjuração. O lich conjura uma das magias a seguir, usando Inteligência como atributo de conjuração (CD de salvaguarda de magia 20): À Vontade: Detectar Magia, Detectar Pensamentos, Dissipar Magia, Bola de Fogo (versão de 5º círculo), Invisibilidade, Relâmpago (versão de 5º círculo), Mão Mágica, Prestidigitação. 2/Dia Cada: Animar Mortos, Porta Dimensional, Mudança de Plano. 1/Dia Cada: Corrente de Relâmpagos, Dedo da Morte, Palavra de Poder Matar, Vidência."]],["Reações",["Magia Protetora. O lich conjura Contramágica ou Escudo Arcano em resposta ao gatilho da magia, usando o mesmo atributo de conjuração de Conjuração."]],["Ações Lendárias",["Usos de Ação Lendária: 3 (4 no Covil). Imediatamente após o turno de outra criatura, o lich pode gastar um uso para realizar uma das ações a seguir. O lich recupera todos os usos gastos no início de cada um de seus turnos.","Teletransporte Mortal. O lich se teletransporta até 18 m para um espaço desocupado que consiga ver, e cada criatura a até 3 m do espaço que ele deixou sofre 11 (2d10) de dano Necrótico.","Perturbar a Vida. Salvaguarda de Constituição: CD 20, cada criatura que não seja Morto-Vivo numa Emanação de 6 m a partir do lich. Falha: 31 (9d6) de dano Necrótico. Sucesso: Metade do dano. Falha ou Sucesso: O lich não pode realizar esta ação de novo até o início do seu próximo turno.","Olhar Assustador. O lich conjura Medo, usando o mesmo atributo de conjuração de Conjuração. O lich não pode realizar esta ação de novo até o início do seu próximo turno."]]],"secoesEn":[["Traços",["Legendary Resistance (4/Day, or 5/Day in Lair). If the lich fails a saving throw, it can choose to succeed instead.","Spirit Jar. If destroyed, the lich reforms in 1d10 days if it has a spirit jar, reviving with all its Hit Points. The new body appears in an unoccupied space within the lich's lair."]],["Ações",["Multiattack. The lich makes three attacks, using Eldritch Burst or Paralyzing Touch in any combination.","Eldritch Burst. Melee or Ranged Attack Roll: +12, reach 5 ft. or range 120 ft. Hit: 31 (4d12 + 5) Force damage.","Paralyzing Touch. Melee Attack Roll: +12, reach 5 ft. Hit: 15 (3d6 + 5) Cold damage, and the target has the Paralyzed condition until the start of the lich's next turn.","Spellcasting. The lich casts one of the following spells, using Intelligence as the spellcasting ability (spell save DC 20): At Will: Detect Magic, Detect Thoughts, Dispel Magic, Fireball (level 5 version), Invisibility, Lightning Bolt (level 5 version), Mage Hand, Prestidigitation 2/Day Each: Animate Dead, Dimension Door, Plane Shift 1/Day Each: Chain Lightning, Finger of Death, Power Word Kill, Scrying"]],["Reações",["Protective Magic. The lich casts Counterspell or Shield in response to the spell's trigger, using the same spellcasting ability as Spellcasting."]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the lich can expend a use to take one of the following actions. The lich regains all expended uses at the start of each of its turns.","Deathly Teleport. The lich teleports up to 60 feet to an unoccupied space it can see, and each creature within 10 feet of the space it left takes 11 (2d10) Necrotic damage.","Disrupt Life. Constitution Saving Throw: DC 20, each creature that isn't an Undead in a 20-foot Emanation originating from the lich. Failure: 31 (9d6) Necrotic damage. Success: Half damage. Failure or Success: The lich can't take this action again until the start of its next turn.","Frightening Gaze. The lich casts Fear, using the same spellcasting ability as Spellcasting. The lich can't take this action again until the start of its next turn."]]]},"Mage":{"tipo":"Médio ou Pequeno Humanoide (Mago), Neutro","ca":"15","pv":"81 (18d8)","desl":"9 m","ini":"+2 (12)","atr":[9,14,11,17,12,11],"info":[["Salvaguardas","Int +6, Sab +4"],["Perícias","Arcanismo +6, História +6, Percepção +4"],["Equipamento","Wand"],["Sentidos","Percepção passiva 14"],["Idiomas","Comum mais three other languages"]],"cr":"6","secoes":[["Ações",["Ataque Múltiplo. O mago faz três ataques de Explosão Arcana.","Explosão Arcana. Jogada de Ataque Corpo a Corpo ou à Distância: +6, alcance 1,5 m ou distância 36 m. Acerto: 16 (3d8 + 3) de dano de Energia.","Conjuração. O mago conjura uma das magias a seguir, usando Inteligência como atributo de conjuração (CD de salvaguarda de magia 14): À Vontade: Detectar Magia, Luz, Armadura Arcana (já incluída na CA), Mão Mágica, Prestidigitação. 2/Dia Cada: Bola de Fogo (versão de 4º círculo), Invisibilidade. 1/Dia Cada: Cone de Frio, Voo."]],["Ações Bônus",["Passo Nebuloso (3/Dia). O mago conjura Passo Nebuloso, usando o mesmo atributo de conjuração de Conjuração."]],["Reações",["Magia Protetora (3/Dia). O mago conjura Contramágica ou Escudo Arcano em resposta ao gatilho da magia, usando o mesmo atributo de conjuração de Conjuração."]]],"secoesEn":[["Ações",["Multiattack. The mage makes three Arcane Burst attacks.","Arcane Burst. Melee or Ranged Attack Roll: +6, reach 5 ft. or range 120 ft. Hit: 16 (3d8 + 3) Force damage.","Spellcasting. The mage casts one of the following spells, using Intelligence as the spellcasting ability (spell save DC 14): At Will: Detect Magic, Light, Mage Armor (included in AC), Mage Hand, Prestidigitation 2/Day Each: Fireball (level 4 version), Invisibility 1/Day Each: Cone of Cold, Fly"]],["Ações Bônus",["Misty Step (3/Day). The mage casts Misty Step, using the same spellcasting ability as Spellcasting."]],["Reações",["Protective Magic (3/Day). The mage casts Counterspell or Shield in response to the spell's trigger, using the same spellcasting ability as Spellcasting."]]]},"Archmage":{"tipo":"Médio ou Pequeno Humanoide (Mago), Neutro","ca":"17","pv":"170 (31d8+31)","desl":"9 m","ini":"+7 (17)","atr":[10,14,12,20,15,16],"info":[["Salvaguardas","Int +9, Sab +6"],["Perícias","Arcanismo +13, História +9, Percepção +6"],["Imunidades","Psíquico; Enfeitiçado (with Mind Blank)"],["Equipamento","Wand"],["Sentidos","Percepção passiva 16"],["Idiomas","Comum mais five other languages"]],"cr":"12","secoes":[["Traços",["Resistência à Magia. O arquimago tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O arquimago faz quatro ataques de Explosão Arcana.","Explosão Arcana. Jogada de Ataque Corpo a Corpo ou à Distância: +9, alcance 1,5 m ou distância 45 m. Acerto: 27 (4d10 + 5) de dano de Energia.","Conjuração. O arquimago conjura uma das magias a seguir, usando Inteligência como atributo de conjuração (CD de salvaguarda de magia 17): À Vontade: Detectar Magia, Detectar Pensamentos, Disfarçar-se, Invisibilidade, Luz, Armadura Arcana (já incluída na CA), Mão Mágica, Prestidigitação. 2/Dia Cada: Voo, Relâmpago (versão de 7º círculo). 1/Dia Cada: Cone de Frio (versão de 9º círculo), Mente Vazia (conjurada antes do combate), Vidência, Teletransporte."]],["Ações Bônus",["Passo Nebuloso (3/Dia). O mago conjura Passo Nebuloso, usando o mesmo atributo de conjuração de Conjuração."]],["Reações",["Magia Protetora (3/Dia). O arquimago conjura Contramágica ou Escudo Arcano em resposta ao gatilho da magia, usando o mesmo atributo de conjuração de Conjuração."]]],"secoesEn":[["Traços",["Magic Resistance. The archmage has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The archmage makes four Arcane Burst attacks.","Arcane Burst. Melee or Ranged Attack Roll: +9, reach 5 ft. or range 150 ft. Hit: 27 (4d10 + 5) Force damage.","Spellcasting. The archmage casts one of the following spells, using Intelligence as the spellcasting ability (spell save DC 17): At Will: Detect Magic, Detect Thoughts, Disguise Self, Invisibility, Light, Mage Armor (included in AC), Mage Hand, Prestidigitation 2/Day Each: Fly, Lightning Bolt (level 7 version) 1/Day Each: Cone of Cold (level 9 version), Mind Blank (cast before combat), Scrying, Teleport"]],["Ações Bônus",["Misty Step (3/Day). The mage casts Misty Step, using the same spellcasting ability as Spellcasting."]],["Reações",["Protective Magic (3/Day). The archmage casts Counterspell or Shield in response to the spell's trigger, using the same spellcasting ability as Spellcasting."]]]},"Magmin":{"tipo":"Pequeno Elemental, Caótico e Neutro","ca":"14","pv":"13 (3d6+3)","desl":"9 m","ini":"+2 (12)","atr":[7,15,12,8,11,10],"info":[["Imunidades","Fogo"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Primordial (Ignan)"]],"cr":"1/2","secoes":[["Traços",["Explosão Mortal. O magmin explode ao morrer. Salvaguarda de Destreza: CD 11, cada criatura numa Emanação de 3 m a partir do magmin. Falha: 7 (2d6) de dano de Fogo. Sucesso: Metade do dano."]],["Ações",["Toque. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 7 (2d4 + 2) de dano de Fogo. Se o alvo for uma criatura ou um objeto inflamável que ninguém esteja vestindo ou carregando, ele começa a queimar."]],["Ações Bônus",["Iluminação Ardente. O magmin se incendeia ou apaga suas chamas. Enquanto em chamas, o magmin emite Luz Plena num raio de 3 m e Penumbra por mais 3 m."]]],"secoesEn":[["Traços",["Death Burst. The magmin explodes when it dies. Dexterity Saving Throw: DC 11, each creature in a 10-foot Emanation originating from the magmin. Failure: 7 (2d6) Fire damage. Success: Half damage."]],["Ações",["Touch. Melee Attack Roll: +4, reach 5 ft. Hit: 7 (2d4 + 2) Fire damage. If the target is a creature or a flammable object that isn't being worn or carried, it starts burning."]],["Ações Bônus",["Ignited Illumination. The magmin sets itself ablaze or extinguishes its flames. While ablaze, the magmin sheds Bright Light in a 10-foot radius and Dim Light for an additional 10 feet."]]]},"Manticore":{"tipo":"Grande Monstruosidade, Leal e Mau","ca":"14","pv":"68 (8d10+24)","desl":"9 m, voo 15 m","ini":"+3 (13)","atr":[17,16,17,7,12,8],"info":[["Sentidos","Visão no Escuro 18 m; Percepção passiva 11"],["Idiomas","Comum"]],"cr":"3","secoes":[["Ações",["Ataque Múltiplo. A mantícora faz três ataques, usando Dilacerar ou Espinho da Cauda em qualquer combinação.","Dilacerar. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 7 (1d8 + 3) de dano Cortante.","Espinho da Cauda. Jogada de Ataque à Distância: +5, distância 30/60 m. Acerto: 7 (1d8 + 3) de dano Perfurante."]]],"secoesEn":[["Ações",["Multiattack. The manticore makes three attacks, using Rend or Tail Spike in any combination.","Rend. Melee Attack Roll: +5, reach 5 ft. Hit: 7 (1d8 + 3) Slashing damage.","Tail Spike. Ranged Attack Roll: +5, range 100/200 ft. Hit: 7 (1d8 + 3) Piercing damage."]]]},"Marilith":{"tipo":"Grande Ínfero (Demônio), Caótico e Mau","ca":"16","pv":"220 (21d10+105)","desl":"12 m, escalada 12 m","ini":"+10 (20)","atr":[18,20,20,18,16,20],"info":[["Salvaguardas","For +9, Con +10, Sab +8, Car +10"],["Perícias","Percepção +8"],["Resistências","Frio, Fogo, Elétrico"],["Imunidades","Venenoso; Envenenado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 18"],["Idiomas","Abissal; telepatia 36 m"]],"cr":"16","secoes":[["Traços",["Restauração Demoníaca. Se a marilith morrer fora do Abismo, seu corpo se dissolve em icor e ela ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar do Abismo.","Resistência à Magia. A marilith tem Vantagem em salvaguardas contra magias e outros efeitos mágicos.","Reativa. A marilith pode realizar uma Reação em cada turno de combate."]],["Ações",["Ataque Múltiplo. A marilith faz seis ataques de Lâmina do Pacto e usa Constringir.","Lâmina do Pacto. Jogada de Ataque Corpo a Corpo: +10, alcance 1,5 m. Acerto: 10 (1d10 + 5) de dano Cortante mais 7 (2d6) de dano Necrótico.","Constringir. Salvaguarda de Força: CD 17, uma criatura Média ou menor que a marilith consiga ver a até 1,5 m. Falha: 15 (2d10 + 4) de dano Contundente. O alvo fica na condição Agarrado (CD 14 para escapar) e na condição Impedido até o agarrão acabar."]],["Ações Bônus",["Teletransporte (Recarga 5–6). A marilith se teletransporta até 36 m para um espaço desocupado que consiga ver."]],["Reações",["Aparar. Gatilho: A marilith é atingida por uma jogada de ataque corpo a corpo enquanto empunha uma arma. Resposta: A marilith soma 5 à sua CA contra esse ataque, possivelmente fazendo-o errar."]]],"secoesEn":[["Traços",["Demonic Restoration. If the marilith dies outside the Abyss, its body dissolves into ichor, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Abyss.","Magic Resistance. The marilith has Advantage on saving throws against spells and other magical effects.","Reactive. The marilith can take one Reaction on every turn of combat."]],["Ações",["Multiattack. The marilith makes six Pact Blade attacks and uses Constrict.","Pact Blade. Melee Attack Roll: +10, reach 5 ft. Hit: 10 (1d10 + 5) Slashing damage plus 7 (2d6) Necrotic damage.","Constrict. Strength Saving Throw: DC 17, one Medium or smaller creature the marilith can see within 5 feet. Failure: 15 (2d10 + 4) Bludgeoning damage. The target has the Grappled condition (escape DC 14), and it has the Restrained condition until the grapple ends."]],["Ações Bônus",["Teleport (Recharge 5-6). The marilith teleports up to 120 feet to an unoccupied space it can see."]],["Reações",["Parry. Trigger: The marilith is hit by a melee attack roll while holding a weapon. Response: The marilith adds 5 to its AC against that attack, possibly causing it to miss."]]]},"Medusa":{"tipo":"Médio Monstruosidade, Leal e Mau","ca":"15","pv":"127 (17d8+51)","desl":"9 m","ini":"+6 (16)","atr":[10,17,16,12,13,15],"info":[["Salvaguardas","Sab +4"],["Perícias","Enganação +5, Percepção +4, Furtividade +6"],["Sentidos","Visão no Escuro 45 m; Percepção passiva 14"],["Idiomas","Comum mais one other language"]],"cr":"6","secoes":[["Ações",["Ataque Múltiplo. A medusa faz dois ataques de Garra e um ataque de Cabelo de Serpentes, ou faz três ataques de Raio Venenoso.","Garra. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 10 (2d6 + 3) de dano Cortante.","Cabelo de Serpentes. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 5 (1d4 + 3) de dano Perfurante mais 14 (4d6) de dano Venenoso.","Raio Venenoso. Jogada de Ataque à Distância: +5, distância 45 m. Acerto: 11 (2d8 + 2) de dano Venenoso."]],["Ações Bônus",["Olhar Petrificante (Recarga 5–6). Salvaguarda de Constituição: CD 13, cada criatura num Cone de 9 m. Se a medusa vir seu reflexo no Cone, ela própria precisa fazer esta salvaguarda. Primeira Falha: O alvo fica na condição Impedido e repete a salvaguarda no fim do seu próximo turno se ainda estiver Impedido, encerrando o efeito em si mesmo com um sucesso. Segunda Falha: O alvo fica na condição Petrificado em vez de Impedido."]]],"secoesEn":[["Ações",["Multiattack. The medusa makes two Claw attacks and one Snake Hair attack, or it makes three Poison Ray attacks.","Claw. Melee Attack Roll: +6, reach 5 ft. Hit: 10 (2d6 + 3) Slashing damage.","Snake Hair. Melee Attack Roll: +6, reach 5 ft. Hit: 5 (1d4 + 3) Piercing damage plus 14 (4d6) Poison damage.","Poison Ray. Ranged Attack Roll: +5, range 150 f ) de dano Cortante mais 2 (1d4) de dano de Fogo.","Sopro de Vapor (Recarga 6). Salvaguarda de Constituição: CD 10, cada criatura num Cone de 4,5 m. Falha: 5 (2d4) de dano de Fogo, e o Deslocamento do alvo diminui em 3 m até o fim do próximo turno do mefite. Sucesso: Apenas metade do dano. Falha ou Sucesso: Estar submerso não concede Resistência a este dano de Fogo."]]],"secoesEn":[["Traços",["Blurred Form. Attack rolls against the mephit are made with Disadvantage unless the mephit has the Incapacitated condition.","Death Burst. The mephit explodes when it dies. Dexterity Saving Throw: DC 10, each creature in a 5-foot Emanation originating from the mephit. Failure: 5 (2d4) Fire damage. Success: Half damage."]],["Ações",["Claw. Melee Attack Roll: +2, reach 5 ft. Hit: 2 (1d4) Slashing damage plus 2 (1d4) Fire damage.","Steam Breath (Recharge 6). Constitution Saving Throw: DC 10, each creature in a 15-foot Cone. Failure: 5 (2d4) Fire damage, and the target's Speed decreases by 10 feet until the end of the mephit's next turn. Success: Half damage only. Failure or Success: Being underwater doesn't grant Resistance to this Fire damage."]]]},"Merfolk Skirmisher":{"tipo":"Médio Elemental, Neutro","ca":"11","pv":"11 (2d8+2)","desl":"3 m, natação 12 m","ini":"+1 (11)","atr":[10,13,12,11,14,12],"info":[["Sentidos","Percepção passiva 12"],["Idiomas","Comum, Primordial (Aquan)"]],"cr":"1/8","secoes":[["Traços",["Anfíbio. O tritão consegue respirar ar e água."]],["Ações",["Lança Oceânica. Jogada de Ataque Corpo a Corpo ou à Distância: +2, alcance 1,5 m ou distância 6/18 m. Acerto: 3 (1d6) de dano Perfurante mais 2 (1d4) de dano de Frio. Se o alvo for uma criatura, seu Deslocamento diminui em 3 m até o fim do seu próximo turno. Acerto ou Erro: A lança volta magicamente para a mão do tritão logo após um ataque à distância."]]],"secoesEn":[["Traços",["Amphibious. The merfolk can breathe air and water."]],["Ações",["Ocean Spear. Melee or Ranged Attack Roll: +2, reach 5 ft. or range 20/60 ft. Hit: 3 (1d6) Piercing damage plus 2 (1d4) Cold damage. If the target is a creature, its Speed decreases by 10 feet until the end of its next turn. Hit or Miss: The spear magically returns to the merfolk's hand immediately after a ranged attack."]]]},"Merrow":{"tipo":"Grande Monstruosidade, Caótico e Mau","ca":"13","pv":"45 (6d10+12)","desl":"3 m, natação 12 m","ini":"+2 (12)","atr":[18,15,15,8,10,9],"info":[["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Abissal, Primordial (Aquan)"]],"cr":"2","secoes":[["Traços",["Anfíbio. O merrow consegue respirar ar e água."]],["Ações",["Ataque Múltiplo. O merrow faz dois ataques, usando Mordida, Garra ou Arpão em qualquer combinação.","Mordida. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 6 (1d4 + 4) de dano Perfurante, e o alvo fica na condição Envenenado até o fim do próximo turno do merrow.","Garra. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 9 (2d4 + 4) de dano Cortante.","Arpão. Jogada de Ataque Corpo a Corpo ou à Distância: +6, alcance 1,5 m ou distância 6/18 m. Acerto: 11 (2d6 + 4) de dano Perfurante. Se o alvo for uma criatura Grande ou menor, o merrow o puxa até 4,5 m em linha reta na sua direção."]]],"secoesEn":[["Traços",["Amphibious. The merrow can breathe air and water."]],["Ações",["Multiattack. The merrow makes two attacks, using Bite, Claw, or Harpoon in any combination.","Bite. Melee Attack Roll: +6, reach 5 ft. Hit: 6 (1d4 + 4) Piercing damage, and the target has the Poisoned condition until the end of the merrow's next turn.","Claw. Melee Attack Roll: +6, reach 5 ft. Hit: 9 (2d4 + 4) Slashing damage.","Harpoon. Melee or Ranged Attack Roll: +6, reach 5 ft. or range 20/60 ft. Hit: 11 (2d6 + 4) Piercing damage. If the target is a Large or smaller creature, the merrow pulls the target up to 15 feet straight toward itself."]]]},"Mimic":{"tipo":"Médio Monstruosidade, Neutro","ca":"12","pv":"58 (9d8+18)","desl":"6 m","ini":"+3 (13)","atr":[17,12,15,5,13,8],"info":[["Perícias","Furtividade +5"],["Imunidades","Ácido; Caído"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 11"],["Idiomas","Nenhum"]],"cr":"2","secoes":[["Traços",["Adesivo (Somente na Forma de Objeto). O mímico gruda em qualquer coisa que o toque. Uma criatura Enorme ou menor grudada no mímico fica na condição Agarrado (CD 13 para escapar). Testes de atributo para escapar desse agarrão têm Desvantagem."]],["Ações",["Mordida. Jogada de Ataque Corpo a Corpo: +5 (com Vantagem se o alvo estiver Agarrado pelo mímico), alcance 1,5 m. Acerto: 7 (1d8 + 3) de dano Perfurante (ou 12 (2d8 + 3) de dano Perfurante se o alvo estiver Agarrado pelo mímico) mais 4 (1d8) de dano Ácido.","Pseudópode. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 7 (1d8 + 3) de dano Contundente mais 4 (1d8) de dano Ácido. Se o alvo for uma criatura Grande ou menor, ele fica na condição Agarrado (CD 13 para escapar). Testes de atributo para escapar desse agarrão têm Desvantagem."]],["Ações Bônus",["Mudar de Forma. O mímico se transforma para parecer um objeto Médio ou Pequeno, mantendo suas estatísticas de jogo, ou volta à sua verdadeira forma de massa amorfa. Equipamentos que esteja vestindo ou carregando não se transformam."]]],"secoesEn":[["Traços",["Adhesive (Object Form Only). The mimic adheres to anything that touches it. A Huge or smaller creature adhered to the mimic has the Grappled condition (escape DC 13). Ability checks made to escape this grapple have Disadvantage."]],["Ações",["Bite. Melee Attack Roll: +5 (with Advantage if the target is Grappled by the mimic), reach 5 ft. Hit: 7 (1d8 + 3) Piercing damage--or 12 (2d8 + 3) Piercing damage if the target is Grappled by the mimic--plus 4 (1d8) Acid damage.","Pseudopod. Melee Attack Roll: +5, reach 5 ft. Hit: 7 (1d8 + 3) Bludgeoning damage plus 4 (1d8) Acid damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 13). Ability checks made to escape this grapple have Disadvantage."]],["Ações Bônus",["Shape-Shift. The mimic shape-shifts to resemble a Medium or Small object while retaining its game statistics, or it returns to its true blob form. Any equipment it is wearing or carrying isn't transformed."]]]},"Minotaur of Baphomet":{"tipo":"Grande Monstruosidade, Caótico e Mau","ca":"14","pv":"85 (10d10+30)","desl":"12 m","ini":"+0 (10)","atr":[18,11,16,6,16,9],"info":[["Perícias","Percepção +7, Sobrevivência +7"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 17"],["Idiomas","Abissal"]],"cr":"3","secoes":[["Ações",["Glaive Abissal. Jogada de Ataque Corpo a Corpo: +6, alcance 3 m. Acerto: 10 (1d12 + 4) de dano Cortante mais 10 (3d6) de dano Necrótico.","Chifrada (Recarga 5–6). Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 18 (4d6 + 4) de dano Perfurante. Se o alvo for uma criatura Grande ou menor e o minotauro tiver se movido 3 m ou mais em linha reta na direção dele imediatamente antes do acerto, o alvo sofre 10 (3d6) de dano Perfurante extra e fica na condição Caído."]]],"secoesEn":[["Ações",["Abyssal Glaive. Melee Attack Roll: +6, reach 10 ft. Hit: 10 (1d12 + 4) Slashing damage plus 10 (3d6) Necrotic damage.","Gore (Recharge 5-6). Melee Attack Roll: +6, reach 5 ft. Hit: 18 (4d6 + 4) Piercing damage. If the target is a Large or smaller creature and the minotaur moved 10+ feet straight toward it immediately before the hit, the target takes an extra 10 (3d6) Piercing damage and has the Prone condition."]]]},"Mummy":{"tipo":"Médio ou Pequeno Morto-Vivo, Leal e Mau","ca":"11","pv":"58 (9d8+18)","desl":"6 m","ini":"-1 (9)","atr":[16,8,15,6,12,12],"info":[["Salvaguardas","Sab +3"],["Vulnerabilidades","Fogo"],["Imunidades","Necrótico, Venenoso; Enfeitiçado, Exaustão, Amedrontado, Paralisado, Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 11"],["Idiomas","Comum mais two other languages"]],"cr":"3","secoes":[["Ações",["Ataque Múltiplo. A múmia faz dois ataques de Punho Apodrecido e usa Olhar Aterrador.","Punho Apodrecido. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 8 (1d10 + 3) de dano Contundente mais 10 (3d6) de dano Necrótico. Se o alvo for uma criatura, ele fica amaldiçoado. Enquanto amaldiçoado, o alvo não pode recuperar Pontos de Vida, seu máximo de Pontos de Vida não volta ao normal ao terminar um Descanso Longo e diminui em 10 (3d6) a cada 24 horas que se passarem. Uma criatura que seja reduzida a 0 Pontos de Vida por este ataque morre e vira pó.","Olhar Aterrador. Salvaguarda de Sabedoria: CD 11, uma criatura que a múmia consiga ver a até 18 m. Falha: O alvo fica na condição Amedrontado até o fim do próximo turno da múmia. Sucesso: O alvo fica imune ao Olhar Aterrador desta múmia por 24 horas."]]],"secoesEn":[["Ações",["Multiattack. The mummy makes two Rotting Fist attacks and uses Dreadful Glare.","Rotting Fist. Melee Attack Roll: +5, reach 5 ft. Hit: 8 (1d10 + 3) Bludgeoning damage plus 10 (3d6) Necrotic damage. If the target is a creature, it is cursed. While cursed, the target can't regain Hit Points, its Hit Point maximum doesn't return to normal when finishing a Long Rest, and its Hit Point maximum decreases by 10 (3d6) every 24 hours that elapse. A creature dies and turns to dust if reduced to 0 Hit Points by this attack.","Dreadful Glare. Wisdom Saving Throw: DC 11, one creature the mummy can see within 60 feet. Failure: The target has the Frightened condition until the end of the mummy's next turn. Success: The target is immune to this mummy's Dreadful Glare for 24 hours."]]]},"Mummy Lord":{"tipo":"Médio ou Pequeno Morto-Vivo (Clérigo), Leal e Mau","ca":"17","pv":"187 (25d8+75)","desl":"9 m","ini":"+10 (20)","atr":[18,10,17,11,19,16],"info":[["Salvaguardas","Int +5, Sab +9"],["Perícias","História +5, Percepção +9, Religião +5"],["Vulnerabilidades","Fogo"],["Imunidades","Necrótico, Venenoso; Enfeitiçado, Exaustão, Amedrontado, Paralisado, Envenenado"],["Sentidos","Visão Verdadeira 18 m; Percepção passiva 19"],["Idiomas","Comum mais three other languages"]],"cr":"15","secoes":[["Traços",["Resistência Lendária (3/Dia, ou 4/Dia no Covil). Se a múmia falhar numa salvaguarda, ela pode escolher ser bem-sucedida.","Resistência à Magia. A múmia tem Vantagem em salvaguardas contra magias e outros efeitos mágicos.","Restauração Morta-Viva. Se for destruída, a múmia ganha um novo corpo em 24 horas se seu coração estiver intacto, revivendo com todos os seus Pontos de Vida. O novo corpo aparece num espaço desocupado dentro do covil da múmia. O coração é um objeto Miúdo com CA 17, 10 PV e Imunidade a todo dano, exceto de Fogo."]],["Ações",["Ataque Múltiplo. A múmia faz um ataque de Punho Apodrecido ou de Canalizar Energia Negativa e usa Olhar Aterrador.","Punho Apodrecido. Jogada de Ataque Corpo a Corpo: +9, alcance 1,5 m. Acerto: 15 (2d10 + 4) de dano Contundente mais 10 (3d6) de dano Necrótico. Se o alvo for uma criatura, ele fica amaldiçoado. Enquanto amaldiçoado, o alvo não pode recuperar Pontos de Vida, não recebe benefício ao terminar um Descanso Longo e seu máximo de Pontos de Vida diminui em 10 (3d6) a cada 24 horas que se passarem. Uma criatura que seja reduzida a 0 Pontos de Vida por este ataque morre e vira pó.","Canalizar Energia Negativa. Jogada de Ataque à Distância: +9, distância 18 m. Acerto: 25 (6d6 + 4) de dano Necrótico.","Olhar Aterrador. Salvaguarda de Sabedoria: CD 17, uma criatura que a múmia consiga ver a até 18 m. Falha: 25 (6d6 + 4) de dano Psíquico, e o alvo fica na condição Paralisado até o fim do próximo turno da múmia.","Conjuração. A múmia conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Sabedoria como atributo de conjuração (CD de salvaguarda de magia 17, +9 para acertar com ataques de magia): À Vontade: Dissipar Magia, Taumaturgia. 1/Dia Cada: Animar Mortos, Ferir, Praga de Insetos (versão de 7º círculo)."]],["Reações",["Redemoinho de Areia. Gatilho: A múmia é atingida por uma jogada de ataque. Resposta: A múmia soma 2 à sua CA contra o ataque, possivelme
