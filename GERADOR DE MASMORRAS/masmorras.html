[["Traços",["Resistência Lendária (4/Dia, ou 5/Dia no Covil). Se o dragão falhar numa salvaguarda, ele pode escolher ser bem-sucedido."]],["Ações",["Ataque Múltiplo. O dragão faz três ataques de Dilacerar. Ele pode substituir um ataque por um uso de (A) Sopro Retardante ou (B) Conjuração para conjurar Pico Mental (versão de 5º círculo).","Dilacerar. Jogada de Ataque Corpo a Corpo: +15, alcance 4,5 m. Acerto: 19 (2d10 + 8) de dano Cortante mais 9 (2d8) de dano Ácido.","Sopro Ácido (Recarga 5–6). Salvaguarda de Destreza: CD 22, cada criatura numa Linha de 27 m de comprimento e 3 m de largura. Falha: 63 (14d8) de dano Ácido. Sucesso: Metade do dano.","Sopro Retardante. Salvaguarda de Constituição: CD 22, cada criatura num Cone de 27 m. Falha: O alvo não pode realizar Reações, seu Deslocamento cai pela metade e ele pode realizar uma ação ou uma Ação Bônus no seu turno, não ambas. O efeito dura até o fim do seu próximo turno.","Conjuração. O dragão conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 21): À Vontade: Detectar Magia, Pico Mental (versão de 5º círculo), Ilusão Menor, Mudar de Forma (apenas formas de Fera ou Humanoide, sem ganhar Pontos de Vida Temporários pela magia e sem precisar de Concentração ou Pontos de Vida Temporários para mantê-la). 1/Dia Cada: Restauração Maior, Imagem Maior, Projetar Imagem."]],["Ações Lendárias",["Usos de Ação Lendária: 3 (4 no Covil). Imediatamente após o turno de outra criatura, o dragão pode gastar um uso para realizar uma das ações a seguir. O dragão recupera todos os usos gastos no início de cada um de seus turnos.","Magia Risonha. Salvaguarda de Carisma: CD 21, uma criatura que o dragão consiga ver a até 36 m. Falha: 31 (9d6) de dano Psíquico. Até o fim do seu próximo turno, o alvo rola 1d8 sempre que faz um teste de atributo ou uma jogada de ataque e subtrai o resultado do Teste de D20. Falha ou Sucesso: O dragão não pode realizar esta ação de novo até o início do seu próximo turno.","Choque Mental. O dragão usa Conjuração para conjurar Pico Mental (versão de 5º círculo). O dragão não pode realizar esta ação de novo até o início do seu próximo turno.","Bote. O dragão se move até metade do seu Deslocamento e faz um ataque de Dilacerar."]]],"secoesEn":[["Traços",["Legendary Resistance (4/Day, or 5/Day in Lair). If the dragon fails a saving throw, it can choose to succeed instead."]],["Ações",["Multiattack. The dragon makes three Rend attacks. It can replace one attack with a use of (A) Slowing Breath or (B) Spellcasting to cast Mind Spike (level 5 version).","Rend. Melee Attack Roll: +15, reach 15 ft. Hit: 19 (2d10 + 8) Slashing damage plus 9 (2d8) Acid damage.","Acid Breath (Recharge 5-6). Dexterity Saving Throw: DC 22, each creature in an 90-foot-long, 10-foot-wide Line. Failure: 63 (14d8) Acid damage. Success: Half damage.","Slowing Breath. Constitution Saving Throw: DC 22, each creature in a 90-foot Cone. Failure: The target can't take Reactions; its Speed is halved; and it can take either an action or a Bonus Action on its turn, not both. This effect lasts until the end of its next turn.","Spellcasting. The dragon casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 21): At Will: Detect Magic, Mind Spike (level 5 version), Minor Illusion, Shapechange (Beast or Humanoid form only, no Temporary Hit Points gained from the spell, and no Concentration or Temporary Hit Points required to maintain the spell) 1/Day Each: Greater Restoration, Major Image, Project Image"]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the dragon can expend a use to take one of the following actions. The dragon regains all expended uses at the start of each of its turns.","Giggling Magic. Charisma Saving Throw: DC 21, one creature the dragon can see within 120 feet. Failure: 31 (9d6) Psychic damage. Until the end of its next turn, the target rolls 1d8 whenever it makes an ability check or attack roll and subtracts the number rolled from the D20 Test. Failure or Success: The dragon can't take this action again until the start of its next turn.","Mind Jolt. The dragon uses Spellcasting to cast Mind Spike (level 5 version). The dragon can't take this action again until the start of its next turn.","Pounce. The dragon moves up to half its Speed, and it makes one Rend attack."]]]},"Couatl":{"tipo":"Médio Celestial, Leal e Bom","ca":"19","pv":"60 (8d8+24)","desl":"9 m, voo 27 m","ini":"+5 (15)","atr":[16,20,17,18,20,18],"info":[["Salvaguardas","Con +5, Sab +7"],["Resistências","Contundente, Perfurante, Cortante"],["Imunidades","Psíquico, Radiante"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 15"],["Idiomas","All; telepatia 36 m"]],"cr":"4","secoes":[["Traços",["Mente Protegida. Os pensamentos do couatl não podem ser lidos por nenhum meio, e outras criaturas só podem se comunicar com ele telepaticamente se ele permitir."]],["Ações",["Mordida. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 11 (1d12 + 5) de dano Perfurante, e o alvo fica na condição Envenenado até o fim do próximo turno do couatl.","Constringir. Salvaguarda de Força: CD 15, uma criatura Média ou menor que o couatl consiga ver a até 1,5 m. Falha: 8 (1d6 + 5) de dano Contundente. O alvo fica na condição Agarrado (CD 13 para escapar) e na condição Impedido até o agarrão acabar.","Conjuração. O couatl conjura uma das magias a seguir, sem precisar de componentes de magia e usando Sabedoria como atributo de conjuração (CD de salvaguarda de magia 15): À Vontade: Detectar o Bem e o Mal, Detectar Magia, Detectar Pensamentos, Mudar de Forma (apenas formas de Fera ou Humanoide, sem ganhar Pontos de Vida Temporários pela magia e sem precisar de Concentração ou Pontos de Vida Temporários para mantê-la). 1/Dia Cada: Criar Alimentos e Água, Sonho, Restauração Maior, Vidência, Sono."]],["Ações Bônus",["Auxílio Divino (2/Dia). O couatl conjura Bênção, Restauração Menor ou Santuário, sem precisar de componentes de magia e usando o mesmo atributo de conjuração de Conjuração."]]],"secoesEn":[["Traços",["Shielded Mind. The couatl's thoughts can't be read by any means, and other creatures can communicate with it telepathically only if it allows them."]],["Ações",["Bite. Melee Attack Roll: +7, reach 5 ft. Hit: 11 (1d12 + 5) Piercing damage, and the target has the Poisoned condition until the end of the couatl's next turn.","Constrict. Strength Saving Throw: DC 15, one Medium or smaller creature the couatl can see within 5 feet. Failure: 8 (1d6 + 5) Bludgeoning damage. The target has the Grappled condition (escape DC 13), and it has the Restrained condition until the grapple ends.","Spellcasting. The couatl casts one of the following spells, requiring no spell components and using Wisdom as the spellcasting ability (spell save DC 15): At Will: Detect Evil and Good, Detect Magic, Detect Thoughts, Shapechange (Beast or Humanoid form only, no Temporary Hit Points gained from the spell, and no Concentration or Temporary Hit Points required to maintain the spell) 1/Day Each: Create Food and Water, Dream, Greater Restoration, Scrying, Sleep"]],["Ações Bônus",["Divine Aid (2/Day). The couatl casts Bless, Lesser Restoration, or Sanctuary, requiring no spell components and using the same spellcasting ability as Spellcasting."]]]},"Swarm of Crawling Claws":{"tipo":"Médio Enxame de Mortos-Vivos Miúdos, Neutro e Mau","ca":"12","pv":"49 (11d8)","desl":"9 m, escalada 9 m","ini":"+2 (12)","atr":[14,14,11,5,10,4],"info":[["Resistências","Contundente, Perfurante, Cortante"],["Imunidades","Necrótico, Venenoso; Enfeitiçado, Exaustão, Amedrontado, Agarrado, Incapacitado, Paralisado, Petrificado, Envenenado, Caído, Impedido, Atordoado"],["Sentidos","Percepção às Cegas 9 m; Percepção passiva 10"],["Idiomas","Understands Comum mas não fala"]],"cr":"3","secoes":[["Traços",["Enxame. O enxame pode ocupar o espaço de outra criatura e vice-versa, e pode passar por qualquer abertura grande o bastante para uma criatura Miúda. O enxame não pode recuperar Pontos de Vida nem ganhar Pontos de Vida Temporários."]],["Ações",["Enxame de Mãos Agarradoras. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 20 (4d8 + 2) de dano Necrótico, ou 11 (2d8 + 2) de dano Necrótico se o enxame estiver Sangrando. Se o alvo for uma criatura Média ou menor, ele fica na condição Caído."]]],"secoesEn":[["Traços",["Swarm. The swarm can occupy another creature's space and vice versa, and the swarm can move through any opening large enough for a Tiny creature. The swarm can't regain Hit Points or gain Temporary Hit Points."]],["Ações",["Swarm of Grasping Hands. Melee Attack Roll: +4, reach 5 ft. Hit: 20 (4d8 + 2) Necrotic damage, or 11 (2d8 + 2) Necrotic damage if the swarm is Bloodied. If the target is a Medium or smaller creature, it has the Prone condition."]]]},"Cultist":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"12","pv":"9 (2d8)","desl":"9 m","ini":"+1 (11)","atr":[11,12,10,10,11,10],"info":[["Salvaguardas","Sab +2"],["Perícias","Enganação +2, Religião +2"],["Equipamento","Leather Armor, Sickle"],["Sentidos","Percepção passiva 10"],["Idiomas","Comum"]],"cr":"1/8","secoes":[["Ações",["Foice Ritual. Jogada de Ataque Corpo a Corpo: +3, alcance 1,5 m. Acerto: 3 (1d4 + 1) de dano Cortante mais 1 de dano Necrótico."]]],"secoesEn":[["Ações",["Ritual Sickle. Melee Attack Roll: +3, reach 5 ft. Hit: 3 (1d4 + 1) Slashing damage plus 1 Necrotic damage."]]]},"Cultist Fanatic":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"13","pv":"44 (8d8+8)","desl":"9 m","ini":"+2 (12)","atr":[11,14,12,10,14,13],"info":[["Salvaguardas","Sab +4"],["Perícias","Enganação +3, Persuasão +3, Religião +2"],["Equipamento","Holy Symbol, Leather Armor"],["Sentidos","Percepção passiva 12"],["Idiomas","Comum"]],"cr":"2","secoes":[["Ações",["Lâmina do Pacto. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 6 (1d8 + 2) de dano Cortante mais 7 (2d6) de dano Necrótico.","Conjuração. O cultista conjura uma das magias a seguir, usando Sabedoria como atributo de conjuração (CD de salvaguarda de magia 12, +4 para acertar com ataques de magia): À Vontade: Luz, Taumaturgia. 2/Dia: Comando. 1/Dia: Imobilizar Pessoa."]],["Ações Bônus",["Arma Espiritual (2/Dia). O cultista conjura a magia Arma Espiritual, usando o mesmo atributo de conjuração de Conjuração."]]],"secoesEn":[["Ações",["Pact Blade. Melee Attack Roll: +4, reach 5 ft. Hit: 6 (1d8 + 2) Slashing damage plus 7 (2d6) Necrotic damage.","Spellcasting. The cultist casts one of the following spells, using Wisdom as the spellcasting ability (spell save DC 12, +4 to hit with spell attacks): At Will: Light, Thaumaturgy 2/Day: Command 1/Day: Hold Person"]],["Ações Bônus",["Spiritual Weapon (2/Day). The cultist casts the Spiritual Weapon spell, using the same spellcasting ability as Spellcasting."]]]},"Darkmantle":{"tipo":"Pequeno Aberração, Sem Tendência","ca":"11","pv":"22 (5d6+5)","desl":"3 m, voo 9 m","ini":"+3 (13)","atr":[16,12,13,2,10,5],"info":[["Perícias","Furtividade +3"],["Sentidos","Percepção às Cegas 18 m; Percepção passiva 10"],["Idiomas","Nenhum"]],"cr":"1/2","secoes":[["Ações",["Esmagar. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 6 (1d6 + 3) de dano Contundente, e o manto escuro se prende ao alvo. Se o alvo for uma criatura Média ou menor e o manto escuro teve Vantagem na jogada de ataque, ele cobre o alvo, que fica na condição Cego e está sufocando enquanto o manto escuro estiver preso assim. Enquanto preso a um alvo, o manto escuro só pode atacar esse alvo, mas tem Vantagem nas jogadas de ataque. Seu Deslocamento passa a 0, ele não se beneficia de bônus ao Deslocamento e se move junto com o alvo. Uma criatura pode usar uma ação para tentar soltar o manto escuro de si, conseguindo com um teste de Força (Atletismo) CD 13 bem-sucedido. No seu turno, o manto escuro pode se soltar usando 1,5 m de movimento.","Aura de Escuridão (1/Dia). Escuridão mágica preenche uma Emanação de 4,5 m a partir do manto escuro. O efeito dura enquanto o manto escuro mantiver Concentração nele, até 10 minutos. Visão no Escuro não penetra essa área, e nenhuma luz consegue iluminá-la."]]],"secoesEn":[["Ações",["Crush. Melee Attack Roll: +5, reach 5 ft. Hit: 6 (1d6 + 3) Bludgeoning damage, and the darkmantle attaches to the target. If the target is a Medium or smaller creature and the darkmantle had Advantage on the attack roll, it covers the target, which has the Blinded condition and is suffocating while the darkmantle is attached in this way. While attached to a target, the darkmantle can attack only the target but has Advantage on its attack rolls. Its Speed becomes 0, it can't benefit from any bonus to its Speed, and it moves with the target. A creature can take an action to try to detach the darkmantle from itself, doing so with a successful DC 13 Strength (Athletics) check. On its turn, the darkmantle can detach itself by using 5 feet of movement.","Darkness Aura (1/Day). Magical Darkness fills a 15-foot Emanation originating from the darkmantle. This effect lasts while the darkmantle maintains Concentration on it, up to 10 minutes. Darkvision can't penetrate this area, and no light can illuminate it."]]]},"Death Dog":{"tipo":"Médio Monstruosidade, Neutro e Mau","ca":"12","pv":"39 (6d8+12)","desl":"12 m","ini":"+2 (12)","atr":[15,14,14,3,13,6],"info":[["Perícias","Percepção +5, Furtividade +4"],["Imunidades","Cego, Enfeitiçado, Surdo, Amedrontado, Atordoado, Inconsciente"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 15"],["Idiomas","Nenhum"]],"cr":"1","secoes":[["Ações",["Ataque Múltiplo. O cão da morte faz dois ataques de Mordida.","Mordida. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 4 (1d4 + 2) de dano Perfurante. Se o alvo for uma criatura, ele é submetido ao efeito a seguir. Salvaguarda de Constituição: CD 12. Primeira Falha: O alvo fica na condição Envenenado. Enquanto Envenenado, o máximo de Pontos de Vida do alvo não volta ao normal ao terminar um Descanso Longo, e ele repete a salvaguarda a cada 24 horas que se passarem, encerrando o efeito em si mesmo com um sucesso. Falhas Seguintes: O máximo de Pontos de Vida do alvo Envenenado diminui em 5 (1d10)."]]],"secoesEn":[["Ações",["Multiattack. The death dog makes two Bite attacks.","Bite. Melee Attack Roll: +4, reach 5 ft. Hit: 4 (1d4 + 2) Piercing damage. If the target is a creature, it is subjected to the following effect. Constitution Saving Throw: DC 12. First Failure: The target has the Poisoned condition. While Poisoned, the target's Hit Point maximum doesn't return to normal when finishing a Long Rest, and it repeats the save every 24 hours that elapse, ending the effect on itself on a success. Subsequent Failures: The Poisoned target's Hit Point maximum decreases by 5 (1d10)."]]]},"Deva":{"tipo":"Médio Celestial (Angel), Leal e Bom","ca":"17","pv":"229 (27d8+108)","desl":"9 m, voo 27 m (pairar)","ini":"+4 (14)","atr":[18,18,18,17,20,20],"info":[["Salvaguardas","Sab +9, Car +9"],["Perícias","Intuição +9, Percepção +9"],["Resistências","Radiante"],["Imunidades","Enfeitiçado, Exaustão, Amedrontado"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 19"],["Idiomas","All; telepatia 36 m"]],"cr":"10","secoes":[["Traços",["Restauração Exaltada. Se o deva morrer fora do Monte Celéstia, seu corpo desaparece e ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar do Monte Celéstia.","Resistência à Magia. O deva tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O deva faz dois ataques de Maça Sagrada.","Maça Sagrada. Jogada de Ataque Corpo a Corpo: +8, alcance 1,5 m. Acerto: 7 (1d6 + 4) de dano Contundente mais 18 (4d8) de dano Radiante.","Conjuração. O deva conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 17): À Vontade: Detectar o Bem e o Mal, Mudar de Forma (apenas formas de Fera ou Humanoide, sem ganhar Pontos de Vida Temporários pela magia e sem precisar de Concentração ou Pontos de Vida Temporários para mantê-la). 1/Dia Cada: Comunhão, Reviver os Mortos."]],["Ações Bônus",["Auxílio Divino (2/Dia). O deva conjura Curar Ferimentos, Restauração Menor ou Remover Maldição, usando o mesmo atributo de conjuração de Conjuração."]]],"secoesEn":[["Traços",["Exalted Restoration. If the deva dies outside Mount Celestia, its body disappears, and it gains a new body instantly, reviving with all its Hit Points somewhere in Mount Celestia.","Magic Resistance. The deva has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The deva makes two Holy Mace attacks.","Holy Mace. Melee Attack Roll: +8, reach 5 ft. Hit: 7 (1d6 + 4) Bludgeoning damage plus 18 (4d8) Radiant damage.","Spellcasting. The deva casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 17): At Will: Detect Evil and Good, Shapechange (Beast or Humanoid form only, no Temporary Hit Points gained from the spell, and no Concentration or Temporary Hit Points required to maintain the spell) 1/Day Each: Commune, Raise Dead"]],["Ações Bônus",["Divine Aid (2/Day). The deva casts Cure Wounds, Lesser Restoration, or Remove Curse, using the same spellcasting ability as Spellcasting."]]]},"Djinni":{"tipo":"Grande Elemental (Genie), Neutro","ca":"17","pv":"218 (19d10+114)","desl":"9 m, voo 27 m (pairar)","ini":"+2 (12)","atr":[21,15,22,15,16,20],"info":[["Salvaguardas","Des +6, Sab +7"],["Imunidades","Elétrico, Trovejante"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 13"],["Idiomas","Primordial (Auran)"]],"cr":"11","secoes":[["Traços",["Restauração Elemental. Se o djinni morrer fora do Plano Elemental do Ar, seu corpo se dissolve em névoa e ele ganha um novo corpo em 1d4 dias, revivendo com todos os seus Pontos de Vida em algum lugar do Plano do Ar.","Resistência à Magia. O djinni tem Vantagem em salvaguardas contra magias e outros efeitos mágicos.","Desejos. O djinni tem 30% de chance de conhecer a magia Desejo. Se conhecer, só pode conjurá-la em nome de uma criatura que não seja um gênio e que expresse um desejo de um jeito que o djinni entenda. Se conjurar a magia para a criatura, o djinni não sofre nenhum dos desgastes da magia. Depois de conjurá-la três vezes, o djinni não pode fazê-lo de novo por 365 dias."]],["Ações",["Ataque Múltiplo. O djinni faz três ataques, usando Lâmina da Tempestade ou Raio da Tempestade em qualquer combinação.","Lâmina da Tempestade. Jogada de Ataque Corpo a Corpo: +9, alcance 1,5 m. Acerto: 12 (2d6 + 5) de dano Cortante mais 7 (2d6) de dano Elétrico.","Raio da Tempestade. Jogada de Ataque à Distância: +9, distância 36 m. Acerto: 13 (3d8) de dano Trovejante. Se o alvo for uma criatura Grande ou menor, ele fica na condição Caído.","Criar Redemoinho. O djinni conjura um redemoinho num ponto que consiga ver a até 36 m. O redemoinho preenche um Cilindro de 6 m de raio e 18 m de altura centrado nesse ponto e dura até a Concentração do djinni nele acabar. O djinni pode mover o redemoinho até 6 m no início de cada um de seus turnos. Sempre que o redemoinho entrar no espaço de uma criatura ou uma criatura entrar no redemoinho, ela é submetida ao efeito a seguir. Salvaguarda de Força: CD 17 (uma criatura só faz esta salvaguarda uma vez por turno, e o djinni não é afetado). Falha: Enquanto estiver no redemoinho, o alvo fica na condição Impedido e se move junto com ele. No início de cada um de seus turnos, o alvo Impedido sofre 21 (6d6) de dano Trovejante. No fim de cada um de seus turnos, o alvo repete a salvaguarda, encerrando o efeito em si mesmo com um sucesso.","Conjuração. O djinni conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 17): À Vontade: Detectar o Bem e o Mal, Detectar Magia. 2/Dia Cada: Criar Alimentos e Água (pode criar vinho em vez de água), Idiomas, Caminhar no Vento. 1/Dia Cada: Criação, Forma Gasosa, Invisibilidade, Imagem Maior, Mudança de Plano."]]],"secoesEn":[["Traços",["Elemental Restoration. If the djinni dies outside the Elemental Plane of Air, its body dissolves into mist, and it gains a new body in 1d4 days, reviving with all its Hit Points somewhere on the Plane of Air.","Magic Resistance. The djinni has Advantage on saving throws against spells and other magical effects.","Wishes. The djinni has a 30 percent chance of knowing the Wish spell. If the djinni knows it, the djinni can cast it only on behalf of a non-genie creature who communicates a wish in a way the djinni can understand. If the djinni casts the spell for the creature, the djinni suffers none of the spell's stress. Once the djinni has cast it three times, the djinni can't do so again for 365 days."]],["Ações",["Multiattack. The djinni makes three attacks, using Storm Blade or Storm Bolt in any combination.","Storm Blade. Melee Attack Roll: +9, reach 5 feet. Hit: 12 (2d6 + 5) Slashing damage plus 7 (2d6) Lightning damage.","Storm Bolt. Ranged Attack Roll: +9, range 120 feet. Hit: 13 (3d8) Thunder damage. If the target is a Large or smaller creature, it has the Prone condition.","Create Whirlwind. The djinni conjures a whirlwind at a point it can see within 120 feet. The whirlwind fills a 20-foot-radius, 60-foot-high Cylinder centered on that point. The whirlwind lasts until the djinni's Concentration on it ends. The djinni can move the whirlwind up to 20 feet at the start of each of its turns. Whenever the whirlwind enters a creature's space or a creature enters the whirlwind, that creature is subjected to the following effect. Strength Saving Throw: DC 17 (a creature makes this save only once per turn, and the djinni is unaffected). Failure: While in the whirlwind, the target has the Restrained condition and moves with the whirlwind. At the start of each of its turns, the Restrained target takes 21 (6d6) Thunder damage. At the end of each of its turns, the target repeats the save, ending the effect on itself on a success.","Spellcasting. The djinni casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 17): At Will: Detect Evil and Good, Detect Magic 2/Day Each: Create Food and Water (can create wine instead of water), Tongues, Wind Walk 1/Day Each: Creation, Gaseous Form, Invisibility, Major Image, Plane Shift"]]]},"Doppelganger":{"tipo":"Médio Monstruosidade, Neutro","ca":"14","pv":"52 (8d8+16)","desl":"9 m","ini":"+4 (14)","atr":[11,18,14,11,12,14],"info":[["Perícias","Enganação +6, Intuição +3"],["Imunidades","Enfeitiçado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 11"],["Idiomas","Comum mais three other languages"]],"cr":"3","secoes":[["Ações",["Ataque Múltiplo. O doppelganger faz dois ataques de Pancada e usa Aparência Perturbadora, se disponível.","Pancada. Jogada de Ataque Corpo a Corpo: +6 (com Vantagem durante a primeira rodada de cada combate), alcance 1,5 m. Acerto: 11 (2d6 + 4) de dano Contundente.","Ler Pensamentos. O doppelganger conjura Detectar Pensamentos, sem precisar de componentes de magia e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 12).","Aparência Perturbadora (Recarga 6). Salvaguarda de Sabedoria: CD 12, cada criatura numa Emanação de 4,5 m a partir do doppelganger que consiga vê-lo. Falha: O alvo fica na condição Amedrontado e repete a salvaguarda no fim de cada um de seus turnos, encerrando o efeito em si mesmo com um sucesso. Após 1 minuto, ele é bem-sucedido automaticamente."]],["Ações Bônus",["Mudar de Forma. O doppelganger se transforma num Humanoide Médio ou Pequeno, ou volta à sua forma verdadeira. Suas estatísticas de jogo, exceto o tamanho, são as mesmas em todas as formas. Equipamentos que esteja vestindo ou carregando não se transformam."]]],"secoesEn":[["Ações",["Multiattack. The doppelganger makes two Slam attacks and uses Unsettling Visage if available.","Slam. Melee Attack Roll: +6 (with Advantage during the first round of each combat), reach 5 ft. Hit: 11 (2d6 + 4) Bludgeoning damage.","Read Thoughts. The doppelganger casts Detect Thoughts, requiring no spell components and using Charisma as the spellcasting ability (spell save DC 12).","Unsettling Visage (Recharge 6). Wisdom Saving Throw: DC 12, each creature in a 15-foot Emanation originating from the doppelganger that can see the doppelganger. Failure: The target has the Frightened condition and repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically."]],["Ações Bônus",["Shape-Shift. The doppelganger shape-shifts into a Medium or Small Humanoid, or it returns to its true form. Its game statistics, other than its size, are the same in each form. Any equipment it is wearing or carrying isn't transformed."]]]},"Dragon Turtle":{"tipo":"Imenso Dragão, Neutro","ca":"20","pv":"356 (23d20+115)","desl":"6 m, natação 15 m","ini":"+6 (16)","atr":[25,10,20,10,12,12],"info":[["Salvaguardas","Con +11, Sab +7"],["Resistências","Fogo"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 11"],["Idiomas","Dracônico, Primordial (Aquan)"]],"cr":"17","secoes":[["Traços",["Anfíbio. O dragão consegue respirar ar e água."]],["Ações",["Ataque Múltiplo. O dragão faz três ataques de Mordida. Ele pode substituir um ataque por um ataque de Cauda.","Mordida. Jogada de Ataque Corpo a Corpo: +13, alcance 4,5 m. Acerto: 23 (3d10 + 7) de dano Perfurante mais 7 (2d6) de dano de Fogo. Estar submerso não concede Resistência a este dano de Fogo.","Cauda. Jogada de Ataque Corpo a Corpo: +13, alcance 4,5 m. Acerto: 18 (2d10 + 7) de dano Contundente. Se o alvo for uma criatura Enorme ou menor, ele fica na condição Caído.","Sopro de Vapor (Recarga 5–6). Salvaguarda de Constituição: CD 19, cada criatura num Cone de 18 m. Falha: 56 (16d6) de dano de Fogo. Sucesso: Metade do dano. Falha ou Sucesso: Estar submerso não concede Resistência a este dano de Fogo."]]],"secoesEn":[["Traços",["Amphibious. The dragon can breathe air and water."]],["Ações",["Multiattack. The dragon makes three Bite attacks. It can replace one attack with a Tail attack.","Bite. Melee Attack Roll: +13, reach 15 ft. Hit: 23 (3d10 + 7) Piercing damage plus 7 (2d6) Fire damage. Being underwater doesn't grant Resistance to this Fire damage.","Tail. Melee Attack Roll: +13, reach 15 ft. Hit: 18 (2d10 + 7) Bludgeoning damage. If the target is a Huge or smaller creature, it has the Prone condition.","Steam Breath (Recharge 5-6). Constitution Saving Throw: DC 19, each creature in a 60-foot Cone. Failure: 56 (16d6) Fire damage. Success: Half damage. Failure or Success: Being underwater doesn't grant Resistance to this Fire damage."]]]},"Dretch":{"tipo":"Pequeno Ínfero (Demônio), Caótico e Mau","ca":"11","pv":"18 (4d6+4)","desl":"6 m","ini":"+0 (10)","atr":[12,11,12,5,8,3],"info":[["Resistências","Frio, Fogo, Elétrico"],["Imunidades","Venenoso; Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 9"],["Idiomas","Abissal; telepatia 18 m (works only with creatures that understand Abissal)"]],"cr":"1/4","secoes":[["Ações",["Dilacerar. Jogada de Ataque Corpo a Corpo: +3, alcance 1,5 m. Acerto: 4 (1d6 + 1) de dano Cortante.","Nuvem Fétida (1/Dia). Salvaguarda de Constituição: CD 11, cada criatura numa Emanação de 3 m a partir do dretch. Falha: O alvo fica na condição Envenenado até o fim do seu próximo turno. Enquanto Envenenada, a criatura pode realizar uma ação ou uma Ação Bônus no seu turno, não ambas, e não pode realizar Reações."]]],"secoesEn":[["Ações",["Rend. Melee Attack Roll: +3, reach 5 ft. Hit: 4 (1d6 + 1) Slashing damage.","Fetid Cloud (1/Day). Constitution Saving Throw: DC 11, each creature in a 10-foot Emanation originating from the dretch. Failure: The target has the Poisoned condition until the end of its next turn. While Poisoned, the creature can take either an action or a Bonus Action on its turn, not both, and it can't take Reactions."]]]},"Drider":{"tipo":"Grande Monstruosidade, Caótico e Mau","ca":"19","pv":"123 (13d10+52)","desl":"9 m, escalada 9 m","ini":"+4 (14)","atr":[16,19,18,13,16,12],"info":[["Perícias","Percepção +6, Furtividade +10"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 16"],["Idiomas","Élfico, Subcomum"]],"cr":"6","secoes":[["Traços",["Patas de Aranha. O drider consegue escalar superfícies difíceis, inclusive pelo teto, sem precisar fazer um teste de atributo.","Sensibilidade à Luz Solar. Sob luz do sol, o drider tem Desvantagem em testes de atributo e jogadas de ataque.","Andarilho da Teia. O drider ignora restrições de movimento causadas por teias e sabe a localização de qualquer outra criatura em contato com a mesma teia."]],["Ações",["Ataque Múltiplo. O drider faz três ataques, usando Pata Dianteira ou Jato de Veneno em qualquer combinação.","Pata Dianteira. Jogada de Ataque Corpo a Corpo: +7, alcance 3 m. Acerto: 13 (2d8 + 4) de dano Perfurante.","Jato de Veneno. Jogada de Ataque à Distância: +6, distância 36 m. Acerto: 13 (3d6 + 3) de dano Venenoso."]],["Ações Bônus",["Magia da Rainha Aranha (Recarga 5–6). O drider conjura Escuridão, Fogo das Fadas ou Teia, sem precisar de componentes Materiais e usando Sabedoria como atributo de conjuração (CD de salvaguarda de magia 14)."]]],"secoesEn":[["Traços",["Spider Climb. The drider can climb difficult surfaces, including along ceilings, without needing to make an ability check.","Sunlight Sensitivity. While in sunlight, the drider has Disadvantage on ability checks and attack rolls.","Web Walker. The drider ignores movement restrictions caused by webs, and the drider knows the location of any other creature in contact with the same web."]],["Ações",["Multiattack. The drider makes three attacks, using Foreleg or Poison Burst in any combination.","Foreleg. Melee Attack Roll: +7, reach 10 ft. Hit: 13 (2d8 + 4) Piercing damage.","Poison Burst. Ranged Attack Roll: +6, range 120 ft. Hit: 13 (3d6 + 3) Poison damage."]],["Ações Bônus",["Magic of the Spider Queen (Recharge 5-6). The drider casts Darkness, Faerie Fire, or Web, requiring no Material components and using Wisdom as the spellcasting ability (spell save DC 14)."]]]},"Druid":{"tipo":"Médio ou Pequeno Humanoide (Druid), Neutro","ca":"13","pv":"44 (8d8+8)","desl":"9 m","ini":"+1 (11)","atr":[10,12,13,12,16,11],"info":[["Perícias","Medicina +5, Natureza +3, Percepção +5"],["Equipamento","Studded Leather Armor"],["Sentidos","Percepção passiva 15"],["Idiomas","Comum, Druídico, Silvestre"]],"cr":"2","secoes":[["Ações",["Ataque Múltiplo. O druida faz dois ataques, usando Cajado de Vinhas ou Lume Verdejante em qualquer combinação.","Cajado de Vinhas. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 7 (1d8 + 3) de dano Contundente mais 2 (1d4) de dano Venenoso.","Lume Verdejante. Jogada de Ataque à Distância: +5, distância 27 m. Acerto: 10 (3d6) de dano Radiante.","Conjuração. O druida conjura uma das magias a seguir, usando Sabedoria como atributo de conjuração (CD de salvaguarda de magia 13): À Vontade: Arte Druídica, Falar com Animais. 2/Dia Cada: Constrição, Onda Trovejante. 1/Dia Cada: Mensageiro Animal, Passos Longos, Raio Lunar."]]],"secoesEn":[["Ações",["Multiattack. The druid makes two attacks, using Vine Staff or Verdant Wisp in any combination.","Vine Staff. Melee Attack Roll: +5, reach 5 ft. Hit: 7 (1d8 + 3) Bludgeoning damage plus 2 (1d4) Poison damage.","Verdant Wisp. Ranged Attack Roll: +5, range 90 ft. Hit: 10 (3d6) Radiant damage.","Spellcasting. The druid casts one of the following spells, using Wisdom as the spellcasting ability (spell save DC 13): At Will: Druidcraft, Speak with Animals 2/Day Each: Entangle, Thunderwave 1/Day Each: Animal Messenger, Longstrider, Moonbeam"]]]},"Dryad":{"tipo":"Médio Fada, Neutro","ca":"16","pv":"22 (5d8)","desl":"9 m","ini":"+1 (11)","atr":[10,12,11,14,15,18],"info":[["Perícias","Percepção +4, Furtividade +5"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Élfico, Silvestre"]],"cr":"1","secoes":[["Traços",["Resistência à Magia. A dríade tem Vantagem em salvaguardas contra magias e outros efeitos mágicos.","Falar com Feras e Plantas. A dríade consegue se comunicar com Feras e Plantas como se compartilhassem um idioma."]],["Ações",["Ataque Múltiplo. A dríade faz um ataque de Chicote de Vinha ou Rajada de Espinhos e pode usar Conjuração para conjurar Enfeitiçar Monstro.","Chicote de Vinha. Jogada de Ataque Corpo a Corpo: +6, alcance 3 m. Acerto: 8 (1d8 + 4) de dano Cortante.","Rajada de Espinhos. Jogada de Ataque à Distância: +6, distância 18 m. Acerto: 7 (1d6 + 4) de dano Perfurante.","Conjuração. A dríade conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 14): À Vontade: Amizade Animal, Enfeitiçar Monstro (dura 24 horas; acaba antes se a dríade conjurar a magia de novo), Arte Druídica. 1/Dia Cada: Constrição, Passos sem Pegadas."]],["Ações Bônus",["Passo Arbóreo. Se estiver a até 1,5 m de uma árvore Grande ou maior, a dríade se teletransporta para um espaço desocupado a até 1,5 m de uma segunda árvore Grande ou maior que esteja a até 18 m da primeira."]]],"secoesEn":[["Traços",["Magic Resistance. The dryad has Advantage on saving throws against spells and other magical effects.","Speak with Beasts and Plants. The dryad can communicate with Beasts and Plants as if they shared a language."]],["Ações",["Multiattack. The dryad makes one Vine Lash or Thorn Burst attack, and it can use Spellcasting to cast Charm Monster.","Vine Lash. Melee Attack Roll: +6, reach 10 ft. Hit: 8 (1d8 + 4) Slashing damage.","Thorn Burst. Ranged Attack Roll: +6, range 60 ft. Hit: 7 (1d6 + 4) Piercing damage.","Spellcasting. The dryad casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 14): At Will: Animal Friendship, Charm Monster (lasts 24 hours; ends early if the dryad casts the spell again), Druidcraft 1/Day Each: Entangle, Pass without Trace"]],["Ações Bônus",["Tree Stride. If within 5 feet of a Large or bigger tree, the dryad teleports to an unoccupied space within 5 feet of a second Large or bigger tree that is within 60 feet of the previous tree."]]]},"Earth Elemental":{"tipo":"Grande Elemental, Neutro","ca":"17","pv":"147 (14d10+70)","desl":"9 m, escavação 9 m","ini":"-1 (9)","atr":[20,8,20,5,10,5],"info":[["Vulnerabilidades","Trovejante"],["Imunidades","Venenoso; Exaustão, Paralisado, Petrificado, Envenenado, Inconsciente"],["Sentidos","Visão no Escuro 18 m, Sentido Sísmico 18 m; Percepção passiva 10"],["Idiomas","Primordial (Terran)"]],"cr":"5","secoes":[["Traços",["Deslizar pela Terra. O elemental consegue escavar terra e pedra não mágicas e não trabalhadas. Ao fazer isso, ele não perturba o material por onde passa.","Monstro de Cerco. O elemental causa dano dobrado a objetos e estruturas."]],["Ações",["Ataque Múltiplo. O elemental faz dois ataques, usando Pancada ou Arremesso de Rocha em qualquer combinação.","Pancada. Jogada de Ataque Corpo a Corpo: +8, alcance 3 m. Acerto: 14 (2d8 + 5) de dano Contundente.","Arremesso de Rocha. Jogada de Ataque à Distância: +8, distância 18 m. Acerto: 8 (1d6 + 5) de dano Contundente. Se o alvo for uma criatura Grande ou menor, ele fica na condição Caído."]]],"secoesEn":[["Traços",["Earth Glide. The elemental can burrow through nonmagical, unworked earth and stone. While doing so, the elemental doesn't disturb the material it moves through.","Siege Monster. The elemental deals double damage to objects and structures."]],["Ações",["Multiattack. The elemental makes two attacks, using Slam or Rock Launch in any combination.","Slam. Melee Attack Roll: +8, reach 10 ft. Hit: 14 (2d8 + 5) Bludgeoning damage.","Rock Launch. Ranged Attack Roll: +8, range 60 ft. Hit: 8 (1d6 + 5) Bludgeoning damage. If the target is a Large or smaller creature, it has the Prone condition."]]]},"Efreeti":{"tipo":"Grande Elemental (Genie), Neutro","ca":"17","pv":"212 (17d10+119)","desl":"12 m, voo 18 m (pairar)","ini":"+1 (11)","atr":[22,12,24,16,15,19],"info":[["Salvaguardas","Sab +6, Car +8"],["Imunidades","Fogo"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 12"],["Idiomas","Primordial (Ignan)"]],"cr":"11","secoes":[["Traços",["Restauração Elemental. Se o efreeti morrer fora do Plano Elemental do Fogo, seu corpo se desfaz em cinzas e ele ganha um novo corpo em 1d4 dias, revivendo com todos os seus Pontos de Vida em algum lugar do Plano do Fogo.","Resistência à Magia. O efreeti tem Vantagem em salvaguardas contra magias e outros efeitos mágicos.","Desejos. O efreeti tem 30% de chance de conhecer a magia Desejo. Se conhecer, só pode conjurá-la em nome de uma criatura que não seja um gênio e que expresse um desejo de um jeito que o efreeti entenda. Se conjurar a magia para a criatura, o efreeti não sofre nenhum dos desgastes da magia. Depois de conjurá-la três vezes, o efreeti não pode fazê-lo de novo por 365 dias."]],["Ações",["Ataque Múltiplo. O efreeti faz três ataques, usando Lâmina Incandescente ou Arremessar Chama em qualquer combinação.","Lâmina Incandescente. Jogada de Ataque Corpo a Corpo: +10, alcance 1,5 m. Acerto: 13 (2d6 + 6) de dano Cortante mais 13 (2d12) de dano de Fogo.","Arremessar Chama. Jogada de Ataque à Distância: +8, distância 36 m. Acerto: 24 (7d6) de dano de Fogo.","Conjuração. O efreeti conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 16): À Vontade: Detectar Magia, Elementalismo. 1/Dia Cada: Forma Gasosa, Invisibilidade, Imagem Maior, Mudança de Plano, Idiomas, Muralha de Fogo (versão de 7º círculo)."]]],"secoesEn":[["Traços",["Elemental Restoration. If the efreeti dies outside the Elemental Plane of Fire, its body dissolves into ash, and it gains a new body in 1d4 days, reviving with all its Hit Points somewhere on the Plane of Fire.","Magic Resistance. The efreeti has Advantage on saving throws against spells and other magical effects.","Wishes. The efreeti has a 30 percent chance of knowing the Wish spell. If the efreeti knows it, the efreeti can cast it only on behalf of a non-genie creature who communicates a wish in a way the efreeti can understand. If the efreeti casts the spell for the creature, the efreeti suffers none of the spell's stress. Once the efreeti has cast it three times, the efreeti can't do so again for 365 days."]],["Ações",["Multiattack. The efreeti makes three attacks, using Heated Blade or Hurl Flame in any combination.","Heated Blade. Melee Attack Roll: +10, reach 5 ft. Hit: 13 (2d6 + 6) Slashing damage plus 13 (2d12) Fire damage.","Hurl Flame. Ranged Attack Roll: +8, range 120 ft. Hit: 24 (7d6) Fire damage.","Spellcasting. The efreeti casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 16): At Will: Detect Magic, Elementalism 1/Day Each: Gaseous Form, Invisibility, Major Image, Plane Shift, Tongues, Wall of Fire (level 7 version)"]]]},"Erinyes":{"tipo":"Médio Ínfero (Diabo), Leal e Mau","ca":"18","pv":"178 (21d8+84)","desl":"9 m, voo 18 m","ini":"+7 (17)","atr":[18,16,18,14,14,18],"info":[["Salvaguardas","Des +7, Con +8, Car +8"],["Perícias","Percepção +6, Persuasão +8"],["Resistências","Frio"],["Imunidades","Fogo, Venenoso; Envenenado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 16"],["Idiomas","Infernal; telepatia 36 m"]],"cr":"12","secoes":[["Traços",["Restauração Diabólica. Se a erínia morrer fora dos Nove Infernos, seu corpo desaparece em fumaça sulfurosa e ela ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar dos Nove Infernos.","Resistência à Magia. A erínia tem Vantagem em salvaguardas contra magias e outros efeitos mágicos.","Corda Mágica. A erínia tem uma corda mágica. Enquanto a carrega, ela pode usar a ação Corda Enredante. A corda tem CA 20, 90 PV e Imunidade a dano Venenoso e Psíquico. A corda vira pó se for reduzida a 0 Pontos de Vida, se ficar a 1,5 m ou mais da erínia por 1 hora ou mais, ou se a erínia morrer. Se a corda for danificada ou destruída, a erínia pode restaurá-la totalmente ao terminar um Descanso Curto ou Longo."]],["Ações",["Ataque Múltiplo. A erínia faz três ataques de Espada Definhante e pode usar Corda Enredante.","Espada Definhante. Jogada de Ataque Corpo a Corpo: +8, alcance 1,5 m. Acerto: 13 (2d8 + 4) de dano Cortante mais 11 (2d10) de dano Necrótico.","Corda Enredante (Requer Corda Mágica). Salvaguarda de Força: CD 16, uma criatura que a erínia consiga ver a até 36 m. Falha: 14 (4d6) de dano de Energia, e o alvo fica na condição Impedido até a corda ser destruída, a erínia usar uma Ação Bônus para soltá-lo ou usar Corda Enredante de novo."]],["Reações",["Aparar. Gatilho: A erínia é atingida por uma jogada de ataque corpo a corpo enquanto empunha uma arma. Resposta: A erínia soma 4 à sua CA contra esse ataque, possivelmente fazendo-o errar."]]],"secoesEn":[["Traços",["Diabolical Restoration. If the erinyes dies outside the Nine Hells, its body disappears in sulfurous smoke, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.","Magic Resistance. The erinyes has Advantage on saving throws against spells and other magical effects.","Magic Rope. The erinyes has a magic rope. While bearing it, the erinyes can use the Entangling Rope action. The rope has AC 20, HP 90, and Immunity to Poison and Psychic damage. The rope turns to dust if reduced to 0 Hit Points, if it is 5+ feet away from the erinyes for 1 hour or more, or if the erinyes dies. If the rope is damaged or destroyed, the erinyes can fully restore it when finishing a Short or Long Rest."]],["Ações",["Multiattack. The erinyes makes three Withering Sword attacks and can use Entangling Rope.","Withering Sword. Melee Attack Roll: +8, reach 5 ft. Hit: 13 (2d8 + 4) Slashing damage plus 11 (2d10) Necrotic damage.","Entangling Rope (Requires Magic Rope). Strength Saving Throw: DC 16, one creature the erinyes can see within 120 feet. Failure: 14 (4d6) Force damage, and the target has the Restrained condition until the rope is destroyed, the erinyes uses a Bonus Action to release the target, or the erinyes uses Entangling Rope again."]],["Reações",["Parry. Trigger: The erinyes is hit by a melee attack roll while holding a weapon. Response: The erinyes adds 4 to its AC against that attack, possibly causing it to miss."]]]},"Ettercap":{"tipo":"Médio Monstruosidade, Neutro e Mau","ca":"13","pv":"44 (8d8+8)","desl":"9 m, escalada 9 m","ini":"+2 (12)","atr":[14,15,13,7,12,8],"info":[["Perícias","Percepção +3, Furtividade +4, Sobrevivência +3"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 13"],["Idiomas","Nenhum"]],"cr":"2","secoes":[["Traços",["Patas de Aranha. O ettercap consegue escalar superfícies difíceis, inclusive pelo teto, sem precisar fazer um teste de atributo.","Andarilho da Teia. O ettercap ignora restrições de movimento causadas por teias e sabe a localização de qualquer outra criatura em contato com a mesma teia."]],["Ações",["Ataque Múltiplo. O ettercap faz um ataque de Mordida e um ataque de Garra.","Mordida. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 5 (1d6 + 2) de dano Perfurante mais 2 (1d4) de dano Venenoso, e o alvo fica na condição Envenenado até o início do próximo turno do ettercap.","Garra. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 7 (2d4 + 2) de dano Cortante.","Fio de Teia (Recarga 5–6). Salvaguarda de Destreza: CD 12, uma criatura Grande ou menor que o ettercap consiga ver a até 9 m. Falha: O alvo fica na condição Impedido até a teia ser destruída (CA 10; PV 5; Vulnerabilidade a dano de Fogo; Imunidade a dano Contundente, Venenoso e Psíquico)."]],["Ações Bônus",["Puxar. O ettercap puxa uma criatura a até 9 m que esteja Impedida pelo seu Fio de Teia até 7,5 m em linha reta na sua direção."]]],"secoesEn":[["Traços",["Spider Climb. The ettercap can climb difficult surfaces, including along ceilings, without needing to make an ability check.","Web Walker. The ettercap ignores movement restrictions caused by webs, and the ettercap knows the location of any other creature in contact with the same web."]],["Ações",["Multiattack. The ettercap makes one Bite attack and one Claw attack.","Bite. Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Piercing damage plus 2 (1d4) Poison damage, and the target has the Poisoned condition until the start of the ettercap's next turn.","Claw. Melee Attack Roll: +4, reach 5 ft. Hit: 7 (2d4 + 2) Slashing damage.","Web Strand (Recharge 5-6). Dexterity Saving Throw: DC 12, one Large or smaller creature the ettercap can see within 30 feet. Failure: The target has the Restrained condition until the web is destroyed (AC 10; HP 5; Vulnerability to Fire damage; Immunity to Bludgeoning, Poison, and Psychic damage)."]],["Ações Bônus",["Reel. The ettercap pulls one creature within 30 feet of itself that is Restrained by its Web Strand up to 25 feet straight toward itself."]]]},"Ettin":{"tipo":"Grande Gigante, Caótico e Mau","ca":"12","pv":"85 (10d10+30)","desl":"12 m","ini":"-1 (9)","atr":[21,8,17,6,10,8],"info":[["Perícias","Percepção +4"],["Imunidades","Cego, Enfeitiçado, Surdo, Amedrontado, Atordoado, Inconsciente"],["Equipamento","Battleaxe, Morningstar"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Gigante"]],"cr":"4","secoes":[["Ações",["Ataque Múltiplo. O ettin faz um ataque de Machado de Batalha e um ataque de Maça Estrela.","Machado de Batalha. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 14 (2d8 + 5) de dano Cortante. Se o alvo for uma criatura Grande ou menor, ele fica na condição Caído.","Maça Estrela. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 14 (2d8 + 5) de dano Perfurante, e o alvo tem Desvantagem na próxima jogada de ataque que fizer antes do fim do seu próximo turno."]]],"secoesEn":[["Ações",["Multiattack. The ettin makes one Battleaxe attack and one Morningstar attack.","Battleaxe. Melee Attack Roll: +7, reach 5 ft. Hit: 14 (2d8 + 5) Slashing damage. If the target is a Large or smaller creature, it has the Prone condition.","Morningstar. Melee Attack Roll: +7, reach 5 ft. Hit: 14 (2d8 + 5) Piercing damage, and the target has Disadvantage on the next attack roll it makes before the end of its next turn."]]]},"Fire Elemental":{"tipo":"Grande Elemental, Neutro","ca":"13","pv":"93 (11d10+33)","desl":"15 m","ini":"+3 (13)","atr":[10,17,16,6,10,7],"info":[["Resistências","Contundente, Perfurante, Cortante"],["Imunidades","Fogo, Venenoso; Exaustão, Agarrado, Paralisado, Petrificado, Envenenado, Caído, Impedido, Inconsciente"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Primordial (Ignan)"]],"cr":"5","secoes":[["Traços",["Aura de Fogo. No fim de cada turno do elemental, cada criatura numa Emanação de 3 m a partir do elemental sofre 5 (1d10) de dano de Fogo. Criaturas e objetos inflamáveis na Emanação começam a queimar.","Forma de Fogo. O elemental pode passar por um espaço de apenas 2,5 cm de largura sem gastar movimento extra e pode entrar no espaço de uma criatura e parar ali. Na primeira vez que entrar no espaço de uma criatura num turno, ela sofre 5 (1d10) de dano de Fogo.","Iluminação. O elemental emite Luz Plena num raio de 9 m e Penumbra por mais 9 m.","Vulnerável à Água. O elemental sofre 3 (1d6) de dano de Frio a cada 1,5 m que se mover na água ou a cada 4 litros de água jogados nele."]],["Ações",["Ataque Múltiplo. O elemental faz dois ataques de Queimar.","Queimar. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 10 (2d6 + 3) de dano de Fogo. Se o alvo for uma criatura ou um objeto inflamável, ele começa a queimar."]]],"secoesEn":[["Traços",["Fire Aura. At the end of each of the elemental's turns, each creature in a 10-foot Emanation originating from the elemental takes 5 (1d10) Fire damage. Creatures and flammable objects in the Emanation start burning.","Fire Form. The elemental can move through a space as narrow as 1 inch without expending extra movement to do so, and it can enter a creature's space and stop there. The first time it enters a creature's space on a turn, that creature takes 5 (1d10) Fire damage.","Illumination. The elemental sheds Bright Light in a 30foot radius and Dim Light for an additional 30 feet.","Water Susceptibility. The elemental takes 3 (1d6) Cold damage for every 5 feet the elemental moves in water or for every gallon of water splashed on it."]],["Ações",["Multiattack. The elemental makes two Burn attacks.","Burn. Melee Attack Roll: +6, reach 5 ft. Hit: 10 (2d6 + 3) Fire damage. If the target is a creature or a flammable object, it starts burning."]]]},"Fire Giant":{"tipo":"Enorme Gigante, Leal e Mau","ca":"18","pv":"162 (13d12+78)","desl":"9 m","ini":"+3 (13)","atr":[25,9,23,10,14,13],"info":[["Salvaguardas","Des +3, Con +10, Car +5"],["Perícias","Atletismo +11, Percepção +6"],["Imunidades","Fogo"],["Sentidos","Percepção passiva 16"],["Idiomas","Gigante"]],"cr":"9","secoes":[["Ações",["Ataque Múltiplo. O gigante faz dois ataques, usando Espada Flamejante ou Arremesso de Martelo em qualquer combinação.","Espada Flamejante. Jogada de Ataque Corpo a Corpo: +11, alcance 3 m. Acerto: 21 (4d6 + 7) de dano Cortante mais 10 (3d6) de dano de Fogo.","Arremesso de Martelo. Jogada de Ataque à Distância: +11, distância 18/72 m. Acerto: 23 (3d10 + 7) de dano Contundente mais 4 (1d8) de dano de Fogo, e o alvo é empurrado até 4,5 m em linha reta para longe do gigante e tem Desvantagem na próxima jogada de ataque que fizer antes do fim do seu próximo turno."]]],"secoesEn":[["Ações",["Multiattack. The giant makes two attacks, using Flame Sword or Hammer Throw in any combination.","Flame Sword. Melee Attack Roll: +11, reach 10 ft. Hit: 21 (4d6 + 7) Slashing damage plus 10 (3d6) Fire damage.","Hammer Throw. Ranged Attack Roll: +11, range 60/240 ft. Hit: 23 (3d10 + 7) Bludgeoning damage plus 4 (1d8) Fire damage, and the target is pushed up to 15 feet straight away from the giant and has Disadvantage on the next attack roll it makes before the end of its next turn."]]]},"Flesh Golem":{"tipo":"Médio Constructo, Neutro","ca":"9","pv":"127 (15d8+60)","desl":"9 m","ini":"-1 (9)","atr":[19,9,18,6,10,5],"info":[["Imunidades","Elétrico, Venenoso; Enfeitiçado, Exaustão, Amedrontado, Paralisado, Petrificado, Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Understands Comum mais one other language mas não fala"]],"cr":"5","secoes":[["Traços",["Aversão ao Fogo. Se o golem sofrer dano de Fogo, ele tem Desvantagem em jogadas de ataque e testes de atributo até o fim do seu próximo turno.","Fúria Cega. Sempre que o golem começar o turno Sangrando, role 1d6. Com 6, o golem entra em fúria. Em cada turno enquanto estiver em fúria, o golem ataca a criatura mais próxima que consiga ver. Se nenhuma criatura estiver perto o bastante para ele se mover e atacar, o golem ataca um objeto. Depois de entrar em fúria, o golem continua assim até ser destruído ou deixar de estar Sangrando. O criador do golem, se estiver a até 18 m dele, pode tentar acalmá-lo usando uma ação para fazer um teste de Carisma (Persuasão) CD 15; o golem precisa conseguir ouvir o criador. Se o teste for bem-sucedido, o golem deixa a fúria até o início do seu próximo turno, quando volta a rolar para o traço Fúria Cega se ainda estiver Sangrando.","Forma Imutável. O golem não pode mudar de forma.","Absorção Elétrica. Sempre que o golem for submetido a dano Elétrico, ele recupera Pontos de Vida iguais ao dano Elétrico causado.","Resistência à Magia. O golem tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O golem faz dois ataques de Pancada.","Pancada. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 13 (2d8 + 4) de dano Contundente mais 4 (1d8) de dano Elétrico."]]],"secoesEn":[["Traços",["Aversion to Fire. If the golem takes Fire damage, it has Disadvantage on attack rolls and ability checks until the end of its next turn.","Berserk. Whenever the golem starts its turn Bloodied, roll 1d6. On a 6, the golem goes berserk. On each of its turns while berserk, the golem attacks the nearest creature it can see. If no creature is near enough to move to and attack, the golem attacks an object. Once the golem goes berserk, it remains so until it is destroyed or it is no longer Bloodied. The golem's creator, if within 60 feet of the berserk golem, can try to calm it by taking an action to make a DC 15 Charisma (Persuasion) check; the golem must be able to hear its creator. If this check succeeds, the golem ceases being berserk until the start of its next turn, at which point it resumes rolling for the Berserk trait again if it is still Bloodied.","Immutable Form. The golem can't shape-shift.","Lightning Absorption. Whenever the golem is subjected to Lightning damage, it regains a number of Hit Points equal to the Lightning damage dealt.","Magic Resistance. The golem has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The golem makes two Slam attacks.","Slam. Melee Attack Roll: +7, reach 5 ft. Hit: 13 (2d8 + 4) Bludgeoning damage plus 4 (1d8) Lightning damage."]]]},"Frost Giant":{"tipo":"Enorme Gigante, Neutro e Mau","ca":"15","pv":"149 (13d12+65)","desl":"12 m","ini":"+2 (12)","atr":[23,9,21,9,10,12],"info":[["Salvaguardas","Con +8, Sab +3, Car +4"],["Perícias","Atletismo +9, Percepção +3"],["Imunidades","Frio"],["Sentidos","Percepção passiva 13"],["Idiomas","Gigante"]],"cr":"8","secoes":[["Ações",["Ataque Múltiplo. O gigante faz dois ataques, usando Machado Gélido ou Grande Arco em qualquer combinação.","Machado Gélido. Jogada de Ataque Corpo a Corpo: +9, alcance 3 m. Acerto: 19 (2d12 + 6) de dano Cortante mais 9 (2d8) de dano de Frio.","Grande Arco. Jogada de Ataque à Distância: +9, distância 45/180 m. Acerto: 17 (2d10 + 6) de dano Perfurante mais 7 (2d6) de dano de Frio, e o Deslocamento do alvo diminui em 3 m até o fim do seu próximo turno."]],["Ações Bônus",["Grito de Guerra (Recarga 5–6). O gigante ou uma criatura à escolha dele que consiga vê-lo ou ouvi-lo ganha 16 (2d10 + 5) Pontos de Vida Temporários e tem Vantagem em jogadas de ataque até o início do próximo turno do gigante."]]],"secoesEn":[["Ações",["Multiattack. The giant makes two attacks, using Frost Axe or Great Bow in any combination.","Frost Axe. Melee Attack Roll: +9, reach 10 ft. Hit: 19 (2d12 + 6) Slashing damage plus 9 (2d8) Cold damage.","Great Bow. Ranged Attack Roll: +9, range 150/600 ft. Hit: 17 (2d10 + 6) Piercing damage plus 7 (2d6) Cold damage, and the target's Speed decreases by 10 feet until the end of its next turn."]],["Ações Bônus",["War Cry (Recharge 5-6). The giant or one creature of its choice that can see or hear it gains 16 (2d10 + 5) Temporary Hit Points and has Advantage on attack rolls until the start of the giant's next turn."]]]},"Shrieker Fungus":{"tipo":"Médio Planta, Sem Tendência","ca":"5","pv":"13 (3d8)","desl":"1,5 m","ini":"-5 (5)","atr":[1,1,10,1,3,1],"info":[["Imunidades","Cego, Enfeitiçado, Surdo, Amedrontado"],["Sentidos","Percepção às Cegas 9 m; Percepção passiva 6"],["Idiomas","Nenhum"]],"cr":"0","secoes":[["Reações",["Guincho. Gatilho: Uma criatura ou uma fonte de Luz Plena se move a até 9 m do fungo. Resposta: O fungo emite um guincho audível a até 90 m de distância por 1 minuto ou até morrer."]]],"secoesEn":[["Reações",["Shriek. Trigger: A creature or a source of Bright Light moves within 30 feet of the shrieker. Response: The shrieker emits a shriek audible within 300 feet of itself for 1 minute or until the shrieker dies."]]]},"Violet Fungus":{"tipo":"Médio Planta, Sem Tendência","ca":"5","pv":"18 (4d8)","desl":"1,5 m","ini":"-5 (5)","atr":[3,1,10,1,3,1],"info":[["Imunidades","Cego, Enfeitiçado, Surdo, Amedrontado"],["Sentidos","Percepção às Cegas 9 m; Percepção passiva 6"],["Idiomas","Nenhum"]],"cr":"1/4","secoes":[["Ações",["Ataque Múltiplo. O fungo faz dois ataques de Toque Apodrecedor.","Toque Apodrecedor. Jogada de Ataque Corpo a Corpo: +2, alcance 3 m. Acerto: 4 (1d8) de dano Necrótico."]]],"secoesEn":[["Ações",["Multiattack. The fungus makes two Rotting Touch attacks.","Rotting Touch. Melee Attack Roll: +2, reach 10 ft. Hit: 4 (1d8) Necrotic damage."]]]},"Gargoyle":{"tipo":"Médio Elemental, Caótico e Mau","ca":"15","pv":"67 (9d8+27)","desl":"9 m, voo 18 m","ini":"+2 (12)","atr":[15,11,16,6,11,7],"info":[["Perícias","Furtividade +4"],["Imunidades","Venenoso; Exaustão, Petrificado, Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Primordial (Terran)"]],"cr":"2","secoes":[["Traços",["Sobrevoo. A gárgula não provoca Ataque de Oportunidade quando voa para fora do alcance de um inimigo."]],["Ações",["Ataque Múltiplo. A gárgula faz dois ataques de Garra.","Garra. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 7 (2d4 + 2) de dano Cortante."]]],"secoesEn":[["Traços",["Flyby. The gargoyle doesn't provoke an Opportunity Attack when it flies out of an enemy's reach."]],["Ações",["Multiattack. The gargoyle makes two Claw attacks.","Claw. Melee Attack Roll: +4, reach 5 ft. Hit: 7 (2d4 + 2) Slashing damage."]]]},"Gelatinous Cube":{"tipo":"Grande Gosma, Sem Tendência","ca":"6","pv":"63 (6d10+30)","desl":"4,5 m","ini":"-4 (6)","atr":[14,3,20,1,6,1],"info":[["Imunidades","Ácido; Cego, Enfeitiçado, Surdo, Exaustão, Amedrontado, Caído"],["Sentidos","Percepção às Cegas 18 m; Percepção passiva 8"],["Idiomas","Nenhum"]],"cr":"2","secoes":[["Traços",["Cubo de Gosma. O cubo preenche todo o seu espaço e é transparente. Outras criaturas podem entrar nesse espaço, mas quem faz isso é submetido ao Engolfar do cubo e tem Desvantagem na salvaguarda. Criaturas dentro do cubo têm Cobertura Total, e o cubo pode conter uma criatura Grande ou até quatro criaturas Médias ou Pequenas ao mesmo tempo. Com uma ação, uma criatura a até 1,5 m do cubo pode puxar uma criatura ou objeto para fora dele com um teste de Força (Atletismo) CD 12 bem-sucedido, e quem puxa sofre 10 (3d6) de dano Ácido.","Transparente. Mesmo com o cubo à vista, uma criatura precisa ser bem-sucedida num teste de Sabedoria (Percepção) CD 15 para notá-lo, se não o viu se mover ou agir de outra forma."]],["Ações",["Pseudópode. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 12 (3d6 + 2) de dano Ácido.","Engolfar. O cubo se move até o seu Deslocamento sem provocar Ataques de Oportunidade. Ele pode atravessar o espaço de criaturas Grandes ou menores se tiver lugar dentro de si para contê-las (veja o traço Cubo de Gosma). Salvaguarda de Destreza: CD 12, cada criatura em cujo espaço o cubo entrar pela primeira vez durante esse movimento. Falha: 10 (3d6) de dano Ácido, e o alvo é engolfado. Um alvo engolfado está sufocando, não pode conjurar magias com componente Verbal, fica na condição Impedido e sofre 10 (3d6) de dano Ácido no início de cada turno do cubo. Quando o cubo se move, o alvo engolfado se move junto. Um alvo engolfado pode tentar escapar usando uma ação para fazer um teste de Força (Atletismo) CD 12. Com sucesso, o alvo escapa e entra no espaço desocupado mais próximo. Sucesso: Metade do dano, e o alvo se move para um espaço desocupado a até 1,5 m do cubo. Se não houver espaço desocupado, o alvo falha na salvaguarda."]]],"secoesEn":[["Traços",["Ooze Cube. The cube fills its entire space and is transparent. Other creatures can enter that space, but a creature that does so is subjected to the cube's Engulf and has Disadvantage on the saving throw. Creatures inside the cube have Total Cover, and the cube can hold one Large creature or up to four Medium or Small creatures inside itself at a time. As an action, a creature within 5 feet of the cube can pull a creature or an object out of the cube by succeeding on a DC 12 Strength (Athletics) check, and the puller takes 10 (3d6) Acid damage.","Transparent. Even when the cube is in plain sight, a creature must succeed on a DC 15 Wisdom (Perception) check to notice the cube if the creature hasn't witnessed the cube move or otherwise act."]],["Ações",["Pseudopod. Melee Attack Roll: +4, reach 5 ft. Hit: 12 (3d6 + 2) Acid damage.","Engulf. The cube moves up to its Speed without provoking Opportunity Attacks. The cube can move through the spaces of Large or smaller creatures if it has room inside itself to contain them (see the Ooze Cube trait). Dexterity Saving Throw: DC 12, each creature whose space the cube enters for the first time during this move. Failure: 10 (3d6) Acid damage, and the target is engulfed. An engulfed target is suffocating, can't cast spells with a Verbal component, has the Restrained condition, and takes 10 (3d6) Acid damage at the start of each of the cube's turns. When the cube moves, the engulfed target moves with it. An engulfed target can try to escape by taking an action to make a DC 12 Strength (Athletics) check. On a successful check, the target escapes and enters the nearest unoccupied space. Success: Half damage, and the target moves to an unoccupied space within 5 feet of the cube. If there is no unoccupied space, the target fails the save instead."]]]},"Ghast":{"tipo":"Médio Morto-Vivo, Caótico e Mau","ca":"13","pv":"36 (8d8)","desl":"9 m","ini":"+3 (13)","atr":[16,17,10,11,10,8],"info":[["Salvaguardas","Sab +2"],["Resistências","Necrótico"],["Imunidades","Venenoso; Enfeitiçado, Exaustão, Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Comum"]],"cr":"2","secoes":[["Traços",["Fedor. Salvaguarda de Constituição: CD 10, qualquer criatura que comece o turno numa Emanação de 1,5 m a partir do lívido. Falha: O alvo fica na condição Envenenado até o início do seu próximo turno. Sucesso: O alvo fica imune ao Fedor deste lívido por 24 horas."]],["Ações",["Mordida. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 7 (1d8 + 3) de dano Perfurante mais 9 (2d8) de dano Necrótico.","Garra. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 10 (2d6 + 3) de dano Cortante. Se o alvo for uma criatura que não seja Morto-Vivo, ele é submetido ao efeito a seguir. Salvaguarda de Constituição: CD 10. Falha: O alvo fica na condição Paralisado até o fim do seu próximo turno."]]],"secoesEn":[["Traços",["Stench. Constitution Saving Throw: DC 10, any creature that starts its turn in a 5-foot Emanation originating from the ghast. Failure: The target has the Poisoned condition until the start of its next turn. Success: The target is immune to this ghast's Stench for 24 hours."]],["Ações",["Bite. Melee Attack Roll: +5, reach 5 ft. Hit: 7 (1d8 + 3) Piercing damage plus 9 (2d8) Necrotic damage.","Claw. Melee Attack Roll: +5, reach 5 ft. Hit: 10 (2d6 + 3) Slashing damage. If the target is a non-Undead creature, it is subjected to the following effect. Constitution Saving Throw: DC 10. Failure: The target has the Paralyzed condition until the end of its next turn."]]]},"Ghost":{"tipo":"Médio Morto-Vivo, Neutro","ca":"11","pv":"45 (10d8)","desl":"1,5 m, voo 12 m (pairar)","ini":"+1 (11)","atr":[7,13,10,10,12,17],"info":[["Resistências","Ácido, Contundente, Frio, Fogo, Elétrico, Perfurante, Cortante, Trovejante"],["Imunidades","Necrótico, Venenoso; Enfeitiçado, Exaustão, Amedrontado, Agarrado, Paralisado, Petrificado, Envenenado, Caído, Impedido"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 11"],["Idiomas","Comum mais one other language"]],"cr":"4","secoes":[["Traços",["Visão Etérea. O fantasma consegue enxergar 18 m dentro do Plano Etéreo quando está no Plano Material.","Movimento Incorpóreo. O fantasma pode atravessar outras criaturas e objetos como se fossem Terreno Difícil. Ele sofre 5 (1d10) de dano de Energia se terminar o turno dentro de um objeto."]],["Ações",["Ataque Múltiplo. O fantasma faz dois ataques de Toque Definhante.","Toque Definhante. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 19 (3d10 + 3) de dano Necrótico.","Etereidade. O fantasma conjura a magia Forma Etérea, sem precisar de componentes de magia e usando Carisma como atributo de conjuração. O fantasma fica visível no Plano Material enquanto está na Fronteira Etérea e vice-versa, mas não pode afetar nem ser afetado por nada no outro plano.","Aparência Horripilante. Salvaguarda de Sabedoria: CD 13, cada criatura num Cone de 18 m que consiga ver o fantasma e não seja Morto-Vivo. Falha: 10 (2d6 + 3) de dano Psíquico, e o alvo fica na condição Amedrontado até o início do próximo turno do fantasma. Sucesso: O alvo fica imune à Aparência Horripilante deste fantasma por 24 horas.","Possessão (Recarga 6). Salvaguarda de Carisma: CD 13, um Humanoide que o fantasma consiga ver a até 1,5 m. Falha: O alvo é possuído pelo fantasma; o fantasma desaparece e o alvo fica na condição Incapacitado e perde o controle do corpo. O fantasma passa a controlar o corpo, mas o alvo continua consciente. O fantasma não pode ser alvo de nenhum ataque, magia ou outro efeito, exceto os que afetam especificamente Mortos-Vivos. As estatísticas do fantasma continuam as mesmas, exceto que ele usa o Deslocamento do alvo possuído, assim como os modificadores de Força, Destreza e Constituição do alvo. A possessão dura até o corpo cair a 0 Pontos de Vida ou o fantasma sair como Ação Bônus. Quando a possessão acaba, o fantasma aparece num espaço desocupado a até 1,5 m do alvo, e o alvo fica imune à Possessão deste fantasma por 24 horas. Sucesso: O alvo fica imune à Possessão deste fantasma por 24 horas."]]],"secoesEn":[["Traços",["Ethereal Sight. The ghost can see 60 feet into the Ethereal Plane when it is on the Material Plane.","Incorporeal Movement. The ghost can move through other creatures and objects as if they were Difficult Terrain. It takes 5 (1d10) Force damage if it ends its turn inside an object."]],["Ações",["Multiattack. The ghost makes two Withering Touch attacks.","Withering Touch. Melee Attack Roll: +5, reach 5 ft. Hit: 19 (3d10 + 3) Necrotic damage.","Etherealness. The ghost casts the Etherealness spell, requiring no spell components and using Charisma as the spellcasting ability. The ghost is visible on the Material Plane while on the Border Ethereal and vice versa, but it can't affect or be affected by anything on the other plane.","Horrific Visage. Wisdom Saving Throw: DC 13, each creature in a 60-foot Cone that can see the ghost and isn't an Undead. Failure: 10 (2d6 + 3) Psychic damage, and the target has the Frightened condition until the start of the ghost's next turn. Success: The target is immune to this ghost's Horrific Visage for 24 hours.","Possession (Recharge 6). Charisma Saving Throw: DC 13, one Humanoid the ghost can see within 5 feet. Failure: The target is possessed by the ghost; the ghost disappears, and the target has the Incapacitated condition and loses control of its body. The ghost now controls the body, but the target retains awareness. The ghost can't be targeted by any attack, spell, or other effect, except ones that specifically target Undead. The ghost's game statistics are the same, except it uses the possessed target's Speed, as well as the target's Strength, Dexterity, and Constitution modifiers. The possession lasts until the body drops to 0 Hit Points or the ghost leaves as a Bonus Action. When the possession ends, the ghost appears in an unoccupied space within 5 feet of the target, and the target is immune to this ghost's Possession for 24 hours. Success: The target is immune to this ghost's Possession for 24 hours."]]]},"Ghoul":{"tipo":"Médio Morto-Vivo, Caótico e Mau","ca":"12","pv":"22 (5d8)","desl":"9 m","ini":"+2 (12)","atr":[13,15,10,7,10,6],"info":[["Imunidades","Venenoso; Enfeitiçado, Exaustão, Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Comum"]],"cr":"1","secoes":[["Ações",["Ataque Múltiplo. O carniçal faz dois ataques de Mordida.","Mordida. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 5 (1d6 + 2) de dano Perfurante mais 3 (1d6) de dano Necrótico.","Garra. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 4 (1d4 + 2) de dano Cortante. Se o alvo for uma criatura que não seja Morto-Vivo nem elfo, ele é submetido ao efeito a seguir. Salvaguarda de Constituição: CD 10. Falha: O alvo fica na condição Paralisado até o fim do seu próximo turno."]]],"secoesEn":[["Ações",["Multiattack. The ghoul makes two Bite attacks.","Bite. Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Piercing damage plus 3 (1d6) Necrotic damage.","Claw. Melee Attack Roll: +4, reach 5 ft. Hit: 4 (1d4 + 2) Slashing damage. If the target is a creature that isn't an Undead or elf, it is subjected to the following effect. Constitution Saving Throw: DC 10. Failure: The target has the Paralyzed condition until the end of its next turn."]]]},"Gibbering Mouther":{"tipo":"Médio Aberração, Caótico e Neutro","ca":"9","pv":"52 (7d8+21)","desl":"6 m, natação 6 m","ini":"-1 (9)","atr":[10,8,16,3,10,6],"info":[["Imunidades","Caído"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Nenhum"]],"cr":"2","secoes":[["Traços",["Solo Aberrante. O chão numa Emanação de 3 m a partir da bocarra é Terreno Difícil.","Balbucio. A bocarra balbucia de forma incoerente enquanto não estiver na condição Incapacitado. Salvaguarda de Sabedoria: CD 10, qualquer criatura que comece o turno a até 6 m da bocarra enquanto ela balbucia. Falha: O alvo rola 1d8 para determinar o que faz durante o turno atual:","1–4. O alvo não faz nada. 5–6. O alvo não realiza ação nem Ação Bônus e usa todo o seu movimento para se mover numa direção aleatória. 7–8. O alvo faz um ataque corpo a corpo contra uma criatura determinada aleatoriamente ao seu alcance, ou não faz nada se não puder fazer esse ataque."]],["Ações",["Mordida. Jogada de Ataque Corpo a Corpo: +2, alcance 1,5 m. Acerto: 7 (2d6) de dano Perfurante. Se o alvo for uma criatura Média ou menor, ele fica na condição Caído. O alvo morre se for reduzido a 0 Pontos de Vida por este ataque. Seu corpo é então absorvido pela bocarra, deixando apenas o equipamento para trás.","Cuspe Cegante (Recarga 5–6). Salvaguarda de Destreza: CD 10, cada criatura numa Esfera de 3 m de raio centrada num ponto a até 9 m. Falha: 7 (2d6) de dano Radiante, e o alvo fica na condição Cego até o fim do próximo turno da bocarra."]]],"secoesEn":[["Traços",["Aberrant Ground. The ground in a 10-foot Emanation originating from the mouther is Difficult Terrain.","Gibbering. The mouther babbles incoherently while it doesn't have the Incapacitated condition. Wisdom Saving Throw: DC 10, any creature that starts its turn within 20 feet of the mouther while it is babbling. Failure: The target rolls 1d8 to determine what it does during the current turn:","1-4. The target does nothing. 5-6. The target takes no action or Bonus Action and uses all its movement to move in a random direction. 7-8. The target makes a melee attack against a randomly determined creature within its reach or does nothing if it can't make such an attack."]],["Ações",["Bite. Melee Attack Roll: +2, reach 5 ft. Hit: 7 (2d6) Piercing damage. If the target is a Medium or smaller creature, it has the Prone condition. The target dies if it is reduced to 0 Hit Points by this attack. Its body is then absorbed into the mouther, leaving only equipment behind.","Blinding Spittle (Recharge 5-6). Dexterity Saving Throw: DC 10, each creature in a 10-foot-radius Sphere centered on a point within 30 feet. Failure: 7 (2d6) Radiant damage, and the target has the Blinded condition until the end of the mouther's next turn."]]]},"Glabrezu":{"tipo":"Grande Ínfero (Demônio), Caótico e Mau","ca":"17","pv":"189 (18d10+90)","desl":"12 m","ini":"+6 (16)","atr":[20,15,21,19,17,16],"info":[["Salvaguardas","For +9, Con +9, Sab +7, Car +7"],["Perícias","Enganação +7, Percepção +7"],["Resistências","Frio, Fogo, Elétrico"],["Imunidades","Venenoso; Envenenado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 17"],["Idiomas","Abissal; telepatia 36 m"]],"cr":"9","secoes":[["Traços",["Restauração Demoníaca. Se o glabrezu morrer fora do Abismo, seu corpo se dissolve em icor e ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar do Abismo.","Resistência à Magia. O glabrezu tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O glabrezu faz dois ataques de Pinça e usa Esmurrar ou Conjuração.","Pinça. Jogada de Ataque Corpo a Corpo: +9, alcance 3 m. Acerto: 16 (2d10 + 5) de dano Cortante. Se o alvo for uma criatura Média ou menor, ele fica na condição Agarrado (CD 15 para escapar) por uma de duas pinças.","Esmurrar. Salvaguarda de Destreza: CD 17, uma criatura Agarrada pelo glabrezu. Falha: 15 (3d6 + 5) de dano Contundente. Sucesso: Metade do dano.","Conjuração. O glabrezu conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Inteligência como atributo de conjuração (CD de salvaguarda de magia 16): À Vontade: Escuridão, Detectar Magia, Dissipar Magia. 1/Dia Cada: Confusão, Voo, Palavra de Poder Atordoar."]]],"secoesEn":[["Traços",["Demonic Restoration. If the glabrezu dies outside the Abyss, its body dissolves into ichor, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Abyss.","Magic Resistance. The glabrezu has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The glabrezu makes two Pincer attacks and uses Pummel or Spellcasting.","Pincer. Melee Attack Roll: +9, reach 10 ft. Hit: 16 (2d10 + 5) Slashing damage. If the target is a Medium or smaller creature, it has the Grappled condition (escape DC 15) from one of two pincers.","Pummel. Dexterity Saving Throw: DC 17, one creature Grappled by the glabrezu. Failure: 15 (3d6 + 5) Bludgeoning damage. Success: Half damage.","Spellcasting. The glabrezu casts one of the following spells, requiring no Material components and using Intelligence as the spellcasting ability (spell save DC 16): At Will: Darkness, Detect Magic, Dispel Magic 1/Day Each: Confusion, Fly, Power Word Stun"]]]},"Gladiator":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"16","pv":"112 (15d8+45)","desl":"9 m","ini":"+5 (15)","atr":[18,15,16,10,12,15],"info":[["Salvaguardas","For +7, Des +5, Con +6, Sab +4"],["Perícias","Atletismo +10, Atuação +5"],["Equipamento","Shield, Spears (3), Studded Leather Armor"],["Sentidos","Percepção passiva 11"],["Idiomas","Comum"]],"cr":"5","secoes":[["Ações",["Ataque Múltiplo. O gladiador faz três ataques de Lança. Ele pode substituir um ataque por um uso de Golpe de Escudo.","Lança. Jogada de Ataque Corpo a Corpo ou à Distância: +7, alcance 1,5 m ou distância 6/18 m. Acerto: 11 (2d6 + 4) de dano Perfurante.","Golpe de Escudo. Salvaguarda de Força: CD 15, uma criatura a até 1,5 m que o gladiador consiga ver. Falha: 9 (2d4 + 4) de dano Contundente. Se o alvo for uma criatura Média ou menor, ele fica na condição Caído."]],["Reações",["Aparar. Gatilho: O gladiador é atingido por uma jogada de ataque corpo a corpo enquanto empunha uma arma. Resposta: O gladiador soma 3 à sua CA contra esse ataque, possivelmente fazendo-o errar."]]],"secoesEn":[["Ações",["Multiattack. The gladiator makes three Spear attacks. It can replace one attack with a use of Shield Bash.","Spear. Melee or Ranged Attack Roll: +7, reach 5 ft. or range 20/60 ft. Hit: 11 (2d6 + 4) Piercing damage.","Shield Bash. Strength Saving Throw: DC 15, one creature within 5 feet that the gladiator can see. Failure: 9 (2d4 + 4) Bludgeoning damage. If the target is a Medium or smaller creature, it has the Prone condition."]],["Reações",["Parry. Trigger: The gladiato gon can breathe air and water.","Legendary Resistance (3/Day, or 4/Day in Lair). If the dragon fails a saving throw, it can choose to succeed instead."]],["Ações",["Multiattack. The dragon makes three Rend attacks. It can replace one attack with a use of (A) Spellcasting to cast Guiding Bolt (level 2 version) or (B) Weakening Breath.","Rend. Melee Attack Roll: +14, reach 10 ft. Hit: 17 (2d8 + 8) Slashing damage plus 4 (1d8) Fire damage.","Fire Breath (Recharge 5-6). Dexterity Saving Throw: DC 21, each creature in a 60-foot Cone. Failure: 66 (12d10) Fire damage. Success: Half damage.","Spellcasting. The dragon casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 21, +13 to hit with spell attacks): At Will: Detect Magic, Guiding Bolt (level 2 version), Shapechange (Beast or Humanoid form only, no Temporary Hit Points gained from the spell, and no Concentration or Temporary Hit Points required to maintain the spell) 1/Day Each: Flame Strike, Zone of Truth","Weakening Breath. Strength Saving Throw: DC 21, each creature that isn't currently affected by this breath in a 60-foot Cone. Failure: The target has Disadvantage on Strength-based D20 Tests and subtracts 3 (1d6) from its damage rolls. It repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically."]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the dragon can expend a use to take one of the following actions. The dragon regains all expended uses at the start of each of its turns.","Banish. Charisma Saving Throw: DC 21, one creature the dragon can see within 120 feet. Failure: 10 (3d6) Force damage, and the target has the Incapacitated condition and is transported to a harmless demiplane until the start of the dragon's next turn, at which point it reappears in an unoccupied space of the dragon's choice within 12 e DC 24, +16 to hit with spell attacks): At Will: Detect Magic, Guiding Bolt (level 4 version), Shapechange (Beast or Humanoid form only, no Temporary Hit Points gained from the spell, and no Concentration or Temporary Hit Points required to maintain the spell) 1/Day Each: Flame Strike (level 6 version), Word of Recall, Zone of Truth","Weakening Breath. Strength Saving Throw: DC 24, each creature that isn't currently affected by this breath in a 90-foot Cone. Failure: The target has Disadvantage on Strength-based D20 Tests and subtracts 5 (1d10) from its damage rolls. It repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically."]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the dragon can expend a use to take one of the following actions. The dragon regains all expended uses at the start of each of its turns.","Banish. Charisma Saving Throw: DC 24, one creature the dragon can see within 120 feet. Failure: 24 (7d6) Force damage, and the target has the Incapacitated condition and is transported to a harmless demiplane until the start of the dragon's next turn, at which point it reappears in an unoccupied space of the dragon's choice within 120 feet of the dragon. Failure or Success: The dragon can't take this action again until the start of its next turn.","Guiding Light. The dragon uses Spellcasting to cast Guiding Bolt (level 4 version).","Pounce. The dragon moves up to half its Speed, and it makes one Rend attack."]]]},"Gorgon":{"tipo":"Grande Constructo, Sem Tendência","ca":"19","pv":"114 (12d10+48)","desl":"12 m","ini":"+0 (10)","atr":[20,11,18,2,12,7],"info":[["Perícias","Percepção +7"],["Imunidades","Exaustão, Petrificado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 17"],["Idiomas","Nenhum"]],"cr":"5","secoes":[["Ações",["Chifrada. Jogada de Ataque Corpo a Corpo: +8, alcance 1,5 m. Acerto: 18 (2d12 + 5) de dano Perfura
