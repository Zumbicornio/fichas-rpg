uando o monte rastejante se move, o alvo Agarrado se move junto, sem custo extra de movimento. O monte rastejante só pode ter uma criatura Agarrada por esta ação de cada vez."]]],"secoesEn":[["Traços",["Lightning Absorption. Whenever the shambling mound is subjected to Lightning damage, it regains a number of Hit Points equal to the Lightning damage dealt."]],["Ações",["Multiattack. The shambling mound makes three Charged Tendril attacks. It can replace one attack with a use of Engulf.","Charged Tendril. Melee Attack Roll: +7, reach 10 ft. Hit: 7 (1d6 + 4) Bludgeoning damage plus 5 (2d4) Lightning damage. If the target is a Medium or smaller creature, the shambling mound pulls the target 5 feet straight toward itself.","Engulf. Strength Saving Throw: DC 15, one Medium or smaller creature within 5 feet. Failure: The target is pulled into the shambling mound's space and has the Grappled condition (escape DC 14). Until the grapple ends, the target has the Blinded and Restrained conditions, and it takes 10 (3d6) Lightning damage at the start of each of its turns. When the shambling mound moves, the Grappled target moves with it, costing it no extra movement. The shambling mound can have only one creature Grappled by this action at a time."]]]},"Shield Guardian":{"tipo":"Grande Constructo, Sem Tendência","ca":"17","pv":"142 (15d10+60)","desl":"9 m","ini":"-1 (9)","atr":[18,8,18,7,10,3],"info":[["Imunidades","Venenoso; Enfeitiçado, Exaustão, Amedrontado, Paralisado, Petrificado, Envenenado"],["Sentidos","Percepção às Cegas 3 m, Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Understands commands given in any language mas não fala"]],"cr":"7","secoes":[["Traços",["Vinculado. O guardião está magicamente vinculado a um amuleto. Enquanto o guardião e o amuleto estiverem no mesmo plano de existência, quem usa o amuleto pode chamar o guardião telepaticamente para ir até ele, e o guardião sabe a distância e a direção do amuleto. Se o guardião estiver a até 18 m de quem usa o amuleto, metade de todo dano que essa pessoa sofrer (arredondado para cima) é transferida para o guardião.","Regeneração. O guardião recupera 10 Pontos de Vida no início de cada um de seus turnos se tiver pelo menos 1 Ponto de Vida.","Armazenar Magia. Um conjurador que use o amuleto do guardião pode fazer o guardião armazenar uma magia de 4º círculo ou menor. Para isso, quem usa o amuleto precisa conjurar a magia no guardião estando a até 1,5 m dele. A magia não tem efeito, mas fica armazenada no guardião. Qualquer magia armazenada antes se perde quando uma nova é armazenada. O guardião pode conjurar a magia armazenada com os parâmetros definidos pelo conjurador original, sem precisar de componentes de magia e usando o atributo de conjuração do conjurador. A magia armazenada então se perde."]],["Ações",["Ataque Múltiplo. O guardião faz dois ataques de Punho.","Punho. Jogada de Ataque Corpo a Corpo: +7, alcance 3 m. Acerto: 11 (2d6 + 4) de dano Contundente mais 7 (2d6) de dano de Energia."]],["Reações",["Proteção. Gatilho: Uma jogada de ataque atinge quem usa o amuleto do guardião enquanto essa pessoa está a até 1,5 m dele. Resposta: Quem usa o amuleto ganha +5 de bônus na CA, inclusive contra o ataque que ativou o gatilho, possivelmente fazendo-o errar, até o início do próximo turno do guardião."]]],"secoesEn":[["Traços",["Bound. The guardian is magically bound to an amulet. While the guardian and its amulet are on the same plane of existence, the amulet's wearer can telepathically call the guardian to travel to it, and the guardian knows the distance and direction to the amulet. If the guardian is within 60 feet of the amulet's wearer, half of any damage the wearer takes (round up) is transferred to the guardian.","Regeneration. The guardian regains 10 Hit Points at the start of each of its turns if it has at least 1 Hit Point.","Spell Storing. A spellcaster who wears the guardian's amulet can cause the guardian to store one spell of level 4 or lower. To do so, the wearer must cast the spell on the guardian while within 5 feet of it. The spell has no effect but is stored within the guardian. Any previously stored spell is lost when a new spell is stored. The guardian can cast the spell stored with any parameters set by the original caster, requiring no spell components and using the caster's spellcasting ability. The stored spell is then lost."]],["Ações",["Multiattack. The guardian makes two Fist attacks.","Fist. Melee Attack Roll: +7, reach 10 ft. Hit: 11 (2d6 + 4) Bludgeoning damage plus 7 (2d6) Force damage."]],["Reações",["Protection. Trigger: An attack roll hits the wearer of the guardian's amulet while the wearer is within 5 feet of the guardian. Response: The wearer gains a +5 bonus to AC, including against the triggering attack and possibly causing it to miss, until the start of the guardian's next turn."]]]},"Silver Dragon Wyrmling":{"tipo":"Médio Dragão (Metálico), Leal e Bom","ca":"17","pv":"45 (6d8+18)","desl":"9 m, voo 18 m","ini":"+2 (12)","atr":[19,10,17,12,11,15],"info":[["Salvaguardas","Des +2, Sab +2"],["Perícias","Percepção +4, Furtividade +2"],["Imunidades","Frio"],["Sentidos","Percepção às Cegas 3 m, Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Dracônico"]],"cr":"2","secoes":[["Ações",["Ataque Múltiplo. O dragão faz dois ataques de Dilacerar.","Dilacerar. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 9 (1d10 + 4) de dano Perfurante.","Sopro Gélido (Recarga 5–6). Salvaguarda de Constituição: CD 13, cada criatura num Cone de 4,5 m. Falha: 18 (4d8) de dano de Frio. Sucesso: Metade do dano.","Sopro Paralisante. Salvaguarda de Constituição: CD 13, cada criatura num Cone de 4,5 m. Primeira Falha: O alvo fica na condição Incapacitado até o fim do seu próximo turno, quando repete a salvaguarda. Segunda Falha: O alvo fica na condição Paralisado e repete a salvaguarda no fim de cada um de seus turnos, encerrando o efeito em si mesmo com um sucesso. Após 1 minuto, ele é bem-sucedido automaticamente."]]],"secoesEn":[["Ações",["Multiattack. The dragon makes two Rend attacks.","Rend. Melee Attack Roll: +6, reach 5 ft. Hit: 9 (1d10 + 4) Piercing damage.","Cold Breath (Recharge 5-6). Constitution Saving Throw: DC 13, each creature in a 15-foot Cone. Failure: 18 (4d8) Cold damage. Success: Half damage.","Paralyzing Breath. Constitution Saving Throw: DC 13, each creature in a 15-foot Cone. First Failure: The target has the Incapacitated condition until the end of its next turn, when it repeats the save. Second Failure: The target has the Paralyzed condition, and it repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically."]]]},"Young Silver Dragon":{"tipo":"Grande Dragão (Metálico), Leal e Bom","ca":"18","pv":"168 (16d10+80)","desl":"12 m, voo 24 m","ini":"+4 (14)","atr":[23,10,21,14,11,19],"info":[["Salvaguardas","Des +4, Sab +4"],["Perícias","História +6, Percepção +8, Furtividade +4"],["Imunidades","Frio"],["Sentidos","Percepção às Cegas 9 m, Visão no Escuro 36 m; Percepção passiva 18"],["Idiomas","Comum, Dracônico"]],"cr":"9","secoes":[["Ações",["Ataque Múltiplo. O dragão faz três ataques de Dilacerar. Ele pode substituir um ataque por um uso de Sopro Paralisante.","Dilacerar. Jogada de Ataque Corpo a Corpo: +10, alcance 3 m. Acerto: 15 (2d8 + 6) de dano Cortante.","Sopro Gélido (Recarga 5–6). Salvaguarda de Constituição: CD 17, cada criatura num Cone de 9 m. Falha: 49 (11d8) de dano de Frio. Sucesso: Metade do dano.","Sopro Paralisante. Salvaguarda de Constituição: CD 17, cada criatura num Cone de 9 m. Primeira Falha: O alvo fica na condição Incapacitado até o fim do seu próximo turno, quando repete a salvaguarda. Segunda Falha: O alvo fica na condição Paralisado e repete a salvaguarda no fim de cada um de seus turnos, encerrando o efeito em si mesmo com um sucesso. Após 1 minuto, ele é bem-sucedido automaticamente."]]],"secoesEn":[["Ações",["Multiattack. The dragon makes three Rend attacks. It can replace one attack with a use of Paralyzing Breath.","Rend. Melee Attack Roll: +10, reach 10 ft. Hit: 15 (2d8 + 6) Slashing damage.","Cold Breath (Recharge 5-6). Constitution Saving Throw: DC 17, each creature in a 30-foot Cone. Failure: 49 (11d8) Cold damage. Success: Half damage.","Paralyzing Breath. Constitution Saving Throw: DC 17, each creature in a 30-foot Cone. First Failure: The target has the Incapacitated condition until the end of its next turn, when it repeats the save. Second Failure: The target has the Paralyzed condition, and it repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically."]]]},"Adult Silver Dragon":{"tipo":"Enorme Dragão (Metálico), Leal e Bom","ca":"19","pv":"216 (16d12+112)","desl":"12 m, voo 24 m","ini":"+10 (20)","atr":[27,10,25,16,13,22],"info":[["Salvaguardas","Des +5, Sab +6"],["Perícias","História +8, Percepção +11, Furtividade +5"],["Imunidades","Frio"],["Sentidos","Percepção às Cegas 18 m, Visão no Escuro 36 m; Percepção passiva 21"],["Idiomas","Comum, Dracônico"]],"cr":"16","secoes":[["Traços",["Resistência Lendária (3/Dia, ou 4/Dia no Covil). Se o dragão falhar numa salvaguarda, ele pode escolher ser bem-sucedido."]],["Ações",["Ataque Múltiplo. O dragão faz três ataques de Dilacerar. Ele pode substituir um ataque por um uso de (A) Sopro Paralisante ou (B) Conjuração para conjurar Faca de Gelo.","Dilacerar. Jogada de Ataque Corpo a Corpo: +13, alcance 3 m. Acerto: 17 (2d8 + 8) de dano Cortante mais 4 (1d8) de dano de Frio.","Sopro Gélido (Recarga 5–6). Salvaguarda de Constituição: CD 20, cada criatura num Cone de 18 m. Falha: 54 (12d8) de dano de Frio. Sucesso: Metade do dano.","Sopro Paralisante. Salvaguarda de Constituição: CD 20, cada criatura num Cone de 18 m. Primeira Falha: O alvo fica na condição Incapacitado até o fim do seu próximo turno, quando repete a salvaguarda. Segunda Falha: O alvo fica na condição Paralisado e repete a salvaguarda no fim de cada um de seus turnos, encerrando o efeito em si mesmo com um sucesso. Após 1 minuto, ele é bem-sucedido automaticamente.","Conjuração. O dragão conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 19, +11 para acertar com ataques de magia): À Vontade: Detectar Magia, Imobilizar Monstro, Faca de Gelo, Mudar de Forma (apenas formas de Fera ou Humanoide, sem ganhar Pontos de Vida Temporários pela magia e sem precisar de Concentração ou Pontos de Vida Temporários para mantê-la). 1/Dia Cada: Tempestade de Gelo (versão de 5º círculo), Zona da Verdade."]],["Ações Lendárias",["Usos de Ação Lendária: 3 (4 no Covil). Imediatamente após o turno de outra criatura, o dragão pode gastar um uso para realizar uma das ações a seguir. O dragão recupera todos os usos gastos no início de cada um de seus turnos.","Calafrio. O dragão usa Conjuração para conjurar Imobilizar Monstro. O dragão não pode realizar esta ação de novo até o início do seu próximo turno.","Vendaval Gélido. Salvaguarda de Destreza: CD 19, cada criatura numa Linha de 18 m de comprimento e 3 m de largura. Falha: 14 (4d6) de dano de Frio, e o alvo é empurrado até 9 m em linha reta para longe do dragão. Sucesso: Apenas metade do dano. Falha ou Sucesso: O dragão não pode realizar esta ação de novo até o início do seu próximo turno.","Bote. O dragão se move até metade do seu Deslocamento e faz um ataque de Dilacerar."]]],"secoesEn":[["Traços",["Legendary Resistance (3/Day, or 4/Day in Lair). If the dragon fails a saving throw, it can choose to succeed instead."]],["Ações",["Multiattack. The dragon makes three Rend attacks. It can replace one attack with a use of (A) Paralyzing Breath or (B) Spellcasting to cast Ice Knife.","Rend. Melee Attack Roll: +13, reach 10 ft. Hit: 17 (2d8 + 8) Slashing damage plus 4 (1d8) Cold damage.","Cold Breath (Recharge 5-6). Constitution Saving Throw: DC 20, each cre
