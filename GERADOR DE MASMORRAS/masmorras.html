<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de Masmorras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho + abas; na mesa, mapa em pergaminho à esquerda e painel da sala à direita (empilha no celular).
   Visual escuro único, de propósito, igual ao app das fichas. */
:root{
  color-scheme:dark;
  --bg:#12100e; --panel:#1c1814; --panel2:#251f19; --line:#382e25; --line2:#4b3e32;
  --text:#eee5d3; --muted:#a8998a; --gold:#d1a84e; --gold2:#f0cd7a; --red:#cf5b43; --green:#74a96d; --blue:#6f9cc9; --orange:#d9853b; --violet:#a48bc9;
  --floor:#d8c9a3; --floorgrid:rgba(70,52,34,.20); --wall:#2b2119; --rock:#191512; --hatch:#3a3027; --ink:#3a2a1c; --sel:#b8402a;
  --display:Cinzel,Georgia,"Times New Roman",serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;margin:0;text-wrap:balance}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--line);background:linear-gradient(#1b1611,var(--bg))}
header h1{font-size:20px;color:var(--gold2)}
header .sub{color:var(--muted);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mlist{display:flex;flex-direction:column;margin:0 0 14px}.mlist .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.mlist .li:last-child{border-bottom:0}
.badge{padding:3px 10px;border-radius:99px;border:1px solid var(--line2);font-size:12px;color:var(--muted);white-space:nowrap}
.badge.gold{color:var(--gold2);border-color:var(--gold)}
nav{display:flex;gap:4px;padding-top:6px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--gold2);border-color:var(--gold)}
nav .count{background:var(--line2);color:var(--text);border-radius:99px;padding:0 7px;margin-left:6px;font-size:11px}
main{padding-block:18px 40px;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.notice{background:#2a2117;border:1px solid var(--line2);border-radius:var(--r);padding:10px 14px;color:var(--muted)}
.notice b{color:var(--text)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)} .small{font-size:12px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a140c;font-weight:600}
.btn.pri:hover{background:var(--gold2)}
.btn.danger{color:var(--red);border-color:#6a3328}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,nav button:focus-visible,.roomlink:focus-visible,.card:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{width:100%;min-height:80px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
.form .wide{grid-column:span 2}
@media (max-width:520px){.form .wide{grid-column:auto}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .nm{font-family:var(--display);font-size:18px;font-weight:700;color:var(--gold2);background:transparent;border:1px solid transparent;padding:4px 6px;width:min(520px,100%)}
.toolbar .nm:hover{border-color:var(--line2)}
.mesa{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:920px){.mesa{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mapwrap{overflow:auto;border-radius:6px;max-height:80vh}
#mapa{display:block;width:100%;cursor:pointer;touch-action:manipulation}
.mapwrap.zoom #mapa{width:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px;align-items:center;justify-content:space-between}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.side .panel h3{font-size:14px;color:var(--gold);margin-bottom:8px}
.side h2{font-size:19px;color:var(--gold2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.t-entrada{color:var(--gold2)} .t-secreta{color:var(--violet);background:rgba(164,139,201,.14)} .t-combate{color:var(--red)} .t-chefe{color:#ff8a6b;background:rgba(207,91,67,.15)} .t-armadilha{color:var(--orange)}
.t-tesouro{color:var(--gold)} .t-misterio{color:var(--blue)} .t-descanso{color:var(--green)} .t-vazia{color:var(--muted)}
.rooms{display:flex;flex-direction:column;gap:2px}
.roomlink{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer}
.roomlink:hover{background:var(--panel2)}
.roomlink .n{font-family:var(--display);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.mon{display:flex;flex-direction:column;gap:6px}
.mon .m{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:6px}
.mon .m:last-child{border-bottom:0}
.mon .q{font-weight:600}
.en{color:var(--muted);font-size:12px}
.num{font-variant-numeric:tabular-nums}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
table.d6{width:100%;border-collapse:collapse;font-size:13px}
table.d6 td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
table.d6 td:first-child{width:2em;color:var(--gold);font-family:var(--display);font-weight:700;text-align:center}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer}
.card:hover{border-color:var(--gold)}
.card h2{font-size:16px;color:var(--gold2)}
.empty{padding:32px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h2{color:var(--text);font-size:17px}
.dirty{color:var(--orange);font-size:12px}
.ok{color:var(--green);font-size:12px}
.prose{max-width:65ch}
.rl{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline dotted var(--gold);text-underline-offset:3px;text-align:left}
.rl:hover{color:var(--gold2)}
.rl:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.pop-bg{position:fixed;inset:0;background:rgba(8,6,4,.72);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:20}
.pop{background:var(--panel);border:1px solid var(--gold);border-radius:var(--r);width:min(640px,100%);padding:18px;display:flex;flex-direction:column;gap:12px}
.pop h2{font-size:20px;color:var(--gold2)}
.atr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;text-align:center;border-block:1px solid var(--line);padding-block:8px}
.atr b{display:block;font-size:11px;letter-spacing:.08em;color:var(--gold)}
.atr span{font-variant-numeric:tabular-nums;font-size:13px}
.sb p{margin:0 0 6px} .sb p b{color:var(--gold2)}
.mon-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.atr-ed label{display:flex;flex-direction:column;gap:4px;align-items:center}
.atr-ed input{width:100%;max-width:56px;text-align:center}
.pop textarea{min-height:200px}
.sb h4{margin:12px 0 6px;font-family:Cinzel,Georgia,serif;font-size:14px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:3px}
.sb h4:first-child{margin-top:0}
.kv.info{font-size:13px}
details.oficial{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-top:8px}
details.oficial summary{cursor:pointer;color:var(--gold);font-size:13px}
.credito{margin:0;font-size:10.5px;line-height:1.4;color:var(--muted)}
.sb textarea{min-height:240px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mesa-aviso{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;padding:10px 16px;background:#2a2114;border-bottom:1px solid var(--gold);color:var(--text);font-size:14px;text-align:center}
.mesa-aviso a{color:var(--gold2);font-weight:600}
</style>
</head>

S_('Adult Red Dragon',19,'256 (19d12+133)','12 m, escalada 12 m, voo 24 m','27 10 25 16 13 21','Resistência Lendária (3/dia). Imune: Ígneo.|Presença Aterradora. Criaturas a 36 m: Sabedoria CD 19 ou Amedrontadas por 1 minuto.|Ataque Múltiplo. Presença Aterradora, Mordida e duas Garras.|Mordida. Corpo a corpo +14 (3 m). Acerto: 19 (2d10+8) Perfurante + 7 (2d6) Ígneo.|Garras. Corpo a corpo +14 (1,5 m). Acerto: 15 (2d6+8) Cortante.|Sopro de Fogo (Recarga 5–6). Cone de 18 m: Destreza CD 21, 63 (18d6) Ígneo (metade no sucesso).|Ações Lendárias (3). Detectar, Cauda, Ataque de Asas (2 ações).');
S_('Balor',19,'262 (21d12+126)','12 m, voo 24 m','26 15 22 20 16 22','Resistência a Magia. Resiste a Frio, Elétrico e armas não mágicas; Imune: Ígneo, Veneno.|Aura de Fogo. Quem o toca ou começa o turno a 1,5 m sofre 10 (3d6) Ígneo.|Espasmo da Morte. Ao morrer explode: raio de 9 m, Destreza CD 20, 70 (20d6) Ígneo (metade no sucesso).|Ataque Múltiplo. Espada Longa e Chicote.|Espada Longa. Corpo a corpo +14 (3 m). Acerto: 21 (3d8+8) Cortante + 13 (3d8) Elétrico.|Chicote. Corpo a corpo +14 (9 m). Acerto: 15 (2d6+8) Cortante + 10 (3d6) Ígneo; Força CD 20 ou puxado até 7,5 m.|Teletransporte. Até 36 m.');
S_('Pit Fiend',19,'300 (24d10+168)','9 m, voo 18 m','26 14 24 22 18 24','Aura de Medo. Inimigos que começam o turno a 6 m: Sabedoria CD 21 ou Amedrontados.|Resistência a Magia. Resiste a Frio e armas não prateadas; Imune: Ígneo, Veneno.|Ataque Múltiplo. Mordida, Garras, Maça e Cauda.|Mordida. Corpo a corpo +14 (1,5 m). Acerto: 22 (4d6+8) Perfurante; Constituição CD 21 ou Envenenado e 21 (6d6) Venenoso por turno.|Garras. Corpo a corpo +14 (3 m). Acerto: 17 (2d8+8) Cortante.|Maça. Corpo a corpo +14 (3 m). Acerto: 15 (2d6+8) Contundente + 21 (6d6) Ígneo.|Cauda. Corpo a corpo +14 (3 m). Acerto: 24 (3d10+8) Contundente.|Conjuração (Carisma, CD 21). À vontade: Detectar Magia, Bola de Fogo. 3/dia cada: Imobilizar Monstro, Muralha de Fogo.');
S_('Lich',17,'135 (18d8+54)','9 m','11 16 16 20 14 16','Resistência Lendária (3/dia). Resiste a Frio, Elétrico, Necrótico; Imune: Veneno e armas não mágicas.|Rejuvenescimento. Volta em 1d10 dias se o filactério não for destruído. Resistência a Expulsão.|Toque Paralisante. Corpo a corpo +12 (1,5 m). Acerto: 10 (3d6) Frio; Constituição CD 18 ou Paralisado por 1 minuto.|Conjuração (Inteligência, CD 20, +12). Raio de Fogo, Mãos Mágicas; Detectar Magia, Mísseis Mágicos, Escudo; Detectar Pensamentos, Invisibilidade, Flecha Ácida, Imagem Espelhada; Animar Mortos, Contramágica, Dissipar Magia, Bola de Fogo; Praga, Porta Dimensional; Nuvem Mortal, Vidência; Desintegrar, Globo de Invulnerabilidade; Dedo da Morte, Mudança de Plano; Dominar Monstro, Palavra de Poder: Atordoar; Palavra de Poder: Matar.|Ações Lendárias (3). Truque, Toque Paralisante (2 ações), Olhar Aterrorizante (2 ações), Perturbar Vida (3 ações).');
S_('Ancient Black Dragon',22,'367 (21d20+147)','12 m, voo 24 m, natação 12 m','27 14 25 16 15 19','Resistência Lendária (3/dia). Imune: Ácido. Anfíbio.|Presença Aterradora. Criaturas a 36 m: Sabedoria CD 19 ou Amedrontadas por 1 minuto.|Ataque Múltiplo. Presença Aterradora, Mordida e duas Garras.|Mordida. Corpo a corpo +15 (4,5 m). Acerto: 19 (2d10+8) Perfurante + 9 (2d8) Ácido.|Garras. Corpo a corpo +15 (3 m). Acerto: 15 (2d6+8) Cortante.|Sopro Ácido (Recarga 5–6). Linha de 27 m: Destreza CD 22, 67 (15d8) Ácido (metade no sucesso).|Ações Lendárias (3). Detectar, Cauda, Ataque de Asas (2 ações).');

const SRD = {"Aboleth":{"tipo":"Grande Aberração, Leal e Mau","ca":"17","pv":"150 (20d10+40)","desl":"3 m, natação 12 m","ini":"+7 (17)","atr":[21,9,15,18,15,18],"info":[["Salvaguardas","Des +3, Con +6, Int +8, Sab +6"],["Perícias","História +12, Percepção +10"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 20"],["Idiomas","Dialeto Subterrâneo; telepatia 36 m"]],"cr":"10","secoes":[["Traços",["Anfíbio. O aboleth consegue respirar ar e água.","Restauração Sobrenatural. Se for destruído, o aboleth ganha um novo corpo em 5d10 dias, revivendo com todos os seus Pontos de Vida no Reino Distante ou em outro local escolhido pelo mestre.","Resistência Lendária (3/Dia, ou 4/Dia no Covil). Se o aboleth falhar numa salvaguarda, ele pode escolher ser bem-sucedido.","Nuvem de Muco. Enquanto está submerso, o aboleth fica envolto em muco. Salvaguarda de Constituição: CD 14, cada criatura numa Emanação de 1,5 m a partir do aboleth, no fim do turno do aboleth. Falha: O alvo é amaldiçoado. Até a maldição acabar, a pele do alvo fica viscosa, ele consegue respirar ar e água e não pode recuperar Pontos de Vida a menos que esteja submerso. Enquanto a criatura amaldiçoada estiver fora de um corpo d'água, ela sofre 6 (1d12) de dano Ácido ao fim de cada 10 minutos, a menos que sua pele seja umedecida antes desse tempo passar.","Telepatia Invasiva. Se uma criatura que o aboleth consegue ver se comunicar telepaticamente com ele, o aboleth descobre os maiores desejos dessa criatura."]],["Ações",["Ataque Múltiplo. O aboleth faz dois ataques de Tentáculo e usa Consumir Memórias ou Dominar Mente, se disponível.","Tentáculo. Jogada de Ataque Corpo a Corpo: +9, alcance 4,5 m. Acerto: 12 (2d6 + 5) de dano Contundente. Se o alvo for uma criatura Grande ou menor, ele fica na condição Agarrado (CD 14 para escapar) por um de quatro tentáculos.","Consumir Memórias. Salvaguarda de Inteligência: CD 16, uma criatura a até 9 m que esteja Enfeitiçada ou Agarrada pelo aboleth. Falha: 10 (3d6) de dano Psíquico. Sucesso: Metade do dano. Falha ou Sucesso: O aboleth obtém as memórias do alvo se ele for um Humanoide e for reduzido a 0 Pontos de Vida por esta ação.","Dominar Mente (2/Dia). Salvaguarda de Sabedoria: CD 16, uma criatura que o aboleth consiga ver a até 9 m. Falha: O alvo fica na condição Enfeitiçado até o aboleth morrer ou estar em outro plano de existência. Enquanto Enfeitiçado, o alvo age como aliado do aboleth e fica sob seu controle enquanto estiver a até 18 m dele. Além disso, o aboleth e o alvo podem se comunicar telepaticamente a qualquer distância. O alvo repete a salvaguarda sempre que sofre dano e também após cada 24 horas que passar a pelo menos 1,5 km do aboleth, encerrando o efeito em si mesmo com um sucesso."]],["Ações Lendárias",["Usos de Ação Lendária: 3 (4 no Covil). Imediatamente após o turno de outra criatura, o aboleth pode gastar um uso para realizar uma das ações a seguir. O aboleth recupera todos os usos gastos no início de cada um de seus turnos.","Açoite. O aboleth faz um ataque de Tentáculo.","Dreno Psíquico. Se o aboleth tiver pelo menos uma criatura Enfeitiçada ou Agarrada, ele usa Consumir Memórias e recupera 5 (1d10) Pontos de Vida."]]],"secoesEn":[["Traços",["Amphibious. The aboleth can breathe air and water.","Eldritch Restoration. If destroyed, the aboleth gains a new body in 5d10 days, reviving with all its Hit Points in the Far Realm or another location chosen by the GM.","Legendary Resistance (3/Day, or 4/Day in Lair). If the aboleth fails a saving throw, it can choose to succeed instead.","Mucus Cloud. While underwater, the aboleth is surrounded by mucus. Constitution Saving Throw: DC 14, each creature in a 5-foot Emanation originating from the aboleth at the end of the aboleth's turn. Failure: The target is cursed. Until the curse ends, the target's skin becomes slimy, the target can breathe air and water, and it can't regain Hit Points unless it is underwater. While the cursed creature is outside a body of water, the creature takes 6 (1d12) Acid damage at the end of every 10 minutes unless moisture is applied to its skin before those minutes have passed.","Probing Telepathy. If a creature the aboleth can see communicates telepathically with the aboleth, the aboleth learns the creature's greatest desires."]],["Ações",["Multiattack. The aboleth makes two Tentacle attacks and uses either Consume Memories or Dominate Mind if available.","Tentacle. Melee Attack Roll: +9, reach 15 ft. Hit: 12 (2d6 + 5) Bludgeoning damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14) from one of four tentacles.","Consume Memories. Intelligence Saving Throw: DC 16, one creature within 30 feet that is Charmed or Grappled by the aboleth. Failure: 10 (3d6) Psychic damage. Success: Half damage. Failure or Success: The aboleth gains the target's memories if the target is a Humanoid and is reduced to 0 Hit Points by this action.","Dominate Mind (2/Day). Wisdom Saving Throw: DC 16, one creature the aboleth can see within 30 feet. Failure: The target has the Charmed condition until the aboleth dies or is on a different plane of existence from the target. While Charmed, the target acts as an ally to the aboleth and is under its control while within 60 feet of it. In addition, the aboleth and the target can communicate telepathically with each other over any distance. The target repeats the save whenever it takes damage as well as after every 24 hours it spends at least 1 mile away from the aboleth, ending the effect on itself on a success."]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the aboleth can expend a use to take one of the following actions. The aboleth regains all expended uses at the start of each of its turns.","Lash. The aboleth makes one Tentacle attack.","Psychic Drain. If the aboleth has at least one creature Charmed or Grappled, it uses Consume Memories and regains 5 (1d10) Hit Points."]]]},"Air Elemental":{"tipo":"Grande Elemental, Neutro","ca":"15","pv":"90 (12d10+24)","desl":"3 m, voo 27 m (pairar)","ini":"+5 (15)","atr":[14,20,14,6,10,6],"info":[["Resistências","Contundente, Elétrico, Perfurante, Cortante"],["Imunidades","Venenoso, Trovejante; Exaustão, Agarrado, Paralisado, Petrificado, Envenenado, Caído, Impedido, Inconsciente"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 10"],["Idiomas","Primordial (Auran)"]],"cr":"5","secoes":[["Traços",["Forma Aérea. O elemental pode entrar no espaço de uma criatura e parar ali. Ele pode passar por um espaço de apenas 2,5 cm de largura sem gastar movimento extra."]],["Ações",["Ataque Múltiplo. O elemental faz dois ataques de Pancada Trovejante.","Pancada Trovejante. Jogada de Ataque Corpo a Corpo: +8, alcance 3 m. Acerto: 14 (2d8 + 5) de dano Trovejante.","Redemoinho (Recarga 4–6). Salvaguarda de Força: CD 13, uma criatura Média ou menor no espaço do elemental. Falha: 24 (4d10 + 2) de dano Trovejante, e o alvo é empurrado até 6 m em linha reta para longe do elemental e fica na condição Caído. Sucesso: Apenas metade do dano."]]],"secoesEn":[["Traços",["Air Form. The elemental can enter a creature's space and stop there. It can move through a space as narrow as 1 inch without expending extra movement to do so."]],["Ações",["Multiattack. The elemental makes two Thunderous Slam attacks.","Thunderous Slam. Melee Attack Roll: +8, reach 10 ft. Hit: 14 (2d8 + 5) Thunder damage.","Whirlwind (Recharge 4-6). Strength Saving Throw: DC 13, one Medium or smaller creature in the elemental's space. Failure: 24 (4d10 + 2) Thunder damage, and the target is pushed up to 20 feet straight away from the elemental and has the Prone condition. Success: Half damage only."]]]},"Animated Armor":{"tipo":"Médio Constructo, Sem Tendência","ca":"18","pv":"33 (6d8+6)","desl":"7,5 m","ini":"+2 (12)","atr":[14,11,13,1,3,1],"info":[["Imunidades","Venenoso, Psíquico; Enfeitiçado, Surdo, Exaustão, Amedrontado, Paralisado, Petrificado, Envenenado"],["Sentidos","Percepção às Cegas 18 m; Percepção passiva 6"],["Idiomas","Nenhum"]],"cr":"1","secoes":[["Ações",["Ataque Múltiplo. A armadura faz dois ataques de Pancada.","Pancada. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 5 (1d6 + 2) de dano Contundente."]]],"secoesEn":[["Ações",["Multiattack. The armor makes two Slam attacks.","Slam. Melee Attack Roll: +4, reach 5 ft. Hit: 5 (1d6 + 2) Bludgeoning damage."]]]},"Flying Sword":{"tipo":"Pequeno Constructo, Sem Tendência","ca":"17","pv":"14 (4d6)","desl":"1,5 m, voo 15 m (pairar)","ini":"+4 (14)","atr":[12,15,11,1,5,1],"info":[["Salvaguardas","Des +4"],["Imunidades","Venenoso, Psíquico; Enfeitiçado, Surdo, Exaustão, Amedrontado, Paralisado, Petrificado, Envenenado"],["Sentidos","Percepção às Cegas 18 m; Percepção passiva 7"],["Idiomas","Nenhum"]],"cr":"1/4","nomeSrd":"Animated Flying Sword","secoes":[["Ações",["Talho. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 6 (1d8 + 2) de dano Cortante."]]],"secoesEn":[["Ações",["Slash. Melee Attack Roll: +4, reach 5 ft. Hit: 6 (1d8 + 2) Slashing damage."]]]},"Rug of Smothering":{"tipo":"Grande Constructo, Sem Tendência","ca":"12","pv":"27 (5d10)","desl":"3 m","ini":"+4 (14)","atr":[17,14,10,1,3,1],"info":[["Imunidades","Venenoso, Psíquico; Enfeitiçado, Surdo, Exaustão, Amedrontado, Paralisado, Petrificado, Envenenado"],["Sentidos","Percepção às Cegas 18 m; Percepção passiva 6"],["Idiomas","Nenhum"]],"cr":"2","nomeSrd":"Animated Rug of Smothering","secoes":[["Ações",["Sufocar. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 10 (2d6 + 3) de dano Contundente. Se o alvo for uma criatura Média ou menor, o tapete pode deixá-lo na condição Agarrado (CD 13 para escapar) em vez de causar dano. Até o agarrão acabar, o alvo fica nas condições Cego e Impedido, está sufocando e sofre 10 (2d6 + 3) de dano Contundente no início de cada um de seus turnos. O tapete só consegue sufocar uma criatura por vez. Enquanto agarra o alvo, o tapete não pode usar esta ação, sofre apenas metade do dano que recebe (arredondado para baixo), e o alvo sofre a mesma quantidade de dano."]]],"secoesEn":[["Ações",["Smother. Melee Attack Roll: +5, reach 5 ft. Hit: 10 (2d6 + 3) Bludgeoning damage. If the target is a Medium or smaller creature, the rug can give it the Grappled condition (escape DC 13) instead of dealing damage. Until the grapple ends, the target has the Blinded and Restrained conditions, is suffocating, and takes 10 (2d6 + 3) Bludgeoning damage at the start of each of its turns. The rug can smother only one creature at a time. While grappling the target, the rug can't take this action, the rug halves the damage it takes (round down), and the target takes the same amount of damage."]]]},"Ankheg":{"tipo":"Grande Monstruosidade, Sem Tendência","ca":"14","pv":"45 (6d10+12)","desl":"9 m, escavação 3 m","ini":"+0 (10)","atr":[17,11,14,1,13,6],"info":[["Sentidos","Visão no Escuro 18 m, Sentido Sísmico 18 m; Percepção passiva 11"],["Idiomas","Nenhum"]],"cr":"2","secoes":[["Traços",["Escavador de Túneis. O ankheg consegue escavar rocha sólida com metade do seu Deslocamento de Escavação e deixa para trás um túnel de 3 m de diâmetro."]],["Ações",["Mordida. Jogada de Ataque Corpo a Corpo: +5 (com Vantagem se o alvo estiver Agarrado pelo ankheg), alcance 1,5 m. Acerto: 10 (2d6 + 3) de dano Cortante mais 3 (1d6) de dano Ácido. Se o alvo for uma criatura Grande ou menor, ele fica na condição Agarrado (CD 13 para escapar).","Jato Ácido (Recarga 6). Salvaguarda de Destreza: CD 12, cada criatura numa Linha de 9 m de comprimento e 1,5 m de largura. Falha: 14 (4d6) de dano Ácido. Sucesso: Metade do dano."]]],"secoesEn":[["Traços",["Tunneler. The ankheg can burrow through solid rock at half its Burrow Speed and leaves a 10-foot-diameter tunnel in its wake."]],["Ações",["Bite. Melee Attack Roll: +5 (with Advantage if the target is Grappled by the ankheg), reach 5 ft. Hit: 10 (2d6 + 3) Slashing damage plus 3 (1d6) Acid damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 13).","Acid Spray (Recharge 6). Dexterity Saving Throw: DC 12, each creature in a 30-foot-long, 5-foot-wide Line. Failure: 14 (4d6) Acid damage. Success: Half damage."]]]},"Assassin":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"16","pv":"97 (15d8+30)","desl":"9 m","ini":"+10 (20)","atr":[11,18,14,16,11,10],"info":[["Salvaguardas","Des +7, Int +6"],["Perícias","Acrobacia +7, Percepção +6, Furtividade +10"],["Resistências","Venenoso"],["Equipamento","Light Crossbow, Shortsword, Studded Leather Armor"],["Sentidos","Percepção passiva 16"],["Idiomas","Comum, Gíria de Ladrão"]],"cr":"8","secoes":[["Traços",["Evasão. Se o assassino for alvo de um efeito que permite uma salvaguarda de Destreza para sofrer apenas metade do dano, ele não sofre dano algum se for bem-sucedido e sofre apenas metade se falhar. Ele não pode usar este traço se estiver na condição Incapacitado."]],["Ações",["Ataque Múltiplo. O assassino faz três ataques, usando Espada Curta ou Besta Leve em qualquer combinação.","Espada Curta. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 7 (1d6 + 4) de dano Perfurante mais 17 (5d6) de dano Venenoso, e o alvo fica na condição Envenenado até o início do próximo turno do assassino.","Besta Leve. Jogada de Ataque à Distância: +7, distância 24/96 m. Acerto: 8 (1d8 + 4) de dano Perfurante mais 21 (6d6) de dano Venenoso."]],["Ações Bônus",["Ação Ardilosa. O assassino realiza a ação Disparada, Desengajar ou Esconder."]]],"secoesEn":[["Traços",["Evasion. If the assassin is subjected to an effect that allows it to make a Dexterity saving throw to take only half damage, the assassin instead takes no damage if it succeeds on the save and only half damage if it fails. It can't use this trait if it has the Incapacitated condition."]],["Ações",["Multiattack. The assassin makes three attacks, using Shortsword or Light Crossbow in any combination.","Shortsword. Melee Attack Roll: +7, reach 5 ft. Hit: 7 (1d6 + 4) Piercing damage plus 17 (5d6) Poison damage, and the target has the Poisoned condition until the start of the assassin's next turn.","Light Crossbow. Ranged Attack Roll: +7, range 80/320 ft. Hit: 8 (1d8 + 4) Piercing damage plus 21 (6d6) Poison damage."]],["Ações Bônus",["Cunning Action. The assassin takes the Dash, Disengage, or Hide action."]]]},"Awakened Shrub":{"tipo":"Pequeno Planta, Neutro","ca":"9","pv":"10 (3d6)","desl":"6 m","ini":"-1 (9)","atr":[3,8,11,10,10,6],"info":[["Vulnerabilidades","Fogo"],["Resistências","Perfurante"],["Sentidos","Percepção passiva 10"],["Idiomas","Comum mais one other language"]],"cr":"0","secoes":[["Ações",["Arranhão. Jogada de Ataque Corpo a Corpo: +1, alcance 1,5 m. Acerto: 1 de dano Cortante."]]],"secoesEn":[["Ações",["Rake. Melee Attack Roll: +1, reach 5 ft. Hit: 1 Slashing damage."]]]},"Awakened Tree":{"tipo":"Enorme Planta, Neutro","ca":"13","pv":"59 (7d12+14)","desl":"6 m","ini":"-2 (8)","atr":[19,6,15,10,10,7],"info":[["Vulnerabilidades","Fogo"],["Resistências","Contundente, Perfurante"],["Sentidos","Percepção passiva 10"],["Idiomas","Comum mais one other language"]],"cr":"2","secoes":[["Ações",["Pancada. Jogada de Ataque Corpo a Corpo: +6, alcance 3 m. Acerto: 14 (3d6 + 4) de dano Contundente."]]],"secoesEn":[["Ações",["Slam. Melee Attack Roll: +6, reach 10 ft. Hit: 14 (3d6 + 4) Bludgeoning damage."]]]},"Axe Beak":{"tipo":"Grande Monstruosidade, Sem Tendência","ca":"11","pv":"19 (3d10+3)","desl":"15 m","ini":"+1 (11)","atr":[14,12,12,2,10,5],"info":[["Sentidos","Percepção passiva 10"],["Idiomas","Nenhum"]],"cr":"1/4","secoes":[["Ações",["Bico. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 6 (1d8 + 2) de dano Cortante."]]],"secoesEn":[["Ações",["Beak. Melee Attack Roll: +4, reach 5 ft. Hit: 6 (1d8 + 2) Slashing damage."]]]},"Azer Sentinel":{"tipo":"Médio Elemental, Leal e Neutro","ca":"17","pv":"39 (6d8+12)","desl":"9 m","ini":"+1 (11)","atr":[17,12,15,12,13,10],"info":[["Salvaguardas","Con +4"],["Imunidades","Fogo, Venenoso; Envenenado"],["Sentidos","Percepção passiva 11"],["Idiomas","Primordial (Ignan)"]],"cr":"2","secoes":[["Traços",["Aura de Fogo. No fim de cada turno do azer, cada criatura à escolha dele numa Emanação de 1,5 m a partir do azer sofre 5 (1d10) de dano de Fogo, a menos que o azer esteja na condição Incapacitado.","Iluminação. O azer emite Luz Plena num raio de 3 m e Penumbra por mais 3 m."]],["Ações",["Martelo Ardente. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 8 (1d10 + 3) de dano Contundente mais 3 (1d6) de dano de Fogo."]]],"secoesEn":[["Traços",["Fire Aura. At the end of each of the azer's turns, each creature of the azer's choice in a 5-foot Emanation originating from the azer takes 5 (1d10) Fire damage unless the azer has the Incapacitated condition.","Illumination. The azer sheds Bright Light in a 10-foot radius and Dim Light for an additional 10 feet."]],["Ações",["Burning Hammer. Melee Attack Roll: +5, reach 5 ft. Hit: 8 (1d10 + 3) Bludgeoning damage plus 3 (1d6) Fire damage."]]]},"Balor":{"tipo":"Enorme Ínfero (Demônio), Caótico e Mau","ca":"19","pv":"287 (23d12+138)","desl":"12 m, voo 24 m","ini":"+14 (24)","atr":[26,15,22,20,16,22],"info":[["Salvaguardas","Con +12, Sab +9"],["Perícias","Percepção +9"],["Resistências","Frio, Elétrico"],["Imunidades","Fogo, Venenoso; Enfeitiçado, Amedrontado, Envenenado"],["Sentidos","Visão Verdadeira 36 m; Percepção passiva 19"],["Idiomas","Abissal; telepatia 36 m"]],"cr":"19","secoes":[["Traços",["Estertores da Morte. O balor explode ao morrer. Salvaguarda de Destreza: CD 20, cada criatura numa Emanação de 9 m a partir do balor. Falha: 31 (9d6) de dano de Fogo mais 31 (9d6) de dano de Energia. Sucesso: Metade do dano. Falha ou Sucesso: Se o balor morrer fora do Abismo, ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar do Abismo.","Aura de Fogo. No fim de cada turno do balor, cada criatura numa Emanação de 1,5 m a partir do balor sofre 13 (3d8) de dano de Fogo.","Resistência Lendária (3/Dia). Se o balor falhar numa salvaguarda, ele pode escolher ser bem-sucedido.","Resistência à Magia. O balor tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O balor faz um ataque de Chicote de Chamas e um ataque de Lâmina Relampejante.","Chicote de Chamas. Jogada de Ataque Corpo a Corpo: +14, alcance 9 m. Acerto: 18 (3d6 + 8) de dano de Energia mais 17 (5d6) de dano de Fogo. Se o alvo for uma criatura Enorme ou menor, o balor o puxa até 7,5 m em linha reta na sua direção, e o alvo fica na condição Caído.","Lâmina Relampejante. Jogada de Ataque Corpo a Corpo: +14, alcance 3 m. Acerto: 21 (3d8 + 8) de dano de Energia mais 22 (4d10) de dano Elétrico, e o alvo não pode realizar Reações até o início do próximo turno do balor."]],["Ações Bônus",["Teletransporte. O balor teletransporta a si mesmo ou um demônio voluntário a até 3 m dele por até 18 m, para um espaço desocupado que o balor consiga ver."]]],"secoesEn":[["Traços",["Death Throes. The balor explodes when it dies. Dexterity Saving Throw: DC 20, each creature in a 30-foot Emanation originating from the balor. Failure: 31 (9d6) Fire damage plus 31 (9d6) Force damage. Success: Half damage. Failure or Success: If the balor dies outside the Abyss, it gains a new body instantly, reviving with all its Hit Points somewhere in the Abyss.","Fire Aura. At the end of each of the balor's turns, each creature in a 5-foot Emanation originating from the balor takes 13 (3d8) Fire damage.","Legendary Resistance (3/Day). If the balor fails a saving throw, it can choose to succeed instead.","Magic Resistance. The balor has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The balor makes one Flame Whip attack and one Lightning Blade attack.","Flame Whip. Melee Attack Roll: +14, reach 30 ft. Hit: 18 (3d6 + 8) Force damage plus 17 (5d6) Fire damage. If the target is a Huge or smaller creature, the balor pulls the target up to 25 feet straight toward itself, and the target has the Prone condition.","Lightning Blade. Melee Attack Roll: +14, reach 10 ft. Hit: 21 (3d8 + 8) Force damage plus 22 (4d10) Lightning damage, and the target can't take Reactions until the start of the balor's next turn."]],["Ações Bônus",["Teleport. The balor teleports itself or a willing demon within 10 feet of itself up to 60 feet to an unoccupied space the balor can see."]]]},"Bandit":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"12","pv":"11 (2d8+2)","desl":"9 m","ini":"+1 (11)","atr":[11,12,12,10,10,10],"info":[["Equipamento","Leather Armor, Light Crossbow, Scimitar"],["Sentidos","Percepção passiva 10"],["Idiomas","Comum, Gíria de Ladrão"]],"cr":"1/8","secoes":[["Ações",["Cimitarra. Jogada de Ataque Corpo a Corpo: +3, alcance 1,5 m. Acerto: 4 (1d6 + 1) de dano Cortante.","Besta Leve. Jogada de Ataque à Distância: +3, distância 24/96 m. Acerto: 5 (1d8 + 1) de dano Perfurante."]]],"secoesEn":[["Ações",["Scimitar. Melee Attack Roll: +3, reach 5 ft. Hit: 4 (1d6 + 1) Slashing damage.","Light Crossbow. Ranged Attack Roll: +3, range 80/320 ft. Hit: 5 (1d8 + 1) Piercing damage."]]]},"Bandit Captain":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"15","pv":"52 (8d8+16)","desl":"9 m","ini":"+3 (13)","atr":[15,16,14,14,11,14],"info":[["Salvaguardas","For +4, Des +5, Sab +2"],["Perícias","Atletismo +4, Enganação +4"],["Equipamento","Pistol, Scimitar, Studded Leather Armor"],["Sentidos","Percepção passiva 10"],["Idiomas","Comum, Gíria de Ladrão"]],"cr":"2","secoes":[["Ações",["Ataque Múltiplo. O bandido faz dois ataques, usando Cimitarra e Pistola em qualquer combinação.","Cimitarra. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 6 (1d6 + 3) de dano Cortante.","Pistola. Jogada de Ataque à Distância: +5, distância 9/27 m. Acerto: 8 (1d10 + 3) de dano Perfurante."]],["Reações",["Aparar. Gatilho: O bandido é atingido por uma jogada de ataque corpo a corpo enquanto empunha uma arma. Resposta: O bandido soma 2 à sua CA contra esse ataque, possivelmente fazendo-o errar."]]],"secoesEn":[["Ações",["Multiattack. The bandit makes two attacks, using Scimitar and Pistol in any combination.","Scimitar. Melee Attack Roll: +5, reach 5 ft. Hit: 6 (1d6 + 3) Slashing damage.","Pistol. Ranged Attack Roll: +5, range 30/90 ft. Hit: 8 (1d10 + 3) Piercing damage."]],["Reações",["Parry. Trigger: The bandit is hit by a melee attack roll while holding a weapon. Response: The bandit adds 2 to its AC against that attack, possibly causing it to miss."]]]},"Barbed Devil":{"tipo":"Médio Ínfero (Diabo), Leal e Mau","ca":"15","pv":"110 (13d8+52)","desl":"9 m, escalada 9 m","ini":"+3 (13)","atr":[16,17,18,12,14,14],"info":[["Salvaguardas","For +6, Con +7, Sab +5, Car +5"],["Perícias","Enganação +5, Intuição +5, Percepção +8"],["Resistências","Frio"],["Imunidades","Fogo, Venenoso; Envenenado"],["Sentidos","Visão no Escuro 36 m (unimpeded by magical Darkness); Percepção passiva 18"],["Idiomas","Infernal; telepatia 36 m"]],"cr":"5","secoes":[["Traços",["Couro Farpado. No início de cada um de seus turnos, o diabo causa 5 (1d10) de dano Perfurante a qualquer criatura que ele esteja agarrando ou que o esteja agarrando.","Restauração Diabólica. Se o diabo morrer fora dos Nove Infernos, seu corpo desaparece em fumaça sulfurosa e ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar dos Nove Infernos.","Resistência à Magia. O diabo tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O diabo faz um ataque de Garras e um ataque de Cauda, ou faz dois ataques de Arremessar Chama.","Garras. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 10 (2d6 + 3) de dano Perfurante. Se o alvo for uma criatura Grande ou menor, ele fica na condição Agarrado (CD 13 para escapar) pelas duas garras.","Cauda. Jogada de Ataque Corpo a Corpo: +6, alcance 3 m. Acerto: 14 (2d10 + 3) de dano Cortante.","Arremessar Chama. Jogada de Ataque à Distância: +5, distância 45 m. Acerto: 17 (5d6) de dano de Fogo. Se o alvo for um objeto inflamável que ninguém esteja vestindo ou carregando, ele começa a queimar."]]],"secoesEn":[["Traços",["Barbed Hide. At the start of each of its turns, the devil deals 5 (1d10) Piercing damage to any creature it is grappling or any creature grappling it.","Diabolical Restoration. If the devil dies outside the Nine Hells, its body disappears in sulfurous smoke, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.","Magic Resistance. The devil has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The devil makes one Claws attack and one Tail attack, or it makes two Hurl Flame attacks.","Claws. Melee Attack Roll: +6, reach 5 ft. Hit: 10 (2d6 + 3) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 13) from both claws.","Tail. Melee Attack Roll: +6, reach 10 ft. Hit: 14 (2d10 + 3) Slashing damage.","Hurl Flame. Ranged Attack Roll: +5, range 150 ft. Hit: 17 (5d6) Fire damage. If the target is a flammable object that isn't being worn or carried, it starts burning."]]]},"Basilisk":{"tipo":"Médio Monstruosidade, Sem Tendência","ca":"15","pv":"52 (8d8+16)","desl":"6 m","ini":"-1 (9)","atr":[16,8,15,2,8,7],"info":[["Sentidos","Visão no Escuro 18 m; Percepção passiva 9"],["Idiomas","Nenhum"]],"cr":"3","secoes":[["Ações",["Mordida. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 10 (2d6 + 3) de dano Perfurante mais 7 (2d6) de dano Venenoso."]],["Ações Bônus",["Olhar Petrificante (Recarga 4–6). Salvaguarda de Constituição: CD 12, cada criatura num Cone de 9 m. Se o basilisco vir seu reflexo no Cone, ele próprio precisa fazer esta salvaguarda. Primeira Falha: O alvo fica na condição Impedido e repete a salvaguarda no fim do seu próximo turno se ainda estiver Impedido, encerrando o efeito em si mesmo com um sucesso. Segunda Falha: O alvo fica na condição Petrificado em vez de Impedido."]]],"secoesEn":[["Ações",["Bite. Melee Attack Roll: +5, reach 5 ft. Hit: 10 (2d6 + 3) Piercing damage plus 7 (2d6) Poison damage."]],["Ações Bônus",["Petrifying Gaze (Recharge 4-6). Constitution Saving Throw: DC 12, each creature in a 30-foot Cone. If the basilisk sees its reflection in the Cone, the basilisk must make this save. First Failure: The target has the Restrained condition and repeats the save at the end of its next turn if it is still Restrained, ending the effect on itself on a success. Second Failure: The target has the Petrified condition instead of the Restrained condition."]]]},"Bearded Devil":{"tipo":"Médio Ínfero (Diabo), Leal e Mau","ca":"13","pv":"58 (9d8+18)","desl":"9 m","ini":"+2 (12)","atr":[16,15,15,9,11,14],"info":[["Salvaguardas","For +5, Con +4, Car +4"],["Resistências","Frio"],["Imunidades","Fogo, Venenoso; Amedrontado, Envenenado"],["Sentidos","Visão no Escuro 36 m (unimpeded by magical Darkness); Percepção passiva 10"],["Idiomas","Infernal; telepatia 36 m"]],"cr":"3","secoes":[["Traços",["Resistência à Magia. O diabo tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O diabo faz um ataque de Barba e um ataque de Glaive Infernal.","Barba. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 7 (1d8 + 3) de dano Perfurante, e o alvo fica na condição Envenenado até o início do próximo turno do diabo. Enquanto esse veneno durar, o alvo não pode recuperar Pontos de Vida.","Glaive Infernal. Jogada de Ataque Corpo a Corpo: +5, alcance 3 m. Acerto: 8 (1d10 + 3) de dano Cortante. Se o alvo for uma criatura e ainda não tiver um ferimento infernal, ele é submetido ao efeito a seguir. Salvaguarda de Constituição: CD 12. Falha: O alvo recebe um ferimento infernal. Enquanto estiver ferido, o alvo perde 5 (1d10) Pontos de Vida no início de cada um de seus turnos. O ferimento se fecha após 1 minuto, depois que uma magia restaurar Pontos de Vida do alvo, ou depois que o alvo ou uma criatura a até 1,5 m dele usar uma ação para estancar o ferimento, sendo bem-sucedida num teste de Sabedoria (Medicina) CD 12."]]],"secoesEn":[["Traços",["Magic Resistance. The devil has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The devil makes one Beard attack and one Infernal Glaive attack.","Beard. Melee Attack Roll: +5, reach 5 ft. Hit: 7 (1d8 + 3) Piercing damage, and the target has the Poisoned condition until the start of the devil's next turn. Until this poison ends, the target can't regain Hit Points.","Infernal Glaive. Melee Attack Roll: +5, reach 10 ft. Hit: 8 (1d10 + 3) Slashing damage. If the target is a creature and doesn't already have an infernal wound, it is subjected to the following effect. Constitution Saving Throw: DC 12. Failure: The target receives an infernal wound. While wounded, the target loses 5 (1d10) Hit Points at the start of each of its turns. The wound closes after 1 minute, after a spell restores Hit Points to the target, or after the target or a creature within 5 feet of it takes an action to stanch the wound, doing so by succeeding on a DC 12 Wisdom (Medicine) check."]]]},"Behir":{"tipo":"Enorme Monstruosidade, Neutro e Mau","ca":"17","pv":"168 (16d12+64)","desl":"15 m, escalada 15 m","ini":"+3 (13)","atr":[23,16,18,7,14,12],"info":[["Perícias","Percepção +6, Furtividade +7"],["Imunidades","Elétrico"],["Sentidos","Visão no Escuro 27 m; Percepção passiva 16"],["Idiomas","Dracônico"]],"cr":"11","secoes":[["Ações",["Ataque Múltiplo. O behir faz um ataque de Mordida e usa Constringir.","Mordida. Jogada de Ataque Corpo a Corpo: +10, alcance 3 m. Acerto: 19 (2d12 + 6) de dano Perfurante mais 11 (2d10) de dano Elétrico.","Constringir. Salvaguarda de Força: CD 18, uma criatura Grande ou menor que o behir consiga ver a até 1,5 m. Falha: 28 (5d8 + 6) de dano Contundente. O alvo fica na condição Agarrado (CD 16 para escapar) e na condição Impedido até o agarrão acabar.","Sopro Relampejante (Recarga 5–6). Salvaguarda de Destreza: CD 16, cada criatura numa Linha de 27 m de comprimento e 1,5 m de largura. Falha: 66 (12d10) de dano Elétrico. Sucesso: Metade do dano."]],["Ações Bônus",["Engolir. Salvaguarda de Destreza: CD 18, uma criatura Grande ou menor Agarrada pelo behir (o behir só pode ter uma criatura engolida por vez). Falha: O behir engole o alvo, que deixa de estar Agarrado. Enquanto engolida, a criatura fica nas condições Cego e Impedido, tem Cobertura Total contra ataques e outros efeitos de fora do behir e sofre 21 (6d6) de dano Ácido no início de cada turno do behir. Se o behir sofrer 30 ou mais de dano num único turno vindo da criatura engolida, ele precisa ser bem-sucedido numa salvaguarda de Constituição CD 14 no fim desse turno ou regurgita a criatura, que cai num espaço a até 3 m do behir na condição Caído. Se o behir morrer, a criatura engolida deixa de estar Impedida e pode escapar do cadáver usando 4,5 m de movimento, saindo Caída."]]],"secoesEn":[["Ações",["Multiattack. The behir makes one Bite attack and uses Constrict.","Bite. Melee Attack Roll: +10, reach 10 ft. Hit: 19 (2d12 + 6) Piercing damage plus 11 (2d10) Lightning damage.","Constrict. Strength Saving Throw: DC 18, one Large or smaller creature the behir can see within 5 feet. Failure: 28 (5d8 + 6) Bludgeoning damage. The target has the Grappled condition (escape DC 16), and it has the Restrained condition until the grapple ends.","Lightning Breath (Recharge 5-6). Dexterity Saving Throw: DC 16, each creature in a 90-foot-long, 5-foot-wide Line. Failure: 66 (12d10) Lightning damage. Success: Half damage."]],["Ações Bônus",["Swallow. Dexterity Saving Throw: DC 18, one Large or smaller creature Grappled by the behir (the behir can have only one creature swallowed at a time). Failure: The behir swallows the target, which is no longer Grappled. While swallowed, a creature has the Blinded and Restrained conditions, has Total Cover against attacks and other effects outside the behir, and takes 21 (6d6) Acid damage at the start of each of the behir's turns. If the behir takes 30 damage or more on a single turn from the swallowed creature, the behir must succeed on a DC 14 Constitution saving throw at the end of that turn or regurgitate the creature, which falls in a space within 10 feet of the behir and has the Prone condition. If the behir dies, a swallowed creature is no longer Restrained and can escape from the corpse by using 15 feet of movement, exiting Prone."]]]},"Berserker":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"13","pv":"67 (9d8+27)","desl":"9 m","ini":"+1 (11)","atr":[16,12,17,9,11,9],"info":[["Equipamento","Greataxe, Hide Armor"],["Sentidos","Percepção passiva 10"],["Idiomas","Comum"]],"cr":"2","secoes":[["Traços",["Frenesi Sangrento. Enquanto estiver Sangrando, o berserker tem Vantagem em jogadas de ataque e salvaguardas."]],["Ações",["Machado Grande. Jogada de Ataque Corpo a Corpo: +5, alcance 1,5 m. Acerto: 9 (1d12 + 3) de dano Cortante."]]],"secoesEn":[["Traços",["Bloodied Frenzy. While Bloodied, the berserker has Advantage on attack rolls and saving throws."]],["Ações",["Greataxe. Melee Attack Roll: +5, reach 5 ft. Hit: 9 (1d12 + 3) Slashing damage."]]]},"Black Dragon Wyrmling":{"tipo":"Médio Dragão (Cromático), Caótico e Mau","ca":"17","pv":"33 (6d8+6)","desl":"9 m, voo 18 m, natação 9 m","ini":"+4 (14)","atr":[15,14,13,10,11,13],"info":[["Salvaguardas","Des +4, Sab +2"],["Perícias","Percepção +4, Furtividade +4"],["Imunidades","Ácido"],["Sentidos","Percepção às Cegas 3 m, Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Dracônico"]],"cr":"2","secoes":[["Traços",["Anfíbio. O dragão consegue respirar ar e água."]],["Ações",["Ataque Múltiplo. O dragão faz dois ataques de Dilacerar.","Dilacerar. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 5 (1d6 + 2) de dano Cortante mais 2 (1d4) de dano Ácido.","Sop o de novo até o início do seu próximo turno.","Bote. O dragão se move até metade do seu Deslocamento e faz um ataque de Dilacerar."]]],"secoesEn":[["Traços",["Amphibious. The dragon can breathe air and water.","Legendary Resistance (3/Day, or 4/Day in Lair). If the dragon fails a saving throw, it can choose to succeed instead."]],["Ações",["Multiattack. The dragon makes three Rend attacks. It can replace one attack with a use of Spellcasting to cast Acid Arrow (level 3 version).","Rend. Melee Attack Roll: +11, reach 10 ft. Hit: 13 (2d6 + 6) Slashing damage plus 4 (1d8) Acid damage.","Acid Breath (Recharge 5-6). Dexterity Saving Throw: DC 18, each creature in a 60-foot-long, 5-foot-wide Line. Failure: 54 (12d8) Acid damage. Success: Half damage.","Spellcasting. The dragon casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 17, +9 to hit with spell attacks): At Will: Acid Arrow (level 3 version), Detect Magic, Fear 1/Day Each: Speak with Dead, Vitriolic Sphere"]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the dragon can expend a use to take one of the following actions. The dragon regains all expended uses at the start of each of its turns.","Cloud of Insects. Dexterity Saving Throw: DC 17, one creature the dragon can see within 120 feet. Failure: 22 (4d10) Poison damage, and the target has Disadvantage on saving throws to maintain Concentration until the end of its next turn. Failure or Success: The dragon can't take this action again until the start of its next turn.","Frightful Presence. The dragon uses Spellcasting to cast Fear. The dragon can't take this action again until the start of its next turn.","Pounce. The dragon moves up to half its Speed, and it makes one Rend attack."]]]},"Ancient Black Dragon":{"tipo":"Imenso Dragão (Cromático), Caótico e Mau","ca":"22","pv":"367 (21d20+147)","desl":"12 m, voo 24 m, natação 12 m","in 6 m, escalada 6 m","ini":"-3 (7)","atr":[16,5,16,1,6,1],"info":[["Imunidades","Ácido, Frio, Elétrico, Cortante; Enfeitiçado, Surdo, Exaustão, Amedrontado, Agarrado, Caído, Impedido"],["Sentidos","Percepção às Cegas 18 m; Percepção passiva 8"],["Idiomas","Nenhum"]],"cr":"4","secoes":[["Traços",["Amorfo. O pudim pode passar por um espaço de apenas 2,5 cm de largura sem gastar movimento extra.","Forma Corrosiva. Uma criatura que atinja o pudim com uma jogada de ataque corpo a corpo sofre 4 (1d8) de dano Ácido. Munição não mágica é destruída logo após atingir o pudim e causar dano. Qualquer arma não mágica sofre uma penalidade cumulativa de −1 nas jogadas de ataque logo após causar dano ao pudim e entrar em contato com ele. A arma é destruída se a penalidade chegar a −5. A penalidade pode ser removida conjurando a magia Consertar na arma. Em 1 minuto, o pudim consegue corroer 60 cm de madeira ou metal não mágicos.","Patas de Aranha. O pudim consegue escalar superfícies difíceis, inclusive pelo teto, sem precisar fazer um teste de atributo."]],["Ações",["Pseudópode Dissolvente. Jogada de Ataque Corpo a Corpo: +5, alcance 3 m. Acerto: 17 (4d6 + 3) de dano Ácido. A armadura não mágica vestida pelo alvo sofre uma penalidade de −1 na CA que concede. A armadura é destruída se a penalidade reduzir sua CA a 10. A penalidade pode ser removida conjurando a magia Consertar na armadura."]],["Reações",["Dividir. Gatilho: Enquanto for Grande ou Médio e tiver 10 ou mais Pontos de Vida, o pudim fica Sangrando ou sofre dano Elétrico ou Cortante. Resposta: O pudim se divide em dois novos Pudins Negros. Cada novo pudim é um tamanho menor que o original e age na Iniciativa dele. Os Pontos de Vida do pudim original são divididos igualmente entre os novos (arredondados para baixo)."]]],"secoesEn":[["Traços",["Amorphous. The pudding can move through a space as narrow as 1 inch without expending extra movement to do so.","Corrosive Form. A creature that hits the pudding with a melee attack rol  away from the bulette."]],["Ações Bônus",["Leap. The bulette jumps up to 30 feet by spending 10 feet of movement."]]]},"Centaur Trooper":{"tipo":"Grande Fada, Neutro e Bom","ca":"16","pv":"45 (6d10+12)","desl":"15 m","ini":"+2 (12)","atr":[18,14,14,9,13,11],"info":[["Perícias","Atletismo +6, Percepção +3"],["Equipamento","Breastplate, Longbow, Pike"],["Sentidos","Percepção passiva 13"],["Idiomas","Élfico, Silvestre"]],"cr":"2","secoes":[["Ações",["Ataque Múltiplo. O centauro faz dois ataques, usando Pique ou Arco Longo em qualquer combinação.","Pique. Jogada de Ataque Corpo a Corpo: +6, alcance 3 m. Acerto: 9 (1d10 + 4) de dano Perfurante.","Arco Longo. Jogada de Ataque à Distância: +4, distância 45/180 m. Acerto: 6 (1d8 + 2) de dano Perfurante."]],["Ações Bônus",["Investida Atropeladora (Recarga 5–6). O centauro se move até o seu Deslocamento sem provocar Ataques de Oportunidade e pode atravessar o espaço de criaturas Médias ou menores. Cada criatura em cujo espaço o centauro entrar é alvo do efeito a seguir uma vez. Salvaguarda de Força: CD 14. Falha: 7 (1d6 + 4) de dano Contundente, e o alvo fica na condição Caído."]]],"secoesEn":[["Ações",["Multiattack. The centaur makes two attacks, using Pike or Longbow in any combination.","Pike. Melee Attack Roll: +6, reach 10 ft. Hit: 9 (1d10 + 4) Piercing damage.","Longbow. Ranged Attack Roll: +4, range 150/600 ft. Hit: 6 (1d8 + 2) Piercing damage."]],["Ações Bônus",["Trampling Charge (Recharge 5-6). The centaur moves up to its Speed without provoking Opportunity Attacks and can move through the spaces of Medium or smaller creatures. Each creature whose space the centaur enters is targeted once by the following effect. Strength Saving Throw: DC 14. Failure: 7 (1d6 + 4) Bludgeoning damage, and the target has the Prone condition."]]]},"Chain Devil":{"tipo":"Médio Ínfero (Diabo), Leal e Mau","ca":"15","pv":"85 (10d8+40)","desl":"9 m","ini":"+5 (15)","atr":[18,15,18,11,12,14],"info":[["Salvaguardas","Con +7, Sab +4"],["Resistências","Contundente, Frio, Perfurante, Cortante"],["Imunidades","Fogo, Venenoso; Envenenado"],["Sentidos","Visão no Escuro 36 m (unimpeded by magical Darkness); Percepção passiva 11"],["Idiomas","Infernal; telepatia 36 m"]],"cr":"8","secoes":[["Traços",["Restauração Diabólica. Se o diabo morrer fora dos Nove Infernos, seu corpo desaparece em fumaça sulfurosa e ele ganha um novo corpo instantaneamente, revivendo com todos os seus Pontos de Vida em algum lugar dos Nove Infernos.","Resistência à Magia. O diabo tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O diabo faz dois ataques de Corrente e usa Conjurar Corrente Infernal.","Corrente. Jogada de Ataque Corpo a Corpo: +7, alcance 3 m. Acerto: 11 (2d6 + 4) de dano Cortante. Se o alvo for uma criatura Grande ou menor, ele fica na condição Agarrado (CD 14 para escapar) por uma de duas correntes e na condição Impedido até o agarrão acabar.","Conjurar Corrente Infernal. O diabo conjura uma corrente flamejante para prender uma criatura. Salvaguarda de Destreza: CD 15, uma criatura que o diabo consiga ver a até 18 m. Falha: 9 (2d4 + 4) de dano de Fogo, e o alvo fica na condição Impedido até o fim do próximo turno do diabo, quando a corrente desaparece. Se o alvo for Grande ou menor, o diabo o move até 9 m em linha reta na sua direção. Sucesso: A corrente desaparece."]],["Reações",["Olhar Perturbador. Gatilho: Uma criatura que o diabo consiga ver começa o turno a até 9 m dele e consegue vê-lo. Resposta — Salvaguarda de Sabedoria: CD 15, a criatura que ativou o gatilho. Falha: O alvo fica na condição Amedrontado até o fim do seu turno. Sucesso: O alvo fica imune ao Olhar Perturbador deste diabo por 24 horas."]]],"secoesEn":[["Traços",["Diabolical Restoration. If the devil dies outside the Nine Hells, its body disappears in sulfurous smoke, and it gains a new body instantly, reviving with all its Hit Points somewhere in the Nine Hells.","Magic Resistance. The devil has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The devil makes two Chain attacks and uses Conjure Infernal Chain.","Chain. Melee Attack Roll: +7, reach 10 ft. Hit: 11 (2d6 + 4) Slashing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14) from one of two chains, and it has the Restrained condition until the grapple ends.","Conjure Infernal Chain. The devil conjures a fiery chain to bind a creature. Dexterity Saving Throw: DC 15, one creature the devil can see within 60 feet. Failure: 9 (2d4 + 4) Fire damage, and the target has the Restrained condition until the end of the devil's next turn, at which point the chain disappears. If the target is Large or smaller, the devil moves the target up to 30 feet straight toward itself. Success: The chain disappears."]],["Reações",["Unnerving Gaze. Trigger: A creature the devil can see starts its turn within 30 feet of the devil and can see the devil. Response--Wisdom Saving Throw: DC 15, the triggering creature. Failure: The target has the Frightened condition until the end of its turn. Success: The target is immune to this devil's Unnerving Gaze for 24 hours."]]]},"Chimera":{"tipo":"Grande Monstruosidade, Caótico e Mau","ca":"14","pv":"114 (12d10+48)","desl":"9 m, voo 18 m","ini":"+0 (10)","atr":[19,11,19,3,14,10],"info":[["Perícias","Percepção +8"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 18"],["Idiomas","Understands Dracônico mas não fala"]],"cr":"6","secoes":[["Ações",["Ataque Múltiplo. A quimera faz um ataque de Marrada, um de Mordida e um de Garra. Ela pode substituir o ataque de Garra por um uso de Sopro de Fogo, se disponível.","Mordida. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 11 (2d6 + 4) de dano Perfurante, ou 18 (4d6 + 4) de dano Perfurante se a quimera teve Vantagem na jogada de ataque.","Garra. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 7 (1d6 + 4) de dano Cortante.","Marrada. Jogada de Ataque Corpo a Corpo: +7, alcance 1,5 m. Acerto: 10 (1d12 + 4) de dano Contundente. Se o alvo for uma criatura Média ou menor, ele fica na condição Caído.","Sopro de Fogo (Recarga 5–6). Salvaguarda de Destreza: CD 15, cada criatura num Cone de 4,5 m. Falha: 31 (7d8) de dano de Fogo. Sucesso: Metade do dano."]]],"secoesEn":[["Ações",["Multiattack. The chimera makes one Ram attack, one Bite attack, and one Claw attack. It can replace the Claw attack with a use of Fire Breath if available.","Bite. Melee Attack Roll: +7, reach 5 ft. Hit: 11 (2d6 + 4) Piercing damage, or 18 (4d6 + 4) Piercing damage if the chimera had Advantage on the attack roll.","Claw. Melee Attack Roll: +7, reach 5 ft. Hit: 7 (1d6 + 4) Slashing damage.","Ram. Melee Attack Roll: +7, reach 5 ft. Hit: 10 (1d12 + 4) Bludgeoning damage. If the target is a Medium or smaller creature, it has the Prone condition.","Fire Breath (Recharge 5-6). Dexterity Saving Throw: DC 15, each creature in a 15-foot Cone. Failure: 31 (7d8) Fire damage. Success: Half damage."]]]},"Chuul":{"tipo":"Grande Aberração, Caótico e Mau","ca":"16","pv":"76 (9d10+27)","desl":"9 m, natação 9 m","ini":"+0 (10)","atr":[19,10,16,5,11,5],"info":[["Perícias","Percepção +4"],["Imunidades","Venenoso; Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Understands Dialeto Subterrâneo mas não fala"]],"cr":"4","secoes":[["Traços",["Anfíbio. O chuul consegue respirar ar e água.","Sentir Magia. O chuul sente magia a até 36 m de si. No resto, este traço funciona como a magia Detectar Magia, mas não é mágico."]],["Ações",["Ataque Múltiplo. O chuul faz dois ataques de Pinça e usa Tentáculos Paralisantes.","Pinça. Jogada de Ataque Corpo a Corpo: +6, alcance 3 m. Acerto: 9 (1d10 + 4) de dano Contundente. Se o alvo for uma criatura Grande ou menor, ele fica na condição Agarrado (CD 14 para escapar) por uma de duas pinças.","Tentáculos Paralisantes. Salvaguarda de Constituição: CD 13, uma criatura Agarrada pelo chuul. Falha: O alvo fica na condição Envenenado e repete a salvaguarda no fim de cada um de seus turnos, encerrando o efeito em si mesmo com um sucesso. Após 1 minuto, ele é bem-sucedido automaticamente. Enquanto Envenenado, o alvo fica na condição Paralisado."]]],"secoesEn":[["Traços",["Amphibious. The chuul can breathe air and water.","Sense Magic. The chuul senses magic within 120 feet of itself. This trait otherwise works like the Detect Magic spell but isn't itself magical."]],["Ações",["Multiattack. The chuul makes two Pincer attacks and uses Paralyzing Tentacles.","Pincer. Melee Attack Roll: +6, reach 10 ft. Hit: 9 (1d10 + 4) Bludgeoning damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14) from one of two pincers.","Paralyzing Tentacles. Constitution Saving Throw: DC 13, one creature Grappled by the chuul. Failure: The target has the Poisoned condition and repeats the save at the end of each of its turns, ending the effect on itself on a success. After 1 minute, it succeeds automatically. While Poisoned, the target has the Paralyzed condition."]]]},"Clay Golem":{"tipo":"Grande Constructo, Sem Tendência","ca":"14","pv":"123 (13d10+52)","desl":"9 m","ini":"+3 (13)","atr":[20,9,18,3,8,1],"info":[["Resistências","Contundente, Perfurante, Cortante"],["Imunidades","Ácido, Venenoso, Psíquico; Enfeitiçado, Exaustão, Amedrontado, Paralisado, Petrificado, Envenenado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 9"],["Idiomas","Comum mais one other language"]],"cr":"9","secoes":[["Traços",["Absorção de Ácido. Sempre que o golem for submetido a dano Ácido, ele não sofre dano e, em vez disso, recupera Pontos de Vida iguais ao dano Ácido causado.","Fúria Cega. Sempre que o golem começar o turno Sangrando, role 1d6. Com 6, o golem entra em fúria. Em cada turno enquanto estiver em fúria, o golem ataca a criatura mais próxima que consiga ver. Se nenhuma criatura estiver perto o bastante para ele se mover e atacar, o golem ataca um objeto. Depois de entrar em fúria, o golem continua assim até ser destruído ou deixar de estar Sangrando.","Forma Imutável. O golem não pode mudar de forma.","Resistência à Magia. O golem tem Vantagem em salvaguardas contra magias e outros efeitos mágicos."]],["Ações",["Ataque Múltiplo. O golem faz dois ataques de Pancada, ou três ataques de Pancada se usou Apressar neste turno.","Pancada. Jogada de Ataque Corpo a Corpo: +9, alcance 1,5 m. Acerto: 10 (1d10 + 5) de dano Contundente mais 6 (1d12) de dano Ácido, e o máximo de Pontos de Vida do alvo diminui numa quantidade igual ao dano Ácido sofrido."]],["Ações Bônus",["Apressar (Recarga 5–6). O golem realiza as ações Disparada e Desengajar."]]],"secoesEn":[["Traços",["Acid Absorption. Whenever the golem is subjected to Acid damage, it takes no damage and instead regains a number of Hit Points equal to the Acid damage dealt.","Berserk. Whenever the golem starts its turn Bloodied, roll 1d6. On a 6, the golem goes berserk. On each of its turns while berserk, the golem attacks the nearest creature it can see. If no creature is near enough to move to and attack, the golem attacks an object. Once the golem goes berserk, it continues to be berserk until it is destroyed or it is no longer Bloodied.","Immutable Form. The golem can't shape-shift.","Magic Resistance. The golem has Advantage on saving throws against spells and other magical effects."]],["Ações",["Multiattack. The golem makes two Slam attacks, or it makes three Slam attacks if it used Hasten this turn.","Slam. Melee Attack Roll: +9, reach 5 ft. Hit: 10 (1d10 + 5) Bludgeoning damage plus 6 (1d12) Acid damage, and the target's Hit Point maximum decreases by an amount equal to the Acid damage taken."]],["Ações Bônus",["Hasten (Recharge 5-6). The golem takes the Dash and Disengage actions."]]]},"Cloaker":{"tipo":"Grande Aberração, Caótico e Neutro","ca":"14","pv":"91 (14d10+14)","desl":"3 m, voo 12 m","ini":"+5 (15)","atr":[17,15,12,13,14,7],"info":[["Perícias","Furtividade +5"],["Imunidades","Amedrontado"],["Sentidos","Visão no Escuro 36 m; Percepção passiva 12"],["Idiomas","Dialeto Subterrâneo, Subcomum"]],"cr":"8","secoes":[["Traços",["Sensibilidade à Luz. Sob Luz Plena, o manto sombrio tem Desvantagem em jogadas de ataque."]],["Ações",["Ataque Múltiplo. O manto sombrio faz um ataque de Grudar e dois ataques de Cauda.","Grudar. Jogada de Ataque Corpo a Corpo: +6, alcance 1,5 m. Acerto: 13 (3d6 + 3) de dano Perfurante. Se o alvo for uma criatura Grande ou menor, o manto sombrio gruda nele. Enquanto estiver grudado, o alvo fica na condição Cego e o manto sombrio não pode fazer ataques de Grudar contra outros alvos. Além disso, o manto sombrio sofre apenas metade do dano que recebe (arredondado para baixo), e o alvo sofre a mesma quantidade de dano. O manto sombrio pode se soltar gastando 1,5 m de movimento. O alvo ou uma criatura a até 1,5 m dele pode usar uma ação para tentar soltar o manto sombrio, conseguindo com um teste de Força (Atletismo) CD 14 bem-sucedido.","Cauda. Jogada de Ataque Corpo a Corpo: +6, alcance 3 m. Acerto: 8 (1d10 + 3) de dano Cortante."]],["Ações Bônus",["Gemido. Salvaguarda de Sabedoria: CD 13, cada criatura numa Emanação de 18 m a partir do manto sombrio. Falha: O alvo fica na condição Amedrontado até o fim do próximo turno do manto sombrio. Sucesso: O alvo fica imune ao Gemido deste manto sombrio pelas próximas 24 horas.","Fantasmas (Recarga após Descanso Curto ou Longo). O manto sombrio conjura a magia Imagem Espelhada, sem precisar de componentes e usando Sabedoria como atributo de conjuração. A magia acaba antes se o manto sombrio começar ou terminar o turno sob Luz Plena."]]],"secoesEn":[["Traços",["Light Sensitivity. While in Bright Light, the cloaker has Disadvantage on attack rolls."]],["Ações",["Multiattack. The cloaker makes one Attach attack and two Tail attacks.","Attach. Melee Attack Roll: +6, reach 5 ft. Hit: 13 (3d6 + 3) Piercing damage. If the target is a Large or smaller creature, the cloaker attaches to it. While the cloaker is attached, the target has the Blinded condition, and the cloaker can't make Attach attacks against other targets. In addition, the cloaker halves the damage it takes (round down), and the target takes the same amount of damage. The cloaker can detach itself by spending 5 feet of movement. The target or a creature within 5 feet of it can take an action to try to detach the cloaker, doing so by succeeding on a DC 14 Strength (Athletics) check.","Tail. Melee Attack Roll: +6, reach 10 ft. Hit: 8 (1d10 + 3) Slashing damage."]],["Ações Bônus",["Moan. Wisdom Saving Throw: DC 13, each creature in a 60-foot Emanation originating from the cloaker. Failure: The target has the Frightened condition until the end of the cloaker's next turn. Success: The target is immune to this cloaker's Moan for the next 24 hours.","Phantasms (Recharge after a Short or Long Rest). The cloaker casts the Mirror Image spell, requiring no spell components and using Wisdom as the spellcasting ability. The spell ends early if the cloaker starts or ends its turn in Bright Light."]]]},"Cloud Giant":{"tipo":"Enorme Gigante, Neutro","ca":"14","pv":"200 (16d12+96)","desl":"12 m, voo 6 m (pairar)","ini":"+4 (14)","atr":[27,10,22,12,16,16],"info":[["Salvaguardas","Con +10, Sab +7"],["Perícias","Intuição +7, Percepção +11"],["Sentidos","Percepção passiva 21"],["Idiomas","Comum, Gigante"]],"cr":"9","secoes":[["Ações",["Ataque Múltiplo. O gigante faz dois ataques, usando Maça Trovejante ou Nuvem de Trovão em qualquer combinação. Ele pode substituir um ataque por um uso de Conjuração para conjurar Nuvem de Névoa.","Maça Trovejante. Jogada de Ataque Corpo a Corpo: +12, alcance 3 m. Acerto: 21 (3d8 + 8) de dano Contundente mais 7 (2d6) de dano Trovejante.","Nuvem de Trovão. Jogada de Ataque à Distância: +12, distância 72 m. Acerto: 18 (3d6 + 8) de dano Trovejante, e o alvo fica na condição Incapacitado até o fim do seu próximo turno.","Conjuração. O gigante conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 15): À Vontade: Detectar Magia, Nuvem de Névoa, Luz. 1/Dia Cada: Controlar o Clima, Forma Gasosa, Telecinese."]],["Ações Bônus",["Passo Nebuloso. O gigante conjura a magia Passo Nebuloso, usando o mesmo atributo de conjuração de Conjuração."]]],"secoesEn":[["Ações",["Multiattack. The giant makes two attacks, using Thunderous Mace or Thundercloud in any combination. It can replace one attack with a use of Spellcasting to cast Fog Cloud.","Thunderous Mace. Melee Attack Roll: +12, reach 10 ft. Hit: 21 (3d8 + 8) Bludgeoning damage plus 7 (2d6) Thunder damage.","Thundercloud. Ranged Attack Roll: +12, range 240 ft. Hit: 18 (3d6 + 8) Thunder damage, and the target has the Incapacitated condition until the end of its next turn.","Spellcasting. The giant casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 15): At Will: Detect Magic, Fog Cloud, Light 1/Day Each: Control Weather, Gaseous Form, Telekinesis"]],["Ações Bônus",["Misty Step. The giant casts the Misty Step spell, using the same spellcasting ability as Spellcasting."]]]},"Cockatrice":{"tipo":"Pequeno Monstruosidade, Sem Tendência","ca":"11","pv":"22 (5d6+5)","desl":"6 m, voo 12 m","ini":"+1 (11)","atr":[6,12,12,2,13,5],"info":[["Imunidades","Petrificado"],["Sentidos","Visão no Escuro 18 m; Percepção passiva 11"],["Idiomas","Nenhum"]],"cr":"1/2","secoes":[["Ações",["Mordida Petrificante. Jogada de Ataque Corpo a Corpo: +3, alcance 1,5 m. Acerto: 3 (1d4 + 1) de dano Perfurante. Se o alvo for uma criatura, ele é submetido ao efeito a seguir. Salvaguarda de Constituição: CD 11. Primeira Falha: O alvo fica na condição Impedido. Ele repete a salvaguarda no fim do seu próximo turno se ainda estiver Impedido, encerrando o efeito em si mesmo com um sucesso. Segunda Falha: O alvo fica na condição Petrificado, em vez de Impedido, por 24 horas."]]],"secoesEn":[["Ações",["Petrifying Bite. Melee Attack Roll: +3, reach 5 ft. Hit: 3 (1d4 + 1) Piercing damage. If the target is a creature, it is subjected to the following effect. Constitution Saving Throw: DC 11. First Failure: The target has the Restrained condition. The target repeats the save at the end of its next turn if it is still Restrained, ending the effect on itself on a success. Second Failure: The target has the Petrified condition, instead of the Restrained condition, for 24 hours."]]]},"Commoner":{"tipo":"Médio ou Pequeno Humanoide, Neutro","ca":"10","pv":"4 (1d8)","desl":"9 m","ini":"+0 (10)","atr":[10,10,10,10,10,10],"info":[["Equipamento","Club"],["Sentidos","Percepção passiva 10"],["Idiomas","Comum"]],"cr":"0","secoes":[["Traços",["Treinamento. O plebeu tem proficiência em uma perícia à escolha do mestre e tem Vantagem sempre que faz um teste de atributo usando essa perícia."]],["Ações",["Clava. Jogada de Ataque Corpo a Corpo: +2, alcance 1,5 m. Acerto: 2 (1d4) de dano Contundente."]]],"secoesEn":[["Traços",["Training. The commoner has proficiency in one skill of the GM's choice and has Advantage whenever it makes an ability check using that skill."]],["Ações",["Club. Melee Attack Roll: +2, reach 5 ft. Hit: 2 (1d4) Bludgeoning damage."]]]},"Copper Dragon Wyrmling":{"tipo":"Médio Dragão (Metálico), Caótico e Bom","ca":"16","pv":"22 (4d8+4)","desl":"9 m, escalada 9 m, voo 18 m","ini":"+3 (13)","atr":[15,12,13,14,11,13],"info":[["Salvaguardas","Des +3, Sab +2"],["Perícias","Percepção +4, Furtividade +3"],["Imunidades","Ácido"],["Sentidos","Percepção às Cegas 3 m, Visão no Escuro 18 m; Percepção passiva 14"],["Idiomas","Dracônico"]],"cr":"1","secoes":[["Ações",["Dilacerar. Jogada de Ataque Corpo a Corpo: +4, alcance 1,5 m. Acerto: 7 (1d10 + 2) de dano Cortante.","Sopro Ácido (Recarga 5–6). Salvaguarda de Destreza: CD 11, cada criatura numa Linha de 6 m de comprimento e 1,5 m de largura. Falha: 18 (4d8) de dano Ácido. Sucesso: Metade do dano.","Sopro Retardante. Salvaguarda de Constituição: CD 11, cada criatura num Cone de 4,5 m. Falha: O alvo não pode realizar Reações, seu Deslocamento cai pela metade e ele pode realizar uma ação ou uma Ação Bônus no seu turno, não ambas. O efeito dura até o fim do seu próximo turno."]]],"secoesEn":[["Ações",["Rend. Melee Attack Roll: +4, reach 5 ft. Hit: 7 (1d10 + 2) Slashing damage.","Acid Breath (Recharge 5-6). Dexterity Saving Throw: DC 11, each creature in a 20-foot-long, 5-foot-wide Line. Failure: 18 (4d8) Acid damage. Success: Half damage.","Slowing Breath. Constitution Saving Throw: DC 11, each creature in a 15-foot Cone. Failure: The target can't take Reactions; its Speed is halved; and it can take either an action or a Bonus Action on its turn, not both. This effect lasts until the end of its next turn."]]]},"Young Copper Dragon":{"tipo":"Grande Dragão (Metálico), Caótico e Bom","ca":"17","pv":"119 (14d10+42)","desl":"12 m, escalada 12 m, voo 24 m","ini":"+4 (14)","atr":[19,12,17,16,13,15],"info":[["Salvaguardas","Des +4, Sab +4"],["Perícias","Enganação +5, Percepção +7, Furtividade +4"],["Imunidades","Ácido"],["Sentidos","Percepção às Cegas 9 m, Visão no Escuro 36 m; Percepção passiva 17"],["Idiomas","Comum, Dracônico"]],"cr":"7","secoes":[["Ações",["Ataque Múltiplo. O dragão faz três ataques de Dilacerar. Ele pode substituir um ataque por um uso de Sopro Retardante.","Dilacerar. Jogada de Ataque Corpo a Corpo: +7, alcance 3 m. Acerto: 15 (2d10 + 4) de dano Cortante.","Sopro Ácido (Recarga 5–6). Salvaguarda de Destreza: CD 14, cada criatura numa Linha de 12 m de comprimento e 1,5 m de largura. Falha: 40 (9d8) de dano Ácido. Sucesso: Metade do dano.","Sopro Retardante. Salvaguarda de Constituição: CD 14, cada criatura num Cone de 9 m. Falha: O alvo não pode realizar Reações, seu Deslocamento cai pela metade e ele pode realizar uma ação ou uma Ação Bônus no seu turno, não ambas. O efeito dura até o fim do seu próximo turno."]]],"secoesEn":[["Ações",["Multiattack. The dragon makes three Rend attacks. It can replace one attack with a use of Slowing Breath.","Rend. Melee Attack Roll: +7, reach 10 ft. Hit: 15 (2d10 + 4) Slashing damage.","Acid Breath (Recharge 5-6). Dexterity Saving Throw: DC 14, each creature in a 40-foot-long, 5-foot-wide Line. Failure: 40 (9d8) Acid damage. Success: Half damage.","Slowing Breath. Constitution Saving Throw: DC 14, each creature in a 30-foot Cone. Failure: The target can't take Reactions; its Speed is halved; and it can take either an action or a Bonus Action on its turn, not both. This effect lasts until the end of its next turn."]]]},"Adult Copper Dragon":{"tipo":"Enorme Dragão (Metálico), Caótico e Bom","ca":"18","pv":"184 (16d12+80)","desl":"12 m, escalada 12 m, voo 24 m","ini":"+11 (21)","atr":[23,12,21,18,15,18],"info":[["Salvaguardas","Des +6, Sab +7"],["Perícias","Enganação +9, Percepção +12, Furtividade +6"],["Imunidades","Ácido"],["Sentidos","Percepção às Cegas 18 m, Visão no Escuro 36 m; Percepção passiva 22"],["Idiomas","Comum, Dracônico"]],"cr":"14","secoes":[["Traços",["Resistência Lendária (3/Dia, ou 4/Dia no Covil). Se o dragão falhar numa salvaguarda, ele pode escolher ser bem-sucedido."]],["Ações",["Ataque Múltiplo. O dragão faz três ataques de Dilacerar. Ele pode substituir um ataque por um uso de (A) Sopro Retardante ou (B) Conjuração para conjurar Pico Mental (versão de 4º círculo).","Dilacerar. Jogada de Ataque Corpo a Corpo: +11, alcance 3 m. Acerto: 17 (2d10 + 6) de dano Cortante mais 4 (1d8) de dano Ácido.","Sopro Ácido (Recarga 5–6). Salvaguarda de Destreza: CD 18, cada criatura numa Linha de 18 m de comprimento e 1,5 m de largura. Falha: 54 (12d8) de dano Ácido. Sucesso: Metade do dano.","Sopro Retardante. Salvaguarda de Constituição: CD 18, cada criatura num Cone de 18 m. Falha: O alvo não pode realizar Reações, seu Deslocamento cai pela metade e ele pode realizar uma ação ou uma Ação Bônus no seu turno, não ambas. O efeito dura até o fim do seu próximo turno.","Conjuração. O dragão conjura uma das magias a seguir, sem precisar de componentes Materiais e usando Carisma como atributo de conjuração (CD de salvaguarda de magia 17): À Vontade: Detectar Magia, Pico Mental (versão de 4º círculo), Ilusão Menor, Mudar de Forma (apenas formas de Fera ou Humanoide, sem ganhar Pontos de Vida Temporários pela magia e sem precisar de Concentração ou Pontos de Vida Temporários para mantê-la). 1/Dia Cada: Restauração Maior, Imagem Maior."]],["Ações Lendárias",["Usos de Ação Lendária: 3 (4 no Covil). Imediatamente após o turno de outra criatura, o dragão pode gastar um uso para realizar uma das ações a seguir. O dragão recupera todos os usos gastos no início de cada um de seus turnos.","Magia Risonha. Salvaguarda de Carisma: CD 17, uma criatura que o dragão consiga ver a até 27 m. Falha: 24 (7d6) de dano Psíquico. Até o fim do seu próximo turno, o alvo rola 1d6 sempre que faz um teste de atributo ou uma jogada de ataque e subtrai o resultado do Teste de D20. Falha ou Sucesso: O dragão não pode realizar esta ação de novo até o início do seu próximo turno.","Choque Mental. O dragão usa Conjuração para conjurar Pico Mental (versão de 4º círculo). O dragão não pode realizar esta ação de novo até o início do seu próximo turno.","Bote. O dragão se move até metade do seu Deslocamento e faz um ataque de Dilacerar."]]],"secoesEn":[["Traços",["Legendary Resistance (3/Day, or 4/Day in Lair). If the dragon fails a saving throw, it can choose to succeed instead."]],["Ações",["Multiattack. The dragon makes three Rend attacks. It can replace one attack with a use of (A) Slowing Breath or (B) Spellcasting to cast Mind Spike (level 4 version).","Rend. Melee Attack Roll: +11, reach 10 ft. Hit: 17 (2d10 + 6) Slashing damage plus 4 (1d8) Acid damage.","Acid Breath (Recharge 5-6). Dexterity Saving Throw: DC 18, each creature in an 60-foot-long, 5-foot-wide Line. Failure: 54 (12d8) Acid damage. Success: Half damage.","Slowing Breath. Constitution Saving Throw: DC 18, each creature in a 60-foot Cone. Failure: The target can't take Reactions; its Speed is halved; and it can take either an action or a Bonus Action on its turn, not both. This effect lasts until the end of its next turn.","Spellcasting. The dragon casts one of the following spells, requiring no Material components and using Charisma as the spellcasting ability (spell save DC 17): At Will: Detect Magic, Mind Spike (level 4 version), Minor Illusion, Shapechange (Beast or Humanoid form only, no Temporary Hit Points gained from the spell, and no Concentration or Temporary Hit Points required to maintain the spell) 1/Day Each: Greater Restoration, Major Image"]],["Ações Lendárias",["Legendary Action Uses: 3 (4 in Lair). Immediately after another creature's turn, the dragon can expend a use to take one of the following actions. The dragon regains all expended uses at the start of each of its turns.","Giggling Magic. Charisma Saving Throw: DC 17, one creature the dragon can see within 90 feet. Failure: 24 (7d6) Psychic damage. Until the end of its next turn, the target rolls 1d6 whenever it makes an ability check or attack roll and subtracts the number rolled from the D20 Test. Failure or Success: The dragon can't take this action again until the start of its next turn.","Mind Jolt. The dragon uses Spellcasting to cast Mind Spike (level 4 version). The dragon can't take this action again until the start of its next turn.","Pounce. The dragon moves up to half its Speed, and it makes one Rend attack."]]]},"Ancient Copper Dragon":{"tipo":"Imenso Dragão (Metálico), Caótico e Bom","ca":"21","pv":"367 (21d20+147)","desl":"12 m, escalada 12 m, voo 24 m","ini":"+15 (25)","atr":[27,12,25,20,17,22],"info":[["Salvaguardas","Des +8, Sab +10"],["Perícias","Enganação +13, Percepção +17, Furtividade +8"],["Imunidades","Ácido"],["Sentidos","Percepção às Cegas 18 m, Visão no Escuro 36 m; Percepção passiva 27"],["Idiomas","Comum, Dracônico"]],"cr":"21","secoes":
